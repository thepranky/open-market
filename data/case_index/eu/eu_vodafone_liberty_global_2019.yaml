ai_summary: >
  The Commission cleared Vodafone's acquisition of Liberty Global's cable operations in
  Czech Republic, Germany, Hungary, and Romania on 18 July 2019 subject to conditions.
  The transaction created one of Europe's largest converged fixed-mobile telecoms operators.
  The principal concern arose in Germany, where Vodafone's mobile network and Liberty Global's
  Unitymedia cable network were the only two providers capable of offering premium bundled
  multi-play services across large parts of the country. Remedies required Vodafone to make
  wholesale network access available to rival virtual network operators, grant brand licences
  to new entrants, and offer bitstream access over Unitymedia's hybrid fibre-coaxial network.
