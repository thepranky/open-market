ai_summary: 'The Commission cleared Thales''s €4.8bn acquisition of Gemalto on 21
  February 2019 subject to conditions. Both parties were leading global suppliers
  of digital security products, including SIM cards, hardware security modules (HSMs),
  payment credentials, and identity management systems. The primary concern centred
  on general-purpose HSMs used by banks, central banks, and critical infrastructure
  operators, where the combined entity would hold a dominant position. Remedies required
  Thales to divest Gemalto''s HSM business (subsequently acquired by Entrust Datacard).
  The case is significant as an early example of cybersecurity and critical infrastructure
  protection driving merger remedies in the tech sector.

  '
