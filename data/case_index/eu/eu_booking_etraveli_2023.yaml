source_url: https://competition-cases.ec.europa.eu/cases/M.10596
ai_summary: >
  The Commission prohibited Booking.com's acquisition of eTraveli, a leading online flight
  booking agency, on 25 September 2023. This was the Commission's first prohibition grounded
  in an "ecosystem entrenchment" theory: the Commission found that adding eTraveli's flight
  traffic would significantly reinforce Booking.com's position as the unavoidable gateway
  for online accommodation by channelling flight-booking consumers into Booking's hotel
  ecosystem. The case extended EU merger control beyond conventional market-by-market overlap
  analysis to capture platform strategies that strengthen a gatekeeper's cross-market
  ecosystem dominance, signalling an important doctrinal shift ahead of Digital Markets Act
  enforcement.
