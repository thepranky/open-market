ai_summary: >
  The Commission cleared Telia Company's acquisition of Bonnier Broadcasting, the leading
  free-to-air and pay-TV broadcaster in Sweden and Finland, on 12 November 2019 subject to
  conditions. The transaction combined Sweden's dominant telecoms operator with the country's
  leading television broadcaster. Concerns focused on Telia's ability to foreclose rival TV
  distributors from access to Bonnier's popular channels and on Telia foreclosing rival content
  providers from access to Telia's TV distribution platform. Remedies required Telia to supply
  Bonnier channels on fair and non-discriminatory terms to competing distributors and to
  maintain open platform access. The case is illustrative of vertical integration concerns
  between telecoms infrastructure and premium content in Nordic media markets.
