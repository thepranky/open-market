ai_summary: 'The Commission cleared Lufthansa''s acquisition of a 41 per cent stake
  in ITA Airways, the successor carrier to Alitalia, on 4 July 2024 subject to conditions.
  The transaction was reviewed for its impact on overlapping short- and long-haul
  routes connecting Italy with Germany, Austria, Switzerland, and Belgium, where ITA
  and Lufthansa competed directly or through their respective codeshare networks.
  Remedies required Lufthansa to facilitate new entrant or expanding carrier operations
  by releasing slots at Rome Fiumicino and Milan Linate and to support rival carriers''
  route entry with transitional support measures. The case is notable for the Commission''s
  detailed remedies design in a flag-carrier consolidation involving a recently restructured
  airline.

  '
