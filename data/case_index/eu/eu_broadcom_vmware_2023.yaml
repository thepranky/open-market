case_id: eu_broadcom_vmware_2023
case_name: Broadcom / VMware
jurisdiction: EU
authority: European Commission
decision_date: "2023-07-12"
sector: tech
outcome: cleared_with_conditions
case_type: merger
source_url: https://competition-cases.ec.europa.eu/cases/M.10806
ai_summary: >
  The Commission cleared Broadcom's $61bn acquisition of VMware subject to conditions on
  12 July 2023. Concerns centred on Broadcom's ability to foreclose rival server hardware
  vendors and software suppliers by tying VMware's virtualisation stack to Broadcom's
  network adapters and storage controllers. Remedies required Broadcom to interoperate with
  and not discriminate against competing hardware vendors for a ten-year period.
