ai_summary: 'The Commission cleared Meta''s acquisition of Kustomer, a CRM software
  provider, subject to conditions on 27 January 2022. The case raised concerns about
  Meta leveraging WhatsApp data to foreclose rival CRM providers and about restricting
  Kustomer competitors'' access to the WhatsApp Business API. Remedies included interoperability
  and access commitments for third-party CRM vendors on the WhatsApp Business platform.

