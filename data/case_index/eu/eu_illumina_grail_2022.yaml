source_url: https://competition-cases.ec.europa.eu/cases/M.10188
ai_summary: >
  The Commission prohibited Illumina's acquisition of GRAIL on 6 September 2022 under
  jurisdiction asserted via Article 22 referrals from France and other member states, despite
  the deal not meeting EU turnover thresholds. Illumina closed the deal before the prohibition
  (gun-jumping), resulting in separate fines. In September 2023 the ECJ ruled that the
  Commission could not accept Art. 22 referrals from member states whose own national
  thresholds were not triggered, nullifying the Commission's jurisdiction; the prohibition
  was accordingly annulled. Illumina divested GRAIL in 2024.
