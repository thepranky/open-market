ai_summary: 'The Commission cleared Microsoft''s $69bn acquisition of Activision Blizzard
  on 15 May 2023 subject to conditions. Concerns focused on Microsoft''s ability and
  incentive to foreclose rival console and cloud gaming platforms from access to Activision''s
  key titles, principally Call of Duty. The remedy required Microsoft to license all
  Activision content—including Call of Duty—to rival cloud gaming services on equal
  terms for ten years, a first-of-its-kind global cloud gaming interoperability commitment.
  The EC cleared the deal at a time when the UK CMA had provisionally blocked it,
  illustrating divergent transatlantic outcomes on vertical foreclosure in digital
  platform markets.

  '
