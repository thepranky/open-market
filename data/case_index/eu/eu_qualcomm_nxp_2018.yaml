ai_summary: 'The Commission cleared Qualcomm''s $44bn acquisition of NXP Semiconductors
  on 18 January 2018 subject to conditions. The transaction would have combined Qualcomm''s
  leading mobile baseband chipsets with NXP''s dominance in automotive semiconductors,
  NFC controllers, and secure element chips used in contactless payments and transit
  cards. Concerns focused on foreclosing rival chip makers from the MIFARE contactless
  technology ecosystem and on bundling NXP''s NFC chips with Qualcomm''s mobile platforms.
  Remedies required perpetual licensing of MIFARE and non-discrimination commitments
  on NFC chip access. Despite EU clearance, the deal was abandoned on 26 July 2018
  when MOFCOM failed to approve by the HSR deadline, an early instance of Chinese
  regulatory leverage blocking a US semiconductor mega-deal.

  '
