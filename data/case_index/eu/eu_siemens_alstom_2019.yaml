ai_summary: 'The Commission prohibited the merger between Siemens and Alstom, Europe''s
  two largest rail manufacturers, on 6 February 2019. The proposed transaction would
  have merged the parties'' high-speed train and mainline signalling businesses. The
  Commission found that Siemens and Alstom were the two closest competitors for very
  high-speed trains and for European Train Control System (ETCS) signalling, and that
  the remedies offered—package deals for train and signalling contracts—were insufficient
  to maintain effective competition. The decision was politically contentious: the
  French and German governments argued the merger was necessary to create a "European
  champion" capable of competing with CRRC of China, but the Commission applied standard
  competition analysis and prohibited it.

  '
