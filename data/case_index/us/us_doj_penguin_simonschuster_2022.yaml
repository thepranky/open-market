ai_summary: >
  The DOJ filed suit in November 2021 to block Penguin Random House's $2.175bn acquisition
  of Simon & Schuster, arguing that the combination of the world's two largest English-language
  trade publishers would harm competition for the acquisition of top-selling books. Judge
  Florence Pan of the DC District Court ruled for the DOJ on 31 October 2022, finding that
  the relevant market was the purchase of "anticipated top-selling books" and that the merger
  would harm authors by reducing the number of competitive bidders for major book deals.
  Bertelsmann, PRH's parent, abandoned the transaction. The case was pivotal for defining
  the upstream input market—author advances and publisher bids for manuscripts—as the
  relevant competitive focus, marking a modern application of monopsony theory in media.
