ai_summary: >
  The FTC sought a preliminary injunction in the Northern District of California to block
  Microsoft's $69bn acquisition of Activision Blizzard, arguing Microsoft would withhold
  Call of Duty from Sony PlayStation and rival cloud gaming services. On 11 July 2023 Judge
  Corley denied the preliminary injunction, finding the FTC had not shown a likelihood of
  success on the merits. The FTC declined to continue its appeal; the deal closed on
  18 October 2023. Alongside the concurrent CMA inquiry, the case was the most significant
  cross-border gaming merger review of 2023.
