ai_summary: >
  The FTC challenged Illumina's acquisition of GRAIL, arguing Illumina—the dominant supplier
  of next-generation sequencing instruments—would have the incentive and ability to foreclose
  rival liquid biopsy test developers from access to sequencing technology. An FTC ALJ
  initially ruled in Illumina's favour, but the FTC Commissioners reversed and ordered
  divestiture. On 6 December 2023 the Fifth Circuit affirmed the FTC's divestiture order.
  Illumina announced GRAIL's divestiture in December 2023, and the sale to a third party was
  completed in 2024. The case is a landmark US vertical merger challenge in life sciences.
