ai_summary: >
  The DOJ filed suit in July 2016 to block Aetna's $37bn acquisition of Humana, arguing
  that the merger would substantially lessen competition in Medicare Advantage health plans
  in over 350 counties across the United States and in individual public health exchange plans
  in multiple metropolitan areas. Judge John Bates of the DC District Court ruled for the
  DOJ on 23 January 2017, finding that the parties were close competitors in Medicare Advantage
  and that Aetna's proposed divestitures were insufficient to remedy the harm. Aetna appealed
  unsuccessfully, and Humana terminated the merger. Decided alongside the concurrent Anthem/Cigna
  challenge, the two cases together halted an attempt by the four major US health insurers to
  consolidate to two, and set important precedents for geographic market definition in
  government-sponsored health plan markets.
