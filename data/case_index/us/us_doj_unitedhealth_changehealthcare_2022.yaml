ai_summary: >
  The DOJ, joined by Minnesota and New York, filed suit in February 2022 to block UnitedHealth
  Group's $13bn acquisition of Change Healthcare, the dominant processor of healthcare insurance
  claims in the United States. The DOJ argued the combination would give UnitedHealth—the
  largest US health insurer—access to competitively sensitive claims data submitted by rival
  insurers, and would foreclose competitors in the market for first-pass claims editing software
  where Change Healthcare's ClaimsXten product was dominant. Judge Carl Nichols of the DC
  District Court denied the DOJ's injunction on 20 September 2022, but required UnitedHealth to
  divest ClaimsXten to TPG Capital as a condition of approval. The merger closed in October 2022.
  The case is significant for its treatment of data-access foreclosure theory and the first major
  post-Illumina test of the DOJ's revived merger enforcement under Kanter.
