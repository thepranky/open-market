ai_summary: >
  The DOJ filed suit in August 2019 to block Sabre Corporation's $360m acquisition of
  Farelogix, arguing that Farelogix's NDC-based airline direct distribution technology was
  a nascent but significant threat to Sabre's dominant global distribution system (GDS)
  business. Judge Leonard Stark of the District of Delaware dismissed the complaint on
  7 April 2020, finding that the DOJ had not proven the relevant markets as pled and that
  Farelogix's technology did not directly compete with Sabre's core GDS offering at that time.
  In a striking divergence, the UK CMA simultaneously prohibited the same transaction in
  April 2020 under UK merger law, finding that Farelogix threatened Sabre's GDS business.
  The US outcome illustrates the difficulty of establishing nascent-competition theories
  where the target's product is functionally adjacent rather than directly competing.
