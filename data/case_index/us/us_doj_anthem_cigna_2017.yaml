ai_summary: >
  The DOJ filed suit in July 2016 to block Anthem's $54bn acquisition of Cigna, which would
  have created the largest US health insurer. The DOJ argued that the merger would lessen
  competition for commercial health insurance in the employer-sponsored market across dozens
  of metropolitan areas. Judge Amy Berman Jackson of the DC District Court ruled for the DOJ
  on 8 February 2017, finding a substantial likelihood of competitive harm in large national
  accounts and local employer-sponsored markets, rejecting Anthem's claimed synergy defence.
  Anthem's appeal was also rejected, and Cigna terminated the merger. Decided in tandem with
  the DOJ's separate successful challenge to Aetna/Humana, the case is one of the landmark
  healthcare insurance merger enforcement actions of the decade.
