ai_summary: >
  The CMA cleared Viagogo's $4.05bn acquisition of StubHub's international business on
  27 July 2021 subject to conditions. Viagogo and StubHub were the world's two leading online
  secondary ticketing platforms outside North America. The CMA's Phase 2 inquiry found that
  the combination would create an overwhelmingly dominant position in UK secondary ticketing,
  eliminating the primary competitive constraint that StubHub placed on Viagogo's pricing and
  seller fees. Remedies required Viagogo to divest StubHub's international operations outside
  North America, and to provide behavioural commitments on seller and buyer fee transparency.
  The case is a notable example of the CMA requiring partial divestiture in an already completed
  global acquisition and highlights competition concerns in the fast-growing digital secondary
  ticket resale market.
