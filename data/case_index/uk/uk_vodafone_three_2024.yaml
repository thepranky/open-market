ai_summary: >
  The CMA cleared Vodafone's merger with Three UK (CK Hutchison's UK mobile subsidiary) on
  19 December 2024 subject to legally binding commitments, reducing the number of UK mobile
  network operators from four to three. The Phase 2 inquiry found that the merger as originally
  proposed would substantially lessen competition in retail and wholesale mobile services.
  Remedies required the merged entity to maintain network investment commitments, offer
  wholesale access to virtual network operators on regulated terms, and protect pricing
  for certain consumer segments for a period of five years. The case is the most significant
  UK telecoms merger review of the decade and sets the framework for MNO consolidation policy
  in a market transitioning to 5G.
