ai_summary: >
  The CMA cleared Microsoft's $19.7bn acquisition of Nuance Communications on 13 April 2022
  at Phase 1 without conditions. Nuance is a leading provider of AI-powered speech recognition
  and clinical documentation software, particularly for healthcare providers in the US and UK.
  The CMA found that while Microsoft and Nuance overlapped in some enterprise software markets,
  the combination did not give rise to a substantial lessening of competition given the
  presence of strong rival suppliers and the complementary rather than competing nature of the
  parties' core products. The case is notable as one of the first major AI-healthcare
  acquisitions to receive Phase 1 clearance, contrasting with the CMA's later stricter approach
  to digital acquisitions.
