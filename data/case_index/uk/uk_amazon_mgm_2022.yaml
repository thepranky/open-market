ai_summary: >
  The CMA cleared Amazon's $8.45bn acquisition of MGM Holdings on 17 May 2022 after a Phase
  1 investigation. The CMA found no substantial lessening of competition in the supply of
  streaming services, video-on-demand content licensing, or production of original content,
  noting that MGM's library was licensed to multiple competing platforms and that Amazon
  would not have sufficient incentive or ability to withhold MGM content from rivals.
