ai_summary: >
  The CMA initially blocked Microsoft's $69bn acquisition of Activision Blizzard in April
  2023, citing concerns that Microsoft would withhold Call of Duty and other titles from
  rival cloud gaming platforms. After Microsoft restructured the transaction to exclude
  Activision's cloud streaming rights (licensed instead to Ubisoft), the CMA cleared the
  restructured deal on 13 October 2023. The case is a landmark example of a blocked merger
  being resurrected via structural deal redesign.
