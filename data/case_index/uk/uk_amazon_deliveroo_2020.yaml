ai_summary: >
  The CMA cleared Amazon's acquisition of a 16 per cent minority stake in Deliveroo on
  4 August 2020 following a Phase 2 inquiry. The CMA had initially found a realistic prospect
  of a substantial lessening of competition and opened a Phase 2 investigation in June 2019.
  However, the CMA accepted that the COVID-19 pandemic had materially changed Deliveroo's
  financial position, creating a genuine risk of business failure without the Amazon investment.
  Applying the "failing firm" defence, the CMA cleared the investment, finding that Amazon
  was the only credible investor and that Deliveroo's exit from the market would be worse for
  competition than the acquisition. The case is a rare successful application of the failing
  firm defence in a major digital markets inquiry, and illustrates how extraordinary economic
  events can shift the competitive counterfactual in an ongoing Phase 2 review.
