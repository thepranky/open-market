ai_summary: >
  Amazon announced the acquisition of iRobot, the maker of Roomba robot vacuum cleaners,
  in August 2022. The CMA opened a Phase 2 investigation in October 2023 amid concerns that
  Amazon would leverage iRobot's in-home mapping data and market position to strengthen its
  dominance in smart home platforms and voice-assistant-enabled device ecosystems. Amazon
  abandoned the transaction on 29 January 2024, citing an inability to obtain regulatory
  clearance in the EU—where the European Commission had issued a statement of objections in
  November 2023—and the CMA also announced it would not proceed further following the
  abandonment. The case illustrates how concurrent multi-jurisdiction reviews, particularly
  an EC objections phase, can precipitate deal collapse before any final UK determination.
