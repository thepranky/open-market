ai_summary: >
  Adobe announced a $20bn acquisition of Figma in September 2022. The CMA opened a Phase 2
  inquiry and in December 2023 issued a provisional decision finding the deal would eliminate
  Figma as the most significant competitive constraint on Adobe's creative design tools and
  stifle Adobe's incentive to develop its own competing design products. Adobe and Figma
  abandoned the transaction on 7 February 2024. The case illustrates dynamic-competition
  concerns about acquiring a nascent rival in adjacent markets.
