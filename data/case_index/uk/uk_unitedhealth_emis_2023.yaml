ai_summary: >
  The CMA cleared UnitedHealth Group's £1.24bn acquisition of EMIS Group, the leading
  supplier of clinical software to UK GP practices, on 14 March 2023 subject to conditions.
  The CMA's Phase 2 inquiry found that the merger raised concerns about UnitedHealth using
  EMIS's privileged access to GP clinical data and software infrastructure to foreclose rival
  population health management and medicines optimisation software providers. Remedies required
  UnitedHealth to maintain EMIS's open data access APIs on fair, reasonable, and non-discriminatory
  terms and to establish governance arrangements preventing EMIS's patient data from being
  used to advantage UnitedHealth's adjacent health analytics business. The case is the CMA's
  most detailed examination of data-driven vertical foreclosure in the UK health technology sector.
