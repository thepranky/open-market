    flagged; (7) all source_role_in_draft values are not_set, requiring review.'
- case_id: eu_sika_dry_mix_2019
  triage_status: needs_legal_review
  triage_rationale: Multiple product markets carry definition_status "defined" but the Commission's language
    consistently uses "should be considered as a separate product market for assessing the Transaction"
    — a working assumption formula that CompMap maps to "considered", not "defined". Additionally, sp_19
    is a mixed passage (geographic left-open language combined with an outcome sentence) that warrants
    reviewer attention, and the UK overlap mentioned in sp_21 context suggests a possible missing geographic
    market entry for structural reinforcing/strengthening in the United Kingdom.
