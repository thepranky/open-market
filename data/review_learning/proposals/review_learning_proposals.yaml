- case_id: eu_facebook_whatsapp_2014
  triage_status: needs_legal_review
  triage_rationale: 'Several passages require legal judgment: sp_4 and sp_11 contain pure or near-pure
    outcome/clearance language linked to market entries; sp_9 is a mixed left-open/outcome passage with
    a clearance rationale; the definition_status of pm_1 as "considered" is borderline given the Commission''s
