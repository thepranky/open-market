    linked_source_passages:
      - passage_id: sp_1
        source_document_id: eu_sika_dry_mix_decision
        page: "5"
        quote_snippet: >-
          In line with previous Commission decisions and considering the information provided by
          the Parties and the results of the market investigation, the Commission is of the view
          that construction dry premix mortar and tile-fixing dry premix mortar should be considered
          separate product markets for assessing the Transaction.
        extraction_method: pdf_extracted
        review_status: spot_checked
      - passage_id: sp_2
        source_document_id: eu_sika_dry_mix_decision
        page: "5"
        quote_snippet: >-
          The majority of respondents to the market investigation (customers and competitors)
          confirmed that the market for mortar should be divided according to (i) the place where
          the mortar is mixed (at factory or on the construction site), (ii) the physical form of
          the mortar (dry, wet or paste), and (iii) the final application of the mortar
          (construction, tile-fixing or façade).
        extraction_method: pdf_extracted
        review_status: spot_checked
    reviewer_notes: >-
      Both sp_1 and sp_2 confirm this as a distinct product market. sp_1 uses the
      Commission's working-assumption formula ("should be considered separate product
      markets for assessing the Transaction") — canonical maps to definition_status=defined
