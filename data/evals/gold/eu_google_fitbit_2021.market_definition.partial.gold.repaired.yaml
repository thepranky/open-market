product_markets_considered:
- name: Wrist-worn wearable devices
  market_type: product
  expected_definition_status: possible_segmentation
  expected_promotion_action: promote_with_uncertainty
  importance: core_assessed
  source_refs:
  - '25'
  - '26'
  linked_source_passages:
  - passage_id: sp_1
    source_document_id: eu_google_fitbit_decision
    page: '25'
    quote_snippet: >-
      In line with the Notifying Party's submission and the results of the market
      investigation, the Commission considers that wrist-worn wearables constitute
      a separate product market from other types of wearable devices.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_2
    source_document_id: eu_google_fitbit_decision
    page: '26'
    quote_snippet: >-
      In light of recitals (74) to (78), for the purpose of assessing the Transaction
      in this Decision, the Commission considers that the relevant product market
      is the market for wrist-worn wearable devices. The question whether the supply
      of wrist-worn wearable devices should be further segmented between (i) fitness
      trackers and smartwatches, (ii) fitness trackers and smartwatches with and without
      GPS connectivity, (iii) smartwatches with and without cellular connectivity
      and (iv) basic and full smartwatches can be left open in this Decision since
      the Parties do no overlap as regards wrist-worn wearable devices and any further
      segmentations would thus not change the outcome of the competitive assessment
      in the present case.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_3
    source_document_id: eu_google_fitbit_decision
    page: '26'
    quote_snippet: >-
      From a demand-side perspective, the majority of respondents indicated that users
      do not consider other wearable devices, in particular connected rings, earwear
      and eyewear, as substitutes for wrist-worn wearable devices, namely. smartwatches
      and fitness trackers.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  aliases:
  - Wearable fitness devices
  - Wrist-worn wearables
  reviewer_notes: >-
    Top-level market is defined; further segmentation is left open because the Parties
    do not overlap in wrist-worn wearable devices.
  reviewed: true
- name: Supply of licensable OSs for wrist-worn wearable devices
  market_type: product
  expected_definition_status: possible_segmentation
  expected_promotion_action: promote_with_uncertainty
  importance: core_assessed
  source_refs:
  - '29'
  linked_source_passages:
  - passage_id: sp_11
    source_document_id: eu_google_fitbit_decision
    page: '28'
    quote_snippet: >-
      The Notifying Party considers that the relevant product market for wearable
      OSs is separate from the market for OSs for other smart devices, such as smart
      mobile devices.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_12
    source_document_id: eu_google_fitbit_decision
    page: '28'
    quote_snippet: >-
      The Notifying Party submits that no further distinction is needed between OSs
      for fitness trackers and smartwatches.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_14
    source_document_id: eu_google_fitbit_decision
    page: '29'
    quote_snippet: >-
      From a demand-side perspective, it is not possible for an OEM to simply transfer
      an OS for PCs, smart TVs or smart mobile devices onto wearable devices. While
      it is possible and common to adapt OSs for smart mobile devices for use on wearable
      devices (for example iOS, Android OS), this requires a significant level of
      customisation.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  aliases:
  - Wearable OS / platforms
  - Wear OS market
  - Licensable wearable OSs
  reviewer_notes: >-
    Kept as a core assessed product market. The canonical market of interest is the
    wrist-worn wearable OS market; the smart mobile OS market may be relevant as context
    for vertical/conglomerate effects but is not separately gold-labelled here.
  reviewed: true
- name: Online search advertising services
  market_type: product
  expected_definition_status: possible_segmentation
  expected_promotion_action: promote_with_uncertainty
  importance: core_assessed
  source_refs:
  - '38'
  linked_source_passages:
  - passage_id: sp_40
    source_document_id: eu_google_fitbit_decision
    page: '38'
    quote_snippet: >-
      The market investigation confirms that the market for online advertising is
      separate from offline advertising. The majority of respondents does not consider
      the market for offline advertising services as an alternative to online search
      or display advertising.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_41
    source_document_id: eu_google_fitbit_decision
    page: '38'
    quote_snippet: >-
      The evidence in the Commission's file has not provided any indication that would
      suggest that it would be appropriate to depart from its previous practice of
      considering online search and non-search advertising as separate markets.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_42
    source_document_id: eu_google_fitbit_decision
    page: '39'
    quote_snippet: >-
      The Commission has also considered whether a segmentation according to the platform
      where the ad is delivered, namely desktop or mobile devices, may be appropriate.
      In particular, it cannot be excluded that building a mobile app or a website,
      on which the ads may be served or delivered, are very different processes. The
      question as to the relevance of the segmentation according to the platform where
      the ad is delivered can be left open, as it would not change the outcome of
      the competitive assessment in the present case.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  aliases:
  - Online advertising (general search advertising)
  - Online search advertising
  reviewer_notes: >-
    Product market identified by the Commission; platform segmentation is left open.
  reviewed: true
