  notes: >
    Derived from the promoted canonical record and corrected against the CMA remittal
    final report. The CMA found SLCs in UK display advertising services through
    horizontal unilateral effects/loss of dynamic competition, and in social media
    services worldwide including the UK through vertical input foreclosure. The supply
    of searchable GIF libraries was an upstream/input market, not a separate SLC market.
    Human reviewed.

