- name: Waterproofing – segmented by application type and technology (acrylic liquid
    membranes used under tiling; acrylic liquid membranes other applications; PU liquid
    membranes; epoxy liquid membranes; bitumen liquid; bitumen felts; PVC/TPO bonding
    sheets; other non-liquid membranes; PU injection resins; damp proofing injection;
    epoxy injection systems)
  market_type: product
  expected_definition_status: possible_segmentation
  expected_promotion_action: promote_with_uncertainty
  importance: core_assessed
  market_group: null
  linked_source_passages:
  - passage_id: sp_46
    source_document_id: eu_sika_mbcc_decision
    page: '29'
    quote_snippet: >-
      In its previous decisional practice108, the Commission considered waterproofing
      and assessed distinct markets along the following lines as narrowest plausible
      markets: acrylic liquid membranes (used under tiling), acrylic liquid membranes
      (other applications), PU liquid membranes, epoxy liquid membranes, bitumen (liquid),
      bitumen felts, PVC/TPO bonding sheets, other non-liquid membranes (foils, tapes,
      etc.), PU injection resins, damp proofing injection and epoxy injection systems.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_48
    source_document_id: eu_sika_mbcc_decision
    page: '29'
    quote_snippet: >-
      The Notifying Party proposes the following product groupings in case the Commission
      would consider in the future to delineate the product market by technology:
      • liquid-applied membranes, which include reactive coatings (i.e., PU, PUA and
      epoxy) and modified emulsion (i.e., acrylic and bitumen); • sheet membranes,
      which include bitumen membranes and polymeric membranes (i.e., TPO, PVC, HDPE
      including tapes, foil, gaskets, hoses and joints); and • injections (i.e., PU
      and epoxy).
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_49
    source_document_id: eu_sika_mbcc_decision
    page: '30'
    quote_snippet: >-
      Contrary to the Notifying Party's view and in line with considerations in previous
      Commission cases, the Commission's preliminary market investigation confirmed
      a distinction of the waterproofing markets by waterproofing application type
      and technology, namely as narrowest plausible markets: acrylic liquid membranes
      (used under tiling), acrylic liquid membranes (other applications), PU liquid
      membranes, epoxy liquid membranes, bitumen (liquid), bitumen felts, PVC/TPO
      bonding sheets, other non-liquid membranes (foils, tapes, etc.), PU injection
      resins, damp proofing injection and epoxy injection systems.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
