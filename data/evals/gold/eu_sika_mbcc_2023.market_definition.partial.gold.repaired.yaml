product_markets_considered:
- name: Adhesives
  market_type: product
  expected_definition_status: possible_segmentation
  expected_promotion_action: promote_with_uncertainty
  importance: possible_segmentation
  market_group: null
  linked_source_passages:
  - passage_id: sp_42
    source_document_id: eu_sika_mbcc_decision
    page: '27'
    quote_snippet: >-
      Adhesives are products specifically developed to hold or stick objects together.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_43
    source_document_id: eu_sika_mbcc_decision
    page: '27'
    quote_snippet: >-
      In previous decisions, the Commission considered a possible distinction between
      adhesives and sealants. The Commission categorised adhesives into three end-use
      groups, according to the target customer group, namely adhesives for consumers
      and DIY customers, adhesives for the construction sector and adhesives for industrial
      applications. As regards adhesives for industrial applications, the Commission
      considered further segmentations according to the specific application such
      as automotive, bookbinding, labelling, packaging and according to the adhesive
      technology, such as water-based technologies, solvent-based technologies, hot
      melts or reactive adhesives.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_44
    source_document_id: eu_sika_mbcc_decision
    page: '27'
    quote_snippet: >-
      The Notifying Party argues that the market of adhesives should not be sub-segmented
      based on the end-use group (i.e. DIY/consumers, construction, industrial). According
      to the Notifying Party, all customers have similar demands with respect to the
      technical properties and usage of particular adhesives. Also, suppliers tend
      to cater to all end-use groups.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  aliases: []
  alias_candidates: []
  gold_selection_reason: default_promotion_filter
  reviewer_notes: ''
