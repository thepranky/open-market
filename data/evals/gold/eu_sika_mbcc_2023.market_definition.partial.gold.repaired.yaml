- name: Concrete admixtures (narrower market)
  market_type: product
  expected_definition_status: defined
  expected_promotion_action: hold_pending_source_check
  importance: core_assessed
  market_group: null
  linked_source_passages:
  - passage_id: sp_4
    source_document_id: eu_sika_mbcc_decision
    page: '4'
    quote_snippet: >-
      Cement admixtures (often called 'grinding aids') are added to clinker cement
      to reduce the energy required to grind this material and produce cement powder
      of the desired finesse. Concrete and mortar admixtures are added to the mix
      of water, cement and aggregates to improve the workability and hardened properties
      of those materials. The vast majority of admixtures are used in concrete mixes.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_5
    source_document_id: eu_sika_mbcc_decision
    page: '10'
    quote_snippet: >-
      For the purpose of this Decision, the Commission considers as relevant product
      markets the overall market of chemical admixtures, as well as the narrower market
      of concrete admixtures.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_6
    source_document_id: eu_sika_mbcc_decision
    page: '10'
    quote_snippet: >-
      Since concrete admixtures used across residential and commercial construction
      segments appear to be in principle similar, the Commission will not consider
      separate markets based on those applications for the purpose of this Decision.
      However, since infrastructure and underground applications appear to require
      suppliers with a certain track-record, the Commission will take into account
      the Parties' and their competitors' market position for those specific applications
      when assessing their competitive strengths and differentiation.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  aliases:
  - Narrower market of concrete admixtures
  - Concrete admixtures
  alias_candidates: []
  gold_selection_reason: explicit_market_name
  reviewer_notes: >-
    Reviewed as a partial gold entry. Source passages validate and include the Commission's conclusion that the narrower market of concrete admixtures is a relevant product market for the purposes of the Decision.
  reviewed: true
geographic_markets_considered:
- name: Chemical admixtures / Concrete admixtures — national markets (EEA)
  market_type: geographic
  expected_definition_status: defined
  expected_promotion_action: hold_pending_source_check
  importance: core_assessed
  market_group: null
  linked_source_passages:
  - passage_id: sp_56
    source_document_id: eu_sika_mbcc_decision
    page: '10'
    quote_snippet: >-
      In its past decisions, the Commission left open whether the relevant geographic
      market for admixtures was EEA-wide or narrower. The Commission carried out its
      assessment based on the narrowest plausible geographic scope, i.e. national
      markets, as that was the most conservative approach.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_57
    source_document_id: eu_sika_mbcc_decision
    page: '10'
    quote_snippet: >-
      The Notifying Party submits that the markets for chemical admixtures have a
      national dimension and that a narrower delimitation based on local catchment
      areas is not appropriate. In particular, the Notifying Party notes that the
      average radii in which Sika and MBCC realise 80% of their sales are 410 km and
      379 km around their plants, respectively, and these catchment areas cover the
      majority if not the entirety of the country in which each plant is located.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_58
    source_document_id: eu_sika_mbcc_decision
    page: '12'
    quote_snippet: >-
      These reasons strongly indicate that the geographic markets of admixtures in
      the EEA are narrower than EEA-wide and no broader than national. The Commission
      therefore preliminarily concludes, for the purpose of this Decision, that in
      the EEA the markets for chemical admixtures (and for concrete admixtures) are
      national.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  aliases:
  - National markets for chemical admixtures
  - National markets for concrete admixtures
  - Chemical admixtures and concrete admixtures — national geographic markets
