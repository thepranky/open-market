    linked_source_passages:
      - passage_id: sp_11
        source_document_id: eu_daimler_geely_smart_decision
        page: '6'
        quote_snippet: >-
          In previous decisions, the Commission has ultimately left open whether the geographic
          scope of the markets for manufacturing and supply of passenger cars and LCVs is
          EEA-wide or national in scope.
        extraction_method: pdf_extracted
        review_status: unreviewed
    reviewer_notes: >-
      The Commission explicitly left open EEA-wide vs national scope for the manufacturing
      and supply market (para 19), consistent with prior cases. No affected geographic market
      arises at manufacturing level under any plausible definition (para 21).
      sp_6 is also linked to this market in the draft (it is the combined product+geographic
      left-open conclusion for pm_1/gm_1) but is omitted from gold passages due to mixed
      outcome language.
    reviewed: true

