_gold_metadata:
  case_id: eu_daimler_geely_smart_2020
  gold_status: canonical_derived
  partial: false
  review_required: false
  created_from: data/cases/eu/eu_daimler_geely_smart_2020.yaml
  notes: >
    Derived directly from the promoted canonical record.  All 3 product markets and 3
    geographic markets are fully reviewed.  This is a full-gold (partial: false) fixture:
    every draft market not in this list counts as a false positive.

    Key evaluation criteria:
    - Product markets: 3 markets, all definition_status=left_open.
        pm_1 (manufacturing and supply of passenger cars and LCVs): The Commission left
        open the product market definition in its entirety — including whether to segment
        by car segment (mini/small/…/SUV/MPV), whether BEV cars form a separate market,
        and whether to sub-segment by technology (BEV vs hybrid). The Transaction does not
        lead to any affected manufacturing market. No BEV-specific market should appear as
        a separate draft entry; "Battery electric vehicles", "Pure BEV cars", or similar
        entries are false positives — the Commission explicitly left this open.
        pm_2 (wholesale distribution of new passenger cars and LCVs): definition_status=
        left_open. Wholesale vs retail distinction is established precedent; further
        segmentation between passenger cars and LCVs, and by car type, were both left open.
        The only affected wholesale market is Sweden (driven by Volvo/Geely).
        pm_3 (retail distribution of new passenger cars and LCVs): definition_status=
        left_open. Retail distinction from wholesale is established. Further segmentation
        by LCV vs passenger car at retail level was left open. The only affected retail
        market is Sweden.
    - Geographic markets: 3 markets, all definition_status=left_open.
        gm_1 (manufacturing/supply — EEA-wide or national): left_open; no affected market.
        gm_2 (wholesale — EEA-wide or national; Sweden affected): left_open.
        gm_3 (retail — EEA-wide, national, or local; Sweden affected): left_open.
    - No separate BEV market: the Commission left open whether BEV cars constitute a
        separate product market and the Transaction does not create any BEV-specific
        affected market. A draft listing "BEV", "electric vehicles", or "battery electric
        vehicles" as a standalone product market entry is a false positive.
    - Theories of harm: none. This is a Phase I clearance with no serious doubts under any
        market definition. theories_of_harm: [] is correct; any theory entry is a false
        positive.
    - Mixed passages (sp_6, sp_9, sp_15): these contain the Commission's left-open
        conclusion formula alongside outcome/clearance language ("does not lead to affected
        markets", "does not give rise to serious doubts", "will not give rise to serious
        doubts"). They are legitimate commission_assessment passages and may validly support
        the relevant product/geographic market entries in the draft under mdr_002/mdr_010.
        They are omitted from gold linked_source_passages here to avoid clearance-language
        detection ambiguity in quote validation. Pure clearance-conclusion passages must
        NOT appear in supports_markets or supports_geographic_markets.
    - Note on sp_1 (page 4): the passage ends mid-sentence ("(ii) the wholesale of new
        passenger cars") because the text continues on page 5 as sp_2. Both are valid
        passages despite crossing a page boundary.

case_id: eu_daimler_geely_smart_2020
