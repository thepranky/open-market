    title: 'Case M.9360 – Daimler / Geely / Smart Brand JV: Commission Decision'
    case_page_url: https://competition-cases.ec.europa.eu/cases/M.9360
    pdf_url: https://ec.europa.eu/competition/mergers/cases/decisions/m9360_191_3.pdf
    doc_type: decision
    authority_reference: M.9360
