product_markets_considered:

  - name: Manufacturing and supply of passenger cars (and LCVs)
    market_type: product
    expected_definition_status: left_open
    expected_promotion_action: promote
    importance: assessed_no_overlap
    market_group: null
    aliases:
      - Manufacturing and supply of passenger cars and LCVs
      - Manufacturing and supply of new passenger cars
      - Manufacture and supply of passenger cars (and LCVs)
      - Manufacture and sale of new passenger cars
      - Market for manufacturing and supply of passenger cars
      - Manufacturing and supply of passenger cars
      - Passenger cars (manufacturing and supply)
    expected_draft_names:
      - Manufacturing and supply of passenger cars (and LCVs)
    linked_source_passages:
      - passage_id: sp_3
        source_document_id: eu_daimler_geely_smart_decision
        page: '5'
        quote_snippet: >-
          the Commission has in the past considered separate markets for the manufacturing
          and supply of passenger cars on the one hand, and of commercial vehicles on the
          other hand.
        extraction_method: pdf_extracted
        review_status: unreviewed
      - passage_id: sp_4
        source_document_id: eu_daimler_geely_smart_decision
        page: '5'
        quote_snippet: >-
          For passenger cars, the Commission's decisional practice has defined separate
          product markets for (i) mini cars, (ii) small cars, (iii) medium cars (iv) large
          cars, (v) executive cars, (vi) luxury cars (vii) sport cars, (viii) sport utility
          vehicles ("SUVs") and (ix) multipurpose vehicles.
        extraction_method: pdf_extracted
        review_status: unreviewed
      - passage_id: sp_5
        source_document_id: eu_daimler_geely_smart_decision
        page: '5'
        quote_snippet: >-
          the Commission left open whether electric cars constitute a separate product market
          and whether this possible market should be further segmented according to (i)
          technology (electric battery cars and hybrid cars) or (ii) the categories defined
          for vehicles with combustion engines.
        extraction_method: pdf_extracted
        review_status: unreviewed
    reviewer_notes: >-
      The Commission has in past practice defined separate product markets by car segment
      (mini, small, medium, large, executive, luxury, sport, SUV, MPV) and left open BEV
      sub-segmentation. For this Transaction the exact definition was left open because no
      affected manufacturing market arises under any plausible definition (para 21).
      sp_6 (page 6) is a mixed passage — it contains the standard left-open formula
      alongside outcome language ("does not lead to affected markets under any plausible
      product or geographic market definition"); it is a legitimate commission_assessment
      passage supporting pm_1/gm_1 in the draft, but is omitted from gold linked passages
      to avoid clearance-language detection ambiguity in quote validation.
      sp_5 establishes that the BEV sub-market question was explicitly left open:
      a draft that adds a separate BEV market entry is a false positive.
    reviewed: true

  - name: Wholesale distribution of new passenger cars and LCVs
    market_type: product
    expected_definition_status: left_open
    expected_promotion_action: promote
    importance: core_assessed
    market_group: null
    aliases:
      - Wholesale distribution of new passenger cars and LCVs
      - Wholesale distribution of passenger cars and LCVs
      - Wholesale distribution of new passenger cars
      - Wholesale of new passenger cars and LCVs
      - Wholesale distribution (passenger cars and LCVs)
    expected_draft_names:
      - Wholesale distribution of new passenger cars and LCVs
    linked_source_passages:
      - passage_id: sp_7
        source_document_id: eu_daimler_geely_smart_decision
        page: '6'
        quote_snippet: >-
          the Commission has distinguished between the wholesale and retail distribution of
          motor vehicles. The Commission has also considered whether the wholesale distribution
          market should be further segmented between passenger cars and LCVs, leaving this
          question open.
        extraction_method: pdf_extracted
        review_status: unreviewed
      - passage_id: sp_8
        source_document_id: eu_daimler_geely_smart_decision
        page: '6'
        quote_snippet: >-
          The Commission also concluded that a further segmentation would not be necessary
          by type of cars (e.g. mini cars, small cars, medium cars, etc.) because manufacturers
          normally distribute a model range which covers different market segments under the
          same distribution channel.
        extraction_method: pdf_extracted
        review_status: unreviewed
      - passage_id: sp_10
        source_document_id: eu_daimler_geely_smart_decision
        page: '6'
        quote_snippet: >-
          The only affected market, whether considered at EEA or national level is the market
          for wholesale distribution of new passenger cars and LCVs in Sweden.
        extraction_method: pdf_extracted
        review_status: unreviewed
    reviewer_notes: >-
      The Commission established wholesale vs retail as a precedent-backed distinction and
      left open further segmentation by vehicle type and by car segment. The only affected
      wholesale market is Sweden (driven by Volvo's strong national position).
      sp_9 (page 6) is a mixed passage — left-open formula + "does not give rise to serious
      doubts as to its compatibility with the internal market"; it is a legitimate
      commission_assessment passage supporting pm_2/gm_2 in the draft, but is omitted from
      gold linked passages to avoid clearance-language detection ambiguity.
      sp_10 is included: it identifies the affected wholesale market (Sweden) and is not
      pure clearance language — it names the market found to be affected, not a dismissal
      of competition concerns.
    reviewed: true

  - name: Retail distribution of new passenger cars and LCVs
    market_type: product
    expected_definition_status: left_open
    expected_promotion_action: promote
    importance: core_assessed
    market_group: null
    aliases:
      - Retail distribution of new passenger cars and LCVs
      - Retail distribution of passenger cars and LCVs
      - Retail distribution of new passenger cars
      - Retail sale of new passenger cars and LCVs
      - Retail distribution (passenger cars and LCVs)
    expected_draft_names:
      - Retail distribution of new passenger cars and LCVs
    linked_source_passages:
      - passage_id: sp_13
        source_document_id: eu_daimler_geely_smart_decision
        page: '7'
        quote_snippet: >-
          At retail level, vehicles are sold to final customers via independent or vertically
          integrated retailers ("dealers").
        extraction_method: pdf_extracted
        review_status: unreviewed
    reviewer_notes: >-
      The Commission distinguished retail from wholesale distribution and left open further
      segmentation by LCV vs passenger car at retail level. The only affected retail market
      is Sweden (para 35).
      sp_13 (page 7, para 29) is truncated to the first sentence only in gold linked
      passages: the full passage contains an inline footnote "14" between "decisions," and
      "the Commission" which breaks strict substring matching in the gold quote validator
      (validate_gold_quotes.py uses substring match, not fragment search). The full sp_13
      quote is verbatim and passes check_source_integrity.py's fragment search; it may
      validly appear in the draft's source_passages supporting pm_3.
      sp_15 (page 7) is a mixed passage — it combines the standard left-open conclusion
      ("will not give rise to serious doubts") with the identification of the affected
      market in Sweden; it is a legitimate commission_assessment passage supporting pm_3/gm_3
      in the draft, but is omitted from gold linked passages to avoid clearance-language
      detection ambiguity.
    reviewed: true

geographic_markets_considered:

  - name: Manufacturing and supply of passenger cars — EEA-wide or national (left open)
    market_type: geographic
    expected_definition_status: left_open
    expected_promotion_action: promote
