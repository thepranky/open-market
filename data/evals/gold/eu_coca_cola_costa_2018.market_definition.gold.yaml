_gold_metadata:
  case_id: eu_coca_cola_costa_2018
  gold_status: canonical_derived
  partial: false
  review_required: false
  created_from: data/cases/eu/eu_coca_cola_costa_2018.yaml
  notes: >
    Derived directly from the promoted canonical record.  All 7 product markets and 6
    geographic markets are fully reviewed.  This is a full-gold (partial: false) fixture:
    every draft market not in this list counts as a false positive.

    Key evaluation criteria:
    - Product markets: 7 markets with definition_status values of left_open (pm_1–4)
      and considered (pm_6–8).  Note: the market IDs jump from pm_4 to pm_6 — there is
      no pm_5 in this case.
    - Geographic markets: gm_1 is defined (national NABs — confirmed by market
      investigation and consistent Commission precedent); gm_2–3 are left_open;
      gm_4–6 (UK, Ireland, Poland) are considered (used as geographic assessment units
      for vertical and conglomerate theories).
    - Outcome passages (sp_27, sp_29, sp_31) must NOT appear in supports_markets or
      supports_geographic_markets — they are pure "no SIEC" conclusion passages.
    - Mixed left-open + outcome passages (sp_2, sp_7, sp_10, sp_14) contain
      "does not give rise to serious doubts" language alongside the market definition
      conclusion; they may legitimately appear in supports_markets.
    - Theories of harm (th_1–4) are recorded in the canonical but are informational;
      the eval focuses on market definition accuracy.

case_id: eu_coca_cola_costa_2018
