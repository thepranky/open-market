        source_document_id: eu_coca_cola_costa_decision
        page: '10'
        quote_snippet: >-
          The Commission has consistently found that the geographic scope of the supply of
          NABs is national due to, inter alia, differences in consumption patterns, logistics
          and distribution networks and marketing strategies.
        extraction_method: pdf_extracted
        review_status: unreviewed
      - passage_id: sp_34
        source_document_id: eu_coca_cola_costa_decision
        page: '11'
        quote_snippet: >-
          Based on the above, the Commission will conduct its assessment of the markets for
          NABs on a national basis.
        extraction_method: pdf_extracted
        review_status: unreviewed
    reviewer_notes: >-
      The Commission affirmatively concludes national scope — confirmed by prior precedents
      and market investigation. Canonical maps to definition_status=defined (binding
      Commission decision, not a "left open" or "for the purpose of this decision" hedge).
    reviewed: true

