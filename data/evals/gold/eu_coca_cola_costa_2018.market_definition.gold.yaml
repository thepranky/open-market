product_markets_considered:

  - name: Supply of non-alcoholic ready-to-drink commercial beverages (NABs)
    market_type: product
    expected_definition_status: left_open
    expected_promotion_action: promote
    importance: core_assessed
    market_group: null
    aliases:
      - Non-alcoholic ready-to-drink beverages (NABs)
      - Non-alcoholic beverages (NABs)
      - NABs
      - Carbonated soft drinks (CSDs) and non-alcoholic beverages
    expected_draft_names:
      - Supply of non-alcoholic ready-to-drink commercial beverages (NABs)
    linked_source_passages:
      - passage_id: sp_1
        source_document_id: eu_coca_cola_costa_decision
        page: '6'
        quote_snippet: >-
          In its past decisional practice the Commission also indicated that NCSDs could be
          segmented into packaged water, fruit juices, ready-to-drink teas and energy and
          sports drinks, although ultimately left the question on such segmentation open.
        extraction_method: pdf_extracted
        review_status: unreviewed
      - passage_id: sp_3
        source_document_id: eu_coca_cola_costa_decision
        page: '8'
        quote_snippet: >-
          Previous Commission's decisions considered separate product markets according to
          the distribution channel of NABs distinguishing between the off-premises (retail)
          and the on-premises consumption market
        extraction_method: pdf_extracted
        review_status: unreviewed
      - passage_id: sp_4
        source_document_id: eu_coca_cola_costa_decision
        page: '8'
        quote_snippet: >-
          Therefore, the Commission considers that the effects of the Transaction should be
          assessed on the two separate product markets
        extraction_method: pdf_extracted
        review_status: unreviewed
    reviewer_notes: >-
      Left open under all plausible segmentations. sp_1 trimmed: PDF hyphenates
      "non-\ncarbonated" (normaliser joins to "noncarbonated") and inserts footnote
      numbers .16 and .17 mid-text; quote uses only the clean tail sentence. sp_3
      trimmed: PDF has no space before "HoReCa" quote and footnote .19 at end; stops
      at "consumption market". sp_4 trimmed: PDF inserts footnote .20 between sentences
      and hyphenates "off-\npremises channel"; starts from "Therefore" and stops before
      "off-premises". sp_2 omitted: mixed left-open/outcome passage.
    reviewed: true

