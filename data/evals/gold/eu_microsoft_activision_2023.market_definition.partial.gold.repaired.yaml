- name: PC and console video game distribution (overall market)
  market_type: product
  expected_definition_status: possible_segmentation
  expected_promotion_action: promote_with_uncertainty
  importance: core_assessed
  market_group: null
  linked_source_passages:
  - passage_id: sp_15
    source_document_id: eu_microsoft_activision_decision
    page: '25'
    quote_snippet: >-
      In Microsoft/ZeniMax83, the Commission considered whether the market for video
      game distribution should be segmented according to physical vs. digital distribution.
      Further, in relation to digital distribution, the Commission considered whether
      segmentations were appropriate by: (i) gaming platforms (PC, console and mobile);
      (ii) payment model (upfront payment vs. subscription); and (iii) type of access
      to games (download vs. streaming). The Commission left open the product market
      definition as regards physical vs. digital distribution and a possible segmentation
      by gaming platforms, whereas it found that a segmentation by payment model and
      type of access was not warranted.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_16
    source_document_id: eu_microsoft_activision_decision
    page: '26'
    quote_snippet: >-
      From the demand-side, the majority of respondents to the market investigation
      that expressed a view on this subject submitted that, based on technical features,
      pricing, storage, and accessibility, physical and digital video game distribution
      are interchangeable for gamers.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_17
    source_document_id: eu_microsoft_activision_decision
    page: '26'
    quote_snippet: >-
      for the purposes of this Decision, the Commission concludes that the relevant
      market is an overall market for game distribution and that this market should
      not be segmented between physical and digital distribution.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
