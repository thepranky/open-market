  importance: core_assessed
  market_group: null
  linked_source_passages:
  - passage_id: sp_1
    source_document_id: eu_microsoft_activision_decision
    page: '15'
    quote_snippet: >-
      In Microsoft/ZeniMax, the Commission considered potential segmentations of the
      market for video game publishing and development on the basis of: (i) gaming
      platforms (i.e., PC games, console games and mobile games); (ii) game genres
      (e.g., strategy, simulation, action, adventure, role-playing etc.); or (iii)
      type of games (e.g., premium or "AAA" games, casual games). The Commission left
      the precise market definition open.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_4
    source_document_id: eu_microsoft_activision_decision
    page: '16'
    quote_snippet: >-
      The Notifying Party considers that it is not warranted to segment the game publishing
      market based on genre or type of games.
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
  - passage_id: sp_7
    source_document_id: eu_microsoft_activision_decision
    page: '20'
    quote_snippet: >-
      The Phase I market investigation provided mixed results with regard to a possible
      segmentation of the video game publishing product market by genre (action and
      adventure, shooter/battle royale, role-playing games, sports, racing, fighting,
      and strategy).
    extraction_method: pdf_extracted
    review_status: unreviewed
    source_summary: ''
