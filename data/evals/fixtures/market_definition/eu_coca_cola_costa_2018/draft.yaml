theories_of_harm:
- theory_id: th_1
  name: Vertical foreclosure — NABs upstream / coffee shops downstream
  description: >
    TCCC's upstream position in the supply of NABs and CSDs for on-premises consumption
    could be leveraged to foreclose rivals in Costa's downstream market for coffee
    shops (informal restaurants) in the UK, Ireland and Poland. The Commission assessed
    vertically affected markets between TCCC's upstream CSD/NAB supply (pm_6) and
    Costa's downstream coffee-shop operations (pm_2). No serious doubts found.
- theory_id: th_2
  name: Conglomerate effects — NABs on-premise / Costa out-of-home coffee
  description: >
    TCCC's position in NABs/Coca-Cola for on-premises/out-of-home consumption in the
    UK and Ireland could be leveraged to foreclose competitors in the market for
    manufacture and sale of coffee and other ingredients in the out-of-home channel
    (pm_4). No serious doubts found.
- theory_id: th_3
  name: Conglomerate effects — NABs off-premise / Costa in-home R&G and Tassimo
  description: >
    TCCC's position in NABs/Coca-Cola off-premises/retail in the UK and Ireland could
    be leveraged to foreclose competitors in the market for manufacture and sale of
    R&G coffee and Tassimo discs in the in-home channel (pm_4). No serious doubts
    found.
- theory_id: th_4
  name: Conglomerate effects — cold drinks vending / Costa Express
  description: >
    TCCC's position in cold drinks vending services (pm_8) in the UK, Ireland and
    Poland could be leveraged to foreclose competitors in vending services (pm_3),
    particularly through the Costa Express machine segment. No serious doubts found.
