- market_id: pm_2
  name: Operation of coffee shops / informal restaurants
  definition_status: left_open
  notes: >
    Commission has not previously defined a relevant product market for coffee shops
    specifically; prior cases indicated coffee shops are part of a market for informal
    restaurants. Possible narrower segmentation into branded coffee shops. Market
    investigation provided some indications coffee shops compete with informal restaurants
    but was less conclusive on branded vs unbranded. Left open for the purposes of this
    decision. Also assessed as the downstream market in the vertical effects analysis
    (Section 5.3): Costa's branded coffee shops had [30-40]% share by store numbers in
    UK (2017), [10-20]% in Ireland and Poland; including independent coffee shops would
    sizably reduce Costa's share. Countries assessed: UK, Ireland, Poland.
  verification:
    status: source_linked
  market_importance: core_assessed
- market_id: pm_3
  name: Provision of vending services (vending machines)
  definition_status: left_open
  notes: >
    Commission previously left open whether market should be segmented by type of
    food dispensed (hot beverages, cold drinks, snacks/food). Market investigation
    confirmed prior description but was not definitive on segmentation by beverage/food
    type or by machine type. Left open for the purposes of this decision; strictest
    definition is vending services for hot beverages only. Also assessed as the downstream
    market in the conglomerate vending theory (th_4): Costa Express machines and TCCC's
    existing Chaqwa hot-beverage vending machines were assessed; Chaqwa had less than
    [0-5]% share in Germany and similarly low shares elsewhere. Countries: UK, Ireland,
    Poland.
  verification:
    status: source_linked
  market_importance: core_assessed
- market_id: pm_4
  name: Manufacture and sale of coffee and other ingredients
  definition_status: left_open
  notes: >
    Commission considered in-home and out-of-home as separate product markets. In-home
    channel further segmented into: (i) instant coffee, (ii) R&G coffee, (iii) filter
    pads, (iv) Nespresso compatible capsules, (v) other espresso capsules, (vi) multi-drink
    capsules. Possible further segmentation of R&G coffee in-home and whole coffee
    beans left open. Left open for the purposes of this decision; strictest plausible
    definitions are out-of-home channel only; R&G coffee only and Tassimo discs only
    in the in-home channel. The out-of-home sub-market was assessed in the conglomerate
    theory regarding TCCC NABs on-premise and Costa PtS products (th_2). The in-home
    R&G/Tassimo sub-market was assessed in the conglomerate theory regarding TCCC NABs
    off-premise and Costa R&G/Tassimo discs (th_3). Countries: UK and Ireland for both
    conglomerate theories.
