  page: '6'
  quote_snippet: In previous decisions, the Commission has considered that, within
    NABs, carbonated soft drinks ("CSDs") constitute a separate market from non-carbonated
    soft drinks (NCSDs). In particular, the Commission has previously considered a
    narrower market segmentation for cola-flavoured CSDs. In its past decisional practice
    the Commission also indicated that NCSDs could be segmented into packaged water,
    fruit juices, ready-to-drink teas and energy and sports drinks, although ultimately
    left the question on such segmentation open.
  extraction_method: pdf_extracted
