product_markets_considered:
- market_id: pm_1
  name: Manufacturing and supply of passenger cars (and LCVs)
  definition_status: left_open
  notes: >
    The Commission left open the exact product market definition. Its decisional practice
    has defined separate product markets by segment (mini, small, medium, large, executive,
    luxury, sport, SUV, MPV) and further left open whether electric/BEV cars form a
    separate market, with potential sub-segmentation by technology (BEV vs hybrid) or by
    the ICE-based segment categories. For LCVs the Commission left open sub-segmentation
    into vehicles up to 3.5 t and between 3.5–6 t. The Transaction does not lead to
    affected markets under any plausible product or geographic market definition (para 21).
    The JV's Target Vehicles fall in the mini/A-segment and small/B-segment and are pure BEV.
  verification:
    status: source_linked
  market_importance: assessed_no_overlap

- market_id: pm_2
  name: Wholesale distribution of new passenger cars and LCVs
  definition_status: left_open
  notes: >
    The Commission distinguished wholesale from retail distribution of motor vehicles.
    It left open whether to further segment wholesale between passenger cars and LCVs,
    and concluded no further segmentation by car type is needed (manufacturers distribute
    a full model range under the same channel). The Commission left open the exact product
    and geographic market definition; the Transaction does not give rise to serious doubts
    under any alternative definition (para 27). The only affected market at wholesale level
    is wholesale of new passenger cars in Sweden, driven by Volvo's strong position
    (Volvo belonging to Geely).
  verification:
    status: source_linked
  market_importance: core_assessed

- market_id: pm_3
  name: Retail distribution of new passenger cars and LCVs
  definition_status: left_open
  notes: >
    At retail level, vehicles are sold to final customers via independent or integrated
    dealers. The Commission considered a further distinction between passenger cars and
    LCVs at retail level, leaving this question open. It also concluded no further
    segmentation by car type is needed. The Commission left open the exact product and
    geographic market definition; the Transaction will not give rise to serious doubts
    under any alternative definition (para 34). The only affected market at retail level
    is retail distribution of new passenger cars and LCVs in Sweden.
  verification:
    status: source_linked
  market_importance: core_assessed

geographic_markets_considered:
- market_id: gm_1
  name: Manufacturing and supply of passenger cars — EEA-wide or national (left open)
  definition_status: left_open
  notes: >
    In previous decisions the Commission left open whether the geographic scope of the
    market for manufacturing and supply of passenger cars and LCVs is EEA-wide or national.
    The same question was left open for this Transaction (para 19–21). The Transaction
    does not lead to affected markets under any plausible geographic definition.

- market_id: gm_2
  name: Wholesale distribution of new passenger cars — EEA-wide or national (left open); Sweden affected
  definition_status: left_open
  notes: >
    The Commission considered in previous decisions that wholesale distribution could be
    EEA-wide or national in scope, and left this open (para 25). Under either geographic
    scope, the only affected market is wholesale distribution of new passenger cars in
    Sweden, driven by Volvo's strong national position (para 28).

- market_id: gm_3
  name: Retail distribution of new passenger cars — EEA-wide, national, or local (left open); Sweden affected
  definition_status: left_open
  notes: >
    The Commission left open whether the retail distribution market is EEA-wide, national
    or local in scope (para 32). Under any geographic scope, the only affected market is
    retail distribution of new passenger cars and LCVs in Sweden (para 35). The Commission
    noted that national market shares are a good proxy for local strength (para 43).

