product_markets_considered:
- market_id: pm_1
  name: Deep-sea container terminal services overall
  definition_status: considered
  notes: The Commission considered this overall market for deep-sea container terminal services,
    which is then further segmented into hinterland and transhipment traffic.
- market_id: pm_2
  name: Deep-sea container terminal services for hinterland traffic
  definition_status: considered
  notes: This market is a sub-segment of deep-sea container terminal services. The distinction
    between hinterland traffic and transhipment traffic was considered but ultimately left open
    as a definitive conclusion in prior decisional practice.
- market_id: pm_3
  name: Deep-sea container terminal services for transhipment traffic
  definition_status: considered
  notes: This market is a sub-segment of deep-sea container terminal services. The distinction
    between hinterland traffic and transhipment traffic was considered but ultimately left open
    as a definitive conclusion in prior decisional practice.
- market_id: pm_4
  name: Short-sea container terminal services
  definition_status: considered
  notes: The Commission's prior decisional practice distinguished short-sea container terminal
    services from deep-sea container terminal services.
- market_id: pm_5
  name: Ancillary services to container terminal services (storage, leasing, repair and maintenance
    of containers)
  definition_status: left_open
  notes: The Commission considered but ultimately left open whether there is a separate market
    for these ancillary services.
- market_id: pm_6
  name: Deep-sea container liner shipping services
  definition_status: defined
  notes: The Commission's prior practice, which was upheld, defines this market as involving
    regular, scheduled services for the sea carriage of containerised cargo, distinguished from
    non-liner shipping, non-containerised transport (like bulk vessel), short-sea, and Ro-Ro
    shipping. However, for the purpose of this Transaction, it was not necessary to reach a
    definitive conclusion.
- market_id: pm_7
  name: Short-sea container liner shipping services
  definition_status: defined
  notes: The Commission concluded, in line with its previous practice, that short-sea container
    shipping services should be distinguished from non-containerised shipping, such as bulk
    shipping. Segmentation regarding wheeled cargo and refrigerated/non-refrigerated container
    shipping services was left open.
- market_id: pm_8
  name: Inland transportation services
  definition_status: left_open
  notes: The Commission considered that various means of inland transportation (rail, truck,
    barge) may constitute separate product markets, but ultimately left the market definition
    open. The overlap between parties primarily concerned rail transportation services.
- market_id: pm_9
  name: Rail transportation services
  definition_status: considered
  notes: The Commission conducted its assessment focusing on rail transportation services as
    the primary segment of inland transportation where parties' activities overlap. The overall
    product market definition for inland transportation (including its segmentation) was left
    open.
- market_id: pm_10
  name: Truck transportation services
  definition_status: considered
  notes: Considered as a segment of inland transportation. MSC has very low market shares and
    HHLA's activity is negligible, so these activities do not give rise to any affected markets.
- market_id: pm_11
  name: Barge transportation services
  definition_status: considered
  notes: Considered as a segment of inland transportation. MSC has limited activities and HHLA
    is not active in this segment, so these activities do not give rise to any affected markets.
geographic_markets_considered:
- market_id: gm_1
  name: Deep-sea container terminal services overall — Le Havre-Gdańsk range (EEA affected)
  definition_status: left_open
  notes: The Commission assessed the effects based on this geographic scope, which encompasses
    the entire Northern range of ports. However, the precise geographic market definition was
    left open as no serious doubts arose under any plausible definition.
- market_id: gm_2
  name: Deep-sea container terminal services overall — Antwerp-Hamburg range (EEA affected)
  definition_status: left_open
  notes: The Commission assessed the effects based on this narrower geographic scope for the
    Northern range, which was considered for both transhipment and hinterland traffic. However,
    the precise geographic market definition was left open as no serious doubts arose under
    any plausible definition.
- market_id: gm_3
  name: Deep-sea container terminal services overall — German ports for hinterland traffic (Germany
    affected)
  definition_status: left_open
  notes: The Commission assessed the effects based on this narrowest geographic scope for the
    Northern range, specifically for hinterland traffic to/from German ports. However, the precise
    geographic market definition was left open as no serious doubts arose under any plausible
    definition.
- market_id: gm_4
  name: Deep-sea container terminal services — Trieste-Koper-Rijeka range of ports (Adriatic
    affected)
  definition_status: considered
  notes: The Commission considered that the geographic market definition for deep-sea container
    terminal services in the Adriatic range is not narrower than this range of ports, which
    serve similar hinterland catchment areas and are generally substitutable for hinterland
    and transhipment traffic.
- market_id: gm_5
  name: Deep-sea container terminal services — national (Estonia affected)
  definition_status: left_open
  notes: The Commission considered that the port of Tallinn (Estonia) primarily serves its national
    hinterland. However, the precise geographic market definition for the Baltic range was left
    open as no serious doubts arose.
- market_id: gm_6
  name: Deep-sea container terminal services — national (Latvia affected)
  definition_status: left_open
  notes: The Commission considered that the port of Riga (Latvia) primarily serves its national
    hinterland. However, the precise geographic market definition for the Baltic range was left
    open as no serious doubts arose.
- market_id: gm_7
  name: Deep-sea container terminal services — national (Lithuania affected)
  definition_status: left_open
  notes: The Commission considered that the port of Klaipeda (Lithuania) primarily serves its
    national hinterland. However, the precise geographic market definition for the Baltic range
    was left open as no serious doubts arose.
- market_id: gm_8
  name: Deep-sea container liner shipping services — individual legs of trade (worldwide affected)
  definition_status: left_open
  notes: Based on its most recent practice, the Commission considered deep-sea container liner
    shipping services to be geographically defined on the basis of individual legs of trade.
    However, for the purpose of this Transaction, it was not necessary to precisely define the
    geographic market as no serious doubts arose.
- market_id: gm_9
  name: Short-sea container liner shipping services — single trades or corridors / single legs
    of trade (intra-continental affected)
  definition_status: left_open
  notes: The Commission considered that the relevant geographic market for short-sea container
    liner shipping services should be defined on the basis of single trades or corridors, or
    single legs of trade. However, it was not necessary to precisely define the geographic market
    as no serious doubts arose.
- market_id: gm_10
  name: Inland transportation services — national or wider (EEA affected)
  definition_status: left_open
  notes: The Commission considered that the geographic market for inland transportation services
    may be national or wider, potentially EEA-wide, but ultimately left the definition open
    as no serious doubts arose.
- market_id: gm_11
  name: Rail transportation services — national (Germany affected)
  definition_status: left_open
  notes: The Commission focused its assessment on the national level for rail inland transportation
    services where the parties' activities overlap. However, the exact geographic market definition
    was left open due to the absence of serious doubts.
