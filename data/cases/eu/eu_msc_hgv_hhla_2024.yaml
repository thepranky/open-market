- passage_id: sp_37
  source_document_id: eu_msc_hgv_hhla_2024_decision
  page: '10'
  quote_snippet: The Commission considers that, in light of the evidence gathered during the
    market investigation, there is no reason to depart from its previous practice that there
    is a separate market for deep-sea container liner shipping services, which is geographically
    defined on the basis of the individual legs of trade. However, it is not necessary to precisely
    define the geographic market as the Transaction does not raise serious doubts as to its
    compatibility with the internal market under any plausible market definition, including
    the narrowest definition according to individual legs of trade.
  extraction_method: pdf_extracted
