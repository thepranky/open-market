  quote_snippet: The Commission previously considered the market for cake products separately
    from those of other snacking products.6 In past decisions, the Commission also considered
    the possibility of sub-segmenting the market for cake products into the markets for (i)
    cakes, mini cakes and other pastries produced by craft pastries and industrial producers,
    and (ii) morning goods, which include bagels, croissants, scones and similar products that
    are normally eaten for breakfast, but it ultimately left open whether those sub-segments
    belong to separate product markets.
  extraction_method: pdf_extracted
