product_markets_considered:
- market_id: pm_1
  name: Cake products
  definition_status: considered
  notes: The Commission previously considered the market for cake products separately from those
    of other snacking products. It also considered sub-segmenting this into cakes/mini cakes
    and morning goods, but left the sub-segmentation open in past decisions.
- market_id: pm_2
  name: Cakes
  definition_status: considered
  notes: The Commission considers that cakes may belong to a product market separate from morning
    goods, without a need for further sub-segmentation within cakes. However, the exact market
    delineation was left open for general purposes. For the purposes of this Decision, the Commission
    conducted its assessment separately for the cake segment.
- market_id: pm_3
  name: Morning goods
  definition_status: considered
  notes: The Commission considers that morning goods may belong to a product market separate
    from cakes, without a need for further sub-segmentation within morning goods. However, the
    exact market delineation was left open for general purposes. For the purposes of this Decision,
    the Commission conducted its assessment separately for the morning goods segment.
- market_id: pm_4
  name: Sweet biscuits
  definition_status: considered
  notes: The Commission's market investigation suggests that sweet biscuits belong to a product
    market separate from other snacking products and other types of biscuits. However, the exact
    market delineation was left open for general purposes. For the purposes of this Decision,
    the Commission conducted its assessment separately for the sweet biscuits segment.
- market_id: pm_5
  name: Sweet spreadable products
  definition_status: defined
  notes: The Commission defines sweet spreadable products and savoury spreadable products as
    two separate product markets based on differences in consumption patterns and habits. However,
    whether chocolate spreadable products constitute a separate sub-market was left open for
    general purposes, though assessed separately for this Decision.
- market_id: pm_6
  name: Chocolate spreadable products
  definition_status: considered
  notes: The market investigation was inconclusive as to whether chocolate spreadable products
    constitute a product market separate from other sweet spreadable products. While the exact
    market delineation was left open for general purposes, for the purposes of this Decision,
    the Commission conducted its assessment separately for the chocolate spreadable products
    segment.
- market_id: pm_7
  name: Savoury snacks
  definition_status: considered
  notes: The Commission considers that savoury snacks may belong to a product market separate
    from other snacks, supported by market investigation and previous practice. However, the
    question of whether savoury snacks are a separate market from other types of snacks was
    left open for general purposes. For the purposes of this Decision, the Commission conducted
    its assessment separately for the savoury snacks segment.
- market_id: pm_8
  name: Branded and private label products
  definition_status: left_open
  notes: The Commission previously considered a distinction between branded and private label
    products but left the market definition open. Market investigation results were mixed, with
    some respondents seeing substitutability and others not. The question of differentiation
    between branded and private label products was left open.
- market_id: pm_9
  name: Sale channels (retailers vs food service)
  definition_status: left_open
  notes: The Commission previously found a distinction by sale channels to be warranted, as
    conditions of competition differ between sales to retailers and the food service sector.
    Market investigation supported this distinction. However, whether such a distinction was
    warranted for the purposes of this Decision was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Bakery products — national
  definition_status: considered
  notes: In previous cases, the Commission considered the relevant geographic market for bakery
    products to be national in scope.
- market_id: gm_2
  name: Sweet spreadable products — national
  definition_status: considered
  notes: The Commission previously considered the relevant geographic market of sweet spreadable
    products as national in scope.
- market_id: gm_3
  name: Cakes — national
  definition_status: considered
  notes: The Commission's market investigation indicates that the market for cakes is national
    in scope, aligning with its past practice. The Commission will assess the potential effects
    of the Transaction on a national basis.
- market_id: gm_4
  name: Sweet biscuits — national
  definition_status: considered
  notes: The Commission's market investigation indicates that the market for sweet biscuits
    is national in scope, aligning with its past practice. The Commission will assess the potential
    effects of the Transaction on a national basis.
- market_id: gm_5
  name: Chocolate spreadable products — national
  definition_status: considered
  notes: The Commission's market investigation indicates that the market for chocolate spreadable
    products is national in scope, aligning with its past practice. The Commission will assess
    the potential effects of the Transaction on a national basis.
- market_id: gm_6
  name: Savoury snacks — national
  definition_status: considered
  notes: The Commission's market investigation indicates that the market for savoury snacks
    is national in scope, aligning with its past practice. The Commission will assess the potential
    effects of the Transaction on a national basis.
