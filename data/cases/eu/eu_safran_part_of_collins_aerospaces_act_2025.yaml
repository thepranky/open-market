  page: '37'
  quote_snippet: Following ESA’s implementation of its new approach towards ensuring increased
    competition for space launch service providers (and thus, limiting the application of the
    juste retour principle), there are indications, also confirmed by the market investigation
    that tenders will be limited to European launch service providers. Thus, competition between
    these European launch service providers for ESA projects will still be expected to take
    place at EEA level.
