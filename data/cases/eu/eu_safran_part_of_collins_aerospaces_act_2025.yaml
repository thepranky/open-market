  page: '20'
  quote_snippet: In its past practice, the Commission found that the supply of PFCA systems
    belongs to a separate product market relative to other flight control actuators.133 The
    Commission has considered, but ultimately left open, whether separate product markets should
    be retained for the supply of PFCA systems according to (i) the segment of demand (for civil
    or military aircraft),134 and (ii) the type of aircraft (large commercial aircraft, regional
    aircraft, etc.).135 The Commission has not considered a potential segmentation between hydraulic
    or electrically powered PFCA systems.
