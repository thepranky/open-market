- passage_id: sp_4
  source_document_id: eu_safran_part_of_collins_aerospaces_act_2025_decision
  page: '20'
  quote_snippet: In sum, the Commission finds that the supply of THSA systems is in a separate
    product market, distinct from the supply of PFCA systems and of SFCA systems. The Commission
    finds that it is not appropriate to segment the supply of THSA systems by technology (hydraulic
    or electric THSA systems). With regard to the potential segmentation of the supply of THSA
    systems by segment of demand (civil or military), or by type of aircraft (large commercial
    aircraft, regional aircraft, business jets or general aviation), for the purposes of this
    decision the Commission leaves the market definition open and will carry out the competitive
    assessment for all plausible alternative market definitions.
  extraction_method: pdf_extracted
