- passage_id: sp_2
  source_document_id: eu_safran_part_of_collins_aerospaces_act_2025_decision
  page: '33'
  quote_snippet: First, as far as space programmes are concerned, ESA has been the only customer
    of space launchers in Europe (e.g. for the Ariane and Vega launchers). For developed programmes,
    such as the Ariane and the Vega programmes, ESA has designated the ArianeGroup and Avio
    as prime contractors based on the juste retour principle. The market investigation confirmed
    that the prime contractors have been already designated based on the juste retour principle,237
    and thus without a competitive tender, and any change to such contractors may only be made
    under stringent conditions and in accordance with the already established rules of each
    program.238 Thus, for developed ESA programmes, it appears that the competitive process
    has been limited by the application of the juste retour principle. Further, no new similar
    programme (e.g. for heavy-lift space launchers) seems to be foreseen to materialise in the
    upcoming years, where prime contractors can be selected.
  extraction_method: pdf_extracted
