- passage_id: sp_25
  source_document_id: eu_safran_part_of_collins_aerospaces_act_2025_decision
  page: '35'
  quote_snippet: Consistent with its past practice, the Commission finds that the markets for
    the supply of aerospace actuation systems (namely THSA systems, PFCA systems, SFCA systems
    and TRAS), thrust reversers, pilot controls (including its relevant sub-segmentations),
    flight control computers and wiring systems are worldwide in scope. The Commission finds
    that aerospace companies are active,255 and procurement takes place, globally.256 The Commission
    also finds that there are significant trade flows across countries around the globe.257
    Finally, the Commission finds that prices do not vary significantly between different regions
    of the world. Therefore, the Commission finds that, generally, in the supply of these aerospace
    products, conditions of competition are sufficiently homogeneous for competition to take
    place within a world-wide geographic market.
  extraction_method: pdf_extracted
