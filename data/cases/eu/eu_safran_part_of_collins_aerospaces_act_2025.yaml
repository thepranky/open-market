- passage_id: sp_9
  source_document_id: eu_safran_part_of_collins_aerospaces_act_2025_decision
  page: '25'
  quote_snippet: In summary, for the purposes of the decision, the Commission considers that
    it is appropriate to distinguish the supply of TRAS from that of other actuators, namely
    PFCA, SFCA and THSA systems. Because the outcome of the Commission’s assessment would not
    change under the various alternative plausible market definitions, the existence of separate
    markets for the supply of TRAS according to the segment of demand (civil or military aircraft)
    and according to the size of the aircraft can be left open. Likewise, the Commission leaves
    open whether it is appropriate to define separate product markets for the supply of of H-TRAS
    and of E-TRAS. The Commission will therefore carry out the competitive assessment in all
    plausible alternative market definitions.
  extraction_method: pdf_extracted
