product_markets_considered:
- market_id: pm_1
  name: Valves for space launchers
  definition_status: left_open
  notes: The Commission previously defined valves for space launchers as a separate market.
    It also considered a further segmentation between cryogenic valves and non-cryogenic valves
    due to product characteristics, but left this segmentation open. The market investigation
    results were in line with previous findings, indicating technical difficulties and high
    costs in switching between cryogenic and non-cryogenic valves (demand perspective) but mixed
    results on supply-side substitutability. The Commission ultimately left the segmentation
    open as the Transaction would not raise serious doubts irrespective of the delineation.
- market_id: pm_2
  name: Prime contracting for ESA space launchers
  definition_status: left_open
  notes: The Commission previously analysed this market but left its existence and scope open.
    For developed programmes (Ariane and Vega), prime contractors were designated based on the
    juste retour principle without competitive tender, limiting the competitive process. The
    market investigation indicated a new approach for future small launchers (European Launcher
    Challenge), where competitive tenders will be organised, and the juste retour principle
    will be limited. This suggests a possible distinction between developed and prospective
    programmes. The Commission left the existence and scope, as well as the distinction between
    developed and prospective programmes, open as the Transaction would not raise serious doubts.
- market_id: pm_3
  name: Trimmable Horizontal Stabiliser Actuator (THSA) systems
  definition_status: defined
  notes: The Commission finds that THSA systems are distinct from other actuation products due
    to characteristics, price, functionalities, intended use, power, and flight-critical nature.
    Customers cannot substitute THSA systems for PFCA or SFCA systems. The Commission explicitly
    found that the supply of THSA systems constitutes a separate product market in UTC/Collins.
    The Commission finds it not appropriate to segment by technology (H-THSA vs. E-THSA) as
    suppliers compete at the aircraft design stage. Segmentation by demand segment (civil/military)
    or type of aircraft (size) was left open as the outcome of the assessment would not change.
- market_id: pm_4
  name: Primary Flight Control Actuators (PFCA) systems
  definition_status: defined
  notes: PFCA systems are distinct from other actuation products, particularly SFCA and THSA
    systems, serving a different purpose and having higher flight-critical importance. They
    are technologically demanding and almost exclusively hydraulic. The Commission found that
    the supply of PFCA systems constitutes a product market separate from other flight actuators.
    Segmentation by segment of demand (civil/military) or type of aircraft (size) was left open.
- market_id: pm_5
  name: Secondary Flight Control Actuators (SFCA) systems
  definition_status: defined
  notes: SFCA systems are distinct from other actuation products, serving a distinct purpose,
    having a different risk-profile (not flight-critical), and are less used during flight compared
    to PFCA systems. They are more often electric. The Commission found it appropriate to consider
    the supply of SFCA systems as separate from other flight control actuators. Segmentation
    by segment of demand (civil/military), type of aircraft (size), or technology was left open.
- market_id: pm_6
  name: Thrust Reverser Actuation Systems (TRAS)
  definition_status: defined
  notes: TRAS are distinct products from other actuation products and are an input component
    of thrust reversers, not directly substitutable. Suppliers of TRAS are often distinct from
    those supplying thrust reversers. The Commission finds it appropriate to distinguish the
    supply of TRAS from other actuators. Segmentation by segment of demand (civil/military),
    type of aircraft (size), or technology (H-TRAS vs. E-TRAS) was left open.
- market_id: pm_7
  name: Thrust reversers
  definition_status: defined
  notes: Thrust reversers are components of nacelles used to decrease aircraft speed. The Commission
    previously found that the supply of thrust reversers belongs to a separate product market
    and that segmentation by type (cascade, door, target) is not appropriate, as most suppliers
    offer all types. Segmentation by type of aircraft or segment of demand (civil/military)
    was left open.
- market_id: pm_8
  name: Pilot control sticks
  definition_status: defined
  notes: Pilot control sticks provide man-machine interface for piloting functions. The Commission,
    consistent with past practice and market investigation, found that the supply of pilot control
    sticks belongs to a separate product market. Segmentation between centre yokes and sidesticks,
    as well as by segment of demand (civil/military) and type of aircraft, was left open.
- market_id: pm_9
  name: Rudder Brake Pedals Systems (RBPS)
  definition_status: defined
  notes: RBPS are equipment directly accessible to the pilot in the cockpit. The Commission,
    consistent with past practice and market investigation, found that the supply of RBPS belongs
    to a separate product market. Segmentation by segment of demand (civil/military) and type
    of aircraft was left open.
- market_id: pm_10
  name: Throttle Quadrant Assembly (TQA)
  definition_status: defined
  notes: TQA allows the pilot to control fuel flow. The Commission, consistent with past practice
    and market investigation, found that the supply of TQA belongs to a separate product market.
    Segmentation by segment of demand (civil/military) and type of aircraft was left open.
- market_id: pm_11
  name: Flight control computers (FCC)
  definition_status: defined
  notes: FCCs process pilot commands and sensor measurements to control actuators. The Commission
    previously defined a market for FCC and the market investigation confirmed FCC constitutes
    a product market distinct from other flight control electronics. Potential further segmentation
    (primary/secondary FCC, civil/military, type of aircraft) was left open as the outcome of
    the assessment would not change.
- market_id: pm_12
  name: Aerospace wiring systems
  definition_status: defined
  notes: Wiring systems transmit electrical power, data, and signals. The Commission previously
    found that the supply of wiring systems for the aerospace industry belongs to a product
    market separate from other industries due to specific standards. This was confirmed by the
    market investigation. The Commission also found that general harnesses and harsh environment
    harnesses may belong to separate product markets, and that distinguishing supply by segment
    of demand (civil/military) is appropriate, while distinction by type of aircraft is not.
    Segmentation by type of harnesses (general/harsh), segment of demand, or type of aircraft/application
    was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Aerospace actuation systems (THSA, PFCA, SFCA, TRAS), thrust reversers, pilot controls,
    flight control computers and wiring systems — worldwide
  definition_status: defined
  notes: The Commission consistently found in its past practice and confirmed in this investigation
    that markets for these aerospace products are worldwide in scope, given global activity,
    procurement, trade flows, and homogeneous prices. For products incorporated in military
    aircraft, the existence of narrower EEA-wide markets was left open due to mixed responses
    regarding trade barriers and regional preferences, but the overall assessment outcome would
    not change.
- market_id: gm_2
  name: Valves for space launchers and prime contracting for developed ESA programmes — EEA-wide
  definition_status: defined
  notes: For already developed ESA launcher programmes (Ariane and Vega), competition for prime
    contracting, systems, sub-systems and equipment (including valves) took place at EEA level.
    This was due to the application of the juste retour principle, which geographically limited
    the selection of suppliers and prime contractors.
- market_id: gm_3
  name: Valves for space launchers and prime contracting for prospective ESA programmes (European
    Launcher Challenge) — EEA-wide for launch service providers, potentially global for component
    suppliers
  definition_status: considered
  notes: ESA's new approach for future small launchers (European Launcher Challenge) will limit
    the juste retour principle and organise competitive tenders for launch service providers,
    which will be limited to European entities. These European launch service providers will
    then independently select their component suppliers (e.g., valves), potentially opening
    up the market for component suppliers to international (global) competition. The overall
    geographic market definition was left open for these prospective programmes, as the Transaction
    would not raise serious doubts irrespective of the exact delineation.
