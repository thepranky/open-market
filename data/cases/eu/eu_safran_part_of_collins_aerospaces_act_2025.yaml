  page: '28'
  quote_snippet: In summary, for the purposes of this decision the Commission finds that the
    supply of pilot control sticks, the supply of RBPS and the supply of TQA belong to separate
    product markets. Even though there are indications that it may be appropriate to define
    separate product markets within pilot control sticks, between centre yokes and sidesticks,
    and according to the segment of demand (i.e., between the supply of pilot controls to civil
    and military aircraft) and according to the type of aircraft (i.e., between large commercial
    aircraft, regional aircraft, etc.), since the outcome of the Commission’s assessment would
    not change under the various alternative plausible market definitions, those possible further
    segmentations can be left open.
