- passage_id: sp_24
  source_document_id: eu_safran_part_of_collins_aerospaces_act_2025_decision
  page: '31'
  quote_snippet: In summary, for the purpose of this decision, the Commission finds that aerospace
    wiring systems constitute a distinct product market. The Commission also finds, within aerospace
    wiring systems, that general harnesses and harsh environment harnesses may belong to separate
    product markets. As regards a possible segmentation by segment of demand (civil or military
    aircraft), the response from the market investigation indicates that a distinction in the
    supply of wiring systems to civil and to military aircraft is appropriate, whereas a distinction
    by type of aircraft (large commercial aircraft, regional aircraft, etc.) is not appropriate.
    In line with its past practice, the Commission will consider the supply of wiring systems
    by application (in particular, the supply of wiring systems for incorporation in actuation
    products). However, since the outcome of the Commission’s assessment would not change under
    the various alternative plausible market definitions, the existence of separate markets
    for the supply of wiring systems according to the segment of demand or by type of aircraft
    or application can be left open. The Commission will therefore carry out the competitive
    assessment in all plausible alternative market definitions.
  extraction_method: pdf_extracted
