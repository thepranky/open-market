- passage_id: sp_3
  source_document_id: eu_safran_part_of_collins_aerospaces_act_2025_decision
  page: '17'
  quote_snippet: The Commission finds that THSA systems are a product that is different in its
    characteristics, price and functionalities relative to other actuation products. As mentioned
    in greater detail in paragraphs (45), (46), (48) and (51), the intended use of THSA systems
    in an aircraft is different from other flight control actuators (it moves the horizontal
    stabiliser, whereas other flight control actuators move other flight control surfaces) and
    it is observable that the products themselves are different pieces of equipment.107 Customers
    cannot substitute a THSA system for a PFCA system, as the THSA merely adjusts the flight
    path set by the PFCA system (and is not able to control the direction of the flight), or
    for an SFCA system, which is used only in take-off or landing (whereas the THSA system moves
    the horizontal stabiliser during flight).
  extraction_method: pdf_extracted
  review_status: unreviewed
