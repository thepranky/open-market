    sticks, the supply of RBPS and the supply of TQA belong to separate product markets.192
    The Commission found that each type of pilot control performs a different function in an
    aircraft, that individual pilot controls are priced differently, and that it was unclear
    whether a supplier of one type of pilot control (e.g., a pilot control stick) would be able
    to switch production to supply another type (e.g., a RBPS) in a manner that exercises a
    sufficient and immediate competitive constraint.193
