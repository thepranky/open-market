- passage_id: sp_11
  source_document_id: eu_safran_part_of_collins_aerospaces_act_2025_decision
  page: '27'
  quote_snippet: With respect to the different types of thrust reversers – with cascades, with
    doors and with targets – the Commission finds that suppliers often offer all types of thrust
    reversers, which indicates that suppliers are able to position their product offering across
    the different types.189 By contrast, responses to the market investigation were mixed on
    whether the different types of thrust reversers are directly substitutable or should be
    regarded as belonging to separate product markets (an equal number of respondents indicated
    that the different types of thrust reversers should or should not be regarded as belonging
    to separate product markets, with a larger number of respondents not providing a definitive
    view).190 During its investigation, and in particular through the analysis of the Parties’
    internal documents, the Commission did not find a reason to deviate from its past practice.
    As a result, the Commission finds that the market for the supply of thrust reversers includes
    all types of thrust reversers.
  extraction_method: pdf_extracted
