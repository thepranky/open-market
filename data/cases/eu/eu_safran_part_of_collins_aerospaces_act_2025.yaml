- passage_id: sp_26
  source_document_id: eu_safran_part_of_collins_aerospaces_act_2025_decision
  page: '36'
  quote_snippet: Therefore, the Commission finds that the supply of THSA systems, PFCA systems,
    SFCA systems, TRAS and thrust reversers, pilot controls (including its relevant sub-segmentations),
    flight control computers and wiring systems, including their plausible sub-segmentations,
    is worldwide in scope. With respect to the appropriateness of finding narrower EEA-wide
    markets for the supply of these products to the military segment, because the outcome of
    the Commission’s assessment would not change under the various plausible alternative market
    definitions, the Commission leaves open whether it is appropriate to find that competition
    for the supply to military aircraft takes place in a market limited to the EEA and will
    carry out the competitive assessment in all plausible alternative market definitions.
