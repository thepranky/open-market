- passage_id: sp_8
  source_document_id: eu_safran_part_of_collins_aerospaces_act_2025_decision
  page: '23'
  quote_snippet: In its past practice, the Commission has regarded the supply of TRAS as a separate
    product market and an input for thrust reversers,156 although it left open whether the supply
    of TRAS and of thrust reversers belong to the same product market in the most recent decision
    in which the supply of TRAS was investigated.157 The Commission found that it was not appropriate
    to consider separate markets for the supply of TRAS according to the type of aircraft in
    which ultimately they are incorporated (large commercial aircraft, regional aircraft or
    business jets).158 The Commission has not addressed a possible distinction with respect
    to the segment of demand (civil or military aircraft), or the technology used in the TRAS
    (H-TRAS or E-TRAS).
