  source_document_id: eu_cvc_ekaterra_2022_decision
  page: '5'
  quote_snippet: In the case at hand, the Commission does not see any reason to depart from
    its previous decisional practice. In any event, the question whether the market for retail
    distribution of daily consumer goods is segmented between hypermarkets, supermarkets, discount
    chains, on the one hand, and specialised stores or small retailers, on the other hand can
    be left open, as the Transaction does not give rise to competition concerns under any plausible
    market definition.
