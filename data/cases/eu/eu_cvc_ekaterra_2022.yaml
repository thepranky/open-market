- passage_id: sp_3
  source_document_id: eu_cvc_ekaterra_2022_decision
  page: '4'
  quote_snippet: In any event, potential segmentations by type of tea, by format, by distribution
    channel and between branded tea and private label tea can be left open as the Transaction
    does not give rise to competition concerns under any plausible product market definition.
    In the case at hand, the Commission will assess the Transaction under the narrowest plausible
    product market definition (where ekaterra’s upstream market share is the highest), i.e.
    the market for the production and supply of branded tea to modern trade retailers with a
    distinction by type of tea and by format.
  extraction_method: pdf_extracted
  review_status: unreviewed
