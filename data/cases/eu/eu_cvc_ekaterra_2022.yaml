product_markets_considered:
- market_id: pm_1
  name: Production and supply of branded tea to modern trade retailers with a distinction by
    type of tea and by format
  definition_status: considered
  notes: The Commission left open potential segmentations by type of tea, format, distribution
    channel, and between branded/private label tea, but assessed the transaction on the narrowest
    plausible definition which is branded tea to modern trade retailers, with distinction by
    type and format.
- market_id: pm_2
  name: Retail distribution of daily consumer goods in small retail stores to the exclusion
    of hypermarkets, supermarkets and discount stores
  definition_status: considered
  notes: The Commission generally left open the question of market segmentation within retail
    distribution but conducted its analysis on the narrowest segment (small retail stores including
    convenience stores).
- market_id: pm_3
  name: Procurement of daily consumer goods by modern trade retailers
  definition_status: considered
  notes: The Commission left open questions of segmentation for procurement of daily consumer
    goods (by category or sales channel) but conducted its analysis on the general segment of
    procurement by modern trade retailers.
