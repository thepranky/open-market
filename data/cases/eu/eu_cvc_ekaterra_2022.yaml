  source_document_id: eu_cvc_ekaterra_2022_decision
  page: '6'
  quote_snippet: In the case at hand, the Commission does not see any reason to depart from
    its previous decisional practice. In any event, the questions whether the procurement of
    different categories of products (e.g. basic foodstuffs, wine and spirit drinks, etc.) or
    the different sales channels (e.g. food retailing, specialised trade, etc.) belong to separate
    markets can be left open, as the Transaction does not give rise to competition concerns
    under any plausible market definition.
