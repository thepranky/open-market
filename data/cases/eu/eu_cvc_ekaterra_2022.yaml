- passage_id: sp_2
  source_document_id: eu_cvc_ekaterra_2022_decision
  page: '3'
  quote_snippet: As to potential segmentations within the production and supply of tea, the
    results of the market investigation suggest that distinctions by type of tea (black or green
    tea) and formats (bags or loose tea), as well as segmentations by distribution channel or
    between private labels and branded tea, are relevant.
  extraction_method: pdf_extracted
