  quote_snippet: In view of the above, the Commission takes the view that the market for the
    production and supply of tea in Poland is likely to be national in scope. In the case at
    hand, the Commission will assess the competitive effect of the Transaction on the national
    market for the production and supply of branded tea to modern trade retailers in Poland,
    with a further distinction by type of tea and by format.
