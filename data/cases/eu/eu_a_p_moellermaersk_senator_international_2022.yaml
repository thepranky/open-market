  role: target
source_documents:
- doc_id: eu_a_p_moellermaersk_senator_international_2022_decision
  title: A P MOELLER-MAERSK / SENATOR INTERNATIONAL — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.10559
  pdf_url: http://publications.europa.eu/resource/cellar/2f6a773a-3a7e-11ed-9c68-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Freight forwarding services
  definition_status: left_open
  notes: 'The Commission considered possible sub-segmentations: (i) between domestic freight
    forwarding and cross-border freight forwarding and (ii) depending on the modes of transport
    (air, land, and ocean). The exact product market definition was left open.'
- market_id: pm_2
  name: Ocean freight forwarding services
  definition_status: left_open
  notes: This market is a sub-segment of 'Freight forwarding services' by mode of transport.
    Its definition was implicitly left open as part of the broader freight forwarding market
    analysis, but it was a key downstream market in the vertical assessment. Senator International's
    market share was assessed under various product and geographic definitions.
- market_id: pm_3
  name: Deep-sea container liner shipping services
  definition_status: considered
  notes: The Commission considered a possible narrower market for the transport of refrigerated
    (reefer) goods, but left the exact product market definition open. For the purpose of assessment,
    the Commission considered the overall deep-sea container liner shipping services market
    and its plausible reefer container liner shipping sub-segment.
- market_id: pm_4
  name: Short-sea container liner shipping services
  definition_status: considered
  notes: The Commission considered, but left open, sub-segmentations between wheeled cargo and
    short-sea container shipping services, and between reefer (refrigerated) and dry (non-refrigerated)
    container shipping services. For the purpose of assessment, the Commission considered the
    overall short-sea container liner shipping services market and its plausible narrower market
    for short-sea reefer container liner shipping services.
- market_id: pm_5
  name: Contract logistics services
  definition_status: left_open
  notes: 'The Commission considered whether the market should be segmented into: (i) cross-border
    and domestic logistics, (ii) by reference to the type of good handled or the industry serviced,
    or (iii) into lead logistics providers (LLPs) and traditional logistics providers (3PLs).
    The precise scope was left open.'
geographic_markets_considered:
- market_id: gm_1
  name: Freight forwarding services — national markets
  definition_status: segmented
  notes: The Commission had previously left open whether the market should be national or larger
    (e.g., EEA-wide). While the exact geographic market definition was left open, the Commission
    assessed the effects of the transaction under the narrowest plausible definition, which
    included national markets.
- market_id: gm_2
  name: Ocean freight forwarding services — national markets
  definition_status: segmented
  notes: The geographic scope of ocean freight forwarding services was considered at a national
    level as the narrowest plausible definition for assessment, consistent with the broader
    freight forwarding services market. The overall geographic definition was left open.
- market_id: gm_3
  name: Deep-sea container liner shipping services — individual legs of trade
  definition_status: defined
  notes: The Commission concluded that container liner shipping services are geographically
    defined on the basis of individual legs of trade, such as Northern Europe – North America
    eastbound and westbound separately. This definition was applied for the assessment.
- market_id: gm_4
  name: Short-sea container liner shipping services — individual legs of trade
  definition_status: considered
  notes: The Commission considered whether the geographic market should be defined on the basis
    of single trades or corridors, or single legs of trade, ultimately leaving the question
    open. However, for the purpose of assessment, the Commission used the narrowest plausible
    geographic market, defined as individual legs of trade.
- market_id: gm_5
  name: Contract logistics services — national markets
  definition_status: segmented
  notes: The Commission had previously found the contract logistics market to be EEA-wide, while
    leaving open a possible segmentation into national markets. For the purpose of assessment,
    the Commission considered national markets as the narrowest plausible definition.
theories_of_harm: []
commitments: []
