product_markets_considered:
- market_id: pm_1
  name: Supply of processed poultry meat
  definition_status: left_open
  notes: The Commission considered that the exact market definition for the supply of processed
    poultry meat could be left open, as the transaction did not raise serious doubts under any
    plausible definition. However, for the purpose of the decision, the competitive assessment
    was carried out considering various segmentations, including by species, type of processed
    product, sales channel, and branding.
- market_id: pm_2
  name: Supply of processed branded poultry meat to all retail channels
  definition_status: considered
  notes: This market was considered as part of the competitive assessment for processed poultry
    meat products, under the segmentation of product branding and all retail sales channels.
- market_id: pm_3
  name: Supply of processed poultry meat, including branded and private/white label, to the
    traditional trade channel
  definition_status: considered
  notes: This market was considered as part of the competitive assessment for processed poultry
    meat products, under the segmentation of product branding and the traditional trade sales
    channel.
- market_id: pm_4
  name: Supply of processed poultry cooked sausages
  definition_status: considered
  notes: The Commission explicitly considered the narrower market for processed poultry cooked
    sausages as part of its competitive assessment, within the broader context of processed
    poultry meat products. The overall market definition was left open.
- market_id: pm_5
  name: Supply of processed poultry cooked sausages, private/white label products, to all retail
    channels
  definition_status: considered
  notes: This market was considered as part of the competitive assessment for processed poultry
    cooked sausages, under the segmentation of private/white label branding and all retail sales
    channels.
- market_id: pm_6
  name: Supply of processed poultry cooked sausages, private/white label products, to the modern
    trade channel
  definition_status: considered
  notes: This market was considered as part of the competitive assessment for processed poultry
    cooked sausages, under the segmentation of private/white label branding and the modern trade
    sales channel.
geographic_markets_considered:
- market_id: gm_1
  name: Supply of processed poultry meat products — national (Poland affected)
  definition_status: considered
  notes: The Commission left open the precise geographic market definition for the supply of
    processed poultry products but carried out its competitive assessment based on a national
    market encompassing Poland, as this was considered the narrowest plausible market where
    overlaps occurred. This applies to all identified product markets.
