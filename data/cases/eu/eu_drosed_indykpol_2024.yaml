- passage_id: sp_2
  source_document_id: eu_drosed_indykpol_2024_decision
  page: '8'
  quote_snippet: '(24) For the purposes of this Decision, based on the results of the market
    investigation, the competitive assessment will be carried out considering the following
    segmentations where the Parties’ activities overlap and give rise to affected markets: (i)
    by species of processed poultry meat product, considering all poultry species; (ii) by type
    of processed poultry product, considering the wider market for all types of processed poultry
    meat products as well as the narrower market for processed poultry cooked sausages; (iii)
    by type of retail sales channel, considering the wider market for all retail sales channels,
    as well as the narrower markets for the Modern trade channel, on the one hand, and the Traditional
    trade channel, on the other hand; and (iv) by product branding, considering the wider market
    for branded and private/white label products, as well as the narrower markets for branded,
    on the one hand, and private/white label, on the other hand.'
  extraction_method: pdf_extracted
  review_status: unreviewed
