  source_document_id: eu_lear_corporation_interior_comfort_systems_busin_2022_decision
  page: '5'
  quote_snippet: In any event, for the purposes of this Decision, it can be left open whether
    the manufacturing and supply of seat support equipment is a separate market from a wider
    market for the production and supply of seat components and whether the manufacturing and
    supply of seat support equipment should be sub-segmented as the proposed Transaction does
    not raise serious doubts as to its compatibility with the internal market even under the
    narrowest market definition. Therefore, the Commission will analyse the impact of the proposed
    Transaction on the sub-segments for both seat lumbar support and seat massage equipment.
  extraction_method: pdf_extracted
