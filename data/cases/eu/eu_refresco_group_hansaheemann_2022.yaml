product_markets_considered:
- market_id: pm_1
  name: Production and bottling of non-alcoholic beverages (NABs)
  definition_status: left_open
  notes: The Commission left the precise product market definition open, but for the purpose
    of the decision, it considered potential distinctions based on product categories (CSD,
    NCSD excluding water, water), packaging type (aseptic PET), production process, organic/non-organic,
    and PLB/branded NABs under a conservative approach.
- market_id: pm_2
  name: Production and bottling of carbonated soft drinks (CSDs)
  definition_status: segmented
  notes: Segmented from the broader NABs market, with CSDs and NCSDs forming two separate product
    markets based on past decisional practice. Further segmentations within CSDs were not envisaged.
- market_id: pm_3
  name: Production and bottling of non-carbonated soft drinks (NCSDs)
  definition_status: segmented
  notes: Segmented from the broader NABs market, with CSDs and NCSDs forming two separate product
    markets based on past decisional practice. Further segmentations within NCSDs, such as water
    and RTD teas, were also considered.
- market_id: pm_4
  name: Production and bottling of water
  definition_status: segmented
  notes: Water was considered a separate product market within NCSDs based on past decisional
    practice.
- market_id: pm_5
  name: Production and bottling of PLB packaged water in PET packaging
  definition_status: considered
  notes: This specific market segmentation (PLB, PET packaging, water) was considered as an
    affected market for the competitive assessment in the Netherlands.
- market_id: pm_6
  name: Production and bottling of PLB CSDs in PET packaging
  definition_status: considered
  notes: This specific market segmentation (PLB, PET packaging, CSDs) was considered as an affected
    market for the competitive assessment in the Netherlands and Poland.
- market_id: pm_7
  name: Production and bottling of branded CSDs in PET packaging
  definition_status: considered
  notes: This specific market segmentation (branded, PET packaging, CSDs) was considered as
    an affected market for the competitive assessment in the Netherlands.
- market_id: pm_8
  name: Production and bottling of PLB NCSDs excluding water in PET packaging
  definition_status: considered
  notes: This specific market segmentation (PLB, PET packaging, NCSDs excluding water) was considered
    as an affected market for the competitive assessment in the Netherlands.
- market_id: pm_9
  name: Production and bottling of branded NCSDs excluding water in PET packaging
  definition_status: considered
  notes: This specific market segmentation (branded, PET packaging, NCSDs excluding water) was
    considered as an affected market for the competitive assessment in the Netherlands.
geographic_markets_considered:
- market_id: gm_1
  name: Production and bottling of PLB packaged water in PET packaging — national (Netherlands
    affected)
  definition_status: considered
  notes: While the precise geographic market definition was left open, the competitive analysis
    for this market in the Netherlands was conducted on a national basis, consistent with past
    practice and market investigation findings.
- market_id: gm_2
  name: Production and bottling of PLB CSDs in PET packaging — national (Netherlands affected)
  definition_status: considered
  notes: While the precise geographic market definition was left open, the competitive analysis
    for this market in the Netherlands was conducted on a national basis, consistent with past
    practice and market investigation findings.
- market_id: gm_3
  name: Production and bottling of branded CSDs in PET packaging — national (Netherlands affected)
  definition_status: considered
  notes: While the precise geographic market definition was left open, the competitive analysis
    for this market in the Netherlands was conducted on a national basis, consistent with past
    practice and market investigation findings.
- market_id: gm_4
  name: Production and bottling of PLB NCSDs excluding water in PET packaging — national (Netherlands
    affected)
  definition_status: considered
  notes: While the precise geographic market definition was left open, the competitive analysis
    for this market in the Netherlands was conducted on a national basis, consistent with past
    practice and market investigation findings.
- market_id: gm_5
  name: Production and bottling of branded NCSDs excluding water in PET packaging — national
    (Netherlands affected)
  definition_status: considered
  notes: While the precise geographic market definition was left open, the competitive analysis
    for this market in the Netherlands was conducted on a national basis, consistent with past
    practice and market investigation findings.
- market_id: gm_6
  name: Production and bottling of PLB CSDs in PET packaging — national (Poland affected)
  definition_status: considered
  notes: While the precise geographic market definition was left open, the competitive analysis
