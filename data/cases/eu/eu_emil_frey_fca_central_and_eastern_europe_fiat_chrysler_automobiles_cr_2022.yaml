- passage_id: sp_2
  source_document_id: eu_emil_frey_fca_central_and_eastern_europe_fiat_chrysler_automobiles_cr_2022_decision
  page: '5'
  quote_snippet: In any event, for the purpose of this decision the Commission considers that
    the exact product market definition between (i) wholesale distribution of both PCs and LCVs
    and (ii) wholesale distribution of PCs, on the one hand, and LCVs, on the other hand, can
    be left open, as the Transaction does not give rise to serious doubts as to its compatibility
    with the internal market under any plausible product market definition.
  extraction_method: pdf_extracted
