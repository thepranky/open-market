product_markets_considered:
- market_id: pm_1
  name: Wholesale distribution of new PCs and/or LCVs
  definition_status: left_open
  notes: The Commission explicitly left open the exact product market definition between wholesale
    distribution of both PCs and LCVs and wholesale distribution of PCs or LCVs separately.
    However, for the purpose of the decision, it chose to analyze the effects on the narrower
    market of wholesale distribution of LCVs only, as this was the only potential market where
    affected markets would arise.
- market_id: pm_2
  name: Wholesale distribution of new LCVs only
  definition_status: considered
  notes: Although the broader market definition for wholesale distribution of PCs and/or LCVs
    was left open, the Commission decided to analyze the effects of the transaction on this
    narrower market, as it was the only one in which affected markets would arise.
- market_id: pm_3
  name: Retail distribution of new PCs and/or LCVs
  definition_status: left_open
  notes: The Commission explicitly left open the exact product market definition between retail
    distribution of both PCs and LCVs and retail distribution of PCs or LCVs separately. However,
    for the purpose of the decision, it chose to analyze the effects on the narrower market
    of retail distribution of LCVs only, as this was the only potential market where vertically
    affected markets would arise.
- market_id: pm_4
  name: Retail distribution of new LCVs only
  definition_status: considered
  notes: Although the broader market definition for retail distribution of PCs and/or LCVs was
    left open, the Commission decided to analyze the effects of the transaction on this narrower
    market, as it was the only one in which vertically affected markets would arise.
geographic_markets_considered:
- market_id: gm_1
  name: Wholesale distribution of new PCs and/or LCVs — EEA-wide
  definition_status: left_open
  notes: The Commission previously left open whether the geographic market for wholesale distribution
    of new PCs and/or LCVs is EEA-wide or national in scope, and for this decision, it also
    left it open. However, the analysis was conducted at a national level.
- market_id: gm_2
  name: Wholesale distribution of new PCs and/or LCVs — national (Czech Republic, Hungary, and
    Slovakia affected)
  definition_status: left_open
  notes: While the exact geographic market definition was left open between EEA-wide and national,
    the market investigation results indicated national markets, and the Commission decided
    to analyze the effects at a national level, as affected markets would only arise at this
    level.
- market_id: gm_3
  name: Retail distribution of new PCs and/or LCVs — EEA-wide, national or local
  definition_status: left_open
  notes: The Commission previously left open whether the retail distribution markets are EEA-wide,
    national or local in scope, and for this decision, it also left it open. However, the analysis
    was conducted at both national and local levels.
- market_id: gm_4
  name: Retail distribution of new PCs and/or LCVs — national and local (Czech Republic, Hungary,
    and Slovakia affected)
  definition_status: left_open
  notes: While the exact geographic market definition was left open between EEA-wide, national,
    or local, the market investigation indicated national markets, and the Commission decided
    to analyze the effects at both a national and local level, as vertically affected markets
    would only arise at these levels.
theories_of_harm: []
commitments: []
source_passages:
- passage_id: sp_1
  source_document_id: eu_emil_frey_fca_central_and_eastern_europe_fiat_chrysler_automobiles_cr_2022_decision
  page: '4'
  quote_snippet: The Commission has in previous decisions defined a separate product market
    for the wholesale distribution of PCs and LCVs. Although the Commission has distinguished
    in some precedents between the wholesale distribution of PCs, on the one hand, and LCVs,
    on the other hand, it has ultimately left open the precise product market definition.
  extraction_method: pdf_extracted
  review_status: unreviewed
