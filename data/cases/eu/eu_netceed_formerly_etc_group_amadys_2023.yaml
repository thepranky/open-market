product_markets_considered:
- market_id: pm_1
  name: supply of telecommunications equipment
  definition_status: segmented
  notes: In previous cases, the Commission found that the market for the supply of telecommunications
    equipment can be segmented into active and passive equipment.
- market_id: pm_2
  name: supply of passive telecommunication equipment
  definition_status: left_open
  notes: The Commission considers that, for the purpose of this decision, the supply of passive
    telecommunication equipment constitutes a plausible product market. However, it can be left
    open whether this market should be broader (including active telecommunication equipment)
    or further segmented by type of network (carrier or enterprise), by component (fibre, copper,
    coax, mobile), or by operator type (OEMs, distributors), as the Transaction does not raise
    serious doubts irrespective of the market definition.
- market_id: pm_3
  name: manufacture and supply of passive equipment for carrier networks
  definition_status: considered
  notes: In previous cases, the Commission segmented the market between manufacture and supply
    of passive equipment for carrier networks and for enterprise networks. Potential further
    sub-segments (fibre, copper, coaxial cable components) were considered but ultimately left
    open in these previous decisions.
- market_id: pm_4
  name: manufacture and supply of passive equipment for enterprise networks
  definition_status: considered
  notes: In previous cases, the Commission segmented the market between manufacture and supply
    of passive equipment for carrier networks and for enterprise networks. Potential further
    sub-segments (copper, fibre components) were considered but ultimately left open in these
    previous decisions.
- market_id: pm_5
  name: supply of passive coaxial cable telecommunications equipment to carrier networks by
    distributors
  definition_status: considered
  notes: This is the narrowest plausible segment on which the Commission focused its competitive
    assessment, given that the lack of concerns on this segment implied a lack of concerns on
    broader product and/or geographic markets.
geographic_markets_considered:
- market_id: gm_1
  name: supply of passive telecommunications equipment — at least EEA-wide
  definition_status: considered
  notes: Based on previous decisions and market investigation, the Commission concluded that
    the market for the supply of passive telecommunications equipment is at least EEA-wide.
- market_id: gm_2
  name: supply of active and passive telecommunication equipment or potential product market
    segments of this market — at least EEA-wide
  definition_status: considered
  notes: The Commission considered the geographic scope of the broader market, including active
    and passive equipment and all potential product market segments, to be at least EEA-wide.
- market_id: gm_3
  name: supply of passive coaxial cable telecommunications equipment to carrier networks by
    distributors — EEA-wide
  definition_status: considered
  notes: The competitive assessment focused on this market with an EEA-wide geographic scope.
