- passage_id: sp_8
  source_document_id: eu_bme_saintgobain_distribution_the_n_2021_decision
  page: '5'
  quote_snippet: In any event, because the Transaction does not raise serious doubts as to its
    compatibility with the internal market under any plausible market definition, the exact
    market definition of the retail sales of building products can be left open for the purpose
    of this Decision. The Commission will assess the impact of the Transaction taking account
    of the following narrower plausible market definition that give rise to an affected market,
    i.e. retail distribution of building materials to professional customers via GMB stores
    and retail distribution of interior finishing products, including dry finishing products,
    via SBM stores.
