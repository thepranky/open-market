  page: '4'
  quote_snippet: For the purpose of this Decision, the Commission will assess the effects of
    the Transaction on the market for the wholesale supply of ceramic tiles and on the market
    for the wholesale supply of SHAP. Because the Transaction does not raise serious doubts
    as to its compatibility with the internal market under any plausible narrower market definition,
    it can be left open for the purpose of this Decision whether it is appropriate to further
    segment each of these two markets.
  extraction_method: pdf_extracted
