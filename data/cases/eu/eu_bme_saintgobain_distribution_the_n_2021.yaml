- passage_id: sp_2
  source_document_id: eu_bme_saintgobain_distribution_the_n_2021_decision
  page: '3'
  quote_snippet: According to the Notifying Party there is no need to further segment the wholesale
    supply of tiles market according to the type of material (e.g. ceramic, stone or concrete).
    Nonetheless, because SGDN only supplies ceramic tiles, the Notifying Party has provided
    market shares data on this narrower plausible segment. In addition, the Notifying Party
    submits that given supply-side substitution, there is no need to further segment the ceramic
    tiles market according to the end use, i.e. tiles for floors, on one hand, and tiles for
    walls, on the other.
  extraction_method: pdf_extracted
