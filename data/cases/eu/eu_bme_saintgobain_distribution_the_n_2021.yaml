  source_document_id: eu_bme_saintgobain_distribution_the_n_2021_decision
  page: '3'
  quote_snippet: 'The Commission has previously defined a market for the distribution of building
    products in general, and has considered but left open whether this market can be further
    divided into: (i) wholesale to retailers; (ii) retail sale to professional customers, primarily
    via GBM and SBM stores; and (iii) retail sale to non-professional customers, primarily through
    DIY stores.8'
