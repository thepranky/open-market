product_markets_considered:
- market_id: pm_1
  name: Wholesale supply of ceramic tiles
  definition_status: left_open
  notes: The Commission assessed this market but left open whether it should be further segmented
    by material type (e.g. ceramic, stone, concrete) or end-use (e.g. floors, walls).
- market_id: pm_2
  name: Wholesale supply of SHAP Products
  definition_status: left_open
  notes: The Commission assessed this market but left open whether it should be further segmented
    by subcategories of products (e.g. sanitary ware).
- market_id: pm_3
  name: Retail distribution of building materials to professional customers via GMB stores
  definition_status: left_open
  notes: The Commission left the exact market definition of retail sales of building products
    open but assessed the impact of the transaction based on this narrower plausible market
    definition.
- market_id: pm_4
  name: Retail distribution of interior finishing products, including dry finishing products,
    via SBM stores
  definition_status: left_open
  notes: The Commission left the exact market definition of retail sales of building products
    open but assessed the impact of the transaction based on this narrower plausible market
    definition.
geographic_markets_considered:
- market_id: gm_1
  name: Wholesale supply of ceramic tiles — national (Netherlands affected)
  definition_status: considered
  notes: The Commission examined this market at the national level for the purpose of the decision,
    noting that previous findings indicated at least national scope.
- market_id: gm_2
  name: Wholesale supply of SHAP Products — national (Netherlands affected)
  definition_status: considered
  notes: The Commission examined this market at the national level for the purpose of the decision,
    noting that previous findings indicated at least national scope.
- market_id: gm_3
  name: Retail distribution of building materials to professional customers via GMB stores —
    local/national (Netherlands affected)
  definition_status: left_open
  notes: The Commission left open whether the geographic scope for retail sale of building products
    is local or national, but assessed the impact under various plausible definitions.
- market_id: gm_4
  name: Retail distribution of interior finishing products, including dry finishing products,
    via SBM stores — local/national (Netherlands affected)
  definition_status: left_open
  notes: The Commission left open whether the geographic scope for retail sale of building products
    is local or national, but assessed the impact under various plausible definitions.
