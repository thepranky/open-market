  page: '9'
  quote_snippet: The market investigation has provided inconclusive results with respect to
    a possible segmentation of video game distribution by physical and digital distribution.44
    While a majority of publishers indicate that a game developer can easily switch between
    developing video games for physical and digital distribution channels, this is not supported
    by the distributors’ replies to the market investigation.45
