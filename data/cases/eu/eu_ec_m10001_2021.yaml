- passage_id: sp_6
  source_document_id: eu_ec_m10001_2021_decision
  page: '10'
  quote_snippet: As regards a possible segmentation of a hypothetical digital distribution market
    based on the payment model (upfront payment vs. subscription), the results of the market
    investigation indicate that such a segmentation is not warranted, in particular because
    digital payment models to a large extent are interchangeable.47 Similarly, the results of
    the market investigation do not support segmenting the hypothetical digital distribution
    market by types of players’ access (download vs. streaming).
  extraction_method: pdf_extracted
