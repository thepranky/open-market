product_markets_considered:
- market_id: pm_1
  name: Video games publishing
  definition_status: left_open
  notes: The Commission considered possible segmentation by hardware platform (PC, console,
    mobile), by game genre (e.g., action, adventure, role-playing), and by game type (e.g.,
    AAA, casual, free-to-play). Market investigation results were inconclusive for all, and
    the exact market delineation was ultimately left open. The assessment was conducted under
    all plausible definitions.
- market_id: pm_2
  name: Game distribution
  definition_status: left_open
  notes: The Commission considered a single distribution market or two hypothetically separate
    markets for physical and digital distribution. Segmentation of digital distribution by platform
    (PC, console, mobile) was also considered but inconclusive. However, segmentation of digital
    distribution by payment model (upfront vs. subscription) or access type (download vs. streaming)
    was deemed not warranted.
geographic_markets_considered:
- market_id: gm_1
  name: Video games publishing — EEA-wide and worldwide
  definition_status: left_open
  notes: The Commission considered both an EEA-wide and a worldwide scope. Market investigation
    confirmed at least EEA-wide, possibly worldwide, but views between publishers and distributors
    diverged on a worldwide scope. The exact delineation was left open.
- market_id: gm_2
  name: Game distribution — EEA-wide and worldwide
  definition_status: left_open
  notes: The market investigation confirmed the geographic scope for physical and digital game
    distribution is at least EEA-wide. The Commission considered both an EEA-wide and a worldwide
    scope. The exact delineation was left open.
