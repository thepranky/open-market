  source_document_id: eu_prince_ferro_2022_decision
  page: '10'
  quote_snippet: (37) In light of the elements set out above, the Commission considers that
    it could be appropriate to distinguish separate markets according to the type of end-application,
    i.e. automotive glass coatings, flat glass coatings, and container glass coatings, but ultimately
    leaves this question open, as that the competitive assessment would not significantly differ
    if an overall market or each specific plausible narrower market is considered.
