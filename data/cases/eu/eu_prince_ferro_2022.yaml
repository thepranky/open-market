  quote_snippet: (18) Glass coatings serve both functional (obscuration) and aesthetic (colour
    and decoration) purposes. Glass coatings are used for a variety of application techniques
    including automotive glass (to block UV rays from adhesive holding glass to frame), flat
    glass (e.g., appliance glass or architectural glass) and container glass (such as bottles).
