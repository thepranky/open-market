product_markets_considered:
- market_id: pm_1
  name: Porcelain enamel coatings
  definition_status: considered
  notes: The Commission considered an overall market for the manufacture and supply of porcelain
    enamel coatings, without further segmentation by end-use application.
- market_id: pm_2
  name: Glass coatings
  definition_status: left_open
  notes: Segmentation by end-use application (automotive, flat, container glass coatings) was
    left open. Segmentation by form (dry and liquid glass coatings) was considered not appropriate,
    and forehearth colorants were considered not appropriate to distinguish separately.
geographic_markets_considered:
- market_id: gm_1
  name: Porcelain enamel coatings — EEA-wide and alternative regional market including EEA and
    Turkey
  definition_status: left_open
  notes: The Commission considered the geographic scope to be EEA-wide, potentially including
    Turkey, but left the precise scope open as the competitive assessment would not materially
    differ under any plausible definition. The assessment was carried out on both EEA-wide and
    the alternative regional market.
- market_id: gm_2
  name: Glass coatings — EEA-wide
  definition_status: considered
  notes: The Commission considered the appropriate geographic scope for the market for the manufacture
    and supply of glass coatings overall, and all plausible narrower markets to be EEA-wide.
