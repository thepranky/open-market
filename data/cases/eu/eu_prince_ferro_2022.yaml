  page: '6'
  quote_snippet: (21) In the present case, the Commission noted, in line with the arguments
    put forward by the Notifying Party that glass coatings constitute a specific type of product
    in light of the raw materials used as an input for its manufacturing (frit powder, pigments
    and a liquid medium) different from other types of coatings, and the specific end-application
    purpose for which it is used in the industry.
