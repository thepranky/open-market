- passage_id: sp_8
  source_document_id: eu_cochlear_oticon_medical_decision
  page: '7'
  quote_snippet: 'The Notifying Party submits that the relevant geographic market for CIs is
    national because: (i) the specific indications for CIs may vary between EEA countries; (ii)
    customers'' purchasing behaviour differs from one EEA country to another; (iii) the sales,
    clinical and customer service organisations of CI manufacturers are national in scope; (iv)
    it is important to have national sales, clinical and customer service organisations to provide
    customer and patient support before and after surgery and aftercare support; and (v) the
    presence of specific reimbursement systems across the EEA has resulted in service, support,
    and price variations between EEA countries.'
  extraction_method: pdf_extracted
