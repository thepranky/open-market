product_markets_considered:
- market_id: pm_1
  name: Market for the manufacture and supply of cochlear implants (CIs)
  definition_status: defined
  notes: The Commission considered, for the purposes of this decision, that the relevant product
    market is the market for CIs. The investigation found CIs are not substitutable with other
    hearing solutions (hearing aids, other implantable hearing solutions, reconstructive surgery).
    No sub-segmentation by patient type (adults vs. children) or by implant vs. processor/accessories
    was found appropriate. The Notifying Party argued for a broader market including other hearing
    solutions and argued against sub-segmentation; both views were largely aligned on no sub-segmentation
    though differed on breadth. The Commission adopted the narrow CI-only market for this decision.
geographic_markets_considered:
- market_id: gm_1
  name: National markets for the manufacture and supply of cochlear implants (CIs)
  definition_status: considered
  notes: 'The Commission assessed the market for CIs at national level for the purpose of this
    decision, covering 13 Affected Jurisdictions: Bulgaria, Denmark, Finland, France, Ireland,
    Italy, Lithuania, Netherlands, Norway, Poland, Portugal, Spain, and Sweden. Key factors:
    differing medical indications, purchasing behaviours, reimbursement systems and prices across
    EEA countries; importance of local presence; reimbursement and purchasing at national level.
    Notifying Party submitted national scope; Commission confirmed this through market investigation.
    Precedent cited for medical devices being national in scope.'
