product_markets_considered:
- market_id: pm_1
  name: Heat pumps
  definition_status: left_open
  notes: The Commission considered segmenting the market for heat pumps based on (i) application
    into residential/light commercial and commercial/industrial, (ii) input source and output
    medium (e.g., Air-to-air, Air-to-water, Ground/Water/Waste-to-water), (iii) structure (wall-mounted
    and floor-standing), and (iv) architecture (monobloc and split heat pumps). However, the
    exact scope was left open due to no serious doubts under any delineation. The Commission
    noted that residential/light commercial and commercial/industrial applications generally
    differ in features, capacity (20-25kW often considered a threshold), and route-to-market.
    Also, G/W/W2W heat pumps are likely part of the same product market, while the status of
    A2A heat pumps (whether part of heat pump market or other HVAC systems) was left open.
- market_id: pm_2
  name: Boilers
  definition_status: left_open
  notes: 'The Commission considered segmenting the boiler market based on several parameters
    including: (i) application (residential/light commercial vs. commercial/industrial, with
    a 70kW threshold for assessment), (ii) capacity/power ranges (e.g., 0-69.9kW, 70-399.9kW),
    (iii) fuel used (oil, gas, hydrogen, biofuel, biomass), (iv) structure (wall hung/floor
    standing), (v) technology (condensing/non-condensing), (vi) pressure (up to 10 bar/110°C
    vs higher), and (vii) type (conventional heating-only vs. combination). The exact product
    market definition for boilers was left open as the transaction did not raise serious doubts
    under any alternative delineation, but these segmentations would be considered in the competitive
    assessment.'
- market_id: pm_3
  name: Commercial/industrial burners (above 70kW)
  definition_status: left_open
  notes: The Commission considered a product market for commercial/industrial burners, distinct
    from residential burners, based on features, capacity (70kW threshold for assessment), and
    other factors like fuel used. Further segmentations based on capacity/power ranges (e.g.,
    70-399.9kW, 400-999.9kW, above 1000 kW) and fuel type (oil, gas, dual fuel, green energy)
    were also considered for the competitive assessment. While temperature, technology, and
    application were mentioned in precedents, market participants did not consider them particularly
    relevant for further segmentation in this case. The exact product market definition was
    left open as the transaction did not raise serious doubts.
geographic_markets_considered:
- market_id: gm_1
  name: Heat pumps — national or EEA-wide
  definition_status: left_open
  notes: The market investigation indicated the market for heat pumps is national in scope due
    to differing competition conditions, regulatory differences between EEA Member States, the
    importance of local distributors/installers, and national customer preferences. However,
    the exact geographic market definition was left open between national or EEA-wide, as no
    competition concerns arose under any plausible definition.
- market_id: gm_2
  name: Boilers — national or EEA-wide
  definition_status: left_open
  notes: The Commission's market investigation for boilers indicated that suppliers often depend
    on local sales presence or distributors/installers, customers typically source nationally,
    conditions of competition differ between EEA countries, and there are barriers to entry
    related to local networks. While some suppliers are active across the EEA, local considerations
    are key. The exact geographic market definition was left open between national or EEA-wide,
    as the transaction did not raise serious doubts under any alternative definition.
- market_id: gm_3
  name: Commercial/industrial burners — at least EEA-wide
  definition_status: defined
  notes: The Commission concluded that the geographic market for commercial/industrial burners
    is at least EEA-wide. This was supported by OEM customers sourcing at EEA or worldwide levels
    with standard framework contracts, suppliers active worldwide, and regulatory differences
    between EEA Member States not having a significant impact. Even non-OEM customers, while
    sourcing nationally, would consider regional or EEA-level suppliers.
