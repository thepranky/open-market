  page: '14'
  quote_snippet: In any event, the exact scope of product market definition with respect to
    container ships can be left open since the Transaction would not raise serious doubts as
    to its compatibility with the internal market under any plausible alternative product market
    definition and irrespective of whether a separate market is defined according to the Clarksons
    categorisation for Neo-Panamax 12-14 999 TEU container ships.
  extraction_method: pdf_extracted
