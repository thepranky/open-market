product_markets_considered:
- market_id: pm_1
  name: Construction and supply of container ships
  definition_status: left_open
  notes: The Commission considered different size categories (Feeder, Intermediate, Neo-Panamax,
    Post-Panamax) based on TEU capacity, noting limited demand-side and supply-side substitutability.
    However, the exact scope was left open as the transaction would not raise serious doubts
    under any plausible definition.
- market_id: pm_2
  name: Construction and supply of bulk carriers
  definition_status: left_open
  notes: The Commission considered different size categories (by DWT) and port/region-specific
    categories (e.g., Kamsarmax, Newcastlemax), noting a common understanding among market participants
    but also some demand-side and supply-side substitutability for adjacent categories. The
    exact market definition was left open as the transaction would not raise serious doubts.
- market_id: pm_3
  name: Construction and supply of PCTCs
  definition_status: left_open
  notes: The Commission considered segmentation based on the number of vehicles carried (e.g.,
    above 6,000 cars), finding mixed responses from market participants regarding demand-side
    and supply-side substitutability. The exact market definition was left open as the transaction
    would not raise serious doubts.
geographic_markets_considered:
- market_id: gm_1
  name: Construction and supply of container ships — worldwide
  definition_status: considered
  notes: The Commission considered the geographic market for container ships to be worldwide
    in scope, consistent with previous decisions and market investigation findings.
- market_id: gm_2
