  page: '21'
  quote_snippet: However, the exact scope of product market definition with respect to PCTCs
    can be left open since the Transaction does not raise serious doubts as to its compatibility
    with the internal market under any plausible alternative product market definition and irrespective
    of whether all types of PCTCs belong to a single product market or whether different segmentations
    of PCTCs can be identified for (i) less than 2 000 cars; (ii) between 2 000 and 3 999 cars;
    (iii) between 4 000 and 5 999 cars; and (iv) above 6 000 cars.
