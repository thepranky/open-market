source_passages:
- passage_id: sp_1
  source_document_id: eu_ec_m9936_2020_decision
  page: '13'
  quote_snippet: The results of the market investigation discussed above support the appropriateness
    of distinguishing between different categories of container ships, based on size – in particular
    their TEU capacity. While some market participants referred to different dividing lines
    between container ship segments, the categorisation according to Clarksons is widely used
    by industry participants. There appears to be virtually no demand side substitutability,
    while there does appear to be some limited level of supply side substitutability when considering
    smaller categories of container ships or the intersection between the large Neo-Panamax
    12-14 999 TEU ships and Post-Panamax ships. Nevertheless, when considering large container
    ships, including Neo-Panamax 12-14 999 TEU ships, only few shipbuilders are capable of producing
    them.
  extraction_method: pdf_extracted
  review_status: unreviewed
