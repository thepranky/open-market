- passage_id: sp_4
  source_document_id: eu_ec_m9936_2020_decision
  page: '18'
  quote_snippet: The results of the market investigation discussed above indicate that it may
    be appropriate to distinguish between different categories of bulk carriers based on size
    (by DWT) and on type of port or region. However, the exact categories according to which
    distinction should be made for the purpose of market definition are not clear. While these
    categories appear to be widely used by industry participants, there appears to be some level
    of demand- and supply-side substitutability when considering adjacent categories of bulk
    carriers.
  extraction_method: pdf_extracted
