- passage_id: sp_6
  source_document_id: eu_ec_m9936_2020_decision
  page: '19'
  quote_snippet: In any event, since the Transaction does not raise serious doubts as to its
    compatibility with the internal market under any plausible product market definition, it
    can be left open whether all types of bulk carriers belong to a single product market or
    whether distinct markets should be identified for various bulk carriers segments (i.e. into
    (i) Small (DWT <10 000); (ii) Handysize (DWT 10 000 - <40 000); (iii) Handymax (DWT 40 000
    – <65 000); (iv) Panamax (DWT 65 000 - <80 000); (v) Panamax (DWT 80 000 - <100 000); and
    (vi) Capesize (DWT >100 000)) or according to specific ports or regions (i.e. into (i) Kamsarmax
    (DWT 80 000 – 90 000); (ii) Dunkirkmax (DWT 170 000 – 180 000); (iii) Newcastlemax (DWT
    180 000 – 190 000); and (iv) Setouchmax (DWT 200 000 – 210 000).
  extraction_method: pdf_extracted
