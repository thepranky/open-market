- passage_id: sp_2
  source_document_id: eu_ec_m9936_2020_decision
  page: '9'
  quote_snippet: 'Contrary to the submission by the Notifying Parties, market participants appear
    to have a common understanding of different container ship categories based on size (delineated
    by TEU capacity in particular). This holds specifically for categories reported on by industry
    publication Clarksons Research, namely: Feeder (<3 000 TEU), Intermediate (3-7 999 TEU),
    Neo-Panamax (8-11 999 TEU), Neo-Panamax (12-14 999 TEU), and Post-Panamax (15 000+ TEU).'
  extraction_method: pdf_extracted
  review_status: unreviewed
