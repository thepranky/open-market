product_markets_considered:
- market_id: pm_1
  name: Industrial services
  definition_status: left_open
  notes: The Commission previously considered segmenting the market for industrial services
    between installation services and maintenance services, and further sub-segmenting by industrial
    sectors such as oil & gas, energy, chemical, and life sciences. However, for the purpose
    of this case, the exact product market definition was left open, while the competitive assessment
    was conducted based on the narrowest plausible markets.
- market_id: pm_2
  name: Installation services in the oil & gas sector
  definition_status: considered
  notes: For the purpose of this case, the competitive assessment was conservatively conducted
    based on this narrow market definition.
- market_id: pm_3
  name: Maintenance services in the oil & gas sector
  definition_status: considered
  notes: For the purpose of this case, the competitive assessment was conservatively conducted
    based on this narrow market definition.
- market_id: pm_4
  name: Maintenance services in the energy sector
  definition_status: considered
  notes: For the purpose of this case, the competitive assessment was conservatively conducted
    based on this narrow market definition. Table 3 refers to this market as 'Maintenance, Power
    plants'.
geographic_markets_considered:
- market_id: gm_1
  name: Geographic market for industrial services
  definition_status: left_open
  notes: The Commission previously considered that the markets for industrial services could
    be EEA-wide or national, but ultimately left the exact geographic market definition open.
    Market investigation indicated that geographic scope might differ for installation services
    (potentially broader) and maintenance services (customer proximity more important). For
    the purpose of this case, the competitive assessment was conservatively conducted at a national
    level.
- market_id: gm_2
  name: Installation services in the oil & gas sector — national (the Netherlands affected)
  definition_status: considered
  notes: For the purpose of this case, the competitive assessment was conservatively conducted
    based on a national geographic scope, specifically the Netherlands, for this market.
- market_id: gm_3
  name: Maintenance services in the oil & gas sector — national (the Netherlands affected)
  definition_status: considered
  notes: For the purpose of this case, the competitive assessment was conservatively conducted
    based on a national geographic scope, specifically the Netherlands, for this market.
- market_id: gm_4
  name: Maintenance services in the energy sector — national (the Netherlands affected)
  definition_status: considered
  notes: For the purpose of this case, the competitive assessment was conservatively conducted
    based on a national geographic scope, specifically the Netherlands, for this market.
