source_passages:
- passage_id: sp_1
  source_document_id: eu_bilfinger_stork_europe_2024_decision
  page: '3'
  quote_snippet: In a previous decision the Commission has considered segmenting the market
    for industrial services between installation services and maintenance services. Installation
    is the first setup of a piece of industrial equipment (such as static or rotary mechanical
    equipment, piping, electrical equipment and instrumentation, insulation, painting and scaffolding,
    etc.) in a production plant, while maintenance is the ongoing inspection and servicing of
    industrial equipment. The Commission has also considered further sub-segmenting those market
    according to industrial sectors, such as oil & gas, energy, chemical, life sciences.
  extraction_method: pdf_extracted
  review_status: unreviewed
