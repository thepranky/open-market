  source_document_id: eu_ec_m9883_2020_decision
  page: '6'
  quote_snippet: In light of the above, the Commission considers that each of n-BuAc and iso-BuAc
    constitutes a separate product market. Regarding a possible sub-segmentation of n-BuAc by
    purity level, the question can be left open, since under any possible product market definition
    (n-BuAc overall, normal grade n-BuAc with a purity of 99.0% and high purity grade n-BuAc
    with a purity of at least 99.5%), the Transaction does not give rise to serious doubts as
    to its compatibility with the internal market.
