product_markets_considered:
- market_id: pm_1
  name: Acetic acid
  definition_status: defined
  notes: The Commission concluded that acetic acid constitutes a separate product market without
    any further sub-segmentations, consistent with past precedents and market investigation
    results.
- market_id: pm_2
  name: Butyl Acetate (n-BuAc and iso-BuAc)
  definition_status: segmented
  notes: The Commission found that n-BuAc and iso-BuAc constitute separate product markets.
    The question of a further sub-segmentation of n-BuAc by purity level was left open, as the
    Transaction did not raise serious doubts under any possible definition.
- market_id: pm_3
  name: Acrylonitrile (ACN)
  definition_status: defined
  notes: The Commission concluded that ACN constitutes a distinct product market without any
    further sub-segmentations, consistent with past precedents and market investigation results.
- market_id: pm_4
  name: Vinyl acetate monomer (VAM)
  definition_status: defined
  notes: The Commission found VAM to constitute a separate product market that should not be
    further segmented, in line with previous decisions.
- market_id: pm_5
  name: S-PVC co-polymers
  definition_status: defined
  notes: The Commission considered S-PVC co-polymers a separate product market from other types
    of S-PVC for the purposes of this decision.
geographic_markets_considered:
- market_id: gm_1
  name: Acetic acid — world-wide
  definition_status: defined
  notes: The Commission concluded that the relevant geographic market for acetic acid is worldwide,
    consistent with precedents, notifying party's views, and market investigation results.
- market_id: gm_2
  name: Butyl Acetate (“BuAc”) — worldwide / EEA + Turkey / EEA
  definition_status: left_open
  notes: The exact scope of the geographic market for BuAc was left open, as the Transaction
    did not raise serious doubts under any of the possible definitions (worldwide, EEA + Turkey,
    or EEA).
- market_id: gm_3
  name: Acrylonitrile (“ACN”) — worldwide / EEA + Turkey / EEA
  definition_status: left_open
  notes: The exact scope of the geographic market for ACN was left open, as the Transaction
    did not raise serious doubts under any of the possible definitions (worldwide, EEA + Turkey,
    or EEA). Market investigation respondents unanimously considered it worldwide.
- market_id: gm_4
  name: Vinyl acetate monomer (“VAM”) — world-wide
  definition_status: defined
  notes: The Commission found the relevant geographic market for VAM to be worldwide, consistent
    with previous decisions.
- market_id: gm_5
  name: S-PVC co-polymers — NWE / Western Europe / EEA
  definition_status: left_open
  notes: The exact scope of the geographic market for S-PVC co-polymers was left open, as the
    Transaction did not raise serious doubts under any of the possible definitions (NWE, Western
    Europe, or EEA).
