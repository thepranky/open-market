  quote_snippet: The Commission assessed whether the provision of hotel OTA services belongs
    to a separate market from the flight OTA services and concludes that flight and hotel OTA
    services belong to two separate markets. The Commission also assessed whether hotel OTA
    services and private accommodation OTA services belong to separate markets. It concludes
    that this is the case and that hotel OTA services constitute a separate market within the
    broader market of accommodation OTA services.
