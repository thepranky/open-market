case_id: eu_booking_etraveli_2023
case_name: Booking Holdings / eTraveli Group
authority: European Commission
jurisdiction: EU
sector: online travel / digital platforms
outcome: blocked
decision_date: '2023-09-25'
parties: []
source_documents:
- doc_id: eu_booking_etraveli_2023_decision
  title: Booking Holdings / eTraveli Group
  pdf_url: https://ec.europa.eu/competition/mergers/cases1/202451/M_10615_10430872_121034_7.pdf
  doc_type: merger_decision
  retrieval_status: direct
product_markets_considered:
- market_id: pm_1
  name: Hotel OTA services
  definition_status: defined
  notes: The Commission concluded that hotel OTA services constitute a separate product market,
    distinct from flight OTA services, private/other accommodation OTA services, brick-and-mortar
    travel agencies, MSS, and hotel TSPs (direct online channel). The Commission found that
    flight and hotel OTA services belong to two separate markets, and further that hotel OTA
    services form a separate market from private accommodation OTA services. Booking holds a
    dominant position in this market in the EEA with market shares well above 50%.
- market_id: pm_2
  name: Flight OTA services
  definition_status: defined
  notes: The Commission concluded that flight OTA services constitute a separate product market,
    distinct from hotel OTA services and from flight TSPs (airlines). ETG is the primary party
    active in this market. The EEA flight OTA market is relatively fragmented, with eDreams
    as market leader (20-30%), followed by ETG (10-20%) and Trip.com (10-20%).
- market_id: pm_3
  name: Private/other accommodation OTA services
  definition_status: defined
  notes: The Commission concluded that hotel OTA services and private accommodation OTA services
    belong to separate markets. Airbnb is identified as a leading provider in private accommodation
    OTA services. This market is ancillary to the main assessment, which focuses on hotel OTA
    services.
- market_id: pm_4
  name: MSS (metasearch services)
  definition_status: defined
  notes: The Commission confirmed its previous decisional practice that OTAs belong to a distinct
    product market from MSS. MSS show and compare prices from different providers and redirect
    customers to OTA/TSP platforms, while OTAs allow customers to book directly. MSS are remunerated
    on a CPC or CPA basis, while OTAs are remunerated through commissions.
- market_id: pm_5
  name: Brick-and-mortar travel agency services
  definition_status: defined
  notes: The Commission concluded that brick-and-mortar agencies and OTAs belong to separate
    product markets, in line with previous practice. Key distinguishing factors include different
    characteristics/functions, breadth of choice, visibility, commission levels, and business
    models.
- market_id: pm_6
  name: Commercial affiliate agreements for OTA services
  definition_status: defined
  notes: The Commission assessed whether commercial affiliate agreements (where one OTA supplies
    another a type of travel service at a fee) constitute a distinct product market. The Commission
    concluded that commercial affiliate agreements are add-on services for OTA and do not constitute
    a distinct market.
- market_id: pm_7
  name: Hotel OTA market
  definition_status: defined
  notes: The Commission refers to the hotel OTA market as the relevant market in which the competition
    concerns arise. The conclusion section explicitly states the Transaction would cause a SIEC
    by strengthening Booking's dominant position in this market.
- market_id: pm_8
  name: Flight OTA market
  definition_status: considered
  notes: The flight OTA market is referenced in the context of assessing claimed efficiencies.
    The Commission notes that the alleged efficiency benefits relate to customers in the flight
    OTA market, not the hotel OTA market where competition concerns arise. Not formally defined
    but used as a working reference.
geographic_markets_considered:
- market_id: gm_1
  name: EEA-wide hotel OTA market
  definition_status: considered
  notes: For the purposes of this merger control Decision, the Commission considers that the
    geographic scope of the OTA market is likely to be EEA-wide. This applies to both the hotel
    and flight OTA markets. The Commission found that the main OTAs provide services at the
    EEA level with rather homogeneous offerings across Member States, language barriers have
    reduced, and legislative frameworks are largely harmonised. The Commission also analysed
    market shares at the individual Member State level as part of its market reconstruction.
- market_id: gm_2
  name: EEA
  definition_status: considered
  notes: The EEA is used as the relevant geographic scope throughout the commitments assessment
    and conclusion. The Transaction is declared incompatible with the internal market and the
    functioning of the EEA Agreement.
theories_of_harm:
- theory_id: toh_1
  name: 'Conglomerate / vertical effects: cross-selling of hotel services to flight customers
    strengthening Booking''s dominant position in hotel OTA market'
  theory_type: conglomerate
  theory_outcome: upheld
  description: The Commission found that the Transaction would allow Booking to acquire additional
    flight customers via eTraveli Group (ETG) and cross-sell accommodation to those customers,
    leveraging brand strength and customer inertia to strengthen its dominant position in the
    hotel OTA market. The Commission rejected both sets of proposed commitments (Initial and
    Revised) as insufficient to eliminate this concern, and declared the Transaction incompatible
    with the internal market.
