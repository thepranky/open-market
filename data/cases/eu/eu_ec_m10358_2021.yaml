- passage_id: sp_1
  source_document_id: eu_ec_m10358_2021_decision
  page: '3'
  quote_snippet: (10) Merchant acquiring comprises a set of services that allows merchants to
    accept card-based payments via POS terminals or online. Merchant acquirers typically offer
    their services directly to merchants (retail merchant acquiring). In Italy, merchant acquirers
    also offer services to partner banks who ultimately control the commercial relationship
    with merchants (wholesale merchant acquiring).
  extraction_method: pdf_extracted
