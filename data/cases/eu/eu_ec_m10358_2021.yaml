- passage_id: sp_2
  source_document_id: eu_ec_m10358_2021_decision
  page: '3'
  quote_snippet: '(14) The Commission considers that, for the purposes of this decision, in
    line with the decisional practice described above: (i) wholesale and retail merchant acquiring
    constitute separate markets in Italy; (ii) POS merchant acquiring and e-commerce merchant
    acquiring constitute separate markets; and (iii) whether any additional segmentations are
    relevant for merchant acquiring can be left open, as the possible segmentation does not
    materially affect the Commission’s assessment of the Transaction.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
