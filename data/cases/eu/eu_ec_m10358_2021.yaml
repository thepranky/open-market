- passage_id: sp_5
  source_document_id: eu_ec_m10358_2021_decision
  page: '4'
  quote_snippet: (16) In its decisional practice in terms of product market definition, the
    Commission found that there are separate markets for (i) the manufacture and supply of POS
    terminals and (ii) the provision and management of POS terminals.12 The Commission has also
    considered further segmenting relevant markets based on the type of POS terminal (traditional,
    mobile, or smart POS terminals), or on customer size (large merchants or small/medium companies).13
    In terms of geographic market definition, the Commission found that markets for the provision
    and management of POS terminals are likely national in scope.14
  extraction_method: pdf_extracted
