- passage_id: sp_3
  source_document_id: eu_ec_m10358_2021_decision
  page: '3'
  quote_snippet: '(11) In its decisional practice in terms of product market definition, the
    Commission defined separate relevant markets for retail and for wholesale merchant acquiring
    services in Italy only.7 The Commission also considered sub-segmenting (retail) merchant
    acquiring based on: (i) the payment card scheme (domestic or international); (ii) the payment
    card brand (e.g., VISA or Mastercard); (iii) the payment card type (credit or debit); (iv)
    the payment platform (POS merchant acquiring or e-commerce merchant acquiring); and (v)
    the size of the merchant (large merchants or small/medium companies) but ultimately left
    these questions open.8'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
