product_markets_considered:
- market_id: pm_1
  name: Merchant acquiring
  definition_status: segmented
  notes: The Commission formally segmented merchant acquiring into retail and wholesale in Italy,
    and into POS and e-commerce globally. Other segmentations were left open. The notifying
    parties considered other segmentations no longer relevant.
- market_id: pm_2
  name: Provision and management of POS terminals
  definition_status: considered
  notes: The Commission considered the relevant market to be the provision and management of
    POS terminals for this decision, in line with prior practice. Further segmentations were
    left open.
- market_id: pm_3
  name: Acquiring processing services
  definition_status: defined
  notes: The Commission defined a separate market for acquiring processing services with no
    further sub-segmentation.
geographic_markets_considered:
- market_id: gm_1
  name: Merchant acquiring — EEA-wide or national (geographic scope left open)
  definition_status: left_open
  notes: The Commission left open whether markets for merchant acquiring are national or EEA-wide
    in scope, as it did not materially affect the assessment.
- market_id: gm_2
  name: Provision and management of POS terminals — EEA-wide or national (geographic scope left
    open)
  definition_status: left_open
  notes: The Commission left open whether markets for POS provision and management are national
    or EEA-wide, as it did not materially affect the assessment.
- market_id: gm_3
  name: Acquiring processing — EEA-wide (geographic scope left open)
  definition_status: left_open
  notes: The Commission found that acquiring processing is likely EEA-wide in scope, but left
    the question open.
