- passage_id: sp_6
  source_document_id: eu_ec_m10358_2021_decision
  page: '4'
  quote_snippet: (17) The Notifying Parties consider that POS terminal provision and management
    such as the one provided by the target form part of a larger market for payment acceptance
    solutions encompassing POS terminals and e-commerce acceptance solutions.15 The Notifying
    Parties also consider that the relevant geographic market is EEA-wide in scope, due to technological
    and regulatory changes, as well as consolidation of the industry.16
