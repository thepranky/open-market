product_markets_considered:
- market_id: pm_1
  name: Nitrogen based fertilizers (including CAN, UAN, AN, urea)
  definition_status: left_open
  notes: The Commission left open whether to distinguish between markets for Calcium Ammonium
    Nitrate (CAN), Urea Ammonium Nitrate (UAN), Ammonium Nitrate (AN) and urea, or to define
    wider markets for all straight nitrogen fertilizers or all nitrogen fertilizers, as the
    transaction did not raise serious doubts under any of these plausible definitions.
- market_id: pm_2
  name: Production and supply of CAN
  definition_status: considered
  notes: The Commission assessed the transaction based on a narrow market for CAN, explicitly
    considering it as a plausible definition for analysis, even though the broader nitrogen
    fertilizer market definition was left open. This specific market was identified as affected
    due to horizontal overlaps.
- market_id: pm_3
  name: Retail sale of mineral fertilizers to end-customers
  definition_status: defined
  notes: The Commission confirmed its previous finding that there is a market for the distribution
    of all types of mineral fertilizers and did not find evidence to depart from this definition.
- market_id: pm_4
  name: AdBlue
  definition_status: left_open
  notes: The Commission confirmed that AdBlue could form a separate product market but left
    open whether it should encompass only trademarked AdBlue or also non-branded urea solutions
    with the same concentration, as the transaction did not raise serious doubts under either
    definition.
- market_id: pm_5
  name: Aqueous ammonia
  definition_status: considered
  notes: The Commission considered a separate market for aqueous ammonia, distinct from anhydrous
    ammonia, consistent with previous findings and market investigation results.
- market_id: pm_6
  name: Weak nitric acid
  definition_status: defined
  notes: The Commission defined weak nitric acid as a separate product market, distinct from
    azeotropic and concentrated nitric acid, based on different applications, lack of demand-side
    substitutability, and different production processes.
geographic_markets_considered:
- market_id: gm_1
  name: Nitrogen based fertilizers (including CAN, UAN, Urea) — EEA-wide
  definition_status: considered
  notes: The Commission considered the market to be at least EEA-wide in scope, noting that
    previous decisions had considered it at least EEA-wide and potentially wider. Market investigation
    confirmed an at least EEA-wide scope.
- market_id: gm_2
  name: Production and supply of CAN — EEA-wide
  definition_status: considered
  notes: The Commission considered an EEA-wide geographic scope for CAN, based on market investigation
    findings and consistency with the broader nitrogen fertilizer market.
- market_id: gm_3
  name: Retail sale of mineral fertilizers to end-customers — national (Czechia, Slovakia, Hungary,
    Romania, Croatia, Poland affected)
  definition_status: defined
  notes: The Commission confirmed its previous finding that in the distribution market, sales
    to retailers and end-customers are considered on a national basis. This market is identified
    as forming vertical links in Czechia, Slovakia, Hungary, Romania, Croatia, and Poland.
- market_id: gm_4
  name: AdBlue — EEA-wide
  definition_status: defined
  notes: The Commission confirmed an EEA-wide geographic market for AdBlue, consistent with
    previous decisions and market investigation findings.
- market_id: gm_5
  name: Aqueous ammonia — EEA-wide, regional, or 1,000 km catchment area
  definition_status: left_open
  notes: The Commission left open whether the geographic market for aqueous ammonia should be
    considered as EEA-wide, regional or based on a 1,000 kilometres catchment area around the
    production plant, as the transaction would not give rise to any competition concerns on
    any plausible geographic market.
- market_id: gm_6
  name: Weak nitric acid — EEA-wide, regional, or 1,000 km catchment area
  definition_status: left_open
  notes: The Commission left open whether the geographic market for weak nitric acid should
    be considered as EEA-wide, regional or based on a 1,000 kilometres catchment area around
    the production plant, as the transaction would not give rise to any competition concerns
    on any plausible geographic market.
