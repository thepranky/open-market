- passage_id: sp_7
  source_document_id: eu_agrofert_borealis_nitro_2023_decision
  page: '8'
  quote_snippet: The results of the market investigation confirm that there is a separate product
    market for AdBlue.47 While the market investigation suggested there is supply-side substitutability
    between AdBlue and other products produced by diluting concentrated urea, it also confirmed
    that AdBlue is a separate product with limited, if any, demand-side substitutability between
    trademarked AdBlue and other urea solutions with the same chemical composition. As such,
    while producers can easily change the ratio at which they dilute urea prills, the vast majority
    of customers confirmed that they only purchase trademarked AdBlue solutions and would not
    consider purchasing urea of the same concentration without the trademark.48 In practice
    therefore, because there is little if any demand-side substitutability between trademarked
    AdBlue and urea diluted to the same concentration, the Commission considers there could
    be a separate product market that only encompasses AdBlue.
  extraction_method: pdf_extracted
  review_status: unreviewed
