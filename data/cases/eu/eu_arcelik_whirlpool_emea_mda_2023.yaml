- passage_id: sp_5
  source_document_id: eu_arcelik_whirlpool_emea_mda_2023_decision
  page: '6'
  quote_snippet: The Commission concludes that for the purpose of this decision the exact definition
    of the relevant product market can be left open, as far as the distinction between into
    built-in and freestanding appliances is concerned, as the Transaction does not raise serious
    doubts on the basis of any plausible definition of the relevant product market. Therefore,
    for the purpose of the decision, the Commission will conduct its competitive assessment
    on the basis of each separate MDA category, further segmented into built-in and freestanding
    appliances.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
