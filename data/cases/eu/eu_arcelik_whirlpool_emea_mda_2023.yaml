- passage_id: sp_4
  source_document_id: eu_arcelik_whirlpool_emea_mda_2023_decision
  page: '4'
  quote_snippet: The Notifying Party submits that there are no grounds for further segmenting
    the MDA markets into built-in versus freestanding appliances. According to the Notifying
    Party, this is because there is a high supply-side and demand-side substitutability and
    most of the major MDA manufacturers produce both built-in and freestanding MDA.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
