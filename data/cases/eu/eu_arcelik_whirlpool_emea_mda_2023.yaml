- passage_id: sp_11
  source_document_id: eu_arcelik_whirlpool_emea_mda_2023_decision
  page: '7'
  quote_snippet: The Notifying Party argues that the markets for the manufacture and supply
    of MDAs are EEA-wide due to (i) the presence of MDA manufacturers across Europe; (ii) the
    lack of meaningful barriers to entry or expansion; (iii) a centralised manufacturing; (iv)
    the significant level of imports into the EEA to serve all hypothetical national markets;
    (v) the little product differentiation across Europe; (vi) the presence of large retail
    customers across Europe; (vii) customer purchases being managed at the European level; (viii)
    the Parties' strategies being decided at the European level; (ix) and the market shares
    at the hypothetical national level not being informative of the Parties' competitive strength.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
