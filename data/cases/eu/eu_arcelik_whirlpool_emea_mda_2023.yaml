  quote_snippet: In line with the Commission’s prior decisional practice, the results of the
    market investigation confirm that separate markets exist for each of the MDA categories
    (i.e. (i) cooking appliances, (ii) hoods, (iii) dishwashers, (iv) refrigerators, (v) freezers,
    (vi) microwave ovens, (vii) washing machines and (viii) tumble dryers).
