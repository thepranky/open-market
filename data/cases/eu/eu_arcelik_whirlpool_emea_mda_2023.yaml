product_markets_considered:
- market_id: pm_1
  name: MDA categories (cooking appliances, hoods, dishwashers, refrigerators, freezers, microwave
    ovens, washing machines, tumble dryers)
  definition_status: defined
  notes: The Commission confirmed previous decisional practice identifying separate relevant
    product markets for each category of Major Domestic Appliances (MDA).
- market_id: pm_2
  name: Cooking appliances sub-segmentation (hobs, cookers, ovens)
  definition_status: left_open
  notes: The market investigation was inconclusive regarding further sub-segmentation of cooking
    appliances.
- market_id: pm_3
  name: MDA — Built-in vs. Freestanding Appliances
  definition_status: left_open
  notes: The exact market definition for built-in versus freestanding MDA was left open, but
    the competitive assessment would be conducted on this segmented basis. Market investigation
    confirmed to a certain degree the segmentation, noting differences in supply-side (production
    lines, investments) and demand-side substitutability, as well as price differences.
- market_id: pm_4
  name: MDA — Connected vs. Non-connected Appliances
  definition_status: defined
  notes: The Commission concluded that smart/connected and non-connected MDA belong to the same
    relevant market, based on market investigation results confirming strong supply-side substitution
    and customers not being driven by connected features.
- market_id: pm_5
  name: Sale of Small Domestic Appliances (SDA) — various product categories
  definition_status: considered
  notes: The Commission referenced past decisions where it examined SDA markets comprising thirteen
    product categories. This market definition was applied for assessing the minority shareholding,
    not for the main merger.
geographic_markets_considered:
- market_id: gm_1
  name: Manufacture and supply of MDA — EEA-wide or national
  definition_status: left_open
  notes: The Commission left open the exact geographic scope for MDA markets (EEA-wide or national),
    as the transaction did not raise serious doubts under any plausible definition. However,
    market investigation results suggested markets were most likely national in scope, citing
    demand patterns, price negotiation at national level, local presence importance, brand varying
    importance, and national marketing campaigns.
- market_id: gm_2
  name: Sale of Small Domestic Appliances (SDA) — National
  definition_status: considered
  notes: For Small Domestic Appliances, the Commission applied a precedent that concluded SDA
    markets are national in scope.
theories_of_harm: []
commitments: []
