  source_document_id: eu_arcelik_whirlpool_emea_mda_2023_decision
  page: '4'
  quote_snippet: The Notifying Party further submits that there are no grounds for segmenting
    the MDA markets into connected versus non-connected appliances. This is because there is
    strong supply-side substitution between smart/connected MDA and non-connected MDA in both
    directions. According to the Notifying Party, every manufacturer that produces non-connected
    MDA also produces smart/connected MDA.
  extraction_method: pdf_extracted
