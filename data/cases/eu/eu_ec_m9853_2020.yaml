  definition_status: considered
  notes: Assessed as a potential narrower market segment within dry bulk transport.
- market_id: pm_6
  name: Stevedoring/transhipment services
  definition_status: left_open
  notes: The Commission assessed these services as one market but left the precise definition
    open regarding subdivisions by cargo type or port type.
- market_id: pm_7
  name: Stevedoring/transhipment services in private ports
  definition_status: considered
  notes: This narrower market for services in private ports was considered in the assessment
    of affected markets.
- market_id: pm_8
  name: Inland port infrastructure
  definition_status: defined
  notes: The Commission found a distinct product market for inland port infrastructure, separate
    from other inland waterway transport markets. The question of sub-division into public/private
    ports was left open for this market.
- market_id: pm_9
  name: Public inland ports infrastructure
  definition_status: considered
  notes: The Commission assessed the transaction based on the more narrow potential market of
    public inland ports as the notifying party's main activity was in this segment and the target
    was not active in port infrastructure at all.
