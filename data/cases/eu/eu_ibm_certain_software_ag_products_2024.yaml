- passage_id: sp_1
  source_document_id: eu_ibm_certain_software_ag_products_2024_decision
  page: '5'
  quote_snippet: According to Gartner, AIS (formerly named Enterprise Service Bus (“ESB”) Suites)
    are “a set of software functionality, founded on an ESB, that can support optional mediation
    functions, particularly for application programming interface/service oriented architecture
    scenarios, and also can support traditional, heterogeneous application integration projects”.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
