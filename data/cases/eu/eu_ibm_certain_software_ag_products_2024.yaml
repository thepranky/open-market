  page: '8'
  quote_snippet: In any event, the Commission considers that, for the purposes of this Decision,
    the exact product market definition with regard to the supply of AIS can be left open, as
    the Transaction would not raise serious doubts as to its compatibility with the internal
    market even under the narrowest plausible product market definition (i.e., a market for
    AIS), for which market share data is available, based on the Gartner segmentation.
