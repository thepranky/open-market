  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_2
  source_document_id: eu_ibm_certain_software_ag_products_2024_decision
  page: '7'
  quote_snippet: The Commission has not identified any reasons in this case to deviate from
    its precedents (see Section 4.2.1.1.) in which it defines the software industry markets
    by reference to segments published by market intelligence reports, notably reports adopted
    by Gartner and/or IDC. Therefore, the Commission will carry out its competitive assessment
    on the basis of the narrowest plausible product market segments identified by the Notifying
    Party in accordance with IDC and Gartner segmentations for which market share data is available,
    and which are affected based on the most recent market share data available at the time
    of notification (namely, on the basis of the 2023 IDC and 2022 Gartner market share data).
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
