  pdf_url: http://publications.europa.eu/resource/cellar/e9f064d6-8480-11ee-99ba-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Wrought aluminium
  definition_status: defined
  notes: The Commission concluded that wrought aluminium constitutes a separate product market,
    distinct from cast aluminium, due to intrinsic differences, customer needs, and manufacturing
    processes.
- market_id: pm_2
  name: Wrought recycled aluminium for can bodies (series 3xxx)
  definition_status: defined
  notes: This market is a segmentation of wrought aluminium based on specific alloy series (3xxx)
    for beverage can bodies, focusing on recycled input due to its importance. The segmentation
    by shape (solid vs liquid) was found not relevant.
- market_id: pm_3
  name: Wrought recycled aluminium for can ends (series 5xxx)
  definition_status: defined
  notes: This market is a segmentation of wrought aluminium based on specific alloy series (5xxx)
    for beverage can ends, focusing on recycled input due to its importance. The segmentation
    by shape (solid vs liquid) was found not relevant.
- market_id: pm_4
  name: Recycling services for wrought dross
  definition_status: defined
  notes: The Commission concluded that recycling services for wrought dross constitute a separate
    product market from foundry/cast dross, based on demand-side non-substitutability (dross
    characteristics, end-product) and supply-side specialization of recyclers (wrought vs. cast).
- market_id: pm_5
  name: Salt slag recycling services
  definition_status: defined
  notes: The Commission concluded the product market scope is salt slag recycling, irrespective
    of the technology used (zero-waste vs. non-zero-waste), even though technologies are highly
    differentiated.
- market_id: pm_6
  name: FRPs for beverage can bodies
  definition_status: defined
  notes: The Commission considered FRPs for beverage can bodies a separate product market, in
    line with previous decisional practice and confirmed by market investigation.
- market_id: pm_7
  name: FRPs for beverage can ends
  definition_status: defined
  notes: The Commission considered FRPs for beverage can ends a separate product market, in
    line with previous decisional practice and confirmed by market investigation.
- market_id: pm_8
  name: FRPs for food cans
  definition_status: considered
  notes: Mentioned as a product market definition from previous Commission decisions, but not
    explicitly assessed in this case's findings.
- market_id: pm_9
  name: FRPs for aluminium foil
  definition_status: considered
  notes: Mentioned as a product market definition from previous Commission decisions, but not
    explicitly assessed in this case's findings.
- market_id: pm_10
  name: FRPs for automotive body sheets (‘ABS’)
  definition_status: considered
  notes: Mentioned as a product market definition from previous Commission decisions, but not
    explicitly assessed in this case's findings.
- market_id: pm_11
  name: FRPs for lithographic sheets
  definition_status: considered
  notes: Mentioned as a product market definition from previous Commission decisions, but not
    explicitly assessed in this case's findings.
- market_id: pm_12
  name: Standard FRPs
  definition_status: considered
  notes: Mentioned as a product market definition from previous Commission decisions, described
    as including all FRPs not constituting separate product markets.
geographic_markets_considered:
- market_id: gm_1
  name: Recycled wrought aluminium — EEA+UK wide, with a geographic differentiation
  definition_status: considered
  notes: The Commission concluded the geographic market for recycled wrought aluminium is at
    most EEA+UK wide, with a geographic differentiation, based on limited trade flows outside
    EEA+UK, customer preferences for local sourcing, supply-side presence, and import barriers
    (duties, lead-times, transportation costs).
- market_id: gm_2
  name: Recycled wrought aluminium — EEA+UK wide, with a geographic differentiation
  definition_status: considered
  notes: The Commission concluded the geographic market for recycled wrought aluminium is at
    most EEA+UK wide, with a geographic differentiation, based on limited trade flows outside
    EEA+UK, customer preferences for local sourcing, supply-side presence, and import barriers
    (duties, lead-times, transportation costs).
- market_id: gm_3
  name: Dross recycling services — EEA+UK wide, with a strong geographic differentiation
  definition_status: considered
  notes: The Commission concluded the geographic market for dross recycling services is at most
    EEA+UK wide, with a strong geographic differentiation, balancing the importance of transport
    costs with factors like availability, performance, and sea shipping for longer distances.
- market_id: gm_4
  name: Salt slag recycling services — EEA+UK wide, with a strong geographic differentiation
  definition_status: considered
  notes: The Commission concluded the geographic market for salt slag recycling services is
    at most EEA+UK wide, with a strong geographic differentiation, due to transport costs, hazardous
    waste regulations, and scattered plant locations.
- market_id: gm_5
  name: FRPs for beverage can bodies — EEA+UK wide (EEA and United Kingdom affected)
  definition_status: considered
  notes: The Commission concluded the geographic market for FRPs for beverage can bodies encompasses
    the EEA and at most also the UK and Switzerland, but the assessment would focus on EEA+UK
    given the Notifying Party's activities.
- market_id: gm_6
  name: FRPs for beverage can ends — EEA+UK wide (EEA and United Kingdom affected)
  definition_status: considered
  notes: The Commission concluded the geographic market for FRPs for beverage can ends encompasses
    the EEA and at most also the UK and Switzerland, but the assessment would focus on EEA+UK
    given the Notifying Party's activities.
