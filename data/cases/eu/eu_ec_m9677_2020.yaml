- passage_id: sp_3
  source_document_id: eu_ec_m9677_2020_decision
  page: '14'
  quote_snippet: (63) From the supply-side, while the market investigation provided strong indications
    that switching between paste and liquid ink constitutes a major strategic decision, involving
    considerable costs and efforts,72 it was inconclusive as to whether printing inks manufacturers
    had the ability to switch easily and in a timely manner between heatset, coldset and sheetfed
    inks within paste inks.73 In a similar fashion, the feedback received from the market investigation
    did not allow the Commission to form a conclusion as to whether there would be a sufficient
    degree of supply-side substitutability between gravure, flexographic and jet inks within
    liquid inks to consider these three types of liquid inks as forming a single product market.74
  extraction_method: pdf_extracted
  review_status: unreviewed
