  quote_snippet: (downstream). This relationship is affected within the meaning of EU merger
    control14 because upstream the Parties’ market shares would exceed 30% in the sales of certain
    pigment chemistries which are used to produce printing inks. Moreover, the relationship
    is also affected because DIC’s market share for the manufacture of printing inks downstream
    exceeds 30% in one potential sub-segment, namely the manufacture of gravure liquid inks
    in the EEA.
