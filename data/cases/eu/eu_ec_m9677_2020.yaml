- passage_id: sp_8
  source_document_id: eu_ec_m9677_2020_decision
  page: '15'
  quote_snippet: (68) From the supply-side, while the vast majority of printing inks manufacturers
    indicated that suppliers from outside the EEA could credibly supply customers within the
    EEA,77 the market investigation proved inconclusive as to whether the respondents themselves
    would have the ability to supply customers within the EEA from plants outside the EEA without
    incurring additional costs and efforts.78 Some respondents, though a minority, even suggested
    that they primarily supplied their customers from manufacturing facilities close to their
    customer’s plant in South-West Europe or the Mediterranean area.79 Some respondents also
    suggested that the geographic market could be wider for paste inks than for liquid inks,
    since liquid inks are more voluminous and transport costs per unit of value would are more
    important.80
