product_markets_considered:
- market_id: pm_1
  name: Pigments
  definition_status: left_open
  notes: The Commission considered the appropriate definition to be at least the level of chemical
    class, and possibly the narrower level of colour index, but ultimately left the question
    open as it did not materially affect the assessment.
- market_id: pm_2
  name: Printing inks
  definition_status: left_open
  notes: The Commission considered segmentations between liquid and paste inks, and further
    segmentations within these types (e.g., heatset, coldset, sheetfed for paste; gravure, flexographic,
    jet for liquid), but ultimately left the exact scope open.
geographic_markets_considered:
- market_id: gm_1
  name: Pigments — worldwide (with geographic differentiation between Chinese and Indian suppliers
    and the rest of the world)
  definition_status: defined
  notes: The Commission considered the market to be worldwide, but with a geographic differentiation
    between Chinese and Indian suppliers and the rest of the world, particularly for perylene
    and quinacridone. The assessment would not change under an EEA-wide definition.
- market_id: gm_2
  name: Printing inks — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission left the exact scope of the geographic market open, as the Transaction
    did not raise serious doubts under either an EEA-wide or worldwide definition.
