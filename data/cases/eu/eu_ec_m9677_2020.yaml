  quote_snippet: (64) In any event, the Commission considers that, for the purpose of the present
    case, the exact scope of the product market definition for printing inks can be left open,
    since no serious doubts as to the compatibility of the Transaction with the internal market
    arise under any plausible product market definition (i.e. segmented between liquid and paste
    inks or further segmented between heatset, coldset and sheetfed inks within paste inks and
    between gravure, flexographic and jet inks within liquid inks).
