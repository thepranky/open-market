- passage_id: sp_4
  source_document_id: eu_ec_m9677_2020_decision
  page: '11'
  quote_snippet: (54) In light of the above, the Commission considers that, to the effect of
    the present decision, the relevant geographic market for pigments is worldwide, however
    with a geographic differentiation between Chinese and Indian suppliers and the rest of the
    world, in particular as regards perylene and quinacridone. Accordingly, the Commission considers
    that the assessment of the Transaction would not change under a possible relevant geographic
    market definition as EEA-wide.
