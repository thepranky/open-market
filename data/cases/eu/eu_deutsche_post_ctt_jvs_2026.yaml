- passage_id: sp_16
  source_document_id: eu_deutsche_post_ctt_jvs_2026_decision
  page: '8'
  quote_snippet: In the past, the Commission has considered that the geographic scope of the
    markets for the provision of parcel delivery services, and its subsegments, are likely national
    in scope. In particular, contracts for parcel deliveries are mostly negotiated at national
    level for both domestic and international deliveries, and parcel delivery companies need
    a significant national presence in a given country (e.g. infrastructure, client contracts,
    sales force) in order to meaningfully compete in that country. The Commission also noted
    that there may be a tendency towards broader markets. (31)
  extraction_method: pdf_extracted
