- passage_id: sp_2
  source_document_id: eu_deutsche_post_ctt_jvs_2026_decision
  page: '6'
  quote_snippet: The Commission considers that, for the purposes of this decision, the exact
    scope of the product market definition regarding the supply of parcel delivery services
    may be left open, since the Transaction does not raise serious doubts as to its compatibility
    with the internal market under any plausible product market definition. In its assessment,
    the Commission will consider the narrowest plausible market, which in this case will exclude
    parcel deliveries achieved by using pallets, even if the pallets are used only to group
    a number of parcels that have the same sender and recipient to facilitate delivery management.
  extraction_method: pdf_extracted
  review_status: unreviewed
