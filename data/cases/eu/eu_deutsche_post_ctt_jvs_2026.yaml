product_markets_considered:
- market_id: pm_1
  name: Small package delivery services
  definition_status: defined
  notes: Also referred to as 'parcels', defined as small packages not exceeding 31.5 kg. The
    Commission states that the further exact scope of the product market definition for the
    supply of parcel delivery services can be left open, but for the purposes of this decision,
    it will consider the narrowest plausible market, which excludes parcel deliveries achieved
    by using pallets.
- market_id: pm_2
  name: 'Small package delivery services (segmented by speed: express vs. deferred)'
  definition_status: segmented
  notes: Segmentation between express and deferred services was considered. Express services
    were characterised by a commitment to deliver within the next day or until the end of the
    day. The market investigation found this segmentation accurate.
- market_id: pm_3
  name: 'Small package delivery services (segmented by customer type: C2X, B2B, B2C)'
  definition_status: segmented
  notes: 'Segmentation based on the identity of the parcel senders into services offered to
    consumers (C2X: consumers to businesses and consumers to consumers) and to businesses (B2X),
    with a further distinction between B2B and B2C services, was considered and found accurate
    by the market investigation.'
- market_id: pm_4
  name: 'Small package delivery services (segmented by delivery destination: home vs. out-of-home)'
  definition_status: left_open
  notes: The existence of an out-of-home (OOH) delivery segment (e.g., lockers, drop-off points)
    was considered but ultimately left open as it does not affect the assessment of the Transaction.
    Market investigation showed low maturity and adoption of OOH in Portugal and Spain.
- market_id: pm_5
  name: Mail delivery services (postal mail delivery)
  definition_status: considered
  notes: Mentioned as a separate relevant market in the Commission's previous practice, distinct
    from small package delivery services and freight forwarding.
- market_id: pm_6
  name: Freight forwarding
  definition_status: considered
  notes: Mentioned as a separate relevant market in the Commission's previous practice, distinct
    from mail delivery services and small package delivery services.
geographic_markets_considered:
- market_id: gm_1
  name: Small package delivery services — national (Portugal affected)
  definition_status: considered
  notes: While the exact geographic scope for parcel delivery services was left open, the Commission
    considered the national scope (Portugal) as the narrowest plausible market for its assessment.
- market_id: gm_2
  name: Small package delivery services — national (Spain affected)
  definition_status: considered
  notes: While the exact geographic scope for parcel delivery services was left open, the Commission
    considered the national scope (Spain) as the narrowest plausible market for its assessment.
- market_id: gm_3
  name: 'Small package delivery services (segmented by geography: domestic vs. cross-border/international)'
  definition_status: segmented
  notes: Segmentation into domestic and cross-border parcel delivery services, with further
    sub-segmentation between cross-border intra-EEA and extra-EEA services, was considered and
    found accurate by the market investigation.
theories_of_harm: []
commitments: []
source_passages:
- passage_id: sp_1
  source_document_id: eu_deutsche_post_ctt_jvs_2026_decision
  page: '5'
  quote_snippet: The Commission has previously considered mail delivery services (postal mail
    delivery), small package delivery services (which are the delivery of packages, commonly
    defined according to weight, which a single person can handle without specific equipment)
    and freight forwarding (which is the organisation of transportation of items, - including
    possible ancillary activities such as customs clearance, warehousing, ground services etc.,.
    - on behalf of customers according to their needs) as separate relevant markets. (10) With
    regard to small package delivery services, the Commission, in its previous practice, has
    defined it as relating to small packages which do not exceed 31.5 kg, also referred to as
    “parcels”.
  extraction_method: pdf_extracted
  review_status: unreviewed
