- passage_id: sp_3
  source_document_id: eu_deutsche_post_ctt_jvs_2026_decision
  page: '9'
  quote_snippet: In light of the above, and for the purposes of this decision, the Commission
    considers that (i) there is a separate product market for the delivery of small packages
    not exceeding 31.5 kg (also referred to as “parcels”), and (ii) the further exact scope
    of the product market definition for the supply of parcel delivery services can be left
    open, since the Transaction does not raise serious doubts as to its compatibility with the
    internal market under any plausible product market definition.
  extraction_method: pdf_extracted
