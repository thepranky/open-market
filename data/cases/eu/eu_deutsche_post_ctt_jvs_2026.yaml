  page: '8'
  quote_snippet: The Commission considers that, for the purposes of this decision, the exact
    scope of the geographic market definitions regarding the supply of parcel delivery services
    may be left open, since the Transaction does not raise serious doubts as to its compatibility
    with the internal market under any plausible geographic market definition (i.e., national,
    broader than national, encompassing the whole of the Iberian Peninsula or at the EEA level).
    In its assessment, the Commission considers the narrowest plausible market, which is the
    national scope.
