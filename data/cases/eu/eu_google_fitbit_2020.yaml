product_markets_considered:
- market_id: pm_1
  name: Wrist-worn wearable devices
  definition_status: considered
  notes: The Commission considered wrist-worn wearables a separate product market
    from other types of wearable devices. However, the question of further segmentation
    (between fitness trackers and smartwatches, with/without GPS/cellular connectivity,
    or basic/full smartwatches) was left open as it would not change the outcome of
    the competitive assessment.
- market_id: pm_2
  name: Licensable OSs for smart mobile devices
  definition_status: considered
  notes: The Commission reaffirmed its previous practice regarding the distinction
    between OSs for PCs and smart mobile devices, and between licensable and non-licensable
    OSs.
- market_id: pm_3
  name: Licensable OSs for wrist-worn wearable devices
  definition_status: considered
  notes: The Commission considered wearable OSs a separate product market from smart
    mobile OSs, and OSs for wrist-worn wearable devices as separate from non-wrist-worn
    wearable devices. The question of further segmentation for different types of
    wrist-worn wearable devices was not conclusive.
- market_id: pm_4
  name: App stores for a given OS platform of smart mobile devices (Android app stores)
  definition_status: considered
  notes: The Commission considered app stores for a given OS platform of smart mobile
    devices (specifically Android app stores) as a separate relevant product market.
- market_id: pm_5
  name: App stores for a given OS platform of wrist-worn wearable devices (Wear OS
    and Fitbit devices)
  definition_status: considered
  notes: The Commission considered app stores on wearable devices a separate product
    market from other apps, and separate markets for app stores for a given OS platform
    of wearable devices (Wear OS and Fitbit devices).
- market_id: pm_6
  name: General search services
  definition_status: defined
  notes: The Commission reaffirmed its previous practice of finding a separate product
    market for general search services.
- market_id: pm_7
  name: Online search advertising services
  definition_status: considered
  notes: The Commission confirmed online advertising is separate from offline advertising,
    and online search advertising is separate from online non-search advertising.
    Potential segmentations by platform (desktop/mobile apps) were left open.
- market_id: pm_8
  name: Online display advertising services
  definition_status: considered
  notes: The Commission confirmed online advertising is separate from offline advertising,
    and online display advertising is separate from online search advertising. Potential
    segmentations by platform (desktop/mobile apps), on/off social networks, and video/non-video
    were left open.
- market_id: pm_9
  name: Ad tech services
  definition_status: considered
  notes: The Commission considered various ad tech services as relevant product markets,
    including search ad network services; display ads SSP, DSP, and ad network services;
    display ads publisher and advertiser ad server services; and analytics services.
    The question of the exact segmentation was left open.
- market_id: pm_10
  name: Health and fitness apps
  definition_status: left_open
  notes: The Commission considered health and fitness apps as a relevant product market,
    potentially segmented by functionality (companion apps vs. others), platform (PC,
    smart mobile, wrist-worn wearable), and OS used. The exact scope was left open.
- market_id: pm_11
  name: Mobile payment services
  definition_status: left_open
  notes: The Commission considered the retail provision of mobile payment services
    as a relevant product market. Further segmentations (proximity/offline vs. remote/online,
    by platform, and by OS) were left open.
- market_id: pm_12
  name: Navigation apps offering turn-by-turn navigation
  definition_status: left_open
  notes: The Commission considered navigation apps offering turn-by-turn navigation
    as a relevant product market, potentially segmented by platform (smart mobile
    and wrist-worn wearable devices) and based on the OS used. The exact scope was
    left open.
- market_id: pm_13
  name: Virtual assistants
  definition_status: left_open
  notes: The Commission considered virtual assistants as a relevant product market,
    potentially segmented by platform (PC, smart mobile, wrist-worn wearable device)
    and based on the OS used. The exact scope was left open.
- market_id: pm_14
  name: Digital music distribution services
  definition_status: left_open
  notes: The Commission considered digital music distribution services as a relevant
    product market, potentially segmented by functionality (music downloading vs.
    streaming), platform (PC, smart mobile, wrist-worn wearable devices), and OS used.
    The exact scope was left open.
- market_id: pm_15
  name: Digital translation services
  definition_status: left_open
  notes: The Commission considered digital translation services as a relevant product
    market, potentially segmented by platform (PC, smart mobile, wrist-worn wearable
    devices) and based on the OS used. The exact scope was left open.
- market_id: pm_16
  name: Provision of cloud infrastructure and data analytics
  definition_status: defined
  notes: The Commission defined this market based on market investigation findings
    that it is substantially different from other digital healthcare activities.
- market_id: pm_17
  name: Patient monitoring
  definition_status: defined
  notes: The Commission defined this market based on market investigation findings
    that it is substantially different from other digital healthcare activities.
- market_id: pm_18
  name: Provision of data for medical research and real-world evidence (RWE)
  definition_status: defined
  notes: The Commission defined this market without further segmentation, based on
    market investigation findings that it is substantially different from other digital
    healthcare activities.
- market_id: pm_19
  name: Corporate wellness programmes
  definition_status: defined
  notes: The Commission defined this market based on market investigation findings
    that it is substantially different from other digital healthcare activities.
