- passage_id: sp_2
  source_document_id: eu_google_fitbit_2020_decision
  page: '26'
  quote_snippet: In light of recitals (74) to (78), for the purpose of assessing the
    Transaction in this Decision, the Commission considers that the relevant product
    market is the market for wrist-worn wearable devices. The question whether the
    supply of wrist-worn wearable devices should be further segmented between (i)
    fitness trackers and smartwatches, (ii) fitness trackers and smartwatches with
    and without GPS connectivity, (iii) smartwatches with and without cellular connectivity
    and (iv) basic and full smartwatches can be left open in this Decision since the
    Parties do no overlap as regards wrist-worn wearable devices and any further segmentations
    would thus not change the outcome of the competitive assessment in the present
    case.
  extraction_method: pdf_extracted
