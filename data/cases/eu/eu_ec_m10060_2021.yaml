product_markets_considered:
- market_id: pm_1
  name: Transport Administration Systems (TAS) software solutions
  definition_status: left_open
  notes: The Commission considers TAS software solutions distinct from SCM and other business
    software. However, it explicitly leaves open whether solutions provided by 3PL suppliers
    and Transport Carriers are part of this market, noting that this would not impact the competitive
    assessment. For the purpose of the decision, the precise product definition was left open
    as no serious doubts arose under the narrowest plausible market of TAS solutions provided
    by Generalist and Specialised SCE operators.
- market_id: pm_2
  name: Business software / Enterprise Application Software (EAS)
  definition_status: considered
  notes: The Commission referred to its precedents on business software and Enterprise Application
    Software as a broader context, from which TAS solutions were distinguished.
- market_id: pm_3
  name: Supply Chain Management (SCM)
  definition_status: considered
  notes: SCM was defined based on Commission precedents, as a broader concept than TAS, and
    TAS was concluded to be a distinct market from SCM.
geographic_markets_considered:
- market_id: gm_1
  name: Transport Administration Systems (TAS) software solutions — EEA-wide and worldwide
  definition_status: considered
  notes: The Commission considered the market for TAS software solutions to be at least EEA-wide
    and potentially worldwide, a view supported by the market investigation and consistent with
    precedents for related business software.
- market_id: gm_2
  name: Transport Administration Systems (TAS) software solutions — Nordic region
  definition_status: considered
  notes: Although the overall market was considered at least EEA-wide, due to limited indications
    from the market investigation of a potential regional cross-border market, the Commission
    also assessed the effects of the transaction at the regional level in the Nordic region.
