- passage_id: sp_3
  source_document_id: eu_ec_m10060_2021_decision
  page: '5'
  quote_snippet: In light of the above, and on the basis of the outcome of the market investigation,
    the Commission considers that TAS software solutions constitute a market distinct from SCM
    and other business software. Whilst the Commission considers that the market for TAS software
    solutions comprises the software solutions provided by both Generalist and Specialized SCE
    operators, it can be left open whether the software solutions provided by 3PL suppliers
    and Transport Carriers are part of the same market, as this would in any case not impact
    the outcome of the competitive assessment below.
  extraction_method: pdf_extracted
