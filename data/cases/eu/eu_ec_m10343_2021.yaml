product_markets_considered:
- market_id: pm_1
  name: Production of commissioned AV content
  definition_status: considered
  notes: The Commission considers this a separate market from the licensing of broadcasting
    rights for AV content, following past decisions. The market is limited to non-captive AV
    production.
- market_id: pm_2
  name: Licensing of broadcasting rights for AV content
  definition_status: considered
  notes: The Commission considers this a separate market from the production of commissioned
    AV content. Segmentation by type of content (films, sports, other), US/non-US films, premium/non-premium
    content, scripted/non-scripted content, and exhibition window were considered but left open.
- market_id: pm_3
  name: Wholesale supply of TV channels (including ancillary services and all types of infrastructure)
  definition_status: considered
  notes: The Commission considers this the relevant product market, including ancillary services
    and all distribution infrastructure. Segmentation by FTA vs. pay TV, basic vs. premium pay
    TV, and by genre (sports, films, children/youth, other) were considered but left open.
- market_id: pm_4
  name: Retail supply of AV services (encompassing all distribution technologies)
  definition_status: considered
  notes: The Commission considers this the relevant product market at retail level, encompassing
    all distribution technologies. Segmentation by FTA vs. pay AV services, linear vs. non-linear
    pay AV services, premium vs. basic pay AV services, and linear vs. non-linear FTA AV services
    were considered but left open.
- market_id: pm_5
  name: Sale of advertising space on TV channels
  definition_status: considered
  notes: The Commission considers this a distinct market. The question of further segmentation
    between FTA TV channels and pay TV channels for advertising space was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Production of commissioned AV content — national/linguistic areas (EEA affected)
  definition_status: left_open
  notes: The Commission concludes that the geographic markets for the production of commissioned
    AV content are either national or correspond with a linguistic area, but left the precise
    definition open.
- market_id: gm_2
  name: Licensing of broadcasting rights for AV content — national/linguistic areas (EEA affected)
  definition_status: left_open
  notes: The Commission concludes that the geographic markets for the licensing of broadcasting
    rights for AV content are either national or correspond with a linguistic area, but left
    the precise definition open.
- market_id: gm_3
  name: Wholesale supply of TV channels — national (EEA affected, excluding Belgium)
  definition_status: defined
  notes: The geographic market is national for most countries.
- market_id: gm_4
  name: Wholesale supply of TV channels — regional (Belgium affected)
  definition_status: defined
  notes: The geographic market is regional in Belgium, based on language and network footprint.
- market_id: gm_5
  name: Retail supply of AV services — national (EEA affected)
  definition_status: defined
  notes: The geographic market for the retail supply of AV services is national in scope.
- market_id: gm_6
  name: Sale of advertising space on TV channels — unknown (EEA affected)
  definition_status: considered
  notes: The geographic market definition for the sale of advertising space on TV channels is
    not concluded in the provided chunks. Previous decisions indicate a national scope.
