product_markets_considered:
- market_id: pm_1
  name: 'Automatic pedestrian doors: Swing doors'
  definition_status: defined
  notes: The Commission defined this market, noting limited demand and supply-side substitutability
    from other automatic pedestrian door types and from industrial doors. No further segmentation
    by product variants (leaves, materials, size) or energy operators was considered appropriate.
- market_id: pm_2
  name: 'Automatic pedestrian doors: Sliding doors'
  definition_status: defined
  notes: The Commission defined this market, noting limited demand and supply-side substitutability
    from other automatic pedestrian door types and from industrial doors. No further segmentation
    by product variants or energy operators.
- market_id: pm_3
  name: 'Automatic pedestrian doors: Revolving doors'
  definition_status: defined
  notes: The Commission defined this market, noting limited demand and supply-side substitutability
    from other automatic pedestrian door types and from industrial doors. No further segmentation
    by product variants or energy operators.
- market_id: pm_4
  name: 'Automatic pedestrian doors: Hermetic and semi-hermetic doors'
  definition_status: defined
  notes: The Commission defined this market, noting limited demand and supply-side substitutability
    from other automatic pedestrian door types due to specific requirements for air-tight environments.
- market_id: pm_5
  name: 'Automatic pedestrian doors: Fire doors'
  definition_status: defined
  notes: The Commission's conclusion in paragraph 200(a) states that separate product markets
    for fire doors arise. However, paragraph 94 states that it can be left open whether the
    supply of automatic fire doors constitutes a separate product market as the transaction
    does not give rise to any affected market for them.
- market_id: pm_6
  name: Industrial doors
  definition_status: left_open
  notes: The exact product market definition within industrial doors is left open as the competitive
    assessment would not differ irrespective of segmentation. The Commission focused its assessment
    on high-speed doors where the overlap between the parties' activities was most significant.
- market_id: pm_7
  name: After-sales services for automatic pedestrian doors
  definition_status: defined
  notes: Separate from after-sales services for industrial doors. No further segmentation by
    door type, type of after-sales services providers, or customer group was warranted.
- market_id: pm_8
  name: After-sales services for industrial doors
  definition_status: defined
  notes: Separate from after-sales services for automatic pedestrian doors. No further segmentation
    by door type, type of after-sales services providers, or customer group was warranted.
- market_id: pm_9
  name: Spare parts (brand-specific)
  definition_status: defined
  notes: Distinguished as a relevant product market separate from after-sales services and generic
    spare parts. The Commission decided to focus on brand-specific spare parts (referred to
    as 'spare parts') in its assessment.
- market_id: pm_10
  name: Spare parts (generic)
  definition_status: defined
  notes: Distinguished as a relevant product market separate from after-sales services and brand-specific
    spare parts. The Commission did not address this market further as the Parties are only
    involved to a limited extent in the supply of generic spare parts.
- market_id: pm_11
  name: Access control systems and components
  definition_status: left_open
  notes: The Commission left open the exact product market definition, noting that the competitive
    assessment would not differ irrespective of the segmentation.
- market_id: pm_12
  name: Locks
  definition_status: left_open
  notes: The Commission left open the exact product market definition (e.g., whether mechanical
    and electromechanical locks constitute separate markets), noting that the competitive assessment
    would not differ irrespective of the segmentation.
- market_id: pm_13
  name: Electric strikes
  definition_status: left_open
  notes: The Commission identified electric strikes as a component distinct from locks during
    the market investigation. The exact product market definition was left open as the competitive
    assessment would not differ irrespective of the segmentation. The notifying party states
    that OEMs of automatic doors constitute an insignificant customer segment for electric strikes.
- market_id: pm_14
  name: Sensors
  definition_status: left_open
  notes: The Commission left open the exact product market definition, but stated it would specifically
    assess the impact of the Transaction on the supply of sensors for automatic pedestrian doors.
geographic_markets_considered:
- market_id: gm_1
  name: 'Automatic pedestrian doors: Swing doors — national (EEA affected)'
  definition_status: defined
  notes: The Commission concluded that markets for automatic pedestrian doors, including swing
    doors, are national in scope due to factors like varying safety requirements, differing
    preferences, and price differences across countries.
- market_id: gm_2
  name: 'Automatic pedestrian doors: Sliding doors — national (EEA affected)'
  definition_status: defined
  notes: The Commission concluded that markets for automatic pedestrian doors, including sliding
    doors, are national in scope due to factors like varying safety requirements, differing
    preferences, and price differences across countries.
- market_id: gm_3
  name: 'Automatic pedestrian doors: Revolving doors — national (EEA affected)'
  definition_status: defined
  notes: The Commission concluded that markets for automatic pedestrian doors, including revolving
    doors, are national in scope due to factors like varying safety requirements, differing
    preferences, and price differences across countries.
- market_id: gm_4
  name: 'Automatic pedestrian doors: Hermetic and semi-hermetic doors — national (EEA affected)'
  definition_status: defined
  notes: The Commission concluded that markets for automatic pedestrian doors, including those
    with hermetic or fire-resistant features, are national in scope.
- market_id: gm_5
  name: 'Automatic pedestrian doors: Fire doors — national (EEA affected)'
  definition_status: defined
  notes: The Commission concluded that markets for automatic pedestrian doors, including those
    with hermetic or fire-resistant features, are national in scope.
- market_id: gm_6
  name: Industrial doors — national (EEA affected)
  definition_status: defined
  notes: The Commission concluded that the markets for industrial doors are national in scope,
    explicitly stating this for high-speed doors.
- market_id: gm_7
  name: After-sales services for automatic pedestrian doors — national (EEA affected)
  definition_status: defined
  notes: The Commission confirmed the national scope for after-sales services for automatic
    pedestrian doors, with no further segmentation by geographical spread of the customer.
- market_id: gm_8
  name: After-sales services for industrial doors — national (EEA affected)
  definition_status: defined
  notes: The Commission confirmed the national scope for after-sales services for industrial
    doors, with no further segmentation by geographical spread of the customer.
- market_id: gm_9
  name: Spare parts (brand-specific) — national (EEA affected)
  definition_status: defined
  notes: The Commission considered the geographic market for spare parts for both automatic
    pedestrian and industrial doors to be national in scope, citing difficulties in cross-border
    sourcing and national demand patterns.
- market_id: gm_10
  name: Spare parts (generic) — national (EEA affected)
  definition_status: defined
  notes: The Commission considered the geographic market for spare parts for both automatic
    pedestrian and industrial doors to be national in scope. The Parties are only involved to
    a limited extent in generic spare parts.
- market_id: gm_11
  name: Access control systems and components — EEA-wide
  definition_status: left_open
  notes: The Commission left open the exact geographic market definition, noting that the competitive
    assessment would not differ irrespective of the scope considered. Market investigation showed
    national elements but a majority of respondents favored an EEA-wide scope for competition
    assessment.
- market_id: gm_12
  name: Locks — EEA-wide
  definition_status: left_open
  notes: The Commission left open the exact geographic market definition, noting strong grounds
    to consider it EEA-wide but concluding the competitive assessment would not differ. Market
    investigation showed national elements but a majority of respondents favored an EEA-wide
    scope.
- market_id: gm_13
  name: Electric strikes — EEA-wide
  definition_status: left_open
  notes: The Commission left open the exact geographic market definition, as the competitive
    assessment would not differ. The Notifying Party argued for an EEA-wide scope at the upstream
    level due to central production, low transport costs, and lack of national standards.
- market_id: gm_14
  name: Sensors for automatic pedestrian doors — EEA-wide
  definition_status: defined
  notes: The Commission concluded the relevant geographic market for sensors is at least EEA-wide,
    based on market investigation indicating comparable technical specificities and consumer
    preferences across the EEA, and worldwide procurement by EEA-based customers.
