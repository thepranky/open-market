- passage_id: sp_2
  source_document_id: eu_ec_m9408_2020_decision
  page: '21'
  quote_snippet: For the purposes of this decision and in light of all information available
    to it, the Commission considers that, due to limited demand and supply-side substitutability,
    (i) automatic pedestrian doors and industrial doors do not belong to the same product market;
    (ii) each of swing, sliding and revolving automatic pedestrian doors constitute separate
    markets; and (iii) each of hermetic and semi-hermetic automatic doors constitute separate
    markets. The Commission does not consider appropriate to further segment these markets according
    to (i) different product variants (such as leaves, materials or size); or (ii) whether the
    automatic pedestrian doors are equipped with low- or full-energy operators.
  extraction_method: pdf_extracted
