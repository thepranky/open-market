product_markets_considered:
- market_id: pm_1
  name: Contract foodservices
  definition_status: defined
  notes: The Commission's past decisional practice and current market investigation confirm
    the existence of a distinct product market for contract foodservices, separate from concession
    foodservices.
- market_id: pm_2
  name: Contract foodservices — segmented by customer activity (B&I, Healthcare, Education,
    DOR)
  definition_status: left_open
  notes: The Commission's market investigation confirmed that segmentation along customer activities
    is warranted due to differing market dynamics and competitive landscapes. However, given
    the transaction does not raise competition concerns under any definition, the question of
    further segmentation is left open.
- market_id: pm_3
  name: In-house foodservices
  definition_status: defined
  notes: The Commission concluded that in-house (self-operated) foodservices should be excluded
    from the market for contract foodservices, as there is very limited substitution and they
    are not contestable by third-party providers.
- market_id: pm_4
  name: Ready-to-eat vendors, restaurants, and delivery services
  definition_status: defined
  notes: The Commission concluded that these services do not belong in the contract foodservices
    market because they do not compete for tenders to service business customers at their premises,
    although they can act as out-of-market constraints.
- market_id: pm_5
  name: Contract foodservices in B&I sector — segmented by 'premium' and 'standard' services
  definition_status: left_open
  notes: The Commission considered a possible segmentation between 'premium' (white-collar)
    and 'standard' (blue-collar) services within the B&I sector, noting differences in customer
    expectations and spending. However, suppliers often serve both segments, and the question
    was left open as it did not affect the compatibility conclusion.
- market_id: pm_6
  name: Contract foodservices in Education sector — segmented by 'private' and 'public' schools
  definition_status: defined
  notes: A possible segmentation based on private versus public schools in the Education sector
    was raised but not supported by the market investigation, which confirmed no demand-side
    difference. The Commission concluded against this segmentation.
- market_id: pm_7
  name: Contract foodservices in Education and B&I sectors — segmented by contract size
  definition_status: left_open
  notes: The Commission considered whether contract size could be a segmentation factor, noting
    that not all competitors can cater for large contracts. However, evidence also suggested
    smaller players can compete, sometimes jointly, and large customers may split contracts.
    The question was left open as it did not affect the compatibility conclusion.
geographic_markets_considered:
- market_id: gm_1
  name: Contract foodservices — national (overall affected)
  definition_status: defined
  notes: The Commission concluded that the market for the provision of contract foodservices
    and its relevant segments are national in scope, consistent with its prior decisional practice.
- market_id: gm_2
  name: Contract foodservices — national (Netherlands affected)
  definition_status: defined
  notes: The market investigation confirmed that the Netherlands constitutes a distinct national
    geographic market for contract foodservices, separate from Belgium, due to factors like
    different legal/tax requirements and customer demand.
- market_id: gm_3
  name: Contract foodservices — national (Germany affected)
  definition_status: defined
  notes: The market investigation confirmed that Germany constitutes a distinct national geographic
    market for contract foodservices. The assessment of affected markets specifically includes
    the B&I sector in Germany.
theories_of_harm: []
commitments: []
