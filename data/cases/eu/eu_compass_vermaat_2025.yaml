  page: '5'
  quote_snippet: In its prior decisional practice, the Commission considered a distinct product
    market for contract foodservices (which is separate from that of concession foodservices)
    ( 22 ) for the “provision of foodservice[s] outside the home, performed by third parties
    [i.e., outsourced], typically on the premises of public or private sector clients and involving
    the supply of food and drink to customers for whom that service is not the primary reason
    for their presence on the premises”. (23)
