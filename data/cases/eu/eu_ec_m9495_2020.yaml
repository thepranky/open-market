  page: '16'
  quote_snippet: In light of the above and in line with previous Commission decisions, the Commission
    considers for the purposes of this decision, that there are indications that there are separate
    product markets for different product categories of wholesale supply of daily consumer goods
    (e.g. fruit & vegetables, poultry, savoury bakery, sweet bakery, dairy, fish, confectionary,
    desserts, meat, all other). A segmentation by mode of supply cannot also not be excluded.
    The exact market definition can, however, be left open since the Transaction would not give
    rise to serious doubts as to its compatibility with the internal market under the narrowest
    possible product market definition.
