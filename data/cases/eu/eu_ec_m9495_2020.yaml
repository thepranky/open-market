  page: '47'
  quote_snippet: In light of the considerations in Section 5.2, the Commission concludes that
    the proposed Transaction does not give rise to serious doubts about its compatibility with
    the internal market or the EEA Agreement due to input or customer foreclosure as regards
    the markets for the retail supply of daily consumer goods, including bottled water, fresh
    and processed meat, take-home ice cream, dairy/cheese products, mayonnaise and dairy/cheese
    spread, ice cream overall, ketchup, edible oils, impulse ice cream, fresh fruit and vegetables,
    and PRSO and as regards the markets for the production and supply of impulse ice cream overall,
    branded impulse ice cream, branded take-home ice cream, branded all industrial ice cream,
    private label ketchup,branded edible oils, margarine overall, mayonnaise overall, water
    overall, PRSO and iced tea in Slovenia.
