product_markets_considered:
- market_id: pm_1
  name: Production and supply of food products dedicated to the retail distribution sector
  definition_status: defined
  notes: The Commission considered this market separate from the production and supply of food
    products dedicated to the food service sector.
- market_id: pm_2
  name: Production and supply of food products dedicated to the food service sector
  definition_status: defined
  notes: The Commission considered this market separate from the production and supply of food
    products dedicated to the retail distribution sector.
- market_id: pm_3
  name: Production and supply of ice cream products
  definition_status: defined
  notes: The Commission considered this market separate from the production and supply of other
    frozen food products.
- market_id: pm_4
  name: Production and supply of other frozen food products
  definition_status: defined
  notes: The Commission considered this market separate from the production and supply of ice
    cream products.
- market_id: pm_5
  name: Production and supply of industrial ice cream
  definition_status: defined
  notes: The Commission considered this market separate from the production and supply of artisanal
    ice cream.
- market_id: pm_6
  name: Production and supply of artisanal ice cream
  definition_status: defined
  notes: The Commission considered this market separate from the production and supply of industrial
    ice cream.
- market_id: pm_7
  name: Production and supply of take-home ice cream, impulse ice cream, and catering ice cream
  definition_status: left_open
  notes: Strong indications suggest these are separate product markets, but the precise definition
    was left open as the transaction did not raise serious doubts regardless of the definition.
- market_id: pm_8
  name: Production and supply of crude seed oil
  definition_status: defined
  notes: Considered a separate market from BRSO and PRSO.
- market_id: pm_9
  name: Production and supply of BRSO (refined seed oil in bulk)
  definition_status: defined
  notes: Considered a separate market from crude seed oil and PRSO.
- market_id: pm_10
  name: Production and supply of PRSO (refined seed oil packaged for end-users)
  definition_status: defined
  notes: Considered a separate market from crude seed oil and BRSO.
- market_id: pm_11
  name: Production and supply of seed oil
  definition_status: defined
  notes: Considered a separate market from the production and supply of olive oil.
- market_id: pm_12
  name: Production and supply of olive oil
  definition_status: defined
  notes: Considered a separate market from the production and supply of seed oil.
- market_id: pm_13
  name: Production and supply of seed oil by seed type
  definition_status: left_open
  notes: A further segmentation by different seed type within PRSO could not be excluded, but
    the exact market definition was left open as the transaction did not raise serious doubts.
- market_id: pm_14
  name: Production and supply of margarine
  definition_status: defined
  notes: The Commission found that the production and supply of margarine constitutes a separate
    product market.
- market_id: pm_15
  name: Production and supply of spreadable cheese
  definition_status: defined
  notes: The Commission found spreadable cheese to be a distinct market, with no further segmentation
    appropriate.
- market_id: pm_16
  name: Production and supply of fresh cheese
  definition_status: defined
  notes: The Commission found fresh cheese to be a distinct market.
- market_id: pm_17
  name: Production and supply of soft cheese
  definition_status: defined
  notes: The Commission found soft cheese to be a distinct market.
- market_id: pm_18
  name: Production and supply of semi-hard cheese
  definition_status: defined
  notes: The Commission found semi-hard cheese to be a distinct market.
- market_id: pm_19
  name: Production and supply of hard cheese
  definition_status: defined
  notes: The Commission found hard cheese to be a distinct market.
- market_id: pm_20
  name: Production and supply of cheese — further segmentation by presentation, milk type, or
    protected geographic status
  definition_status: left_open
  notes: Responses from market participants were inconclusive regarding further segmentation,
    except for spreadable cheese where no further segmentation was deemed appropriate.
- market_id: pm_21
  name: Production and supply of ketchup
  definition_status: defined
  notes: The Commission found ketchup to be a distinct product market.
- market_id: pm_22
  name: Production and supply of mayonnaise
  definition_status: defined
  notes: The Commission found mayonnaise to be a distinct product market.
- market_id: pm_23
  name: Supply of fresh meat for human consumption
  definition_status: defined
  notes: Considered a separate market from the production and supply of processed meat for human
    consumption.
- market_id: pm_24
  name: Production and supply of processed meat for human consumption
  definition_status: defined
  notes: Considered a separate market from the supply of fresh meat for human consumption.
- market_id: pm_25
  name: Fresh meat — further segmentations
  definition_status: left_open
  notes: Further segmentations could not be excluded, but the transaction did not raise serious
    doubts regardless of the definition.
- market_id: pm_26
  name: Production and supply of CSDs (Carbonated Soft Drinks)
  definition_status: defined
  notes: The Commission considered CSDs and NCSDs to be separate product markets within the
    broader market for non-alcoholic drinks.
- market_id: pm_27
  name: Production and supply of NCSDs (Non-Carbonated Soft Drinks)
  definition_status: defined
  notes: The Commission considered CSDs and NCSDs to be separate product markets within the
    broader market for non-alcoholic drinks.
- market_id: pm_28
  name: Production and supply of bottled water
  definition_status: defined
  notes: The Commission considered bottled water to constitute a separate product market.
- market_id: pm_29
  name: Production and supply of carbonated water, still water, and flavoured water
  definition_status: left_open
  notes: Market investigation indicated these might constitute separate markets, but the precise
    definition was left open as the transaction did not raise serious doubts regardless of the
    definition.
- market_id: pm_30
  name: Production and supply of branded vs private label products
  definition_status: left_open
  notes: Market investigation results were mixed, so the exact market definition was left open
    as the transaction did not raise serious doubts regardless of the definition.
- market_id: pm_31
  name: Procurement of daily consumer goods
  definition_status: defined
  notes: The Commission found a specific market for the procurement of daily consumer goods
    by customers like wholesalers, retailers, and other firms from upstream producers and suppliers.
- market_id: pm_32
  name: Procurement of daily consumer goods by 19 product categories
  definition_status: considered
  notes: The market investigation supported segmentation into 19 product categories, but the
    exact market definition was left open as the transaction did not raise serious doubts regardless
    of the definition.
- market_id: pm_33
  name: Procurement of daily consumer goods by sales channel
  definition_status: left_open
  notes: Strong indications suggested segmentation by sales channel, but the exact market definition
    was left open as the transaction did not raise serious doubts regardless of the definition.
- market_id: pm_34
  name: Wholesale supply of non-food products
  definition_status: defined
  notes: The Commission confirmed previous findings that wholesale supply of non-food products
    and food products are distinct markets.
- market_id: pm_35
  name: Wholesale supply of food products
  definition_status: defined
  notes: The Commission confirmed previous findings that wholesale supply of food products and
    non-food products are distinct markets.
- market_id: pm_36
  name: Wholesale supply of daily consumer goods by product category
  definition_status: considered
  notes: The Commission found indications for separate product markets based on product categories,
    but the exact definition was left open.
- market_id: pm_37
  name: Wholesale supply of daily consumer goods by mode of supply
  definition_status: left_open
  notes: A segmentation by mode of supply could not be excluded, but the exact market definition
    was left open as the transaction did not raise serious doubts.
- market_id: pm_38
  name: Retail supply of daily consumer goods through hypermarkets, supermarkets and discount
    chains (modern distribution channels)
  definition_status: defined
  notes: The Commission found a separate product market for the sale of daily consumer goods
    mainly by modern distribution channels.
geographic_markets_considered:
- market_id: gm_1
  name: Production and supply of all ice cream — national
  definition_status: defined
  notes: The Commission concluded that the geographic market for all ice cream is national in
    scope.
- market_id: gm_2
  name: Production and supply of edible oils — national or wider than national
  definition_status: left_open
  notes: Responses from market participants were not conclusive, with some indicating a wider
    than national, EEA-wide, or even global scope. The definition was left open.
- market_id: gm_3
  name: Production and supply of PRSO (refined seed oil packaged for end-users) — national or
    wider than national
  definition_status: left_open
  notes: The market investigation was inconclusive as to whether the geographic market for PRSO
    is national or wider than national.
- market_id: gm_4
  name: Production and supply of margarine — at least national or wider than national
  definition_status: left_open
  notes: The market was concluded to be at least national in scope, but whether it is wider
    than national was left open.
- market_id: gm_5
  name: Production and supply of cheese — national or wider than national
  definition_status: left_open
  notes: Responses from market participants were inconclusive, with half supporting a national
    scope and half disagreeing, indicating regional or EEA-wide scope. The definition was left
    open.
- market_id: gm_6
  name: Production and supply of cold sauces — at least national or wider than national
  definition_status: left_open
  notes: The markets were concluded to be at least national in scope, but whether they might
    be wider than national was left open.
- market_id: gm_7
  name: Supply of fresh meat for human consumption — national
  definition_status: defined
  notes: Market investigation confirmed the national scope for this market.
- market_id: gm_8
  name: Production and supply of processed meat for human consumption — at least national or
    wider than national
  definition_status: left_open
  notes: The markets were concluded to be at least national in scope, but whether they might
    be wider than national was left open due to inconclusive market investigation results.
- market_id: gm_9
  name: Production and supply of bottled water — national
  definition_status: defined
  notes: Market investigation clearly indicated a national scope for this market.
- market_id: gm_10
  name: Procurement of daily consumer goods — at least national or wider than national
  definition_status: left_open
  notes: The markets were found to be at least national in scope, but a wider market definition
    could not be fully excluded and was left open.
- market_id: gm_11
  name: Wholesale supply of daily consumer goods — national
  definition_status: defined
  notes: Market investigation confirmed a national scope for these markets, with a possible
    exception for cash & carry mode of supply.
- market_id: gm_12
  name: Wholesale supply of daily consumer goods through cash & carry mode of supply — national
    (Slovenia affected)
  definition_status: considered
  notes: Based on feedback from Slovenian market participants, the Commission considered this
    market to be national in Slovenia.
- market_id: gm_13
  name: Wholesale supply of daily consumer goods through cash & carry mode of supply — smaller
    than national (outside Slovenia affected)
  definition_status: left_open
  notes: The Commission left open whether this market might be smaller than national outside
    Slovenia.
- market_id: gm_14
  name: Retail supply of daily consumer goods — local or national (Slovenia affected)
  definition_status: left_open
  notes: Market investigation showed that markets are likely local, but a national scope could
    not be excluded, so the definition was left open.
