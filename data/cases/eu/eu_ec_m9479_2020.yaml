  quote_snippet: In previous decisions,11 the Commission has distinguished between "primary"
    (also known as disposable) and "secondary" (also known as rechargeable) batteries. Within
    rechargeable batteries, the Commission has previously differentiated the market into three
    separate product markets:12 (i) portable batteries; (ii) heavy-duty industrial batteries;
    and (iii) automotive batteries.
