  page: '7'
  quote_snippet: |
    The Transaction gives rise to certain vertical links that are not affected26 and to a number of vertically affected markets between:
    (a) Upstream: the manufacture and supply of Li-ion battery cells and modules for the automotive sector in the EEA (JV's activities), and
