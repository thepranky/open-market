product_markets_considered:
- market_id: pm_1
  name: The manufacture and supply of batteries, cells and modules
  definition_status: left_open
  notes: The Commission distinguished between primary/secondary batteries and within rechargeable
    batteries, between portable, heavy-duty industrial, and automotive batteries. It also considered
    modules vs. integrated battery packs, and Li-ion vs. NiMH batteries for automotive batteries,
    leaving these distinctions open. For the purpose of assessment, the market for the manufacture
    and supply of battery cells and modules (excluding battery systems) using Li-ion technology
    was analysed as the narrowest plausible product market, but the exact definition was ultimately
    left open.
- market_id: pm_2
  name: The manufacture and supply of PCs and LCVs
  definition_status: left_open
  notes: The Commission considered separate markets for PCs and LCVs, with various sub-segments
    for PCs (mini, small, medium, large, executive, luxury, sport, SUVs, multipurpose vehicles).
    Further sub-segmentations considered but left open include SUV types, LCV weight categories,
    inclusion of pick-up trucks, and distinctions between vehicles with combustion engines,
    electric battery vehicles, and hybrid vehicles.
geographic_markets_considered:
- market_id: gm_1
  name: The manufacture and supply of batteries, cells and modules — EEA-wide or global
  definition_status: left_open
  notes: The Commission referred to previous decisions where the geographic market for automotive
    batteries was left open between EEA-wide or global scope. For the current transaction, the
    exact geographic market definition was left open due to low market shares.
- market_id: gm_2
  name: The manufacture and supply of PCs and LCVs — national or EEA-wide
  definition_status: left_open
  notes: The Commission considered, based on previous decisions, that the geographic market
    for the manufacture and supply of PCs and LCVs could be national or EEA-wide. The exact
    geographic market definition was left open as the transaction would not raise serious doubts.
