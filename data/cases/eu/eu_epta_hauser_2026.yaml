  page: '6'
  quote_snippet: In any event, for the purposes of this Transaction, it can be left open whether
    remote display cases and plug-ins are considered to constitute separate relevant product
    markets or belong to one single product market, due to the absence of concerns. The Commission’s
    competitive assessment will be carried out in relation to the narrowest plausible product
    market, i.e. the market for the manufacture and supply of commercial refrigeration products,
    segmented between remote display cabinets and plug-ins.
