- passage_id: sp_6
  source_document_id: eu_epta_hauser_2026_decision
  page: '3'
  quote_snippet: 'As the Notifying Party explained, refrigerated cabinets may be categorised
    into two main system types: remote display cases, i.e., those relying on centralized refrigeration
    systems located elsewhere in the store or facility, (including direct expansion, water-loop
    (4), and indirect cascade systems) and plug-in display cases, i.e., self-contained portable
    units equipped with their own built-in cooling system that expels heat directly into the
    store environment, requiring only a power connection, also called ‘plug-ins’, (either water-cooled
    or air-cooled).'
  extraction_method: pdf_extracted
