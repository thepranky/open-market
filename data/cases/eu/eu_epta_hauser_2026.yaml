  name: Manufacture and supply of commercial refrigeration products (segmented between remote
    display cabinets and plug-ins)
  definition_status: left_open
  notes: The Commission assessed the market for commercial refrigeration products, considering
    segmentation into remote display cases and plug-in display cases, but ultimately left the
    precise definition open due to absence of competition concerns. The assessment was carried
    out on the basis of the narrowest plausible market, i.e., segmented between remote and plug-in
    display cases.
