- passage_id: sp_4
  source_document_id: eu_biscuit_holding_continental_bakeries_holding_2022_decision
  page: '3'
  quote_snippet: First, as regards the distinction between B and PL sweet biscuits, the market
    investigation has shown that retailers and competitors do not consider branded and private
    label sweet biscuits interchangeably. For retailers there is a considerable difference in
    the margins made with one or the other product9 and confronted with a price increase in
    a private label product, the majority of respondents said they would not switch to a branded
    product10.
  extraction_method: pdf_extracted
