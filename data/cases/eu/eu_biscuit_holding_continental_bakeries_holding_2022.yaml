source_passages:
- passage_id: sp_1
  source_document_id: eu_biscuit_holding_continental_bakeries_holding_2022_decision
  page: '3'
  quote_snippet: In previous decisions,6 the Commission considered -albeit leaving the product
    marked definition opened- that biscuits constitute a separate market from waffles and cakes.
    The Commission also considered the distinction between sweet and savoury biscuit markets.
    Within the sweet biscuits market, the Commission considered further segmentations (i) between
    products which are branded (‘B’) or have a private label (‘PL’); (ii) by customer (retailers
    vs food-service channel – restaurants, hotels, fast-food outlets, schools, hospitals) by
    category (form – sandwiched/plain; and taste – chocolate coated, filled). The Commission
    has however left in these previous decisions the precise product market definition open.
  extraction_method: pdf_extracted
  review_status: unreviewed
