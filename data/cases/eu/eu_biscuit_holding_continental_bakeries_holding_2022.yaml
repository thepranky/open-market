- passage_id: sp_15
  source_document_id: eu_biscuit_holding_continental_bakeries_holding_2022_decision
  page: '6'
  quote_snippet: For the purpose of assessing the present Transaction, the precise geographic
    market definition can be left open as no serious concerns arise as to the compatibility
    of the concentration with the internal market as regards the overlapping activities of the
    Parties in the market for the manufacture and supply of sweet biscuits. For the purposes
    of this Decision and under a conservative approach, the Commission will consider the geographic
    market to be national since the Parties’ market shares would be lower if the geographic
    market were to be considered regional or EEA-wide.
  extraction_method: pdf_extracted
  review_status: unreviewed
