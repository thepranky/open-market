- passage_id: sp_16
  source_document_id: eu_biscuit_holding_continental_bakeries_holding_2022_decision
  page: '15'
  quote_snippet: In light of the above considerations and taking account of the results of the
    market investigation and of all the evidence available to it, in particular the existence
    of sufficient alternative suppliers, the Commission concludes that the Transaction does
    not raise serious doubts as to its compatibility with the internal market in relation to
    the overall sweet biscuits market in France, as well as in the segment markets of sandwich
    biscuits in France, Belgium and in The Netherlands, and in the plain biscuits in Germany.
  extraction_method: pdf_extracted
