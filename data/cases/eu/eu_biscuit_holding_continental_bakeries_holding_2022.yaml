- passage_id: sp_2
  source_document_id: eu_biscuit_holding_continental_bakeries_holding_2022_decision
  page: '3'
  quote_snippet: The Notifying Party argues that sweet biscuits, waffles and cakes should be
    considered part of the same product market. However, as the Parties’ activities do not overlap
    in the production of waffles or cakes, it considers that the exact product market definition
    can be left open. As the Parties’ activities do not overlap on savoury biscuits, the Notifying
    Party does not give its opinion on this plausible segmentation of the savoury biscuits market.
    However, the Notifying Party considers that any further segmentation of the sweet biscuit
    market is not warranted for the following reasons.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
