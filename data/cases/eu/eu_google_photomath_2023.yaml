- passage_id: sp_2
  source_document_id: eu_google_photomath_2023_decision
  page: '5'
  quote_snippet: 'In line with the Notifying Party’s submission and the results of the market
    investigation, the Commission considers that online HSH tools that include a maths offering
    constitute a plausible relevant product market. For the purposes of this decision, it can
    be left open whether the relevant product market should comprise all online learning and
    education tools or be further segmented on the basis of: (i) HSH tool types; (ii) functionalities;
    or (iii) different means through which HSH services are provided.'
  extraction_method: pdf_extracted
