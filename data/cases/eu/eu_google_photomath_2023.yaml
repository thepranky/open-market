- passage_id: sp_16
  source_document_id: eu_google_photomath_2023_decision
  page: '6'
  quote_snippet: However, the Commission considers that the question of whether the market for
    the supply of online HSH tools that include a maths offering should be further segmented
    by excluding tools that are only a forum18, without OCR functionality or without solution
    steps, or any combination thereof can be left open, as the Transaction does not raise serious
    doubts as to its compatibility with the internal market under any plausible product market
