  page: '3'
  quote_snippet: 'The Transaction mainly concerns three related markets: (i) online HSH tools
    that include a maths offering (where both Google and Photomath are active); (ii) Android
    app stores (where only Google is active); and (iii) General search services (where only
    Google is active).'
