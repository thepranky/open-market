- passage_id: sp_18
  source_document_id: eu_google_photomath_2023_decision
  page: '7'
  quote_snippet: 'In light of the above, and for the purposes of this decision, the Commission
    considers that online HSH tools that include a maths offering constitute a plausible relevant
    product market. For the purposes of this decision, it can be left open, since the Transaction
    does not raise serious doubts as to its compatibility with the internal market, whether
    the relevant product market should comprise all online learning and education tools or be
    further segmented on the basis of: (i) HSH tool types; (ii) functionalities or (iii) different
    means through which HSH services are provided. Further, for the purposes of this decision,
    the Commission considers the relevant product market should not be further segmented based
    on (i) whether other academic subjects are offered (in addition to maths), or (ii) whichever
    pricing model is used.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
