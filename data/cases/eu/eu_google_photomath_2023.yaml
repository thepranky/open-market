product_markets_considered:
- market_id: pm_1
  name: Online HSH tools that include a maths offering
  definition_status: considered
  notes: The Commission considers this a plausible relevant product market. However, it leaves
    open whether the market should comprise all online learning and education tools or be further
    segmented based on HSH tool types, functionalities, or different means of service provision.
    The Commission explicitly decided *not* to segment this market based on whether other academic
    subjects are offered or by pricing model.
- market_id: pm_2
  name: Android app stores
  definition_status: considered
  notes: The Commission considered Android app stores a separate relevant product market, in
    line with its previous decisional practice.
- market_id: pm_3
  name: General search services
  definition_status: considered
  notes: The Commission considered the provision of general search services a separate relevant
    product market, in line with its previous decisional practice. It also noted that general
    search services on static and mobile devices belong to the same market.
geographic_markets_considered:
- market_id: gm_1
  name: Online HSH tools that include a maths offering — worldwide
  definition_status: considered
  notes: Based on market investigation results, the Commission considers the geographic scope
    of this market to be global.
- market_id: gm_2
  name: Android app stores — worldwide (excluding China)
  definition_status: considered
  notes: The Commission considered the geographic scope of this market to be worldwide, excluding
    China, in line with its previous decisional practice.
- market_id: gm_3
  name: General search services — national
  definition_status: considered
  notes: The Commission considered the geographic scope of this market to be national, in line
    with its previous decisional practice.
