- passage_id: sp_11
  source_document_id: eu_google_photomath_2023_decision
  page: '7'
  quote_snippet: The vast majority of respondents to the market investigation indicated that
    they supply their online HSH tool that includes a maths offering globally. Further, all
    respondents except one consider that the “conditions of competition” (e.g. prices, consumption
    habits, number and identity of suppliers, their market strength) are sufficiently similar/homogenous
    at the global level. Several respondents reasoned that, since these tools are online (either
    on the web or as an app), they can be accessed anywhere in the world. In addition, several
    respondents confirmed that their product is available in multiple languages.
