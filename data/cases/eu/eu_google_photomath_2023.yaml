- passage_id: sp_15
  source_document_id: eu_google_photomath_2023_decision
  page: '5'
  quote_snippet: However, the Commissions considers, that from a user’s perspective, learning
    and education tools without a maths offering are not a reasonable alternative if the user
    wishes to solve maths homework or wants to improve his or her maths skills. The Commission
    considers that it can be left open whether the relevant product market should be broader,
    consisting of all online learning and education tools, as the Transaction does not raise
    serious doubts as to its compatibility with the internal market regardless of whether such
    a broader product market is considered instead of online HSH tools that include a maths
    offering15.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
