  page: '3'
  quote_snippet: 'In Broadcom/Brocade9, Hewlett-Packard/3Com10, Gores Group/Siemens Enterprise
    Communications11, Alcatel/Lucent Technologies12 and Nvidia/Mellanox13, the Commission considered
    segmenting the market for switches: (i) by underlying protocols and technologies, such as
    time-division multiplexing (“TDM”) switches, asynchronous transfer mode (“ATM”) categories
    that are available in each data source were used to identify the relevant markets. Whereas
    the market reports from most abovementioned sources cover all product segmentations referred
    to by the Notifying Party, a few of the narrowest product segmentations are based on only
    a smaller subset of sources. switches, Internet Protocol /Ethernet switches14 and multi-service
    (“MS”) switches15; (ii) by bandwidth, within a potential segment for Ethernet switches,
    considering segmentations of bandwidth above or below 25 Gb/s16; (iii) by type of activity
    (manufacture, distribution and offering of integrated solutions)17; (iv) by size of the
    customer (e.g., the number of network users)18.'
