product_markets_considered:
- market_id: pm_1
  name: Switches
  definition_status: left_open
  notes: The Commission considered various segmentations for switches, including by underlying
    protocols/technologies (TDM, ATM, Ethernet, MS), bandwidth, type of activity, and customer
    size. It also considered a broader market including both switches and routers. While the
    market investigation supported a separate market for Ethernet switches and a distinction
    between campus and datacentre switches, the exact product market definition was left open
    for the purpose of this Decision.
- market_id: pm_2
  name: Ethernet campus switches
  definition_status: considered
  notes: The Commission carried out its competitive assessment for this market segment, noting
    it was the only potential market segment on which the Parties had a combined market share
    of more than 20%, thus warranting further review, even though the broader switches market
    definition was left open.
- market_id: pm_3
  name: WLAN equipment
  definition_status: left_open
  notes: The Commission considered a market for WLAN equipment, noting it includes WAPs and
    WLAN controllers. It also considered a potential segmentation at the level of single components
    (WAPs and WLAN controllers) and a distinction from LAN equipment. The market investigation
    supported a separate market for WLAN from LAN equipment and also segmentation at the component
    level. However, the exact product market definition was left open for the purpose of this
    Decision.
- market_id: pm_4
  name: WAPs (Wireless Access Points)
  definition_status: considered
  notes: The Commission carried out its competitive assessment for this plausible narrower market
    within WLAN equipment, as it was one of the plausible product markets where the Transaction
    gave rise to affected markets.
- market_id: pm_5
  name: SD-WAN
  definition_status: left_open
  notes: There is no Commission precedent specifically for SD-WAN. The Commission left the market
    definition open because the Transaction would not give rise to an affected market even under
    the narrowest plausible definition.
- market_id: pm_6
  name: Enterprise network security solutions
  definition_status: left_open
  notes: The Commission noted that there are no specific precedents for SSE, NAC, SASE, and
    firewalls but precedents exist for general enterprise security software. The Notifying Party
    referred to Gartner's segmentation. The Commission left the market definition open because
    the Transaction would not give rise to an affected market even under the narrowest plausible
    definition.
- market_id: pm_7
  name: Routers
  definition_status: left_open
  notes: The Commission referenced previous decisions that considered various segmentations
    for routers, or a broader market including both switches and routers, but ultimately left
    the market definition open. For this Decision, the exact product market definition was left
    open as the Transaction would not give rise to an affected market.
- market_id: pm_8
  name: Cloud networking
  definition_status: left_open
  notes: There is no Commission precedent specifically for cloud networking. The Commission
    left the market definition open because the Transaction would not give rise to an affected
    market even under the narrowest plausible definition.
- market_id: pm_9
  name: Servers
  definition_status: left_open
  notes: The Commission considered an overall market for servers with a possible segmentation
    by price band based on previous decisions. The market investigation was inconclusive on
    which segmentation should apply. For this Decision, the exact product market definition
    was left open, but an assessment was carried out based on IDC's price segmentation (mid-range
    servers) as the narrowest plausible market.
- market_id: pm_10
  name: Mid-range servers (USD 25,000 – USD 250,000)
  definition_status: considered
  notes: The Commission carried out an assessment based on this market, which was submitted
    by the Notifying Party using IDC's price segmentation, due to HPE's market share exceeding
    30% and its relation to Juniper's datacentre switches.
- market_id: pm_11
  name: High performance computing (HPC) systems
  definition_status: left_open
  notes: There is no Commission precedent specifically for HPC systems. The Commission left
    the market definition open because the Transaction would not give rise to an affected market.
    An assessment was carried out on the basis of a 'potential market for the supply of HPC
    systems'.
geographic_markets_considered:
- market_id: gm_1
  name: Switches — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission referred to precedents considering the market to be at least EEA-wide,
    if not worldwide. The market investigation indicated a worldwide scope. For the purpose
    of this Decision, the exact geographic market definition was left open.
- market_id: gm_2
  name: Ethernet campus switches — EEA-wide
  definition_status: considered
  notes: The Commission conducted its assessment based on an EEA-wide market for Ethernet campus
    switches, as this was the only level at which the Parties had a combined market share of
    more than 20%, warranting further review.
- market_id: gm_3
  name: WLAN equipment — worldwide or EEA-wide
  definition_status: left_open
  notes: Commission precedents considered the geographic market to be EEA-wide or worldwide.
    The market investigation indicated a worldwide scope. For this Decision, the Commission
    concluded the market is likely worldwide but left the exact geographic definition open.
- market_id: gm_4
  name: WAPs (Wireless Access Points) — worldwide
  definition_status: considered
  notes: The Commission carried out its assessment based on a worldwide market for WAPs as the
    narrowest affected market, in line with its overall consideration that the WLAN equipment
    market is likely worldwide.
- market_id: gm_5
  name: SD-WAN — worldwide or EEA-wide
  definition_status: left_open
  notes: The Commission considered the geographic market for SD-WAN to be worldwide or EEA-wide,
    in line with precedents for routers. The exact definition was left open as the transaction
    did not give rise to an affected market.
- market_id: gm_6
  name: Enterprise network security solutions — worldwide or EEA-wide
  definition_status: left_open
  notes: The Commission referred to precedents for infrastructure/security software considering
    the market to be at least EEA-wide, if not worldwide. The exact definition was left open
    as the transaction did not give rise to an affected market.
- market_id: gm_7
  name: Routers — worldwide or EEA-wide
  definition_status: left_open
  notes: The Commission referenced previous decisions considering the market to be at least
    EEA-wide, if not worldwide. The exact definition was left open as the transaction did not
    give rise to an affected market.
- market_id: gm_8
  name: Cloud networking — worldwide or EEA-wide
  definition_status: left_open
  notes: The Commission referenced precedents for IT services noting the market is likely broader
    than national. The exact definition was left open as the transaction did not give rise to
    an affected market.
- market_id: gm_9
  name: Servers — worldwide
  definition_status: left_open
  notes: The Commission referred to precedents where the geographic scope for datacentre servers
    was worldwide. The market investigation also supported a worldwide scope. For this Decision,
    the exact geographic market definition was left open, but an assessment was carried out
    based on a worldwide market.
- market_id: gm_10
  name: High performance computing (HPC) systems — worldwide or EEA-wide
  definition_status: left_open
  notes: The Commission referenced precedents for network interconnect products used in HPC
    as worldwide. The exact definition was left open as the transaction did not give rise to
    an affected market.
