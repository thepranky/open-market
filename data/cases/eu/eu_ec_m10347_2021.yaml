- passage_id: sp_8
  source_document_id: eu_ec_m10347_2021_decision
  page: '8'
  quote_snippet: '(40) Based on the above, the Commission considers that if the appropriate
    geographic scope for ESBR were narrower than worldwide, it is not strictly limited to the
    EEA but would encompass the European region, as: (i) the main barrier to global sourcing
    is transport cost and time, rather than regulatory or tariff barriers; and (ii) Russian
    and Serbian players have a significant presence in the EEA and are considered credible by
    customers.'
