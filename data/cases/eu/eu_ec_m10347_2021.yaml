- passage_id: sp_5
  source_document_id: eu_ec_m10347_2021_decision
  page: '6'
  quote_snippet: (24) For the purpose of this Decision, the Commission concludes that ESBR and
    SSBR constitute separate product markets. A further segmentation of ESBR is not appropriate.
    As far as a further sub-segmentation of SSBR into non-functionalised SSBR and functionalised
    SSBR is concerned, the issue can be left open since the Transaction does not give rise to
    serious doubts as to its compatibility with the internal market or the functioning of the
    EEA agreement under any of these plausible market definitions (SSBR overall, functionalised
    SSBR or non-functionalised SSBR).
  extraction_method: pdf_extracted
