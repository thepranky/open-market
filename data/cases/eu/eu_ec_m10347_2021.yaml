- passage_id: sp_11
  source_document_id: eu_ec_m10347_2021_decision
  page: '9'
  quote_snippet: (43) The market investigation did not provide any indications against the arguments
    of the Notifying Party concerning the absence of barriers (such as trade tariffs or environmental
    rules) for SSBR to be imported in the EEA from around the world.51 One customer said that
    “[We] procure SSBR globally (through annual global invitations to tender) from all of the
    main SBR suppliers. The proximity of the locations of the suppliers’ plants to [our company]
    is not a condition for being invited to tender”52, while a competitor replied that “…Each
    major manufacturer has only a few production facilities worldwide, each supplying customers
    all around the globe. The main customers are all global players active in the tire industry.
    …”.53 As SSBR, and particularly functionalised SSBR, is a less commoditised and higher value-added
    product than ESBR, transport cost is relatively less significant.
