- passage_id: sp_10
  source_document_id: eu_ec_m10347_2021_decision
  page: '9'
  quote_snippet: (44) It can therefore be concluded that the geographic scope for SSBR, as well
    as for its sub-segmentations, non-functionalised and functionalised SSBR is most likely
    worldwide. If the scope is considered narrower than worldwide, it is likely to encompass
    the European region, as similarly to ESBR no tariff or regulatory hurdles exist. However,
    as the Transaction does not give rise to serious doubts as to its compatibility with the
    internal market or the functioning of the EEA agreement under either a worldwide scope or
    a scope limited to the European region, the issue can be left open.
