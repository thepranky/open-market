product_markets_considered:
- market_id: pm_1
  name: ESBR
  definition_status: defined
  notes: The Commission concluded that ESBR and SSBR constitute separate product markets. Further
    segmentation of ESBR (e.g., on the basis of oil extension, individual grades, application)
    was not considered appropriate based on market investigation findings.
- market_id: pm_2
  name: SSBR
  definition_status: segmented
  notes: The Commission concluded that SSBR and ESBR constitute separate product markets. However,
    the question of further sub-segmentation of SSBR into non-functionalised SSBR and functionalised
    SSBR was left open, as the transaction did not raise competition concerns under any plausible
    definition.
geographic_markets_considered:
- market_id: gm_1
  name: ESBR — European region or global
  definition_status: left_open
  notes: The Commission left open whether the appropriate geographic scope for ESBR is the European
    region or global, as the transaction did not raise serious doubts under either definition.
    It was considered that if narrower than worldwide, it would encompass the European region
    due to transport costs and the presence of non-EEA suppliers in the region.
- market_id: gm_2
  name: SSBR (including functionalised and non-functionalised SSBR) — worldwide or European
    region
  definition_status: left_open
  notes: The Commission concluded that the geographic scope for SSBR (including its sub-segmentations)
    is most likely worldwide, or at least the European region, and left the exact definition
    open as the transaction did not raise serious doubts under either scope. Market investigation
    showed global sourcing by customers and suppliers.
