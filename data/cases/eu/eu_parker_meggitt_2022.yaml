- passage_id: sp_1
  source_document_id: eu_parker_meggitt_2022_decision
  page: '70'
  quote_snippet: Where, as in this case, a notified concentration raises serious doubts as to
    its compatibility with the internal market, the Parties may modify the notified concentration
    so as to remove the grounds for the serious doubts identified by the Commission with a view
    to having it declared compatible with the internal market pursuant to Article 6(1)(b) in
    conjunction with Article 6(2) of the Merger Regulation.
