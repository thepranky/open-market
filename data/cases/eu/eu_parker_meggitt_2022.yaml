  page: '79'
  quote_snippet: Pursuant to Article 6(2) of Council Regulation (EC) No 139/2004 (the “Merger
    Regulation”), Parker-Hannifin Corporation (“Parker” or the “Notifying Party”) hereby enters
    into the following Commitments (the “Commitments”) vis-à-vis the European Commission (the
    “Commission”) with a view to rendering the acquisition by Parker of Meggitt PLC (“Meggitt”)
    (the “Concentration”) compatible with the internal market and the functioning of the EEA
    Agreement.
