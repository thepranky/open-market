product_markets_considered:
- market_id: pm_1
  name: AWB for general aviation
  definition_status: defined
  notes: The Commission defines separate product markets for AWB by aircraft type. For AWB for
    general aviation, the Commission left open the questions of segmentation between original
    parts and spare parts, and between piston and turboprop aircraft.
- market_id: pm_2
  name: AWB for business jets
  definition_status: defined
  notes: The Commission defines separate product markets for AWB by aircraft type. For AWB for
    business jets, the Commission concludes there is no need to define separate markets by weight
    range.
- market_id: pm_3
  name: AWB for military fixed-wing UAVs
  definition_status: defined
  notes: The Commission defines separate product markets for AWB by aircraft type, including
    military fixed-wing UAVs, which are developed specifically for military applications.
- market_id: pm_4
  name: AWB for military fixed-wing trainers
  definition_status: defined
  notes: The Commission defines separate product markets for AWB by aircraft type, including
    military fixed-wing trainers, which are developed specifically for military applications.
    For AWB for military fixed-wing trainers, the Commission left open the question of segmentation
    between turboprop and jet aircraft.
- market_id: pm_5
  name: AWB for helicopters
  definition_status: defined
  notes: The Commission defines separate product markets for AWB by aircraft type. For AWB for
    helicopters, the Commission left open the question of segmentation between civil and military
    use.
- market_id: pm_6
  name: Aerospace pneumatic valves
  definition_status: left_open
  notes: The Commission left open the exact product market definition for pneumatic valves,
    as well as potential narrower segmentations between airframe and engine systems or by valve
    type, because the transaction did not raise serious doubts irrespective of these distinctions.
geographic_markets_considered:
- market_id: gm_1
  name: AWB — global
  definition_status: defined
  notes: The Commission concluded that the relevant geographic market for the manufacture and
    supply of AWB is global in scope, noting that market investigation results did not support
    narrower markets even for military applications.
- market_id: gm_2
  name: Aerospace pneumatic valves — global
  definition_status: considered
  notes: The Commission considered the geographic market for aerospace pneumatic valves is likely
    global in scope, based on market investigation responses.
