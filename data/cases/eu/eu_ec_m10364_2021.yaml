product_markets_considered:
- market_id: pm_1
  name: Procurement of electronics
  definition_status: left_open
  notes: The Commission considered plausible relevant product markets for the procurement of
    electronics could encompass all types of electronics, as well as possible narrower segments
    according to product groups, and a further distinction based on procurement from manufacturers
    or wholesalers. The exact product market definition was left open.
- market_id: pm_2
  name: Wholesale of electronics
  definition_status: left_open
  notes: The Commission considered plausible relevant product markets for the wholesale of electronics
    could be defined according to broad product categories or sub-segments, and distinguishing
    between direct/indirect sales. The exact product market definition was left open.
- market_id: pm_3
  name: Wholesale of non-food products
  definition_status: left_open
  notes: The Commission considered plausible relevant product markets for the wholesale of non-food
    products could be defined according to broad product categories, or even narrower segments
    such as maternity products and toys and games. The exact market definition was left open.
- market_id: pm_4
  name: Retail of electronics
  definition_status: left_open
  notes: The Commission considered plausible relevant product markets for the retail of electronics
    could be defined according to the use of products (e.g., brown goods, LDA, SDA, IT/TC) and
    distribution channels (brick-and-mortar vs. online). The exact product market definition
    was left open.
- market_id: pm_5
  name: Retail of non-food products
  definition_status: left_open
  notes: The Commission considered that it is not possible to exclude that the market for the
    retail of non-food products should be further segmented by product groups and/or distribution
    channels. The exact market definition was left open.
- market_id: pm_6
  name: Retail of mobile telecommunications services
  definition_status: left_open
  notes: The Commission considered potential further segmentations based on service type and
    customer type, but in past practice often defined the market without further segmentation.
    The exact product market definition was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Procurement of electronics — national
  definition_status: left_open
  notes: The Commission considered that the geographic market for the procurement of electronics
    could be at least national, or wider (EEA/global). The exact geographic market definition
    was left open, but the assessment was conducted on a national basis.
- market_id: gm_2
  name: Wholesale of electronics — national
  definition_status: left_open
  notes: The Commission considered the wholesale of electronics to be either EU/EEA-wide or
    national. The exact geographic market definition was left open, but the assessment was conducted
    on a national basis.
- market_id: gm_3
  name: Wholesale of non-food products — national
  definition_status: left_open
  notes: The Commission considered that the relevant geographic markets for the wholesale of
    non-food products are likely national in scope. The exact geographic market definition was
    left open.
- market_id: gm_4
  name: Retail of electronics — national / local
  definition_status: left_open
  notes: The Commission considered the geographic market for electrical retailing to likely
    be national in scope, but also acknowledged the possibility of narrower local markets for
    offline shopping. The exact geographic market definition was left open, but the assessment
    was based on national markets.
- market_id: gm_5
  name: Retail of non-food products — national / local / regional
  definition_status: left_open
  notes: The Commission considered that the relevant geographic markets for the online retail
    of non-food products is likely national, whereas the offline segment could be local, regional
    or national in scope. The exact geographic market definition was left open, but the assessment
    was based on national markets.
- market_id: gm_6
  name: Retail of mobile telecommunications services — national
  definition_status: left_open
  notes: The Commission has consistently found that the markets for retail mobile services are
    national in scope. The exact geographic market definition was left open, but the assessment
    was conducted on national markets.
