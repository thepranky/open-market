  page: '15'
  quote_snippet: In any event, for the purpose of this Decision, the exact geographic market
    definition with regard to the retail of non-food products may be left open, as the Transaction
    does not give rise to serious doubts as to its compatibility with the internal market or
    the functioning of the EEA Agreement regardless of the precise geographic market definition.
    Under a conservative approach the Transaction should be analysed based on local markets
    for the offline segment, but as the Notifying Parties submit that, to the best of their
    knowledge, there are no local offline markets that would be affected, the Commission will
    base the competitive assessment of (i) both the offline and the online segment and (ii)
    the online segment, on national markets.
