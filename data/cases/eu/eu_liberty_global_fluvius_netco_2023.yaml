  quote_snippet: (140) Multi-play services include several telecommunications products (mobile
    services and one or more of the fixed services such as fixed internet, fixed voice and TV),
    which are provided to consumers through a common offer. The question arises whether there
    is a market for the retail supply of multi-play services that is separate from the retail
    markets for each of the underlying individual telecommunications services, i.e. television,
    voice and Internet access. Telenet is active on this potential market.
