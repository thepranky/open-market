  page: '14'
  quote_snippet: (66) As the Internet works as a network of networks, a local Internet Service
    Provider (“ISP”) who wants to offer internet services to end-customers must connect with
    other networks in order to allow its end-customers to exchange traffic with other end-customers
    / content providers beyond its own local network. In order to reach networks at far distance,
    an ISP has to connect to larger networks, which can link two ISPs to each other. Such connectivity
    can be acquired either by peering (the mutual and free exchange of traffic between two networks)
    or by transit (the provision, for a fee, of access to the Internet via a network). Peering
    offers access only to the customers of the other network whereas a transit supplier gives
    access to the whole Internet. Peering usually occurs between ISPs of like size and geographical
    reach. Smaller networks can usually obtain connectivity to the larger ones only by paying
    for transit.
  extraction_method: pdf_extracted
  review_status: unreviewed
