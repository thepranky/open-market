product_markets_considered:
- market_id: pm_1
  name: Wholesale broadband access
  definition_status: left_open
  notes: The Commission considered a separate market for wholesale broadband access or plausible
    narrower segmentations for (i) the level where the point of interconnection is situated
    (i.e., local or central wholesale broadband access), (ii) the type of access to fixed connections
    (i.e., wholesale LLU, bitstream or resale broadband access), or (iii) the type of technology
    (i.e., DSL/copper, cable or fibre). The exact scope was left open.
- market_id: pm_2
  name: Wholesale supply of leased lines
  definition_status: left_open
  notes: The Commission considered the relevant product market to be the leased lines market.
    The questions of whether this market includes dark fibre or not, and whether there exist
    separate segmentations for passive (i.e. dark fibre) and active infrastructure, were left
    open.
- market_id: pm_3
  name: Wholesale access to TV services
  definition_status: left_open
  notes: The Commission considered whether there exists a separate market for wholesale access
    to TV services or segmentations according to the type of technology (DSL/copper or cable).
    The exact scope was left open.
- market_id: pm_4
  name: Wholesale internet connectivity services
  definition_status: considered
  notes: The Commission considered the relevant product market to be the wholesale internet
    connectivity services market. The question of whether this market can be further segmented
    between peering and transit services and between Tier 1 and Tier 2 transit providers was
    left open.
- market_id: pm_5
  name: Wholesale access and call origination on mobile networks
  definition_status: defined
  notes: The Commission defined the relevant product market as wholesale access and call origination
    on mobile networks. No segmentation was discussed or found necessary.
- market_id: pm_6
  name: Retail fixed internet services
  definition_status: defined
  notes: The Commission defined the market as the separate market for the retail supply of fixed
    internet access services, excluding FWA services and retail business connectivity services,
    and without the need to further segment the market by technology or download speed.
- market_id: pm_7
  name: Retail fixed voice services
  definition_status: defined
  notes: The Commission defined the market as the market for retail fixed voice services, without
    any subdivisions between local/national and international calls, residential and non-residential
    customers, and including Voice over Internet Protocol (“VoIP”) services.
- market_id: pm_8
  name: Retail business connectivity services
  definition_status: defined
  notes: The Commission defined the market as retail business connectivity services excluding
    fixed wireless access (“FWA”), without segmentation by technology or download speed.
- market_id: pm_9
  name: Retail mobile communications services
  definition_status: defined
  notes: The Commission defined the market as retail mobile telecommunications services without
    segmentation by type of service or type of network technology.
- market_id: pm_10
  name: Retail provision of free-to-air TV
  definition_status: defined
  notes: The Commission defined this as a separate market within retail audio-visual services,
    without further segmentation.
- market_id: pm_11
  name: Retail provision of pay TV services
  definition_status: defined
  notes: The Commission defined this as a separate market within retail audio-visual services,
    without further segmentation.
- market_id: pm_12
  name: Retail supply of multi-play services
  definition_status: left_open
  notes: The question of whether there exist one or more multi-play markets that are distinct
    from each of the underlying individual telecommunications services (television, voice and
    Internet access) was left open, as market investigation results were inconclusive.
