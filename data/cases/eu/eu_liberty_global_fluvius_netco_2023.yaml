  quote_snippet: (146) In previous decisions, the Commission considered that the geographic
    scope of any possible retail market for multi-play services would be national since the
    components of the multi-play offers are offered individually at a national level, and the
    bundling of the services would not change the geographic scope of the components.151 In
    three recent decisions relating to the Belgian market, the Commission however left the question
    of the geographic market definition open.152
