- passage_id: sp_1
  source_document_id: eu_ec_m9695_2020_decision
  page: '3'
  quote_snippet: In the past, the Commission has considered that luxury products should be distinguished
    from mass-market goods, as they do not share the same characteristics (luxury goods are
    characterized by relatively high prices, rich creative content and are marketed under a
    prestige trademark). The Commission has ultimately left the market definition open in this
    regard.
  extraction_method: pdf_extracted
