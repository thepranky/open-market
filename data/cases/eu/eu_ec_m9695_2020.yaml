product_markets_considered:
- market_id: pm_1
  name: Luxury goods
  definition_status: left_open
  notes: The Commission left open whether luxury goods should be considered a single market
    or subdivided into categories like fashion/leather goods, perfumes/cosmetics, watches/jewellery,
    etc. It concluded that luxury goods are distinct from mass-market goods.
- market_id: pm_2
  name: Luxury fashion and leather goods
  definition_status: left_open
  notes: Considered as a potential sub-segment within luxury goods, but its definition was left
    open.
- market_id: pm_3
  name: Luxury fashion accessories and eyewear
  definition_status: left_open
  notes: Considered as a potential sub-segment within luxury goods, but its definition was left
    open.
- market_id: pm_4
  name: Luxury watches and jewellery
  definition_status: left_open
  notes: Considered as a potential sub-segment within luxury goods, with market investigation
    pointing towards distinct markets for jewellery and watches. However, the exact market definition
    was left open.
- market_id: pm_5
  name: Luxury perfumes and cosmetics
  definition_status: left_open
  notes: Considered as a potential sub-segment within luxury goods, but its definition was left
    open.
- market_id: pm_6
  name: Luxury home products
  definition_status: left_open
  notes: Considered as a potential sub-segment within luxury goods, but its definition was left
    open.
- market_id: pm_7
  name: Luxury jewellery
  definition_status: left_open
  notes: The market investigation suggested a distinction between luxury jewellery and luxury
    watches, but the exact market definition for luxury jewellery was left open. Further segmentations
    within luxury jewellery were also considered and left open.
- market_id: pm_8
  name: Branded luxury jewellery
  definition_status: left_open
  notes: Market investigation suggested distinguishing branded from unbranded luxury jewellery,
    but the exact segmentation was left open.
- market_id: pm_9
  name: Unbranded luxury jewellery
  definition_status: left_open
  notes: Market investigation suggested distinguishing unbranded from branded luxury jewellery,
    but the exact segmentation was left open.
- market_id: pm_10
  name: Luxury jewellery — by price points
  definition_status: left_open
  notes: Market investigation revealed segmentation by price points is relevant, but views on
    specific thresholds differed. The exact segmentation was left open.
- market_id: pm_11
  name: Luxury jewellery — bridal/non-bridal
  definition_status: left_open
  notes: Market investigation suggested bridal and non-bridal jewellery can be distinct from
    a demand-side perspective, but most suppliers offer both. The exact segmentation was left
    open.
- market_id: pm_12
  name: Luxury jewellery — by material (silver/gold/other)
  definition_status: left_open
  notes: Mentioned as a possible segmentation by market participants, but the exact segmentation
    was left open.
- market_id: pm_13
  name: Luxury jewellery — by end use (e.g. earrings, bracelets, necklaces, rings)
  definition_status: left_open
  notes: Mentioned as a possible segmentation by market participants, but the exact segmentation
    was left open.
- market_id: pm_14
  name: Luxury diamond jewellery
  definition_status: left_open
  notes: The market investigation found that a majority of respondents did not consider a separate
    product market for luxury diamond jewellery appropriate.
- market_id: pm_15
  name: Luxury watches
  definition_status: left_open
  notes: The market investigation suggested a distinction between luxury watches and luxury
    jewellery, but the exact market definition for luxury watches was left open. Further segmentations
    within luxury watches were also considered and left open.
- market_id: pm_16
  name: Luxury watches — by price points
  definition_status: left_open
  notes: Market investigation indicated that a segmentation of luxury watches by price thresholds
    is relevant, and views converged on suggested thresholds. However, the exact segmentation
    was left open.
- market_id: pm_17
  name: Luxury watches — branded/unbranded
  definition_status: left_open
  notes: Considered as a potential segmentation for luxury watches, but the exact definition
    was left open.
- market_id: pm_18
  name: Luxury goods — brick and mortar retail
  definition_status: left_open
  notes: Considered as a potential segmentation for luxury goods distribution channels, but
    the exact definition was left open.
- market_id: pm_19
  name: Luxury goods — online retail
  definition_status: left_open
  notes: Considered as a potential segmentation for luxury goods distribution channels, but
    the exact definition was left open.
- market_id: pm_20
  name: Luxury goods — travel retail
  definition_status: left_open
  notes: Considered as a potential segmentation for luxury goods distribution channels, but
    the exact definition was left open. Commission precedent considered travel retail distribution
    of luxury products at least EEA-wide.
- market_id: pm_21
  name: Luxury goods — wholesale/intermediaries
  definition_status: left_open
  notes: Considered as a potential segmentation for luxury goods distribution channels, but
    the exact definition was left open. Market investigation also suggested distinguishing product
    markets for different customer groups within wholesale supply.
geographic_markets_considered:
- market_id: gm_1
  name: Luxury goods — worldwide/EEA-wide/national
  definition_status: left_open
  notes: The Commission's precedents left open the geographic scope for luxury products. The
    market investigation indicated competitive conditions are generally worldwide and at least
    EEA-wide, but the definition was ultimately left open.
- market_id: gm_2
  name: Luxury jewellery — worldwide/EEA-wide/national
  definition_status: left_open
  notes: Competitors indicated activities extended worldwide, with branded jewellery possibly
    global or EEA-wide, and unbranded local. Consumer preferences within the EEA were not different.
    The definition was left open.
- market_id: gm_3
  name: Luxury watches — worldwide/EEA-wide/national
  definition_status: left_open
  notes: The majority of respondents considered the main geographic scope of activities worldwide.
    Watch portfolios tended to be similar across EEA countries. The definition was left open.
- market_id: gm_4
  name: Luxury goods per sales channel — worldwide/EEA-wide/national
  definition_status: left_open
  notes: The market investigation found competitive conditions generally the same worldwide
    and at least EEA-wide for sales channels, with no indication of differences at country level
    within the EEA. The Commission decided not to distinguish between sales channels for national
    markets, and the overall geographic market definition was left open.
