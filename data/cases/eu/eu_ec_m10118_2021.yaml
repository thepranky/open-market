  page: '7'
  quote_snippet: (26) Investindustrial’s shares for the manufacture and supply of S-PVC compounds
    are well below 30% under all plausible market definitions. Likewise Guala’s shares are below
    30% for the production of aluminium closures (across all end-uses) as well as for the production
    of closures for specific end-uses (across all materials). Therefore, on this basis, the
    Transaction does not give rise to vertically affected markets.
