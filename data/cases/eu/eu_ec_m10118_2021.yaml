product_markets_considered:
- market_id: pm_1
  name: Manufacture and supply of S-PVC compounds
  definition_status: left_open
  notes: The Commission left open whether this constitutes a single market or distinct markets
    for dry blend and gelled S-PVC compounds.
- market_id: pm_2
  name: Manufacture and supply of closures
  definition_status: left_open
  notes: The Commission left open whether the market for aluminium closures constitutes a separate
    market from other types of closures, and whether segmentation based on end-use is appropriate.
    Segmentation by material (aluminium vs. plastic) and end-use (e.g. for beverages, or for
    wine bottles) was considered based on past cases and market investigation.
geographic_markets_considered:
- market_id: gm_1
  name: Manufacture and supply of S-PVC compounds — EEA-wide or regional
  definition_status: left_open
  notes: The Commission left open whether the geographic scope of this market is EEA-wide or
    regional.
- market_id: gm_2
  name: Manufacture and supply of closures — EEA-wide or broader
  definition_status: left_open
  notes: The Commission left open whether the geographic scope of this market is EEA-wide or
    broader (e.g., worldwide).
