- passage_id: sp_1
  source_document_id: eu_ec_m10206_2021_decision
  page: '5'
  quote_snippet: For the purpose of this decision, as in M.10122 MM/Kotkamills, the exact product
    market definition can be left open between an overall market for cartonboard or FBB, and
    between an overall FBB market or sub-segments for FBB according to end use or sub-grade
    of FBB. This is because the Transaction does not raise serious doubts as to its compatibility
    with the internal market or the functioning of the EEA Agreement under any plausible market
    definition.
