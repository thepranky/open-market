- passage_id: sp_19
  source_document_id: eu_ec_m10206_2021_decision
  page: '8'
  quote_snippet: In previous cases, the Commission has defined folding boxes as multi-layered
    paperboard cartons which are printed/coated and cut into carton blanks. The carton blanks
    also incorporate creases, which enable the carton to be formed for packaging the customer's
    product. Folding boxes can be used to pack a wide range of products, such as cosmetics,
    tobacco, pharmaceuticals, etc. The Commission established that these products have different
    requirements for packaging, therefore the folding box market could be further subdivided
    by end-use application.
  extraction_method: pdf_extracted
