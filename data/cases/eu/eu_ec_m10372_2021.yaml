product_markets_considered:
- market_id: pm_1
  name: Refined fuel products — upstream activities (exploration and production of crude oil
    and natural gas)
  definition_status: considered
  notes: Referenced from previous decisions regarding the market for refined fuel products.
- market_id: pm_2
  name: Refined fuel products — downstream activities (marketing and distribution)
  definition_status: considered
  notes: Referenced from previous decisions regarding the market for refined fuel products.
- market_id: pm_3
  name: Wholesale supply of diesel (including biodiesel)
  definition_status: considered
  notes: Distinguished as a separate market by fuel type at the wholesale and non-retail sales
    level in previous cases.
- market_id: pm_4
  name: Wholesale supply of gasoline
  definition_status: considered
  notes: Distinguished as a separate market by fuel type at the wholesale and non-retail sales
    level in previous cases.
- market_id: pm_5
  name: Wholesale supply of LPG (including bio LPG)
  definition_status: considered
  notes: Distinguished as a separate market by fuel type at the wholesale and non-retail sales
    level in previous cases.
- market_id: pm_6
  name: Wholesale supply of heavy fuel oil
  definition_status: considered
  notes: Distinguished as a separate market by fuel type at the wholesale and non-retail sales
    level in previous cases.
- market_id: pm_7
  name: Wholesale supply of light fuel oil
  definition_status: considered
  notes: Distinguished as a separate market by fuel type at the wholesale and non-retail sales
    level in previous cases.
- market_id: pm_8
  name: Retail supply of motor fuel (diesel, gasoline or LPG)
  definition_status: considered
  notes: The retail level for motor fuels was considered one market in previous cases due to
    supply-side substitutability, despite no demand-side substitutability.
- market_id: pm_9
  name: Ex-refinery sales of rDME
  definition_status: left_open
  notes: The Commission explicitly stated that the precise product market definition for rDME
    could be left open, considering scenarios where it forms a separate market or is part of
    a broader fuel market.
- market_id: pm_10
  name: Non-retail sales of LPG (including fossil LPG, blended LPG with rDME, and bio LPG)
  definition_status: left_open
  notes: The Commission assessed this as a downstream market potentially vertically linked to
    rDME, and as part of a hypothetical wider market for horizontal assessment. The precise
    product market definition was left open.
- market_id: pm_11
  name: Retail sales of LPG (including fossil LPG, blended LPG with rDME, and bio LPG)
  definition_status: left_open
  notes: The Commission assessed this as a downstream market potentially vertically linked to
    rDME, and as part of a hypothetical wider market for horizontal assessment. The precise
    product market definition was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Upstream activities (exploration and production of crude oil and natural gas) — EEA-wide
  definition_status: considered
  notes: Referenced as a previous Commission consideration, with the question ultimately left
    open.
- market_id: gm_2
  name: Refined fuel products — national
  definition_status: considered
  notes: Previous decisions considered downstream refined fuel markets to have a national dimension,
    although the market investigation in this case was inconclusive.
- market_id: gm_3
  name: Ex-refinery sales of rDME — national / EEA-wide (Denmark, France, Ireland, Austria affected)
  definition_status: left_open
  notes: The Commission left open the precise geographic market definition for rDME, noting
    that no competition concerns would arise under any plausible definition, even at a national
    level. The market investigation was inconclusive, with competitors suggesting wider than
    national and customers suggesting national.
- market_id: gm_4
  name: Non-retail sales of LPG (including fossil LPG, blended LPG with rDME, and bio LPG) —
    national (Denmark, France, Ireland affected)
  definition_status: left_open
  notes: The Commission identified national markets as vertically affected for non-retail LPG
    sales. The precise geographic market definition was left open, as no competition concerns
    would arise even at a national level.
- market_id: gm_5
  name: Retail sales of LPG (including fossil LPG, blended LPG with rDME, and bio LPG) — national
    (Austria, France, Ireland affected)
  definition_status: left_open
  notes: The Commission identified national markets as vertically affected for retail LPG sales.
    The precise geographic market definition was left open, as no competition concerns would
    arise even at a national level.
