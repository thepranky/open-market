- passage_id: sp_4
  source_document_id: eu_ec_m10372_2021_decision
  page: '4'
  quote_snippet: 'Accordingly, at least the following markets within the first and second levels
    of wholesale distribution can be distinguished: supply of (i) diesel, (ii) gasoline, (iii)
    LPG, (iv) heavy fuel oil and (v) light fuel oil.10 The ‘traditional’ fuel segments also
    include their biofuel variant (e.g., the market segment for diesel also includes biodiesel,
    and the market for LPG also includes bio LPG).'
