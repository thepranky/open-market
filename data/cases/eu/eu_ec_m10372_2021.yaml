- passage_id: sp_3
  source_document_id: eu_ec_m10372_2021_decision
  page: '4'
  quote_snippet: Downstream activities encompass the marketing and distribution of refined fuel
    products. In previous cases, the Commission consistently distinguished three different levels
    of distribution, two of which occur at the wholesale level (i.e. (i) ex-refinery sales and
    (ii) non-retail sales)9 and a third which relates to retail sales (i.e. sales exclusively
    to end customers).
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
