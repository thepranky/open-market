product_markets_considered:
- market_id: pm_1
  name: Dairy Cultures
  definition_status: considered
  notes: The Commission considered it appropriate to assess separately the markets for Dairy
    Cultures, Cultures for Meat and Cultures for Plant-based food, but ultimately left the exact
    scope of product market definition for Cultures open.
- market_id: pm_2
  name: Cultures for Meat
  definition_status: considered
  notes: The Commission considered it appropriate to assess separately the markets for Dairy
    Cultures, Cultures for Meat and Cultures for Plant-based food, but ultimately left the exact
    scope of product market definition for Cultures open.
- market_id: pm_3
  name: Cultures for Plant-based food
  definition_status: considered
  notes: The Commission considered it appropriate to assess separately the markets for Dairy
    Cultures, Cultures for Meat and Cultures for Plant-based food, but ultimately left the exact
    scope of product market definition for Cultures open.
- market_id: pm_4
  name: Plant-based Proteins, segmented by source
  definition_status: considered
  notes: The Commission considered it appropriate to assess separate markets for the supply
    of Plant-based Proteins segmented by source, type, and application, but ultimately left
    the exact scope of the product market definition for Plant-based Proteins open.
- market_id: pm_5
  name: Plant-based Proteins, segmented by type
  definition_status: considered
  notes: The Commission considered it appropriate to assess separate markets for the supply
    of Plant-based Proteins segmented by source, type, and application, but ultimately left
    the exact scope of the product market definition for Plant-based Proteins open. Segmented
    by type includes Soy-based and Pea-based Isolates and Concentrates, and further segmented
    Soy-based Proteins into SPI, SPC and TSP.
- market_id: pm_6
  name: Plant-based Proteins, segmented by application
  definition_status: considered
  notes: The Commission considered it appropriate to assess separate markets for the supply
    of Plant-based Proteins segmented by source, type, and application, but ultimately left
    the exact scope of the product market definition for Plant-based Proteins open. Segmented
    by application includes meat substitutes and active nutrition (snacks and beverages).
- market_id: pm_7
  name: Locust Bean Gum
  definition_status: considered
  notes: The Commission considered it appropriate to distinguish separate markets for the supply
    of Gums, segmented by source (in particular Locust Bean Gum) and further segmented by application,
    but ultimately left the exact scope of the product market definition for Gums open.
- market_id: pm_8
  name: Locust Bean Gum for infant nutrition
  definition_status: considered
  notes: The Commission considered it appropriate to distinguish separate markets for the supply
    of Gums, segmented by source (in particular Locust Bean Gum) and further segmented by application,
    but ultimately left the exact scope of the product market definition for Gums open.
- market_id: pm_9
  name: Microcrystalline Cellulose (MCC)
  definition_status: left_open
  notes: The Commission considered previous decisions on MCC, noting that it was part of a pharmaceutical
    excipients market and later whether there was a distinct market for all MCC types, but ultimately
    left the definition open. The market investigation results for segmentation by application
    (food vs. pharmaceutical) were not conclusive.
- market_id: pm_10
  name: Synthetic Emulsifiers
  definition_status: considered
  notes: The Commission considered it appropriate to distinguish between Synthetic Emulsifiers
    and Lecithin-derived Emulsifiers, and further distinguish Synthetic Emulsifiers by chemical
    class, but ultimately left the exact scope of product market definition for Emulsifiers
    open.
- market_id: pm_11
  name: Lecithin-derived Emulsifiers
  definition_status: considered
  notes: The Commission considered it appropriate to distinguish between Synthetic Emulsifiers
    and Lecithin-derived Emulsifiers, and further distinguish Lecithin-derived Emulsifiers by
    type (Special Fluid, De-Oiled, Fractioned), but ultimately left the exact scope of product
    market definition for Emulsifiers open.
- market_id: pm_12
  name: Industrial Enzymes
  definition_status: considered
  notes: The Parties and market investigation respondents generally agreed that Industrial Enzymes
    and Specialty Enzymes belong to separate markets and that Industrial Enzymes could be segmented
    by end application, but no further segmentation was warranted within food applications.
    The Commission ultimately left the exact market definition open.
- market_id: pm_13
  name: Specialty Enzymes
  definition_status: considered
  notes: The Parties and market investigation respondents generally agreed that Industrial Enzymes
    and Specialty Enzymes belong to separate markets. The Commission ultimately left the exact
    market definition open.
- market_id: pm_14
  name: Probiotics for human health
  definition_status: considered
  notes: The provided text only contains the Parties' view that the relevant product market
    should include all probiotics used in human health due to high demand and supply-side substitutability.
    The Commission's assessment or conclusion on this market definition is not available in
    the supplied chunks.
geographic_markets_considered:
- market_id: gm_1
  name: Dairy Cultures, Cultures for Meat and Cultures for Plant-based food — EEA-wide or worldwide
  definition_status: left_open
  notes: The market investigation was inconclusive; customers leaned towards an EEA-wide scope,
    while competitors indicated a worldwide scope. The Commission ultimately left the exact
    geographic market definition open.
- market_id: gm_2
  name: Soy-based Proteins — worldwide
  definition_status: left_open
  notes: The market investigation provided indications suggesting a worldwide scope, but the
    Commission ultimately left the exact geographic market definition open.
- market_id: gm_3
  name: Locust Bean Gum — worldwide
  definition_status: left_open
  notes: The market investigation provided indications suggesting a worldwide scope, but the
    Commission ultimately left the exact geographic market definition open.
- market_id: gm_4
  name: Microcrystalline Cellulose (MCC) — worldwide
  definition_status: left_open
  notes: A small majority of customers and competitors considered the market to be worldwide,
    but the Commission ultimately left the exact geographic market definition open.
- market_id: gm_5
  name: Emulsifiers — worldwide
  definition_status: left_open
  notes: The market investigation was inconclusive, but the Commission considered that a worldwide
    geographic market definition may be most appropriate. However, the exact scope was ultimately
    left open.
- market_id: gm_6
  name: Enzymes — EEA-wide or worldwide
  definition_status: left_open
  notes: The market investigation results were not conclusive, with customers leaning EEA-wide
    and competitors worldwide. The Commission ultimately left the exact geographic market definition
    open.
