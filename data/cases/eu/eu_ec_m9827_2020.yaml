- passage_id: sp_12
  source_document_id: eu_ec_m9827_2020_decision
  page: '15'
  quote_snippet: In conclusion, the Commission considers that, for the purposes of this Decision,
    it is appropriate to assess the market for Plant-based Proteins, distinguishing between
    (i) separate markets for the supply of Plant-based Proteins, segmented by type, in particular
    Soy-based and Pea-based Isolates and Concentrates; (ii) separate markets for the supply
    of Soy-based Proteins, segmented by type, in particular SPI, SPC and TSP; and (iii) separate
    markets for the supply of Plant-based Proteins, segmented by application, in particular
    meat substitutes and active nutrition, including snacks and beverages. In any event, for
    the purposes of this Decision, the exact scope of the product market definition with respect
    to Plant-based Proteins can be left open, since the Transaction would not raise serious
    doubts as to its compatibility with the internal market under any plausible alternative
    product market definition.
