- passage_id: sp_7
  source_document_id: eu_mowi_nova_sea_2025_decision
  page: '8'
  quote_snippet: 'In line with the Commission’s findings in its past decisions, the market investigation
    elicited several elements suggesting that the relevant market for the farming and primary
    processing of NFAS is EEA-wide in scope. The market investigation confirmed in particular
    that: (i) Norwegian salmon farmers sell and deliver their products across the EEA, (47)
    (ii) transport costs do not play as a significant constraint (48) and (iii) there is no
    significant price difference between EEA Member States. (49)'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets: []
