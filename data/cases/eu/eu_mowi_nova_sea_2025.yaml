product_markets_considered:
- market_id: pm_1
  name: Farming and primary processing of non-organic NFAS, taking into account a possible further
    segmentation for NFAS farmed in the North of Norway
  definition_status: considered
  notes: The Commission assessed the effects of the Transaction on this market as a conservative
    approach, considering it the narrowest plausible market definition. The overall product
    market definition for the farming and processing of salmon was left open.
- market_id: pm_2
  name: Secondary processed salmon with a further segmentation between fresh, frozen and smoked
    salmon
  definition_status: considered
  notes: The Commission assessed the effects of the Transaction on this market as a conservative
    approach, considering it the narrowest plausible market definition. The overall product
    market definition for the secondary processing of salmon was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Farming and supply of primary processed NFAS — EEA-wide
  definition_status: considered
  notes: The exact geographic market definition for the farming and processing of salmon was
    left open, but the Commission assessed the effects of the Transaction at EEA level.
- market_id: gm_2
  name: Secondary processed salmon products — national
  definition_status: considered
  notes: The exact geographic market definition for secondary processing of salmon was left
    open, but the Commission assessed the effects of the Transaction at national level in a
    conservative approach.
