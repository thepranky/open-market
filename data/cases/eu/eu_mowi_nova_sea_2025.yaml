- passage_id: sp_1
  source_document_id: eu_mowi_nova_sea_2025_decision
  page: '7'
  quote_snippet: In any event and for the reasons explained below, the exact product market
    definition for the farming and processing of salmon can be left open as the Transaction
    does not raise serious doubts under any plausible market definition. For the purpose of
    this decision and in a conservative approach, the Commission will assess the effects of
    the Transaction under the narrowest plausible market definition for which the Parties’ combined
    market share is the highest (i.e., the market for the farming and primary processing of
    non-organic NFAS, taking into account a possible further segmentation for NFAS farmed in
    the North of Norway).
