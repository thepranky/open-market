  source_document_id: eu_mowi_nova_sea_2025_decision
  page: '7'
  quote_snippet: In past decisions, the Commission defined the markets for the farming and primary
    processing of salmon as EEA-wide. (42) To reach this conclusion, the Commission explained
    that salmon farmed in Norway, Scotland and Ireland is transported across the EEA and transport
    costs do not appear to materially affect customers’ sourcing decisions. (43)
  extraction_method: pdf_extracted
