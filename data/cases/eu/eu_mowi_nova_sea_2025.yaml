  page: '6'
  quote_snippet: Sixth, several elements also suggest that a further distinction between salmon
    farmed in North of Norway and in South of Norway could be relevant. From a demand point
    of view, the results of the market investigation indicate that differences exist between
    these two categories of NFAS in terms of fat percentage and softness, which increase the
    quality of the salmon farmed in the North of Norway.
