  quote_snippet: '(53) Multiple-play services include varying combinations of mobile telecommunications
    services, fixed internet access, fixed telephony services and TV services. When the offer
    includes mobile telecommunications services, the fixed-mobile bundle is also referred to
    with the “FMC” acronym (i.e. fixed-mobile convergence). In previous decisions, the Commission
    has considered, but ultimately left open, the question as to whether there exists a multiple-play
    services market, distinct from each of the underlying individual telecommunication services.
    The Commission has previously also noted that, instead of one possible market for multiple-play,
    there could be several possible multiple-play markets: a market for fixed bundles (dual
    play, and triple play) and another separate market for FMC bundles.'
  extraction_method: pdf_extracted
  review_status: unreviewed
