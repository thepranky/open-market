product_markets_considered:
- market_id: pm_1
  name: Retail supply of mobile telecommunications services
  definition_status: considered
  notes: The Commission considered an overall retail market for mobile telecommunications services,
    distinct from retail fixed telecommunication services. It concluded that this market does
    not need to be further segmented based on service type (voice calls, SMS, MMS, mobile Internet
    data services) or network technology (2G, 3G, 4G). OTT and M2M services were excluded.
- market_id: pm_2
  name: Retail supply of fixed telephony services including VoIP services
  definition_status: considered
  notes: The Commission considered the relevant product market to be the retail supply of fixed
    telephony services including VoIP services. The question of a distinction between residential
    and non-residential (business) customers was left open, as it did not affect the outcome.
- market_id: pm_3
  name: Retail supply of fixed internet access services to residential and SOHO customers
  definition_status: considered
  notes: The Commission considered the market for the retail supply of fixed internet access
    services, including all product types, distribution modes, and speeds/bandwidths, to residential
    and SOHO customers. Fixed internet access services provided through mobile network infrastructure
    (fLTE) were excluded.
- market_id: pm_4
  name: Retail supply of audio-visual services
  definition_status: considered
  notes: The Commission considered an overall retail market for AV services encompassing all
    distribution technologies (cable, satellite, terrestrial, IPTV) as well as linear and non-linear
    distribution. The questions of segmentation between Free-to-Air (FTA) and pay-TV services,
    and between basic and premium pay-TV services, were left open.
- market_id: pm_5
  name: Retail provision of multiple-play services
  definition_status: left_open
  notes: The Commission considered the existence of a distinct product market for the retail
    supply of multiple-play services and possible segmentations (fixed bundles vs. FMC bundles)
    but ultimately left the question open.
- market_id: pm_6
  name: Wholesale market for termination and hosting of calls to non-geographic numbers
  definition_status: considered
  notes: The Commission considered that there is a distinct product market for the wholesale
    supply of termination and hosting of calls to non-geographic numbers.
- market_id: pm_7
  name: Wholesale supply and acquisition of TV channels
  definition_status: left_open
  notes: The Commission considered a wholesale market for the acquisition and supply of TV channels.
    It left open whether the market should be segmented between FTA and pay-TV channels, between
    basic and premium pay-TV channels, or by genre/thematic content. It concluded that all technology
    distribution platforms are part of the same market.
