  quote_snippet: (8) In previous decisions, the Commission has identified an overall retail
    market for mobile telecommunications services constituting a separate market, distinct from
    retail fixed telecommunication services. The Commission considered that the retail mobile
    telecommunications market does not need to be further segmented based on the type of service
    (voice calls, SMS, MMS, mobile Internet data services), or the type of network technology
    (2G, 3G, 4G).
