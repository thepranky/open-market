  quote_snippet: (40) In previous cases, the Commission has identified a relevant product market
    for the retail supply of audio-visual (“AV”) services, which includes suppliers of linear
    and non-linear AV services and AV content to end customers. The Commission considered a
    number of possible segmentations (i) between Free-to-Air (“FTA) and pay-TV services; (ii)
    within pay-TV services, between linear and non-linear services (Pay-Per-View (“PPV”), Video-on-Demand
    (“VOD”)); (iii) between distribution technologies (cable, satellite, terrestrial television
    and Internet Protocol Television (“IPTV”)); and (iv) premium and basic pay AV services,
    but ultimately left the exact product market definition open.
