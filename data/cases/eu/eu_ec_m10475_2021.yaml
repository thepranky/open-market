  quote_snippet: (9) The Commission considered that Over-the-top (“OTT”) services, whether provided
    over Wi-Fi or via mobile telecommunications data networks, were not part of the market for
    mobile telecommunications services, as OTT rely on mobile telecommunications (data) services
    and/or fixed broadband services to function. Finally, the Commission excluded Machine-to-Machine
    (“M2M”, e.g. energy metering or burglar alarm) services from the overall retail mobile telecommunications
    market, due to the particular characteristics of the demand for and supply of these services.
