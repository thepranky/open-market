product_markets_considered:
- market_id: pm_1
  name: Overall provision of IT services
  definition_status: left_open
  notes: The Commission considered segmenting this market but ultimately left the product market
    definition open.
- market_id: pm_2
  name: Cloud computing (IaaS and PaaS solutions)
  definition_status: left_open
  notes: The Commission referred to a sub-segmentation of IT outsourcing but ultimately left
    the market definition open.
- market_id: pm_3
  name: SaaS solutions
  definition_status: considered
  notes: Considered as part of the IT software market in previous decisions. Segmentation based
    on functionalities, industry sector, and end uses was considered.
- market_id: pm_4
  name: IaaS, PaaS, and SaaS cloud solutions
  definition_status: left_open
  notes: The Commission's market investigation indicated IaaS, PaaS, and SaaS are not interchangeable,
    but ultimately the market definition for these distinctions and further segmentations (public/private/hybrid,
    sovereign/non-sovereign, industry verticals) was left open.
- market_id: pm_5
  name: ANSSI-certified sovereign cloud services
  definition_status: left_open
  notes: The Commission's market investigation found that ANSSI-certified sovereign cloud services
    are generally not interchangeable with standard cloud services from a demand-side perspective,
    and that switching from standard to ANSSI-certified is difficult. The question of a separate
    market was left open.
- market_id: pm_6
  name: Application implementation and managed services
  definition_status: left_open
  notes: The question of whether to distinguish this market and segment it further by industry
    vertical was left open.
- market_id: pm_7
  name: Infrastructure implementation and managed services
  definition_status: left_open
  notes: The question of whether to distinguish this market and segment it further by industry
    vertical was left open.
- market_id: pm_8
  name: Retail supply of fixed telephony services, including VoIP services
  definition_status: considered
  notes: The Commission considered this market for the purpose of the decision, but left open
    whether it should be further segmented (e.g., local/national vs international calls, residential
    vs non-residential customers).
- market_id: pm_9
  name: Retail supply of business connectivity services to large businesses and public sector
    customers
  definition_status: considered
  notes: The Commission considered this market for the purpose of the decision, but left open
    whether it should be further segmented (e.g., broadband access, leased lines, VPN services).
geographic_markets_considered:
- market_id: gm_1
  name: IT services and IT software — at least EEA-wide/worldwide
  definition_status: left_open
  notes: The market investigation results were mixed, with some respondents indicating an EEA-wide
    scope for IaaS, PaaS, and SaaS, while the Commission ultimately left the exact geographic
    market definition open.
- market_id: gm_2
  name: Sovereign cloud services, including ANSSI-certified cloud services — national (France
    affected)
  definition_status: considered
  notes: A majority of market participants indicated a national scope for these services due
    to ANSSI certification requirements, despite the overall geographic market for IT services
    being left open.
- market_id: gm_3
  name: Managed services — worldwide
  definition_status: left_open
  notes: The majority of competitors viewed the geographic scope as worldwide, but customer
    views were mixed. The overall geographic market for IT services was left open.
- market_id: gm_4
  name: Retail supply of fixed telephony services, including VoIP services — national or wider
    (France affected)
  definition_status: left_open
  notes: Market investigation yielded mixed views, with customers largely pointing to a national
    scope, while some competitors suggested a wider scope due to VoIP technology. The Commission
    left the exact geographic definition open.
- market_id: gm_5
  name: Retail supply of business connectivity services to large businesses and public sector
    customers — national or wider (France affected)
  definition_status: left_open
  notes: Market investigation showed comparable views for national or wider scope, with some
    services (like VPN) being worldwide and others limited by physical infrastructure. The Commission
    left the exact geographic definition open.
theories_of_harm: []
commitments: []
