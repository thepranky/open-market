- passage_id: sp_13
  source_document_id: eu_ec_m10855_2023_decision
  page: '11'
  quote_snippet: In light of the above and in line with its precedents, the Commission considers
    that, for the purpose of the present Decision, the relevant market is the market for the
    retail supply of fixed telephony services, including VoIP services. The question whether
    such market should be further segmented between local/national and international calls or
    between the different types of end-users can be left open, as the Transaction does not raise
    competition concerns under the Merger Regulation regardless of the precise product market
    definition for fixed telephony services.
