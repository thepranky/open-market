- passage_id: sp_7
  source_document_id: eu_ec_m10855_2023_decision
  page: '9'
  quote_snippet: In any event, the Commission considers that the question whether the IT services
    market should be distinguished between (i) IaaS, PaaS and SaaS (the latter being a possible
    segment of the IT software market); (ii) public, hybrid and private cloud services; (iii)
    ANSSI-certified sovereign cloud services and non-ANSSI-certified cloud services; (iv) infrastructure
    implementation and managed services; and (v) application implementation and managed services
    can be left open as the Transaction does not raise competition concerns regardless of the
    exact product market definition. Likewise, the questions whether (i) IaaS, PaaS and SaaS
    solutions as well as (ii) managed services should be distinguished on the basis of the industry
    verticals can be left open, as the Transaction does not raise competition concerns under
    the Merger Regulation regardless of such possible distinction.
  extraction_method: pdf_extracted
