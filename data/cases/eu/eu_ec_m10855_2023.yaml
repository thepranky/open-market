- passage_id: sp_1
  source_document_id: eu_ec_m10855_2023_decision
  page: '6'
  quote_snippet: In previous decisions, the Commission considered a relevant product market
    for the overall provision of IT services. More recently, the Commission considered segmenting
    such market on the basis of (i) the functionality of the services; and (ii) the industry
    verticals in which the customers are active, but ultimately left the product market definition
    open.
  extraction_method: pdf_extracted
