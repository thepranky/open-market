- passage_id: sp_16
  source_document_id: eu_ec_m10855_2023_decision
  page: '10'
  quote_snippet: The results of the market investigation were mixed as regards the geographic
    scope of the markets for IT services and IT software. While the many respondents indicated
    that the geographic scope of IaaS, PaaS and SaaS as well as private, hybrid and public cloud
    services is at least EEA-wide, a majority of customers and competitors also indicated that
    sovereign cloud services, including ANSSI-certified cloud services, are national in scope,
    because of the requirements for the ANSSI certification according to which the relevant
    operators have to be based in France.
  extraction_method: pdf_extracted
