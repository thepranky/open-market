product_markets_considered:
- market_id: pm_1
  name: Manufacturing and supply of luxury watches
  definition_status: defined
  notes: The Commission confirmed the existence of a separate relevant product market for manufacturing
    and supply of luxury watches. Segmentations by price bands and gender were considered but
    left open, with the Commission assessing the case based on the narrowest plausible market
    including these segmentations.
- market_id: pm_2
  name: Retail of luxury watches
  definition_status: defined
  notes: The Commission confirmed the existence of a separate relevant product market for retailing
    of luxury watches. Segmentations by price bands, gender, and sales channels (brick-and-mortar
    vs. online) were considered but left open, with the Commission assessing the case based
    on the narrowest plausible market including these segmentations.
- market_id: pm_3
  name: Repair and maintenance services for luxury watches
  definition_status: left_open
  notes: The market investigation was inconclusive on whether repair and maintenance services
    constitute a separate product market from the sale of watches, but confirmed that services
    are specific to each watch brand. The Commission left the exact market definition open but
    assessed on the narrowest plausible market for Rolex and Tudor luxury watches separately.
- market_id: pm_4
  name: Supply of spare parts for luxury watches
  definition_status: left_open
  notes: The market investigation found that spare parts are specific to each luxury watch brand
    and that consumers typically request original spare parts. Whether the supply of spare parts
    constitutes a separate market from the sale of watches was inconclusive. The Commission
    left the exact market definition open but assessed on the narrowest plausible markets for
    Rolex and Tudor luxury watches separately.
geographic_markets_considered:
- market_id: gm_1
  name: Manufacturing and supply of luxury watches — global/EEA-wide (scope left open)
  definition_status: left_open
  notes: The market investigation suggested the market is likely global in scope, but the Commission
    left the exact geographic market definition open as the transaction did not raise serious
    doubts under any plausible definition (EEA-wide or global).
- market_id: gm_2
  name: Retail of luxury watches — national/EEA-wide (scope left open)
  definition_status: left_open
  notes: The market investigation suggested the market is likely EEA-wide but also presented
    elements pointing to a national scope (e.g., importance of local presence, customer buying
    habits, differing competing retailers per country). The Commission left the exact geographic
    market definition open as no serious doubts were raised under any plausible definition (national
    or EEA-wide).
- market_id: gm_3
  name: Repair and maintenance services for Rolex and Tudor luxury watches — national (assessment
    at national level)
  definition_status: considered
  notes: Market investigation indicated importance of local presence and customer preference
    for in-person service. The Commission left the exact geographic market definition open but
    assessed the competitive effects at the national level for the purposes of the decision.
- market_id: gm_4
  name: Supply of spare parts for Rolex and Tudor luxury watches — EEA-wide (assessment at EEA-wide
    level)
  definition_status: considered
  notes: Market investigation showed divergent views on geographic scope (worldwide supply by
    manufacturers vs. EEA-wide sourcing by retailers). The Commission left the exact geographic
    market definition open but assessed the competitive effects at the EEA-wide level for the
    purposes of the decision.
