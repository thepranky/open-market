- passage_id: sp_2
  source_document_id: eu_aam_dowlais_2025_decision
  page: '3'
  quote_snippet: An FDU is used in 4WD vehicles which have their primary drive power in the
    rear. FDUs direct power from the rear of the vehicle to the front of the vehicle when 4WD
    mode is engaged. FDUs vary in size and durability based on the vehicle architecture, size,
    and purpose of the vehicle. FDUs are only used in 4WD vehicles (which, in turn, are only
    produced with longitudinal engine layouts).
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
