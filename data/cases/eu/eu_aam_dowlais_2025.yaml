- passage_id: sp_9
  source_document_id: eu_aam_dowlais_2025_decision
  page: '6'
  quote_snippet: Finally, a segmentation of the market for the manufacture and supply of RDMs
    between RDMs for vehicles with either a transverse or longitudinal engine layout does not
    appear necessary. Most market participants consider that, (i) from a demand-side substitutability
    perspective, RDMs for use in vehicles with transverse or longitudinal engine layouts serve
    the same function and have similar designs and, (ii) from a supply-side perspective, a supplier
    of RDMs used in vehicles with longitudinal engine layouts would be able to easily compete
    for contracts for the supply of RDMs used in vehicles with transverse engine layouts (and
    vice-versa).
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
