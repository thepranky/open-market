- passage_id: sp_5
  source_document_id: eu_aam_dowlais_2025_decision
  page: '3'
  quote_snippet: A PTU is used in FWD AWD vehicles to direct power to the RDM via a propshaft.
    It is attached to a vehicle’s transmission. The PTU will commonly include a disconnect system,
    which allows the AWD vehicle to switch between directing power to both the front and rear
    wheels and directing power solely to the front wheels. PTUs are only used in AWD vehicles
    which have a transverse engine layout.
  extraction_method: pdf_extracted
