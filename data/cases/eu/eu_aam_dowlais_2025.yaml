- passage_id: sp_8
  source_document_id: eu_aam_dowlais_2025_decision
  page: '4'
  quote_snippet: An RDM connects to the vehicle’s propshaft and transmits power to the rear
    wheels. RDMs are secondary rear axles found in AWD vehicles (which typically have transverse
    rather than longitudinal layouts) and are used where it is only necessary to put some of
    the engine’s torque through the back wheels. RDMs are used in AWD vehicles with either a
    transverse or longitudinal engine layout.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-12'
  supports_markets:
