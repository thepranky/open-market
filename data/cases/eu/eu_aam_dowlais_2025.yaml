- passage_id: sp_3
  source_document_id: eu_aam_dowlais_2025_decision
  page: '6'
  quote_snippet: The Commission’s market investigation in this case did not reveal reasons justifying
    a further segmentation of the markets for FDUs, PTUs, and RDMs. In particular, the market
    investigation in this case did not yield any indication that a segmentation based on the
    type of vehicle (e.g., heavy, medium, or light vehicle) is necessary.
