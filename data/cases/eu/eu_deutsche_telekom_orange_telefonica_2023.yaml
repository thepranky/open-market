product_markets_considered:
- market_id: pm_1
  name: Digital identification services for targeted advertising and/or site optimisation
  definition_status: defined
  notes: The Commission concluded that this is a distinct market from online advertising intermediation
    services.
- market_id: pm_2
  name: Online advertising intermediation services
  definition_status: considered
  notes: The Commission previously considered segmenting this market but left it open in past
    decisions. The Notifying Parties have very limited activities in this market, and the JV's
    market is distinct from it.
- market_id: pm_3
  name: Retail supply of mobile telecommunications services
  definition_status: defined
  notes: The market excludes OTT and M2M services.
- market_id: pm_4
  name: Retail supply of fixed internet access services
  definition_status: defined
  notes: The market includes all product types, distribution modes, and speeds/bandwidths, to
    residential and SOHO customers, but excludes fLTE and retail business connectivity services.
- market_id: pm_5
  name: Retail supply of audio-visual services
  definition_status: considered
  notes: The Commission considered the overall market encompassing all distribution technologies.
    Segmentation into FTA/pay AV, linear/non-linear, and premium/basic pay AV services was left
    open but the assessment was conducted on the overall market.
- market_id: pm_6
  name: Supply of online advertising space
  definition_status: left_open
  notes: The Commission considered the market separate from offline advertising space and considered
    various segmentations (online search vs. non-search, on vs. off social networks, PC vs.
    mobile platform), but found it unnecessary to conclude on the exact definition for the transaction
    assessment. The assessment focused on the online non-search or display ads on domains other
    than social networks segment.
geographic_markets_considered:
- market_id: gm_1
  name: Digital identification services for targeted advertising and/or site optimisation —
    national (France, Germany, Italy, Spain affected)
  definition_status: considered
  notes: The Commission considered national, EEA-wide or global scope, but assessed the transaction
    on the narrowest plausible market, i.e., national scope for France, Germany, Italy, and
    Spain.
- market_id: gm_2
  name: Online advertising intermediation services — EEA-wide
  definition_status: considered
  notes: This geographic scope was concluded in a recent prior Commission decision for segments
    of the market for non-search display advertising intermediation services.
- market_id: gm_3
  name: Retail supply of mobile telecommunications services — national (France, Germany, Italy,
    Spain affected)
  definition_status: defined
  notes: The Commission's decisional practice is that this market is national in scope.
- market_id: gm_4
  name: Retail supply of fixed internet access services — national (France, Germany, Italy,
    Spain affected)
  definition_status: defined
  notes: The Commission's decisional practice is that this market is national in scope.
- market_id: gm_5
  name: Retail supply of audio-visual services — national (France, Germany, Italy, Spain affected)
  definition_status: considered
  notes: The Commission generally concluded that this market is national or at most linguistically
    homogeneous areas. The assessment for the transaction was performed on national markets.
- market_id: gm_6
  name: Supply of online non-search or display ads or advertising services on domains other
    than social networks — national (France, Germany, Italy, Spain affected)
  definition_status: considered
  notes: The Commission found that the market for online advertising space is national or along
    linguistic borders in previous decisions. For this transaction, it assessed the relevant
    segment on a national basis for France, Germany, Italy, and Spain.
