  page: '18'
  quote_snippet: (109) In light of the above and for the purpose of this decision, the Commission
    considers that the market for the supply of online advertising space to be a market separate
    from the one for the supply for offline advertising space. The Commission further considers
    possible segmentations between the supply of online search and non-search advertising space,
    between the supply of ads on social networks or off social networks, or on the basis of
    the platform (PC versus mobile). However, the Commission considers that it is not necessary
    to conclude on the exact product market definition, as the Transaction does not raise any
    concerns irrespective of the exact product market definition. As the JV will only provide
    input to the operators providing online non-search or display ads or advertising services
    on domains other than social networks, which can be either contextual ads, selected according
    to the content of the page on which they appear, or non-contextual ads, the Commission will
    only consider this segment.
  extraction_method: pdf_extracted
