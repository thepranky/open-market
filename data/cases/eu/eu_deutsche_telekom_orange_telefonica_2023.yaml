  page: '15'
  quote_snippet: '(92) In previous cases, the Commission split the retail supply of AV services
    in two separate markets: free-to-air (“FTA”) and pay AV services.53 In other more recent
    cases, the Commission ultimately left open the product market definition.54 The Commission
    has also considered whether the market for retail pay AV services should be segmented further
    according to: (i) premium pay AV vs basic pay AV services;55 and (ii) linear vs non-linear
    AV services (Pay-per-View (“PPV”), Video-on-Demand (“VOD”));56 but ultimately left the market
    definition open.57 In past decisions, the Commission has considered that all distribution
    technologies are part of the same product market (e.g., cable, satellite, terrestrial television
    and internet protocol television (“IPTV”)).58'
  extraction_method: pdf_extracted
