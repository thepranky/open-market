  page: '16'
  quote_snippet: (95) In light of the above, the Commission considers that, for the purposes
    of this decision, the relevant product market at retail level is the market for the retail
    supply of AV services encompassing all distribution technologies. The question whether the
    retail supply of AV services should be further segmented between (i) FTA and pay AV services,
    as well as the question whether the retail supply of pay AV services should be segmented
    according to (ii) linear and non-linear pay AV services, and, (iii) premium and basic pay
    AV services can be left open as the Transaction does not raise serious doubts as to its
    compatibility with the internal market or the functioning of the EEA Agreement under any
    plausible product market definition.
  extraction_method: pdf_extracted
