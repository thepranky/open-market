- passage_id: sp_5
  source_document_id: eu_meridiam_allianz_neuconnect_2021_decision
  page: '6'
  quote_snippet: The Commission has previously considered that the geographic scope of the market
    for the provision of transnational interconnector capacity for electricity transmission
    would in principle be limited to the respective interconnector line, rendering the operator
    of such an interconnector a natural monopolist. While the Commission found that it is in
    principle possible for market participants to substitute certain interconnectors when booking
    interconnector capacity by using others, this will normally lead to an increase in the number
    of interconnectors used to complete the specific transmission booking path (e.g. transmitting
    electricity through NeuConnect vs. Germany-the Netherlands-the UK). As the Notifying Parties
    confirm, when the Project will enter into operation in 2026, it will be the sole interconnector
    between Germany and the United Kingdom, and as such no direct substitute exists.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets: []
  supports_geographic_markets:
  - gm_1
  supports_theories: []
  supports_commitments: []
- passage_id: sp_6
  source_document_id: eu_meridiam_allianz_neuconnect_2021_decision
  page: '7'
  quote_snippet: The Commission considers that for the purposes of this decision it can be left
    open whether the market for the provision of transnational interconnector capacity for electricity
    transmission only encompasses the respective interconnector line, or whether other interconnection
    lines connecting two electricity grids through an intermediate grid should be considered
    as part of the same geographic market, as no competition concerns would arise even under
    the narrowest geographic market definition.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets: []
  supports_geographic_markets:
  - gm_1
  supports_theories: []
  supports_commitments: []
- passage_id: sp_7
  source_document_id: eu_meridiam_allianz_neuconnect_2021_decision
  page: '6'
  quote_snippet: The Notifying Parties submit that the relevant geographic market for the provision
    of transnational interconnector capacity should not be limited to the respective interconnector
    line. According to the Notifying Parties, the harmonized legal framework at EU level combined
    with a high degree of market transparency results in significant demand-side substitution
    between interconnectors at EU level. In this respect, the Notifying Parties submit that
    planned interconnectors between Belgium or the Netherlands on the one side and the UK on
    the other side will be substitutable with the Project in the future, since Belgium and the
    Netherlands also have interconnector lines to Germany.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
