- passage_id: sp_9
  source_document_id: eu_meridiam_allianz_neuconnect_2021_decision
  page: '7'
  quote_snippet: The Commission has generally defined the market for the generation and wholesale
    supply of electricity as national in scope. However, the Commission has also recognised
    that in some instances the presence of a sufficiently large interconnection capacity between
    Member States may justify broadening the geographic scope of the market. This could also
    be the case if two Member States belong to the same bidding area, meaning areas in which
    market participants are able to exchange electricity without the need for attribution of
    cross-zonal capacity.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets: []
  supports_geographic_markets:
  - gm_3
  supports_theories: []
  supports_commitments: []
- passage_id: sp_10
  source_document_id: eu_meridiam_allianz_neuconnect_2021_decision
  page: '7'
  quote_snippet: For the purpose of this decision, the question whether, with respect to Germany,
    the geographic market for the generation and wholesale supply of electricity should be defined
    as wider than the German territory due to possible present or future interconnections and
    the existence of common bidding zones with other territories, can ultimately be left open
    as no competition concerns would arise even if the geographic market were limited to Germany
    alone.
  extraction_method: pdf_extracted
  review_status: unreviewed
