- passage_id: sp_4
  source_document_id: eu_meridiam_allianz_neuconnect_2021_decision
  page: '6'
  quote_snippet: The Commission considers that in this particular case the market definition
    can ultimately be left open as no competition concerns would arise whether the market is
    defined as encompassing both conventional and renewable generation falling under the EEG
    or whether a separate market were to exist for conventional generation (including renewables
    not covered by the EEG-scheme) on the one hand and renewable generation falling under the
    EEG on the other.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
