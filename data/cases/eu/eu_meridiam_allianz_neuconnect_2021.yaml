- passage_id: sp_3
  source_document_id: eu_meridiam_allianz_neuconnect_2021_decision
  page: '5'
  quote_snippet: The Commission has a consolidated case practice of defining the market for
    the generation and wholesale supply of electricity as encompassing the trading on the wholesale
    market of the generated electricity within a certain geographic market as well as the electricity
    that is physically imported into this geographic market via interconnectors, irrespective
    of the source of generated electricity (such as nuclear, lignite, wind, solar, etc.).
  extraction_method: pdf_extracted
