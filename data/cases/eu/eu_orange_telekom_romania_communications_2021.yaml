- passage_id: sp_9
  source_document_id: eu_orange_telekom_romania_communications_2021_decision
  page: '12'
  quote_snippet: A majority of respondents to the market investigation indicated that Pay AV
    services and FTA services would not fall into separate product markets. In particular, Pay
    AV channels and FTA channels appear to be included in the same monthly subscription. In
    a recent decision of the Romanian Competition Council (“RCC”), the RCC defined a single,
    albeit differentiated, market for the provision of audio-visual services (i.e. FTA AV, basic
    Pay AV, premium Pay AV) to end users was defined. Therefore, the Commission considers that
    the retail market for the provision of AV services in Romania does not need to be further
    segmented between FTA and Pay AV services, or between basic Pay AV and premium Pay AV services.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_4
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_10
  source_document_id: eu_orange_telekom_romania_communications_2021_decision
  page: '12'
  quote_snippet: With respect to distribution technologies, from a demand-side perspective,
    the results of the market investigation indicated that there is substitutability for end-customers
    between all technical forms of AV distribution. The Commission also notes that this is also
    in line with the precedents of the RCC, which defined a market for retail TV services including
    both cable and satellite services (which are the main distribution technologies in Romania).
    The Commission therefore considers that the retail market for the provision of AV services
    includes all types of distribution technology.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_4
  supports_geographic_markets: []
