- passage_id: sp_12
  source_document_id: eu_orange_telekom_romania_communications_2021_decision
  page: '15'
  quote_snippet: Based on the results of the market investigation, the Commission considers
    that, due to the fact that different combinations of fixed and mobile telecommunications
    services are mainly sold as soft bundles in Romania, allowing customers to choose different
    suppliers for certain parts of the bundle, it appears that suppliers of standalone services
    are still exerting significant competitive pressure on suppliers of bundles. Moreover, given
    that there are no standard offers containing pre-defined fixed and mobile benefits, it is
    difficult to identify which bundles would belong to a separate market or segment.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
