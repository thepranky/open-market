product_markets_considered:
- market_id: pm_1
  name: Retail supply of mobile telecommunications services
  definition_status: defined
  notes: The Commission defined the relevant product market as the retail supply of mobile telecommunication
    services, explicitly excluding M2M services. The question of whether OTT services should
    be included was left open.
- market_id: pm_2
  name: Retail supply of fixed telephony services
  definition_status: defined
  notes: The Commission defined the market as the retail supply of fixed telephony services,
    including VoIP services, and determined that no further segmentation was needed.
- market_id: pm_3
  name: Retail supply of fixed internet access services
  definition_status: defined
  notes: The Commission defined the market for retail supply of fixed internet access services
    for residential and small business customers, including all product types, distribution
    modes, and speeds/bandwidth. It explicitly excluded fixed internet access services provided
    through mobile network infrastructure (fLTE) and concluded that services to large business
    and government customers belong to a separate market (business connectivity services).
- market_id: pm_4
  name: Retail supply of audio-visual services
  definition_status: left_open
  notes: The Commission defined the relevant service market as the retail supply of AV services
    encompassing all distribution technologies. However, the question of whether the market
    should be further segmented between FTA and Pay AV services, basic and premium Pay AV services,
    and linear and non-linear services was left open.
- market_id: pm_5
  name: Retail supply of multiple play services
  definition_status: left_open
  notes: The Commission left open the question of whether a separate product market for the
    retail supply of multiple-play services exists and whether there are separate markets for
    fixed bundles and FMC bundles.
- market_id: pm_6
  name: Retail supply of business connectivity services
  definition_status: defined
  notes: The Commission defined the relevant product market as the retail supply of business
    connectivity services to large businesses and public sector customers, explicitly excluding
    services to residential and small business customers. The question of whether this market
    should be further segmented into broadband access for large business customers, leased lines,
    and VPN services was left open.
- market_id: pm_7
  name: Wholesale supply of leased lines
  definition_status: left_open
  notes: The Commission concluded that the wholesale market for leased lines in Romania does
    not need to be segmented based on transmission means, bandwidth/speed, or between active
    and passive infrastructure. The exact product market definition for the wholesale supply
    of leased lines and the question of whether it includes wholesale fixed backhaul services
    was left open.
- market_id: pm_8
  name: Wholesale supply and acquisition of TV channels
  definition_status: left_open
  notes: The Commission concluded that the relevant product market for the wholesale supply
    and acquisition of TV channels encompasses all infrastructures/distribution technologies.
    However, the question of whether it should be further segmented between FTA TV channels
    and Pay TV channels, basic Pay TV channels and premium Pay TV channels, by genre/thematic
    content, and between linear and non-linear services was left open.
- market_id: pm_9
  name: Wholesale supply of broadband access
  definition_status: left_open
  notes: The Commission identified the relevant product market as the wholesale supply of broadband
    access. The question of whether it should be segmented by type of access or infrastructure
    was left open.
- market_id: pm_10
  name: Wholesale supply of call termination services on fixed networks
  definition_status: defined
  notes: The Commission concluded that the relevant product market is the wholesale supply of
    call termination services on fixed networks, which is distinct from the market for wholesale
    call termination services on mobile networks. Each individual fixed network constitutes
    a separate market for termination.
- market_id: pm_11
  name: Wholesale supply of termination and hosting of calls to non-geographic numbers
  definition_status: defined
  notes: The Commission defined the relevant product market as the wholesale supply of termination
    and hosting of calls to non-geographic numbers, distinct from other wholesale termination
    services, without needing further segmentations.
- market_id: pm_12
  name: Wholesale supply of domestic call transit services on fixed networks
  definition_status: defined
  notes: The Commission defined the relevant product market as the wholesale supply of domestic
    call transit services on fixed networks, noting it is a separate product market distinct
    from global telecommunications services.
- market_id: pm_13
  name: Supply of global telecommunications services
  definition_status: left_open
  notes: The Commission identified the market for the supply of global telecommunications services.
    The question of whether to segment this market between retail and wholesale services, and
    between the lease of transmission capacity and the provision of related services to third
    parties, was left open.
- market_id: pm_14
  name: Wholesale supply of internet connectivity services
  definition_status: left_open
  notes: The Commission identified the market for the wholesale supply of internet connectivity
    services. The question of whether this market includes both transit and peering services,
    whether it should be further segmented between them, and whether it can be further segmented
    between Tier-1 and Tier-2 transit providers, was left open.
- market_id: pm_15
  name: Wholesale supply of access and call termination services on mobile networks
  definition_status: defined
  notes: The Commission concluded that the relevant product market is the wholesale supply of
    access and call termination services on mobile networks, with each individual mobile network
    constituting a separate market.
- market_id: pm_16
  name: Wholesale supply of access and call origination services on mobile networks
  definition_status: defined
  notes: The Commission concluded that the relevant product market is the wholesale supply of
    access and call origination services on mobile networks, considering both services as key
    elements generally supplied together.
- market_id: pm_17
  name: Wholesale supply of international roaming services
  definition_status: defined
  notes: The Commission concluded that the relevant product market is the wholesale supply of
    international roaming services.
