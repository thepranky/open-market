  supports_commitments: []
- passage_id: sp_11
  source_document_id: eu_orange_telekom_romania_communications_2021_decision
  page: '12'
  quote_snippet: In light of the above, the Commission considers that, for the purpose of this
    Decision, the relevant service market is the market for the retail supply of AV services
    encompassing all distribution technologies. The question whether the market should be segmented
    (i) between FTA and Pay AV services; (ii) basic and premium Pay AV services; and (iii) linear
    and non-linear services can be left open as the Transaction does not raise serious doubts
    as to its compatibility with the internal market under any plausible product market definition.
  extraction_method: pdf_extracted
  review_status: unreviewed
