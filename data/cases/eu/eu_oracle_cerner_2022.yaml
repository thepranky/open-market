- passage_id: sp_2
  source_document_id: eu_oracle_cerner_2022_decision
  page: '6'
  quote_snippet: In light of the above, the Commission considers that the relevant product market
    in this case is that comprising all RDBMS. For the purpose of this Decision, the question
    of whether the market for RDBMS is part of a broader market (i.e. an overall market for
    DBMS including RDBMS) can be left open, since the Transaction does not raise serious doubts
    as to its compatibility with the internal market under any plausible market definition.
