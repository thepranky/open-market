  source_document_id: eu_oracle_cerner_2022_decision
  page: '9'
  quote_snippet: In light of the above, the Commission considers that the relevant product market
    in this case is the market for healthcare software and that health insurance software is
    not part of that market. For the purposes of this Decision, the exact product market definition
    of the healthcare software market can be left open because the Transaction does not raise
    serious doubts as to its compatibility with the internal market under any plausible market
    definition (including a possible segmentation of the healthcare software market by both
    the modules considered in CSC/iSoft and the modules proposed by the Notifying Party).
