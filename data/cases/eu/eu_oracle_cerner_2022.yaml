  source_document_id: eu_oracle_cerner_2022_decision
  page: '2'
  quote_snippet: 'For the assessment of the Transaction in this decision, the following business
    activities of the Parties are relevant: (i) Oracle is active in relational database management
    systems (“RDBMS”) software5 and (ii) Cerner is active in healthcare software, i.e. software
    adapted to the needs of healthcare providers.'
