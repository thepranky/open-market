- passage_id: sp_3
  source_document_id: eu_oracle_cerner_2022_decision
  page: '4'
  quote_snippet: 'In Oracle/Sun Microsystems, the Commission considered a segmentation of the
    RDBMS market based on several criteria but ultimately concluded that the market was “one
    comprising all RDBMS”, among other reasons because of supply-side substitutability. Those
    segmentation criteria included: − embedded vs. non-embedded RDBMS; − databases for online
    analytical processing (OLAP) and databases for online transaction processing (OLTP); − general
    purpose databases vs. specialised databases (for example related to data warehousing); −
    compatibility with customers’ existing IT infrastructure (operating systems); − RDBMS for
    mission critical vs. non-mission critical applications.'
  extraction_method: pdf_extracted
  review_status: unreviewed
