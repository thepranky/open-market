product_markets_considered:
- market_id: pm_1
  name: RDBMS software
  definition_status: considered
  notes: The Commission considered the relevant product market to be that comprising all RDBMS
    (Relational Database Management Systems) for the purpose of the decision, but left open
    the question of whether it is part of a broader market for DBMS (Database Management Systems)
    including non-relational DBMS. Segmentation of the RDBMS market itself (e.g. by embedded
    vs non-embedded, OLAP vs OLTP, general purpose vs specialised, compatibility, or mission
    critical vs non-mission critical) was not considered necessary.
- market_id: pm_2
  name: Healthcare software
  definition_status: left_open
  notes: The Commission considered the market for healthcare software to be the relevant product
    market, but explicitly left open its exact product market definition, including a possible
    segmentation by modules (e.g., EHR and other clinical software, RCM solutions, healthcare
    provider analytics, patient engagement, and telehealth).
- market_id: pm_3
  name: Health insurance software
  definition_status: defined
  notes: The Commission confirmed that the market for health insurance software is separate
    from the market for healthcare software, based on different customer needs, sales channels,
    regulatory requirements, and supply-side considerations.
geographic_markets_considered:
- market_id: gm_1
  name: RDBMS software — worldwide
  definition_status: defined
  notes: The geographic market for RDBMS software was defined as worldwide, consistent with
    previous Commission decisions and market investigation findings that the IT industry is
    global and software can be licensed and installed anywhere.
- market_id: gm_2
  name: Healthcare software — EEA-wide or national
  definition_status: left_open
  notes: The geographic market definition for healthcare software (and its possible segmentations)
    was left open, as market investigation results were mixed (some respondents indicated a
    national market, others an EEA-wide market), and the transaction did not raise serious doubts
    under any plausible definition.
