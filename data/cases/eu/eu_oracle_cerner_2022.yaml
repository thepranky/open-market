- passage_id: sp_10
  source_document_id: eu_oracle_cerner_2022_decision
  page: '10'
  quote_snippet: The market investigation delivered mixed results. While some respondents pointed
    to a national market, others supported an EEA-wide market.59 In particular, from a demand-side
    perspective, healthcare providers are usually located in one country and there are national
    limitations resulting from IP-rights and other regulatory or language requirements. On the
    other hand, from a supply-side perspective, most providers of healthcare software are active
    in more than one country.
