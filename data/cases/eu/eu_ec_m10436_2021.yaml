- passage_id: sp_7
  source_document_id: eu_ec_m10436_2021_decision
  page: '4'
  quote_snippet: '(17) In a previous case, the Commission also considered the possible existence
    of separate markets for the supply of spirits depending on whether they are on-trade (i.e:
    sales to hotels, bars, cafés, etc) or off-trade (i.e: sales to the retail sector).13 However,
    the Commission ultimately concluded that this delineation would not change the competitive
    assessment as the transaction in question in that case would primarily concern off-trade,
    i.e. sales to wholesalers and large retailers. In the present case the delineation would
    not change the competitive assessment since Tannico is present essentially in the direct
    sales to final customers ([…]% of Tannico turnover is represented by sales to final consumers).'
  extraction_method: pdf_extracted
