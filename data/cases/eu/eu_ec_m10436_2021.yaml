  source_document_id: eu_ec_m10436_2021_decision
  page: '6'
  quote_snippet: (27) In addition, for the purposes of this Decision, it can be left open whether
    the retail market for wines and spirits can be segmented by sales channel as the as the
    assessment of the Transaction’s compatibility with the internal market or the functioning
    of the EEA Agreement would not change under any plausible product market definition. Since
    Tannico is active only in the online sales channel, taking a conservative approach, the
    Commission will assess the Proposed Transaction only for the online segment.
