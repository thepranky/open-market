product_markets_considered:
- market_id: pm_1
  name: Production and wholesale distribution of Still Wines
  definition_status: left_open
  notes: The Commission considered segmenting wines by type (still vs. sparkling) and spirits
    by category/origin, but ultimately left the definitive segmentation open as it would not
    change the competitive assessment.
- market_id: pm_2
  name: Production and wholesale distribution of Sparkling Wines
  definition_status: left_open
  notes: The Commission considered segmenting wines by type (still vs. sparkling) and spirits
    by category/origin, but ultimately left the definitive segmentation open as it would not
    change the competitive assessment.
- market_id: pm_3
  name: Production and wholesale distribution of Spirits (general category)
  definition_status: left_open
  notes: The Commission considered segmenting spirits by main categories (whisky, brandy, rum,
    etc.) and by origin for some categories (e.g., Scotch whisky, Cognac), and by sales channel
    (on-trade/off-trade), but ultimately left the definitive segmentation open as it would not
    change the competitive assessment.
- market_id: pm_4
  name: Retail of wines and spirits
  definition_status: left_open
  notes: The Commission considered whether to segment by sales channel (online vs. brick-and-mortar)
    but left it open, adopting a conservative approach to assess the online segment only. It
    concluded that the market for retail encompasses all wines and spirits, not segmented by
    type of beverage.
- market_id: pm_5
  name: Retail of wines and spirits — online segment
  definition_status: considered
  notes: The Commission considered segmenting the retail market by sales channel and, taking
    a conservative approach due to Tannico's online-only activity, assessed the transaction
    specifically for the online segment, while leaving the overall segmentation open.
geographic_markets_considered:
- market_id: gm_1
  name: Production and wholesale distribution of wines and spirits — national
  definition_status: considered
  notes: The Commission noted past decisions found national scope due to strong national preferences,
    and while leaving the exact scope open, adopted a conservative approach by assessing the
    transaction at a national level.
- market_id: gm_2
  name: Retail of wines and spirits — national (Italy affected)
  definition_status: considered
  notes: While Notifying Parties considered online retail to be EEA-wide, the market investigation
    suggested national purchasing patterns. The Commission did not conclusively define the geographic
    market but focused its analysis on Italy for input foreclosure.
theories_of_harm: []
commitments: []
