- passage_id: sp_9
  source_document_id: eu_ec_m10436_2021_decision
  page: '6'
  quote_snippet: (26) The results of the market investigation support the fact that retailers
    purchase the whole range of wines and spirits as all retailers that expressed a view explained
    that they purchase the whole range of wines and spirits.21 Indeed, the retailers aim to
    offer a broad selection of wines and spirits to the final consumer to maximise their revenues.
    For example, one retailer pointed out in the market investigation that ‘Our product portfolio
    has 3000 wine references and 3000 spirits references’22. The Commission therefore considers
    that, for the purposes of this Decision, the market for retail encompasses all wines and
    spirits.
  extraction_method: pdf_extracted
  review_status: unreviewed
