- passage_id: sp_5
  source_document_id: eu_ec_m10353_2021_decision
  page: '3'
  quote_snippet: In its previous decisions, the Commission has considered the possibility of
    sub-segmenting the folding cartonboard packaging market by end-use application. For instance,
    it has considered that folding cartonboard for tobacco, for pharmaceutical/medical products
    or for beverages might constitute distinct markets. However, the market definition has ultimately
    been left open.
  extraction_method: pdf_extracted
