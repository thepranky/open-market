product_markets_considered:
- market_id: pm_1
  name: supply of folding cartonboard packaging
  definition_status: left_open
  notes: The Commission considered the supply of folding cartonboard packaging as the general
    market scope, but ultimately left open further sub-segmentation for the purpose of the decision.
- market_id: pm_2
  name: folding cartonboard packaging by end-use application
  definition_status: left_open
  notes: The Commission considered the possibility of sub-segmenting the folding cartonboard
    packaging market by end-use application (e.g., beverages, food, healthcare, personal care,
    other non-food) based on previous decisions and market investigation, but ultimately left
    the market definition open.
- market_id: pm_3
  name: folding cartonboard packaging with and without microflutes
  definition_status: left_open
  notes: The Commission investigated the relevance of distinguishing between folding cartonboard
    with and without microflutes for product market definition purposes but found the market
    investigation inconclusive and left the definition open.
- market_id: pm_4
  name: folding cartonboard packaging for beverages (rigid boxes vs. multipack cartons)
  definition_status: left_open
  notes: Within beverages, the Commission considered in its previous decisions and in the market
    investigation the possibility of distinguishing between rigid boxes for premium beverages
    and multipack cartons for beer/soft drinks, but ultimately left the market definition open.
- market_id: pm_5
  name: supply of folding cartonboard for soft drinks (excluding microflutes)
  definition_status: considered
  notes: For its competitive assessment, the Commission specified it would analyse the impact
    of the Transaction on this narrower segment within beverages, excluding microflutes.
- market_id: pm_6
  name: supply of overall folding cartonboard packaging (excluding microflutes)
  definition_status: considered
  notes: For its competitive assessment, the Commission specifically considered this segment
    of overall folding cartonboard packaging in particular national markets, excluding microflutes.
- market_id: pm_7
  name: supply of folding cartonboard for personal care products (excluding microflutes)
  definition_status: considered
  notes: For its competitive assessment, the Commission specifically considered this segment
    of folding cartonboard for personal care products in particular national markets, excluding
    microflutes.
- market_id: pm_8
  name: supply of folding cartonboard packaging for food products (excluding microflutes)
  definition_status: considered
  notes: For its competitive assessment, the Commission specifically considered this segment
    of folding cartonboard packaging for food products in a particular national market, excluding
    microflutes.
geographic_markets_considered:
- market_id: gm_1
  name: folding cartonboard packaging — national or EEA-wide
  definition_status: left_open
  notes: The Commission's decisional practice has been to leave open whether the geographic
    market for folding cartonboard packaging is national or EEA-wide. The market investigation
    results were inconclusive, with competitors suggesting a wider than EEA scope and customers
    suggesting a regional basis.
- market_id: gm_2
  name: supply of folding cartonboard for soft drinks — EEA-wide
  definition_status: considered
  notes: This geographic scope was specifically considered for the assessment of the supply
    of folding cartonboard for soft drinks.
- market_id: gm_3
  name: supply of folding cartonboard for soft drinks — Western Europe
  definition_status: considered
  notes: This geographic scope was specifically considered for the assessment of the supply
    of folding cartonboard for soft drinks.
- market_id: gm_4
  name: supply of overall folding cartonboard packaging — national (Croatia affected)
  definition_status: considered
  notes: This national geographic scope was specifically considered for the assessment of the
    supply of overall folding cartonboard packaging.
- market_id: gm_5
  name: supply of overall folding cartonboard packaging — national (Spain affected)
  definition_status: considered
  notes: This national geographic scope was specifically considered for the assessment of the
    supply of overall folding cartonboard packaging.
- market_id: gm_6
  name: supply of folding cartonboard for personal care products — national (Germany affected)
  definition_status: considered
  notes: This national geographic scope was specifically considered for the assessment of the
    supply of folding cartonboard for personal care products.
- market_id: gm_7
  name: supply of folding cartonboard for personal care products — national (Poland affected)
  definition_status: considered
  notes: This national geographic scope was specifically considered for the assessment of the
    supply of folding cartonboard for personal care products.
- market_id: gm_8
  name: supply of folding cartonboard packaging for food products — national (Spain affected)
  definition_status: considered
  notes: This national geographic scope was specifically considered for the assessment of the
    supply of folding cartonboard packaging for food products.
