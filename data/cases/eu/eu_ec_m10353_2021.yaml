- passage_id: sp_3
  source_document_id: eu_ec_m10353_2021_decision
  page: '4'
  quote_snippet: In any event, for the purposes of this Decision, it can be left open whether
    the folding cartonboard market should be sub-segmented according to end-use applications
    or whether a distinction would be appropriate between packaging with or without microflutes,
    as the Transaction does not raise serious doubts as to its compatibility with the internal
    market even under the narrowest market definition. Therefore, the Commission will analyse
    the impact of the Transaction on the folding cartonboard market, distinguishing by end-application
    (and in beverages, considering narrower segments including only soft drinks) and in all
    cases presenting the narrowest segment excluding microflutes.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
