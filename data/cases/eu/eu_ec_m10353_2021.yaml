- passage_id: sp_8
  source_document_id: eu_ec_m10353_2021_decision
  page: '4'
  quote_snippet: 'As regards microflutes, the market investigation was inconclusive: the majority
    of customers who responded to the market investigation replied that they do not use microflutes
    for the packaging they purchase for their products but that microflutes can be replaced
    with folding cartonboard without microflute (and vice versa) in certain situations. The
    majority of competitors who responded to the market investigation indicated that they manufacture
    both microflutes and cartonboard without microflutes, though the responses were inconclusive
    regarding the degree to which there is supply-side substitutability.'
  extraction_method: pdf_extracted
  review_status: unreviewed
