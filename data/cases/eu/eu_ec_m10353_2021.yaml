  source_document_id: eu_ec_m10353_2021_decision
  page: '4'
  quote_snippet: The market investigation supports the Commission’s previous practice of considering
    the possibility of sub-segmenting the folding cartonboard packaging market by end-use application.
    The majority of respondents to the market investigation agreed with this segmentation.
  extraction_method: pdf_extracted
