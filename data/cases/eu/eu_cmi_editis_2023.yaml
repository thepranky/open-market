- passage_id: sp_3
  source_document_id: eu_cmi_editis_2023_decision
  page: '4'
  quote_snippet: 'As regards the product market, in a previous decision, the Commission considered
    distinct markets for the sale of books to consumers: (i) sale of books by retailers to end
    consumers (in brick-and-mortar shops), (ii) distance selling (including internet sales,
    mail orders and book clubs), (iii) second-hand book dealers, and (iv) sale of large reference
    works by sales agents.18 In a previous case, the Commission concluded on the existence of
    an overall market for the sale of books to end consumers including sales in brick-and-mortar
    shops as well as distance selling,19 whilst in another case, the question was left open.20'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
