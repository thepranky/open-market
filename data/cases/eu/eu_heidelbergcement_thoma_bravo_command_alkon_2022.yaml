  pdf_url: http://publications.europa.eu/resource/cellar/a0ff3567-fd0b-11ec-b94a-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Automation software solutions used for the production of heavy building materials (HBM)
  definition_status: considered
  notes: The Commission left open further segmentations by industry, end-use application, and
    functionality. However, for the purpose of the case, it carried out its analysis under the
    segment for HBM automation software solutions, with distinctions by end-use application
    (aggregates, asphalt, cement, ready-mix concrete, pre-cast concrete, and contractors) and
    by individual functionalities (ticketing, order taking, scheduling, recipe, truck tracking,
    pricing and quoting, business intelligence).
- market_id: pm_2
  name: Aggregates
  definition_status: considered
  notes: The Commission confirmed the relevance of its decisional practice and, while leaving
    plausible segmentations between primary and secondary aggregates, and within primary aggregates
    (sand and gravel vs. crushed rock) open, conducted its analysis on the narrowest plausible
    product segments.
- market_id: pm_3
  name: Cement
  definition_status: considered
  notes: The Commission confirmed the relevance of its decisional practice and carried out its
    analysis on the distinct segments for white cement and grey cement.
- market_id: pm_4
  name: Ready-mix concrete
  definition_status: considered
  notes: The Commission confirmed its previous decisional practice, conducting the analysis
    on a single market for ready-mixed concrete.
- market_id: pm_5
  name: Pre-cast concrete products
  definition_status: considered
  notes: The Commission confirmed the relevance of its decisional practice. While leaving plausible
    segmentations open, the analysis was conducted on the narrowest plausible product segments,
    including concrete building blocks, paving materials made of concrete, pre-cast floors,
    and building materials for load-bearing walls.
geographic_markets_considered:
- market_id: gm_1
  name: Automation software solutions used for the production of heavy building materials —
    national (EEA affected)
  definition_status: considered
  notes: While the exact geographic market definition was left open, the Commission conducted
    its analysis under national markets, where Command Alkon's market shares and market power
    were highest, based on market investigation results indicating national/regional scope and
    barriers.
- market_id: gm_2
  name: Aggregates — national (EEA affected)
  definition_status: considered
  notes: The Commission confirmed its decisional practice, leaving open whether the market is
    local or national, but conducted its analysis on national markets due to no competition
    concerns under any definition.
- market_id: gm_3
  name: Cement — national (EEA affected)
  definition_status: considered
  notes: The Commission confirmed its decisional practice, leaving the exact market definition
    open but conducting its analysis on national markets for the purpose of the decision, as
    no competition concerns arose irrespective of the scope.
- market_id: gm_4
  name: Ready-mix concrete — national (EEA affected)
  definition_status: considered
  notes: The Commission confirmed its decisional practice, leaving the market definition open
    but conducting its analysis on national markets for the purpose of the decision, as no competition
    concerns arose irrespective of the scope.
- market_id: gm_5
  name: Pre-cast concrete products — national (EEA affected)
  definition_status: considered
  notes: The Commission confirmed its decisional practice, leaving the market definition (national
    or local for sub-markets) open but conducting its analysis on national markets for the purpose
    of the decision, as no competition concerns arose irrespective of the scope.
theories_of_harm: []
commitments: []
source_passages:
- passage_id: sp_1
  source_document_id: eu_heidelbergcement_thoma_bravo_command_alkon_2022_decision
  page: '5'
  quote_snippet: However, the question whether the market for automation software solutions
    should be further segmented by type of industry can be left open as the Transaction does
    not give rise to competition concerns on the HBM industry segment, which is the only segment
    on which Command Alkon is active. For the purpose of this case, the Commission will adopt
    a conservative approach and carry out its analysis under the segment for HBM automation
    software solutions.
  extraction_method: pdf_extracted
  review_status: unreviewed
