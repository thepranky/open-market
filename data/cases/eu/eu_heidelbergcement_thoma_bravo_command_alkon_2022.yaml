  quote_snippet: However, the question whether the market for HBM automation software solutions
    should be further segmented by end-use application can be left open, as the Transaction
    does not give rise to competition concerns, even when such a distinction is made, which
    results in higher market shares for Command Alkon. For the purpose of this case, the Commission
    will carry out its analysis with a distinction between aggregates, asphalt, cement, ready-mix
    concrete, pre-cast concrete and contractors.
