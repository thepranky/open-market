- passage_id: sp_8
  source_document_id: eu_ec_m10102_2021_decision
  page: '8'
  quote_snippet: The Commission held in previous decisions that reinsurance consists in providing
    insurance cover to another insurer for some or all of the liabilities assumed under its
    insurance policies, in order to transfer risk from the insurer to the reinsurer. The Commission
    has considered a separate market for reinsurance (distinguished from the markets for the
    provision of life and non-life insurance) but has left open the question of whether the
    reinsurance market should be further segmented between life and non-life reinsurance.
  extraction_method: pdf_extracted
