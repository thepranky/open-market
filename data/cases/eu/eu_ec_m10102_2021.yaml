product_markets_considered:
- market_id: pm_1
  name: Life insurance
  definition_status: left_open
  notes: The Commission considered segmentations for pure risk protection products, pension
    products, savings/investment products, life insurance for individuals and group customers,
    and unit-linked (and index-linked) versus non-unit-linked (and non-index-linked) products.
    However, the exact product market definition was left open.
- market_id: pm_2
  name: Non-life insurance
  definition_status: left_open
  notes: The Commission considered segmentations for accident and sickness, motor vehicle, property,
    liability, marine, aviation and transport (MAT), credit and suretyship, and travel insurance.
    Additional segmentations based on national insurance classifications or between individual
    and group customers were also considered. However, the exact product market definition was
    left open.
- market_id: pm_3
  name: Reinsurance
  definition_status: left_open
  notes: The Commission has considered a separate market for reinsurance (distinguished from
    the markets for the provision of life and non-life insurance) but left open whether it should
    be further segmented between life and non-life reinsurance.
- market_id: pm_4
  name: Insurance distribution
  definition_status: left_open
  notes: The Commission analysed whether the market for insurance distribution comprises only
    outward distribution channels or also includes direct sales. It also considered a distinction
    between distribution of life and non-life insurance products, and a potential separate market
    for insurance broking. These questions were ultimately left open.
- market_id: pm_5
  name: Asset management
  definition_status: left_open
  notes: The Commission considered the possibility of a relevant product market for asset management,
    including creation/management of mutual funds for retail, tailor-made funds for corporate/institutional
    customers, and portfolio management for private investors/pension funds/institutions. It
    also considered separate markets for each of these product types and judged asset management
    services for private individuals to be distinct from other asset management services. The
    definition was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Life insurance — national (Hungary/Romania affected)
  definition_status: considered
  notes: null
- market_id: gm_2
  name: Non-life insurance — national (Hungary affected)
  definition_status: considered
  notes: For certain non-life insurance products, including MAT insurance and generally large
    risk insurance, the Commission considered the market is likely to be wider than national
    in scope.
- market_id: gm_3
  name: Reinsurance — worldwide
  definition_status: considered
  notes: null
- market_id: gm_4
  name: Insurance distribution — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission previously considered insurance distribution to be national in scope
    but ultimately left it open. For brokerage services in relation to large commercial or specialty
    risks, the Commission considered such segments to be EEA-wide or worldwide.
- market_id: gm_5
  name: Asset management — national or EEA-wide
  definition_status: left_open
  notes: null
