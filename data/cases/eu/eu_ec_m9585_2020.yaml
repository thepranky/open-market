  quote_snippet: (41) In the Metso/Svedala decision, the Commission also distinguished minerals
    processing equipment by type and found that grinding mills constituted a separate relevant
    product market.22 The Commission considered a possible distinction between horizontal tumbling
    mills on the one hand, which could be further subdivided into autogenous mills, semi-autogenous
    mills, rod mills and ball mills, other horizontal mills, and vertical mills on the other
    hand, but ultimately left the question open whether these mill types constituted separate
    product markets.23
