product_markets_considered:
- market_id: pm_1
  name: Grinding capital equipment
  definition_status: left_open
  notes: 'The Commission considered segmentations by tumbling (horizontal) mills vs. stirred
    (vertical) mills, by size and/or power categories (small: 0-3,000 kw/up to 15 ft; medium:
    3,000-20,000 kw/15-30 ft; large: >20,000 kw/30 ft), and by different types of tumbling mills
    (rod, ball, pebble mills forming distinct markets; AG and SAG mills belonging to the same
    market). Despite these considerations, the exact product market definition was left open.'
- market_id: pm_2
  name: Grinding aftermarkets
  definition_status: left_open
  notes: The Commission confirmed that aftermarkets are distinct from capital equipment markets
    and that aftermarkets for each type of capital equipment (grinding, flotation, filtration,
    iron ore pelletizing) constitute separate markets. However, the market investigation was
    inconclusive on further segmenting grinding aftermarkets into services, spare parts, and
    wear parts, and thus the exact definition was left open.
- market_id: pm_3
  name: Flotation capital equipment for the mining and minerals industry
  definition_status: left_open
  notes: The Commission found that different types of flotation equipment (e.g., mechanical
    cells, column cells, flash flotation) and mechanical cells of different sizes are generally
    not substitutable. It considered that the market could be segmented by type and mechanical
    cell size, but ultimately left the exact market definition open.
- market_id: pm_4
  name: Flotation aftermarkets
  definition_status: left_open
  notes: The Commission confirmed that aftermarkets for flotation equipment are distinct from
    the capital equipment market and from aftermarkets for other capital equipment types. However,
    the market investigation was inconclusive regarding further segmentation into services,
    spare parts, and wear parts, leaving the exact market definition open.
- market_id: pm_5
  name: Filtration capital equipment
  definition_status: left_open
  notes: The Commission's market investigation on segmentation by mining vs. non-mining applications
    was inconclusive, but the competitive assessment would be carried out in the narrowest plausible
    market (filtration equipment for the mining industry). Views were mixed on segmentation
    by pressure/filter type, with a majority indicating pressure filters are not substitutable
    with other filtration technologies, but mixed results on substitutability among pressure
    filter types. The exact definition was left open.
- market_id: pm_6
  name: Filtration aftermarkets
  definition_status: left_open
  notes: The Commission concluded that the aftermarket for filtration is distinct from the capital
    equipment market and from aftermarkets for other capital equipment. However, mixed views
    were received regarding further segmentation into services, spare parts, and wear parts,
    leading to the exact definition being left open.
- market_id: pm_7
  name: Iron ore pelletizing capital equipment
  definition_status: left_open
  notes: The Commission determined that iron ore pelletizing equipment is not substitutable
    with sintering equipment. However, the market investigation was inconclusive on whether
    different types of iron ore pelletizing equipment (straight grate systems, grate kiln systems,
    circular pelletizing) should be distinguished, hence the exact market definition was left
    open.
- market_id: pm_8
  name: Iron ore pelletizing aftermarkets
  definition_status: left_open
  notes: The Commission concluded that the aftermarket for iron ore pelletizing is distinct
    from the capital equipment market and from aftermarkets for other capital equipment types.
    However, a definitive conclusion on further segmentation into services, spare parts, and
    wear parts could not be reached, leaving the exact market definition open.
- market_id: pm_9
  name: Crushing capital equipment for mining applications
  definition_status: left_open
  notes: The Commission referenced previous precedent suggesting segmentation by crusher type
    (jaw, gyratory, cone, etc.) for mining applications. The Notifying Party argued against
    such segmentation. The Commission ultimately left the market definition open due to Outotec's
    limited activities.
- market_id: pm_10
  name: Size control equipment for mining applications
  definition_status: left_open
  notes: The Commission referenced previous precedent for screens and segmentation by size/application
    (A&C vs. mining). The Notifying Party suggested a similar approach for classification equipment.
    The Commission left the exact market definition open due to the Parties' limited activities.
- market_id: pm_11
  name: Washing equipment
  definition_status: left_open
  notes: The relevant product market for washing equipment had not been previously defined by
    the Commission. The Commission left the exact market definition open, noting that the Parties'
    activities overlap only in tumbling scrubbers and the transaction would not raise concerns.
- market_id: pm_12
  name: Magnetic separation equipment
  definition_status: left_open
  notes: The relevant product market for magnetic separation had not been previously defined
    by the Commission. The Notifying Party proposed defining it as magnetic separation, not
    further sub-segmented by type or size. The Commission left the exact market definition open.
- market_id: pm_13
  name: Sedimentation equipment
  definition_status: left_open
  notes: The relevant product market for sedimentation had not been previously defined by the
    Commission. The Notifying Party proposed defining it as the overall market for sedimentation,
    not further sub-segmented by type or size. The Commission left the exact market definition
    open.
- market_id: pm_14
  name: Calcining and Roasting equipment
  definition_status: left_open
  notes: The relevant product market for calcining and roasting had not been previously defined
    by the Commission. The Notifying Party submitted that the market for calcining might need
    to be distinguished by technology. The Commission left the exact market definition open.
- market_id: pm_15
  name: Materials Handling equipment
  definition_status: left_open
  notes: The Commission referenced previous precedent for screens, feeders, and conveyors, and
    their segmentation. The Notifying Party argued against distinction by type. Given the Parties'
    limited activities, the Commission left the exact market definition open.
- market_id: pm_16
  name: Slurry Handling equipment
  definition_status: left_open
  notes: The relevant product market for slurry handling had not been previously defined by
    the Commission. The Notifying Party suggested defining it as overall slurry handling, not
    segmented by type or size. Due to Outotec's de minimis activities, the Commission left the
    exact market definition open.
- market_id: pm_17
  name: Engineering services in the mining industry
  definition_status: left_open
  notes: The Commission concluded that there is a separate market for EPC services in the mining
    industry. However, the market investigation provided mixed results on whether this market
    should be further segmented by type of engineering services (EPC, EPCM, or other), thus
    leaving the question of further segmentation open.
- market_id: pm_18
  name: Manufacturing of mining equipment (upstream)
  definition_status: left_open
  notes: The Commission identified a possible upstream market for the manufacturing of mining
    equipment, noting that the Notifying Party outsources most manufacturing. The market investigation
    confirmed it's a separate market from capital equipment supply to mining companies but provided
    inconclusive views on sub-segmentations. The exact market definition was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Mining capital equipment (grinding, flotation, filtration, iron ore pelletizing) — global
    in scope
  definition_status: considered
  notes: The Commission's market investigation largely confirmed the Notifying Party's position
    that the relevant geographic market for mining capital equipment (including grinding, flotation,
    filtration, iron ore pelletizing, and their plausible sub-segmentations) is global in scope,
    given global procurement, absence of local preferences, and global supplier networks.
- market_id: gm_2
  name: Aftermarkets (services, spare and wear parts for grinding, flotation, filtration, iron
    ore pelletizing) — global in scope
  definition_status: considered
  notes: The Commission's market investigation largely confirmed the Notifying Party's position
    that the relevant geographic market for aftermarkets (services and spare/wear parts relating
    to grinding, flotation, filtration, and iron ore pelletizing equipment) is global in scope,
    due to global procurement, no local preferences, and global supplier networks.
- market_id: gm_3
  name: Other capital equipment (crushing, size control, washing, magnetic separation, sedimentation,
    calcining and roasting, material handling, slurry handling) — global in scope
  definition_status: considered
  notes: Building on the Notifying Party's submissions and the market conditions established
    for grinding, flotation, filtration, and iron ore pelletizing equipment, the Commission
    considered that the geographic markets for crushing, size control, washing, magnetic separation,
    sedimentation, calcining and roasting, material handling, and slurry handling are also global
    in scope.
- market_id: gm_4
  name: Engineering services in the mining industry — global level
  definition_status: considered
  notes: The Commission's market investigation confirmed that EPC services in the mining industry
    are provided and procured at a global level.
