- passage_id: sp_27
  source_document_id: eu_ec_m9585_2020_decision
  page: '42'
  quote_snippet: (245) The Notifying Party submits that, considering that the Parties outsource
    the manufacture of parts to suppliers, there may be upstream markets for the manufacture
    and supplier of individual components. Although the Parties are not active on any potential
    market for the supply of components for minerals processing equipment, the Commission considers
    that, for the purpose of this decision, the possible upstream market for the manufacturing
    of mining equipment needs to be addressed, considering potential concerns raised by the
    Transaction on the supply of components for minerals processing equipment.
