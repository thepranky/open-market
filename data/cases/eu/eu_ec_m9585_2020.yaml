- passage_id: sp_28
  source_document_id: eu_ec_m9585_2020_decision
  page: '44'
  quote_snippet: (258) Taking into account the Notifying Party’s submissions, the Commission
    has carried out a market investigation with the aim to determine the scope of the relevant
    geographic market for the types of mining capital equipment assessed in this decision, namely
    grinding equipment, flotation equipment, filtration equipment and iron ore pelletizing equipment
    (including all plausible sub-segmentations). The Commission’s market investigation has largely
    confirmed the Notifying Party’s position that the relevant geographic market for both (i)
    capital equipment and (ii) aftermarkets is global in scope.
  extraction_method: pdf_extracted
