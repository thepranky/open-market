  source_document_id: eu_celanese_dupont_mobility_amp_materials__2022_decision
  page: '11'
  quote_snippet: Based on the above, and in particular in light of (i) the moderate combined
    market shares of the Parties and a moderate concentration level of the market, (ii) the
    lack of closeness of competition between the Parties pre-Transaction, and (iii) the fact
    that a number of credible competitors will remain present in the market, the Commission
    concludes that the Transaction does not raise serious doubts as to its compatibility with
    the internal market in relation to an EEA-wide market for PA6.6 EP.
