product_markets_considered:
- market_id: pm_1
  name: PA6.6 EP
  definition_status: considered
  notes: The Commission considered PA6.6 EP as a single product market distinct from PA6.6 BP,
    PA6 EP, and not further sub-segmented by types or applications, for the purpose of assessing
    the Transaction. This was based on previous decisional practice and market investigation
    findings regarding limited substitutability.
- market_id: pm_2
  name: PA6.6 BP
  definition_status: considered
  notes: The Commission considered PA6.6 BP as a distinct product market from PA6.6 EP, based
    on limited demand and supply-side substitutability and different production processes. PA6.6
    BP serves as an input for PA6.6 EP.
- market_id: pm_3
  name: PA6 EP
  definition_status: considered
  notes: The Commission considered PA6 EP as a distinct product market from PA6.6 EP, based
    on previous decisional practice and market investigation findings regarding different properties,
    need for tooling changes, and limited price substitutability.
- market_id: pm_4
  name: TPC
  definition_status: considered
  notes: The Commission considered TPC as a separate product market from other thermoplastic
    elastomers (like POE, TPS, TPU) due to limited demand-side substitutability and unique mechanical
    and chemical properties, for the purpose of its assessment.
- market_id: pm_5
  name: TPC BP / TPC EP
  definition_status: left_open
  notes: The Commission investigated whether TPC should be further segmented into TPC BP and
    TPC EP, noting potential for separate markets based on demand-side substitutability and
    production process differences. However, the question was left open due to concerns for
    TPC overall and Celanese's commitment to divest its global TPC business.
- market_id: pm_6
  name: Types of TPC
  definition_status: left_open
  notes: The Commission investigated whether TPC should be further sub-segmented by types (e.g.,
    flame retardant, heat stabilised), noting differences between types but also that most producers
    can readily produce most types. The question was left open due to concerns for TPC overall
    and the divestment commitment.
geographic_markets_considered:
- market_id: gm_1
  name: PA6.6 EP — EEA-wide
  definition_status: considered
  notes: The Commission considered the geographic market for PA6.6 EP to be EEA-wide, in line
    with previous decisional practice and market investigation findings regarding sales output,
    price differences between regions, and customer sourcing patterns.
- market_id: gm_2
  name: TPC — EEA-wide
  definition_status: left_open
  notes: The Commission considered that the exact geographic scope of the market for TPC could
    be left open, given that the Transaction would raise concerns under both EEA-wide and global
    market definitions. Market investigation indicated an EEA-wide scope based on differing
    market conditions and customer sourcing within the EEA.
- market_id: gm_3
  name: TPC — Global
  definition_status: left_open
  notes: The Commission considered that the exact geographic scope of the market for TPC could
    be left open, given that the Transaction would raise concerns under both EEA-wide and global
    market definitions. The Notifying Party had submitted that the market was EEA-wide or global
    in scope.
