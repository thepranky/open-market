product_markets_considered:
- market_id: pm_1
  name: Cartonboard
  definition_status: left_open
  notes: The Commission considered an overall market for cartonboard but ultimately left the
    definition open, as no affected markets arose under this broader definition and thus it
    was not analysed further.
- market_id: pm_2
  name: Folding Box Board (FBB)
  definition_status: segmented
  notes: The Commission examined an overall FBB market but ultimately left the definition open,
    assessing the transaction based on segmented FBB markets by end-application or sub-grade,
    as no affected markets arose under a broader FBB definition.
- market_id: pm_3
  name: FBB for food applications
  definition_status: considered
  notes: The Commission analysed the effects of the transaction on the basis of a market for
    FBB segmented by end-application, specifically including food applications, due to affected
    markets arising in this segment.
- market_id: pm_4
  name: FBB sub-grade GC1
  definition_status: considered
  notes: The Commission analysed the effects of the transaction on the basis of a market for
    FBB segmented by sub-grade, specifically including GC1, noting its distinct characteristics
    and end-uses.
- market_id: pm_5
  name: FBB sub-grade GC2
  definition_status: considered
  notes: The Commission analysed the effects of the transaction on the basis of a market for
    FBB segmented by sub-grade, specifically including GC2, due to affected markets arising
    in this segment.
- market_id: pm_6
  name: Folding boxes
  definition_status: segmented
  notes: The Commission considered an overall market for folding boxes but ultimately left the
    definition open, assessing the transaction based on segmented folding box markets by end-application,
    as no affected markets arose under a broader folding boxes definition.
- market_id: pm_7
  name: Folding boxes for the pharma industry
  definition_status: considered
  notes: The Commission analysed the effects of the transaction on the basis of a market for
    folding boxes segmented by end-application, specifically including the pharma industry,
    due to affected markets arising in this segment in France.
- market_id: pm_8
  name: Folding boxes for the tobacco industry
  definition_status: considered
  notes: The Commission noted that MM's market shares in this segment exceeded 30%, giving rise
    to a vertically affected market. However, as Kotkamills does not produce FBB for the tobacco
    industry, this vertical relationship was pre-existing and not specific to the Transaction,
    and therefore not analysed further in the competitive assessment.
geographic_markets_considered:
- market_id: gm_1
  name: FBB — EEA-wide
  definition_status: considered
  notes: The Commission analysed the effects of the transaction on the basis that the market
    for FBB is EEA-wide, noting that no affected markets arose at a worldwide level.
- market_id: gm_2
  name: FBB — worldwide
  definition_status: left_open
  notes: The Commission left open whether the geographic market for FBB is EEA-wide or worldwide,
    as the proposed transaction would not raise serious doubts under either plausible definition.
    However, no affected markets arose at the worldwide level, so it was not analysed further.
- market_id: gm_3
  name: Folding boxes — national
  definition_status: considered
  notes: The Commission analysed the effects of the transaction on the basis that the market
    for folding boxes is national level, as no affected markets arose under broader (regional,
    EEA or worldwide) market definitions.
theories_of_harm: []
commitments: []
