- passage_id: sp_22
  source_document_id: eu_ec_m10122_2021_decision
  page: '7'
  quote_snippet: The vast majority of customers confirmed that their suppliers were located
    in the EEA or worldwide,42 with a majority of competitors also confirming that their customers
    were located at either EEA or worldwide level.43 Similarly, the majority of both customers
    and competitors indicated that they either requested bids, or participated in bids, at least
    at EEA level, if not worldwide.44 The majority of respondents also confirmed that price
    differences were not significant within the EEA, price differences generally tended to be
    explained by the differences in product (e.g. the different grade etc.).45 While a majority
    of respondents confirmed that transport costs were however significant by the EEA,46 the
    results of the market investigation indicate that this has not prevented customers from
    sourcing, and competitors from supplying, across the EEA and beyond.
