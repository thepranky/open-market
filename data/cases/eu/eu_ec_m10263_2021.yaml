  page: '8'
  quote_snippet: With respect to the supply of timber construction materials to retailers, the
    Commission considered that the geographic markets for the various timber construction materials
    were wider than national and at least cross-border regional. Regional markets that the Commission
    previously considered were circular catchment areas drawn with a radius of at least 500
    km around a production facility. Other regional markets were considered for a travel range
    of 500 and 1,000 km from a facility. Ultimately, the Commission left the exact definition
    of the relevant geographic markets open.
