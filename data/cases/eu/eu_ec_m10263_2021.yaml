product_markets_considered:
- market_id: pm_1
  name: Wholesale sales to retailers of floors and flooring materials
  definition_status: left_open
  notes: The Commission agreed with the Notifying Party that this likely constitutes a separate
    product market, considering segmentations such as wooden, laminate, and vinyl floors, but
    ultimately left the exact definition open for the purpose of the decision.
- market_id: pm_2
  name: Wholesale sales to retailers of timber construction materials
  definition_status: left_open
  notes: The Commission agreed with the Notifying Party that this likely constitutes a separate
    product market, considering segmentations such as wood-based boards and panel components,
    but ultimately left the exact definition open for the purpose of the decision.
- market_id: pm_3
  name: Wholesale sales to retailers of doors
  definition_status: left_open
  notes: The Commission agreed with the Notifying Party that this likely constitutes a separate
    product market. Segmentations by intended use (external/internal) were considered, but the
    exact definition was left open.
- market_id: pm_4
  name: Wholesale sales to retailers of storage furniture
  definition_status: left_open
  notes: The Commission agreed with the Notifying Party that this likely constitutes a separate
    product market, but left the exact definition open for the purpose of the decision.
- market_id: pm_5
  name: Wholesale sales to retailers of insect screens
  definition_status: left_open
  notes: The Commission agreed with the Notifying Party that this likely constitutes a separate
    product market, but left the exact definition open for the purpose of the decision.
- market_id: pm_6
  name: Retail sale to non-professional customers through DIY stores
  definition_status: left_open
  notes: The Commission considered plausible relevant product markets defined according to sales
    channels (DIY stores vs. builders' merchants) and further segmentation by product categories,
    but ultimately left the exact definition open.
geographic_markets_considered:
- market_id: gm_1
  name: Wholesale sales to retailers of floors and flooring materials — national or EEA-wide
  definition_status: left_open
  notes: While past decisions considered the market at least EEA-wide, and the Notifying Party
    submitted an EEA-wide scope, market investigation respondents were split between national,
    global, and EEA-wide. The Commission ultimately left the exact definition open.
- market_id: gm_2
  name: Wholesale sales to retailers of timber construction materials — national or EEA-wide
  definition_status: left_open
  notes: Past decisions considered the market wider than national and at least cross-border
    regional, with the exact definition left open. The Notifying Party submitted an EEA-wide
    scope, and the majority of market investigation respondents also indicated an EEA-wide scope.
    The Commission ultimately left the exact definition open.
- market_id: gm_3
  name: Wholesale sales to retailers of doors — national or EEA-wide
  definition_status: left_open
  notes: No meaningful Commission precedent was available. While the Notifying Party suggested
    an EEA-wide scope, the majority of market investigation respondents considered the market
    national due to trade standards. The Commission ultimately left the exact definition open.
- market_id: gm_4
  name: Wholesale sales to retailers of storage furniture — national or EEA-wide
  definition_status: left_open
  notes: No meaningful Commission precedent was available. While the Notifying Party suggested
    an EEA-wide scope, customer responses were split between EEA-wide and national (country
    of manufacture). The Commission ultimately left the exact definition open.
- market_id: gm_5
  name: Wholesale sales to retailers of insect screens — national or EEA-wide
  definition_status: left_open
  notes: No meaningful Commission precedent was available. While the Notifying Party submitted
    an EEA-wide scope, market investigation respondents were split between national, global,
    and EEA-wide. The Commission ultimately left the exact definition open.
- market_id: gm_6
  name: Retail sale to non-professional customers through DIY stores — national or local (30km
    radius)
  definition_status: left_open
  notes: Past decisions considered local markets (30km radius), while the Notifying Party argued
    for a national scope. Market investigation respondents were split between local (30km radius)
    and national. The Commission ultimately left the exact definition open.
