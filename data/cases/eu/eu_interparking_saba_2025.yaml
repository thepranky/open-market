  page: '2'
  quote_snippet: Pursuant to a reasoned submission made by Interparking on 7 February 2025 under
    Article 4(4) of the Merger Regulation and after transmitting the submission to all Member
    States, the Commission adopted on 11 March 2025 a decision referring the assessment of the
    effects of the Transaction on the relevant markets in Italy to be examined by the competent
    authority of Italy. The current decision relates to the assessment of the effects of the
    Transaction on the relevant markets outside of Italy.
