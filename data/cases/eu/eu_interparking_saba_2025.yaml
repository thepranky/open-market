- passage_id: sp_2
  source_document_id: eu_interparking_saba_2025_decision
  page: '3'
  quote_snippet: The first potential segmentation is between the operation of on-street and
    off-street paid public parking spaces. Off-street parking refers to parking spaces in any
    location other than the street and typically includes parking facilities such as garages
    and lots, whether indoors or outdoors. By contrast, on-street parking refers to the supply
    of parking spaces for vehicles to park on the street, e.g. along the sidewalk or any place
    that is not an identified parking lot or car park.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
