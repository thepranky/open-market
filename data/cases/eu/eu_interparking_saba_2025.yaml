- passage_id: sp_5
  source_document_id: eu_interparking_saba_2025_decision
  page: '4'
  quote_snippet: For the purpose of the present decision, the Commission considers that the
    question of whether the market for the provision of parking management services constitute
    a market separate from the market for the operation of public paid parking services can
    be left open since the Transaction does not raise serious doubts as to its compatibility
    with the internal market or any substantial part of it irrespective of the market definition.
  extraction_method: pdf_extracted
