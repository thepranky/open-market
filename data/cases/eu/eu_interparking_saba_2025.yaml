- passage_id: sp_6
  source_document_id: eu_interparking_saba_2025_decision
  page: '4'
  quote_snippet: In a previous decision, the Commission concluded that the market for the operation
    of public paid parking services is local since consumers seek to park in the vicinity of
    their destinations. The Commission also indicated that, in practice there was a chain of
    substitution between parking facilities, or lots located in the neighbouring areas, which
    limited the scope for parking to the local area, such as city or municipality.
  extraction_method: pdf_extracted
