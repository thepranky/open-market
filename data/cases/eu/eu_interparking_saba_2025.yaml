- passage_id: sp_4
  source_document_id: eu_interparking_saba_2025_decision
  page: '3'
  quote_snippet: In its past decisional practice, the Commission also considered a market for
    parking management services, which could possibly differ from the operation of public paid
    parking services. The provision of parking management would consist in the maintenance and
    supervision of parking spaces located on the sides of the road, in airports, hospitals,
    shopping malls, cities, hotels.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
