product_markets_considered:
- market_id: pm_1
  name: Operation of paid public car parking services
  definition_status: considered
  notes: The Commission considered this a potential market, with potential segmentations, but
    assessed the transaction on this basis.
- market_id: pm_2
  name: Off-street and on-street paid public parking services
  definition_status: left_open
  notes: The Commission considered a potential segmentation between on-street and off-street
    services but left the question open for the purpose of the decision.
- market_id: pm_3
  name: Parking management services
  definition_status: left_open
  notes: The Commission considered a market for parking management services but left open whether
    it constitutes a market separate from the operation of public paid parking services.
