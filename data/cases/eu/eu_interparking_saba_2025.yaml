- passage_id: sp_3
  source_document_id: eu_interparking_saba_2025_decision
  page: '3'
  quote_snippet: For the purpose of the present decision, the Commission considers that the
    question of whether a segmentation should be made between on-street and off-street paid
    public services can be left open. As explained below, the Transaction does not raise serious
    doubts as to its compatibility with the internal market or any substantial part of it irrespective
    of the market definition.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
