  quote_snippet: (1) On 29 May 2020, the European Commission received notification of a concentration
    pursuant to Article 4 of the Merger Regulation resulting from a proposed transaction whereby
    ams AG (‘AMS’, Austria) intends to acquire sole control, within the meaning of Article 3(1)(b)
    of the Merger Regulation, of the whole of OSRAM Licht AG (‘OSRAM’, Germany)3. AMS is referred
    to hereinafter as the ‘Notifying Party’ and together with OSRAM as the ‘Parties’. The undertaking
    that would result from the proposed transaction is referred to as the ‘merged entity’.
