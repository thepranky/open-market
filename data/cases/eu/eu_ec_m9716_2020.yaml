decision_date: '2020-07-06'
parties: []
source_documents:
- doc_id: eu_ec_m9716_2020_decision
  title: M.9716 — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.9716
  pdf_url: http://publications.europa.eu/resource/cellar/82534e73-1dac-11eb-b57e-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: ICs, discretes, optical semiconductors, and sensors and actuators
  definition_status: defined
  notes: The Commission concludes that these four categories constitute separate product markets
    within semiconductors.
- market_id: pm_2
  name: Optical semiconductors
  definition_status: left_open
  notes: The Commission chose to leave open the question of whether specific segments (light
    sensors, laser diodes, LEDs) constitute separate product markets within optical semiconductors,
    as the transaction did not raise competition concerns regardless of the exact definition.
- market_id: pm_3
  name: Commercial and consumer optical semiconductors
  definition_status: left_open
  notes: The Commission chose to leave open the distinction between commercial/consumer and
    communications IR optical semiconductors, as sales differences were immaterial for the competitive
    assessment.
- market_id: pm_4
  name: Communications IR optical semiconductors
  definition_status: left_open
  notes: The Commission chose to leave open the distinction between commercial/consumer and
    communications IR optical semiconductors, as sales differences were immaterial for the competitive
    assessment.
- market_id: pm_5
  name: Light sensors
  definition_status: left_open
  notes: The Commission suggested that light sensors likely constitute a separate market from
    other optical semiconductors, and that further segmentations by end-use (e.g., automotive
    vs. consumer electronics) were also likely, but ultimately left the precise definition open
    due to lack of competition concerns.
- market_id: pm_6
  name: Light sensors for automotive applications
  definition_status: left_open
  notes: The market investigation suggested a likely segmentation of light sensors by end-use
    (automotive vs. consumer electronics), but the Commission left the precise definition open.
- market_id: pm_7
  name: Light sensors for consumer electronics
  definition_status: left_open
  notes: The market investigation suggested a likely segmentation of light sensors by end-use
    (automotive vs. consumer electronics), but the Commission left the precise definition open.
- market_id: pm_8
  name: Biosensors for consumer electronics
  definition_status: left_open
  notes: The market investigation was not conclusive on whether biosensors for consumer electronics
    constitute a separate market from other biosensors or whether they should be segmented by
    technology (discrete components vs. ICs). The definition was left open as there were no
    competition concerns.
- market_id: pm_9
  name: Mobile 3D flood illuminators
  definition_status: left_open
  notes: The market investigation was not conclusive on whether mobile 3D flood illuminators
    constitute a separate product market. The definition was left open as there were no competition
    concerns.
- market_id: pm_10
  name: Laser diodes
  definition_status: left_open
  notes: The Commission suggested that laser diodes likely constitute a separate market from
    other optical semiconductors, and that further segmentations by technology (VCSEL, EEL)
    or end-use (automotive, consumer electronics) were plausible, but ultimately left the precise
    definition open due to lack of competition concerns.
- market_id: pm_11
  name: VCSEL (Vertical Cavity Surface Emitting Laser)
  definition_status: left_open
  notes: While a distinction between VCSEL and EEL for LiDAR appeared widely supported, the
    Commission deemed it unnecessary to conclude on this segmentation due to very limited sales
    and expected market evolution. The overall market for laser diodes was also left open.
- market_id: pm_12
  name: EEL (Edge Emitting Laser)
  definition_status: left_open
  notes: While a distinction between VCSEL and EEL for LiDAR appeared widely supported, the
    Commission deemed it unnecessary to conclude on this segmentation due to very limited sales
    and expected market evolution. The overall market for laser diodes was also left open.
- market_id: pm_13
  name: Laser diodes for LiDAR
  definition_status: left_open
  notes: The Commission considered a narrower segmentation for laser diodes for LiDAR, but the
    market investigation did not provide a clear indication. The definition was left open as
    there were no competition concerns.
- market_id: pm_14
  name: Assembly and packaging services for sensor solutions
  definition_status: left_open
  notes: The Commission noted that it had not dealt with these services in previous decisions
    and the market investigation replies were limited and inconclusive. The definition was left
    open as the transaction did not raise competition concerns.
- market_id: pm_15
  name: LEDs
  definition_status: left_open
  notes: The Commission suggested that LEDs likely constitute a separate market from other optical
    semiconductors, and that further segmentations were plausible, but ultimately left the precise
    definition open due to lack of competition concerns.
- market_id: pm_16
  name: Segmentations of LEDs
  definition_status: left_open
  notes: The Commission listed several plausible segmentations for LEDs (visible/invisible,
    automotive/general lighting, by light colour, by power output) but left open whether these
    further segmentations were appropriate, as the transaction did not raise competition concerns.
geographic_markets_considered:
- market_id: gm_1
  name: Optical semiconductors — at least EEA-wide and most likely worldwide
  definition_status: left_open
  notes: The Commission found strong indications for a worldwide scope, but explicitly left
    the precise geographic market definition open.
- market_id: gm_2
  name: Light sensors — at least EEA-wide and most likely worldwide
  definition_status: left_open
  notes: The market investigation indicated worldwide competitive conditions for light sensors,
    supporting an at least EEA-wide and most likely worldwide scope. The precise definition
    was left open.
- market_id: gm_3
  name: Laser diodes — at least EEA-wide and most likely worldwide
  definition_status: left_open
  notes: The market investigation indicated worldwide competitive conditions for laser diodes,
    supporting an at least EEA-wide and most likely worldwide scope. The precise definition
    was left open.
- market_id: gm_4
  name: Assembly and packaging services for sensor solutions for mobile phones — global
  definition_status: considered
  notes: The Commission implicitly considered a global market for the assessment of vertical
    effects, noting that mobile phone manufacturing is predominantly done in China and Korea
    and using worldwide market shares as a proxy.
theories_of_harm: []
commitments: []
