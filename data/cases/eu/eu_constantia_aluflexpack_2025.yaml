- passage_id: sp_14
  source_document_id: eu_constantia_aluflexpack_2025_decision
  page: '16'
  quote_snippet: '(70) As explained in paragraphs (11) and (12) above, the Transaction gives
    rise to a horizontal affected market in relation to blister lidding. Given that AFP only
    has de minimis spot sales in unprinted blister lidding, the Commission’s horizontal assessment
    will assess only the product markets for: (i) aluminium blister lidding for pharmaceutical
    applications; and (ii) printed aluminium blister lidding for pharmaceutical applications.'
  extraction_method: pdf_extracted
