- passage_id: sp_3
  source_document_id: eu_constantia_aluflexpack_2025_decision
  page: '5'
  quote_snippet: '(17) Indeed, market participants have highlighted that there exist differences
    between pre-treated aluminium foil according to the end-use it is destined for. For example,
    pre-treated aluminium foil destined for food end-uses needs to satisfy certain regulations:
    one market participant explained that ‘aluminium packaging must be aligned with the high
    production standards for food quality and safety in the European Union. For example, inks
    and lacquering [i.e. the pre-treatment of the foil] must be food safe. Certification of
    a new supplier may take from 6 to 12 months as there are many steps and procedures to be
    tested’.'
  extraction_method: pdf_extracted
