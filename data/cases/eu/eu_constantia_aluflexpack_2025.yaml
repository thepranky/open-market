- passage_id: sp_15
  source_document_id: eu_constantia_aluflexpack_2025_decision
  page: '16'
  quote_snippet: (68) While Constantia supplies both printed and unprinted blister lidding,
    AFP supplies almost exclusively printed blister lidding to pharmaceutical customers. From
    a demand-side perspective, as explained in the previous paragraph, pharmaceutical end-users
    seem to use unprinted and printed blister lidding for the same end-use applications. However,
    from a supply-side perspective, it appears that suppliers of printed blister lidding require
    additional printing capabilities. While there are several providers of unprinted blister
    lidding that are also active in printed blister lidding (e.g. Amcor, Constantia or Aluberg),
    it seems that no pharmaceutical companies and most converters/printers are only active at
    the level of printed blister lidding, potentially indicating the existence of separate markets
    for unprinted and printed blister lidding.
  extraction_method: pdf_extracted
