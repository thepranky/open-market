  page: '5'
  quote_snippet: (19) Therefore, and in light of the results of the market investigation, the
    Commission overall considers that, for the purposes of this Decision, the relevant market
    for pre-treated aluminium foil is that for the production and supply of pre-treated aluminium
    foil for food uses, on the one hand, and for non-food uses, on the other hand. While pre-treated
    aluminium foil for food could be further sub-segmented according to end-use, this can ultimately
    be left open, given that the Transaction does not raise serious doubts as to its compatibility
    with the internal market under any of these plausible market definitions.
