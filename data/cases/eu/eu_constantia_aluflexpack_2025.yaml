case_id: eu_constantia_aluflexpack_2025
case_name: CONSTANTIA / ALUFLEXPACK
authority: European Commission
jurisdiction: EU
sector: manufacturing
outcome: cleared
procedure_stage: phase1
decision_date: '2025-01-22'
parties:
- name: CONSTANTIA
  role: acquirer
- name: ALUFLEXPACK
  role: target
source_documents:
- doc_id: eu_constantia_aluflexpack_2025_decision
  title: CONSTANTIA / ALUFLEXPACK — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.11536
  pdf_url: http://publications.europa.eu/resource/cellar/18ea22ec-4ddb-11f1-8095-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Production and supply of pre-treated aluminium foil for food uses
  definition_status: defined
  notes: The Commission defined the market for pre-treated aluminium foil as segmented into
    food and non-food uses. Further sub-segmentation within food uses was left open.
- market_id: pm_2
  name: Production and supply of pre-treated aluminium foil for non-food uses
  definition_status: defined
  notes: The Commission defined the market for pre-treated aluminium foil as segmented into
    food and non-food uses.
- market_id: pm_3
  name: Flexible aluminium packaging
  definition_status: defined
  notes: The Commission considered flexible aluminium packaging to be a product market distinct
    from other types of flexible packaging and rigid packaging.
- market_id: pm_4
  name: Retortable aluminium containers and lids for wet pet food
  definition_status: defined
  notes: This is a segment of flexible aluminium packaging.
- market_id: pm_5
  name: Retortable aluminium containers and lids for human food
  definition_status: defined
  notes: This is a segment of flexible aluminium packaging.
- market_id: pm_6
  name: Aluminium lidding for dairy
  definition_status: considered
  notes: The Commission assessed this as a separate product market for the purposes of the Decision,
    but left open whether it should be further segmented from aluminium cheese wrapping.
- market_id: pm_7
  name: Aluminium cheese wrapping
  definition_status: considered
  notes: The Commission assessed this as a separate product market for the purposes of the Decision,
    but left open whether it should be further segmented from aluminium lidding for dairy. AFP
    is only marginally active in this segment, making it ancillary.
- market_id: pm_8
  name: Aluminium foil for confectionery
  definition_status: defined
  notes: This is a segment of flexible aluminium packaging.
- market_id: pm_9
  name: Aluminium blister lidding for pharmaceutical applications
  definition_status: left_open
  notes: The Commission left open whether this market should be further segmented between unprinted
    and printed blister lidding, but assessed it as a potential market.
- market_id: pm_10
  name: Printed aluminium blister lidding for pharmaceutical applications
  definition_status: left_open
  notes: This is a sub-segment of aluminium blister lidding for pharmaceutical applications,
    which the Commission assessed as a potential market, leaving open the overall segmentation.
- market_id: pm_11
  name: Aluminium coffee capsules
  definition_status: left_open
  notes: The Commission assessed this as a separate product market for the purposes of the Decision,
    but left open whether aluminium coffee capsules and lids are separate product markets. This
    market did not give rise to a vertically affected market.
- market_id: pm_12
  name: Aluminium coffee lids
  definition_status: left_open
  notes: The Commission assessed this as a separate product market for the purposes of the Decision,
    but left open whether aluminium coffee capsules and lids are separate product markets. This
    market did not give rise to a vertically affected market.
geographic_markets_considered:
- market_id: gm_1
  name: Production and supply of pre-treated aluminium foil for flexible aluminium packaging
    — EEA-wide (EEA and Switzerland affected)
  definition_status: left_open
  notes: The Commission considered the geographic scope to be at least EEA-wide, but possibly
    including EEA and Switzerland, and left the exact scope open.
- market_id: gm_2
  name: Flexible aluminium packaging — EEA-wide (EEA and Switzerland affected)
  definition_status: left_open
  notes: The Commission considered the geographic scope for all relevant product markets related
    to flexible aluminium packaging to be at least EEA-wide, but possibly including EEA and
    Switzerland, and left the exact scope open.
- market_id: gm_3
  name: Retortable aluminium containers and lids for wet pet food — EEA-wide (EEA and Switzerland
    affected)
  definition_status: left_open
  notes: The geographic scope for this horizontally affected market was considered to be at
    least EEA-wide, but possibly including EEA and Switzerland, and left open.
- market_id: gm_4
  name: Retortable aluminium containers and lids for human food — EEA-wide (EEA and Switzerland
    affected)
  definition_status: left_open
  notes: The geographic scope for this horizontally affected market was considered to be at
    least EEA-wide, but possibly including EEA and Switzerland, and left open.
- market_id: gm_5
  name: Aluminium lidding foil for dairy — EEA-wide (EEA and Switzerland affected)
  definition_status: left_open
  notes: The geographic scope for this horizontally affected market was considered to be at
    least EEA-wide, but possibly including EEA and Switzerland, and left open.
- market_id: gm_6
  name: Aluminium foil for confectionery — EEA-wide (EEA and Switzerland affected)
  definition_status: left_open
  notes: The geographic scope for this horizontally affected market was considered to be at
    least EEA-wide, but possibly including EEA and Switzerland, and left open.
- market_id: gm_7
  name: Aluminium blister lidding for pharmaceutical applications — EEA-wide (EEA and Switzerland
    affected)
  definition_status: left_open
  notes: The geographic scope for this horizontally affected market was considered to be at
    least EEA-wide, but possibly including EEA and Switzerland, and left open.
- market_id: gm_8
  name: Printed aluminium blister lidding for pharmaceutical applications — EEA-wide (EEA and
    Switzerland affected)
  definition_status: left_open
  notes: The geographic scope for this vertically affected market was considered to be at least
    EEA-wide, but possibly including EEA and Switzerland, and left open.
- market_id: gm_9
  name: Aluminium coffee capsules — EEA-wide (EEA and Switzerland affected)
  definition_status: left_open
  notes: While not giving rise to an affected market, the geographic scope for the upstream
    supply of pre-treated aluminium foil for coffee capsules was noted as EEA-wide, and the
    general flexible aluminium packaging market conclusion implies this for downstream as well.
- market_id: gm_10
  name: Aluminium coffee lids — EEA-wide (EEA and Switzerland affected)
  definition_status: left_open
  notes: While not giving rise to an affected market, the geographic scope for flexible aluminium
    packaging in general implies this for aluminium coffee lids.
