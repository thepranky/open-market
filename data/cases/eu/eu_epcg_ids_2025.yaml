product_markets_considered:
- market_id: pm_1
  name: Small package delivery services (under 31.5 kg)
  definition_status: defined
  notes: The Commission defines the core product market as the delivery of small packages weighing
    under 31.5 kg, which are commonly referred to as 'parcels' and can be handled by a single
    person without mechanical aids. This market is distinguished from mail delivery services
    and freight forwarding.
- market_id: pm_2
  name: Small package delivery services by speed (express and deferred)
  definition_status: left_open
  notes: The Commission considered a distinction between express and deferred services based
    on different customer needs, infrastructure, and pricing. While the market investigation
    suggested this differentiation remains relevant, especially due to guaranteed timeframes
    and distinct infrastructure for some services, the exact scope was left open.
- market_id: pm_3
  name: Small package delivery services by geography of delivery (domestic, international intra-EEA,
    international extra-EEA)
  definition_status: left_open
  notes: The Commission previously considered segmentation based on whether packages are picked
    up and delivered in the same country (domestic) or different countries (international),
    with further distinction for international intra-EEA and extra-EEA. The market investigation
    confirmed this view, noting differences due to customs clearance and transport modes. However,
    the exact scope was left open.
- market_id: pm_4
  name: Small package delivery services by customer type (C2X, B2C, B2B)
  definition_status: left_open
  notes: The Commission previously distinguished between small package delivery services to
    consumers (C2X) and businesses (B2C and B2B). The market investigation yielded inconclusive
    feedback regarding the blurriness of this distinction, with some competitors noting converging
    expectations and shared infrastructure, while others highlighted remaining differences in
    network requirements and delivery patterns. The exact scope was left open.
- market_id: pm_5
  name: Out-of-home (OOH) small package delivery services
  definition_status: left_open
  notes: A competitor highlighted OOH deliveries (lockers/Automated Parcel Machines and pick-up
    drop-off points) as a potential subsegment. Both PostNL and GLS are active in this segment.
    The Commission noted this potential, but found no further indication that this delineation
    was pertinent for the case, and thus left the exact scope open.
geographic_markets_considered:
- market_id: gm_1
  name: Small package delivery services — national (Netherlands affected)
  definition_status: left_open
  notes: The Commission's previous practice considered geographic markets for small package
    delivery services to be likely national. The Parties proposed a Benelux regional market.
    The market investigation generally confirmed the national scope, despite some indications
    of broader-than-national characteristics. For the purpose of this decision, the exact geographic
    scope was left open, but the effects of the Transaction were assessed under the narrowest
    plausible definition, the national market for the Netherlands.
