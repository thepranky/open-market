source_passages:
- passage_id: sp_1
  source_document_id: eu_epcg_ids_2025_decision
  page: '15'
  quote_snippet: The Commission has previously considered mail delivery services (postal mail
    delivery), small package delivery services (which are the delivery of smaller packages,
    commonly defined according to weight, which a single person can handle without specific
    equipment) and freight forwarding (which is the organisation of transportation of items
    (including possible ancillary activities such as customs clearance, warehousing, ground
    services etc.), on behalf of customers according to their needs) as separate relevant markets.72
    With regard to small package delivery services, the Commission in its previous practice
    has defined it as relating to smaller parcels which weigh under 31.5 kg.
  extraction_method: pdf_extracted
