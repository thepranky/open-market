  page: '5'
  quote_snippet: For the purpose of this decision and in light of the results of the market
    investigation, the Commission will assess the overall product market for DRAM as including
    all possible narrower markets, i.e. the market for commodity DRAMs, and the DRAM markets
    for (i) servers, (ii) PCs, (iii) mobiles, (iv) games, (v) network devices, (vi) PC peripherals,
    and others.
