  quote_snippet: Previously, the Commission found a distinction between enterprise and client
    storage because enterprise storage generally requires higher performance and superior endurance,
    compared to client storage.33 The Commission has however noted that in some cases, client
    SSDs can be used for enterprise applications that do not require a high workload.
  extraction_method: pdf_extracted
