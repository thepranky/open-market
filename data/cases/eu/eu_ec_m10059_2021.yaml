- passage_id: sp_2
  source_document_id: eu_ec_m10059_2021_decision
  page: '4'
  quote_snippet: In past decisions, the Commission examined whether it was necessary to differentiate
    between the different types of DRAMs. In particular, the Commission considered whether commodity
    DRAMs, used as components for personal computers, and high- speed DRAMs, used in high-performance
    servers and workstations, are separate product markets but ultimately left the market definition
    question open.
  extraction_method: pdf_extracted
  review_status: unreviewed
