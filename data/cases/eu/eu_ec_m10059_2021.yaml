- passage_id: sp_19
  source_document_id: eu_ec_m10059_2021_decision
  page: '12'
  quote_snippet: In the Commission's previous decisions, the geographic market for SSDs (including
    any putative narrower markets thereunder) was considered to be worldwide in scope, because
    (i) transport costs do not play a significant role and amount to less than 1% of total product
    cost; (ii) there are no significant barriers to trade; (iii) prices do not typically differ
    by region; (iv) products and product features do not differ by region; (v) manufacturers
    are active on a global basis (thus competitors tend to be the same regardless of the regions
    taken into consideration); and (vi) the market players decide their strategy on a global
    level.47
  extraction_method: pdf_extracted
