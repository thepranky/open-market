  page: '8'
  quote_snippet: The market investigation confirmed the segmentation by technology into HDD
    and SSD.29 In particular, from the demand-side, the majority of market participants takes
    the view that SSD and HDDs are not substitutable, as HDD customers seek large capacity storage
    at the lowest per GB price and SSD is used in lower capacity storage with higher performance.
  extraction_method: pdf_extracted
