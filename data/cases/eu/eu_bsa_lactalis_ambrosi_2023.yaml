  page: '28'
  quote_snippet: (157) For the purposes of the present case, the competitive assessment will
    be carried out at the narrowest plausible level at which the Parties compete in, distinguishing
    butter from other vegetable fats and distinguishing butter sold in packets from butter sold
    in bulk. For the same reasons that were given for the supply of cheeses, the competitive
    assessment will also distinguish between branded and private label packaging, and between
    the sales channel (i.e., modern retail, traditional retail and the OOH channel). The exact
    market definition can be left open as the concentration does not raise serious doubts as
    to its compatibility with the internal market under any plausible market definition.
