  page: '29'
  quote_snippet: (162) The majority of both customers and competitors consider that differences
    between consumer preferences and competitive conditions (e.g., prices, suppliers available,
    type of products) for the supply of Italian-type hard cheeses and other Italian cheeses
    across EEA member states are significant or very significant.177 Customers and competitors
    particularly stressed differences in consumer behaviour across these countries.178 Further,
    the market investigation has not brought forward any contradicting evidence to the Commission’s
    conclusion in previous cases that the narrowest plausible market for the supply of cheeses
    more generally (including non-Italian cheeses) is national in scope.
