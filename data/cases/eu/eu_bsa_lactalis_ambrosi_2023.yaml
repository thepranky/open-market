  page: '29'
  quote_snippet: (167) While a majority of responding customers found that differences in consumer
    preferences and competitive conditions (e.g., prices, active suppliers, type of products)
    for the supply of butter across EEA member states are significant or very significant, an
    equal number of responding competitors found that these differences are significant as those
    that found them to be insignificant.184 None of the customers and competitors that expressed
    an opinion found that the answer to this question would change depending on whether one
    were to look at the supply of bulk butter or butter packets.185
