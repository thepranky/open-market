product_markets_considered:
- market_id: pm_1
  name: PDO Parmigiano Reggiano
  definition_status: considered
  notes: The competitive assessment for Italian-type hard cheeses, including PDO Parmigiano
    Reggiano, will be carried out at the narrowest plausible level, distinguishing by sales
    channel (modern retail, traditional retail, OOH) but not by private label and branded products.
- market_id: pm_2
  name: PDO Grana Padano
  definition_status: considered
  notes: The competitive assessment for Italian-type hard cheeses, including PDO Grana Padano,
    will be carried out at the narrowest plausible level, distinguishing by sales channel (modern
    retail, traditional retail, OOH) but not by private label and branded products.
- market_id: pm_3
  name: PDO Pecorino Romano
  definition_status: considered
  notes: The competitive assessment for Italian-type hard cheeses, including PDO Pecorino Romano,
    will be carried out at the narrowest plausible level, distinguishing by sales channel (modern
    retail, traditional retail, OOH) but not by private label and branded products.
- market_id: pm_4
  name: other Italian-type hard cheeses
  definition_status: considered
  notes: The competitive assessment for Italian-type hard cheeses, including other Italian-type
    hard cheeses, will be carried out at the narrowest plausible level, distinguishing by sales
    channel (modern retail, traditional retail, OOH) but not by private label and branded products.
- market_id: pm_5
  name: cow mozzarella
  definition_status: defined
  notes: The market investigation provided conclusive evidence for separate relevant product
    markets for cow mozzarella, buffalo mozzarella and burrata. The competitive assessment will
    also distinguish between branded and private label products, and between sales channels
    (modern retail, traditional retail, OOH).
- market_id: pm_6
  name: buffalo mozzarella
  definition_status: defined
  notes: The market investigation provided conclusive evidence for separate relevant product
    markets for cow mozzarella, buffalo mozzarella and burrata. The competitive assessment will
    also distinguish between branded and private label products, and between sales channels
    (modern retail, traditional retail, OOH).
- market_id: pm_7
  name: burrata
  definition_status: defined
  notes: The market investigation provided conclusive evidence for separate relevant product
    markets for cow mozzarella, buffalo mozzarella and burrata. The competitive assessment will
    also distinguish between branded and private label products, and between sales channels
    (modern retail, traditional retail, OOH).
- market_id: pm_8
  name: feta
  definition_status: left_open
  notes: For feta, mascarpone and ricotta, the precise market definition can be left open, but
    the Commission will consider each as a separate product market for the competitive assessment.
    The assessment will also distinguish between branded and private label products, and between
    sales channels (modern retail, traditional retail, OOH).
- market_id: pm_9
  name: mascarpone
  definition_status: left_open
  notes: For feta, mascarpone and ricotta, the precise market definition can be left open, but
    the Commission will consider each as a separate product market for the competitive assessment.
    The assessment will also distinguish between branded and private label products, and between
    sales channels (modern retail, traditional retail, OOH).
- market_id: pm_10
  name: ricotta
  definition_status: left_open
  notes: For feta, mascarpone and ricotta, the precise market definition can be left open, but
    the Commission will consider each as a separate product market for the competitive assessment.
    The assessment will also distinguish between branded and private label products, and between
    sales channels (modern retail, traditional retail, OOH).
- market_id: pm_11
  name: taleggio
  definition_status: left_open
  notes: For the purposes of this Decision, the precise market definition with regard to taleggio,
    gorgonzola and magor can be left open, but the competitive assessment will be carried out
    at the narrowest plausible level, segmented between branded and private label products and
    between sales channels.
- market_id: pm_12
  name: gorgonzola
  definition_status: left_open
  notes: For the purposes of this Decision, the precise market definition with regard to taleggio,
    gorgonzola and magor can be left open, but the competitive assessment will be carried out
    at the narrowest plausible level, segmented between branded and private label products and
    between sales channels.
- market_id: pm_13
  name: magor
  definition_status: left_open
  notes: For the purposes of this Decision, the precise market definition with regard to taleggio,
    gorgonzola and magor can be left open, but the competitive assessment will be carried out
    at the narrowest plausible level, segmented between branded and private label products and
    between sales channels.
- market_id: pm_14
  name: paste filate
  definition_status: left_open
  notes: For the purposes of this Decision, the precise market definition with regard to paste
    filate can be left open, but the competitive assessment will be carried out at the narrowest
    plausible level, segmented between branded and private label products and between sales
    channels.
- market_id: pm_15
  name: Swiss-type cheese
  definition_status: left_open
  notes: For the purposes of this Decision, the precise market definition with regard to Swiss-type
    cheese can be left open, but the competitive assessment will be carried out at the narrowest
    plausible level, segmented between branded and private label products and between sales
    channels.
- market_id: pm_16
  name: butter sold in packets
  definition_status: left_open
  notes: The competitive assessment will distinguish butter sold in packets from butter sold
    in bulk, and between branded and private label packaging, and between sales channels (modern
    retail, traditional retail, OOH). The exact market definition can be left open.
- market_id: pm_17
  name: butter sold in bulk
  definition_status: left_open
  notes: The competitive assessment will distinguish butter sold in bulk from butter sold in
    packets, and between branded and private label packaging, and between sales channels (modern
    retail, traditional retail, OOH). The exact market definition can be left open.
geographic_markets_considered:
- market_id: gm_1
  name: Supply of cheese — national (EEA countries affected)
  definition_status: left_open
  notes: For the purpose of this decision, the competitive assessment for the supply of cheese
    will be carried out at a national level. However, the precise geographic market definition
    can be left open as the concentration does not raise serious doubts as to its compatibility
    with the internal market under any plausible geographic market definition, including at
    the EEA level.
- market_id: gm_2
  name: Supply of butter — national (EEA countries affected)
  definition_status: considered
  notes: The competitive assessment for the supply of butter will be carried out at the narrowest
    level possible, i.e. at a national level. The precise market definition can be left open
    as the concentration does not raise serious doubts as to its compatibility with the internal
    market under any plausible market definition.
