  source_document_id: eu_bsa_lactalis_ambrosi_2023_decision
  page: '11'
  quote_snippet: '(55) For the purposes of this Decision, the competitive assessment will be
    carried out at the narrowest plausible level, i.e. distinguishing according to: (i) type
    of cheese between PDO Parmigiano Reggiano, PDO Grana Padano, PDO Pecorino Romano and other
    Italian-type hard cheeses; and (ii) sales channels between the modern retail channel, the
    traditional retail channel and OOH channel. For the purpose of this Decision, based on the
    results of the market investigation, no distinction will be made between private label and
    branded PDO Parmigiano Reggiano, PDO Grana Padano, PDO Pecorino Romano and other Italian-type
    hard cheeses.'
