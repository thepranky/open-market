  page: '7'
  quote_snippet: (78) In light of the findings of the market investigation, the Commission considers
    that, for fresh cheeses, while private label products exert a constraint on branded products,
    this is not sufficient to exclude that branded products compete in a different market. In
    any event, for the purposes of the present case, the exact market definition can be left
    open as the concentration does not raise serious doubts as to its compatibility with the
    internal market under any plausible market definition. The Commission will therefore in
    its competitive assessment distinguish between branded and private label products for each
    of the fresh cheeses considered.
