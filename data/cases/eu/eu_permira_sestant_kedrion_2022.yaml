  source_document_id: eu_permira_sestant_kedrion_2022_decision
  page: '5'
  quote_snippet: (19) With regard to plasma-derived pharmaceutical products specifically, the
    Commission previously found that they differ from other pharmaceutical products because
    they come from a natural body fluid for the collection of which manufacturers depend on
    the willingness of donors. The Commission found separate product markets for human albumin,
    intravenous immunoglobulin (“IG”), Factor VIII and Factor IX.13 The Notifying Party agrees
    with the Commission’s decisional practice.
