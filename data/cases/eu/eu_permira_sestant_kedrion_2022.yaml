  page: '6'
  quote_snippet: (24) The Notifying Parties consider that there may be separate markets for
    the collection of normal plasma and specialty plasma, and consider that these markets (either
    combined or separate) should include collection through collection centres as well as the
    limited volumes of blood plasma procured otherwise.15 Normal plasma differs from speciality
    plasma both on the supply-side (since the latter is collected from donors who have specific
    antibodies in their plasma) and on the demand-side (since they are used to manufacture different
    therapeutical products).
  extraction_method: pdf_extracted
