  source_document_id: eu_permira_sestant_kedrion_2022_decision
  page: '5'
  quote_snippet: (20) For the purposes of this Decision, it is not necessary to conclude on
    the product market definition, because the Parties do not overlap horizontally in any of
    these products and the focus of the competitive assessment is potential customer foreclosure
    and the Targets’ share of demand is not significant taking into that they are overall small
    purchasers of the upstream products/services. The Transaction does not give rise to any
    competitive concerns under any plausible market definition.
  extraction_method: pdf_extracted
