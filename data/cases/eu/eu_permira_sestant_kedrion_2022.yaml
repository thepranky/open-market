product_markets_considered:
- market_id: pm_1
  name: Plasma-derived pharmaceutical products
  definition_status: left_open
  notes: The Commission previously identified separate product markets for human albumin, intravenous
    immunoglobulin ("IG"), Factor VIII, and Factor IX. For the purpose of this Decision, it
    was not necessary to conclude on the exact product market definition.
- market_id: pm_2
  name: Human albumin
  definition_status: considered
  notes: Referenced as a separate product market identified in previous Commission decisions.
- market_id: pm_3
  name: Intravenous immunoglobulin ("IG")
  definition_status: considered
  notes: Referenced as a separate product market identified in previous Commission decisions.
- market_id: pm_4
  name: Factor VIII
  definition_status: considered
  notes: Referenced as a separate product market identified in previous Commission decisions.
- market_id: pm_5
  name: Factor IX
  definition_status: considered
  notes: Referenced as a separate product market identified in previous Commission decisions.
- market_id: pm_6
  name: Collection and supply of blood plasma
  definition_status: left_open
  notes: The Notifying Parties considered separate markets for the collection of normal plasma
    and specialty plasma. The Commission did not conclude on the exact product market definition
    for this Decision.
- market_id: pm_7
  name: Supply of paste
  definition_status: left_open
  notes: Paste is an intermediate product from plasma fractionation, including types like CRYO
    paste, prothrombin complex concentrate, Fraction II, Fraction II+III, and Fraction V.
- market_id: pm_8
  name: CDMO services
  definition_status: considered
  notes: The Commission's decisional practice, referenced from previous cases, identified separate
    markets for CDMO services for Finished Dose Pharmaceuticals (FDPs) and Active Pharmaceutical
    Ingredients (APIs).
- market_id: pm_9
  name: CRO services
  definition_status: considered
  notes: The Commission's decisional practice, referenced from previous cases, found a separate
    market for CRO services without further segmentation.
- market_id: pm_10
  name: Laboratory services for clinical development
  definition_status: considered
  notes: The Commission previously identified separate markets for laboratory services for clinical
    development and laboratory services for diagnostic purposes. For this Decision, only the
    market for laboratory services for clinical development was considered relevant.
- market_id: pm_11
  name: Specific chemicals
  definition_status: left_open
  notes: Specific chemicals considered relevant include acetic acid, hydrochloric acid, sodium
    hypochlorite, sodium hydroxide, sodium acetate anhydrous, and sodium acetate trihydrate.
    The Commission did not conclude on the exact product market definition for these chemicals.
geographic_markets_considered:
- market_id: gm_1
  name: Plasma-derived pharmaceutical products — national (EEA countries affected)
  definition_status: defined
  notes: null
- market_id: gm_2
  name: Collection and supply of blood plasma — global
  definition_status: left_open
  notes: The Commission stated it was not necessary to conclude on the exact geographic market
    definition, but noted a vertical relationship only exists when considering a global market
    definition.
- market_id: gm_3
  name: Supply of paste — global
  definition_status: left_open
  notes: The Commission stated it was not necessary to conclude on the exact geographic market
    definition, but indicated it is likely global.
- market_id: gm_4
  name: CDMO services — EEA-wide
  definition_status: considered
  notes: The Commission's decisional practice considered the market for CDMO services to be
    at least EEA-wide in scope.
- market_id: gm_5
  name: CRO services — EEA-wide
  definition_status: considered
  notes: The Commission's decisional practice considered the market for CRO services to be at
    least EEA-wide in scope.
- market_id: gm_6
  name: Laboratory services for clinical development — EEA-wide
  definition_status: considered
  notes: The Commission's decisional practice considered the market for laboratory services
    for clinical development to be at least EEA-wide in scope.
- market_id: gm_7
  name: Specific chemicals — national/EEA-wide
  definition_status: left_open
  notes: The Commission stated it was not necessary to conclude on the exact geographic market
    definition, but noted that for certain chemicals, markets could be either national or EEA-wide.
