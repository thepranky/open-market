  page: '8'
  quote_snippet: (37) In a previous decision, the Commission identified separate markets for
    laboratory services for clinical development (for which the customers are e.g. pharmaceutical
    and biotechnology companies, CROs and CDMOs) and laboratory services for diagnostic purposes
    (for which customers are hospitals / clinics and physicians), and left the possibility of
    further segmentation open.21 In the current case, the Notifying Parties did not express
    a view on the appropriate market definition of laboratory services. For the purpose of this
    Decision, it is not necessary to depart from the Commission’s decisional practice, as the
    Transaction does not raise competition concerns under any plausible market definition. In
    this case, only the market for laboratory services for clinical development is relevant,
    as it forms part of an affected vertical relationship.
