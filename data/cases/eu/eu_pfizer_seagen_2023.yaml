- passage_id: sp_5
  source_document_id: eu_pfizer_seagen_2023_decision
  page: '17'
  quote_snippet: 'The majority of competitors and KOLs confirmed that breast cancers can be
    broadly categorised as follows: (a) breast cancers that over-express the protein human epidermal
    growth factor receptor 2 (“HER2+”, HER2 positive) and those that do not (“HER2-”, HER2 negative);
    and (b) breast cancers that over-express hormone receptors (“HR+”) and those that do not
    (“HR-”). Both competitors and KOLs also confirmed that treatment options for these different
    categories of breast cancer would be different and not substitutable.'
  extraction_method: pdf_extracted
