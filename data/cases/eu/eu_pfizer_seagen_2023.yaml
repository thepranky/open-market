product_markets_considered:
- market_id: pm_1
  name: Treatment of Bladder Cancer (overall segmentation)
  definition_status: left_open
  notes: The Commission acknowledged the segmentation of bladder cancer into non-muscle invasive
    (NMIBC), muscle-invasive (MIBC), and metastatic urothelial carcinoma (mUC) based on cancer
    invasiveness. While confirming this distinction, the exact market definition was left open
    for the overall market.
- market_id: pm_2
  name: Treatment of Non-Muscle Invasive Bladder Cancer (NMIBC)
  definition_status: considered
  notes: For the purpose of its competitive assessment, the Commission considered the market
    for the treatment of NMIBC, as this was the specific area of overlap between the parties'
    activities.
- market_id: pm_3
  name: Treatment of Breast Cancer (overall segmentation)
  definition_status: left_open
  notes: The Commission recognized the distinction between HER2+ and HER2- breast cancers, and
    HR+ and HR- breast cancers, confirming that treatment options for these categories are different
    and not substitutable. However, the exact market definition for the overall breast cancer
    treatment market was left open.
- market_id: pm_4
  name: Treatment of HER2+ Breast Cancer
  definition_status: considered
  notes: The Commission conducted its competitive assessment at the market level for the treatment
    of HER2+ breast cancer, as this was the area of overlap between the parties' activities.
- market_id: pm_5
  name: Treatment of Cervical Cancer (overall segmentation)
  definition_status: left_open
  notes: The Commission's market investigation confirmed the segmentation of cervical cancers
    into early-stage, locally advanced, and metastatic/recurrent. While treatment options varied
    significantly across these categories, the exact market definition for the overall cervical
    cancer treatment market was left open.
- market_id: pm_6
  name: Treatment of Metastatic and Recurrent Cervical Cancer
  definition_status: considered
  notes: The Commission decided to conduct its competitive assessment at the market level for
    the treatment of metastatic and recurrent cervical cancer, identifying this as the area
    of overlap between the parties' activities.
- market_id: pm_7
  name: Treatment of Colorectal Cancer (overall segmentation)
  definition_status: left_open
  notes: The Commission's market investigation confirmed the segmentation of colorectal cancers
    into lower-stage (1-3) and metastatic (mCRC). While treatment options varied significantly
    across these stages, the exact market definition for the overall colorectal cancer treatment
    market was left open.
- market_id: pm_8
  name: Treatment of Metastatic Colorectal Cancer (mCRC)
  definition_status: considered
  notes: The Commission conducted its competitive assessment at the market level for the treatment
    of mCRC, as this was the identified area of overlap between the parties' activities.
- market_id: pm_9
  name: Treatment of Leukaemia (overall segmentation)
  definition_status: left_open
  notes: 'The Commission confirmed the distinction between four main categories of leukaemia:
    acute myeloid leukaemia (AML), acute lymphoblastic leukaemia (ALL), chronic myeloid leukaemia
    (CML), and chronic lymphocytic leukaemia (CLL), as treatment options for these categories
    differ. However, the exact product market definition for overall leukaemia treatments was
    left open.'
- market_id: pm_10
  name: Treatment of Acute Myeloid Leukaemia (AML)
  definition_status: considered
  notes: The Commission conducted its competitive assessment at the market level for AML, which
    was identified as the area of overlap between the parties' activities.
- market_id: pm_11
  name: Treatment of Lymphoma (overall segmentation)
  definition_status: left_open
  notes: The Commission confirmed the distinction between Hodgkin lymphomas (HL) and non-Hodgkin
    lymphomas (NHL). While this segmentation and possible further sub-segmentation were supported,
    the exact product market definition for overall lymphoma treatments was left open.
- market_id: pm_12
  name: Treatment of Systemic Anaplastic Large Cell Lymphoma (ALCL)
  definition_status: considered
  notes: The Commission conducted its competitive assessment at the market level for ALCL, which
    was an identified area of overlap.
- market_id: pm_13
  name: Treatment of Diffuse Large B-Cell Lymphoma (DLBCL)
  definition_status: considered
  notes: The Commission conducted its competitive assessment at the market level for DLBCL,
    which was an identified area of overlap.
- market_id: pm_14
  name: Treatment of Lung Cancer (overall segmentation)
  definition_status: left_open
  notes: The Commission confirmed the distinction between non-small-cell lung cancer (NSCLC)
    and small-cell lung cancer (SCLC), and further noted that within NSCLC, treatments typically
    differ based on gene mutations. However, the exact market definition for overall lung cancer
    treatments, including further sub-segmentations, was left open.
- market_id: pm_15
  name: Treatment of Non-Small-Cell Lung Cancer (NSCLC)
  definition_status: left_open
  notes: Although the overall market definition for lung cancer, including specific segmentation
    for NSCLC, was left open, the competitive assessment focused on overlaps in the NSCLC segment,
    implying this as a key area of analysis.
geographic_markets_considered:
- market_id: gm_1
  name: Marketed pharmaceutical products — national
  definition_status: considered
  notes: The Commission generally considered the geographic market for marketed pharmaceutical
    products to be national in scope for the purpose of this decision.
- market_id: gm_2
  name: Pipeline pharmaceutical products — global or, at least, EEA-wide
  definition_status: considered
  notes: The Commission generally considered the geographic market for pipeline pharmaceutical
    products to be global or, at least, EEA-wide in scope for the purpose of this decision.
theories_of_harm: []
commitments: []
source_passages:
- passage_id: sp_1
  source_document_id: eu_pfizer_seagen_2023_decision
  page: '13'
  quote_snippet: In light of the above, the Commission takes the view that, a distinction should
    be made between NMIBC, MIBC, and mUC. In conclusion, in the present case, the exact market
    definition, i.e., whether the market shall be segmented by cancer stage, by line of treatment,
    by MoA or by MoD, can be left open as the Transaction does not raise serious doubts as to
    its compatibility with the internal market under any plausible market definition. For the
    purposes of this decision, the Commission will conduct its competitive assessment at the
    market level where the Parties’ activities overlap, namely the market for the treatment
    of NMIBC.
  extraction_method: pdf_extracted
