- passage_id: sp_2
  source_document_id: eu_pfizer_seagen_2023_decision
  page: '13'
  quote_snippet: The results of the Commission’s market investigation confirmed the Parties’
    suggested segmentation of bladder cancer into NMIBC, MIBC and mUC. The majority of both
    competitors and KOLs indicated that NMIBC, MIBC and mUC require different treatments and
    that these treatments are not substitutable, as treatments for these categories are generally
    not interchangeable due to differences in cancer progression and invasiveness and each form
    may respond differently to various types of therapies.
