product_markets_considered:
- market_id: pm_1
  name: Generation and wholesale supply of electricity
  definition_status: defined
  notes: The Commission confirmed previous decisions that generation and wholesale supply of
    electricity constitutes a single product market, without further segmentation based on generation
    sources or trading channels.
- market_id: pm_2
  name: Retail supply of electricity
  definition_status: segmented
  notes: 'The Commission segmented the retail supply of electricity based on three categories
    of final customers: large industrial and commercial, smaller industrial and commercial,
    and households.'
geographic_markets_considered:
- market_id: gm_1
  name: Generation and wholesale supply of electricity — national (Belgium affected)
  definition_status: left_open
  notes: For Belgium, the geographic market definition was left open between national and supra-national,
    as the transaction did not raise serious doubts under either alternative. The Commission
    did, however, analyze the impact on a national Belgian market basis.
- market_id: gm_2
  name: Generation and wholesale supply of electricity — national (Portugal affected)
  definition_status: left_open
  notes: For Portugal, the geographic market definition was left open between national and supra-national
    (Iberian market), as the transaction did not raise serious doubts under either alternative.
    The Commission focused its discussion on the Portuguese national market.
- market_id: gm_3
  name: Retail supply of electricity — national (Belgium affected)
  definition_status: left_open
  notes: The Commission considered the market for retail supply of electricity to be national
    in Belgium, but left open whether it could be regional for small industrial and commercial
    customers and households, while focusing its analysis on the national level.
- market_id: gm_4
  name: Retail supply of electricity — national (Portugal affected)
  definition_status: left_open
  notes: The Commission considered the market for retail supply of electricity to be national
    in Portugal, leaving the definition open while focusing analysis on the national level.
