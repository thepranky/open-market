product_markets_considered:
- market_id: pm_1
  name: Manufacture and wholesale supply of decorative coatings
  definition_status: segmented
  notes: The Commission considered segmentations between decorative paints and woodcare products,
    water-based and solvent-based coatings, and sales channels. The first two were left open,
    while the third (sales channels) was found not to require further segmentation for the purpose
    of the decision.
- market_id: pm_2
  name: Retail distribution of decorative coatings
  definition_status: defined
  notes: The Commission concluded that this market does not need further segmentations.
geographic_markets_considered:
- market_id: gm_1
  name: Manufacture and wholesale supply of decorative coatings — EEA-wide or national
  definition_status: left_open
  notes: The exact scope of the geographic market was left open as it had no impact on the competitive
    assessment.
- market_id: gm_2
  name: Retail distribution of decorative coatings — national or local (20-50 km radius)
  definition_status: left_open
  notes: The exact scope of the geographic market was left open as it had no impact on the competitive
    assessment.
