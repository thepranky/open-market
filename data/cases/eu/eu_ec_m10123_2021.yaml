- passage_id: sp_4
  source_document_id: eu_ec_m10123_2021_decision
  page: '7'
  quote_snippet: (34) The market investigation did not indicate that the market for the retail
    distribution of decorative coatings should be further segmented. As a result, for the purposes
    of assessing the Transaction, the Commission will analyse the retail activities of the Parties
    on the basis of the narrowest plausible product market, namely the market for the retail
    distribution of decorative coatings. The Commission therefore considers that, for the purposes
    of assessing the Transaction, the retail distribution of decorative coatings constitutes
    a distinct product market, without the need for further segmentations.
  extraction_method: pdf_extracted
