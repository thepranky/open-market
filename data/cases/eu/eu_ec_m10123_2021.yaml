  quote_snippet: (8) Decorative coatings cover various types of coatings (such as paints, lacquer
    and varnish) normally used on-site both internally and externally during construction or
    refurbishment, to protect and decorate surfaces of buildings such as walls, ceilings, doors,
    window frames and other surfaces. Decorative coatings include both paints and woodcare products.
