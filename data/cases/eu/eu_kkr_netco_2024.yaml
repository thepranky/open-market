product_markets_considered:
- market_id: pm_1
  name: Wholesale supply of broadband access services (segmented by level of interconnection,
    type of access, technology, and type of service)
  definition_status: left_open
  notes: The Commission previously defined a separate market for wholesale supply of broadband
    access services and considered but left open further segmentation by point of interconnection
    (local/central), type of access (LLU, bitstream, resale), and technology (cable, copper,
    fibre, FWA). For this decision, the exact product market definition for the overall market
    was left open, irrespective of further segmentation by these criteria and by type of service
    (active/passive).
- market_id: pm_2
  name: Wholesale supply of passive broadband access services
  definition_status: considered
  notes: This market was considered as part of a vertically affected link and a horizontally
    affected market for the purpose of the competitive assessment, with a focus on semi-GPON
    services in the foreclosure analysis.
- market_id: pm_3
  name: Wholesale supply of active broadband access services
  definition_status: considered
  notes: This market was considered as part of a vertically affected link for the purpose of
    the competitive assessment. The Commission noted that the Transaction does not lead to a
    structural change in this market.
geographic_markets_considered:
- market_id: gm_1
  name: Wholesale supply of broadband access services — national (Italy affected)
  definition_status: considered
  notes: The Commission considered the relevant geographic market for the wholesale supply of
    broadband access services to be national (Italy) based on market investigation responses
    and the fact that NetCo will be active throughout Italy and prices are set at a national
    level.
- market_id: gm_2
  name: Wholesale supply of passive broadband access services — national (Italy affected)
  definition_status: considered
  notes: This market, as part of the vertically and horizontally affected links, was assessed
    at a national level in Italy.
- market_id: gm_3
  name: Wholesale supply of active broadband access services — national (Italy affected)
  definition_status: considered
  notes: This market, as part of the vertically affected link, was assessed at a national level
    in Italy.
