source_passages:
- passage_id: sp_1
  source_document_id: eu_kkr_netco_2024_decision
  page: '16'
  quote_snippet: 'The Commission has previously defined a separate market for wholesale supply
    of broadband access services. The Commission considered, but ultimately left the question
    open, whether this market should be subdivided according to: (i) the level where the point
    of interconnection – which connects the infrastructure of the wholesale provider and that
    of the customer (i.e. the operator seeking access) – is situated (i.e. wholesale local or
    central broadband access); (ii) the type of access to fixed connections (i.e. wholesale
    LLU, bitstream or resale broadband access); or (iii) the type of technology (i.e. cable,
    copper, fibre or FWA).'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
