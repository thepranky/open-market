- passage_id: sp_11
  source_document_id: eu_kkr_netco_2024_decision
  page: '18'
  quote_snippet: In previous decisions, the Commission considered whether the geographic market
    for wholesale supply of broadband access services was national or limited to the coverage
    area of each network operator but left the definition open. In recent decisions concerning
    cable, the Commission concluded that the geographical scope was each cable operator’s coverage
    area. In respect of the Italian market, in Vodafone Italia/TIM/Inwit JV, the Commission
    left the exact geographic market definition open absent any competition concerns, but based
    its competitive assessment on the national level.
  extraction_method: pdf_extracted
