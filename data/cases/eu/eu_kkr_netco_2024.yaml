- passage_id: sp_10
  source_document_id: eu_kkr_netco_2024_decision
  page: '18'
  quote_snippet: The vast majority of the respondents to the market investigation submitted
    that the relevant geographic scope of the market for wholesale supply of broadband access
    services is national. The Commission notes that NetCo will be active in the whole territory
    of Italy. Moreover, prices are set at a national level. In light of the above and for the
    purpose of this decision, the Commission considers that the relevant geographic market is
    national, i.e. Italy.
