- passage_id: sp_2
  source_document_id: eu_kkr_netco_2024_decision
  page: '17'
  quote_snippet: In light of the above and for the purpose of this decision, the Commission
    concludes that the exact product market definition for the market for wholesale supply of
    broadband access services can be left open, as the Transaction does not raise serious doubts
    as to its compatibility with the internal market irrespective of a further segmentation
    by (i) the level where the point of interconnection is situated; (ii) the type of access;
    (iii) the type of technology (between copper, fibre and FWA); and (iv) the type of service
    (between active and passive).
  extraction_method: pdf_extracted
