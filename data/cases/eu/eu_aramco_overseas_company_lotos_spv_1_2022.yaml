product_markets_considered:
- market_id: pm_1
  name: Ex-refinery supply of jet fuel
  definition_status: considered
  notes: The Commission stated that the exact market definition for the ex-refinery supply of
    aviation fuels could be left open, but proceeded to conduct its assessment on the basis
    of the narrowest plausible segment, i.e., ex-refinery supply of jet fuel.
- market_id: pm_2
  name: Into-plane supply of jet fuel (by suppliers and throughputters)
  definition_status: considered
  notes: The Commission stated that the exact market definition for the into-plane supply of
    aviation fuels could be left open, but proceeded to conduct its assessment on the basis
    of into-plane supply of aviation fuel by both suppliers and throughputters, excluding into-plane
    sales by resellers, focusing on jet fuel.
geographic_markets_considered:
- market_id: gm_1
  name: Ex-refinery supply of jet fuel — national (Poland affected)
  definition_status: considered
  notes: The Commission stated that the exact market definition for the ex-refinery supply of
    aviation fuels in Poland could be left open, but proceeded to conduct its assessment on
    the basis of a national Polish market.
- market_id: gm_2
  name: Into-plane supply of jet fuel (by suppliers and throughputters) — airport-specific (Poland
    affected)
  definition_status: considered
  notes: The Commission stated that the exact market definition for the into-plane supply of
    aviation fuels at specific airports in Poland could be left open, but proceeded to conduct
    its assessment on the basis of separate markets for each specific airport in Poland.
