  page: '3'
  quote_snippet: 'With respect to the supply of aviation fuel, the Commission distinguished
    between: (i) ex-refinery supply, and (ii) into-plane (retail) supply.9 The Commission has
    also considered a distinction between two different types of aviation fuel: jet fuel and
    aviation gasoline.10 The Notifying Party does not contest the Commission’s previous findings.'
