  source_document_id: eu_agco_trimble_trimble_solutions_jv_2024_decision
  page: '5'
  quote_snippet: On the demand side, these terminals are characterized by specific hardware
    configurations allowing their interoperability with the agricultural machinery and with
    other components of the precision agriculture infrastructure. More importantly, terminals
    are the components that generally run the software allowing the operation of that infrastructure
    (to the extent that is not hosted on the cloud), which is one of the most critical elements
    of precision agriculture operations.
