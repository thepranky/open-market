- passage_id: sp_1
  source_document_id: eu_agco_trimble_trimble_solutions_jv_2024_decision
  page: '4'
  quote_snippet: The Parties submit that, for the purpose of this case, receivers should be
    segmented by sector. The assessment should therefore focus on receivers for agricultural
    applications. These receivers are distinguished from those used in other sectors because
    of their level of accuracy, their rugged housing and their design allowing easy installation
    on the rooftops of agricultural machinery.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
