- passage_id: sp_8
  source_document_id: eu_agco_trimble_trimble_solutions_jv_2024_decision
  page: '7'
  quote_snippet: The Commission’s prenotification interviews with market participants provided
    some support for the Parties’ arguments. In particular, the relevant market may not be limited
    to specific applications within the agricultural sector (as it is the case in the automotive
    sector) but may actually extend beyond the agricultural sector. In fact, market participants
    explained that agricultural ECUs have similar requirements to ECUs used for construction
    machinery and other off-road sectors and there is a wide range of alternative suppliers
    for these products.
  extraction_method: pdf_extracted
  review_status: unreviewed
