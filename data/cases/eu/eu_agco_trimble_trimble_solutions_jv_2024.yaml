- passage_id: sp_2
  source_document_id: eu_agco_trimble_trimble_solutions_jv_2024_decision
  page: '4'
  quote_snippet: The Parties’ internal documents – as well as the several market participants
    interviewed during the Commission’s investigation – generally refer to an overall category
    of receivers for agricultural applications, without any meaningful sub-segmentations. In
    particular, receivers for agricultural applications are generally characterized by similar
    levels of accuracy, which is typically within the range of 2 cm.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
