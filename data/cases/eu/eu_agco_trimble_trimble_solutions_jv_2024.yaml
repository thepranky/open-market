product_markets_considered:
- market_id: pm_1
  name: GNSS receivers for agricultural applications
  definition_status: left_open
  notes: The Commission conservatively assessed the transaction based on the narrowest plausible
    market definition, but left open whether these products belong to a broader product market
    encompassing receivers for other applications, as the transaction would not raise concerns
    either way.
- market_id: pm_2
  name: Terminals for precision agriculture applications
  definition_status: left_open
  notes: The Commission confirmed that terminals for agricultural applications are not substitutable
    with terminals used in other sectors. It conservatively assessed the transaction based on
    the narrowest plausible market definition but left open whether these products belong to
    a broader product market, as the transaction would not raise concerns either way.
- market_id: pm_3
  name: Electronic control units (ECUs)
  definition_status: left_open
  notes: The Commission noted that there is no precedent for ECUs in the agricultural sector
    and found some support for a broader market extending beyond the agricultural sector. However,
    the precise market definition was left open as the transaction would not raise competition
    concerns irrespective of the product market definition.
- market_id: pm_4
  name: Precision agriculture products (factory channel)
  definition_status: considered
  notes: The Commission considered the factory channel and the aftermarket channel to be separate
    product markets for precision agriculture products.
- market_id: pm_5
  name: Precision agriculture products (aftermarket channel)
  definition_status: considered
  notes: The Commission considered the factory channel and the aftermarket channel to be separate
    product markets for precision agriculture products.
- market_id: pm_6
  name: Tractors
  definition_status: considered
  notes: The Commission considered different types of agriculture machinery to belong to separate
    product markets, focusing its analysis on machinery types in which AGCO is active, including
    tractors.
- market_id: pm_7
  name: Combines
  definition_status: considered
  notes: The Commission considered different types of agriculture machinery to belong to separate
    product markets, focusing its analysis on machinery types in which AGCO is active, including
    combines.
- market_id: pm_8
  name: Forage harvesters
  definition_status: considered
  notes: The Commission considered different types of agriculture machinery to belong to separate
    product markets, focusing its analysis on machinery types in which AGCO is active, including
    forage harvesters.
- market_id: pm_9
  name: Self-propelled sprayers
  definition_status: considered
  notes: The Commission considered different types of agriculture machinery to belong to separate
    product markets, focusing its analysis on machinery types in which AGCO is active, including
    self-propelled sprayers.
geographic_markets_considered:
- market_id: gm_1
  name: Precision agriculture products — EEA-wide
  definition_status: considered
  notes: The Commission's market investigation confirmed that the geographic scope for precision
    agriculture products is at least EEA-wide, with transportation costs and regulatory requirements
    not being meaningful barriers. However, market conditions were noted to differ from other
    geographic areas due to distribution networks.
- market_id: gm_2
  name: Tractors — national (EEA countries affected)
  definition_status: considered
  notes: The Commission, in line with its precedent and market investigation findings, considered
    the geographic markets for agricultural machinery (including tractors) to have a national
    scope at the retail level, noting price and feature differences across Member States.
- market_id: gm_3
  name: Combines — national (EEA countries affected)
  definition_status: considered
  notes: The Commission, in line with its precedent and market investigation findings, considered
    the geographic markets for agricultural machinery (including combines) to have a national
    scope at the retail level, noting price and feature differences across Member States.
- market_id: gm_4
  name: Forage harvesters — national (EEA countries affected)
  definition_status: considered
  notes: The Commission, in line with its precedent and market investigation findings, considered
    the geographic markets for agricultural machinery (including forage harvesters) to have
    a national scope at the retail level, noting price and feature differences across Member
    States.
- market_id: gm_5
  name: Self-propelled sprayers — national (EEA countries affected)
  definition_status: considered
  notes: The Commission, in line with its precedent and market investigation findings, considered
    the geographic markets for agricultural machinery (including self-propelled sprayers) to
    have a national scope at the retail level, noting price and feature differences across Member
    States.
theories_of_harm: []
commitments: []
