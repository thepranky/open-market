  page: '4'
  quote_snippet: For the purpose of this case, the Commission will conservatively assess the
    transaction based on the narrowest plausible market definition, that is the market of GNSS
    receivers for agricultural applications. However, it can be left open whether these products
    belong to a broader product market encompassing receivers for other applications, because
    the transaction would not raise concerns either way.
  extraction_method: pdf_extracted
