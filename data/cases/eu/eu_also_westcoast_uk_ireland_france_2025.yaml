- passage_id: sp_1
  source_document_id: eu_also_westcoast_uk_ireland_france_2025_decision
  page: '5'
  quote_snippet: As regards a potential segmentation by distribution channel, the Commission
    considers that, in light of the evolution of the market for the wholesale distribution of
    printing consumables (i.e., currently all printing consumables are sold via ICT wholesalers),
    a segmentation by distribution channels (between ICT wholesalers, wholesalers of traditional
    office supplies and specialized wholesalers) is no longer plausible.
  extraction_method: pdf_extracted
