product_markets_considered:
- market_id: pm_1
  name: Wholesale distribution of printing consumables
  definition_status: segmented
  notes: The Commission defined this as a separate market in previous decisions. It left open
    whether the market should be segmented by distribution channels (specialised, ICT, or traditional
    office supplies wholesalers) or by type of sales (direct and/or indirect). The Commission
    later considered segmentation by distribution channel no longer plausible due to market
    evolution.
- market_id: pm_2
  name: Wholesale distribution of printers
  definition_status: left_open
  notes: The Commission defined a separate market for the wholesale distribution of printers
    in a previous decision (Ricoh/Ikon). It considered potential segmentation based on printer
    categories (black and white, colour) and printing capacity, but left any further segmentation
    open. In this decision, the Commission confirmed it was not departing from previous precedents
    and left open segmentation by product category (printers within ICT products) and further
    segmentation of printers by category or capacity.
- market_id: pm_3
  name: Wholesale distribution of ICT and CE products
  definition_status: considered
  notes: Mentioned as an overall market considered in previous decisions, which included a sub-segmentation
    by product category such as printers, but that segmentation was left open.
- market_id: pm_4
  name: Wholesale distribution of ICT products
  definition_status: considered
  notes: Mentioned as a separate market defined in previous cases, considered as part of an
    overall market including ICT and CE products.
- market_id: pm_5
  name: Wholesale distribution of photocopiers and fax machines
  definition_status: considered
  notes: Mentioned as a market separate from the wholesale distribution of printers in a previous
    decision.
geographic_markets_considered:
- market_id: gm_1
  name: Wholesale distribution of printing consumables — national (France affected)
  definition_status: left_open
  notes: The Commission considered whether the geographic market for the wholesale distribution
    of printing consumables could be EEA-wide, regional, or national in scope based on precedents,
    but ultimately left it open. Market investigation results, however, provided indications
    that the geographic scope is national, citing national contract negotiations, national pricing
    by distributors, and logistical requirements for national presence.
- market_id: gm_2
  name: Wholesale distribution of printers — EEA-wide/regional/national
  definition_status: left_open
  notes: The Commission considered whether the geographic market for the wholesale distribution
    of printers (or ICT products generally) could be EEA-wide, regional, or national based on
    precedents but left the precise definition open.
theories_of_harm: []
