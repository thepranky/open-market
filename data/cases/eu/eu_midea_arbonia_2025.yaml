- passage_id: sp_2
  source_document_id: eu_midea_arbonia_2025_decision
  page: '5'
  quote_snippet: 'The results of the market investigation generally support a further segmentation
    of the HVAC market based on type of technology, as a starting point. Further, the market
    investigation supports a possible further segmentation of the FCU market according to: (i)
    intended use (i.e., residential vs non-residential FCUs), (ii) based on the number of tubes
    (i.e., FCUs with two tubes and FCUs with four tubes) and (iii) design (i.e. classical FCUs
    that are free standing on the floor and non-classical FCUs that are mounted in the wall
    or ceiling).'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
