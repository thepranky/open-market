product_markets_considered:
- market_id: pm_1
  name: Fan coil units (FCUs)
  definition_status: left_open
  notes: The Commission conducted segmentation analysis for FCUs based on intended use (residential
    vs. non-residential), number of tubes (two vs. four), and design (classical/free-standing
    vs. non-classical/mounted), finding a plausible basis for these distinctions, but ultimately
    left the overall market definition for FCUs open as no competition concerns arose under
    any plausible definition.
- market_id: pm_2
  name: Non-classical FCUs (mounted in the wall or ceiling)
  definition_status: considered
  notes: This is a specific segmentation of FCUs based on design, differentiated from 'classical'
    (free-standing) FCUs. The Commission found it plausible to distinguish FCUs based on design
    and focused its competitive assessment on this segment in Estonia, identifying it as the
    only horizontally affected market.
geographic_markets_considered:
- market_id: gm_1
  name: Fan coil units (FCUs) — EEA-wide
  definition_status: left_open
  notes: null
- market_id: gm_2
  name: Fan coil units (FCUs) — national
  definition_status: left_open
  notes: null
- market_id: gm_3
  name: Non-classical FCUs (mounted in the wall or ceiling) — national (Estonia affected)
  definition_status: considered
  notes: The competitive assessment for non-classical FCUs was specifically carried out at the
    national level in Estonia, even though the overall geographic market definition for FCUs
    was left open. This market was identified as the only horizontally affected market at a
    national level.
