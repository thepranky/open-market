- passage_id: sp_1
  source_document_id: eu_midea_arbonia_2025_decision
  page: '4'
  quote_snippet: The Commission has adopted several decisions concerning HAVC products. In its
    more recent precedents, the Commission has considered the existence of markets for specific
    HAVC technologies, such as heat pumps, AHUs, as well as possible segmentations thereof,
    for instance based on intended end-use (residential or non-residential), structure (free
    standing or mounted), or design. However, the Commission has not defined so far a market
    for FCUs or possible further segmentations thereof.
  extraction_method: pdf_extracted
