  source_document_id: eu_midea_arbonia_2025_decision
  page: '8'
  quote_snippet: 'At the same time, however, the vast majority of competitors indicated that
    they need a local presence (a local distributor, installer or representative) to make sales
    in a given country. More precisely, they explained that: “You need to engage directly with
    the end user or his mechanical contractor to understand their need and requirements in order
    to generate a tailored-made quote”; “the local presence is mandatory to supply FCU”; “Yes,
    need local sales representatives”; “Yes, local representation is critical to provide pre
    and after sales support and logistic operations”; “[…] in each of these Markets it is fundamental
    to master a solid network of distributors and various contractors (installers, service technicians,
    planners) […]”.'
