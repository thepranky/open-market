- passage_id: sp_15
  source_document_id: eu_midea_arbonia_2025_decision
  page: '11'
  quote_snippet: 'The Commission considers that the Transaction will not significantly impede
    effective competition on the market for the supply of non-classical FCUs in Estonia for
    the following reasons: (i) the Parties’ combined market shares are moderate, with a non-significant
    increment; (ii) the Parties are not close competitors to each other; (iii) there will remain
    several credible FCU suppliers on the market capable of containing the Merged Entity post-Transaction;
    and (iv) there is sufficient spare capacity on the market.'
  extraction_method: pdf_extracted
