  source_document_id: eu_ec_m10234_2021_decision
  page: '7'
  quote_snippet: In any event, the Commission considers that for the purpose of this Decision,
    the question of whether there is an overall relevant product market for the supply of cleaning
    and hygiene products and systems, or whether it should be segmented by sector and/or end
    use can be left open. Neither of these alternative product market definitions affects the
    outcome of the competitive assessment of the Transaction as to its compatibility with the
    internal market or the functioning of the EEA Agreement.
  extraction_method: pdf_extracted
