- passage_id: sp_3
  source_document_id: eu_ec_m10234_2021_decision
  page: '5'
  quote_snippet: The Notifying Parties consider that biocidal products for hygiene end-uses
    have properties and characteristics that make them suitable for one end-use (for example,
    disinfectant properties suitable for cleaning hard surfaces) and are not typically suitable
    for other end-uses (for example personal care products for human application). Therefore,
    downstream customers would not switch and demand-side substitutability is limited. Likewise,
    supply-side substitution is limited given that biocidal products for different end-uses
    typically involve different technologies, know-how, mix of ingredients and manufacturing
    processes, as well as the existence of different registration requirements under the BPR.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
