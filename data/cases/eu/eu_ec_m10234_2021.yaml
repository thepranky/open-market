- passage_id: sp_10
  source_document_id: eu_ec_m10234_2021_decision
  page: '6'
  quote_snippet: The Commission takes note of the […] sales of Lonza Specialty Ingredients into
    Europe from the US. However, on the basis of the inconclusive market investigation and the
    fact that the outcome of the competitive assessment of the Transaction as to its compatibility
    with the internal market or the functioning of the EEA Agreement is not affected under either
    of the two plausible alternative geographic market definitions (EEA-wide or worldwide),
    the Commission considers that for the purpose of assessing the Transaction, the exact scope
    of the geographic market definition for biocidal products for hygiene end-uses can be left
    open.
