  source_document_id: eu_ec_m10234_2021_decision
  page: '5'
  quote_snippet: In light of the above, and in particular the level of supply-side substitutability
    between different active ingredients, the Commission considers that a segmentation based
    on active ingredient might not be fully appropriate in the present case, whereas a segmentation
    based on end-use continues to be appropriate in light of the above demand and supply-side
    considerations.
