    and possible separate markets for (i) carpet backings for construction applications and
    (ii) carpet backings for automotive applications; nonwovens for building/roofing applications,
    and possible separate market for nonwovens carriers for bitumen membranes) are at least
    EEA-wide. In any event, for the purpose of the assessment of the present Transaction, the
    exact geographic scope of the relevant markets can be left open, as the Transaction does
