  source_document_id: eu_csl_vifor_pharma_2022_decision
  page: '14'
  quote_snippet: In the absence of Commission precedents for HS treatments, the Parties are
    of the view that a segmentation of the market for treatment of HS could be envisaged according
    to the Hurley stage of classification. The Parties further argue that in any event, the
    exact scope of the product market can be left open because the Transaction will not raise
    competition concerns under any market segmentation.
