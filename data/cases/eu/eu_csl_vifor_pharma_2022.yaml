source_passages:
- passage_id: sp_1
  source_document_id: eu_csl_vifor_pharma_2022_decision
  page: '6'
  quote_snippet: 'In the absence of Commission precedents for SCD treatments, the Notifying
    Party considers that a segmentation of the market could be envisaged according to the severity
    of the disease and the LoT, as follows: (i) durable curative treatments (i.e. stem-cell
    transplants and, in the future, gene therapies); (ii) prophylaxis treatments (prevention
    of VOC and other SCD symptoms); and (iii) treatments of VOC and other SCD complications
    (acute (on-demand) treatment).'
  extraction_method: pdf_extracted
