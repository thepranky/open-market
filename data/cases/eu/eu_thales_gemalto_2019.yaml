- passage_id: sp_19
  source_document_id: eu_thales_gemalto_2019_decision
  page: '34'
  quote_snippet: 'With regard to GSM-R, the Commission considers that there are indications
    that GSM-R integration projects constitute a separate product market from railway signalling
    systems due to the following factors: (i) the presence of specialised providers of GSM-R
    solutions, such as Nokia or Kapsch, who are not active in other subsystems for railway signalling,
    (ii) railway signalling suppliers such as Thales, Siemens and Alstom frequently bid in consortia
    with these specialised GSM-R providers so that they do not directly supply GSM-R systems,
    (iii) the specialised nature of the GSM-R standards and the underlying technologies, which
    are different from other railway signalling technologies (such ETCS, the other component
    of ERTMS).'
  extraction_method: pdf_extracted
