  quote_snippet: Based on the Notifying Party’s submission, from the demand side the line between
    physical and logical access control are possibly blurred when physical access is controlled
    by software, such as in the case of a smart card. From the supply side, vendors are increasingly
    offering dual-use access control cards that can simultaneously provide logical and physical
    access control (i.e. enabling the same credentials to both open a door and access a computer
    system).
