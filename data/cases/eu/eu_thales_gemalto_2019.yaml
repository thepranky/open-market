  page: '38'
  quote_snippet: '117 In the Form CO, the Notifying Party has identified a number of other potential
    vertical links. However, these possible vertical links will not be further discussed in
    Section 8 for the following reasons: (i) regarding the vertical link between Gemalto''s
    activities on the upstream market for transport cards and Thales'' activities on the downstream
    market for ticketing systems, [...]; (ii) regarding the vertical link between Thales'' activities
    on the upstream market for the provision of security evaluation and Gemalto''s need for
    evaluation of its smart cards, [...]; (iii) [...], Gemalto became active in the provision
    of biometric solutions (with its Live Face Identification system – "LIVE") which could theoretically
    be used as a plug-in in video surveillance systems – an area where Thales is active. However,
    [...]; (iv) in 2013 Gemalto acquired Invia, [...]. This vertical relationship is de minimis
    [...]. The Transaction will not affect the market structure and any potential foreclosure
    concerns can be excluded.'
