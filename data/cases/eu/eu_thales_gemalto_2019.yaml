product_markets_considered:
- market_id: pm_1
  name: GP HSMs
  definition_status: defined
  notes: The Commission concluded that General Purpose Hardware Security Modules (GP HSMs) constitute
    a distinct product market, separate from Payment HSMs and other Key Management Solutions
    (KMS).
- market_id: pm_2
  name: Payment HSMs
  definition_status: defined
  notes: The Commission concluded that Payment Hardware Security Modules (Payment HSMs) constitute
    a distinct product market, separate from GP HSMs and other Key Management Solutions (KMS).
- market_id: pm_3
  name: Enterprise Encryption Software (ES) for data at rest/in use
  definition_status: left_open
  notes: The Commission left open the exact product market definition for Enterprise Encryption
    Software, including whether ES for data at rest/in use is a single market or further segmented
    by encryption level (storage/disk, file/folder, database, application, tokenization, data
    masking). The assessment considered this narrowest plausible market.
- market_id: pm_4
  name: Network encryptors for data in motion
  definition_status: left_open
  notes: The Commission left open the exact product market definition for network encryptors
    for data in motion, including whether it should be sub-segmented based on network layers
    (Layers 1, 2, or 3). The assessment considered this narrowest plausible market, with specific
    horizontal effects identified for Layer 2.
- market_id: pm_5
  name: (Cyber) security evaluation services
  definition_status: left_open
  notes: The Commission left open whether the market consists of all (cyber) security evaluation
    services or separate markets based on certification standards (e.g., CSPN security evaluation
    services), as the Transaction would not significantly impede effective competition under
    any plausible definition.
- market_id: pm_6
  name: OTA SIM card administration and services platforms
  definition_status: defined
  notes: The Commission confirmed that the provision of OTA SIM card administration and services
    platforms constitutes a distinct product market.
- market_id: pm_7
  name: Manufacture and supply of SIM cards
  definition_status: left_open
  notes: The Commission left open whether the market for the manufacture and supply of SIM cards
    constitutes a separate market from overall plastic cards, but considered this as a plausible
    narrowest market.
- market_id: pm_8
  name: GSM-R integration projects
  definition_status: left_open
  notes: The Commission left open whether GSM-R integration projects constitute a separate market
    from railway signalling systems, but noted indications for a separate market and considered
    this as a plausible narrowest market.
- market_id: pm_9
  name: Access control smart cards
  definition_status: left_open
  notes: The Commission left open the exact product market definition, including whether it
    should be segmented into physical and logical access control microprocessor chip cards,
    as the Transaction would not significantly impede effective competition under any plausible
    definition.
geographic_markets_considered:
- market_id: gm_1
  name: GP HSMs — EEA-wide or worldwide (geographic scope left open)
  definition_status: left_open
  notes: The Commission concluded that the geographic market for GP HSMs could be at least EEA-wide
    or worldwide, but left the exact definition open as the competitive assessment would remain
    the same.
- market_id: gm_2
  name: Payment HSMs — EEA-wide or worldwide (geographic scope left open)
  definition_status: left_open
  notes: The Commission concluded that the geographic market for Payment HSMs could be at least
    EEA-wide or worldwide, but left the exact definition open as the competitive assessment
    would remain the same.
- market_id: gm_3
  name: Enterprise Encryption Software (ES) for data at rest/in use — EEA-wide or global (geographic
    scope left open)
  definition_status: left_open
  notes: The Commission left open whether the relevant geographic market for ES for data at
    rest/in use is EEA-wide or global, as the Transaction would not significantly impede effective
    competition under any plausible definition, including the narrowest possible market at the
    EEA level.
- market_id: gm_4
  name: Network encryptors for data in motion (Layer 2) — EEA-wide or global (geographic scope
    left open)
  definition_status: left_open
  notes: The Commission left open whether the relevant geographic market for network encryptors
    for data in motion is EEA-wide or global. However, the horizontal competitive assessment
    focused on a potential sub-segment for data in motion at Layer 2 at the EEA-wide market.
- market_id: gm_5
  name: (Cyber) security evaluation services — global or EEA-wide (geographic scope left open)
  definition_status: left_open
  notes: The Commission left open whether the geographic market for (cyber) security evaluation
    services is global or EEA-wide, as the Transaction would not significantly impede effective
    competition under any plausible definition.
- market_id: gm_6
  name: Manufacture and supply of SIM cards — EEA-wide (geographic scope left open)
  definition_status: left_open
  notes: The Commission left open the exact geographic market definition for the manufacture
    and supply of SIM cards, but considered the narrowest possible market to be EEA-wide.
- market_id: gm_7
  name: OTA SIM card administration and services platforms — EEA-wide or global (geographic
    scope left open)
  definition_status: left_open
  notes: The Commission left open whether the relevant geographic market for OTA SIM card administration
    and services platforms is global or EEA-wide.
- market_id: gm_8
  name: GSM-R integration projects — national (geographic scope left open)
  definition_status: left_open
  notes: The Commission left open the exact geographic market definition for GSM-R integration,
    noting elements pointing to a national scope but also suggesting an EEA-wide or global scope.
    The narrowest possible market at a national level was considered.
- market_id: gm_9
  name: Access control smart cards — EEA-wide or global (geographic scope left open)
  definition_status: left_open
  notes: The Commission left open whether the geographic market for access control smart cards
    is global or at least EEA-wide, considering that the Transaction would not significantly
    impede effective competition under any plausible definition, including the narrowest possible
    market at the EEA level.
