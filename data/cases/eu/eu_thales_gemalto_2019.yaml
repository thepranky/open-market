  page: '29'
  quote_snippet: Regarding the question whether encryption at different layers can be distinguished
    as separate markets within the market for network encryptors, the Commission has the following
    observations. First, the market investigation did not indicate whether ES for data in motion
    should be further sub-segmented based on layers of encryption. Second, based on the Notifying's
    Party submission, the Commission considers that from the demand side customers can and do
    use network encryptors to encrypt data at Layers 1, 2 and/or 3 of their computer networks
    alone or in combination.
