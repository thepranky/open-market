- passage_id: sp_2
  source_document_id: eu_thales_gemalto_2019_decision
  page: '22'
  quote_snippet: As regards the question whether GP HSMs and Payment HSMs should be considered
    from the demand side as substitutes, the results of the market investigation generally indicate
    that they are not.61 The majority of the respondents considered that there is a difference
    in functionality between Payment and GP HSMs and that they are intended for different use
    cases. Respondents pointed to the fact that GP HSMs are more expensive and more flexible,
    while Payment HSMs are more case-oriented. It was also explained that GP HSMs must support
    standardised programmatic application program interfaces ("APIs") whereas Payment HSMs present
    proprietary APIs that do not allow any interoperability.62 In addition, customers of Payment
    HSMs require additional PCI-HSM certifications for the HSMs they purchase. Consequently,
    the offerings of the Parties and their competitors are divided between Payment and GP HSM
    products.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
