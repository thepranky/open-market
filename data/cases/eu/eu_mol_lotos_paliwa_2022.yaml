product_markets_considered:
- market_id: pm_1
  name: Retail supply of motor fuels
  definition_status: considered
  notes: The Commission considered the retail supply of motor fuels to be a distinct relevant
    product market, but proceeded to assess various segmentations before defining the specific
    market for its assessment.
- market_id: pm_2
  name: Retail supply of motor fuels (by type of fuel product)
  definition_status: left_open
  notes: The Commission concluded that retail supply of motor fuels should not be further sub-segmented
    by type of fuel product (diesel, gasoline, LPG) in general, but left the specific segmentation
    for LPG open in this case as no affected markets would arise.
- market_id: pm_3
  name: Retail supply of motor fuels at on-motorway stations / off-motorway stations
  definition_status: left_open
  notes: The Commission considered segmenting the market by on-motorway and off-motorway stations,
    reviewing previous decisions, but ultimately left the sub-segmentation open for this case.
    It focused its assessment on off-motorway stations as this was the narrowest plausible segment
    where affected markets arose.
- market_id: pm_4
  name: Retail sale of motor fuels to B2B customers / B2C customers
  definition_status: defined
  notes: The Commission confirmed that B2B and B2C sales belong to distinct markets based on
    market investigation findings. The assessment focused on B2C customers as the B2B market
    did not result in an affected market.
- market_id: pm_5
  name: Retail sale of fuel to B2C customers at off-motorway stations
  definition_status: defined
  notes: This is the specific market definition on which the Commission focused its competitive
    assessment, following segmentation analysis for fuel type, station type, and customer type.
geographic_markets_considered:
- market_id: gm_1
  name: Retail sale of motor fuels to B2C customers at off-motorway stations — national (Poland
    affected)
  definition_status: defined
  notes: The Commission considered the market to be national in scope, but acknowledged its
    local elements and focused its assessment on the local level due to absence of affected
    markets nationally.
- market_id: gm_2
  name: Retail sale of motor fuels to B2C customers at off-motorway stations — local (Poland
    affected)
  definition_status: defined
  notes: The Commission assessed local competition using isochrones based on driving distances,
    with different radii for cities (2.5 km), suburban areas (5 km), and rural areas (20 km).
