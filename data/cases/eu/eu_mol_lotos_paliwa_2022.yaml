- passage_id: sp_5
  source_document_id: eu_mol_lotos_paliwa_2022_decision
  page: '4'
  quote_snippet: (15) Regarding a possible segmentation between on- and off-motorway stations,
    the Commission has in two recent cases ultimately decided against such segmentation in view
    of the particularities of those cases (such as the non-existence of tolls or insignificant
    price differences).15 In a previous decision, however, it considered that on-motorway stations
    constitute a separate market from that for off-motorway stations in view of the notable
    differences in competitive conditions which characterise the sale of fuels by the two categories
    of service stations (such as the existence of tolls, price differences, differences in commercial
    offer, distinct conditions of entry).16
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
