  source_document_id: eu_mol_lotos_paliwa_2022_decision
  page: '5'
  quote_snippet: (20) First, the Commission’s market investigation supports the view that the
    retail supply of motor fuels encompasses all types of motor fuels available at stations,
    including LPG, with all respondents unanimously confirming this point.19 However, as regards
    LPG the precise segmentation can be left open as no affected markets would arise on a potential
    segment for the sale of LPG.
