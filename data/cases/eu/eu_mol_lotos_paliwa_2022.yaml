- passage_id: sp_14
  source_document_id: eu_mol_lotos_paliwa_2022_decision
  page: '6'
  quote_snippet: (27) The presence-based approach is premised on the assumption that local competition
    between retail stations can be indirectly observed by virtue of physical proximity between
    stations. The analysis is carried out by defining isochrones centred around each individual
    retail station of the respective Party’s retail network. The radius of the isochrone is
    assumed to encapsulate the stations that compete with the station in question. The appropriate
    radius may depend on the particularities of respective local areas and will most likely
    vary between, for example, urban and rural areas.
  extraction_method: pdf_extracted
  review_status: unreviewed
