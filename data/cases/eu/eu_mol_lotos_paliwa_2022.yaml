- passage_id: sp_6
  source_document_id: eu_mol_lotos_paliwa_2022_decision
  page: '5'
  quote_snippet: (21) For the purpose of the present case, the Commission will leave open a
    possible sub-segmentation between on and off-motorway stations, given that neither approach
    would give rise to competition concerns. Given that affected markets only arise on local
    markets comprising off-motorway stations, only the off-motorway stations (i.e. the narrowest
    plausible segment) will be further discussed in this decision.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
