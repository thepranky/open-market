- passage_id: sp_7
  source_document_id: eu_mol_lotos_paliwa_2022_decision
  page: '5'
  quote_snippet: (22) The market investigation has also confirmed that B2B and B2C sales belong
    to distinct markets.20 One respondent noted that “[t]he B2B and B2C markets [are] characterized
    by a different offer of products and services, and thus require a different sales strategy
    and activities”. Another respondent pointed to different preferences of B2B customers who
    determine their preferred supplier based on “having access to [a] large network of stations,
    and having access to stations along transit routes” while B2C customers “tend to view the
    retail market more as a local market, than national one”. Other respondents pointed to differences
    in prices offered to B2B compared to B2C customers.21 Given that the Proposed Transaction
    does not result in an an affected market as regards B2B customers, the retail sale of motor
    fuels to B2B customers will not be further discussed in this Decision.
  extraction_method: pdf_extracted
