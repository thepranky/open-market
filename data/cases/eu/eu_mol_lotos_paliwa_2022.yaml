- passage_id: sp_13
  source_document_id: eu_mol_lotos_paliwa_2022_decision
  page: '7'
  quote_snippet: (34) For the purpose of this decision, the Commission considers that the market
    for the retail sale of motor fuels to B2C customers in Poland is national in scope with
    local elements of competition. Given the absence of affected markets at national level,
    the Commission will in this decision only assess competition at the local level. To do so,
    it will examine local areas where the Parties’ stations overlap, using isochrones based
    on driving distances of 2.5 km, 5 km and 20 km in cities, suburban areas and rural areas
    respectively.
  extraction_method: pdf_extracted
  review_status: unreviewed
