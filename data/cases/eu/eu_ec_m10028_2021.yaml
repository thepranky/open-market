  source_document_id: eu_ec_m10028_2021_decision
  page: '9'
  quote_snippet: In line with its past decisional practice for SMCs and BMCs, the Commission
    finds, for the purposes of the assessment of the Transaction, the geographic market for
    thermoset moulding compounds (and sub-segments thereof) to be at least EEA-wide.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
