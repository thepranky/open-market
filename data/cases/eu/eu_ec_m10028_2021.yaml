  source_document_id: eu_ec_m10028_2021_decision
  page: '8'
  quote_snippet: The Commission’s market investigation did not provide any elements that would
    warrant a departure from its past decisional practice. Thus, the Commission finds that the
    relevant geographic market for the production and sale of UPR is EEA-wide in scope.
  extraction_method: pdf_extracted
