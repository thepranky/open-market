- passage_id: sp_9
  source_document_id: eu_ec_m10028_2021_decision
  page: '8'
  quote_snippet: As for BMCs and SMCs, in M.8059 – Investindustrial / Black Diamond / Polynt/
    Reichhold, the Commission found the relevant geographic market to be EEA-wide, due to product
    supplies taking place across the EEA, relatively low transport costs and the fact that customers
    explained that sourcing outside the EEA was not considered a suitable option. In the absence
    of competition concerns, the exact scope of the geographic market was left open.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
