  page: '9'
  quote_snippet: However, the precise definition of the relevant geographic market, i.e. whether
    it is EEA-wide or wider (e.g. worldwide) in scope, can be left open, as the Transaction
    does not raise serious doubts as to its compatibility with the internal market under any
    plausible market definition.
