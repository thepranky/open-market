product_markets_considered:
- market_id: pm_1
  name: Retail Measurement Services (RMS)
  definition_status: defined
  notes: The Commission confirmed that market research services should be segmented into separate
    markets for RMS, CPS, and CMR.
- market_id: pm_2
  name: Consumer Panel Services (CPS)
  definition_status: defined
  notes: The Commission confirmed that market research services should be segmented into separate
    markets for RMS, CPS, and CMR.
- market_id: pm_3
  name: Customized Market Research (CMR)
  definition_status: defined
  notes: The Commission confirmed that market research services should be segmented into separate
    markets for RMS, CPS, and CMR. The exact geographic market definition for CMR was left open
    as the Transaction did not give rise to affected markets in relation to CMR.
- market_id: pm_4
  name: RMS for fast-moving consumer goods (FMCG)
  definition_status: defined
  notes: The Commission considers that RMS for FMCG and RMS for NFMCG belong to separate product
    markets.
- market_id: pm_5
  name: RMS for non-fast moving consumer goods (NFMCG)
  definition_status: defined
  notes: The Commission considers that RMS for FMCG and RMS for NFMCG belong to separate product
    markets.
- market_id: pm_6
  name: Multi-country CPS to multinational customers
  definition_status: considered
  notes: The Commission left open whether this constitutes a separate market, but for the purpose
    of the decision, it considered this potential market to cover CPS contracts that cover at
    least Germany, France, Italy, and Spain.
geographic_markets_considered:
- market_id: gm_1
  name: RMS — national (EEA affected)
  definition_status: considered
