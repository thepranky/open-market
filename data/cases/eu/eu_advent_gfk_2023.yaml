- passage_id: sp_77
  source_document_id: eu_advent_gfk_2023_decision
  page: '10'
  quote_snippet: 'The Commission will assess the possible effects of the Transaction on the
    affected markets, and in particular: [...] The conglomerate relationship between NIQ’s activities
    in FMCG RMS across Member States on the one side, and NIQ’s and GfK’s activities in CPS
    across Member States on the other side, and in particular the Merged Entity’s ability and
    incentive post-Transaction to foreclose its main rivals in the markets for FMCG RMS and
    CPS (Circana and Kantar) in Denmark, France, Germany, Greece, Italy, the Netherlands, Portugal
    and Spain, by bundling FMCG RMS and CPS within one Member State and across Member States.'
