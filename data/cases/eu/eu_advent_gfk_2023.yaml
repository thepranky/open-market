  quote_snippet: The exact geographic perimeter of such multi-country contracts and framework
    agreements concluded between multinational customers and CPS providers varies and depends
    on the specific needs of each customer. However, according to the data provided by the Parties,
    a significant part of CPS customers, both in terms of numbers and revenues generated, purchase
    CPS data across multiple EEA Member States, typically including at least the largest EEA
    markets, namely France, Germany, Italy and Spain.
