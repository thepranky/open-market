- passage_id: sp_24
  source_document_id: eu_partners_group_forterro_2022_decision
  page: '6'
  quote_snippet: '(25) In light of the above, the Commission considers that the results of the
    market investigation do not justify a departure from its previous conclusions regarding
    the geographic scope of the relevant market. In any event, it can be left open whether the
    geographic scope of the market should be defined as EEA or worldwide for EAS and its segments,
    or national, EEA or worldwide for ERP software and its sub-segments, as the Transaction
    does not raise serious doubts as to its compatibility with the internal market under any
    plausible geographic market definition. For the purpose of this Decision, the Commission
    has thus examined: (i) the EEA and worldwide level for the EAS and its segments; and (ii)
    the national, EEA and worldwide level for the ERP software and its sub-segments.'
