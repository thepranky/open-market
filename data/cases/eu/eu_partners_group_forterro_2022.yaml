- passage_id: sp_6
  source_document_id: eu_partners_group_forterro_2022_decision
  page: '5'
  quote_snippet: '(21) In light of the above, the Commission considers that the question of
    whether the market for the supply of ERP software should be further segmented based on functionality
    to HCM, FMS and EPM software, and whether each of these ERP sub-segments can be divided
    between high-function and mid-market solutions, can be left open, as the Transaction does
    not raise serious doubts as to its compatibility with the internal market under any plausible
    product market definition. For the purpose of this Decision, the Commission has thus examined:
    (i) the overall ERP software market; and (ii) each ERP sub-segment per functionality (HCM,
    FMS and EPM) separately, each potentially divided between high-function and mid-market solutions.'
  extraction_method: pdf_extracted
  review_status: unreviewed
