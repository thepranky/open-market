  source_document_id: eu_partners_group_forterro_2022_decision
  page: '4'
  quote_snippet: '(16) Within a market for the supply of ERP software, the Commission has previously
    considered, but ultimately left open, segments based on functionality: HCM software, FMS
    software and enterprise project management (“EPM”) software.9 The Commission finally considered
    whether each of these three ERP sub-segments can be divided between high-function solutions
    and mid-market solutions.10'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
