product_markets_considered:
- market_id: pm_1
  name: Enterprise application software (EAS)
  definition_status: considered
  notes: The Commission's assessment, supported by market investigation, aligns with previous
    decisions on EAS and its segments.
- market_id: pm_2
  name: ERP software
  definition_status: left_open
  notes: The Commission left open the question of whether the ERP software market should be
    further segmented by functionality (HCM, FMS, EPM) and whether these sub-segments should
    be divided into high-function and mid-market solutions. For its assessment, the Commission
    examined the overall ERP market and each potential sub-segment separately.
- market_id: pm_3
  name: HCM software
  definition_status: left_open
  notes: HCM software is considered a potential sub-segment of ERP software. The Commission
    left open whether this sub-segment should be further divided into high-function and mid-market
    solutions, but examined these possibilities for the purpose of the decision.
- market_id: pm_4
  name: FMS software
  definition_status: left_open
  notes: FMS software is considered a potential sub-segment of ERP software. The Commission
    left open whether this sub-segment should be further divided into high-function and mid-market
    solutions, but examined these possibilities for the purpose of the decision.
- market_id: pm_5
  name: EPM software
  definition_status: left_open
  notes: EPM software is considered a potential sub-segment of ERP software. The Commission
    left open whether this sub-segment should be further divided into high-function and mid-market
    solutions, but examined these possibilities for the purpose of the decision.
- market_id: pm_6
  name: BA software
  definition_status: considered
  notes: BA software is considered a segment of EAS, consistent with past decisions and supported
    by market investigation respondents.
- market_id: pm_7
  name: Content services
  definition_status: considered
  notes: Content services is recognized as an EAS segment by Gartner and is where the Parties'
    activities overlap.
- market_id: pm_8
  name: Infrastructure software
  definition_status: considered
  notes: Categorized as business software in previous decisions, distinct from application software.
    While market investigation respondents found this distinction accurate, it is not a market
    formally assessed for competitive effects in this decision.
- market_id: pm_9
  name: Application software
  definition_status: considered
  notes: Categorized as business software in previous decisions, distinct from infrastructure
    software. While market investigation respondents found this distinction accurate, it is
    not a market formally assessed for competitive effects in this decision.
geographic_markets_considered:
- market_id: gm_1
  name: EAS and its segments — EEA-wide
  definition_status: left_open
  notes: The Commission noted previous decisions considered markets for EAS and its segments
    to be at least EEA-wide or worldwide. Market investigation respondents largely supported
    this view. The Commission ultimately left the geographic scope open, assessing both EEA
    and worldwide levels.
- market_id: gm_2
  name: EAS and its segments — worldwide
  definition_status: left_open
  notes: The Commission noted previous decisions considered markets for EAS and its segments
    to be at least EEA-wide or worldwide. Market investigation respondents largely supported
    this view. The Commission ultimately left the geographic scope open, assessing both EEA
    and worldwide levels.
- market_id: gm_3
  name: ERP software and its sub-segments — national (Poland affected)
  definition_status: left_open
  notes: The Commission noted that affected markets arose only in Poland and focused its investigation
    there. While previous decisions considered at least EEA-wide scope for ERP and its sub-segments,
    one respondent indicated a national scope, particularly for HCM software, due to localization
    requirements. The Commission left the geographic scope open, assessing national, EEA, and
    worldwide levels.
- market_id: gm_4
  name: ERP software and its sub-segments — EEA-wide
  definition_status: left_open
  notes: The Commission previously found the scope for ERP software and its sub-segments to
    be at least EEA-wide or worldwide. Market investigation did not justify a departure from
    this. The Commission left the geographic scope open, assessing national, EEA, and worldwide
    levels.
- market_id: gm_5
  name: ERP software and its sub-segments — worldwide
  definition_status: left_open
  notes: The Commission previously found the scope for ERP software and its sub-segments to
    be at least EEA-wide or worldwide. Market investigation did not justify a departure from
    this. The Commission left the geographic scope open, assessing national, EEA, and worldwide
    levels.
