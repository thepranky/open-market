product_markets_considered:
- market_id: pm_1
  name: Supply of uranium concentrate
  definition_status: considered
  notes: The Commission considered for the purposes of this Decision that there is a market
    for the supply of uranium concentrate which encompasses all ancillary activities such as
    exploration, mining and milling. The question of whether segmentation between primary and
    secondary supply is warranted was left open, as the Transaction did not raise serious doubts
    under the narrowest plausible market definition (separate primary and secondary supply markets).
- market_id: pm_2
  name: Services to convert uranium concentrate to UF6
  definition_status: segmented
  notes: The Commission concluded that there is a market for conversion of uranium concentrate
    into UF6 which does not include conversion of uranium concentrate into UO2, and includes
    both primary and secondary sources. The question of whether RepU conversion into UF6 and
    conversion of uranium concentrate into UF6 are part of the same product market or belong
    to separate product markets was left open.
- market_id: pm_3
  name: Manufacture and supply of FAs for HWRs
  definition_status: defined
  notes: The Commission concluded that there is a separate market for the manufacture and supply
    of FAs for HWRs, distinct from FAs for LWRs.
- market_id: pm_4
  name: Manufacture and supply of FAs for LWRs
  definition_status: defined
  notes: The Commission concluded that there is a separate market for the manufacture and supply
    of FAs for LWRs, distinct from FAs for HWRs, and that this market should be segmented between
    FAs for PWRs and BWRs.
- market_id: pm_5
  name: Manufacture and supply of FAs for PWRs
  definition_status: segmented
  notes: The Commission concluded that FAs for PWRs and BWRs constitute different product markets
    within the LWR segment. The question of whether the market for FAs for PWRs should be further
    segmented into separate markets for FAs for VVERs and for non-VVER PWRs was left open.
- market_id: pm_6
  name: Manufacture and supply of FAs for BWRs
  definition_status: defined
  notes: The Commission concluded that FAs for BWRs and PWRs constitute different product markets
    within the LWR segment.
geographic_markets_considered:
- market_id: gm_1
  name: Supply of uranium concentrate — worldwide
  definition_status: left_open
  notes: The Commission concluded that the market for the supply of uranium concentrate is worldwide,
    but considered that it can be left open whether Russian and/or Chinese suppliers are excluded
    in that market.
- market_id: gm_2
  name: Services to convert uranium concentrate to UF6 — worldwide
  definition_status: left_open
  notes: The Commission considered that it can be left open whether the geographic scope of
    the market for the conversion of uranium concentrate into UF6 is worldwide, or whether it
    is worldwide but excluding Russian and/or Chinese conversion suppliers.
- market_id: gm_3
  name: Manufacture and supply of FAs — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission considered that it can be left open whether the geographic scope of
    the markets for the manufacture and supply of FAs is EEA-wide, EEA and the UK, or worldwide,
    and whether Russian and/or Chinese suppliers are excluded from the worldwide market. However,
    for the competitive assessment, the Commission used separate EEA-wide markets for PWRs and
    BWRs.
- market_id: gm_4
  name: Manufacture and supply of FAs for PWRs — EEA-wide
  definition_status: considered
  notes: For the purposes of its assessment, the Commission considered separate EEA-wide markets
    for the manufacture and supply of FAs for PWRs and BWRs.
- market_id: gm_5
  name: Manufacture and supply of FAs for BWRs — EEA-wide
  definition_status: considered
  notes: For the purposes of its assessment, the Commission considered separate EEA-wide markets
    for the manufacture and supply of FAs for PWRs and BWRs.
- market_id: gm_6
  name: Manufacture and supply of FAs for VVERs — EEA including supplies from Russia
  definition_status: considered
  notes: The Commission considered that the narrowest plausible market definition for the manufacture
    and supply of FAs for VVERs should entail the EEA including supplies from Russia, due to
    historic exclusive supply relationships with Russian suppliers.
