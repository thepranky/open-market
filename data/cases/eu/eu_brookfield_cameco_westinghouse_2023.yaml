  source_document_id: eu_brookfield_cameco_westinghouse_2023_decision
  page: '11'
  quote_snippet: Based on the above, the Commission considers, in line with the Commission’s
    precedents and for the purposes of this Decision, that there is a market for the supply
    of uranium concentrate which encompasses all ancillary activities such as exploration, mining
    and milling. Furthermore, the Commission considers that the market for the supply of uranium
    concentrate is likely to consist of both primary and secondary supply but that whether any
    such segmentation is warranted can be left open as the Transaction does not raise serious
    doubts as to its compatibility with the internal market or the functioning of the EEA Agreement
    even under the narrowest plausible market definition, i.e., separate markets for the primary
    supply of uranium concentrate and for the secondary supply of uranium concentrate.
  extraction_method: pdf_extracted
