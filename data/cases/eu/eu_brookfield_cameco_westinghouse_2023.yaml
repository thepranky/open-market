  page: '17'
  quote_snippet: Based on the above, the Commission concludes that there are separate markets
    for the manufacture and supply of FAs for HWRs and for LWRs, and that the market for the
    manufacture and supply of FAs for LWRs should be segmented between FAs for PWRs and BWRs.
    The Commission considers that it can be left open whether the market for the manufacture
    and supply of FAs for PWRs should be further segmented into separate markets for FAs for
    VVERs and for non-VVER PWRs as the Transaction does not raise serious doubts as to its compatibility
    with the internal market or the functioning of the EEA Agreement even under the narrowest
    plausible market definition, i.e., distinct markets for the manufacture and supply of FAs
    for VVERs and the manufacture and supply of FAs for non-VVER PWRs.
