- passage_id: sp_4
  source_document_id: eu_brookfield_cameco_westinghouse_2023_decision
  page: '15'
  quote_snippet: Based on the above, the Commission concludes that, in line with the Commission’s
    prior decisions, there is a market for conversion of uranium concentrate into UF6 which
    does not include conversion of uranium concentrate into UO2. The Commission considers for
    the purposes of this Decision a market for conversion of uranium concentrate into UF6 including
    both primary and secondary sources. The question of whether RepU conversion into UF6 and
    conversion of uranium concentrate into UF6 are part of the same product market or belong
    to separate product markets can be left open, as the Transaction does not raise serious
    doubts as to its compatibility with the internal market or the functioning of the EEA Agreement
    under any plausible product markets, including in a potential market for the conversion
    of uranium concentrate into UF6 which includes RepU conversion into UF6. For the purposes
    of this Decision, the Commission will conduct its competitive assessment under both plausible
    product markets (i.e., conversion of uranium concentrate into UF6 excluding RepU conversion
    into UF6 and conversion of uranium concentrate into UF6 including RepU conversion into UF6).
  extraction_method: pdf_extracted
