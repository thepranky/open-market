case_id: eu_bayer_monsanto_2018
case_name: Bayer / Monsanto
authority: European Commission
jurisdiction: EU
sector: agriculture / agrochemicals / seeds / pesticides / digital agriculture
outcome: cleared_with_conditions
decision_date: '2018-03-21'
parties:
- name: Bayer AG
  role: acquirer
- name: Monsanto Company
  role: target
source_documents:
- doc_id: eu_bayer_monsanto_decision
  title: 'Case M.8084 – Bayer / Monsanto: Commission Decision (Article 8(2))'
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.8084
  pdf_url: https://ec.europa.eu/competition/mergers/cases1/202150/M_8084_8063752_13335_9.pdf
  doc_type: decision
  authority_reference: M.8084
  retrieval_status: direct
  published_date: '2018-03-21'
product_markets_considered:
- market_id: pm_1
  name: Licensing and commercialisation of vegetable seeds (per crop)
  definition_status: considered
  notes: |
    The Commission concluded, for the purposes of assessing the Transaction, that: (1) the relevant product market includes both licensing and commercialisation of vegetable seeds (rejecting a separate licensing market); (2) each vegetable crop constitutes a separate product market; and (3) competitive assessment should be made at segment/variety level within each crop, using the Parties' proposed segmentation (growing environment, seed type, use, rootstock, features). Definition is 'considered' rather than 'defined' because the Commission used cautious 'for the purposes of assessing the Transaction' language throughout and explicitly noted it was without prejudice to future cases.
- market_id: pm_2
  name: Vegetable seeds
  definition_status: discussed
  notes: |
    Draft artifact — the Commission discussed the vegetable seeds sector but never defined a single "vegetable seeds" product market. The formal product market definition is at the individual crop level (see pm_1: "per crop"). The Commission explicitly assessed competitive effects at crop/segment/variety level (recitals 317-340, pp.63-67). This aggregate entry is retained for context but does not represent a separately defined market in the decision.
- market_id: pm_3
  name: Microbial crop efficiency products (biostimulants and biofertilisers)
  definition_status: left_open
  notes: |
    Commission explicitly left the product market definition open: "the Commission considers that, for the purpose of this decision, the product market definition for microbial crop efficiency products can be left open since the Transaction does not give rise to concerns about its compatibility" (recital 2333, p.656). Commission agreed with Notifying Party that microbial crop efficiency products appear to be in a separate product market to crop protection products, but no formal delineation was needed given no competitive concerns arose.
- market_id: pm_4
  name: |
    Upstream market for the licensing of germplasm for the purposes of breeding new OSR varieties
  definition_status: defined
  notes: |
    Commission concluded this is a distinct upstream product market, separate from the licensing of OSR varieties for commercialisation. However, the Commission focused its substantive assessment on the downstream commercialisation market, noting the parties' licensing revenues were modest.
- market_id: pm_5
  name: |
    Upstream market for the licensing of OSR varieties for the purposes of commercialisation
  definition_status: defined
  notes: |
    Commission defined this as a distinct upstream product market (licensing of hybrids for commercialisation, as opposed to germplasm licensing for breeding). However, substantive competitive assessment was focused on the downstream market.
- market_id: pm_6
  name: Downstream market for the commercialisation of wheat seeds
  definition_status: left_open
  notes: |
    The Commission considers the downstream commercialisation market as the more appropriate locus for assessing competitive effects. However, the precise dimension of the downstream product market is explicitly left open as the Transaction does not raise serious doubts under any plausible alternative definition (hybrid vs open pollinated varieties). Neither party is active in the commercialisation of wheat seeds in the EU; both are assessed as potential entrants.
- market_id: pm_7
  name: Agricultural non-selective herbicides (NSH) for perennial crops
  definition_status: defined
  notes: |
    Commission concluded that NSH form a separate relevant product market from selective herbicides and should be further divided by crop groupings, with perennial crops separated from non-perennial crops. The relevant product market is NSH for perennial crops. Commission also assessed the alternative broader definition of all-crops NSH. Parties overlap materially only in the perennial crops segment in the EEA.
- market_id: pm_8
  name: |
    Agricultural non-selective herbicides (NSH) for all crops (alternative/broader definition)
  definition_status: considered
  notes: |
    Commission noted it assesses the alternative broader definition of NSH for all crops where relevant, but the primary conclusion is that NSH for perennial crops is the core relevant market. The broader definition was assessed as an alternative given the Commission's finding that concerns would arise under either definition.
- market_id: pm_9
  name: Selective herbicides
  definition_status: defined
  notes: |
    Commission confirmed selective herbicides form a separate relevant product market from NSH. Monsanto has no sales of selective herbicides in the EEA, so there is no overlap between the Parties in the EEA. The market was addressed primarily to exclude it from the NSH analysis.
- market_id: pm_10
  name: |
    Upstream market for licensing of cotton varieties for production and sale (but not breeding)
  definition_status: considered
  notes: |
    The Notifying Party proposed two separate product markets in the cotton seed value chain: (i) upstream licensing and (ii) downstream commercialisation. The Commission notes the only relevant overlap arises in the upstream licensing market. The Commission does not explicitly conclude on a formal definition in the supplied text but adopts this framing for assessing the Transaction.
- market_id: pm_11
  name: Industrial vegetation management (IVM) non-selective herbicides (NSH)
  definition_status: considered
  notes: |
    The Commission concludes that IVM NSH products and turf and ornamental NSH products form separate relevant product markets. Within IVM, the Commission further segments: brush killers, railway applications, and a combined post-emergent/pre-post-emergent market (and separately pre-emergent). The Commission adopts this segmentation framework for assessing the Transaction.
- market_id: pm_12
  name: Turf and ornamentals non-selective herbicides (NSH)
  definition_status: considered
  notes: |
    The Commission concludes that turf and ornamental NSH products form a separate relevant product market from IVM NSH. This is consistent with Commission precedents. The supplied text does not contain a detailed competitive assessment of this market.
- market_id: pm_13
  name: IVM NSH – Brush killers
  definition_status: considered
  notes: |
    Within IVM, the Commission considers brush killers to constitute a separate relevant product market. This sub-segment addresses particularly tough weeds.
- market_id: pm_14
  name: IVM NSH – NSH and services for weed management in railways
  definition_status: considered
  notes: |
    Within IVM, the Commission considers railway NSH and services to constitute a separate relevant product market. This segment involves NSH often offered in combination with application services and in the context of tenders.
- market_id: pm_15
  name: IVM NSH – Post-emergent and pre-post-emergent products (combined market)
  definition_status: considered
  notes: |
    The Commission considers that post-emergent and pre-post-emergent IVM NSH products form a combined relevant product market (one of the two groupings within IVM excluding brush killers and railway services). The Commission also assesses under alternative definitions of post-emergent alone and all IVM products.
- market_id: pm_16
  name: Licensing of cotton seed varieties for production and sale
  definition_status: considered
  notes: |
    The Commission considered the relevant product market to be the licensing of cotton seed varieties for production and sale. It noted a further upstream market (licensing of germplasm/parental lines for breeding) could be distinguished but concluded that, for the purposes of assessing the Transaction, the relevant market is the licensing of cotton seed varieties for production and sale. The Notifying Party also referenced a downstream commercialisation market, but the Commission's competitive analysis focuses on the upstream licensing market.
- market_id: pm_17
  name: Trait discoveries licensing layer (innovation space)
  definition_status: left_open
  notes: |
    The Commission explicitly determined that the trait discoveries licensing layer does NOT constitute a separate product market but is rather an 'innovation space'. Formal product market definition was not provided for this layer; instead, innovation spaces related to trait research and early development are defined elsewhere in the decision.
- market_id: pm_18
  name: Single traits licensing (per crop and functionality)
  definition_status: defined
  notes: |
    The Commission concluded that the product market for single trait licensing is to be defined as no wider than a combination of crop and functionality (e.g. insect resistant traits for soy, or traits resistant to non-selective herbicides for canola). IR traits are further sub-segmented by insect family (Lepidoptera vs. Coleoptera). This is the second layer of the trait value chain.
- market_id: pm_19
  name: Stack licensing (per crop)
  definition_status: defined
  notes: |
    The Commission concluded that the relevant product market for stacks is to be defined as no wider than per crop (e.g. stacks for soybean or stacks for cotton). Segmentation by functionality is not appropriate for stacks; only segmentation by crop applies. This is the third layer of the trait value chain.
- market_id: pm_20
  name: Seeds markets (distinct from traits)
  definition_status: considered
  notes: |
    The Commission confirmed via market investigation that seed breeding and commercialisation are separate product markets from those of traits. This is referenced as background context to the trait market definitions, not as the primary market being defined in these chunks.
- market_id: pm_21
  name: |
    Single trait licensing – insect resistant (IR) traits, segmented by crop and insect family (Lepidoptera / Coleoptera)
  definition_status: defined
  notes: |
    The Commission concludes that the relevant product market for single trait licensing is defined as no wider than a combination of crop and functionality. For IR traits, a further sub-segmentation by insect family (Lepidoptera IR vs Coleoptera IR) is also defined. This flows from demand-side non-substitutability between traits targeting different insects.
- market_id: pm_22
  name: Single trait licensing – herbicide tolerant (HT) traits, segmented by crop
  definition_status: defined
  notes: |
    The Commission defines the relevant product market for HT single traits as no wider than a combination of crop and functionality (HT). Sub-segmentation by specific herbicide or mode of action is explicitly rejected due to demand-side substitutability between HT traits conferring tolerance to different herbicides.
- market_id: pm_23
  name: Stacks licensing, segmented by crop
  definition_status: defined
  notes: |
    The Commission defines the relevant product market for stacks licensing as no wider than per crop (e.g. stacks for soybean or stacks for cotton). Segmentation by functionality is not appropriate for stacks because stacks can combine traits of different functionalities.
- market_id: pm_24
  name: Trait discoveries licensing
  definition_status: left_open
  notes: |
    The Commission identifies three market layers for traits but expressly states that a relevant product market is NOT defined for the trait discoveries licensing layer because the activities are more pertinent to research and early development. Discussed in a separate section (X.1.7.1).
- market_id: pm_25
  name: |
    Single traits licensing — HT traits (by crop and herbicide tolerance functionality)
  definition_status: defined
  notes: |
    The Commission defined separate relevant product markets in the single traits licensing layer by specific functionality (tolerance to a specific herbicide) and specific crop. Further sub-segmentation by herbicide/mode of action was considered but rejected for HT traits, though sub-segments are discussed in the competitive assessment. The Commission concluded that HT traits should not be defined more narrowly by different herbicides or modes of action.
- market_id: pm_26
  name: |
    HT Systems (herbicide-tolerant crop systems combining HT traits and corresponding herbicides, per crop)
  definition_status: defined
  notes: |
    The Commission defined a relevant product market for HT Systems (combining HT traits in crops and the corresponding herbicides) on a crop-specific basis. The Commission considered but rejected further segmentation solely by AI/herbicide. The market encompasses both GM and non-GM systems for a given crop competing in a differentiated relevant product market. Innovation spaces cover both across-crops and per-crop dimensions.
- market_id: pm_27
  name: Non-agricultural NSH – IVM (Industrial Vegetation Management)
  definition_status: considered
  notes: |
    The Commission considers that non-agricultural NSH should be segmented between (i) IVM and (ii) turf and ornamentals as separate relevant product markets. Within IVM, further segmentation is applied: brush killers and railway applications are each considered separate relevant product markets, and pre-emergent/pre-post-emergent products are grouped together as one market while post-emergent/pre-post-emergent products form another.
- market_id: pm_28
  name: Non-agricultural NSH – Turf and Ornamentals
  definition_status: considered
  notes: |
    The Commission considers turf and ornamental NSH products form a separate relevant product market from IVM NSH products.
- market_id: pm_29
  name: IVM NSH – Railway Applications (weed management in railways)
  definition_status: considered
  notes: |
    Within IVM, the Commission considers that NSH and services for weed management in railways constitute a separate relevant product market.
- market_id: pm_30
  name: Innovation spaces in crop protection (NSH)
  definition_status: considered
  notes: |
    The Commission discusses innovation spaces as the relevant analytical framework for assessing innovation competition in the crop protection industry, drawing on the Dow/DuPont precedent. The Commission clarifies that innovation spaces are not markets in their own right but input activities upstream of downstream product markets. The geographic scope of these spaces is stated to be generally global or at least regional (EEA level). The Commission performs formal analysis of how innovation spaces should be defined, referencing discovery concepts, lead crops, lead pests, and profitability calculations as defining criteria. However, the supplied chunk covers only the definitional framework section (1.4.1.1) and does not contain the Commission's final conclusions on specific individual innovation spaces.
- market_id: pm_31
  name: Seed treatment (general) — separate from other crop protection products
  definition_status: discussed
  notes: |
    Commission precedents established seed treatment as a separate product market from other crop protection products. This precedent-level finding is referenced and adopted in this decision as the starting point for further segmentation analysis.
- market_id: pm_32
  name: Nematicidal seed treatment (by crop)
  definition_status: defined
  notes: |
    Commission concludes that nematicidal seed treatment constitutes an additional segment beyond fungicidal and insecticidal, on a crop-by-crop basis. Commission does not further segment into biological vs. chemical nematicidal seed treatments. The relevant product market is seed treatment for nematode control on a crop-by-crop basis.
- market_id: pm_33
  name: |
    Insecticidal seed treatment (including question of in-furrow granular insecticides)
  definition_status: left_open
  notes: |
    Commission takes the view that in-furrow granules are not substitutable with insecticidal seed treatments (different sales channels and customers), consistent with precedents. However, exact market definition is left open since no competition concerns arise under any plausible definition. The market is noted to be further segmented on a crop/pest basis.
- market_id: pm_34
  name: Treated seeds (downstream market)
  definition_status: left_open
  notes: |
    Commission considers treated seeds constitute a separate market (distinguishing from untreated seeds), citing demand structure (demand comes from seed players who sell treated seed). However, exact definition is left open as no competition concerns arise under any plausible market definition, including or excluding untreated seeds.
- market_id: pm_35
  name: Foliar fungicides (segmented by crop/disease combination)
  definition_status: considered
  notes: |
    The Commission confirmed, based on its market investigation and most recent precedent (Dow/DuPont, M.7932), that fungicides should be segmented by crop/disease combination. Prior precedents also considered segmentation by mode of action (e.g. strobilurin-based vs. non-strobilurin-based) and by disease within a crop (e.g. wheat fungicides for powdery mildew, rusts, eyespot and septoria), but the Commission concluded these additional segmentations are not justified. The Notifying Party proposed analysis by plant type only and argued strobilurins merit a separate market, but the Commission did not adopt this view.
- market_id: pm_36
  name: Digitally-enabled prescriptions (digital agronomic advisory services)
  definition_status: considered
  notes: |
    The Commission assessed the product market for digitally-enabled prescriptions as part of the digital agriculture section. The text in chunk_290 references a product market segmentation by input product and crop groupings, and proceeds to assess the geographic scope. The product market definition conclusion itself is not fully reproduced in the supplied chunks (the geographic market assessment chunk references it), but the Commission treated this as a distinct assessed market. Segmentation by input product (e.g. fungicides, herbicides, insecticides, fertilizers, seeds) and by crop groupings was discussed.
- market_id: pm_37
  name: Fungicides (by crop/disease)
  definition_status: considered
  notes: |
    The Commission confirmed segmentation by crop/disease combination, in line with its most recent precedent (Dow/DuPont). The question of whether a separate market for strobilurin-based fungicides is warranted was implicitly addressed but not resolved separately. The Commission adopted crop/disease as the working basis for its competitive assessment.
- market_id: pm_38
  name: Fungicides — chemical vs. biological segmentation
  definition_status: left_open
  notes: |
    The Commission investigated whether biological and chemical fungicides constitute separate product markets but left the question open, finding no concerns under any plausible market definition. The Notifying Party argued they are separate markets due to limitations of biocontrol products.
- market_id: pm_39
  name: Biological vs. chemical crop protection products (insecticides)
  definition_status: discussed
  notes: |
    The Notifying Party argued that biological and chemical crop protection products would not be part of the same product markets, citing limitations of biocontrol products. The Notifying Party also noted that the same product markets applicable to conventional chemical crop protection apply to biological crop protection, with separate markets for biofertilisers and biostimulants. No Commission conclusion on this segmentation is provided in the supplied text.
- market_id: pm_40
  name: Insecticides (segmented by crop/pest)
  definition_status: considered
  notes: |
    The Commission, in line with its precedents (Dow/DuPont, ChemChina/Syngenta), concluded that insecticides should be segmented by crop/pest. The further segmentation between biological and chemical crop protection products was left open as it would not change the outcome under any plausible market definition. The Commission carried out its competitive assessment on a crop/pest basis 'for the purpose of this decision'.
- market_id: pm_41
  name: Insecticides – biological vs. chemical segmentation
  definition_status: left_open
  notes: |
    The Notifying Party argued that biological and chemical crop protection products do not belong to the same product market. The market investigation indicated they should not be separately segmented. The Commission left this question open as the Transaction does not give rise to concerns under any plausible market definition.
- market_id: pm_42
  name: Bee health products targeting varroa mites
  definition_status: defined
  notes: |
    The Commission concluded there is a separate, defined product market for products targeting and controlling varroa mite infestations of bee colonies. Further segmentation between biological and chemical products, or by active ingredient/mode of action/administration, was investigated but found not justified. The Commission confirmed biological and chemical products compete and are part of the same market.
- market_id: pm_43
  name: Provision of digitally-enabled prescriptions
  definition_status: considered
  notes: |
    The Commission defines digitally-enabled prescriptions as a distinct product market for the purposes of this Decision, noting they are different from traditional non-digital agronomic advice. The Commission further considers segmentation by input type (e.g. herbicides, fungicides, seeds) and by crop grouping (e.g. broad acre crops). The Commission adopts the market basis with explicit 'for the purpose of this Decision' language, making this 'considered' rather than 'defined'. Segmentation by input type and crop grouping is considered but not fully resolved.
- market_id: pm_44
  name: |
    Provision of agronomic advisory and support services (broad market including digital and non-digital)
  definition_status: discussed
  notes: |
    This is the Notifying Party's proposed broad market definition, encompassing all providers of agronomic advisory services to farmers whether via digital or non-digital means. The Commission did not adopt this definition. UK OFT precedents are referenced. The Commission instead adopted a narrower focus on digitally-enabled prescriptions.
- market_id: pm_45
  name: 'Innovation space: Canola – Quality Traits'
  definition_status: considered
  notes: |
    The Commission uses patent share analysis to assess overlapping innovation activities between Bayer and Monsanto in canola quality traits. Combined patent share of [50-60]% with HHI of [5000-5500] reported. No formal product market definition concluded; analysis conducted as innovation space assessment.
- market_id: pm_46
  name: 'Innovation space: Cotton – Enabling Technologies'
  definition_status: considered
  notes: |
    Very high combined patent share ([90-100]%) with HHI [8500-9000] reported. Commission notes that no innovation concern was raised for this space despite high combined patent share.
- market_id: pm_47
  name: 'Innovation space: Fruit/Vegetables – Crop Efficiency'
  definition_status: considered
  notes: |
    Combined patent share [50-60]% to [60-70]% depending on classification; HHI [3500-4500]. Monsanto is the dominant innovator. Included in patent analysis summary Table 16.
- market_id: pm_48
  name: 'Innovation space: Not Crop Specific – Insect Control'
  definition_status: considered
  notes: |
    Combined patent share [40-50]% with HHI [3000-3500]; Big5 represent [90-100]%. Commission considered innovation concern here despite decreasing share after 2011.
- market_id: pm_49
  name: 'Innovation space: Soybean – Weed Control'
  definition_status: considered
  notes: |
    Monsanto leads with [60-70]% patent share; combined share [70-80]%; HHI [5000-5500] to [5500-6000]. Part of HT weed control innovation concern for soybean.
geographic_markets_considered:
- market_id: gm_1
  name: Geographic market for vegetable seeds
  definition_status: discussed
  notes: |
    Draft artifact — the Commission discussed geographic scope for vegetable seeds (pp.63-66, section 5.2) and reviewed precedents pointing to national markets per crop, but never defined a single aggregate "geographic market for vegetable seeds." The Commission's formal geographic assessment was at the crop/segment/country level: "price competition takes place at country/segment (variety) level" (recital 330). Individual crop-level geographic markets are assessed as national in the unit_assessment findings. This entry is retained for context.
- market_id: gm_2
  name: EU-wide market for licensing of cotton seed varieties for production and sale
  definition_status: considered
  notes: |
    The Commission considered the geographic scope of the licensing of cotton seed varieties for production and sale to be EU-wide, consistent with its decision-making practice on broad acre crop seeds (upstream licensing markets). The Notifying Party agreed with an EEA-wide scope. The Commission concluded the scope is EU-wide for purposes of the Transaction assessment.
- market_id: gm_3
  name: EU-wide market for upstream licensing of wheat varieties
  definition_status: considered
  notes: |
    Commission references its prior decisions finding a Union-wide scope for the upstream licensing market for certain broad acre crop seeds. No formal independent assessment is conducted in this decision; the Commission adopts prior practice without deviation.
- market_id: gm_4
  name: National market for downstream commercialisation of wheat seeds
  definition_status: left_open
  notes: |
    Commission identifies national scope as the applicable geographic market for downstream commercialisation of wheat seeds based on prior practice, but explicitly leaves the precise geographic dimension open. The decision notes that the Transaction raises no serious doubts under any plausible alternative (national vs wider than national).
- market_id: gm_5
  name: Trait discovery, trait development and stack development – global
  definition_status: defined
  notes: |
    The Commission concludes that the relevant geographic market for trait discovery, trait development and stack development is global. The Commission disagrees with the Notifying Party's view that the geographic market is no broader than EEA-wide, noting that many trait licences have global scope or include more than EU countries. The Commission also rejects the argument that licensing scope defines the geographic market.
- market_id: gm_6
  name: Traits licensing (HT single traits / stacks) — geographic scope
  definition_status: left_open
  notes: |
    The Notifying Party argued for an EEA-wide geographic market based on IP licence scope. Commission precedent (Limagrain/KWS/Genective 2013) found evidence the licensing market is wider than national but left the definition open. The Commission's own conclusion on geographic scope for traits (including the referenced Section X.1.5.4 on stacks) is not fully reproduced in the supplied chunks; the stacks geographic market is however referenced as 'global' in the HT Systems section.
- market_id: gm_7
  name: HT Systems — geographic market (global)
  definition_status: defined
  notes: |
    The Commission concluded that the geographic market for HT Systems is global, determined by reference to the geographic market for trait stacks. National herbicide registrations affect monetisation on a country-by-country basis but do not change the global scope of the market. No prior precedents existed for HT Systems geography. The Parties contested the global scope, arguing HT Systems are not relevant for the EEA due to GM cultivation restrictions.
- market_id: gm_8
  name: EEA – Non-agricultural NSH (IVM and sub-segments)
  definition_status: considered
  notes: |
    The Commission assessed affected markets in the EEA for non-agricultural NSH under various product market definitions. Specific EEA member states are identified as affected markets: Belgium, Denmark, France, the Netherlands, Spain and the United Kingdom under the all-IVM definition; and France, Spain and the United Kingdom even under a post-emergent-only definition. The geographic market definition (e.g. national vs. EEA-wide) is not formally concluded in the supplied text, but the analysis is conducted at EEA/national level.
- market_id: gm_9
  name: Global or regional (EEA) — innovation spaces in crop protection
  definition_status: considered
  notes: |
    The Commission states that innovation spaces are generally global or at least regional (e.g. EEA level), taking into account common features of broad geographic areas. This is described as a general principle for the geographic scope of innovation spaces rather than a formal conclusion on a specific geographic market.
- market_id: gm_10
  name: Seed treatment markets — national
  definition_status: considered
  notes: |
    Commission considered seed treatment product markets to be national in geographic scope for the purposes of this Transaction, based on prior precedent (ChemChina/Syngenta). The Notifying Party had argued the market could be EEA-wide or national and proposed leaving it open; the Commission adopted a national scope as its working basis.
- market_id: gm_11
  name: Market for digitally-enabled prescriptions — national
  definition_status: defined
  notes: |
    The Commission concluded that the market for the provision of digitally-enabled prescriptions is national in scope. This was based on market investigation responses from competitors and customers, internal party documents showing country-by-country market penetration, the need for local agronomic knowledge, language preferences, farming practices, government regulations, and algorithmic localisation requirements. The Commission did not have prior precedent on this market.
- market_id: gm_12
  name: Fungicides — national geographic markets
  definition_status: defined
  notes: |
    The Commission confirmed that crop protection product markets, including fungicides, are national in geographic scope, cross-referencing its general crop protection analysis in Section XI.1.2.2.
- market_id: gm_13
  name: Insecticides – national markets (EEA member states)
  definition_status: considered
  notes: |
    The Commission confirmed that crop protection product markets, including insecticides, are national in geographic scope, cross-referencing Section XI.1.2.2 of the decision.
- market_id: gm_14
  name: Innovation spaces in insecticides – geographic definition
  definition_status: left_open
  notes: |
    The Commission left open the geographic definition of innovation spaces in insecticides since no competition concerns arise under any plausible definition.
- market_id: gm_15
  name: Bee health products targeting varroa mites — national markets
  definition_status: defined
  notes: |
    Commission explicitly defined national scope: "the Commission considers that for the purpose of this decision, bee health product markets are national in their geographic scope" (recital 2389, p.668). This was based on the decentralised national authorisation procedure for bee health products (directive 2001/82/EC) and prior animal health precedents. The Notifying Party initially proposed leaving the geographic scope open, but the Commission reached a definitive conclusion.
theories_of_harm:
- theory_id: toh_1
  name: |
    Horizontal unilateral effects in Eggplant seeds – Long – Netted & Plastic House (Italy)
  theory_type: horizontal
  theory_outcome: upheld
  description: |
    The Commission found that the Transaction would likely cause a significant impediment to effective competition in Italy in the Long – Netted & Plastic House segment for eggplant seeds. The parties are identified as market leader with a combined share of [40-50]% and an increment of [10-20]%, in a highly concentrated market with only one sizeable competitor with comparable market share. The Commission also considers the parties to be important and close competitors across eggplant seeds segments. The notifying party argued: marginal overlap at segment level, low increment, significant remaining competitors, and declining combined market share in some countries; the Commission addressed these arguments in its assessment.
  verification:
    status: source_linked
  source_passage_refs:
  - sp_194
  - sp_195
  - sp_196
  - sp_197
- theory_id: toh_2
  name: |
    Elimination of close innovation competition in HT Systems — Transaction brings together the two leading innovators
  theory_type: innovation
  theory_outcome: upheld
  description: |
    The Commission finds that the Transaction brings together the two leading innovators in HT Systems. The Parties are the two most successful HT System providers, covering the broadest spectrum of weeds and best placed to treat resistant weeds. Until 2017, their HT Systems were essentially the only two on the market. The Commission concludes that the Parties' innovation projects are path-dependent and overlapping (working on the same chemistries for complementary HT layers), so the merger eliminates the principal competitive constraint each poses on the other's R&D. The Notifying Party did not make specific arguments on existing competition in HT Systems. Competitors (ChemChina-Syngenta, DowDuPont, BASF) are described as limited and emerging. The Commission declines to reach a separate conclusion on actual competition in HT Systems, treating it as mirroring the traits assessment, but expressly upholds the innovation competition concern.
