  page: '389'
  quote_snippet: |
    A merger between two innovators is likely to increase the cannibalisation effects. In fact, pre-merger if an innovator is successful in introducing a new product, even though this might cannibalise one or more of its existing products, nevertheless it will capture sales from its rivals and the possible related gross margin and profits. A merger between two potential innovators internalises this negative externality effect – from the perspective of each innovator, the lost expected profits on the products of the other merging firm becomes an additional cannibalisation effect. Following a merger, the additional cannibalisation effect leads to lower incentives to engage in aggressive innovation competition for each of the two merging firms.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
