  - sp_236
  - sp_237
  - sp_238
  - sp_239
- theory_id: toh_9
  name: |
    Monsanto's control of RoundupReady trait licensing restricts stacking competition
  theory_type: vertical
  theory_outcome: upheld
  description: |
    The Commission found that Monsanto's control over access to the RoundupReady (RR) trait and trademark, and its strategy of restricting stacking rights by licensees, limits competitive constraints from non-integrated trait developers. DuPont further noted that access to regulatory data packages is required for deregulating new trait stacks. The Commission acknowledged that cross-licensing occurs but stressed it is done at the discretion of the trait owner (Monsanto), who can restrict stacking rights.
  verification:
    status: source_linked
  source_passage_refs:
  - sp_240
  - sp_241
- theory_id: toh_10
  name: Elimination of innovation rivalry in non-GM HT Traits for wheat
  theory_type: innovation
  theory_outcome: upheld
  description: |
    The Commission found that the Transaction would likely cause a significant impediment to effective competition in relation to non-GM HT Traits innovation by eliminating an important and close competitive constraint between Bayer and Monsanto. The Commission dismissed the Parties' claims that there are numerous and diverse competitors developing gene editing capabilities, noting instead that only a very small number of competitors have the capabilities to develop non-GM HT wheat. The Commission also noted that the Parties' post-merger internal documents foresee significant reductions in R&D capabilities.
  verification:
    status: source_linked
