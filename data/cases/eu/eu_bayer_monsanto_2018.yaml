- unit_type: crop
  unit_label: Cotton stacks (HT/IR traits)
  findings:
  - finding_id: f_1
    finding_type: horizontal_overlap
    segment: HT only (glyphosate/glufosinate tolerant cotton stacks)
    geography: ''
    conclusion: discussed
    description: |
      Table 133 indicates that both Bayer and Monsanto have in their portfolio stacks where an HT glyphosate tolerant trait is the main foundation, and which are often stacked with IR Lep and other HT traits. The text identifies overlapping existing and forthcoming HT and HT+IR cotton stacks between the two parties.
    related_markets:
    - Cotton HT trait stacks
    - Cotton HT+IR trait stacks
    related_theories: []
    source_passage_refs:
    - sp_400
    - sp_401
    - sp_402
  - finding_id: f_2
    finding_type: horizontal_overlap
    segment: HT+IR (combined herbicide-tolerant and insect-resistant cotton stacks)
    geography: ''
    conclusion: discussed
    description: |
      Both Bayer and Monsanto have HT+IR stacked cotton products currently commercialised and forthcoming. Monsanto stacks include RoundupReady/Bollgard I and II (HT GLY + IR Lep) and RoundupReady Flex/Bollgard II/DGT (IR Lep + HT GLY + HT DCB + HT GLU); Bayer stacks include Liberty Link™ Bollgard II™ (HT GLU + IR Lep from MON) and GlyTol® LibertyLink® Genuity® Bollgard II® (HT GLY+GLU+Mon IR Lep).
    related_markets:
    - Cotton HT+IR trait stacks
    related_theories: []
    source_passage_refs:
    - sp_400
    - sp_401
    - sp_402
  - finding_id: f_3
    finding_type: horizontal_overlap
    segment: Dicamba / alternative HT cotton stacks (pipeline)
    geography: ''
    conclusion: discussed
    description: |
      In addition to Glyphosate and Glufosinate tolerant traits, Monsanto also stacks a Dicamba tolerant trait. Bayer complements its glyphosate tolerant trait (Glytol) with an HPPD (IFT) HT and DowDuPont with a 2,4-D tolerant trait. The text notes internal assessment of competitive relationships between the parties' stack roadmaps.
    related_markets:
    - Cotton HT trait stacks
    - Cotton pipeline stacks
    related_theories: []
    source_passage_refs:
    - sp_403
    - sp_404
