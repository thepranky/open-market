  - sp_228
  - sp_229
- theory_id: toh_7
  name: Horizontal effects — creation of dominant position in OSR HT market
  theory_type: horizontal
  theory_outcome: upheld
  description: |
    The Commission finds that the very high combined market shares ([90-100]%) in the OSR HT market (Monsanto [40-50]%, Bayer [50-60]%) would lead to the creation of a dominant position. This is a horizontal overlap finding in the OSR herbicide tolerance trait market.
  verification:
    status: source_linked
  source_passage_refs:
  - sp_230
  - sp_231
- theory_id: toh_8
  name: |
    Loss of innovation competition in trait R&D — elimination of two leading innovators
  theory_type: innovation
  theory_outcome: upheld
  description: |
    The Commission found that the Transaction would likely lower innovation in the trait market by bringing together two close competitors (Bayer and Monsanto) in a market with high barriers to entry. Both parties are identified as leading innovators in HT and IR traits. Monsanto is described as the industry standard-setter with a dominant position in key broad acre crop traits. Bayer is identified as a particularly active, successful and independent innovator, consistently investing above-average industry levels in seed/trait R&D (30-40% of seed sales). The Commission concluded the Transaction would result in a loss of innovation by eliminating an important competitor. The notifying parties argued Bayer would not be uniquely positioned and had a relatively insignificant position in corn and soy seeds/traits — the Commission rejected this. Third-party (DuPont) confirmed Monsanto's combination of traits and germplasm is de facto the industry standard. The integrated trait developers capable of bringing trait innovations to market are identified as Monsanto, Bayer, DowDuPont and ChemChina-Syngenta, limiting alternatives.
  verification:
    status: source_linked
  source_passage_refs:
  - sp_232
  - sp_233
  - sp_234
