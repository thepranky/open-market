- passage_id: sp_12
  source_document_id: eu_bayer_monsanto_decision
  page: '15'
  quote_snippet: |
    This is because: (i) individual product markets are contestable on the basis of innovation; (ii) given the strong intellectual property rights ("IPRs") in the crop protection, seeds and traits industries, the original innovator can be expected to reap the benefits from its innovation by preventing rivals from imitating the successful innovation (that is, appropriability is high); (iii) innovation is mostly based on product innovation; (iv) the Parties have not put forward any arguments as to whether consolidation between rival innovators would be associated with efficiencies; and (v) the fear of cannibalisation of own existing products is a disincentive to innovate which is likely to be reinforced by a merger between rival innovators.
