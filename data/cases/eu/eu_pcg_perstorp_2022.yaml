product_markets_considered:
- market_id: pm_1
  name: 2-Ethylhexanoic Acid ("2-EHA")
  definition_status: left_open
  notes: The Notifying Party argued that 2-EHA should be considered as part of a wider market
    comprising all carboxylic acids due to high substitutability. However, market investigation
    respondents suggested 2-EHA is not easily substitutable, pointing to a distinct market.
- market_id: pm_2
  name: iso-butyric aldehyde ("I-BAL")
  definition_status: left_open
  notes: The Commission had previously considered I-BAL and N-BAL as distinct product markets,
    a view that the Notifying Party and market investigation supported.
- market_id: pm_3
  name: n-butyric aldehyde ("N-BAL")
  definition_status: left_open
  notes: Similar to I-BAL, previous Commission decisions, the Notifying Party's view, and market
    investigation results suggested N-BAL and I-BAL constitute distinct product markets.
- market_id: pm_4
  name: trimethylolpropane ("TMP")
  definition_status: left_open
  notes: TMP is a polyhydric alcohol. The Commission had previously considered the broader market
    for polyhydric alcohols but noted evidence suggesting not all such alcohols form a single
    market due to differing chemical structures.
geographic_markets_considered:
- market_id: gm_1
  name: 2-Ethylhexanoic Acid ("2-EHA") — EEA or global
  definition_status: left_open
  notes: Previous decisions left the geographic scope open. Market investigation respondents
    suggested a global market due to transportability and low costs.
- market_id: gm_2
  name: iso-butyric aldehyde ("I-BAL") — at most EEA-wide
  definition_status: left_open
  notes: Previous decisions considered the market for I-BAL to be at most EEA-wide. Market investigation
    indicated a narrower than global market due to high transport costs and deterioration, but
    noted some inter-regional transport.
- market_id: gm_3
  name: n-butyric aldehyde ("N-BAL") — at most EEA-wide
  definition_status: left_open
  notes: Previous decisions considered the market for N-BAL at most EEA-wide, with potential
    segmentation into Northern and Southern Europe. Market investigation showed a tendency to
    limit supply within regions but also instances of inter-regional exports. The Notifying
    Party argued for an EEA-wide market.
- market_id: gm_4
  name: trimethylolpropane ("TMP") — at least EEA-wide and possibly global
  definition_status: left_open
  notes: Previous Commission decisions considered the geographic market for all polyhydric alcohols
    to be at least EEA-wide and possibly global, but left the precise definition open.
theories_of_harm: []
