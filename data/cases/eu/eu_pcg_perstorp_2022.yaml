- passage_id: sp_11
  source_document_id: eu_pcg_perstorp_2022_decision
  page: '9'
  quote_snippet: '(44) The Notifying Party submits that the N-BAL market (like I-BAL) should
    be regarded as EEA-wide because: (a) most manufacturers supply N-BAL across the EEA as a
    whole; (b) N-BAL is a commodity product traded across the EEA with EEA customers having
    largely identical requirements; (c) N-BAL production is not subject to any specific regulatory
    requirements and/or authorizations throughout the EEA; (d) there are similar conditions
    in terms of specifications and competitive prices throughout the EEA and (e) Perstorp produces
    N-BAL in Sweden and sells it in [certain EU Member States].36'
