  quote_snippet: 'Footnote 165: See Section 8 where it is concluded that the Transaction
    would not significantly impede effective competition as a result of input foreclosure
    of premium pay TV non-sports (that is films and series) channels in Sweden, Finland,
    Norway and Denmark. In addition, the commitments offered by Telia in the present
    case are capable of eliminating the competition concerns of input foreclosure
    of premium pay TV sports channels in Sweden and Finland. Therefore, no concern
    remains on the overall market for premium pay TV channels in Sweden, Finland,
    Norway and Denmark.'
