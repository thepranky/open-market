product_markets_considered:
- market_id: pm_1
  name: Production of AV content
  definition_status: defined
  notes: The Commission concluded that the production of AV content and the licensing
    of broadcasting rights for AV content constitute two separate product markets.
    The market is limited to non-captive TV production, excluding captive TV production.
- market_id: pm_2
  name: Licensing of broadcasting rights for AV content
  definition_status: left_open
  notes: The Commission concluded that the licensing of broadcasting rights for AV
    content and the production of AV content constitute two separate product markets.
    The question of further segmentation by content type (films, sports, other TV
    content) or exhibition window (SVOD, TVOD, PPV, first/second pay TV, FTA) was
    left open, as it would not change the outcome of the competitive assessment.
- market_id: pm_3
  name: Wholesale supply of premium pay TV channels (including ancillary services)
  definition_status: left_open
  notes: The Commission concluded that premium pay TV channels and non-premium pay
    TV channels are distinct products, encompassing all types of infrastructure. The
    question of further segmentation between premium pay TV sports channels and premium
    pay TV non-sports channels was left open.
- market_id: pm_4
  name: Wholesale supply of other TV channels (FTA and basic pay TV channels, including
    ancillary services)
  definition_status: left_open
  notes: The Commission defined this market as distinct from premium pay TV channels,
    encompassing all types of infrastructure. The question of further segmentation
    between FTA and basic pay TV channels or by genre was left open.
- market_id: pm_5
  name: Retail supply of AV services
  definition_status: left_open
  notes: The Commission concluded that the relevant product market is the retail supply
    of AV services, encompassing all distribution technologies. The question of further
    segmentation between FTA and pay AV services, linear and non-linear services,
    premium and basic pay AV services, and AV services to MDUs and SDUs was left open.
- market_id: pm_6
  name: Retail supply of fixed telephony services
  definition_status: left_open
  notes: The Commission left open the exact product market definition, specifically
    whether fixed line and VoIP telephony services belong to the same market, and
    whether there are separate markets for residential/non-residential customers or
    local/national/international calls.
- market_id: pm_7
  name: Retail supply of fixed internet access services
  definition_status: left_open
  notes: The Commission left open the exact product market definition, including possible
    segmentations by product type (narrowband, broadband, dedicated access), distribution
    technology (xDSL, fibre, cable), download speed, and customer type (residential/small
    business vs. larger business/public authorities, MDUs vs. SDUs).
- market_id: pm_8
  name: Retail supply of mobile telecommunications services
  definition_status: left_open
  notes: The Commission considered an overall retail market for mobile telecommunications
    services, separate from fixed services, and left open the exact product market
    definition, including potential segmentations by service type (voice, SMS, mobile
    data), network technology (2G/3G/4G), or customer type (pre-paid/post-paid, private/business).
- market_id: pm_9
  name: Retail supply of multiple play services
  definition_status: left_open
  notes: The Commission left open the question of whether one or more multiple play
    markets exist distinct from underlying individual telecommunication services,
    or if there are separate markets for fixed bundles (dual play, triple play) and
    FMC bundles.
- market_id: pm_10
  name: Sale of advertising space in video format
  definition_status: left_open
  notes: The Commission concluded that the sale of TV advertising space is not part
    of the same relevant product market as the sale of advertising space on other
    media channels. However, it left open whether the market should be sub-segmented
    between FTA and pay TV channels, and whether the sale of advertising space on
    AVOD services is part of the same market as linear TV channels.
geographic_markets_considered:
- market_id: gm_1
  name: Production of AV content — national/linguistic/regional (Nordic region affected)
  definition_status: left_open
  notes: The geographic market for the production of AV content was left open, considered
    to be either national, by linguistic area, or encompassing the Nordic region.
- market_id: gm_2
  name: Licensing of broadcasting rights for AV content — national/linguistic/regional
    (Nordic region affected)
  definition_status: left_open
  notes: The geographic market for the licensing of broadcasting rights for AV content
    was left open, considered to be either national, by linguistic area, or encompassing
    the Nordic region.
- market_id: gm_3
  name: Wholesale supply of TV channels — national (affected)
  definition_status: defined
  notes: The Commission concluded that the relevant geographic market for the wholesale
    supply of TV channels is national in scope.
- market_id: gm_4
  name: Retail supply of AV services — national (affected)
  definition_status: defined
  notes: The Commission concluded that the geographic market for the retail supply
    of AV services is national. It noted that offerings and pricing conditions are
    homogeneous nationally.
- market_id: gm_5
  name: Retail supply of fixed telephony services — national (affected)
  definition_status: defined
  notes: The Commission concluded that the retail market for the provision of fixed
    telephony services is national in scope.
- market_id: gm_6
  name: Retail supply of fixed internet access services — national (Sweden affected)
  definition_status: defined
  notes: The Commission concluded that the relevant geographic market for the retail
    supply of fixed internet access services in Sweden is national, based on findings
    from the Swedish Post and Telecom Authority.
- market_id: gm_7
  name: Retail supply of fixed internet access services — regional (Finland affected)
  definition_status: defined
  notes: The Commission concluded that the relevant geographic market for the retail
    supply of fixed internet access services in Finland is regional, based on findings
    from the Finnish telecom regulatory authority (TRAFICOM/FICORA) showing considerable
    regional differences in competitive conditions.
- market_id: gm_8
  name: Retail supply of mobile telecommunications services — national (affected)
  definition_status: defined
  notes: The Commission concluded that the relevant market for the retail provision
    of mobile telecommunications services is national in scope.
- market_id: gm_9
  name: Retail supply of multiple play services — national (affected)
  definition_status: left_open
  notes: The Commission concluded that any possible market for the retail supply of
    multiple play services would be national in scope, but left the exact geographic
    market definition open, as further segmentation based on component bundling would
    not change the competitive assessment outcome.
- market_id: gm_10
  name: Sale of advertising space in video format — national (affected)
  definition_status: defined
  notes: The Commission concluded that the geographic scope of the market for the
    sale of TV advertising space, possibly including advertising space on AVOD services,
    is national.
