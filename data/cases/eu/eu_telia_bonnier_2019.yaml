  quote_snippet: (75) Upstream of the value chain is the production of new AV content.
    AV production companies produce AV content either (a) for internal use on their
    own AV services if they are vertically integrated in the wholesale supply of TV
    channels and/or in the retail provision of AV services (that is to say, “captive
    AV production”), or (b) for supply to third-party customers (that is to say, “non-captive
    AV production”).
