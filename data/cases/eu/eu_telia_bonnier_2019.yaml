- passage_id: sp_5
  source_document_id: eu_telia_bonnier_2019_decision
  page: '36'
  quote_snippet: '(117) With regard to the market for the licensing of broadcasting
    rights for pre-produced TV content, the Commission has considered that this market
    may be subdivided by content type, in particular: (i) films, (ii) sports, and
    (iii) other TV content; and potential sub-segments within these content types,
    but ultimately left the market definition open. The Commission has also considered
    further sub-dividing the market for the licensing of broadcasting rights for TV
    content by exhibition window: (i) SVOD, (ii) TVOD, (iii) PPV, (iv) first pay TV
    window, (v) second pay TV window, and (vi) FTA.'
