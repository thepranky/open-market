  quote_snippet: (123) In the Article 6(1)(c) Decision, the Commission reached the
    preliminary conclusion that the production of AV content on the one hand and the
    licensing of broadcasting rights for TV content on the other hand were two separate
    product markets, and that, in any event, the question whether the market for the
    licensing of broadcasting rights for AV content could be further segmented depending
    on the type of AV content or exhibition window could be left open, as the effects
    of the Transaction were unlikely to differ irrespective of the scope of the product
    market.
