- passage_id: sp_11
  source_document_id: eu_ec_m9711_2020_decision
  page: '8'
  quote_snippet: With respect to Germany, the market investigation suggests that the market
    for pharmaceutical wholesaling is sub-national in scope. As described above in more detail,
    the clear majority of pharmacies receive three or more daily deliveries from their main
    wholesaler. It is apparent that providing three or more deliveries per day requires a local
    presence by the respective wholesaler, given the size of Germany that excludes multiple
    daily deliveries from only one central location of the wholesaler.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets: []
  supports_geographic_markets:
