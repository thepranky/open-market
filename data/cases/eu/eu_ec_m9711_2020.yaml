  supports_theories: []
  supports_commitments: []
- passage_id: sp_12
  source_document_id: eu_ec_m9711_2020_decision
  page: '8'
  quote_snippet: The market investigation rather suggests that the approach of defining the
    geographic market of a catchment area of 2 hours 14 minutes driving time around each depot,
    as applied by the German Federal Cartel Office in past decisions, is the more appropriate
    approach to assess competition in German pharmaceutical wholesaling.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets: []
  supports_geographic_markets:
