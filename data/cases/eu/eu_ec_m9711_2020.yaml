product_markets_considered:
- market_id: pm_1
  name: Full-line pharmaceutical wholesaling excluding direct deliveries from manufacturers
  definition_status: defined
  notes: The Commission defined this market as distinct from direct deliveries by manufacturers
    and from short-line wholesaling. It encompasses the delivery of a full complement of pharmaceutical
    products to professional customers, primarily pharmacies.
- market_id: pm_2
  name: Pharmaceutical wholesaling segmented by product groups (Rx, OTC, and other products)
  definition_status: left_open
  notes: The Commission considered a potential segmentation of pharmaceutical wholesaling according
    to product groups (Rx, OTC, etc.) but found no reason to further segment the market, as
    competition conditions would not materially change.
- market_id: pm_3
  name: Pharmaceutical wholesaling segmented by customer groups (pharmacies, hospitals, doctors)
  definition_status: left_open
  notes: The Commission considered a potential segmentation of pharmaceutical wholesaling according
    to customer groups (pharmacies, doctors, hospitals) but found no reason to further segment
    the market, as deliveries to groups other than pharmacies were negligible.
- market_id: pm_4
  name: National pharmaceutical wholesale market
  definition_status: considered
  notes: Specifically for the Netherlands, the Commission considered a national pharmaceutical
    wholesale market, acknowledging that full-line vs. short-line data was unavailable and these
    figures served as the closest estimate for full-line wholesaling.
geographic_markets_considered:
- market_id: gm_1
  name: Full-line pharmaceutical wholesaling — regional (Germany affected)
  definition_status: defined
  notes: For Germany, the Commission concluded that the market for full-line pharmaceutical
    wholesaling is sub-national, specifically defining it as a catchment area of 2 hours 14
    minutes driving time around each depot, in line with the German Federal Cartel Office's
    approach. This reflects the need for frequent, rapid deliveries to pharmacies.
- market_id: gm_2
  name: Pharmaceutical wholesaling — national or sub-national (Netherlands affected)
  definition_status: left_open
  notes: For the Netherlands, the Commission referred to past practice of considering a national
    or sub-national market but ultimately left the exact geographic market definition open,
    as no competition concerns arose under any plausible definition.
