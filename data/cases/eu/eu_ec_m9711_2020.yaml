  supports_commitments: []
- passage_id: sp_6
  source_document_id: eu_ec_m9711_2020_decision
  page: '4'
  quote_snippet: Finally, the Commission has considered a potential segmentation of pharmaceutical
    wholesaling according to customer groups, namely between (i) retail pharmacies, (ii) doctors
    and (iii) hospitals. Ultimately, also the product market definition was left open regarding
    all potential segments according to customer groups.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
