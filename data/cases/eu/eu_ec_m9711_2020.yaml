  source_document_id: eu_ec_m9711_2020_decision
  page: '6'
  quote_snippet: Similarly, the Commission has no reason to further segment the market according
    to customer groups like pharmacies, hospitals or doctors. In the market investigation, one
    competitor stated that doctors usually would not source from pharmaceutical wholesalers
    due to national regulation.
  extraction_method: pdf_extracted
  review_status: unreviewed
