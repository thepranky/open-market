- passage_id: sp_4
  source_document_id: eu_ec_m9711_2020_decision
  page: '4'
  quote_snippet: Furthermore, the Commission has considered a further sub-segmentation of pharmaceutical
    wholesaling according to different product groups. Specifically, the Commission considered
    possible segmentation between prescription medicine (“Rx”) and over-the-counter products
    (“OTC”); originator, generic and parallel import medicine; and whether the medicine may
    be sold in retail pharmacies under the supervision of a pharmacist only, or also in other
    outlets such as supermarkets. Ultimately, the product market definition was left open regarding
    all potential segments according to product groups as mentioned above.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_2
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_5
  source_document_id: eu_ec_m9711_2020_decision
  page: '6'
  quote_snippet: With respect to a potential segmentation according to product groups, the Commission
    has no reason to further segment the market for example into the deliveries of Rx, OTC and
    other products. In the market investigation, a majority of competitors stated that they
    would generally deliver all types of products to all customers. The remaining competitors
    submitted that it would be rare that a customer would not source all three types of products.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
