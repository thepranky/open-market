  supports_theories: []
  supports_commitments: []
- passage_id: sp_13
  source_document_id: eu_ec_m9711_2020_decision
  page: '9'
  quote_snippet: From the above, the Commission considers that applying a geographic scope of
    2 hours 14 minutes of driving time, in line with the practice of the German Federal Cartel
    Office, around the depots of pharmaceutical wholesalers to be the most appropriate approach
    for Germany. Therefore, this market definition is considered as the relevant geographical
    market relating to Germany in this decision.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
