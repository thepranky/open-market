- passage_id: sp_10
  source_document_id: eu_ec_m9711_2020_decision
  page: '26'
  quote_snippet: It has to be noted, that the market shares cited here do not distinguish between
    full-line and short-line wholesaling. The Parties explain, that there are no data available
    for a short-line wholesaling market. The Parties also explain that to their knowledge, there
    is no separate market for short-line wholesaling in the Netherlands and that here are no
    specialist short-line wholesalers in the Dutch market. See Form CO para 6.58. The Commission
    notes, that for these reasons, the market figures presented in table 4 are the closest estimate
    of full-line pharmaceutical wholesaling in the Netherlands.
  extraction_method: pdf_extracted
  review_status: unreviewed
