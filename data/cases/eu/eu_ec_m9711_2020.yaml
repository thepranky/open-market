- passage_id: sp_15
  source_document_id: eu_ec_m9711_2020_decision
  page: '9'
  quote_snippet: The Commission notes that in other Member States, a different geographic market
    definition may be appropriate due to different national regulatory requirements and geography.
    In line with past decisional practice, as discussed in paragraphs (20) to (22) of this Decision,
    the Commission therefore considers the geographic scope of pharmaceutical wholesaling for
    the Netherlands to be national or sub-national, but leaves the ultimate geographic market
    definition open, as no competition concerns arise under any plausible geographic market
    definition.
  extraction_method: pdf_extracted
