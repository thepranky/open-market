product_markets_considered:
- market_id: pm_1
  name: Production and supply of AV content
  definition_status: considered
  notes: The Commission considered there were no reasons to depart from previous cases' approach.
    Past decisions identified separate markets for (i) commissioned AV content (non-captive)
    and (ii) licensing of broadcasting rights for pre-produced AV content (possibly subdivided
    by content type or exhibition window, but these segmentations were left open).
- market_id: pm_2
  name: Wholesale supply of TV channels
  definition_status: left_open
  notes: The Commission defined the relevant product market as the wholesale supply of TV channels,
    including ancillary services and covering all types of infrastructure. However, the question
    of further segmentation (by genre, distribution technology, or between FTA/pay TV channels,
    or basic/premium pay TV channels) was left open as the transaction did not raise serious
    doubts.
- market_id: pm_3
  name: Retail supply of AV services to end-customers
  definition_status: segmented
  notes: The market investigation yielded mixed results regarding segmentation. The distinction
    between FTA TV channels and pay TV channels was confirmed as accurate. Within pay TV, segmentation
    into basic and premium was inconclusive. Segmentation by linear vs. non-linear pay TV found
    a majority seeing them as alternatives. The Commission's assessment specifically started
    with affected vertical relationships in Germany, Austria, and Croatia relating to a narrow
    market definition consisting of only SVOD services.
- market_id: pm_4
  name: Production and licensing of distribution rights of films for theatrical exhibition
  definition_status: defined
  notes: The Commission concluded that this constitutes a relevant product market, separated
    from the distribution of films for theatrical release. The question of whether to distinguish
    between US and non-US films was left open.
- market_id: pm_5
  name: Distribution of home entertainment products (physical form)
  definition_status: left_open
  notes: The Commission decided not to further discuss this market as Amazon is not active and
    MGM is not active in distribution in the EEA, hence no relevant vertical relationships arise.
- market_id: pm_6
  name: Merchandise licensing
  definition_status: left_open
  notes: The Commission decided not to further discuss this market due to its large size and
    the very low combined market share of the parties.
- market_id: pm_7
  name: Theatrical exhibition of films
  definition_status: left_open
  notes: The Commission stated that neither of the parties is active in this market, and therefore
    the decision would not further assess its impact.
geographic_markets_considered:
- market_id: gm_1
  name: Production and supply of AV content — national or linguistically homogeneous regions
    (scope left open)
  definition_status: left_open
  notes: The Commission concluded the geographic market is either national in scope or encompasses
    linguistically homogeneous regions, but the precise scope was left open as the transaction
    did not raise serious concerns.
- market_id: gm_2
  name: Wholesale supply of TV channels — national (Germany affected)
  definition_status: defined
  notes: The Commission concluded the relevant geographic market is national in scope for Germany,
    based on market investigation responses indicating distribution on a national basis.
- market_id: gm_3
  name: Production and licensing of distribution rights of films for theatrical release — national
  definition_status: defined
  notes: The Commission concluded the relevant geographic market is national in scope, supported
    by market investigation responses from content providers and cinemas.
