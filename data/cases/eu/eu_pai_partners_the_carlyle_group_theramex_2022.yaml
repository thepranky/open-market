- passage_id: sp_5
  source_document_id: eu_pai_partners_the_carlyle_group_theramex_2022_decision
  page: '5'
  quote_snippet: (20) In the past, the Commission distinguished (i) a CDMO market for FDPs and
    (ii) a CDMO market for APIs.25 As regards the CDMO market for FDPs, further segmentation
    was considered based on (i) the pharmaceutical form manufactured (e.g., solids, semi-solids,
    injectables); (ii) the conditions of manufacture (e.g., toxicity, sterile environment);
    (iii) the type of API used for its production and the delivery mechanism used (e.g., swallowing,
    intravenous, injection, etc.).26 The Commission also examined whether there is a separate
    market for contract manufacturing organization (“CMO”) services but eventually left the
    question open.27
  extraction_method: pdf_extracted
  review_status: unreviewed
