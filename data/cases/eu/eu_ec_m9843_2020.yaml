  quote_snippet: (37) For the purpose of this Decision, the precise scope of the market for
    retail supply of business connectivity services can be left open as the Transaction does
    not give rise to serious doubts as regards its compatibility with the internal market irrespective
    of whether there is an overall market for retail supply of business connectivity services,
    or whether this overall market is segmented on the basis of the type of customer (residential
    or B2B customers), or segmented into (i) Internet access services; (ii) leased lines (also
    known as dedicated internet access (DIA)); and (iii) VPN services, or into (i) services
    provided to residential customers and (ii) those provided to B2B customers, on a national
    or an EEA wide market.
