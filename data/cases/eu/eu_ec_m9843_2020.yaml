product_markets_considered:
- market_id: pm_1
  name: colocation services provided by third party data centres
  definition_status: defined
  notes: The Commission defined this market as colocation services provided by third party data
    centres, excluding in-house data centres, and found no need to sub-divide it further based
    on carrier-owned/carrier-neutral, wholesale/retail, or customer type. It also noted that
    interconnection and managed IT services are typically part of these services and do not
    constitute separate markets.
- market_id: pm_2
  name: retail business connectivity services
  definition_status: left_open
  notes: The Commission considered various sub-segments, including Internet access, leased lines
    (DIA), and VPN services, and also a distinction between residential and B2B customers, but
    ultimately left the precise product market definition open.
- market_id: pm_3
  name: IT outsourcing
  definition_status: left_open
  notes: The Commission considered potential segmentation into public cloud computing services,
    IaaS, infrastructure outsourcing services (with further sub-segments), and application outsourcing
    services, but ultimately left the precise market definition open.
geographic_markets_considered:
- market_id: gm_1
  name: colocation services provided by third party data centres — metropolitan area (around
    50 km from city centre) (UK affected)
  definition_status: defined
  notes: The Commission defined the relevant geographic market as each metropolitan area corresponding
    to a radius of around 50 km from the city centre, based on customer targeting, IT team access,
    network operator concentration, and DWDM connectivity requirements.
- market_id: gm_2
  name: retail business connectivity services — national or EEA-wide (UK affected)
  definition_status: left_open
  notes: The Commission considered national scope based on precedents, but ultimately left the
    precise geographic market definition open as the transaction did not raise concerns regardless
    of whether it was national or EEA-wide.
- market_id: gm_3
  name: IT outsourcing — national or EEA-wide (UK affected)
  definition_status: left_open
  notes: The Commission noted precedents considering both EEA-wide and national markets due
    to customisation and local service requirements, but ultimately left the precise geographic
    market definition open as the transaction did not raise concerns regardless of scope.
