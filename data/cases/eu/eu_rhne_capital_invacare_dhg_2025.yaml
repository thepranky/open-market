  page: '4'
  quote_snippet: '(17) The Commission considers that the relevant market for PUP mattresses
    is likely narrower than an overall market including all types of PUP mattresses. A majority
    of respondents to the market investigation considered a segmentation of the market into:
    (i) foam/static; (ii) hybrid; and (iii) air/dynamic mattresses to be appropriate.'
  extraction_method: pdf_extracted
