product_markets_considered:
- market_id: pm_1
  name: Pressure Ulcer Prevention ('PUP') mattresses
  definition_status: left_open
  notes: The Commission considered that the market should most likely be segmented into foam/static,
    hybrid, and air/dynamic PUP mattresses, and further by acute and non-acute settings. However,
    it ultimately left the exact market definition open for the purpose of this decision.
- market_id: pm_2
  name: Healthcare beds
  definition_status: left_open
  notes: The Commission considered that the market for healthcare beds could likely be segmented
    between long-term care beds (non-acute settings) and conventional hospital beds (acute settings).
    However, it ultimately left the exact market definition open for the purpose of this decision.
- market_id: pm_3
  name: Toilet and hygiene products for patients with reduced mobility
  definition_status: left_open
  notes: The Commission considered that this market should likely be further segmented into
    at least rails & supports and stools & seats, with potential further segmentation for each
    specific product type (rails, supports, stools, and seats). However, it ultimately left
    the exact market definition open for the purpose of this decision.
geographic_markets_considered:
- market_id: gm_1
  name: Pressure Ulcer Prevention ('PUP') mattresses — national
  definition_status: left_open
  notes: The Commission considered the geographic market for PUP mattresses to be likely national
    in scope, based on the need for national presence for tenders and service obligations, national
    procurement rules, and price differences across Member States. However, it ultimately left
    the exact geographic market definition open for the purpose of this decision.
- market_id: gm_2
  name: Healthcare beds — national
  definition_status: left_open
  notes: The Commission considered the geographic scope of the market for healthcare beds to
    be likely national, due to differing prices, reimbursement schemes, and public financing
    rules across Member States. However, it ultimately left the exact geographic market definition
    open for the purpose of this decision.
- market_id: gm_3
  name: Toilet and hygiene products for patients with reduced mobility — national
  definition_status: left_open
  notes: The Commission considered the geographic scope of this market to be likely national,
    based on the need for suppliers to have a national presence for tenders and service obligations.
    However, it ultimately left the exact geographic market definition open for the purpose
    of this decision.
