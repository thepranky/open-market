- passage_id: sp_3
  source_document_id: eu_rhne_capital_invacare_dhg_2025_decision
  page: '5'
  quote_snippet: (23) In light of the above, the Commission considers that the relevant market
    for PUP mattresses should most likely distinguish between (i) foam/static, (ii) hybrid and
    (iii) air/dynamic PUP mattresses, in acute settings (i.e. hospitals) and in non-acute settings
    respectively. However, for the purpose of this decision, the exact definition of the relevant
    product market can be left open as the Transaction would not raise serious doubts as to
    its compatibility with the internal market under any possible product market definition.
  extraction_method: pdf_extracted
  review_status: unreviewed
