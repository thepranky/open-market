- passage_id: sp_4
  source_document_id: eu_rhne_capital_invacare_dhg_2025_decision
  page: '6'
  quote_snippet: (26) The Notifying Party submits that the relevant market is the supply of
    healthcare beds, including both hospital and long-term care beds. According to the Notifying
    Party, conventional hospital beds have higher specifications and prices, but they are generally
    substitutable with long-term care beds. The Notifying Party has, however, also considered
    a narrower segmentation by end-use, distinguishing long-term care beds used in non-acute
    settings (i.e., nursing and care home environments), where the activities of the Targets
    overlap, from other possible segmentations.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_2
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_5
  source_document_id: eu_rhne_capital_invacare_dhg_2025_decision
  page: '6'
  quote_snippet: (27) The Commission considers that the market for healthcare beds can likely
    be segmented between those intended for long-term care (in non-acute settings, either in
    a care home or at-home setting) and those for hospital care (acute settings). A majority
    of respondents to the market investigation considered that long-term care beds and hospital
    beds are not interchangeable based on their functionalities and the needs of patients and
    caregivers, and that healthcare beds for patients in acute settings (i.e., hospitals) and
    non-acute settings (i.e., care home or at home) are not interchangeable.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
