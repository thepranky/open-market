  source_document_id: eu_rhne_capital_invacare_dhg_2025_decision
  page: '8'
  quote_snippet: (36) In light of the above, the Commission considers that it is likely appropriate
    to distinguish between different types of toilet and hygiene products for patients with
    reduced mobility, at least between rails & supports, on the one hand, and stools & seats,
    on the other hand, without excluding a further segmentation for each type of product (i.e.
    rails, supports, stools and seats). However, for the purpose of this decision, the exact
    definition of the relevant product market can be left open as the Transaction would not
    raise serious doubts as to its compatibility with the internal market under any possible
    product market definition.
