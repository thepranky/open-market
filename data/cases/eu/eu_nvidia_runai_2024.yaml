- passage_id: sp_1
  source_document_id: eu_nvidia_runai_2024_decision
  page: '5'
  quote_snippet: In the market investigation, the Commission tested whether, for use in datacentres,
    there is a separate market for discrete GPUs or whether such a market should include (i)
    integrated GPUs; (ii) other types of accelerators such as ASICs, application-specific standard
    products (‘ASSPs’), FGPAs, or other accelerators. Furthermore, in view of the Notifying
    Party’s arguments, the Commission tested whether the market should include renting accelerated
    compute capacity as a service from cloud-based solutions.
  extraction_method: pdf_extracted
