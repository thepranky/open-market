- passage_id: sp_4
  source_document_id: eu_nvidia_runai_2024_decision
  page: '13'
  quote_snippet: 'In the market investigation, the Commission tested whether: (a) there is a
    separate market for GPU orchestration software to run workloads on-premises, on cloud, or
    in hybrid environments (as the Notifying Party submits); (b) the relevant product market
    should be considered wider than such market for GPU orchestration software and whether either
    native cloud solutions (as the Notifying Party submits) or MLOps offerings should be included
    in the relevant market (on which the Notifying Party does not take a position); and (c)
    the relevant product market for GPU orchestration software should be further segmented into
    (i) Kubernetes versus non-Kubernetes, (ii) open-source versus proprietary or (iii) AI workloads
    versus other workloads (the Notifying Party opposes these segmentations).'
  extraction_method: pdf_extracted
