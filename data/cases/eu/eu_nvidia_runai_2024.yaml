- passage_id: sp_2
  source_document_id: eu_nvidia_runai_2024_decision
  page: '8'
  quote_snippet: Overall, the results of the market investigation show that there are a number
    of workloads for which customers rely on discrete GPUs for use in datacentres, and for which
    they do not consider integrated GPUs, other accelerators, or accelerated compute capacity
    as a service to be a suitable alternative. In addition, the suppliers of accelerated compute
    capacity also have a concrete demand for discrete GPUs for use in datacentres that cannot
    be completely satisfied with the use of in-house accelerators. Therefore, for the purpose
    of this decision, the Commission concludes that there is no reason to deviate from previous
    decisional practice in which the Commission found that there is a separate market for discrete
    GPUs for use in datacentres.
  extraction_method: pdf_extracted
  review_status: unreviewed
