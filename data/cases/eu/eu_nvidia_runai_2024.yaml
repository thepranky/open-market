product_markets_considered:
- market_id: pm_1
  name: Supply of discrete GPUs for use in datacentres
  definition_status: defined
  notes: The Commission conducted a segmentation analysis, considering whether the market should
    include integrated GPUs, other accelerators (ASICs, ASSPs, FPGAs), or accelerated compute
    capacity as a service. Based on market investigation results, it concluded that these alternatives
    are not suitable substitutes for discrete GPUs for specific workloads, and suppliers of
    accelerated compute capacity also rely on discrete GPUs as inputs. Therefore, the Commission
    maintained its previous decisional practice defining a separate market for discrete GPUs
    for use in datacentres.
- market_id: pm_2
  name: Supply of GPU orchestration software
  definition_status: defined
  notes: The Commission conducted a segmentation analysis for GPU orchestration software, testing
    whether the market should include native cloud solutions or MLOps offerings, and whether
    it should be segmented by Kubernetes vs. non-Kubernetes, open-source vs. proprietary, or
    AI vs. other workloads. The Commission concluded to exclude native cloud solutions and MLOps,
    but not to segment based on the other criteria. It noted that Run:ai's advanced features
    (single pane of glass, GPU fractioning, security auditability) would be considered elements
    of differentiation in the competitive assessment.
geographic_markets_considered:
- market_id: gm_1
  name: Supply of discrete GPUs for use in datacentres — worldwide
  definition_status: defined
  notes: The Commission concluded the geographic market for discrete GPUs for use in datacentres
    is worldwide, consistent with previous decisions and market investigation findings that
    competition is global, customers source globally, products do not vary by geography, and
    shipping costs are minimal.
- market_id: gm_2
  name: Supply of GPU orchestration software — worldwide
  definition_status: defined
  notes: The Commission concluded that the geographic market for GPU orchestration software
    is worldwide, based on market investigation findings that competition is global, vendors
    compete globally irrespective of geography, and there are no significant transportation
    costs or regulatory barriers.
