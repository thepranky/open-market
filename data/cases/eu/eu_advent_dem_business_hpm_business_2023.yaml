  source_document_id: eu_advent_dem_business_hpm_business_2023_decision
  page: '11'
  quote_snippet: Lastly, customers and competitors confirm significant price differences between
    the EEA and Asia, where production is significantly cheaper, e.g. due to lower energy costs.
    The existence of significant price gaps between regions further indicate separate geographic
    product markets. While PA6 BP is generally a transportable product without significant technical
    barriers to transportation over longer distances, it is uncertain if potentially increasing
    price differences would trigger significantly larger imports into the EEA, offsetting transportation
    costs, longer delivery times, security of supply considerations and regulatory barriers.
