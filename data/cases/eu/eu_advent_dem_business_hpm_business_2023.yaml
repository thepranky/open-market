- passage_id: sp_7
  source_document_id: eu_advent_dem_business_hpm_business_2023_decision
  page: '6'
  quote_snippet: PA6 BP must be distinguished from PA6.6 BP. The market investigation confirmed
    the Commission’s past practice that PA6 BP and PA6.6 BP constitute separate product markets.
    From a demand-side perspective, respondents to the market investigation indicated that customers
    would only be able to substitute PA6 BP with PA6.6 BP with difficulties and additional costs,
    pointing toward different processing characteristics and different functionalities of the
    two materials. From a supply-side point of view, competitors provided that switching production
    between PA6 BP and PA6.6 BP would require considerable time and investment due to differences
    in production.
