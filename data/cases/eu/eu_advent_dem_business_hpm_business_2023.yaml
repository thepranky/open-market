product_markets_considered:
- market_id: pm_1
  name: PA6 BP
  definition_status: segmented
  notes: The Commission considers the manufacturing and sale of PA6 BP to be a separate product
    market from PA6 EP and PA6.6 BP. The Commission considered further segmenting the PA6 BP
    market by end-use (i.e., for manufacturing of PA6 EP, for films, and for fibres) but the
    market investigation results were inconclusive. The exact market definition for segmentation
    was left open for the purposes of the decision as no competition concerns arose under any
    plausible definition.
- market_id: pm_2
  name: PA6 EP
  definition_status: segmented
  notes: The Commission considers PA6 EP to be a separate product market from PA6 BP. The market
    investigation suggested that PA6 EP would be separate from PA6.6 EP, in line with past practice,
    but the exact market definition for this distinction was ultimately left open as no competition
    concerns arose. Furthermore, the market for PA6 EP may be further segmented by end-application
    (i.e., automotive, E&E, and specialised industries), but the exact segmentation was left
    open for the purposes of the decision as no competition concerns arose under any plausible
    definition.
- market_id: pm_3
  name: PA6.6 BP
  definition_status: defined
  notes: The Commission considers that the manufacturing and sale of PA6.6 BP constitutes a
    separate product market from PA6 BP due to lack of demand-side and supply-side substitutability.
- market_id: pm_4
  name: PA6.6 EP
  definition_status: left_open
  notes: The market investigation suggested that PA6.6 EP likely constitutes a separate product
    market from PA6 EP, consistent with the Commission’s past practice. However, the exact market
    definition was left open for the assessment of this Transaction as no competition concerns
    arose.
geographic_markets_considered:
- market_id: gm_1
  name: PA6 BP — EEA-wide
  definition_status: defined
  notes: The Commission considered the geographic market for PA6 BP to be EEA-wide, confirming
    past practice. This was supported by customer preference for proximity, transportation costs,
    delivery times, security of supply, regulatory barriers, and significant price differences
    between the EEA and other regions like Asia.
- market_id: gm_2
  name: PA6 EP — EEA-wide
  definition_status: defined
  notes: The market investigation confirmed the existence of an EEA-wide market for PA6 EP.
    Customers showed an even stronger preference for sourcing PA6 EP in relative proximity to
    their manufacturing plants compared to PA6 BP, citing transport costs, delivery times, security
    of supply, and sustainability aspects. Competitors also reported selling most of their EEA
    production within the EEA due to similar factors and regulatory barriers like EU REACH.
