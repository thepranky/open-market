  page: '8'
  quote_snippet: On balance, PA6 EP and PA6.6 EP likely constitute two separate product markets,
    in line with the Commission’s past practice. To the extent that there is substitution, it
    is more from PA6.6 EP to PA6 EP than the other way due to the higher cost of PA6.6 EP. For
    the assessment of the present Transaction, this question can ultimately be left open, as
    no competition concerns arise due to Transaction under any plausible product market definition.
