  page: '7'
  quote_snippet: PA6 EP must be distinguished from PA6.6 EP. Against the background of the arguments
    put forward by the Notifying Party, the Commission assessed whether the market situation
    for PA6 EP and PA6.6 EP has changed in the sense that both products would now fall into
    the same product market. From a demand-side perspective, customers and competitors responding
    to the market investigation confirmed that PA6 EP and PA6.6 EP could be used interchangeably
    from a technical point of view for a significant share of end-applications, while no substitution
    was possible for others.
