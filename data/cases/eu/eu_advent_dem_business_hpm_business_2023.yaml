- passage_id: sp_6
  source_document_id: eu_advent_dem_business_hpm_business_2023_decision
  page: '9'
  quote_snippet: Based on the above, the Commission considers that it is not meaningful to define
    a very high number of separate product markets for each grade. The Commission cannot exclude
    the possibility that the market may be segmented by end use (automotive, E&E, specialised
    industries). For the purpose of the assessment of this Transaction, the Commission will
    carry out an assessment for the overall PA6 EP market, as well as separately for automotive,
    E&E and specialised industriess, while the exact product market definition can be left open
    in this regard as no competition concerns arise due to the Transaction under any plausible
    product market definition.
  extraction_method: pdf_extracted
