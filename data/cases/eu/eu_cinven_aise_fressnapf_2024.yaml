  source_document_id: eu_cinven_aise_fressnapf_2024_decision
  page: '5'
  quote_snippet: (16) In the present case, the large majority of responding suppliers indicated
    that their European plants are able to deliver their branded and private label products
    in most of the EU territory and even to other continents.18 The large majority of responding
    retailers similarly indicated that they are able to procure branded and private label products
    from producers located in most of the European territory.19 In any event, the geographic
    market can be left open, because the transaction does not raise any concerns even under
    the most conservative approach (i.e. assuming a national scope of the relevant markets).
  extraction_method: pdf_extracted
