  quote_snippet: (23) If the markets for the wholesale supply of pet food for private labels
    were considered to be EEA-wide in scope, the Transaction would not give rise to any affected
    market within the meaning of recital 25(g) of Annex I to the Implementing Regulation.27
    As explained above, both the Commission’s precedent and the investigation in the present
    case provide indications that these markets are indeed broader than national and possibly
    EEA-wide.
