case_id: eu_hp_poly_2022
case_name: HP / POLY
authority: European Commission
jurisdiction: EU
sector: manufacturing
outcome: cleared
procedure_stage: phase1
decision_date: '2022-07-08'
parties:
- name: HP
  role: acquirer
- name: POLY
  role: target
source_documents:
- doc_id: eu_hp_poly_2022_decision
  title: HP / POLY — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.10737
  pdf_url: http://publications.europa.eu/resource/cellar/db58f124-3a7f-11ed-9c68-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Consumer audio electronics
  definition_status: considered
  notes: The Commission confirmed the approach from previous decisions but did not define this
    market for the purpose of this decision.
- market_id: pm_2
  name: Headphones
  definition_status: left_open
  notes: The Commission considered headphones as a potential separate market within consumer
    audio electronics, and also a potential segmentation, but left the precise market definition
    open.
- market_id: pm_3
  name: Headsets
  definition_status: left_open
  notes: The Commission investigated whether a separate market for headsets should be distinguished
    from headphones, and whether different product categories within headsets should be recognized,
    but ultimately left the question open.
- market_id: pm_4
  name: Business headsets
  definition_status: considered
  notes: The Commission investigated the potential impact of the transaction on this narrowly
    defined market for the purpose of the decision.
- market_id: pm_5
  name: Videoconferencing Solutions (“VCS”)
  definition_status: left_open
  notes: The Commission confirmed the overall market definition but left the precise segmentation
    open.
- market_id: pm_6
  name: VCS segmented (dedicated-room, multi-purpose, executive office/desktop)
  definition_status: left_open
  notes: This segmentation was considered accurate based on previous decisions and market investigation,
    but the Commission ultimately left the precise segmentation of the VCS market open.
- market_id: pm_7
  name: VCS segmented (room-based endpoints, USB room devices, PVCD)
  definition_status: left_open
  notes: This alternative segmentation was suggested by the Notifying Party and supported by
    the market investigation as potentially more accurate, but the Commission ultimately left
    the precise segmentation of the VCS market open.
- market_id: pm_8
  name: USB room devices
  definition_status: considered
  notes: The Commission had not previously considered this market but investigated it for the
    purpose of the decision as it was the only segment where the parties' activities would overlap
    (HP planning to enter).
geographic_markets_considered:
- market_id: gm_1
  name: Consumer audio electronics (including headphones) — national
  definition_status: left_open
  notes: Previous decisions considered this market national, and market investigation generally
    supported this, but the precise scope was left open in precedents and results for headsets
    did not justify a departure for consumer audio electronics in general.
- market_id: gm_2
  name: Headsets — worldwide
  definition_status: left_open
  notes: Market investigation indicated suppliers sell worldwide and customers purchase globally,
    but the precise geographic scope was left open for headsets.
- market_id: gm_3
  name: Headsets — EEA-wide
  definition_status: left_open
  notes: The Notifying Party submitted the market is at least EEA-wide, and market investigation
    showed some customers purchasing at an EEA-wide level, but the precise geographic scope
    was left open for headsets.
- market_id: gm_4
  name: Headsets — national
  definition_status: left_open
  notes: Market investigation indicated some support for national scope due to varying customer
    preferences, but the precise geographic scope was left open for headsets.
- market_id: gm_5
  name: Business headsets — worldwide
  definition_status: considered
  notes: The Commission explicitly examined the worldwide level for the provision of business
    headsets for the purpose of the decision.
- market_id: gm_6
  name: Business headsets — EEA-wide
  definition_status: considered
  notes: The Commission explicitly examined the EEA level for the provision of business headsets
    for the purpose of the decision.
- market_id: gm_7
  name: Business headsets — national
  definition_status: considered
  notes: The Commission explicitly examined the national level for the provision of business
    headsets for the purpose of the decision.
- market_id: gm_8
  name: VCS — EEA-wide
  definition_status: considered
  notes: The market investigation supported an EEA-wide scope, and the Commission concluded
    that the geographic market for VCS and its segments is at least EEA-wide for the purpose
    of the decision.
- market_id: gm_9
  name: VCS — worldwide
  definition_status: left_open
  notes: While the Commission considered the market to be at least EEA-wide, it explicitly left
    open whether the market is EEA-wide or worldwide.
- market_id: gm_10
  name: USB room devices — EEA-wide
  definition_status: considered
  notes: For the purpose of the decision, the Commission considered the EEA-wide scope for USB
    room devices as a segment of the VCS market.
- market_id: gm_11
  name: USB room devices — worldwide
  definition_status: left_open
  notes: While the Commission considered the market to be at least EEA-wide for the purpose
    of the decision, it explicitly left open whether the market is EEA-wide or worldwide.
