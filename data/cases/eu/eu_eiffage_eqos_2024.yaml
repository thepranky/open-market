product_markets_considered:
- market_id: pm_1
  name: Installation and maintenance of catenaries and overhead contact lines
  definition_status: segmented
  notes: The Commission previously defined a separate market for the installation and maintenance
    of catenaries and overhead contact lines, distinct from the manufacture and supply of equipment
    and from third rail systems. Previous decisions left open further segmentations between
    long-distance and metropolitan rail, and within long-distance rail, between conventional
    and high-speed lines. The market investigation confirmed the distinction from third rail
    systems but was inconclusive regarding a distinction between installation and maintenance
    services, and between long-distance and metropolitan rails. It found a distinction between
    conventional and high-speed lines within long-distance lines not relevant. For the purpose
    of this Decision, the Commission assessed the effects on the narrowest plausible market
    for the installation of catenaries and overhead contact lines for conventional long-distance
    lines, as well as on a broader market encompassing both conventional long-distance lines
    and metropolitan rails.
- market_id: pm_2
  name: Electrical engineering services for the installation of high voltage overhead power
    lines
  definition_status: considered
  notes: The Commission previously distinguished electrical engineering services from mechanical
    and HVAC engineering services, and segmented them by type of work (installation vs. maintenance)
    and type of customers (residential vs. non-residential, infrastructure, industrial, tertiary).
    For infrastructure projects, different types were distinguished (telecommunication, electrical
    substations, power lines, public lighting). For power lines, segmentation by voltage (high
    vs. medium/low) and installation type (overhead vs. underground) was previously left open.
    The market investigation confirmed distinctions between power lines and substations, and
    between high voltage and medium/low voltage power lines. However, results were mixed for
    segmentation between overhead and underground power lines. The exact product market definition
    was ultimately left open, but for the purpose of this Decision, the Commission assessed
    the effects of the Transaction on engineering services for the installation of high voltage
    powerlines, as this was the only segment leading to affected markets.
geographic_markets_considered:
- market_id: gm_1
  name: Installation and maintenance of catenaries and overhead contact lines — national (Belgium
    affected)
  definition_status: defined
  notes: Previous Commission decisions considered this market to be national. The market investigation
    confirmed that the relevant geographic market is not broader than national, due to national
    infrastructure managers with specific requirements, local supplier bases, and national standards
    and certification bodies.
- market_id: gm_2
  name: Installation and maintenance of catenaries and overhead contact lines for long distance
    lines — regional (Wallonia, including Brussels affected)
  definition_status: considered
  notes: While the overall market is national, the market investigation elicited mixed results
    concerning a segmentation in Belgium between Flanders and Wallonia (including Brussels).
    Factors supporting segmentation included different framework agreements, specialized suppliers,
    and language barriers, while factors against included a single customer (Infrabel) across
    both regions and competitors able to operate in both. For the purpose of this Decision,
    the Commission assessed the effects of the Transaction on this market at both national and
    regional levels.
- market_id: gm_3
  name: Electrical engineering services for the installation of high voltage overhead power
    lines — national (France affected)
  definition_status: defined
  notes: Previous decisions considered markets for electrical engineering services to be at
    least national. The market investigation confirmed a national market in France, with customers
    launching national calls for tenders and framework agreements, and one main customer allocating
    projects nationally. This was consistent with competitor views.
- market_id: gm_4
  name: Electrical engineering services for the installation of high voltage overhead power
    lines — regional (France affected)
  definition_status: considered
  notes: Previous decisions contemplated regional markets within France but left the exact delineation
    open. The Notifying Party argued against regional segmentation. The exact geographic market
    definition was left open as the Transaction did not raise serious doubts under any plausible
    definition. However, for the purpose of this Decision, the Commission assessed the effects
    at the regional level in France because this was the only geographic market definition that
    triggered an affected market for the installation of high voltage overhead power lines.
