  page: '10'
  quote_snippet: 'a competitor mentioned: ‘Aluminium FRPs for Automotive HEX are in general
    completely different products than Standard FRPs. For example, Standard products are for
    building applications, Foilstock or General Engineering, while Automotive HEX products are
    made for heat exchanger for passenger cars or trucks. A big part of this products is clad,
    which means the products have a core alloy and on top a clad layer which allows the customer
    to braze material together in order to produce a heat exchanger. The Standards FRPs do not
    have alloy combinations in one product”.'
