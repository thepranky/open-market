  source_document_id: eu_ec_m9560_2020_decision
  page: '10'
  quote_snippet: 'A wide majority of customers and competitors who expressed an opinion in the
    market investigation on this point submitted that they cannot use Standard FRPs instead
    of aluminium FRPs for Automotive HEX for the same applications neither overall or in terms
    of price, use/end applications, product characteristics and efficiency.54 As one customer
    stated: ‘Automotive heat exchangers products are not generic flat rolled aluminium alloys
    but customized per application, tailor made in chemical composition, mechanical properties,
    dimensional tolerances.’'
