  page: '9'
  quote_snippet: In previous decisions, the Commission segmented aluminium FRPs into several
    separate product markets, one of them being Standard FRPs.47 The Commission considered that
    there exists a distinct market for Standard FRPs consisting of all FRPs that do not constitute
    distinct product markets within the field of FRPs. The market for Standard FRPs would include
    standard sheet, plates, foil stock, etc. for which, there exists a certain degree of supply
    side substitutability.
