product_markets_considered:
- market_id: pm_1
  name: Standard FRPs
  definition_status: considered
  notes: The Commission considered Standard FRPs as a distinct relevant product market for the
    purposes of this Decision. It had previously segmented aluminium FRPs into several separate
    product markets, with Standard FRPs being one, including standard sheet, plates, foil stock,
    etc., for which there exists a certain degree of supply-side substitutability. The market
    investigation confirmed that Standard FRPs are distinct from Automotive HEX materials due
    to limited substitutability in terms of application, characteristics, and efficiency.
- market_id: pm_2
  name: Aluminium FRPs for Automotive HEX materials
  definition_status: considered
  notes: The Commission considered aluminium FRPs for Automotive HEX materials as a distinct
    relevant product market for the purposes of this Decision, separate from Standard FRPs.
    This is based on market investigation findings that customers and competitors cannot use
    Standard FRPs instead of Automotive HEX materials for the same applications due to tailored
    chemical composition, mechanical properties, and dimensional tolerances.
- market_id: pm_3
  name: Aluminium FRPs for Automotive HEX material for plates
  definition_status: left_open
  notes: The Commission noted that the question of whether the market for aluminium FRPs for
    Automotive HEX could be further segmented into materials for plates, tubes, overall fins,
    clad fins, and unclad fins was left open, as the Transaction did not raise serious doubts
    under any of these plausible definitions. Market investigation participants largely considered
    these to be separate product markets due to limited substitutability.
- market_id: pm_4
  name: Aluminium FRPs for Automotive HEX material for tubes
  definition_status: left_open
  notes: The Commission noted that the question of whether the market for aluminium FRPs for
    Automotive HEX could be further segmented into materials for plates, tubes, overall fins,
    clad fins, and unclad fins was left open, as the Transaction did not raise serious doubts
    under any of these plausible definitions. Market investigation participants largely considered
    these to be separate product markets due to limited substitutability.
- market_id: pm_5
  name: Aluminium FRPs for Automotive HEX material for overall fins
  definition_status: left_open
  notes: The Commission noted that the question of whether the market for aluminium FRPs for
    Automotive HEX could be further segmented into materials for plates, tubes, overall fins,
    clad fins, and unclad fins was left open, as the Transaction did not raise serious doubts
    under any of these plausible definitions. Market investigation participants largely considered
    these to be separate product markets due to limited substitutability.
- market_id: pm_6
  name: Aluminium FRPs for Automotive HEX material for clad fins
  definition_status: left_open
  notes: The Commission noted that the question of whether the market for aluminium FRPs for
    Automotive HEX could be further segmented into materials for plates, tubes, overall fins,
    clad fins, and unclad fins was left open, as the Transaction did not raise serious doubts
    under any of these plausible definitions. Market investigation participants largely considered
    these to be separate product markets due to limited substitutability, and also considered
    clad fins not interchangeable with unclad fins.
- market_id: pm_7
  name: Aluminium FRPs for Automotive HEX material for unclad fins
  definition_status: left_open
  notes: The Commission noted that the question of whether the market for aluminium FRPs for
    Automotive HEX could be further segmented into materials for plates, tubes, overall fins,
    clad fins, and unclad fins was left open, as the Transaction did not raise serious doubts
    under any of these plausible definitions. Market investigation participants largely considered
    these to be separate product markets due to limited substitutability, and also considered
    clad fins not interchangeable with unclad fins.
- market_id: pm_8
  name: Brazing sheet (for use in heat exchangers)
  definition_status: considered
  notes: The Commission referenced a previous decision where it had contemplated this as a separate
    market but had left the definition open. It was not a core market for assessment in the
    present case.
geographic_markets_considered:
- market_id: gm_1
  name: Standard FRPs — EEA-wide
  definition_status: considered
  notes: The Commission considered the geographic market for Standard FRPs to be EEA-wide, consistent
    with its precedents and supported by the market investigation. Participants indicated that
    supply and demand are at least EEA-wide, and factors like quality differences from Asian
    producers, duties, and transportation costs discourage sourcing from outside the EEA.
- market_id: gm_2
  name: Aluminium FRPs for Automotive HEX materials — EEA-wide
  definition_status: considered
  notes: The Commission considered the geographic market for Automotive HEX materials to be
    EEA-wide, supported by market investigation findings that competitive dynamics are similar
    to Standard FRPs, prices are similar throughout the EEA, and suppliers operate at the EEA
    level. Import duties and transportation costs act as constraints on sourcing from outside
    the EEA.
- market_id: gm_3
  name: Aluminium FRPs for Automotive HEX material for tubes — EEA-wide
  definition_status: considered
  notes: If treated as a separate relevant product market, the production and supply of Automotive
    HEX materials for tubes would also be EEA-wide in scope, mirroring the broader Automotive
    HEX materials market.
- market_id: gm_4
  name: Aluminium FRPs for Automotive HEX material for overall fins — EEA-wide
  definition_status: considered
  notes: If treated as a separate relevant product market, the production and supply of Automotive
    HEX materials for overall fins would also be EEA-wide in scope, mirroring the broader Automotive
    HEX materials market.
- market_id: gm_5
  name: Aluminium FRPs for Automotive HEX material for clad fins — EEA-wide
  definition_status: considered
  notes: If treated as a separate relevant product market, the production and supply of Automotive
    HEX materials for clad fins would also be EEA-wide in scope, mirroring the broader Automotive
    HEX materials market.
- market_id: gm_6
  name: Aluminium FRPs for Automotive HEX material for unclad fins — EEA-wide
  definition_status: considered
  notes: If treated as a separate relevant product market, the production and supply of Automotive
    HEX materials for unclad fins would also be EEA-wide in scope, mirroring the broader Automotive
    HEX materials market.
