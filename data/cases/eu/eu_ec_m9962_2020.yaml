source_passages:
- passage_id: sp_1
  source_document_id: eu_ec_m9962_2020_decision
  page: '3'
  quote_snippet: As regards the product market, the Commission found in a past decision,7 that
    antithrombotic FDPs falling into ATC4 classes B1B1 (heparin) and B1B2 (antithrombin III),
    along with those falling into ATC3 class B1X (other antithrombotic agents) that have the
    same applications as heparins, belong to the same product market as they have the same mode
    of action (injectable) and range of indications.
  extraction_method: pdf_extracted
