- passage_id: sp_2
  source_document_id: eu_ec_m9962_2020_decision
  page: '3'
  quote_snippet: In any event, for the purposes of this Decision, it is not necessary to conclude
    on the exact product market definition for antithrombotic FDPs, that is (i) whether classes
    B1B1 and B1B2 are each a separate product market or if together they constitute a product
    market (under class B1B), and (ii) whether class B1X is a separate market or it should be
    considered together with class B1B, as the Transaction does not give rise to serious doubts
    as to its compatibility with the internal market or the functioning of the EEA agreement
    under any of those plausible market definitions.
  extraction_method: pdf_extracted
