  source_document_id: eu_ec_m9962_2020_decision
  page: '4'
  quote_snippet: In any event, for the purpose of this Decision, the precise product market
    definition of CMO can be left open as, regardless of the market definition considered (an
    overall market for CMO, or a market for CMO services for sterile liquid pharmaceuticals),
    the Transaction does not give rise to serious doubts as to its compatibility with the internal
    market and the functioning of the EEA Agreement.
