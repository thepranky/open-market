product_markets_considered:
- market_id: pm_1
  name: Fixed Dose Pharmaceuticals (FDPs) for antithrombotic products
  definition_status: left_open
  notes: The Commission considered various segmentations, including ATC4 classes B1B1 (heparin)
    and B1B2 (antithrombin III), ATC3 class B1X (other antithrombotic agents), and molecule
    level. However, it was not necessary to conclude on the exact definition for the purpose
    of this decision.
- market_id: pm_2
  name: Contract Manufacturing Organisation (CMO)
  definition_status: left_open
  notes: The Commission considered potential segmentations by pharmaceutical form (solid dose
    and powder, liquids and semi-solid, sterile liquid, medicated confectionary) and specific
    manufacturing conditions. While the assessment focused on sterile liquid pharmaceuticals,
    the precise market definition for CMO was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Antithrombotic FDPs — national
  definition_status: defined
  notes: null
- market_id: gm_2
  name: Contract Manufacturing Organisation (CMO) — worldwide or at least EEA-wide
  definition_status: left_open
  notes: The Commission left open whether the geographic market for CMO services is worldwide
    or at least EEA-wide, as the transaction did not raise serious doubts under either definition.
