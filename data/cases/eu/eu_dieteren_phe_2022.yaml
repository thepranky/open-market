  page: '38'
  quote_snippet: Where as in this case, a notified concentration raises serious doubts as to
    its compatibility with the internal market or the functioning of the EEA agreement, the
    parties may modify the notified concentration so as to remove the grounds for the serious
    doubts identified by the Commission with a view to having it declared compatible with the
    internal market pursuant to Article 6(1)(b) in conjunction with Article 6(2) of the Merger
    Regulation.
