  page: '46'
  quote_snippet: Pursuant to Article 6(2) of Council Regulation (EC) No 139/2004 (the “Merger
    Regulation”), D’Ieteren Group (the “Notifying Party” or “DIG”) hereby enters into the following
    Commitments (the “Commitments”) vis-à-vis the European Commission (the “Commission”) with
    a view to rendering the acquisition of sole control of the whole Dakar Holding S.C.A, the
    100% parent company of Parts Holding Europe (“PHE”) (DIG and PHE are referred to as the
    “Parties”) (the “Concentration”) compatible with the internal market and the functioning
    of the EEA Agreement.
