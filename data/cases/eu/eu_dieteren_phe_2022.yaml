- passage_id: sp_2
  source_document_id: eu_dieteren_phe_2022_decision
  page: '5'
  quote_snippet: Almost all customers, and a majority of competitors,23 indicated that vehicle
    glass repair should be considered as distinct from other, general types of repair.24 The
    reasons given included factors such as vehicle glass repair requires different equipment
    and expertise compared to general vehicle repair, customer expectations and the level of
    service are different (for example on-site intervention is a trend in vehicle glass repair),
    and glass repair is more commonly dealt with separately to general repairs, because glass
    repair is more frequently needed.
  extraction_method: pdf_extracted
