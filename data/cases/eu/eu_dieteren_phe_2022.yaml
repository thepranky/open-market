product_markets_considered:
- market_id: pm_1
  name: Vehicle glass repair and replacement services (light vehicles under 3.5 tonnes)
  definition_status: considered
  notes: The Commission decided to assess the transaction on the basis of a product market for
    vehicle glass repair for light vehicles (under 3.5 tonnes), covering services by both specialist
    glass repairers and independent garages, without further segmentation between repair and
    replacement. Significant differences in pricing, expertise, and service between specialist
    repairers and independent garages were noted for competitive assessment.
- market_id: pm_2
  name: Wholesale supply of automotive spare parts to the IAM channel (light vehicles)
  definition_status: considered
  notes: The Commission decided to consider a separate market for the wholesale supply of automotive
    spare parts to the IAM channel for light vehicles, distinct from the OEM channel. No further
    distinction by product type was deemed pertinent.
- market_id: pm_3
  name: Wholesale supply of VW-branded OE spare parts (light vehicles) by the OEM channel
  definition_status: considered
  notes: The Commission decided to consider a separate market for the wholesale supply of VW-branded
    OE spare parts for light vehicles by the OEM channel, distinct from the IAM channel and
    brand-specific. However, this market was not further examined as it did not give rise to
    horizontally or vertically affected markets.
geographic_markets_considered:
- market_id: gm_1
  name: Vehicle glass repair and replacement services — national (France affected)
  definition_status: defined
  notes: The Commission concluded that the market for vehicle glass repair and replacement services
    is national in scope and covers all of metropolitan France, based on precedents, localized
    demand for dense networks, and homogeneous supply-side conditions and prices across the
    country.
- market_id: gm_2
  name: Wholesale supply of automotive spare parts to the IAM channel (light vehicles) — EEA-wide,
    national or regional (France affected)
  definition_status: left_open
  notes: For France, the Commission found that while suppliers cover the entire territory, the
    market investigation results were not conclusive regarding whether independent retailers
    have a similar choice of wholesalers across France, and conditions for competition may differ
    regionally. Thus, it was not necessary to conclude on the exact geographic market definition,
    which could be EEA-wide, national, or regional.
- market_id: gm_3
  name: Wholesale supply of automotive spare parts to the IAM channel (light vehicles) — national
    (Belgium affected)
  definition_status: considered
  notes: For Belgium, the Commission's market investigation indicated that the market for wholesale
    supply of automotive spare parts to the IAM is national in scope rather than regional, with
    suppliers covering the entire territory and similar conditions of competition across the
    country. The competitive assessment in Belgium would therefore focus on national markets.
- market_id: gm_4
  name: Wholesale supply of VW-branded OE spare parts (light vehicles) by the OEM channel —
    national (Belgium affected)
  definition_status: considered
  notes: For Belgium, the Commission's market investigation indicated that the market for wholesale
    supply of VW-branded OE spare parts is national in scope rather than regional. Although
    some respondents indicated purchases from outside Belgium, the competitive assessment in
    Belgium would focus on national markets. This market was not further examined for harm.
