    of a product market for vehicle glass repair for light vehicles (under 3.5 tonnes), covering
    vehicle glass repair by both specialist glass repairers and independent garages. However,
    the Commission also notes that there are significant differences in pricing, expertise and
    service provided between the specialist repairers and independent garages and these differences
    will be taken into account further in the competitive assessment.
