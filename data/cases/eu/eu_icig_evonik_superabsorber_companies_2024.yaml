product_markets_considered:
- market_id: pm_1
  name: Phenothiazine
  definition_status: considered
  notes: The Commission considered Phenothiazine (PTZ) as a separate product market distinct
    from other polymer inhibitors, based on lack of demand-side substitutability and price differences.
    While sub-segmentation by form and end-use was investigated, these were ultimately left
    open.
- market_id: pm_2
  name: Phenothiazine prills
  definition_status: considered
  notes: While the broader segmentation of PTZ by form (prills, flakes, powder, liquid) was
    left open, the Commission undertook its assessment considering the narrowest possible product
    market of PTZ prills due to strong customer preference in the EEA and safety risks associated
    with powder and flake forms.
- market_id: pm_3
  name: Acrylic Acid
  definition_status: considered
  notes: The Commission considered a plausible segmentation of the market for acrylic acid between
    crude acrylic acid (CAA) and glacial acrylic acid (GAA). This aligns with its previous decisional
    practice, and the majority of responding customers agreed with this segmentation. Acrylate
    esters were not further discussed as the Parties do not produce them.
- market_id: pm_4
  name: Superabsorbent polymers
  definition_status: left_open
  notes: The Commission left open the exact product market definition for superabsorbent polymers,
    consistent with previous decisional practice. However, it considered plausible segmentations
    including superabsorbent polymers overall, higher quality superabsorbent polymers, and lower
    quality superabsorbent polymers for its assessment.
geographic_markets_considered:
- market_id: gm_1
  name: Phenothiazine — at least EEA-wide
  definition_status: considered
  notes: While there were indications that the PTZ market is global in scope, the Commission
    considered the geographic market for PTZ to be at least EEA-wide for the purposes of its
    decision, based on mixed market investigation results regarding conditions of competition,
    price differences, and limited barriers to entry.
- market_id: gm_2
  name: Acrylic Acid — EEA-wide
  definition_status: left_open
  notes: The Commission left open the exact scope of the geographic market for acrylic acid,
    consistent with previous decisional practice. However, it carried out its assessment at
    the narrowest plausible geographic market, i.e., at EEA level, citing material price differences,
    local presence requirements, and barriers to entry in the EEA.
- market_id: gm_3
  name: Superabsorbent polymers — EEA-wide
  definition_status: left_open
  notes: The Commission left open the exact scope of the geographic market for superabsorbent
    polymers, acknowledging that it could be either EEA-wide or global, consistent with previous
    decisional practice. For its assessment, it proceeded at the narrowest plausible geographic
    market, i.e., at EEA level.
