    between PTZ and other polymer inhibitors. While views expressed by competing manufacturers
    of PTZ are divided as regards the question whether it is possible to substitute PTZ with
    another chemical to produce acrylic acid,21 the majority of responding customers of PTZ
    consider that it is not possible to substitute PTZ with any other chemical to produce acrylic
    acid irrespective of whether the acrylic acid is then used to produce superabsorbent polymers22
