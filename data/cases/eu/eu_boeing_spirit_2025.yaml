  page: '12'
  quote_snippet: Findings from the market investigation suggest that there is a separate market
    for heavy lifting military helicopters. This is because when key user requirements are set
    by a customer, those requirements cannot be met by several smaller helicopters. (58) Only
    heavy lifting helicopters are able to carry a certain size, e.g., a military vehicle. In
    addition, the footprint differs, and there would be a need for multiple crews to operate
    the two helicopters. (59)
