    on a global basis. Moreover, prices for different large commercial aircraft are quoted on
    a worldwide basis and do not differ according to a geographic region. In addition, large
    commercial aircraft customers organise procurement of large commercial aircraft on a global
    basis. Lastly, there are no material barriers to supplying large commercial aircraft customers
    on a global basis. (27)
