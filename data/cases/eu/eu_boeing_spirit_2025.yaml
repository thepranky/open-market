  page: '10'
  quote_snippet: The Commission considers that the question whether the relevant product market
    is (i) the overall market for business jets or (ii) should be further segmented between
    types of aircrafts (light, medium or large), can be left open. Indeed, the Transaction does
    not raise competition concerns on the overall market for business jets (including all sizes)
    (43), nor on the potential market for light/medium business jets where Boeing is not active.
    Hence, for the purpose of this decision, the Commission will assess the competitive impact
    of the Transaction on the narrowest plausible product market definition – business jets
    based on large commercial aircrafts - where the Transaction raises competition concerns.
