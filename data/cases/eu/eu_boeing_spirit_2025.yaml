  page: '5'
  quote_snippet: The results of the market investigation confirmed that the markets for various
    aerostructures, such as fuselage structures, wing structures with segments for slat systems
    and flap systems, pylon structures, nacelles with segments for thrust reversers and other
    nacelle components, and empennage structures are global in scope. Aerostructure suppliers
    organise their production and sales on a global basis. Moreover, prices of various aerostructures
    are quoted on a worldwide basis and do not differ according to a geographic region. Furthermore,
    aerostructure customers organise procurement of aerostructures on a global basis. Lastly,
    there are no material barriers to supplying aerostructure customers on a global basis. (19)
