product_markets_considered:
- market_id: pm_1
  name: Fuselage structures
  definition_status: considered
  notes: The Commission considered it appropriate to assess the effects of the Transaction in
    relation to the relevant product markets for various aerostructures, including fuselage
    structures, while leaving the exact product market definition open for the competitive non-horizontal
    analysis.
- market_id: pm_2
  name: Wing structures with segments for slat systems and flap systems
  definition_status: considered
  notes: The Commission considered it appropriate to assess the effects of the Transaction in
    relation to the relevant product markets for various aerostructures, including wing structures,
    while leaving the exact product market definition open for the competitive non-horizontal
    analysis.
- market_id: pm_3
  name: Pylon structures
  definition_status: considered
  notes: The Commission considered it appropriate to assess the effects of the Transaction in
    relation to the relevant product markets for various aerostructures, including pylon structures,
    while leaving the exact product market definition open for the competitive non-horizontal
    analysis.
- market_id: pm_4
  name: Nacelles with segments for thrust reversers and other nacelle components
  definition_status: considered
  notes: The Commission considered it appropriate to assess the effects of the Transaction in
    relation to the relevant product markets for various aerostructures, including nacelles,
    while leaving the exact product market definition open for the competitive non-horizontal
    analysis.
- market_id: pm_5
  name: Empennage structures
  definition_status: considered
  notes: The Commission considered it appropriate to assess the effects of the Transaction in
    relation to the relevant product markets for various aerostructures, including empennage
    structures, while leaving the exact product market definition open for the competitive non-horizontal
    analysis.
- market_id: pm_6
  name: Single-aisle large commercial aircraft with the segment for aircraft with 120-200 seats
  definition_status: considered
  notes: The Commission stated that the exact definition of the relevant product market could
    be left open, but for the competitive analysis, it would assess the effects of the Transaction
    on the narrowest plausible market for single aisle large commercial aircraft with the segment
    for aircraft with 120-200 seats.
- market_id: pm_7
  name: Twin-aisle large commercial aircraft
  definition_status: considered
  notes: The Commission stated that the exact definition of the relevant product market could
    be left open, but for the competitive analysis, it would assess the effects of the Transaction
    on the market for twin-aisle large commercial aircraft.
- market_id: pm_8
  name: Business jets
  definition_status: left_open
  notes: The Commission considered the overall market for business jets, potentially further
    segmented into light/medium business jets and business jets based on larger commercial aircrafts.
    However, it explicitly left open the question of whether further segmentation was needed,
    as the transaction did not raise competition concerns on the overall market or the light/medium
    segment.
- market_id: pm_9
  name: Business jets based on large commercial aircraft
  definition_status: considered
  notes: While leaving the overall market definition for business jets open, the Commission
    decided to assess the competitive impact of the Transaction on this narrowest plausible
    segment where the Transaction raised competition concerns.
- market_id: pm_10
  name: Airborne Early Warning and Control (AEW&C) aircrafts
  definition_status: considered
  notes: The Commission considered it appropriate to assess the competitive assessment on the
    basis of this narrowest plausible market, while leaving the exact product market definition
    open as the Transaction did not raise serious doubts on any plausible definition.
- market_id: pm_11
  name: Military helicopters
  definition_status: left_open
  notes: The Commission's decisional practice identified distinct product markets for military
    helicopters. While market investigation suggested a separate market for heavy lifting military
    helicopters, the overall market definition for helicopters was ultimately left open as the
    Transaction did not give rise to competition concerns regardless of the definition.
geographic_markets_considered:
- market_id: gm_1
  name: Fuselage structures — global
  definition_status: considered
  notes: The Commission's market investigation confirmed that markets for various aerostructures
    are global in scope, and it considered it appropriate to assess the effects of the Transaction
    in relation to global markets for these products.
- market_id: gm_2
  name: Wing structures with segments for slat systems and flap systems — global
  definition_status: considered
  notes: The Commission's market investigation confirmed that markets for various aerostructures
    are global in scope, and it considered it appropriate to assess the effects of the Transaction
    in relation to global markets for these products.
- market_id: gm_3
  name: Pylon structures — global
  definition_status: considered
  notes: The Commission's market investigation confirmed that markets for various aerostructures
    are global in scope, and it considered it appropriate to assess the effects of the Transaction
    in relation to global markets for these products.
- market_id: gm_4
  name: Nacelles with segments for thrust reversers and other nacelle components — global
  definition_status: considered
  notes: The Commission's market investigation confirmed that markets for various aerostructures
    are global in scope, and it considered it appropriate to assess the effects of the Transaction
    in relation to global markets for these products.
- market_id: gm_5
  name: Empennage structures — global
  definition_status: considered
  notes: The Commission's market investigation confirmed that markets for various aerostructures
    are global in scope, and it considered it appropriate to assess the effects of the Transaction
    in relation to global markets for these products.
- market_id: gm_6
  name: Single-aisle large commercial aircraft with the segment for aircraft with 120-200 seats
    — global
  definition_status: considered
  notes: The Commission consistently found markets for aircraft manufacturing, with the exception
    of military aircraft, to be worldwide in scope. Market investigation confirmed this for
    large commercial aircraft.
- market_id: gm_7
  name: Twin-aisle large commercial aircraft — global
  definition_status: considered
  notes: The Commission consistently found markets for aircraft manufacturing, with the exception
    of military aircraft, to be worldwide in scope. Market investigation confirmed this for
    large commercial aircraft.
- market_id: gm_8
  name: Business jets based on large commercial aircraft — global
  definition_status: considered
  notes: The Commission consistently found markets for aircraft manufacturing, with the exception
    of military aircraft, to be worldwide in scope. This conclusion was extended to business
    jets based on large commercial aircraft, the only segment where Boeing is active.
- market_id: gm_9
  name: Airborne Early Warning and Control aircrafts — national / international export (segmented)
  definition_status: segmented
  notes: The Commission's decisional practice and market investigation confirmed a segmentation
    into national markets for countries with domestic suppliers and international export markets
    (excluding countries with domestic suppliers or supply restrictions) for countries without
    domestic suppliers.
- market_id: gm_10
  name: Military helicopters — national / worldwide (segmented)
  definition_status: segmented
  notes: The Commission's decisional practice and market investigation confirmed a segmentation
    where the market is national for countries with a national helicopter industry, but worldwide
    (excluding Russia and China due to export restrictions) for markets without domestic production.
