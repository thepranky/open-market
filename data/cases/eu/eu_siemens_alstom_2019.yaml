sector: transport
outcome: blocked
procedure_stage: phase2
decision_date: '2019-02-06'
parties:
- name: Siemens
  role: acquirer
- name: Alstom
  role: target
source_documents:
- doc_id: eu_siemens_alstom_2019_decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.8677
  pdf_url: https://ec.europa.eu/competition/mergers/cases1/20219/m8677_9376_7.pdf
  title: Siemens / Alstom — Decision
  doc_type: decision
product_markets_considered:
- market_id: pm_1
  name: High and very high-speed trains
  definition_status: defined
  notes: The Commission considered that the market could be further sub-segmented
    on the basis of speed, distinguishing 'very high-speed trains' (equal to or above
    300 km/h) as a narrower market, but left this question open as the transaction
    raised competition concerns under both definitions. Therefore, the assessment
    was carried out on the overall market for high and very high-speed trains and
    on the narrower market for very high-speed trains.
- market_id: pm_2
  name: Mainline signalling
  definition_status: defined
  notes: Distinguished from urban signalling.
- market_id: pm_3
  name: Urban signalling
  definition_status: defined
  notes: Distinguished from mainline signalling.
- market_id: pm_4
  name: Mainline signalling projects
  definition_status: defined
  notes: Distinguished from mainline signalling products. This market is further segmented
    into various sub-systems.
- market_id: pm_5
  name: Mainline signalling products
  definition_status: defined
  notes: Distinguished from mainline signalling projects.
- market_id: pm_6
  name: Mainline signalling maintenance services
  definition_status: left_open
  notes: The question of whether there is a distinct market for services was left
    open, as neither party supplies signalling services to third parties, meaning
    the transaction would have no impact on the merchant market for these services.
- market_id: pm_7
  name: Legacy OBU projects
  definition_status: defined
  notes: Segmented from ETCS projects. Also, the segmentation of OBUs based on installation
    (new rolling stock vs. retrofitting existing) and by ETCS level (Level 1 vs. Level
    2) was not warranted by the Commission.
- market_id: pm_8
  name: ETCS OBU projects
  definition_status: defined
  notes: Segmented from Legacy projects. The segmentation of OBUs based on installation
    (new rolling stock vs. retrofitting existing) and by ETCS level (Level 1 vs. Level
    2) was not warranted by the Commission.
- market_id: pm_9
  name: Legacy ATP wayside projects
  definition_status: defined
  notes: Segmented from ETCS projects. The segmentation by project size for ATP wayside
    overlay and re-signalling projects was not warranted by the Commission.
- market_id: pm_10
  name: Standalone ETCS ATP wayside (overlay) projects
  definition_status: defined
  notes: Segmented from re-signalling projects. The segmentation by ETCS level (Level
    1 vs. Level 2) and by project size was not warranted by the Commission.
- market_id: pm_11
  name: Standalone interlocking projects
  definition_status: defined
  notes: Distinct from re-signalling projects. Segmentation by technology type (non-electronic
    vs. computer-based) or project size was not warranted by the Commission.
- market_id: pm_12
  name: ETCS ATP wayside re-signalling projects (bundle of ETCS ATP wayside and interlockings)
  definition_status: defined
  notes: Segmented from overlay projects. This is explicitly defined as a bundle of
    ETCS ATP wayside and interlockings. The segmentation by ETCS level (Level 1 vs.
    Level 2) and by project size was not warranted by the Commission. The distinction
    between greenfield and brownfield projects was also not warranted.
geographic_markets_considered:
- market_id: gm_1
  name: High and very high-speed trains — EEA-wide (excluding China, Japan, Korea
    affected)
  definition_status: considered
  notes: The Commission concluded the market is at least EEA-wide and includes Switzerland.
    It also stated it 'cannot exclude that the relevant markets are broader and cover
    the rest of the world, excluding China, Japan and South Korea' due to insurmountable
    barriers to entry in those countries. This phrasing indicates a 'considered' status
    as it is not a definitive 'defined' worldwide market but rather a recognition
    of its potential broader scope for assessment purposes.
- market_id: gm_2
  name: ETCS OBU projects — EEA-wide
  definition_status: defined
  notes: null
- market_id: gm_3
  name: Legacy OBU projects — national
  definition_status: defined
  notes: null
- market_id: gm_4
  name: Standalone interlocking projects — national
  definition_status: defined
  notes: null
- market_id: gm_5
  name: Standalone ETCS ATP wayside (overlay) projects — EEA-wide
  definition_status: defined
  notes: null
- market_id: gm_6
  name: ETCS ATP wayside re-signalling projects (bundle of ETCS ATP wayside and interlockings)
    — EEA-wide
  definition_status: defined
  notes: null
