  page: '30'
  quote_snippet: For the reasons set out in Section 5.2.1 and in light of the results
    of the investigation, the Commission considers that trains capable of speeds equal
    to and above 250 km/h ("high and very high-speed trains") should be considered
    as a separate product market, distinct from intercity trains which are incapable
    of delivering the same service speed.
