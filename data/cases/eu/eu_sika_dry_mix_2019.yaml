case_id: eu_sika_dry_mix_2019
case_name: "Sika / Financière Dry Mix Solutions"
jurisdiction: EU
authority: European Commission
authority_reference: M.9276
decision_date: "2019-03-27"
case_type: merger
procedure_stage: phase1
sector: industrials / construction chemicals

parties:
  - name: Sika AG
    role: acquirer
  - name: Financière Dry Mix Solutions
    role: target

outcome: cleared

remedies: []
theories_of_harm: []

product_markets_considered:
  - market_id: pm_1
    name: Construction dry premix mortar
    definition_status: defined
    notes: >
      Commission concluded this is a separate product market, distinguished from
      tile-fixing dry premix mortar and other mortar types. Segmentation based on (i)
      place of mixing, (ii) physical form (dry), and (iii) final application (construction),
      confirmed by market investigation (sp_2) and Commission conclusion (sp_1). Geographic
      assessment conducted at national level; precise scope left open (sp_19).

  - market_id: pm_2
    name: Tile-fixing dry premix mortar
    definition_status: defined
    notes: >
      Commission concluded this is a separate product market from construction dry premix
      mortar. Tile-fixing dry premix mortar is more expensive and used for fixing tiles.
      Distinction confirmed by price evidence (sp_5) and Commission conclusion (sp_4).
      Geographic assessment conducted at national level; precise scope left open (sp_19).

  - market_id: pm_3
    name: Chemical-based concrete and mortar admixtures
    definition_status: defined
    notes: >
      Commission concluded that chemical-based and mineral-based admixtures constitute
      separate product markets. No further distinction made within chemical-based admixtures.
      Segmentation confirmed by market investigation (sp_8) and Commission conclusion (sp_7).
      Geographic assessment conducted nationally; France is the affected country.

  - market_id: pm_4
    name: Structural reinforcing/strengthening (concrete works)
    definition_status: defined
    notes: >
      Commission confirmed structural reinforcing/strengthening is a separate product market
      within concrete works, in line with prior decisional practice (sp_18). Market investigation
      confirmed the sub-segmentation (sp_10). The Parties referred to overlap in France and the
      UK, but the extracted affected-market assessment is France-focused. Geographic assessment
      conducted nationally.

  - market_id: pm_5
    name: PU sealants for DIY/consumers
    definition_status: defined
    notes: >
      Commission concluded PU sealants for DIY/consumers should be considered a separate product
      market, segmented by target consumer group (DIY/consumer) and technology (polyurethane),
      confirmed by market investigation (sp_13) and Commission conclusion (sp_12). Geographic
      assessment conducted nationally; France is the affected country.

  - market_id: pm_6
    name: ETICS (External Thermal Insulation Composite Systems)
    definition_status: defined
    notes: >
      Commission treated ETICS as a separate product market, distinct from other insulation
      systems (sp_15). Market investigation confirmed ETICS do not compete with other insulation
      systems and noted a component vs. system sales distinction (sp_16). That component/system
      nuance is recorded as context but not separately encoded as a product market in this record.
      Geographic assessment conducted nationally; Spain is the affected country.

geographic_markets_considered:
  - market_id: gm_1
    name: "Dry premix mortars — national (France affected)"
    definition_status: left_open
    notes: >
      Commission concluded the precise geographic market definition for construction dry premix
      and tile-fixing dry premix mortars can be left open, as competition concerns do not arise
      under any plausible definition (sp_19). Competitive assessment conducted at national level;
      France is the affected country.

  - market_id: gm_2
    name: "Chemical-based concrete and mortar admixtures — national (France affected)"
    definition_status: considered
    notes: >
      Commission considered the relevant geographic market for chemical-based admixtures to be
      national in scope for the purpose of this decision (sp_20). France is the affected country.

  - market_id: gm_3
    name: "Structural reinforcing/strengthening — national (France affected)"
    definition_status: considered
    notes: >
      Commission considered the relevant geographic market for structural reinforcing/strengthening
      to be national in scope for the purpose of this decision (sp_21). France is the affected
      country.

  - market_id: gm_4
    name: "PU sealants for DIY/consumers — national (France affected)"
    definition_status: considered
    notes: >
      Commission considered the relevant geographic market for PU sealants for DIY/consumers to
      be national in scope for the purpose of this decision (sp_22). France is the affected country.

  - market_id: gm_5
    name: "ETICS — national (Spain affected)"
    definition_status: considered
    notes: >
      Commission considered the relevant geographic market for ETICS to be national in scope for
      assessing the Transaction (sp_23). Spain is the affected country.

