- passage_id: sp_8
  source_document_id: eu_icg_holding_uriach_uriach_2024_decision
  page: '9'
  quote_snippet: As explained above, the Commission consistently defines the different plausible
    markets for OTC products as national in scope. The market investigation did not provide
    any indications that would require the Commission to depart from its previous decisional
    practice on the geographic scope of the different plausible product markets that are vertically
    affected. Therefore, for the purposes of this decision, the Commission considers the geographic
    scope of the different plausible upstream markets to be national in scope.
  extraction_method: pdf_extracted
