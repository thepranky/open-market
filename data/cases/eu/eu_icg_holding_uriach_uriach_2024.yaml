- passage_id: sp_3
  source_document_id: eu_icg_holding_uriach_uriach_2024_decision
  page: '9'
  quote_snippet: The Commission therefore considers all national markets at either OTC 3, OTC
    4 or narrower level based on a specific formulation/ingredient as plausible product markets,
    and on that basis identified 4 plausible markets that give rise to vertically affected links
    (namely 1A1 – Antinauseants (paediatrics) in Spain, 11A1M - Antinauseants (mixed / oral)
    in Spain, 3C1C – Fibre laxatives (capsules) in Spain, and 4D1M - Plain Vitamin C (Mixed/Oral)
    in France).
  extraction_method: pdf_extracted
