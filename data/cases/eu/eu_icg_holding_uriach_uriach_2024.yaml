  name: OTC products
  definition_status: considered
  notes: The Commission typically takes into account the OTC classification (OTC 2 to OTC 4
    levels, and specific formulation/ingredients). While specific upstream markets that are
    vertically affected were left open, the general approach to market definition for OTC products
    involving these classifications was consistently considered for analysis.
- market_id: pm_2
  name: Retail supply of beauty, health and well-being products
  definition_status: left_open
  notes: While the Commission has in the past considered a broad market with potential sub-segments
    for the retail supply of beauty, health and well-being products, for the purpose of this
    decision, the precise product market definition was left open as no competition concerns
    arose.
