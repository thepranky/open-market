  source_document_id: eu_icg_holding_uriach_uriach_2024_decision
  page: '5'
  quote_snippet: In previous decisions dealing with OTC products, the Commission has referred
    to the OTC 3 level as the starting point for defining the relevant product market in OTC
    markets.10 However, the Commission has recognised that it is sometimes necessary to carry
    out analyses at the narrower classification level OTC 4,11 or possibly even at the level
    of the specific formulation/ingredients of the different products.12
