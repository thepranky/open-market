- doc_id: eu_hedin_delta_auto_2023_decision
  title: HEDIN / DELTA AUTO — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.11116
  pdf_url: http://publications.europa.eu/resource/cellar/a1fbab0f-724c-11ee-9220-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Retail distribution of new PCs and/or LCVs
  definition_status: left_open
  notes: The Commission considered, but left open, a distinction between the retail distribution
    of PCs and LCVs. The exact market definition was left open, but the effects were analysed
    based on separate markets for PCs and LCVs.
- market_id: pm_2
  name: Retail distribution of new PCs
  definition_status: considered
  notes: For the purpose of the decision, the Commission analysed the effects on this market
    as the narrowest plausible product market, considering it separately from LCVs.
- market_id: pm_3
  name: Retail distribution of new LCVs
  definition_status: considered
  notes: For the purpose of the decision, the Commission analysed the effects on this market
    as the narrowest plausible product market, considering it separately from PCs.
geographic_markets_considered:
- market_id: gm_1
  name: Retail distribution of new PCs and/or LCVs — EEA-wide
  definition_status: left_open
  notes: The geographic scope (EEA-wide, national, or local) was left open as the transaction
    did not raise serious doubts under any plausible definition.
- market_id: gm_2
  name: Retail distribution of new PCs and/or LCVs — national (Finland affected)
  definition_status: left_open
  notes: The geographic scope (EEA-wide, national, or local) was left open. The market investigation
    pointed to a national scope, but affected markets only arose at the local level.
- market_id: gm_3
  name: Retail distribution of new PCs and/or LCVs — local (Finland affected)
  definition_status: left_open
  notes: The geographic scope (EEA-wide, national, or local) was left open. However, the Commission
    analysed the effects on a local basis, as defined by the Notifying Party (cities with surrounding
    municipalities), because affected markets would only arise at this level.
- market_id: gm_4
  name: Retail distribution of new PCs — local (Lahti region affected)
  definition_status: considered
  notes: This specific local market was identified as one of the horizontally affected markets
    where competitive effects were assessed. The Lahti region is defined as the administrative
    region of Päijät-Häme, including the city of Lahti and surrounding municipalities.
- market_id: gm_5
  name: Retail distribution of new PCs — local (Jyväskylä region affected)
  definition_status: considered
  notes: This specific local market was identified as one of the horizontally affected markets
    where competitive effects were assessed. The Jyväskylä region is defined as part of the
    administrative region Keski-Suomi, corresponding to the city of Jyväskylä and surrounding
    municipalities.
- market_id: gm_6
  name: Retail distribution of new LCVs — local (Turku region affected)
  definition_status: considered
  notes: This specific local market was identified as one of the horizontally affected markets
    where competitive effects were assessed. The Turku region is defined as part of the administrative
    region Varsinais-Suomi, corresponding to the city of Turku and surrounding municipalities.
