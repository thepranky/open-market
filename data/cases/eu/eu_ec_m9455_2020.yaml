- passage_id: sp_2
  source_document_id: eu_ec_m9455_2020_decision
  page: '8'
  quote_snippet: In previous decisions, the Commission considered whether the market for contract
    foodservices should be further segmented according to the sectors in which the cus-tomers
    of contract foodservices are active, namely into (i) business & industry (staff canteens
    in both public and private sectors), (ii) healthcare (hospitals, nursing homes), and (iii)
    education (schools, universities), and (iv) defence and other.
  extraction_method: pdf_extracted
