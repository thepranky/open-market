product_markets_considered:
- market_id: pm_1
  name: Contract foodservices
  definition_status: defined
  notes: The Commission defines contract foodservices as distinct from concession foodservices.
    It explicitly includes catering for business meetings, kiosk and café services, and vending
    services within the scope of contract foodservices, while excluding non-food related other
    support services.
- market_id: pm_2
  name: Contract foodservices segmented by customer industry
  definition_status: left_open
  notes: The Commission considered whether the market for contract foodservices should be further
    segmented by customer industry (business & industry, healthcare, education, defence). The
    market investigation delivered mixed results, and the Commission ultimately left the question
    open. However, for the competitive assessment, the Commission explicitly states it will
    assess the transaction on the basis of these identifiable relevant sectors.
geographic_markets_considered:
- market_id: gm_1
  name: Contract foodservices to business & industry customers — national (Sweden affected)
  definition_status: defined
  notes: The Commission found that the relevant geographic market for contract foodservices
    is national due to differences in legislation, national preferences, and competitive conditions.
    This applies to the business & industry segment in Sweden.
- market_id: gm_2
