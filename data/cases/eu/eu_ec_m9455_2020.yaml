- passage_id: sp_4
  source_document_id: eu_ec_m9455_2020_decision
  page: '10'
  quote_snippet: In line with the Commission’s precedents and considering that the results of
    the Commission’s market investigation were mixed, the Commission concludes that, for the
    purpose of this Decision, the question whether the market for contract foodser-vices should
    be segmented on the basis of customer’s sector can in principle be left open.
  extraction_method: pdf_extracted
