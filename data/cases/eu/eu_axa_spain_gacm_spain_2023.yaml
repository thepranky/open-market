  source_document_id: eu_axa_spain_gacm_spain_2023_decision
  page: '3'
  quote_snippet: (8) The Commission considered in past decisions whether separate markets exist
    for public and for private hospital services. The Commission found that this distinction
    depends on the way healthcare systems are structured, regulated, and funded in each Member
    State. For example, the Commission found that separate markets exist for private and for
    public hospital services in the UK and Greece, while the Commission has consistently held
    that the market for hospital services in Germany comprises both public and private hospitals.
    The Commission has not considered in past decisions whether separate markets exist for public
    and for private hospital services in Spain.
  extraction_method: pdf_extracted
