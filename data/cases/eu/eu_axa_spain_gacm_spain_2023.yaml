  quote_snippet: (21) Under the Non-Horizontal Merger Guidelines, a transaction with vertically
    affected markets may significantly impede effective competition if the merger gives rise
    to foreclosure. Foreclosure occurs where actual or potential competitors’ access to supplies
    or markets is hampered or eliminated as a result of the merger, thereby reducing those companies’
    ability and/or incentive to compete.
