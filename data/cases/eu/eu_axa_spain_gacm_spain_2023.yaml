- passage_id: sp_2
  source_document_id: eu_axa_spain_gacm_spain_2023_decision
  page: '3'
  quote_snippet: (7) Under all potential market delineations, the Parties’ combined market shares
    remain below 20% (for horizontal relationships), and their combined or individual market
    shares below 30% (for vertical relationships). The only exception is the vertical relationship
    between the provision of inpatient private hospital services in the province of Cantabria
    (upstream), in which AXA Spain holds a market share of [30-40]% and the provision of healthcare
    insurance in Spain (downstream), which results in vertically affected markets only when
    considering the narrowest possible segment for the provision of hospital services, namely
    private inpatient hospitals. Through its ownership of Hospital Mompía in the region of Cantabria,
    AXA Spain is active in the provision of inpatient private hospital services and both Parties
    are active in the provision of healthcare insurance across Spain with a combined market
    share of [0-5]%.
