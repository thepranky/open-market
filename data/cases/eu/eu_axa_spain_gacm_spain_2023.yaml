- passage_id: sp_17
  source_document_id: eu_axa_spain_gacm_spain_2023_decision
  page: '7'
  quote_snippet: '(27) The Notifying Party submits that the Parties would have neither the ability
    nor the incentive to engage in any input or customer foreclosure because AXA Spain’s market
    share upstream only […] exceeds the 30% threshold under the narrowest plausible product
    and geographic market definition and the Parties have a negligible market position downstream.
    The Commission considers that the Transaction does not raise concerns in relation to an
    input foreclosure theory of harm. Despite AXA Spain’s market share upstream ([30-40]% in
    the province of Cantabria), the Transaction will not lead to any competition concerns considering
    that AXA Spain would not have neither the ability nor an incentive to foreclose because:
    (i) AXA Spain’s market share on the upstream market for the provision of inpatient private
    hospital services only […] exceeds the 30% threshold; and (ii) there is sufficient competition
    that will remain on the market upstream, as there is a number of inpatient private hospitals
    in the region of Cantabria that will continue to exert sufficient competitive pressure on
    the Parties (as indicated in Table 1 below).'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-12'
  supports_markets: []
  supports_geographic_markets: []
