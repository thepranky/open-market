- passage_id: sp_18
  source_document_id: eu_axa_spain_gacm_spain_2023_decision
  page: '7'
  quote_snippet: (28) The Commission considers that the Transaction does not raise any concerns
    in relation to a customer foreclosure theory of harm, considering that the Parties’ combined
    market shares in the downstream market for the provision of healthcare insurance services
    are at below 30% under any plausible product and geographic market definition, which evidently
    indicates that the Parties will have no ability to engage in customer foreclosure post-Transaction.
    In light of that, the Parties would also not have any incentive in pursuing a customer foreclosure
    strategy. The lack of any potential effects is further evidenced by the fact that this vertical
    relationship pre-dates the Transaction and the Target accounts for only a de minimis share
    of demand at the national level as well as in the province of Cantabria ([0-5]% and [0-5]%
    respectively). Consequently, the Transaction will not give rise to any competition concerns
    because of customer foreclosure.
  extraction_method: pdf_extracted
