product_markets_considered:
- market_id: pm_1
  name: Gaming and betting services
  definition_status: left_open
  notes: The Commission considered whether the market could be segmented between (i) games;
    (ii) bets (horseracing and sports betting); and (iii) gaming machines, and also between
    physical and online channels. However, it ultimately left open the question of whether different
    types of services constitute a single product market.
- market_id: pm_2
  name: B2B licensing of games
  definition_status: left_open
  notes: The Notifying Parties submitted that the relevant market is the market for the business-to-business
    licensing of online games. The Commission noted that in previous decisions concerning 'development
    and publishing of game software' (which the Target submits is similar), it left open whether
    that market should be segmented by online/offline, platform, or game genre. Given the de
    minimis activities of the Target, the exact delineation of this market was left open in
    the present case.
geographic_markets_considered:
- market_id: gm_1
  name: Gaming and betting services — national (Germany, Austria, Italy, Spain, Belgium, France,
    Luxembourg, Malta, Netherlands, Portugal, Romania, Serbia, Switzerland affected)
  definition_status: considered
  notes: The Commission considered the geographic market for gaming and betting services to
    be national, in line with previous decisions, due to differences in demand and national
    regulatory systems.
- market_id: gm_2
  name: B2B licensing of games — EEA-wide or global
  definition_status: left_open
  notes: In previous decisions concerning 'development and publishing of game software', the
    Commission left open whether the geographic scope was EEA-wide or global. For the purpose
    of assessing customer foreclosure, the upstream market for B2B licensing of games was considered
    to be at least EEA-wide. However, given the de minimis activities of the Target, the exact
    geographic delineation was left open in the present case.
