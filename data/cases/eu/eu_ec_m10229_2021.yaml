- passage_id: sp_5
  source_document_id: eu_ec_m10229_2021_decision
  page: '6'
  quote_snippet: In this case, the exact product market definition for direct insurance distribution
    can be left open since the Transaction does not give rise to serious doubts as to its compatibility
    with the internal market or the functioning of the EEA agreement under any plausible market
    for direct distribution (i.e., direct distribution including pure direct distribution; direct
    distribution excluding pure direct distribution; life insurance direct distribution including
    pure direct distribution; life insurance direct distribution excluding pure direct distribution;
    non-life insurance direct distribution including pure direct distribution; and non-life
    insurance direct distribution excluding pure direct distribution). The market for direct
    insurance distribution is hereinafter referred as the market for “insurance distribution”.
  extraction_method: pdf_extracted
