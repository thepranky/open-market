- passage_id: sp_4
  source_document_id: eu_ec_m10229_2021_decision
  page: '6'
  quote_snippet: The Commission previously considered that a distinction could be made between
    the distribution of (i) life and (ii) non-life insurance products, as different providers
    tend to be involved and the distribution of life insurance in Europe is regulated separately
    from other types of insurance but ultimately left the exact product market definition open.25
  extraction_method: pdf_extracted
  review_status: unreviewed
