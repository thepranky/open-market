- passage_id: sp_3
  source_document_id: eu_ec_m10229_2021_decision
  page: '5'
  quote_snippet: The Commission has previously identified a market for the distribution of insurance
    products, but has left open the question of whether this market includes only outward channels,
    or both outward channels and pure direct distribution.22 However, for the purposes of this
    Decision, only a market for insurance distribution including both outward channels and pure
    direct distribution is relevant as both Allianz and Aviva Italia are each involved in pure
    direct distribution only (they do not distribute third- party products).23 The remainder
    of this Decision therefore refers to a plausible market for direct insurance distribution
    including both pure direct distribution and other outward channels.24
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
