product_markets_considered:
- market_id: pm_1
  name: Credit and suretyship insurance services
  definition_status: segmented
  notes: The Commission considered credit and suretyship insurance as a distinct market, but
    left open the question of whether this market should be further narrowed into five types
    of services (delcredere insurance, capital goods insurance, consumer credit insurance, fidelity
    insurance, and guarantee insurance).
- market_id: pm_2
  name: Insurance distribution
  definition_status: left_open
  notes: The Commission previously identified a market for the distribution of insurance products,
    but left open whether it includes only outward channels or also pure direct distribution,
    and whether it distinguishes between life and non-life insurance products. For the purpose
    of this Decision, it was left open under any plausible market definition as no concerns
    arose.
geographic_markets_considered:
- market_id: gm_1
  name: Credit and suretyship insurance services — national (Italy affected)
  definition_status: considered
  notes: The Commission considered the geographic scope of the market for credit and suretyship
    insurance and its possible sub-segments to be national for the purposes of this decision,
    consistent with previous decisional practice.
- market_id: gm_2
  name: Insurance distribution — national (Italy affected)
  definition_status: left_open
  notes: The Commission generally considered the market for insurance distribution as national
    in scope, but previously also considered a narrower scope at the level of Italian provinces.
    The question of national versus provincial scope was left open as the transaction raised
    no concerns under either definition.
- market_id: gm_3
  name: Insurance distribution — provincial (Italy affected)
  definition_status: left_open
  notes: The Commission previously considered a geographic market definition at the level of
    Italian provinces for insurance distribution. The question of national versus provincial
    scope was left open as the transaction raised no concerns under either definition.
