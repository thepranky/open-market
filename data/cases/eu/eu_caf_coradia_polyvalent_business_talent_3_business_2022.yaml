- passage_id: sp_2
  source_document_id: eu_caf_coradia_polyvalent_business_talent_3_business_2022_decision
  page: '5'
  quote_snippet: For the purposes of the present decision, the Commission considers that self-propelled
    trains are distinct from locomotive-hauled trains and that, within self-propelled trains,
    mainline trains should be distinguished from both high-speed trains and urban trains. As
    regards mainline trains, the exact product market definition can be left open and the Commission’s
    assessment will focus on all potentially relevant products markets where the Parties overlap,
    namely (i) self-propelled regional trains including all types of traction technology, and
    (ii) self-propelled regional EMUs.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-12'
  supports_markets:
  - pm_2
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_3
  source_document_id: eu_caf_coradia_polyvalent_business_talent_3_business_2022_decision
  page: '3'
  quote_snippet: As regards self-propelled trains, the Commission also distinguished mainline
    trains (running at speeds below 250 km/h) from both high-speed trains (running at speeds
    above 250 km/h) and urban trains (running on urban networks and covering mass transit within
    cities).
  extraction_method: pdf_extracted
  review_status: unreviewed
