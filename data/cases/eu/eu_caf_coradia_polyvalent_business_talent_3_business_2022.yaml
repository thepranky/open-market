  page: '5'
  quote_snippet: For the purposes of this decision, it can be left open whether regional bi-mode
    trains constitute a distinct product market and whether a further delineation between DEMUs,
    BEMUs and HEMUs is warranted. The Commission’s assessment takes into account all plausible
    product market definitions, namely the hypothetical product markets for (i) regional bi-mode
    trains as a whole, and for (ii) DEMUs, (iii) BEMUs, and (iv) HEMUs, considered separately.
