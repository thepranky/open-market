product_markets_considered:
- market_id: pm_1
  name: Self-propelled trains
  definition_status: considered
  notes: The Commission considered self-propelled trains to be distinct from locomotive-hauled
    trains for the purposes of this decision.
- market_id: pm_2
  name: Mainline trains (within self-propelled trains)
  definition_status: considered
  notes: The Commission considered mainline trains distinct from high-speed trains and urban
    trains. The exact product market definition within mainline trains was left open, with the
    assessment focusing on specific segments.
- market_id: pm_3
  name: Self-propelled regional trains (including all types of traction technology)
  definition_status: considered
  notes: The Commission's assessment focused on this market as one of the potentially relevant
    product markets where the parties overlap.
- market_id: pm_4
  name: Self-propelled regional EMUs
  definition_status: considered
  notes: The Commission's assessment focused on this market as one of the potentially relevant
    product markets where the parties overlap.
- market_id: pm_5
  name: Regional bi-mode trains
  definition_status: left_open
  notes: The Commission found evidence supporting the analysis of a plausible separate market
    for regional bi-mode trains, but left open whether it constitutes a distinct product market.
    The assessment considered it as a hypothetical market.
- market_id: pm_6
  name: Regional bi-mode DEMUs
  definition_status: left_open
  notes: The Commission left open whether a further delineation between DEMUs, BEMUs, and HEMUs
    is warranted, but considered DEMUs as a hypothetical market for assessment purposes.
- market_id: pm_7
  name: Regional bi-mode BEMUs
  definition_status: left_open
  notes: The Commission left open whether a further delineation between DEMUs, BEMUs, and HEMUs
    is warranted, but considered BEMUs as a hypothetical market for assessment purposes.
- market_id: pm_8
  name: Regional bi-mode HEMUs
  definition_status: left_open
  notes: The Commission left open whether a further delineation between DEMUs, BEMUs, and HEMUs
    is warranted, but considered HEMUs as a hypothetical market for assessment purposes.
geographic_markets_considered:
- market_id: gm_1
  name: Mainline trains — national or EEA-wide (unconcluded)
  definition_status: left_open
  notes: The market investigation in a precedent case was inconclusive as to whether the relevant
    markets for mainline trains are national or EEA-wide. The Commission noted differences across
    EEA Member States.
- market_id: gm_2
  name: Self-propelled regional trains — national (various countries affected)
  definition_status: considered
  notes: The market investigation findings in the present case are in line with previous decisions,
    pointing towards national markets due to the importance of national manufacturing presence,
    specifications, and requirements. The assessment took into account EEA-wide as well as national
    markets, but specific overlaps in France and Germany were noted.
- market_id: gm_3
  name: Regional bi-mode trains — national or EEA-wide (unconcluded)
  definition_status: left_open
  notes: For bi-mode trains, the Commission left open the geographic market definition, noting
    evidence pointing to both national specifications and pan-European train platforms. The
    assessment took into account both EEA-wide and national markets.
