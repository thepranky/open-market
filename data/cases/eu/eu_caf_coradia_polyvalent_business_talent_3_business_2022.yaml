- passage_id: sp_7
  source_document_id: eu_caf_coradia_polyvalent_business_talent_3_business_2022_decision
  page: '5'
  quote_snippet: As for regional bi-mode trains, the evidence gathered by the Commission in
    the context of its preliminary investigation supports the analysis of a plausible separate
    market for regional bi-mode trains with a further distinction according to the underlying
    technology (i.e. between DEMUs, BEMUs and HEMUs), although there is no univocal support
    for such a finding.
