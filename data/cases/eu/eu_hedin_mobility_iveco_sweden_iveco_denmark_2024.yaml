- passage_id: sp_13
  source_document_id: eu_hedin_mobility_iveco_sweden_iveco_denmark_2024_decision
  page: '3'
  quote_snippet: |
    (5) The Transaction does not have a Community dimension under Article 1(2) or
    Article 1(3) of the EUMR. However, the Parties submitted on 14 February 2024 a
    referral request pursuant to Article 4(5) of the Merger Regulation. On the same
    day, the European Commission sent a Note to the Member States considering that
    the case was an appropriate candidate for a pre-filing referral, including because
    the Transaction constitutes a concentration within the meaning of Article 3(1)(b),
    and that it was notifiable in three EU Member states, i.e., Denmark, Finland and
    Sweden, as well as in Norway. The Member States competent to examine the
    concentration did not express their disagreement to the request for referral within
    15 working days, following which the case is deemed to have EU dimension. The
    Parties were informed on 11 March 2024.
  extraction_method: pdf_extracted
