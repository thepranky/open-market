- passage_id: sp_5
  source_document_id: eu_hedin_mobility_iveco_sweden_iveco_denmark_2024_decision
  page: '7'
  quote_snippet: (25) As with the wholesale distribution of MT, although the responses to the
    market investigation suggest a proximity between the retail distribution of MT and that
    of HT (by comparison with LCV), the Commission also notes that this may be driven in part
    by the product portfolios of the MT OEMs/brands represented at the retail level. The Commission
    therefore considers that the exact product market definition between (i) the retail distribution
    of PC and commercial vehicles, (ii) the retail distribution of commercial vehicles, (iii)
    the retail distribution of MT and HT, and (iv) the retail distribution of MT, can be left
    open, as the Transaction does not give rise to serious doubts as to its compatibility with
    the internal market under any of the plausible product market definitions above.
  extraction_method: pdf_extracted
