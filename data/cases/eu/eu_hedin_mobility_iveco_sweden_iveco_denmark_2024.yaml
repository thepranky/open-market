- passage_id: sp_10
  source_document_id: eu_hedin_mobility_iveco_sweden_iveco_denmark_2024_decision
  page: '9'
  quote_snippet: (38) In any event, because the Transaction does not give rise to serious doubts
    as to its compatibility with the internal market under an EEA-wide market, a national market
    for Sweden, or a market limited to the regional (i.e., sub-national) level, it is not necessary
    to determine the exact geographic scope of the market. For the purposes of this decision,
    the Commission will analyse the effects of the Transaction on the national level, and in
    the regions of Västra Götaland and Skåne (i.e., where the Parties overlap), as affected
    markets would arise only at those levels.
