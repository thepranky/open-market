product_markets_considered:
- market_id: pm_1
  name: Wholesale distribution of new MT
  definition_status: left_open
  notes: The Commission considered the wholesale distribution of MT a plausible candidate product
    market, but ultimately left its exact definition open, examining it alongside broader categories
    such as the wholesale distribution of all vehicles, commercial vehicles, or MT and HT. For
    the purpose of the decision, the analysis focused on a product market limited to the wholesale
    distribution of MT.
- market_id: pm_2
  name: Retail distribution of new MT
  definition_status: left_open
  notes: The Commission considered the retail distribution of MT a plausible candidate product
    market, but ultimately left its exact definition open, examining it alongside broader categories
    such as the retail distribution of PC and commercial vehicles, commercial vehicles, or MT
    and HT. For the purpose of the decision, the analysis focused on a product market limited
    to the retail distribution of MT.
geographic_markets_considered:
- market_id: gm_1
  name: Wholesale distribution of new MT — national (Sweden affected)
  definition_status: left_open
  notes: The Commission left open the exact geographic definition for the wholesale distribution
    of MT between EEA-wide and national markets. However, for the purpose of the decision, the
    effects of the Transaction were analysed at a national level for Sweden, as affected markets
    would only arise at that level.
- market_id: gm_2
  name: Retail distribution of new MT — national (Sweden affected)
  definition_status: left_open
  notes: The Commission left open the exact geographic definition for the retail distribution
    of MT between an EEA-wide market, a national market for Sweden, or sub-national regional
    markets. For the purpose of the decision, the effects were analysed at the national level
    for Sweden.
- market_id: gm_3
  name: Retail distribution of new MT — regional (Västra Götaland and Skåne regions, Sweden
    affected)
  definition_status: left_open
  notes: The Commission left open the exact geographic definition for the retail distribution
    of MT between an EEA-wide market, a national market for Sweden, or sub-national regional
    markets. For the purpose of the decision, the effects were analysed at the regional level
    in Västra Götaland and Skåne, as affected markets would only arise at those levels.
