- passage_id: sp_4
  source_document_id: eu_ec_m9995_2020_decision
  page: '4'
  quote_snippet: (15) As regards the CDMO market for FDPs, further segmentations were considered
    in relation to (i) the pharmaceutical form manufactured (e.g. solids, semi-solids, injectables),
    (ii) the conditions of manufacture (toxicity, sterile environment, etc.), (iii) the type
    of API used for its production and the delivery mechanism used (swallowing, intravenous,
    injection, etc.).11 The Notifying Party suggests to follow this approach in the present
    case.
  extraction_method: pdf_extracted
