- passage_id: sp_1
  source_document_id: eu_ec_m9995_2020_decision
  page: '3'
  quote_snippet: (7) In its previous decisions,4 the Commission used the Anatomical Therapeutic
    Classification (“ATC”) system as the basis for the product market definition. The first
    level (ATC 1) is the most general and the fourth level (ATC 4) the most detailed. More specifically,
    the Commission referred to the ATC3 level, where pharmaceuticals are grouped in terms of
    their therapeutic indications, i.e. their intended use, as the starting point for defining
    the relevant product market, since these groups of products generally have the same therapeutic
    indication and cannot be substituted by products belonging to other ATC 3 classes.
  extraction_method: pdf_extracted
