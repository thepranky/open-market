- passage_id: sp_5
  source_document_id: eu_bpost_staci_2024_decision
  page: '9'
  quote_snippet: (38) In light of the above, and for the purposes of this decision, the Commission
    considers that the exact scope of the product market definition for the supply of contract
    logistics services can be left open with respect to its plausible sub-segmentations as concerns
    the further segmentations into (i) into cross-border and domestic logistics; (ii) by the
    reference to the type of good handled or the industry serviced or; (iii) into LLPs, 3PLs
    and 4PLs, since the Transaction does not raise serious doubts as to its compatibility with
    the internal market under any plausible product market definition. The Commission will assess
    the effects of the Transaction by reference to the narrowest plausible product market delimitations,
    i.e., the markets for the provision of contract logistics services segmented based on the
    (i) type of operations (domestic or cross-border), (ii) type of good handled or industry
    serviced (i.e., consumer goods), and (iii) type of logistics provider (LLPs, 3PLs and 4PLs).
  extraction_method: pdf_extracted
