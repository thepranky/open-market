- passage_id: sp_4
  source_document_id: eu_bpost_staci_2024_decision
  page: '7'
  quote_snippet: (31) The Commission previously considered that contract logistics services
    is the part of the supply chain process that plans, implements and controls the efficient,
    effective flow and storage of goods, services and related information from the point of
    origin to the point of consumption in order to meet customers’ requirements. This part of
    the supply chain has as its focal point the provision of warehousing and management of the
    flow of goods for customers. Hence, the Commission has previously defined a separate market
    for contract logistics services in light of supply-side considerations.
  extraction_method: pdf_extracted
