- passage_id: sp_3
  source_document_id: eu_bpost_staci_2024_decision
  page: '5'
  quote_snippet: '(21) In light of the above, and for the purposes of this decision, the Commission
    considers that the exact scope of the product market definition for the supply of small
    package delivery services can be left open, since the Transaction does not raise serious
    doubts as to its compatibility with the internal market under any plausible product market
    definition. The Commission will assess the effects of the Transaction by reference to the
    narrowest plausible product market definitions i.e. the markets for the provision of small
    package delivery services that are: express, deferred, domestic, international, international
    intra-EEA, international extra-EEA, C2X, B2X, B2B and/or B2C.'
