- passage_id: sp_1
  source_document_id: eu_bpost_staci_2024_decision
  page: '4'
  quote_snippet: (14) The Commission has in its previous decisional practice considered distinguishing
    between express (that is to say, committed to delivery by next day/end of day at the latest)
    and deferred (or standard) small package delivery services. This distinction was notably
    based on the fact that the two services were provided with a different infrastructure, that
    a significant number of customers depend on express delivery services, and that express
    delivery services are also considerably more expensive. The Commission also considered a
    plausible sub-segmentation of the express small package delivery services market according
    to the specific time of delivery (such as mid-day delivery and end-of-day delivery), though
    the Commission ultimately left the market definition open..
  extraction_method: pdf_extracted
