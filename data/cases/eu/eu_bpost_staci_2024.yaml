- passage_id: sp_7
  source_document_id: eu_bpost_staci_2024_decision
  page: '6'
  quote_snippet: (25) The market investigation delivered mixed results as to the geographic
    scope of the market. The majority of respondents that expressed a view submitted that the
    relevant geographic scope of the market for small package delivery services (and any segmentations
    thereof) is either national or EEA-wide. Within this group, a small majority submitted that
    the market should be national. For example, one respondent indicated that “in some case[s]
    competition might take place on a national level, in some on a broader, e.g. EEA level”.
    Another respondent specified that markets “are mostly national, with international players
    […] competing against the incumbent national post players”.
