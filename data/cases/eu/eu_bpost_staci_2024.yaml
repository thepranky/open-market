- passage_id: sp_8
  source_document_id: eu_bpost_staci_2024_decision
  page: '6'
  quote_snippet: (27) In any event, the Commission considers that, for the purposes of this
    decision, the exact scope of the geographic market definition regarding the supply of small
    package delivery services (and plausible segmentations thereof) can be left open between
    national and EEA-wide, since the Transaction does not raise serious doubts as to its compatibility
    with the internal market under either of these plausible geographic market definitions.
    The Commission will assess the effects of the Transaction by reference to the narrowest
    plausible geographic market delimitations, i.e., national markets, as only then the Transaction
    gives rise to an affected market.
