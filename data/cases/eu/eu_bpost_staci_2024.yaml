product_markets_considered:
- market_id: pm_1
  name: Small package delivery services
  definition_status: left_open
  notes: The Commission considered segmentations for small package delivery services into express
    vs deferred, domestic vs international (further segmented into international intra-EEA and
    international extra-EEA), and by customer type (C2X, B2X, B2B, B2C). The market investigation
    confirmed these segmentations to be accurate in Belgium. The Commission assessed the effects
    of the Transaction by reference to the narrowest plausible product market definitions, specifically
    'domestic deferred B2C small package delivery services in Belgium' for the vertical assessment.
- market_id: pm_2
  name: Contract logistics services
  definition_status: left_open
  notes: The Commission previously defined a separate market for contract logistics services.
    It considered segmentations into (i) cross-border and domestic contract logistics, (ii)
    by reference to the type of good handled or industry serviced (e.g., consumer goods), and
    (iii) by type of provider (LLPs, 3PLs, 4PLs). The market investigation confirmed these plausible
    segmentations remain relevant. The Commission assessed the effects of the Transaction by
    reference to the narrowest plausible product market delimitations, including segmentations
    based on type of operations, type of good handled (e.g., consumer goods), and type of logistics
    provider.
geographic_markets_considered:
- market_id: gm_1
  name: Small package delivery services — national/EEA-wide
  definition_status: left_open
  notes: The Commission's previous practice found the market to be national. The market investigation
    delivered mixed results, with a majority supporting national or EEA-wide, and a small majority
    within that group supporting national. A small minority considered it worldwide. The Commission
    left the exact scope open between national and EEA-wide, but assessed the effects by reference
    to national markets as the narrowest plausible delimitation.
- market_id: gm_2
  name: Contract logistics services — national/EEA-wide
  definition_status: left_open
  notes: The Commission's previous practice found the market to be EEA-wide, leaving open plausible
    segmentations into national markets. The market investigation results were mixed, with most
    respondents supporting EEA-wide, but a third indicating national level competition. The
    Commission left the exact scope open between national and EEA-wide, and assessed the effects
    by reference to both national markets and the EEA level.
