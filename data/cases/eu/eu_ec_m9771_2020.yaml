  page: '13'
  quote_snippet: '(42) In previous decisions, the Commission has found that the geographic markets
    for the manufacture and supply of OEM automotive components are at least EEA-wide, and possibly
    worldwide, but has left open the precise definition.60 In a recent case, the existence of
    at least EEA-wide markets was justified as follows: i) the Parties operated worldwide; ii)
    OEMs increasingly source products at worldwide level; iii) within the EEA, transport costs
    are not significant; iv) product regulation and safety standards are set at EEA level; v)
    there are no obstacles to intra-EEA trade and vi) prices are similar throughout the EEA.61'
