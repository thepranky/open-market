product_markets_considered:
- market_id: pm_1
  name: Automotive components overall
  definition_status: left_open
  notes: The Commission considered the relevant product market for the manufacture and supply
    of automotive components on a product-by-product basis and left open whether there may be
    a wider market comprising automotive components, modules and systems, or separate markets
    for "components" and "modules". It also considered segmentations based on vehicle type (Light
    Vehicles and Heavy Commercial Vehicles) and distribution channel (OEMs and independent aftermarket
    (IAM)). For the purpose of this case, the Commission maintained its decisional practice.
    For components used in both or exclusively in motorcycles, it left open whether a distinction
    between components for large and small motorcycles should be made, and whether a distinction
    between components for passenger cars and motorcycles should be made.
- market_id: pm_2
  name: Automotive airflow sensors
  definition_status: left_open
  notes: The Commission concluded the relevant product market is the manufacture and sale of
    automotive airflow sensors, in line with its previous practice that each automotive sensor
    fulfilling a different function constitutes a separate product market. However, for the
    purpose of the decision, the exact product market definition was left open as the transaction
    did not raise serious doubts under any plausible definition.
- market_id: pm_3
  name: ECUs
  definition_status: left_open
  notes: The Commission considered maintaining its previous practice of distinguishing between
    diesel and gasoline ECUs, and within diesel ECUs for light and heavy vehicles. For motorcycle
    ECUs, market investigation suggested distinctions such as e-gas capable, fuel/electric powered,
    and single/multi cylinder. Demand-side substitutability was low between passenger car and
    motorcycle ECUs, and small/large motorcycle ECUs, but supply-side substitutability was found.
    The exact product market definition was left open.
- market_id: pm_4
  name: Electronic throttle bodies
  definition_status: left_open
  notes: The Commission retained its practice to define a separate market for the manufacture
    and sale of electronic throttle bodies, as the market investigation did not find the need
    for further segmentation. The exact product market definition was left open as the transaction
    did not raise serious doubts.
- market_id: pm_5
  name: Carburettors for motorcycles
  definition_status: left_open
  notes: The Commission considered the relevant market to be carburettors for motorcycles, with
    a further possible distinction between carburettors for small and large motorcycles, confirmed
    by market investigation. However, supply-side substitutability was high between small and
    large motorcycle carburettors. The exact market definition was left open.
- market_id: pm_6
  name: Fuel pump modules
  definition_status: left_open
  notes: The Commission considered the market for fuel pump modules. Market investigation mentioned
    possible segments (tank shapes, mount, flow rate). There was no demand-side substitutability
    between passenger car/motorcycle modules or small/large motorcycle modules, but supply-side
    substitutability was found. The exact market definition was left open.
- market_id: pm_7
  name: Injectors
  definition_status: left_open
  notes: The Commission maintained its previous market definition for diesel injectors (parties'
    injectors are for gasoline engines). Market investigation mentioned variations depending
    on engine type, spray pattern, length, and fixation method. There was vast supply-side substitutability
    between passenger car/motorcycle injectors and small/large motorcycle injectors. The exact
    market definition was left open.
- market_id: pm_8
  name: Brake master cylinders
  definition_status: left_open
  notes: The Commission considered the relevant product market to be brake master cylinders.
    Market investigation indicated possible sub-segmentation between passenger car and motorcycle
    brake master cylinders, and between small and large motorcycles, due to differences in requirements
    and dimensions. However, supply-side substitutability was found. The exact market definition
    was left open.
- market_id: pm_9
  name: Floating calipers and brake pads (assembled)
  definition_status: left_open
  notes: The Commission considered the market for floating calipers and brake pads (assembled).
    Market investigation confirmed supply as an assembled product. Demand-side substitutability
    was not found between passenger car/motorcycle calipers or small/large motorcycle calipers,
    but supply-side substitutability was found. The exact product market definition was left
    open, considering also non-assembled and fixed caliper variants.
- market_id: pm_10
  name: Anti-lock braking systems (ABS)
  definition_status: left_open
  notes: The Commission maintained the distinction between ABS and ESC (Electronic Stability
    Control) for the present case, as no affected markets arose for ESC. It analyzed the narrower
    market for ABS for motorcycles, while leaving open whether a distinction should be made
    between ABS for passenger cars and ABS for motorcycles. The exact product market definition
    was left open.
- market_id: pm_11
  name: Shock absorbers
  definition_status: left_open
  notes: The Commission noted that its precedent for shock absorbers related to heavy duty vehicles,
    and for motorcycles, additional categories (Front fork with conventional/active damping,
    Shock absorber with conventional damping, Rear shock with active damping, Steering damper)
    appeared relevant. Demand-side substitutability was low between passenger car/motorcycle
    shock absorbers and small/large motorcycle shock absorbers, but market investigation pointed
    to supply-side substitutability, contrary to the parties' view. The exact product market
    definition was left open.
- market_id: pm_12
  name: Handle lever brackets
  definition_status: left_open
  notes: The Commission considered the market for the supply of handle lever brackets based
    on its practice to distinguish between each distinct automotive component. The market investigation
    did not raise concerns or potential sub-segmentations. The precise market definition was
    left open as no serious doubts arose.
- market_id: pm_13
  name: Panel brakes
  definition_status: left_open
  notes: The Commission considered the market for the supply of panel brakes based on its practice
    to distinguish between each distinct automotive component. The market investigation did
    not raise concerns or potential sub-segmentations. The precise market definition was left
    open as no serious doubts arose.
- market_id: pm_14
  name: Speed meter gears
  definition_status: left_open
  notes: The Commission considered the market for the supply of speed meter gears based on its
    practice to distinguish between each distinct automotive component. The market investigation
    did not raise concerns or potential sub-segmentations. The precise market definition was
    left open as no serious doubts arose.
- market_id: pm_15
  name: Combined brake systems (CBS)
  definition_status: left_open
  notes: The Commission considered the market for the supply of CBS based on its practice to
    distinguish between each distinct automotive component. The market investigation did not
    raise concerns or potential sub-segmentations. The precise market definition was left open
    as no serious doubts arose.
- market_id: pm_16
  name: Shaft drive drivetrain systems
  definition_status: left_open
  notes: The Commission considered the market for the supply of shaft drive drivetrain systems
    based on its practice to distinguish between each distinct automotive component. The market
    investigation did not raise concerns or potential sub-segmentations. The precise market
    definition was left open as no serious doubts arose.
- market_id: pm_17
  name: Passenger cars
  definition_status: segmented
  notes: The Commission retained its past decisional practice which left open whether the market
    includes all passenger cars or is segmented by type (mini, small, medium, large, executive,
    luxury, sport, SUV, multipurpose), and whether electric cars constitute a separate market.
- market_id: pm_18
  name: Motorcycles
  definition_status: segmented
  notes: The Commission agreed that the appropriate frame of reference is the production of
    all motorcycles, in line with previous practice, which had segmented the market based on
    engine size (scooters vs. motorcycles) but ultimately left the market definition open. The
    Commission retained the product market definition from its past decisional practice (referencing
    paragraph 173 for passenger cars, but implicitly for motorcycles as per Piaggio/Aprilia)
    as the transaction raised no serious doubts.
geographic_markets_considered:
- market_id: gm_1
  name: Automotive and motorcycle parts and components overall — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission's precedent for OEM automotive components was at least EEA-wide, possibly
    worldwide, with the precise definition left open. For motorcycle components, no specific
    precedent existed. The market investigation confirmed at least EEA-wide, if not worldwide,
    as most customers purchase globally and transport costs are low. The geographic market was
    left open as the transaction raised no competition concerns.
- market_id: gm_2
  name: Automotive airflow sensors — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission's precedent for automotive sensors was at least EEA-wide. In line with
    this and the general findings of the market investigation, the geographic market was left
    open between EEA-wide and worldwide, as the transaction did not raise serious doubts.
- market_id: gm_3
  name: ECUs and electronic throttle bodies — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedent for ECUs was at least EEA-wide, if not worldwide. The market investigation
    did not find divergence from the general finding for automotive and motorcycle components
    (at least EEA-wide). The geographic market was left open as the transaction did not raise
    serious doubts.
- market_id: gm_4
  name: Carburettors for motorcycles — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission had no specific precedent for carburettors or other motorcycle components,
    but for automotive components, the geographic market was at least EEA-wide, possibly worldwide,
    and left open. In line with this and the general findings of the market investigation, the
    geographic market was left open as the transaction did not raise serious doubts.
- market_id: gm_5
  name: Fuel pump modules — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission had no specific precedent for fuel pump modules. For automotive components,
    the geographic market was at least EEA-wide, possibly worldwide, and left open. In line
    with this and the general findings of the market investigation, the geographic market was
    left open as the transaction did not raise serious doubts.
- market_id: gm_6
  name: Injectors — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission's precedent for diesel injectors was at least EEA-wide, if not worldwide.
    In line with this and the general findings of the market investigation, the geographic market
    was left open as the transaction did not raise serious doubts.
- market_id: gm_7
  name: Brake master cylinders — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission had no specific precedent for brake master cylinders, but for braking
    systems components, the geographic market was considered (but left open) as EEA-wide or
    worldwide. In line with this and the general findings of the market investigation, the geographic
    market was left open as the transaction did not raise serious doubts.
- market_id: gm_8
  name: Calipers and brake pads — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission's precedent for calipers for OEM channel customers was EEA-wide, possibly
    worldwide, left open. In line with this and the general findings of the market investigation,
    the geographic market was left open as the transaction did not raise serious doubts.
- market_id: gm_9
  name: Anti-lock braking systems (ABS) — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedent for ABS market was EEA-wide. However, the Commission noted that
    supply chains likely became more global since that assessment. Therefore, for the purposes
    of this decision, the geographic market was left open between EEA-wide or worldwide, as
    the transaction did not raise serious doubts.
- market_id: gm_10
  name: Shock absorbers — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedent for shock absorbers was EEA-wide, possibly worldwide, and left
    open. In line with this and the general findings of the market investigation, the geographic
    market was left open as the transaction did not raise serious doubts.
- market_id: gm_11
  name: Other motorcycle components (handle lever brackets, panel brakes, speed meter gears,
    CBS, shaft drive drivetrain systems) — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission had no specific precedent for these motorcycle components. For automotive
    components, the geographic market was EEA-wide, possibly worldwide, and left open. In line
    with this and the general findings of the market investigation, the geographic market was
    left open between EEA-wide and worldwide.
- market_id: gm_12
  name: Passenger cars — EEA-wide or national
  definition_status: left_open
  notes: The Commission's previous decisions left open whether the geographic scope of the markets
    for manufacturing and supply of passenger cars is EEA-wide or national in scope. The Commission
    retained this geographic market definition.
- market_id: gm_13
  name: Motorcycles — national
  definition_status: defined
  notes: In a previous case (Piaggio/Aprilia), the Commission found the market for motorcycles
    was national in scope. The Commission retained this geographic market definition.
