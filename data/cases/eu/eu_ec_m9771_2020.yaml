  quote_snippet: (146) The Commission notes that since its assessment of the ABS market in Bosch/Allied
    Signal (in 1996), it is likely that supply chains have become more global, as the results
    of the market investigation, outlined in paragraph (37), as well as the more recent automotive
    component cases cited in this Decision show. In any case, for the purposes of this Decision,
    it can be left open whether the geographic market is defined as EEA-wide or worldwide, as
    the proposed transaction does not raise any serious doubts as to its compatibility with
    the internal market under any plausible market definition adopted.
