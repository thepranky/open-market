product_markets_considered:
- market_id: pm_1
  name: Market for the manufacture and sale of surgical equipment
  definition_status: segmented
  notes: The Commission investigated potential segmentation between open surgery equipment,
    laparoscopic equipment, and robotically-assisted surgery (RAS) equipment. While significant
    differences were found, the exact market definition for these segments was left open. The
    Commission stated it would assess the transaction on the narrowest plausible market segment,
    the manufacture and supply of RAS equipment.
- market_id: pm_2
  name: Market for the manufacture and supply of RAS equipment
  definition_status: considered
  notes: For the purposes of its competitive assessment, and on a conservative basis, the Commission
    decided to assess the impact of the Transaction on the market for the manufacture and supply
    of RAS equipment as the narrowest plausible segmentation, noting that under broader definitions,
    the parties' position would be less significant.
- market_id: pm_3
  name: Market for the wholesale distribution of medical devices
  definition_status: left_open
  notes: The Commission considered the wholesale distribution of all medical devices as a relevant
    product market, aligning with its past practice and the Notifying Party's view. However,
    it noted specific requirements (transport, training) for distributing RAS equipment. Ultimately,
    the exact market definition was left open as the transaction would not raise serious doubts
    regardless of the definition.
geographic_markets_considered:
- market_id: gm_1
  name: Market for the manufacture and sale of surgical equipment — national (EEA affected)
  definition_status: left_open
  notes: The Commission's market investigation indicated that competition for the sale of RAS
    equipment occurs primarily at a national level, with pricing, contractual conditions, reimbursement,
    and tender processes determined country-by-country. Despite this, the exact geographic market
    definition was left open, as competitive concerns would not arise regardless of whether
    it was defined as national or EEA-wide.
- market_id: gm_2
  name: Market for the wholesale distribution of medical devices — national (EEA affected)
  definition_status: considered
  notes: The Commission confirmed its past practice and market investigation findings that the
    market for the distribution of medical devices is national in scope, primarily due to distributors
    being active in one country. While some evidence suggested broader distribution, the Commission
    decided to conduct its assessment at the national level.
