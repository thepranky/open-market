- passage_id: sp_2
  source_document_id: eu_ec_m9744_2020_decision
  page: '5'
  quote_snippet: First, most competitors and a significant share of customers consider that
    A2A CIS providers do not typically have the capabilities to provide both software solutions
    and managed services. In particular, market participants stressed the fact that the “business
    model for [managed] services and [software] products is quite different” and that providing
    managed services “implies much wider responsibilities and different type of expertise than
    just delivering a [software] product”.
  extraction_method: pdf_extracted
