product_markets_considered:
- market_id: pm_1
  name: A2A core infrastructure managed services
  definition_status: defined
  notes: The Commission concluded that A2A core infrastructure managed services and software-only
    solutions constitute distinct product markets. A further differentiation based on the type
    of payment processing (batch vs. instant) was not warranted.
- market_id: pm_2
  name: A2A core infrastructure software-only solutions
  definition_status: defined
  notes: The Commission concluded that A2A core infrastructure software-only solutions and managed
    services constitute distinct product markets. A further differentiation based on the type
    of payment processing (batch vs. instant) was not warranted.
- market_id: pm_3
  name: A2A payment services
  definition_status: left_open
  notes: The Commission left open whether A2A payment services form part of a wider market for
    invoice payment services including recurring card-based payments, or if they are segmented
    based on transaction types and methods.
- market_id: pm_4
  name: Invoice payment services
  definition_status: left_open
  notes: The Commission considered whether invoice payment services (including both A2A payment
    services and recurring card payments) constituted a broader market, but left this question
    open.
geographic_markets_considered:
- market_id: gm_1
  name: A2A core infrastructure managed services — national, regional within the EEA or EEA-wide
  definition_status: left_open
  notes: The Commission considered national, regional (e.g. pan-Nordic) or EEA-wide scopes for
    A2A CIS markets but ultimately left the exact geographic scope open.
- market_id: gm_2
  name: A2A core infrastructure software-only solutions — national, regional within the EEA
    or EEA-wide
  definition_status: left_open
  notes: The Commission considered national, regional (e.g. pan-Nordic) or EEA-wide scopes for
    A2A CIS markets but ultimately left the exact geographic scope open.
- market_id: gm_3
  name: A2A payment services — national or regional at the Nordic level
  definition_status: left_open
  notes: The Commission left open the exact geographic market definition for A2A payment services,
    considering national or regional (Nordic) levels.
- market_id: gm_4
  name: Invoice payment services — national or regional at the Nordic level
  definition_status: left_open
  notes: The Commission left open the exact geographic market definition for invoice payment
    services, considering national or regional (Nordic) levels, mirroring the assessment for
    the narrower A2A payment services.
