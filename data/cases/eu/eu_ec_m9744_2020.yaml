- passage_id: sp_25
  source_document_id: eu_ec_m9744_2020_decision
  page: '20'
  quote_snippet: In view of the above considerations, taking into account the market investigation
    and all the evidence available, the Commission concludes that the Transaction raises serious
    doubts as to its compatibility with the internal market and functioning of the EEA Agreement
    with respect to overlaps between the Parties’ activities in the EEA market(s) for the provision
    of A2A CI managed solutions in the EEA under any plausible geographic market definition
    (i.e. national, regional and/or EEA-wide).. The Commission notes that, in relation to the
    market for the provision of A2A CI software-only solutions, due to the presence of a sufficient
    number of competitors post-Transaction and the lower barriers to entry, no serious doubts
    arise. In any event, the final commitments offered by the Parties fully address the competition
    concerns identified in the decision in relation to the provision of A2A CI managed services
    in the EEA (see Section 4 below).
  extraction_method: pdf_extracted
  review_status: unreviewed
