  page: '21'
  quote_snippet: The market investigation did not fully support the Parties’ claims that recurring
    card-based payment services and A2A payment services form part of a single product market
    for invoice payment services. Competitors and customers expressed differing views on this
    part. To the contrary, some elements of the market investigation clearly suggest that A2A
    payment services form part of a distinct product market from recurring card payment services.
