product_markets_considered:
- market_id: pm_1
  name: Production and supply of AV content
  definition_status: segmented
  notes: The Commission concluded that the production and supply of AV content forms a relevant
    product market but left open further distinctions between commissioned and pre-produced
    AV content, different content types, and exhibition windows.
- market_id: pm_2
  name: Wholesale supply of TV channels
  definition_status: segmented
  notes: The Commission considers the relevant product market to be the wholesale supply of
    TV channels, including their ancillary services and covering all types of infrastructure,
    but left open further distinctions by genre, distribution technology, or between FTA and
    pay TV channels (including basic and premium splits).
- market_id: pm_3
  name: Retail supply of AV services to end customers
  definition_status: segmented
  notes: The Commission concluded that a relevant product market exists for the retail supply
    of AV services, but left open further distinctions between FTA TV channels and pay TV channels,
    basic and premium pay TV channels, linear and non-linear TV channels, or different distribution
    technologies.
- market_id: pm_4
  name: Sale of advertising space
  definition_status: segmented
  notes: The Commission identified the relevant product market as the sale of advertising space,
    but left open further distinctions between online and offline advertising, different media
    channels, advertising sold directly by the publisher or through an intermediary, and online
    search and non-search advertising.
