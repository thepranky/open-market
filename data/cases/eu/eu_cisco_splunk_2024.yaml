  source_document_id: eu_cisco_splunk_2024_decision
  page: '3'
  quote_snippet: 'The Transaction only gives rise to limited horizontal overlaps, with the exception
    of two Gartner and IDC market segments which are affected at the worldwide or EEA level,
    namely: (i) Application Performance Management & Observability (“APM&O”) software7 (Gartner
    terminology) and (ii) a hypothetical market for IT operations analytics (“ITOA”) software8
    (IDC terminology).9'
