product_markets_considered:
- market_id: pm_1
  name: Application Performance Management & Observability (APM&O) software
  definition_status: considered
  notes: The Commission considered APM&O software as the narrowest plausible market for its
    competitive assessment, within the broader IT Operations Management (ITOM) software macro
    market, the definition of which was left open.
- market_id: pm_2
  name: IT Operations Analytics (ITOA) software
  definition_status: considered
  notes: The Commission considered ITOA software as a plausible IDC market for its competitive
    assessment, within the broader System Infrastructure software market, the definition of
    which was left open.
- market_id: pm_3
  name: Security Information and Event Management (SIEM) software
  definition_status: considered
  notes: The Commission considered SIEM software for its competitive assessment, within the
    broader Security software macro market, the definition of which was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Application Performance Management & Observability (APM&O) software — EEA-wide
  definition_status: considered
  notes: The Commission left open the exact geographic market definition for ITOM software (the
    broader market), but carried out its assessment for APM&O on an EEA-wide basis as it results
    in an affected market at that level.
- market_id: gm_2
  name: IT Operations Analytics (ITOA) software — worldwide
  definition_status: considered
  notes: The Commission left open the exact geographic market definition for System Infrastructure
    software (the broader market), but carried out its assessment for ITOA on both worldwide
    and EEA-wide bases.
- market_id: gm_3
  name: IT Operations Analytics (ITOA) software — EEA-wide
  definition_status: considered
  notes: The Commission left open the exact geographic market definition for System Infrastructure
    software (the broader market), but carried out its assessment for ITOA on both worldwide
    and EEA-wide bases.
- market_id: gm_4
  name: Security Information and Event Management (SIEM) software — worldwide
  definition_status: considered
  notes: The Commission left open the exact geographic market definition for Security software
    (the broader market), but carried out its assessment for SIEM on both worldwide and EEA-wide
    bases.
- market_id: gm_5
  name: Security Information and Event Management (SIEM) software — EEA-wide
  definition_status: considered
  notes: The Commission left open the exact geographic market definition for Security software
    (the broader market), but carried out its assessment for SIEM on both worldwide and EEA-wide
    bases.
