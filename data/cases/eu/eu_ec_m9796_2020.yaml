  quote_snippet: The Commission notes that there is a high relevance of national regulation
    for the provision of custody and depositary services in Slovakia.58 Feedback from the market
    suggests some degree of substitutability between the provision of custody and depositary
    services from a supply side point of view in Slovakia.59 One respondent described depositary
    services to be typically an “add-on service” to custody service. This would be an argument
    that custody and depositary services in Slovakia belong to the same or a closely related
    product market. On the other hand, both types of services differ in the sense that depositary
    services in Slovakia comprise the supervision, examination, inspection and compliance checks
    with respect to the applicable national laws for each transaction.60 This would suggest
    to treat custody and depositary services in Slovakia as separate product markets. The Commission
    further notes that the strong impact of national regulation of the provision for depositary
    services in Slovakia suggests the geographic market is national in scope.
