  source_document_id: eu_ec_m9796_2020_decision
  page: '10'
  quote_snippet: In past decisions, the Commission has considered custody services as a potential
    narrower market within asset management services, but left this product market definition
    open.50 Furthermore, the Commission has considered depositary services as part of fund administration
    services, which was defined as one product market with no further segmentation.51 In later
    decisions, the exact product market definition of fund administration was left open.52 Depositary
    services for mutual and pension funds were also considered to be potentially a distinct
    product market in the area of custody services or asset management, and ultimately left
    the market definition open.53 The Commission thereby noted that depositary services would
    largely include custody services, but would further comprise certain control functions prescribed
    by national law.
  extraction_method: pdf_extracted
