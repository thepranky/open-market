- passage_id: sp_14
  source_document_id: eu_ec_m9796_2020_decision
  page: '11'
  quote_snippet: Feedback from the market suggests some degree of substitutability between the
    provision of custody and depositary services from a supply side point of view in Slovakia.59
    One respondent described depositary services to be typically an “add-on service” to custody
    service. This would be an argument that custody and depositary services in Slovakia belong
    to the same or a closely related product market. On the other hand, both types of services
    differ in the sense that depositary services in Slovakia comprise the supervision, examination,
    inspection and compliance checks with respect to the applicable national laws for each transaction.60
    This would suggest to treat custody and depositary services in Slovakia as separate product
    markets.
