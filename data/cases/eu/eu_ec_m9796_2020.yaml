- passage_id: sp_10
  source_document_id: eu_ec_m9796_2020_decision
  page: '9'
  quote_snippet: Within the potential segment of institutional clients, the Commission has considered
    in previous cases a further segmentation between active and passive asset management. In
    active asset management, an asset manager aims at outperforming a benchmark such as an index,
    whereas in passive asset management, the asset manager aims at replicating the performance
    of an index.41 Regarding retail clients, the Commission has previously considered a segmentation
    between open retail funds, with no restriction on the number of investors, and closed retail
    funds, which are tailor-made for a small group of investors.42 For all these plausible segmentations,
    the Commission ultimately left open the precise product market definition.
