- passage_id: sp_7
  source_document_id: eu_ec_m9796_2020_decision
  page: '6'
  quote_snippet: According to the Notifying Party`s competitors in the retirement saving market,
    consumers do not view DDS pension fund products as interchangeable with other voluntary
    retirement saving products such as mutual funds and pension (life) insurance products, mainly
    because the key criterion for consumers when choosing a financial product for retirement
    is the employer’s contribution, which is specific to DDS pension fund products and a specific
    regulatory framework applicable to DDS pension fund products.23 In direct comparison of
    DDS pension fund products with mutual funds and pension (life) insurance products it was
    also pointed out that DDS pension fund products profit from favourable tax treatment.24
  extraction_method: pdf_extracted
