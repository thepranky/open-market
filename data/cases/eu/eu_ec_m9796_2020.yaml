product_markets_considered:
- market_id: pm_1
  name: Life insurance products
  definition_status: left_open
  notes: The Commission distinguished between pure risk protection products, pension products,
    and savings/investment products, sometimes grouping the latter two. It also considered distinctions
    between life insurance for individuals and group/corporate customers, or based on the type
    of risk covered. In Slovakia, a potential segmentation for index-linked and unit-linked
    life insurance was considered.
- market_id: pm_2
  name: Non-life insurance products
  definition_status: left_open
  notes: The Commission's consistent approach considers that relevant product markets can be
    divided into types of risks to insure, typically distinguishing accident and sickness, motor
    vehicle, property, liability, marine, aviation and transport, credit and suretyship, and
    travel insurance. Other distinctions include fire insurance, legal assistance, national
    insurance classifications, and individual vs group customers. In Poland, potential segments
    for sickness, accident, and CASCO insurance of rail vehicles were considered.
- market_id: pm_3
  name: Voluntary retirement saving products
  definition_status: left_open
  notes: The Commission considered whether DDS pension fund products constitute a separate and
    standalone market, or belong to a wider voluntary retirement saving market that includes
    products such as mutual funds and pension insurance (life). The market investigation indicated
    that DDS pension fund products should be considered a separate market due to employer contributions,
    tax benefits, and regulatory framework, which differentiates them from other voluntary savings
    products. A distinction was also made between mandatory (p1, p2) and voluntary (p3) pension
    pillars.
- market_id: pm_4
  name: Distribution of voluntary retirement saving products
  definition_status: left_open
  notes: The Commission considered that a distinct product market for the distribution of specific
    voluntary saving products, particularly DDS pension fund products in Slovakia, may exist,
    given the potential for a distinct product market for DDS pension fund products themselves.
- market_id: pm_5
  name: Asset management
  definition_status: left_open
  notes: The Commission considered an overall relevant product market for asset management,
    with potential segmentations between retail and institutional clients, active and passive
    asset management, open and closed retail funds, and sub-segments for mutual funds and money
    market funds. The precise definition was left open.
- market_id: pm_6
  name: Distribution of asset management products
  definition_status: left_open
  notes: This market relates to the distribution of retail funds. The Commission previously
    considered a relevant market comprising all retail banking products, with the possibility
    of segmenting it by offered products, including distribution of mutual funds. The exact
    product market definition was left open.
- market_id: pm_7
  name: Custody and depositary services
  definition_status: left_open
  notes: The Commission considered custody services as a potential narrower market within asset
    management, and depositary services as part of fund administration services or as a distinct
    market within custody services. Depositary services largely include custody but also comprise
    control functions prescribed by national law. Feedback suggested some supply-side substitutability
    but also noted functional differences. Slovak law requires DSS and DDS companies to source
    both services from one supplier.
geographic_markets_considered:
- market_id: gm_1
  name: Life insurance products — national (Slovakia affected)
  definition_status: left_open
  notes: The Commission typically considered markets for life and non-life insurance products
    to be national in scope, potentially wider than national for certain non-life risk classes.
    The Notifying Party indicated that the geographic scope could be left open.
- market_id: gm_2
  name: Non-life insurance products — national (Poland affected)
  definition_status: left_open
  notes: The Commission typically considered markets for life and non-life insurance products
    to be national in scope, potentially wider than national for certain non-life risk classes.
    The Notifying Party indicated that the geographic scope could be left open.
- market_id: gm_3
  name: Voluntary retirement saving products — national (Slovakia affected)
  definition_status: left_open
  notes: The Commission's market investigation revealed no indication that the market for DDS
    pension fund products in Slovakia is wider than national in scope, noting that these products
    are subject to national legislation.
- market_id: gm_4
  name: Distribution of voluntary retirement saving products — national (Slovakia affected)
  definition_status: considered
  notes: The Commission considered that a potential separate product market for the distribution
    of voluntary retirement saving products, and specifically DDS pension fund products, would
    likely be national in scope due to the high relevance of national regulation.
- market_id: gm_5
  name: Asset management — national/wider than national (Slovakia affected)
  definition_status: left_open
  notes: The Commission previously considered the market for asset management to be national
    or wider than national in scope, with asset management for institutional clients potentially
    wider than national, and open retail mutual funds and money market funds considered national
    in scope.
- market_id: gm_6
  name: Distribution of asset management products — national (Slovakia affected)
  definition_status: considered
  notes: The Commission previously concluded that the market for retail banking, including the
    distribution of mutual funds, is national in scope, and found no reason to deviate from
    this decisional practice in the present case.
- market_id: gm_7
  name: Custody and depositary services — national (Slovakia affected)
  definition_status: left_open
  notes: The Commission previously considered that some custody services might be global while
    others are domestic. For depositary services, it referred to national regulatory frameworks.
    In Slovakia, the strong impact of national regulation suggests the geographic market for
    depositary services is national in scope.
