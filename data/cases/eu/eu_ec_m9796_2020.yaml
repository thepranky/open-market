- passage_id: sp_3
  source_document_id: eu_ec_m9796_2020_decision
  page: '3'
  quote_snippet: 'As regards product market definition for non-life insurance products, the
    Commission’s consistent approach is to consider that relevant product markets can be divided
    into the types of risks to insure. Precedents typically distinguish the following non-life
    insurance segments: (i) accident and sickness, (ii) motor vehicle, (iii) property, (iv)
    liability, (v) marine, aviation and transport (“MAT”), (vi) credit and suretyship and (vii)
    travel insurance.8 In certain decisions, the Commission also distinguished fire insurance,
    and legal assistance. The Commission also considered several additional segmentations of
    the non-life insurance market, including based on national insurance classification9 or
    between individual and group (i.e. corporate/institutional) customers. The Commission ultimately
    left open the precise product market definition for non-life insurance products for all
    plausible segmentations mentioned above.'
  extraction_method: pdf_extracted
