- passage_id: sp_10
  source_document_id: eu_ec_m9736_2020_decision
  page: '9'
  quote_snippet: The Notifying Party agrees that AAC large format units for industrial construction
    are not substitutable with those for residential construction, but considers that each of
    them form part of a broader product market. More specifically, the Notifying Party submits
    that AAC large format units for industrial construction form part of a market that also
    encompasses concrete panels and steel elements (but not elements made of in situ poured
    concrete which is not a usual method of producing panels for industrial buildings) and that
    AAC large format units for residential construction form part of a market that also encompasses
    concrete floor elements and full assembly floors out of reinforced concrete.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
