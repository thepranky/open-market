- passage_id: sp_11
  source_document_id: eu_ec_m9736_2020_decision
  page: '9'
  quote_snippet: In light of the above and for the purposes of the assessment of the Transaction,
    the Commission considers that the question of whether AAC large format units constitute
    a separate product market comprising aerated concrete roofing panels, fire walls and outer
    walls or are part of a wider market also encompassing products such as AAC blocks, prefabricated
    concrete panels or steel panels can be left open, as the Commission considers that the Transaction
    does not raise serious doubts under either product market definition. The Commission also
    considers that the question of whether a further sub-segmentation between AAC large format
    units for industrial construction and AAC large format units for residential construction
    is appropriate can be left open, as the Commission finds that the Transaction does not raise
    serious doubts under any product market definition set out above, this being the most conservative
    approach, since any wider product market definition for AAC large format units would lower
    Xella’s market shares.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
