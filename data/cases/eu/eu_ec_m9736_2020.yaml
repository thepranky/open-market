- passage_id: sp_14
  source_document_id: eu_ec_m9736_2020_decision
  page: '11'
  quote_snippet: In light of the above and for the purposes of the assessment of the Transaction,
    the Commission considers that the question of whether mineral insulation boards constitute
    a separate product market or are part of a wider market also encompassing other insulation
    products can be left open, as the Commission considers that the Transaction does not raise
    serious doubts under either product market definition. The Commission also considers that
    no further segmentation of mineral insulation boards is necessary. In this decision, the
    Commission will carry out its assessment on the basis of a market restricted to mineral
    insulation boards only as the narrowest plausible product market definition, this being
    the most conservative approach (as indicated by the market investigation), since any wider
    product market definition for mineral insulation boards would lower Xella’s market shares.
