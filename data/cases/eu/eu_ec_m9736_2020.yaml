- passage_id: sp_4
  source_document_id: eu_ec_m9736_2020_decision
  page: '5'
  quote_snippet: 'In the past, the Commission has made a distinction between premix mortars,
    which are mixed at the factory and on-site mortars, which are mixed on the construction
    site. Within premix mortars, the Commission has distinguished between dry mortars (supplied
    in a dry powder form), wet mortars (ready-mixed with water at the factory), and ready-to-use
    paste mortars (supplied as paste, including organic compounds as binders. Moreover, the
    Commission has also distinguished between mortars based on the application, namely: (i)
    construction mortars, used for various building construction purposes, such as casting and
    setting, masonry, plastering, floor levelling and concrete repair; (ii) façade mortars,
    used as an outer layer of buildings for protective or aesthetic purposes, or as part of
    insulation systems and (iii) tile-fixing mortars used for fixing tiles, both on substrate
    (adhesive mortars) and as sealants between tiles (grouts).'
  extraction_method: pdf_extracted
  review_status: unreviewed
