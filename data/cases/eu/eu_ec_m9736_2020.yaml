  quote_snippet: AAC large format units and aerated concrete roofing panels, fire walls and
    outer walls were examined by the Commission in Case M.9406 – Lone Star – Stark group / Saint-Gobain
    BDD. In this case, the Commission found that aerated concrete roofing panels, fire walls
    and outer walls were part of the same market as AAC large format units. The Commission also
    found indications that AAC large format units for industrial construction are not substitutable
    with those for residential construction. However, the Commission ultimately left the exact
    product definition for AAC large format prefabricated compound units open.
