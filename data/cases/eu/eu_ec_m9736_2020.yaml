product_markets_considered:
- market_id: pm_1
  name: Chemical-based admixtures
  definition_status: defined
  notes: The Commission concluded that chemical-based admixtures constitute a separate product
    market, distinct from mineral-based admixtures, and that no further segmentation is necessary.
- market_id: pm_2
  name: Mortars
  definition_status: left_open
  notes: The Commission left open whether the appropriate product market definition is mortars
    as a whole or whether separate product markets exist for various segmentations (premix vs.
    on-site, dry/wet/paste, and application-based such as construction, façade, tile-fixing
    mortars).
- market_id: pm_3
  name: AAC blocks
  definition_status: considered
  notes: The Commission left open whether AAC blocks constitute a separate product market or
    are part of a wider market encompassing other building products, but for the purpose of
    the decision, assessed it on the narrowest plausible definition of AAC blocks only.
- market_id: pm_4
  name: AAC large format units and aerated concrete roofing panels, fire walls and outer walls
  definition_status: left_open
  notes: The Commission left open whether AAC large format units constitute a separate product
    market (including aerated concrete roofing panels, fire walls and outer walls) or are part
    of a wider market encompassing other construction materials. It also left open whether a
    sub-segmentation between units for industrial and residential construction is appropriate.
- market_id: pm_5
  name: Mineral insulation boards
  definition_status: considered
  notes: The Commission left open whether mineral insulation boards constitute a separate product
    market or are part of a wider market encompassing other insulation products, but for the
    purpose of the decision, assessed it on the narrowest plausible definition of mineral insulation
    boards only.
- market_id: pm_6
  name: Distribution of building products
  definition_status: left_open
  notes: The Commission left open whether there should be a sub-segmentation of the distribution
    of building materials between (i) wholesale sales to retailers; (ii) retail sales to professional
    customers (B2B); and (iii) retail sales to non-professional customers (primarily through
    DIY stores).
geographic_markets_considered:
- market_id: gm_1
  name: Chemical-based admixtures — national
  definition_status: considered
  notes: The Commission left open whether the market was national, regional, EEA-wide or worldwide,
    but conducted its assessment on a national market basis as the narrowest plausible definition.
- market_id: gm_2
  name: Mortars — national
  definition_status: left_open
  notes: The Commission left the geographic market definition open, but considered that the
    market for mortars (other than large volume/low value heavy mortars) could be national in
    scope.
- market_id: gm_3
  name: AAC blocks — national or local
  definition_status: left_open
  notes: The Commission left open whether the appropriate geographic market definition is national
    or local (smaller than national). Past precedents indicated a local scope in Germany.
- market_id: gm_4
  name: AAC large format units and aerated concrete roofing panels, fire walls and outer walls
    — national or local
  definition_status: left_open
  notes: The Commission left open whether the relevant geographic market for AAC large format
    units should be considered as local or national in scope.
- market_id: gm_5
  name: Mineral insulation boards — national
  definition_status: considered
  notes: The Commission left open whether the market was national or wider (regional or EEA-wide),
    but conducted its assessment on a national market basis as the narrowest plausible definition.
- market_id: gm_6
  name: Distribution of building products — national or local
  definition_status: left_open
  notes: The Commission left open whether the appropriate geographic market definition is national
    or local (smaller than national).
