  quote_snippet: (23) In the past, 21 the Commission considered that the there are two separate
    product markets for mouth pain relief products. Namely (i) a market for adult mouth pain
    relief products that covers products classified under ATC4 class A1A2 excluding mouthwashes
    (i.e. antiseptics and anti-infectives) and products classified under ATC4 class A1A3 (i.e.
    anti-inflammatories and analgesics), and (ii) a market for paediatric mouth pain relief
    products that covers products classified under ATC4 class A1A2 excluding mouthwashes (i.e.
    antiseptics and anti-infectives) and products classified under ATC4 class A1A3 (i.e. anti-inflammatories
    and analgesics).
