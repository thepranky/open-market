  quote_snippet: (22) The Commission’s market investigation did not provide conclusive evidence
    regarding the question whether the relevant product market should be defined at ATC3/CHC3
    level (including all types of sore throat remedies) or at ATC4/CHC4 level (including only
    aerosols and sprays).20 For the purposes of this decision, the product market definition
    for sore throat remedies can be left open, as the Transaction does not give rise to serious
    doubts as to its compatibility with the internal market or the functioning of the EEA agreement
    even in the narrowest plausible market where the Parties’ activities overlap (i.e., sore
