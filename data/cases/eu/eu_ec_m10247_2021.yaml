product_markets_considered:
- market_id: pm_1
  name: Finished dose pharmaceuticals (FDPs)
  definition_status: left_open
  notes: The Commission stated it was not necessary to depart from its typical approach, which
    involves defining markets for FDPs at ATC3/CHC3, ATC4/CHC4 or molecule levels.
- market_id: pm_2
  name: Antihaemorrhoids
  definition_status: left_open
  notes: The market definition for antihaemorrhoids was left open, considering plausible markets
    at ATC3 class C5A, CHC3 code 10A1, and CHC4 code 10A1O (antihaemorrhoidal ointments and
    creams).
- market_id: pm_3
  name: Sore throat remedies
  definition_status: left_open
  notes: The market definition for sore throat remedies was left open, considering plausible
    markets at ATC3 level (R2A) or CHC4 level (aerosols or sprays).
- market_id: pm_4
  name: Mouth pain relief products
  definition_status: left_open
  notes: The market definition for mouth pain relief products was left open, considering plausible
    markets at ATC3/CHC3 level or CHC4 level (liquids).
- market_id: pm_5
  name: Ear care products
  definition_status: left_open
  notes: The exact product market definition for ear care products was left open, considering
    plausible markets at CHC3 code 08A1 and CHC4 code 08A1Z (Ear Care in other forms).
- market_id: pm_6
  name: Antitussives (in combination)
  definition_status: left_open
  notes: The market definition for antitussives was left open, considering plausible markets
    at ATC3 code R5D and ATC4 code R5D2. The Commission noted that the parties no longer overlap
    in ATC4 class R5D2 due to regulatory changes.
- market_id: pm_7
  name: Intestinal anti-infective anti-diarrhoeals
  definition_status: left_open
  notes: The market definition for intestinal anti-infective anti-diarrhoeals was left open,
    considering plausible markets at ATC3 level (A7A) or at molecule level (nifuroxazide-based).
- market_id: pm_8
  name: Finished dose pharmaceuticals (FDPs) (vertically affected)
  definition_status: left_open
  notes: The precise delineation of FDP markets that are vertically affected by the transaction
    was left open as no competition concerns arose under any plausible definition.
- market_id: pm_9
  name: Flexible packaging for pharmaceuticals
  definition_status: left_open
  notes: The question of whether the market should be further segmented (into laminated sachets,
    coldform blister bases, plastic-based blister bases, and blister lidding) was left open
    as no competition concerns arose.
- market_id: pm_10
  name: Packaging machinery (for the pharmaceutical sector)
  definition_status: left_open
  notes: The question of whether the market includes all packaging machinery or only for the
    pharmaceutical sector was left open as no competition concerns arose.
- market_id: pm_11
  name: Active pharmaceutical ingredients (APIs)
  definition_status: left_open
  notes: The exact product market definition for APIs was left open as no competition concerns
    arose under any plausible definition. The Commission's decisional practice is that each
    API typically belongs to a separate market.
- market_id: pm_12
  name: Pharmaceutical excipients (segmented by substance ingredients; lactose segmented into
    wet granulation and direct compression lactose)
  definition_status: considered
  notes: The Commission's investigation did not require a departure from previous decisional
    practice to consider separate markets based on substance ingredients and sub-segmenting
    lactose.
- market_id: pm_13
  name: CDMO services (for FDPs, for APIs, and further segmentation)
  definition_status: left_open
  notes: The exact product market definition for CDMOs was left open, including distinctions
    for FDPs and APIs, and further segmentation by pharmaceutical form, manufacturing conditions,
    API type, and delivery mechanism.
- market_id: pm_14
  name: Hospital services (private hospital services)
  definition_status: left_open
  notes: The product market definition for hospital services, specifically whether private hospital
    services constitute a separate market from public hospital services, was left open.
geographic_markets_considered:
- market_id: gm_1
  name: FDPs — national (general)
  definition_status: defined
  notes: The Commission consistently defines relevant markets for FDPs at a national level.
- market_id: gm_2
  name: Topical antihaemorrhoidals — national (Italy affected)
  definition_status: considered
  notes: This market was identified as a Group 1/1+ affected market in Italy at the ATC3 class
    C5A level.
- market_id: gm_3
  name: Antihaemorrhoids — national (Italy affected)
  definition_status: considered
  notes: This market was identified as a Group 1/1+ affected market in Italy at the CHC3 code
    10A1 level.
- market_id: gm_4
  name: Antihaemorrhoidal ointments and creams — national (Italy affected)
  definition_status: considered
  notes: This market was identified as a Group 1/1+ affected market in Italy at the CHC4 code
    10A1O level.
- market_id: gm_5
  name: Antihaemorrhoidal ointments and creams — national (Romania affected)
  definition_status: considered
  notes: This market was identified as a Group 1/1+ affected market in Romania at the CHC4 code
    10A1O level.
- market_id: gm_6
  name: Sore throat remedies in the form of aerosols/sprays — national (France affected)
  definition_status: considered
  notes: This market was identified as a Group 1/1+ horizontally affected market in France at
    the CHC4 level (01C1A – Sore throat Remedies – Aerosols/Sprays).
- market_id: gm_7
  name: Mouth pain relief liquids (Topical) — national (France affected)
  definition_status: considered
  notes: This market was identified as a Group 1/1+ horizontally affected market in France at
    the CHC4 level (02D1L – Mouth Pain Relief – Liquids (Topical)).
- market_id: gm_8
  name: Ear care products in other forms — national (Spain affected)
  definition_status: considered
  notes: This market was identified as a Group 1/1+ horizontally affected market in Spain at
    the CHC4 level (08A1Z – Ear Care – Other Forms).
- market_id: gm_9
  name: Antitussives (in combination) — national (Luxembourg affected)
  definition_status: left_open
  notes: The geographic scope was not explicitly defined but the competitive assessment focused
    on Luxembourg, and the product market definition was left open.
- market_id: gm_10
  name: Finished dose pharmaceuticals (FDPs) (vertically affected) — national
  definition_status: defined
  notes: The Commission consistently defines the plausible markets for vertically affected FDPs
    as national in scope.
- market_id: gm_11
  name: Flexible packaging for pharmaceuticals — EEA-wide or wider
  definition_status: considered
  notes: The Commission considered the geographic scope for flexible packaging for pharmaceuticals
    to be at least EEA-wide, in line with previous decisional practice.
- market_id: gm_12
  name: Packaging machinery for pharmaceuticals — EEA-wide or wider
  definition_status: considered
  notes: The Commission considered the geographic scope for packaging machinery for pharmaceuticals
    to be at least EEA-wide.
- market_id: gm_13
  name: Active pharmaceutical ingredients (APIs) — EEA-wide or wider
  definition_status: left_open
  notes: The exact geographic market definition for APIs was left open as no competition concerns
    arose under any plausible definition. The Commission's previous practice considered it at
    least EEA-wide.
- market_id: gm_14
  name: Pharmaceutical excipients (segmented by substance ingredients; lactose segmented into
    wet granulation and direct compression lactose) — EEA-wide or wider
  definition_status: considered
  notes: The Commission's investigation did not require a departure from previous decisional
    practice, which considered at least EEA-wide markets for excipients.
- market_id: gm_15
  name: CDMO services (for FDPs, for APIs, and further segmentation) — EEA-wide or wider
  definition_status: left_open
  notes: The exact geographic market definition for CDMO services was left open. Previous Commission
    decisions indicated the geographic scope is at least EEA-wide.
- market_id: gm_16
  name: Private hospital services — national or narrower
  definition_status: left_open
  notes: The exact geographic market definition for private hospital services was left open.
    Previous Commission decisions indicated it is national or narrower.
