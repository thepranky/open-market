- passage_id: sp_9
  source_document_id: eu_pkn_orlen_normbenz_selected_hungarian_and_slovak__2022_decision
  page: '6'
  quote_snippet: For the purpose of the present case, the Commission will leave open a possible
    sub-segmentation between on and off-motorway stations, given that neither approach would
    give rise to competition concerns. Given that affected markets only arise on local markets
    comprising off-motorway stations, only the off-motorway stations (i.e. the narrowest plausible
    segment) will be further discussed in this decision.
