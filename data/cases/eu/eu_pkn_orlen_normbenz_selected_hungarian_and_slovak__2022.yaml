- passage_id: sp_2
  source_document_id: eu_pkn_orlen_normbenz_selected_hungarian_and_slovak__2022_decision
  page: '4'
  quote_snippet: The Commission has concluded that the retail supply of motor fuels should not
    be further sub-segmented by type of fuel product (diesel, gasoline and automotive liquefied
    petroleum gas (‘LPG’)),7 and it has defined the market for the retail sales of motor fuels
    as encompassing the sales of all motor fuels at service stations.
  extraction_method: pdf_extracted
