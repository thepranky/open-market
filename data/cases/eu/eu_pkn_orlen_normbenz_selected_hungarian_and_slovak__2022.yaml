- passage_id: sp_3
  source_document_id: eu_pkn_orlen_normbenz_selected_hungarian_and_slovak__2022_decision
  page: '5'
  quote_snippet: The Commission’s market investigation supports the view that the retail supply
    of motor fuels encompasses all types of motor fuels available at stations, including LPG,
    with all respondents unanimously confirming this point.
  extraction_method: pdf_extracted
