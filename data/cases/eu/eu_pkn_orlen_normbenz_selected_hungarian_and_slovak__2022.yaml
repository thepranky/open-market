- passage_id: sp_4
  source_document_id: eu_pkn_orlen_normbenz_selected_hungarian_and_slovak__2022_decision
  page: '5'
  quote_snippet: Finally, the Commission has also considered a segmentation for the retail supply
    of motor fuels between sales to B2B customers (via a fuel card) and to B2C customers. In
    PKN Orlen / Grupa Lotos, the Commission concluded that such a segmentation was appropriate
    mainly because of the different price setting/levels, diverse needs of each group of customers
    (notably in terms of network coverage, of number of on-motorways stations, toll payment
    system, online invoicing tools, and payment conditions).
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_2
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_5
  source_document_id: eu_pkn_orlen_normbenz_selected_hungarian_and_slovak__2022_decision
  page: '6'
  quote_snippet: The market investigation has also confirmed that B2B and B2C sales belong to
    distinct markets, with all but one respondents confirming this point.22 Respondents pointed
    to the different customer structures in both segments, and to the difference in customers’
    needs. One respondent explained that while B2B customers primarily decide based on price
    and on the locations of the stations which are members of the network, B2C customers tend
    to be more demanding, and to expect a variety of other products and services to be available
    at petrol stations, and to place importance on the cleanliness of the facilities and the
    friendliness of the staff.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
