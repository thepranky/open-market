- passage_id: sp_16
  source_document_id: eu_pkn_orlen_normbenz_selected_hungarian_and_slovak__2022_decision
  page: '8'
  quote_snippet: Given the absence of affected markets at a national level, the Commission will
    only assess competition concerns at the local level. It will examine local areas where the
    Parties’ stations overlap, using isochrones based on driving distances of 2.5 km, 5 km and
    20 km in cities, suburban areas and rural areas respectively.
  extraction_method: pdf_extracted
