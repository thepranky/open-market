- passage_id: sp_15
  source_document_id: eu_pkn_orlen_normbenz_selected_hungarian_and_slovak__2022_decision
  page: '8'
  quote_snippet: As regards the local level, the Commission's market investigation in the present
    case suggests that the motor fuel retail supply of motor fuels in Slovakia and Hungary has
    a significant local dimension for B2C customers. For the purpose of assessing the local
    dimension of competition, a majority of respondents confirmed that isochrones based on driving
    distances of 2.5 km, 5 km and 20 km in cities, suburban areas and rural areas respectively
    reflect the distance within which motorists consider competing alternatives.
  extraction_method: pdf_extracted
  review_status: unreviewed
