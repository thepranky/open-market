product_markets_considered:
- market_id: pm_1
  name: Retail sale of motor fuels
  definition_status: considered
  notes: The Commission considered this broad market in previous decisions, encompassing all
    types of motor fuels available at service stations, including LPG. The current decision's
    market investigation supported this view, but the assessment was further segmented.
- market_id: pm_2
  name: Retail sale of motor fuels to B2C customers
  definition_status: defined
  notes: The Commission's market investigation confirmed that B2C sales belong to a distinct
    market from B2B sales due to different customer structures, needs, and price setting/levels.
- market_id: pm_3
  name: Retail sale of motor fuels to B2B customers
  definition_status: defined
  notes: The Commission's market investigation confirmed that B2B sales belong to a distinct
    market from B2C sales. However, the proposed transaction did not result in an affected market
    for B2B customers, so it was not further discussed.
- market_id: pm_4
  name: Retail sale of motor fuels to B2C customers at off-motorway stations
  definition_status: considered
  notes: While the Commission left open a general sub-segmentation between on and off-motorway
    stations, it explicitly stated that it would only assess the impact of the transaction on
    off-motorway stations, as affected markets only arose in this segment.
geographic_markets_considered:
- market_id: gm_1
  name: Retail sale of motor fuels to B2C customers — national (Hungary and Slovakia affected)
  definition_status: defined
  notes: The Commission defined the market for retail supply of motor fuels as national, with
    a local dimension for B2C customers in Hungary and Slovakia, in line with previous cases.
- market_id: gm_2
  name: Retail sale of motor fuels to B2C customers at off-motorway stations — local (Hungary
    and Slovakia affected)
  definition_status: considered
  notes: The Commission decided to assess competition concerns at the local level, focusing
    on off-motorway stations, using isochrones based on driving distances (2.5 km for cities,
    5 km for suburban, 20 km for rural areas).
theories_of_harm: []
