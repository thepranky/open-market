product_markets_considered:
- market_id: pm_1
  name: Supply of fresh milk
  definition_status: defined
  notes: The Commission considered that fresh milk constitutes a separate product market from
    long-life milk. It comprises pasteurised milk and Extended Shelf Life (ESL) milk, both branded
    and private label products. The question of whether the market should be segmented according
    to the distribution channel (retail and out-of-home) and whether there could be a health
    segment was left open. Conventional and organic fresh milk constitute separate product markets.
- market_id: pm_2
  name: Supply of conventional fresh milk
  definition_status: defined
  notes: Conventional and organic fresh milk constitute separate product markets.
- market_id: pm_3
  name: Supply of organic fresh milk
  definition_status: defined
  notes: Conventional and organic fresh milk constitute separate product markets.
- market_id: pm_4
  name: Supply of baby meals
  definition_status: defined
  notes: Baby meals designate prepared meals and individual ingredients for meal preparation,
    labelled and marketed for babies and children from 6 months up to 36 months. They include
    mashed purées with a combination of vegetables and meat or fish, single food purees, fruit
    compotes, soups and ambient dairy products.
- market_id: pm_5
  name: Supply of baby dry cereals
  definition_status: defined
  notes: A segment of the baby foods market.
- market_id: pm_6
  name: Supply of baby snacks
  definition_status: defined
  notes: Baby snacks refer to all sweet and savoury snacks intended for babies and toddlers
    from 4 to 36 months and include biscuits, crackers, cereals bars and fruit bars.
- market_id: pm_7
  name: Supply of baby drinks
  definition_status: defined
  notes: A segment of the baby foods market.
- market_id: pm_8
  name: Retail sale of daily consumer goods through modern distribution channels
  definition_status: defined
  notes: Includes retail outlets such as hypermarkets, supermarkets and discount chains. The
    Commission generally considered that other types of retailers such as specialised outlets
    (butchers or bakers, for instance), kiosks, cash & carry stores and service stations do
    not belong to the relevant market. Segmentation by store surface was left open for consumer
    relationships but deemed not relevant for evaluating upstream relationships between suppliers
    and retailers for the purpose of the vertical assessment.
geographic_markets_considered:
- market_id: gm_1
  name: Supply of fresh milk — national/regional (Italy affected)
  definition_status: left_open
  notes: The Commission left open whether the market for fresh milk in Italy was of a national
    or narrower (regional) dimension, as the transaction did not give rise to competition concerns
    even under the narrower market definition. Market investigation results indicated fresh
    milk is procured predominantly at a regional level, but national players exist, and transport
    distances can extend beyond individual regions.
- market_id: gm_2
  name: Supply of baby foods — national (Italy affected)
  definition_status: defined
  notes: The Commission considers the markets for baby food to have a national geographic dimension,
    based on features such as procurement at national level, price differences among Member
    States, existence of national brands, and differences in consumption and market growth.
- market_id: gm_3
  name: Retail sale of daily consumer goods through modern distribution channels — local (Italy
    affected)
  definition_status: defined
  notes: The geographic market for the retail sale of daily consumer goods is considered local,
    corresponding to a catchment area around each store based on travel distance. Hypermarkets
    typically have larger catchment areas (20-30 minutes by car) compared to supermarkets (10-20
    minutes).
