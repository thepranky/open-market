  page: '8'
  quote_snippet: The Notifying Parties submit that the relevant product market should be defined
    as encompassing all CDMO services offered to pharmaceutical companies for FDPs, without
    any further segmentation, given that irrespective of whether the market comprises both CMO
    and CDO or whether CDO should be considered separately, the Transaction does not raise any
    doubts as to its compatibility with the internal market.39
