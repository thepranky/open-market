- passage_id: sp_3
  source_document_id: eu_nb_ardian_mediolanum_2023_decision
  page: '7'
  quote_snippet: In light of the above and for the purpose of this decision, the Commission
    considers that NeoGen’s product Axil and Mediolanum’s product Lonquex belong to separate
    product markets. As far as the other FDPs the Target is active in and are relevant in the
    context of the present Transaction, i.e. in the context of vertically affected markets described
    in Table 2 below, are concerned, the exact product market definition can be left open, as
    the Transaction does not give rise to serious doubts as to its compatibility with the internal
    market or the functioning of the EEA Agreement under any plausible product market definition
    (i.e. ATC3 or ATC4).
  extraction_method: pdf_extracted
