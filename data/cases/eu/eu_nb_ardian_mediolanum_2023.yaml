  quote_snippet: In previous decisions, the Commission has found the relevant geographic market
    for CDMO services to be worldwide or at least EEA-wide, as CDMO services are generally procured
    anywhere in the EEA, regardless of the EEA country where the pharmaceutical products are
    subsequently marketed, given the economics of the services under consideration, as well
