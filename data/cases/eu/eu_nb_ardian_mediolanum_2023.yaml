source_passages:
- passage_id: sp_1
  source_document_id: eu_nb_ardian_mediolanum_2023_decision
  page: '5'
  quote_snippet: 'The activities of the Parties give rise to horizontal overlaps in (i) the
    commercialization of FDPs and (ii) food supplements in Italy.22 However, the Transaction
    does not give rise to any horizontally affected markets. As further explained in Section
    4.2 below, one technically horizontal overlap would arise from the Parties’ activities in
    the commercialization of FDPs at the ATC3 level,23 class L03A (“Immunostimolanting agents
    excluding interferons”) in Italy, where the Parties’ combined market share would amount
    to [70-80]% in value (NeoGen: [60-70]%, Mediolanum: [5-10]%) and [60-70]% in volume (NeoGen:
    [60-70]%, Mediolanum: [0-5]%). In this class, NeoGen is active with the product Axil, used
    in the treatment of respiratory or urinary tract infections, while Mediolanum is present
    with the product Lonquex, which is used for the reduction of neutropenia as a possible complication
    of chemotherapy treatments. However, the products commercialized by NeoGen and Mediolanum
    belong to separate product markets, as further explained in section 4.2.1 below.'
  extraction_method: pdf_extracted
