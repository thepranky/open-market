- passage_id: sp_4
  source_document_id: eu_nb_ardian_mediolanum_2023_decision
  page: '8'
  quote_snippet: In the past, the Commission considered the existence of a market for the supply
    of CDMO services for APIs distinct from the market for the supply of contract manufacturing
    for FDPs.37 With regard to the CDMO market for FDPs, further segmentations were considered
    on the basis of (i) the pharmaceutical form manufactured (e.g. solid, semi-solid, injectable);
    (ii) the conditions of manufacture (e.g. toxicity, sterile environment); (iii) the type
    of API used for its production; (iv) the delivery mechanism used (e.g. swallowing, intravenous,
    injection), and (v) between the supply of dosage formulation and development services (CDO)
    and of contract manufacturing services (CMO).
  extraction_method: pdf_extracted
