product_markets_considered:
- market_id: pm_1
  name: Commercialization of Finished Dose Pharmaceuticals (FDPs)
  definition_status: left_open
  notes: The Commission's past practice uses the Anatomical Therapeutic Classification (ATC)
    system, particularly the ATC3 level, as a starting point. While the exact scope of the overall
    FDP market was left open, the Commission specifically concluded that NeoGen’s product Axil
    and Mediolanum’s product Lonquex, despite a technical overlap at the ATC3 level (L03A),
    belong to separate product markets due to falling under different ATC4 classes and significant
    differences in therapeutic indications, method of administration, distribution channels,
    and cost, which was confirmed by competitors. For other FDPs relevant to vertical markets,
    the exact market definition was also left open.
- market_id: pm_2
  name: Contract Development and Manufacturing Organisation (CDMO) services
  definition_status: left_open
  notes: CDMO services involve the upstream manufacturing of Finished Dose Pharmaceuticals (FDPs)
    and Active Pharmaceutical Ingredients (APIs) under contract for third-party pharmaceutical
    companies. The Commission noted its past practice considered segmentations based on API
    vs. FDP, pharmaceutical form, manufacturing conditions, type of API, delivery mechanism,
    and between dosage formulation/development services (CDO) and contract manufacturing services
    (CMO). However, for the purpose of this decision, the exact product market definition was
    left open as the transaction did not raise serious doubts irrespective of segmentation.
geographic_markets_considered:
- market_id: gm_1
  name: Commercialization of Finished Dose Pharmaceuticals (FDPs) — national (Italy affected)
  definition_status: defined
  notes: Consistent with its past practice, the Commission defined the relevant geographic market
    for FDPs as national in scope, primarily due to regulatory barriers arising from national
    reimbursement systems.
- market_id: gm_2
  name: Contract Development and Manufacturing Organisation (CDMO) services — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission's past decisions typically found the geographic market for CDMO services
    to be worldwide or at least EEA-wide due to the economics of the services and absence of
    trade barriers. For this decision, the exact geographic market definition was left open
    as the transaction did not raise serious doubts irrespective of whether the market was EEA-wide
    or global.
