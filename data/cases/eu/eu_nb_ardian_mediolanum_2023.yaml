- passage_id: sp_2
  source_document_id: eu_nb_ardian_mediolanum_2023_decision
  page: '6'
  quote_snippet: The Notifying Parties submit that the product market definition can be left
    open because irrespective of the exact scope of the relevant product market, no competition
    concerns would arise. The Notifying Parties further submit that, even in the only FDP ATC3
    level where the Parties’ activities technically overlap horizontally (class L03A), NeoGen’s
    Axil product and Mediolanum’s Lonquex product (i) fall under different ATC4 classes, and
    (ii) are not substitutable.
  extraction_method: pdf_extracted
