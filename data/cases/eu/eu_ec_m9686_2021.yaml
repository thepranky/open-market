  quote_snippet: In previous decisions, the Commission has considered that the geographic market
    definition for crop protection products is national. This is because their authorisation
    is still regulated at the national level, each Member State remains responsible for maintaining
    specific national data requirements, distributors of crop protection products usually are
    adapted to varying demands of their customers in different Member States and pricing data
    indicated national differences in price levels and evolution for the same products.
