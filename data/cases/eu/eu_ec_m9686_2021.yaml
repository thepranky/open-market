product_markets_considered:
- market_id: pm_1
  name: Formulated crop protection products — by pest(s) targeted and crop
  definition_status: considered
  notes: The Commission's precedents segmented relevant product markets for formulated crop
    protection products on the basis of the pest(s) targeted and then by crop. This segmentation
    applies to fungicides, herbicides, insecticides, PGRs, and seed treatment. The market investigation
    confirmed this general approach, further segmenting fungicides and insecticides by mode
    of application, and herbicides by time of application and agricultural/non-agricultural
    uses.
- market_id: pm_2
  name: Molluscicides
  definition_status: defined
  notes: The Commission previously considered molluscicides to constitute a distinct product
    market, and this was confirmed by the market investigation.
- market_id: pm_3
  name: Paraffinic oils for virus control
  definition_status: defined
  notes: The Commission concluded that paraffinic oils for virus control constitute a separate
    product market from insecticides, a view supported by the Notifying Party and market investigation
    findings. Vegetable oils are not considered close substitutes.
- market_id: pm_4
  name: Paraffinic oils for virus control in seed potatoes
  definition_status: defined
  notes: The Commission concluded that the market for paraffinic oils for virus control should
    be further segmented by crop, specifically distinguishing between seed potatoes and flower
    bulbs, due to different product registrations and competitive conditions.
- market_id: pm_5
  name: Paraffinic oils for virus control in flower bulbs
  definition_status: defined
  notes: The Commission concluded that the market for paraffinic oils for virus control should
    be further segmented by crop, specifically distinguishing between flower bulbs and seed
    potatoes, due to different product registrations and competitive conditions.
- market_id: pm_6
  name: Plant growth regulators (PGRs) for potatoes
  definition_status: considered
  notes: The Notifying Party suggested segmenting potato PGRs by time of application (pre- vs.
    post-harvest) and, within post-harvest, by preventative vs. curative products. The Commission's
    market investigation supported the pre- vs. post-harvest segmentation but did not support
    the preventative vs. curative distinction for post-harvest products.
- market_id: pm_7
  name: Pre-harvest potato plant growth regulators (PGRs)
  definition_status: defined
  notes: The Commission concluded, based on market investigation, that potato PGRs should be
    segmented into pre-harvest and post-harvest categories, without further sub-segmentation
    within post-harvest products.
- market_id: pm_8
  name: Post-harvest potato plant growth regulators (PGRs)
  definition_status: defined
  notes: The Commission concluded, based on market investigation, that potato PGRs should be
    segmented into pre-harvest and post-harvest categories, without further sub-segmentation
    within post-harvest products (such as preventative vs. curative).
- market_id: pm_9
  name: Potato desiccants
  definition_status: defined
  notes: The Commission considered Beloukha to be a potato desiccant based on registration,
    marketing, sales, and market investigation results, assessing the overlap in this market.
geographic_markets_considered:
- market_id: gm_1
  name: Formulated crop protection products — national (various countries affected)
  definition_status: defined
  notes: The Commission consistently found the geographic market for crop protection products
    to be national, based on national authorisation, data requirements, varying demands for
    distributors, and national price differences. This was confirmed by the market investigation
    for various product types in this case.
- market_id: gm_2
  name: Paraffinic oils for virus control in seed potatoes — national (Netherlands affected)
  definition_status: defined
  notes: The geographic market for paraffinic oils for virus control in seed potatoes was confirmed
    to be national, specifically for the Netherlands, in line with general findings for crop
    protection products.
- market_id: gm_3
  name: Paraffinic oils for virus control in flower bulbs — national (Netherlands affected)
  definition_status: defined
  notes: The geographic market for paraffinic oils for virus control in flower bulbs was confirmed
    to be national, specifically for the Netherlands, consistent with general findings for crop
    protection products.
- market_id: gm_4
  name: Post-harvest potato plant growth regulators (PGRs) — national (Germany, Poland, Denmark,
    Sweden, Finland, Norway affected)
  definition_status: defined
  notes: The geographic markets for post-harvest potato PGRs were confirmed to be national,
    in line with general findings for crop protection products. The transaction gave rise to
    affected markets in Germany, Poland, Denmark, Sweden, and loss of potential competition
    in Finland and Norway.
- market_id: gm_5
  name: Pre-harvest potato plant growth regulators (PGRs) — national (Germany affected)
  definition_status: defined
  notes: The geographic market for pre-harvest potato PGRs in Germany was found to be national,
    in line with general findings for crop protection products.
- market_id: gm_6
  name: Potato desiccants — national (Netherlands affected)
  definition_status: defined
  notes: The geographic market for potato desiccants was confirmed to be national, specifically
    for the Netherlands, consistent with general findings for crop protection products.
- market_id: gm_7
  name: Vine fungicides for downy mildew — national (Austria affected)
  definition_status: defined
  notes: The geographic market for vine fungicides for downy mildew in Austria was found to
    be national.
- market_id: gm_8
  name: Vine fungicides for downy mildew — national (Germany affected)
  definition_status: defined
  notes: The geographic market for vine fungicides for downy mildew in Germany was found to
    be national.
- market_id: gm_9
  name: Potato fungicides for late blight — national (Belgium affected)
  definition_status: defined
  notes: The geographic market for potato fungicides for late blight in Belgium was found to
    be national.
- market_id: gm_10
  name: Potato fungicides for late blight — national (Germany affected)
  definition_status: defined
  notes: The geographic market for potato fungicides for late blight in Germany was found to
    be national.
- market_id: gm_11
  name: Potato fungicides for late blight — national (Netherlands affected)
  definition_status: defined
  notes: The geographic market for potato fungicides for late blight in the Netherlands was
    found to be national.
- market_id: gm_12
  name: Potato fungicides for late blight — national (United Kingdom affected)
  definition_status: defined
  notes: The geographic market for potato fungicides for late blight in the United Kingdom was
    found to be national.
- market_id: gm_13
  name: Cross spectrum – pre emergence - herbicides for vegetable crops — national (Netherlands
    affected)
  definition_status: defined
  notes: The geographic market for cross spectrum – pre emergence - herbicides for vegetable
    crops in the Netherlands was found to be national.
- market_id: gm_14
  name: Sucking pests insecticides for stone fruit — national (Spain affected)
  definition_status: defined
  notes: The geographic market for sucking pests insecticides for stone fruit in Spain was found
    to be national.
- market_id: gm_15
  name: Sucking pests insecticides for potato — national (Netherlands affected)
  definition_status: defined
  notes: The geographic market for sucking pests insecticides for potato in the Netherlands
    was found to be national.
- market_id: gm_16
  name: Pre-harvest potato plant growth regulators (PGRs) — national (Germany affected)
  definition_status: defined
  notes: The geographic market for pre-harvest potato PGRs in Germany was found to be national,
    in line with general findings for crop protection products.
