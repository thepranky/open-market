  source_document_id: eu_ec_m9686_2021_decision
  page: '3'
  quote_snippet: 'The undertakings concerned have a combined aggregate world-wide turnover of
    more than EUR 5 000 million7 [Mitsui: […], Belchim: […]. Each of them has an EU-wide turnover
    in excess of EUR 250 million [Mitsui: […], Belchim: […] and they do not achieve more than
    two-thirds of their aggregate EU-wide turnover within one and the same Member State. The
    notified operation therefore has a Union dimension pursuant to Article 1(2) of the Merger
    Regulation.'
