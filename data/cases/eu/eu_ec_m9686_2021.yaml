- passage_id: sp_8
  source_document_id: eu_ec_m9686_2021_decision
  page: '7'
  quote_snippet: The results of the market investigation support the Notifying Party’s view
    that paraffinic oils for virus control constitute a separate product market from insecticides.
    The majority of competitors expressing an opinion consider that paraffinic oils for virus
    control should constitute a separate market. Customers point at these products’ particularities
    and the lack of alternative products. The results of the market investigation did not contradict
    the Notifying Party’s claim that vegetable oils are not close substitutes to paraffinic
    oils.
  extraction_method: pdf_extracted
