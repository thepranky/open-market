- passage_id: sp_7
  source_document_id: eu_ec_m9686_2021_decision
  page: '6'
  quote_snippet: As regards paraffinic oils for virus control, the Notifying Party submits that
    this should be a separate market from insecticides. The Notifying Party considers that paraffinic
    oils and insecticides operate in different ways and are used for different purposes. According
    to the Notifying Party, paraffinic oils have a different mode of action to insecticides,
    as the former do not kill the pests, but are used to avoid that they transmit the virus
    they may carry.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
