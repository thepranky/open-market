- passage_id: sp_6
  source_document_id: eu_ec_m9686_2021_decision
  page: '5'
  quote_snippet: Molluscicides are crop protection products designed to combat snails and other
    types of molluscs. They generally consist of chemically treated baits which are spread onto
    the soil. In case M.2547 – Bayer / Aventis Crop Science (2002), paragraph 527, the Commission
    considered that molluscicides form a separate product market as they cannot be substituted
    by other insecticides and that a breakdown by type of crop would not be appropriate since
    the formulation of molluscicides does not vary according to the plants affected.
  extraction_method: pdf_extracted
