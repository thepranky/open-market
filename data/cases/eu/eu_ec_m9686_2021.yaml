- passage_id: sp_43
  source_document_id: eu_ec_m9686_2021_decision
  page: '51'
  quote_snippet: The Commission therefore concludes that the Commitments are sufficient to remove
    entirely the concerns identified in the potato PGRs markets in Germany, Poland, Denmark,
    Sweden, Finland and Sweden, as well as, in the Dutch markets of paraffinic oils for virus
    control in seed potatoes and flower bulbs. Moreover, the Commission considers that the Commitments
    are able to create a lasting situation ensuring that the identified concerns will not materialise.
  extraction_method: pdf_extracted
