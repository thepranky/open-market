  quote_snippet: In past cases, the Commission found that the relevant product markets for formulated
    crop protection products can be segmented on the basis of the pest(s) targeted and then
    by crop where each such combination constitutes a separate relevant product market. This
    applies to fungicides, herbicides, insecticides (including acaricides), PGRs and seed treatment.
  extraction_method: pdf_extracted
