product_markets_considered:
- market_id: pm_1
  name: Life insurance products
  definition_status: left_open
  notes: The Commission left open the exact scope of the product market definition for life
    insurance. It assessed an overall market for savings and investment life insurance products,
    as well as a plausible sub-segment of unit-linked products. Segmentation into pure risk
    protection, pension products, savings/investment products, individual/group customers, and
    unit-linked/non-unit-linked products was considered. The inclusion of health insurance within
    life insurance was also left open.
- market_id: pm_2
  name: Pension products (Greece)
  definition_status: left_open
  notes: The Commission left open the exact scope of the product market definition for the supply
    of pension products in Greece, specifically whether an overall market composed of Pillars
    II and III exists, or if each Pillar II and Pillar III constitutes a separate market. The
    Parties' activities overlap only in Pillar III, which consists of DAF group pension fund
    products.
- market_id: pm_3
  name: Pension products – Open pension funds (Poland)
  definition_status: considered
  notes: The Commission's previous decisional practice had not concluded on the exact market
    definition of the Polish pension system but indicated that obligatory pensions (pillars
    one and two) and voluntary pensions (pillar three) might form two separate product markets.
    For the purpose of this decision, the Commission considered the second pillar (Open Pension
    Funds, OFE) of the Polish pension system in its analysis.
- market_id: pm_4
  name: Reinsurance
  definition_status: left_open
  notes: The Commission has previously considered a separate market for reinsurance but left
    open whether it should be further segmented between life and non-life reinsurance. For this
    decision, the exact scope of the product market definition for reinsurance was left open.
- market_id: pm_5
  name: Insurance distribution
  definition_status: left_open
  notes: The Commission has previously left open whether the market for insurance distribution
    includes only outward distribution channels or also direct sales, and whether a distinction
    could be made between life and non-life insurance products or a separate market for insurance
    broking. For this decision, the exact scope of the product market definition for insurance
    distribution was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Life and health insurance products and its segments — national (Greece affected)
  definition_status: defined
  notes: The geographic scope for life and health insurance products and its segments was defined
    as national, consistent with previous decisional practice and market investigation findings.
- market_id: gm_2
  name: DAF products — national (Greece affected)
  definition_status: defined
  notes: The geographic scope for DAF (Deposit Administration Fund) products in Greece was defined
    as national, consistent with previous decisional practice and market investigation findings.
- market_id: gm_3
  name: OFE pension products — national (Poland affected)
  definition_status: defined
  notes: The geographic scope for Open Pension Fund (OFE) pension products in Poland was defined
    as national, consistent with previous decisional practice and market investigation findings.
- market_id: gm_4
  name: Reinsurance — worldwide
  definition_status: considered
  notes: The geographic market for reinsurance was considered worldwide in scope, consistent
    with the Commission's consistent decisional practice.
- market_id: gm_5
  name: Insurance distribution — left open (national/EEA-wide/worldwide, Greece affected)
  definition_status: left_open
  notes: The Commission previously considered insurance distribution to be national in scope
    but left the exact definition open. For this decision, the exact scope of the geographic
    market definition was left open between national, EEA-wide, and worldwide, noting that for
    the distribution of life and health insurance and pension products in Greece, the most plausible
    definition is national.
