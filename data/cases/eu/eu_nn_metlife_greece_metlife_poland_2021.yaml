  page: '12'
  quote_snippet: In previous cases, the Commission has analysed whether the market for insurance
    distribution comprises only outward distribution channels or whether it should also be considered
    to include the sales force and office networks of the insurer (that is to say direct sales).
    This question was ultimately left open. The Commission has also considered whether a distinction
    could be made between the markets for the distribution of life and non-life insurance products,
    but ultimately left open the relevant product market definitions 60 as well as whether there
    was a potential separate market for insurance broking.
