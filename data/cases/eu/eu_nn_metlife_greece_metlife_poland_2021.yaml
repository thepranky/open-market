  source_document_id: eu_nn_metlife_greece_metlife_poland_2021_decision
  page: '9'
  quote_snippet: In any event, the Commission considers that, for the purposes of the present
    decision, the exact scope of the product market definition for the supply of pension products
    in Greece (that is if there is an overall market, composed of Pillars II and III, or if
    each of Pillars II and III is a separate market) can be left open, since the Transaction
    does not raise serious doubts as to its compatibility with the internal market under any
    plausible product market definition.
