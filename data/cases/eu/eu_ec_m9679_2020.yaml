- passage_id: sp_4
  source_document_id: eu_ec_m9679_2020_decision
  page: '5'
  quote_snippet: (23) For the purpose of the present decision, the Commission considers that
    the exact product market definition in relation to the provision of retail mobile telecommunications
    services (whether there is an overall market for retail mobile communication services or
    whether this market should be segmented between pre-paid and post-paid or between private
    and business customers) can be left open as the Transaction does not give rise to serious
    doubts as to its compatibility with the internal market or the functioning of the EEA Agreement
    under any such product market definition.
  extraction_method: pdf_extracted
