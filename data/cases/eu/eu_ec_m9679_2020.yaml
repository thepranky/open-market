  - pm_1
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_2
  source_document_id: eu_ec_m9679_2020_decision
  page: '4'
  quote_snippet: (16) The Commission considers that for the purpose of the present decision
    the question whether (i) FTA services and Pay TV services, (ii) linear Pay TV services and
    non-linear Pay TV services, (iii) different distribution technologies, and (iv) basic Pay
    TV services and premium Pay TV services belong to the same product markets can be left open
    as the Transaction does not raise serious doubts as to its compatibility with the internal
    market or the functioning of the EEA Agreement under any of the narrowest-possible product
    market definitions set out in this paragraph.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
