product_markets_considered:
- market_id: pm_1
  name: Retail supply of TV services
  definition_status: left_open
  notes: The Commission considered whether to segment this market into (i) FTA services and
    Pay TV services, (ii) linear Pay TV services and non-linear Pay TV services, (iii) different
    distribution technologies (e.g. Cable, OTT, satellite, IPTV or terrestrial), and (iv) basic
    Pay TV services and premium Pay TV services, but left the precise product market definition
    open as the Transaction did not raise serious doubts under any of the narrowest-possible
    definitions.
- market_id: pm_2
  name: Retail mobile communication services
  definition_status: left_open
  notes: The Commission considered possible segments of the overall retail market for mobile
    telecommunication services by distinguishing between pre-paid and post-paid services and
    between private customers and business customers, concluding that these did not constitute
    separate product markets but rather were market segments within an overall retail market.
    However, for the purpose of this decision, the exact product market definition was left
    open.
- market_id: pm_3
  name: Retail supply of fixed telephony services
  definition_status: left_open
  notes: The Commission considered whether there is an overall market for the retail supply
    of fixed telephony services or whether this market should be segmented into fixed voice
    services and VoIP services, but left the exact product market definition open.
- market_id: pm_4
  name: Wholesale mobile call termination services — termination on each individual mobile network
  definition_status: defined
  notes: null
- market_id: pm_5
  name: Wholesale fixed call termination services — termination on each individual fixed network
  definition_status: defined
  notes: null
- market_id: pm_6
  name: Wholesale international roaming services
  definition_status: defined
  notes: null
geographic_markets_considered:
- market_id: gm_1
  name: Retail supply of TV services — national (Bulgaria affected)
  definition_status: considered
  notes: The Commission's previous decisions considered the geographic scope to be national
    or, at most, limited to the coverage area of each cable operator. For the purpose of this
    decision, the Commission considers the market to be national in scope, noting the competitive
    assessment would remain the same also on a geographic market comprising the coverage area
    of each cable operator.
- market_id: gm_2
  name: Retail mobile communication services — national (Bulgaria affected)
  definition_status: defined
  notes: null
- market_id: gm_3
  name: Retail supply of fixed telephony services — national (Bulgaria affected)
  definition_status: defined
  notes: null
- market_id: gm_4
  name: Wholesale mobile call termination services — national (Bulgaria, Slovenia, Croatia affected)
  definition_status: defined
  notes: The geographic scope of the market is considered national, corresponding to the dimensions
    of the operator’s network, which is limited to the national territory due to regulatory
    barriers. The vertically affected markets for this service were identified in Bulgaria,
    Slovenia, and Croatia.
- market_id: gm_5
  name: Wholesale fixed call termination services — national (Bulgaria, Slovenia affected)
  definition_status: defined
  notes: The geographic scope of the market is considered national, corresponding to the dimensions
    of the operator’s network, which is limited to national borders due to regulatory barriers.
    The vertically affected markets for this service were identified in Bulgaria and Slovenia.
- market_id: gm_6
  name: Wholesale international roaming services — national (affected countries not specified)
  definition_status: defined
  notes: The geographic scope is considered national due to regulatory barriers to offering
    mobile services. While the parties operate in multiple countries, the supplied text does
    not specify the particular countries where this market is considered affected in the competitive
    assessment (Section 5).
