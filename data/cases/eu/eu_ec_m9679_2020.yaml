- passage_id: sp_3
  source_document_id: eu_ec_m9679_2020_decision
  page: '5'
  quote_snippet: (21) In previous decisions, the Commission has not further segmented the overall
    retail mobile market based on the type of service (voice calls, SMS, MMS, mobile Internet
    data services), or the type of network technology. The Commission has considered possible
    segments of the overall retail market for mobile telecommunication services by distinguishing
    between pre-paid and post-paid services and between private customers and business customers,
    concluding that these did not constitute separate product markets but rather were market
    segments within an overall retail market.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
