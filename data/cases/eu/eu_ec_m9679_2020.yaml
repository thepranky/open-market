source_passages:
- passage_id: sp_1
  source_document_id: eu_ec_m9679_2020_decision
  page: '4'
  quote_snippet: '(14) In its previous decisions, the Commission has considered the retail provision
    of free-to-air (“FTA”) and Pay-TV services as separate product markets but ultimately left
    open the product market definition. In addition, the Commission has considered whether a
    further segmentation shall be made according to: (i) linear vs. non-linear TV services,
    (ii) distribution technologies (e.g. Cable, OTT, satellite, IPTV or terrestrial) and (iii)
    premium Pay-TV vs. basic Pay-TV services but has left the market open with regard to each
    of these potential sub-segments.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
