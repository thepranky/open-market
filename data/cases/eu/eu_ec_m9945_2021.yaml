  page: '11'
  quote_snippet: The Notifying Party, referring to precedents at national level, submits that
    TPS for EBRT constitute a distinct product market which should not be further segmented
    between Linacs and proton therapy as EBRT TPS is designed for external radiation delivery,
    irrespective of whether that is proton based (i.e. proton therapy) or X-ray based (i.e.
    Linacs).
  extraction_method: pdf_extracted
