- passage_id: sp_23
  source_document_id: eu_ec_m9945_2021_decision
  page: '11'
  quote_snippet: The results of the market investigation confirmed the Notifying Party’s claim
    that TPS constitute a distinct product market from other healthcare software.47 Indeed,
    a majority of respondents indicated that, while TPS share some functionalities with other
    software solutions (e.g. contouring), TPS is not substitutable with other software solutions
    as it presents a specific set of functionalities that remain its sole remit, such as dose
    calculation for the planning of radiotherapy.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
