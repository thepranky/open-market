- passage_id: sp_13
  source_document_id: eu_ec_m9945_2021_decision
  page: '8'
  quote_snippet: 'In the absence of Commission precedents, the Notifying Party submits that
    there are four types of equipment used to deliver radiotherapy treatment, based on the position
    and radiation source, which each constitute separate product markets: [...] Linear accelerators
    (“Linacs”), which use high energy X-rays (photons) to destroy the cancerous cells.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_5
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_14
  source_document_id: eu_ec_m9945_2021_decision
  page: '9'
  quote_snippet: First, respondents to the market investigation confirmed that (i) Linacs, (ii)
    proton therapy equipment and (iii) brachytherapy equipment cannot be used interchangeably
    for the same medical procedures, revealing limited demand-side substitutability.32 In that
    respect, a customer explained that, “each type of treatment (external [EBRT], proton [therapy],
    brachy[therapy]) requires suitable equipment which cannot be interchangeable”,33 whilst
    another indicated that the use of the various equipment differs “because of their special
    inherent physics in dose application and their natural behaviour in human tissue (dose distribution)”.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
