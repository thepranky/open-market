- passage_id: sp_11
  source_document_id: eu_ec_m9945_2021_decision
  page: '6'
  quote_snippet: First, contrary to the Notifying Party’s claims, the market investigation provided
    indications that a distinction between Scanners and Simulators could be appropriate due
    to limited demand-side substitutability. Indeed, the vast majority of respondents consider
    that, for radiotherapy simulation, the use of Simulators is more efficient and convenient
    than the use of standard Scanners, explaining that Simulators are “optimized for radiotherapy
    planning”.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_4
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_12
  source_document_id: eu_ec_m9945_2021_decision
  page: '7'
  quote_snippet: In any event, for the purpose of this Decision, the question of whether CT
    simulators, MRI simulators and PET/CT simulators constitute distinct market segments can
    be left open, as it has no impact on the Commission’s competitive assessment of the Transaction.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
