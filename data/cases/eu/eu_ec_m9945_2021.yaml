  source_document_id: eu_ec_m9945_2021_decision
  page: '11'
  quote_snippet: The Notifying Party submits that OIS has specific features that are not necessarily
    the same as the ones in other healthcare software. However, it also considers that OIS present
    complementary features to EMR or HIS and that suppliers of EMR and HIS could easily enter
    the OIS market with limited investment in capital and time. Due to this supply-side substitutability,
    the Notifying Party concludes that HIS, EMR and OIS should be viewed as being part of the
    same market.
  extraction_method: pdf_extracted
  review_status: unreviewed
