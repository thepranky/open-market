  page: '5'
  quote_snippet: As regards a potential segmentation by end-use, the Notifying Party argues
    that it is not relevant to define markets limited to CT scanners, MRI scanner and PET/CT
    scanners used for radiotherapy simulation (i.e. so-called “CT simulators”, “MRI simulators”
    and “PET/CT simulators”, together referred as “Simulators”).
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
