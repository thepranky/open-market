- passage_id: sp_50
  source_document_id: eu_ec_m9945_2021_decision
  page: '17'
  quote_snippet: 'The results of the market investigation and the evidence in the Commission’s
    file did not provide any indications that the Commission should depart from its decisional
    practice regarding healthcare software in the present case. In particular, the results of
    the market investigation were the same for OIS and TPS as for imaging solutions, radiotherapy
    equipment and Motion Management devices, confirming that: (i) EU procurement rules apply,
    (ii) there are some variations at national level in procurement and reimbursement rules
    and practices, (iii) the main and most credible suppliers are the same across the EEA/UK.'
  extraction_method: pdf_extracted
