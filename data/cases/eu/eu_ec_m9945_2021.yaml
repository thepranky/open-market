  supports_commitments: []
- passage_id: sp_24
  source_document_id: eu_ec_m9945_2021_decision
  page: '12'
  quote_snippet: Based on the above considerations, the Commission concludes that, for the purpose
    of this Decision (i) TPS constitute a separate product market, and that (ii) it can be left
    open whether the market for TPS should be further segmented between TPS for brachytherapy
    and TPS for EBRT, as these alternative market delineations do not affect the Commission’s
    conclusion regarding the compatibility of the Transaction with the internal market.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
