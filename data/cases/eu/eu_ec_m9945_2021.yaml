  quote_snippet: In order to render the Transaction compatible with the internal market, the
    Notifying Party submitted a set of commitments under Article 6(2) of the Merger Regulation
    on 29 January 2021 (the “First Commitments”). The Commission market tested the First Commitments
    on 1 February 2021 in order to assess whether they were sufficient and suitable to remedy
    the serious doubts identified at Section in Section 5.2.3 above. Following the feedback
    received from market test, amended commitments were submitted on 12 February 2021 (the “Final
    Commitments”).
