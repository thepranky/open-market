    review_status: spot_checked
    summary: |
      Concentration was notified to the Commission on 14 March 2018 following a multi-NCA referral request initiated by Austria and joined by France, Iceland, Italy, Norway, Spain and Sweden.
  - event_type: procedural
    event_date: '2018-04-23'
    forum: European Commission
    case_number: M.8788
    title: Phase II investigation opened — Article 6(1)(c) decision
    review_status: spot_checked
    summary: |
      After Phase I investigation, Commission found serious doubts as to compatibility and opened Phase II proceedings under Article 6(1)(c), focusing on data-advantage and foreclosure concerns in digital music streaming and ACR software solutions.
  - event_type: decision
    event_date: '2018-09-06'
    forum: European Commission
    case_number: M.8788
    title: Phase II decision — cleared unconditionally (Article 8(1))
    outcome: cleared
    review_status: spot_checked
    summary: |
      Commission cleared the acquisition unconditionally after Phase II investigation. Found no significant impediment to effective competition in digital music streaming apps, ACR software solutions, licensing of music data, or online advertising. Decision not challenged before EU courts.
