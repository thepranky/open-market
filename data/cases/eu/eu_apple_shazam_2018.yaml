case_id: eu_apple_shazam_2018
case_name: "Apple / Shazam"
jurisdiction: EU
authority: European Commission
decision_date: "2018-09-06"
case_type: merger
procedure_stage: phase2
sector: digital / music recognition technology
parties:
  - name: Apple Inc.
    role: acquirer
  - name: Shazam Entertainment Limited
    role: target
outcome: cleared
remedies: []
theories_of_harm:
  - theory_id: toh_1
    name: Data advantage — music taste data for streaming advertising
    description: >
      Shazam collects granular music-preference and behavioural data from its
      users. Post-Transaction, Apple could use this data to improve targeting
      for Apple Music or to disadvantage rival streaming services in online
      advertising, strengthening Apple Music's competitive position.
  - theory_id: toh_2
    name: Input foreclosure — removal of referral links to rival streaming services
    description: >
      Shazam generates referral traffic to multiple digital music streaming
      apps (Spotify, Deezer, etc.) as well as Apple Music. Post-Transaction,
      Apple could modify Shazam to steer users toward Apple Music and away
      from rivals, damaging competitors' user-acquisition funnel.
  - theory_id: toh_3
    name: Conglomerate foreclosure — ACR software solutions
    description: >
      Apple's market power in mobile and desktop OS platforms could be
      leveraged, post-Transaction, to foreclose competing ACR software
      solution providers from access to Apple's ecosystem (iOS, macOS, Siri).

product_markets_considered:
  - market_id: pm_1
    name: Digital music streaming apps for smart mobile devices
    definition_status: defined
    notes: >
      Commission defined the narrowest relevant product market as digital music
      streaming services (apps) for smart mobile devices, excluding video
      streaming services (recital 99). Question whether downloading services form
      part of the same market was left open; further segmentation by OS or app
      type was also left open. Competitive assessment conducted on this narrowest
      basis.
  - market_id: pm_2
    name: ACR software solutions / music recognition apps
    definition_status: not_conclusive
    notes: >
      Commission assessed effects on the narrowest possible market (dedicated
      stand-alone music recognition apps for smart mobile devices) as well as on
      broader possible markets for ACR software solutions for PCs, smart mobile
      devices, smart wearables, smart watches and smart TVs (recital 114).
      Exact product market definition left open; segmentation by underlying
      technology (fingerprinting vs. watermarking) also left open.
  - market_id: pm_3
    name: Licensing of music charts data / music data analytics
    definition_status: left_open
    notes: >
      Commission investigated whether there is a market for the licensing of
      music data (charts, analytics). Prior decisional practice does not address
      this market. The Commission noted the Parties both license music chart
      data but found no competitive overlap in user behavioural data (not
      licensed to third parties). Exact market definition left open (recital 122).
  - market_id: pm_4
    name: Online advertising (including advertising in music recognition apps)
    definition_status: left_open
    notes: >
      Shazam generates revenue from online advertising displayed in its app.
      Commission assessed whether a distinct market for online advertising
      targeting music enthusiasts exists. Question left open; assessment
      conducted on the broader online advertising market as well as possible
      narrower segments. No competition concerns found (Section 7.6).

geographic_markets_considered:
  - market_id: gm_1
    name: Digital music streaming apps — EEA-wide or national (left open)
    definition_status: left_open
    notes: >
      Commission left open whether the geographic market for digital music
      streaming apps on smart mobile devices is EEA-wide or national; the
      Concentration raises no significant impediment to effective competition
      under any plausible geographic definition (recital 104).
  - market_id: gm_2
    name: Music recognition apps / ACR software solutions — at least EEA-wide
    definition_status: defined
    notes: >
      Commission concluded the geographic scope is at least EEA-wide, given no
      significant differences in customer demand across EEA countries (recital
      118).
  - market_id: gm_3
    name: Online advertising — at least EEA-wide
    definition_status: left_open
    notes: >
      Geographic scope of online advertising markets left open consistent with
      prior Commission practice; no competition concerns identified.

