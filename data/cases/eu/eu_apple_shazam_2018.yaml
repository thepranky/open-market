product_markets_considered:
- market_id: pm_1
  name: |
    Software solutions and/or apps platforms (segmented by device type: PCs, smart mobile devices, smart TVs, smart watches/wearables)
  definition_status: left_open
  notes: |
    The Commission analysed Apple's OSs as platforms for software solutions and/or apps. It considered segmentation by device type (PCs, smart mobile devices, smart TVs, smart watches, smart wearables) consistent with prior practice but left the exact product market scope open, as the Concentration would not significantly impede effective competition under any plausible market definition. Precedents from Google/Motorola Mobility, Microsoft/Nokia, and Microsoft/LinkedIn applied.
- market_id: pm_2
  name: |
    Digital music streaming apps (for smart mobile devices, excluding video streaming)
  definition_status: defined
  notes: |
    The Commission concluded that the narrowest relevant product market is digital music streaming services for smart mobile devices, excluding video streaming services (recital 99), and carried out its competitive assessment on that basis. The broader question of whether downloading and streaming services belong to the same market was left open. No segmentation by OS was found relevant.
- market_id: pm_3
  name: |
    ACR software solutions, including music recognition apps (dedicated stand-alone music recognition apps for smart mobile devices; broader ACR markets for PCs, smart mobile devices, smart wearables, smart watches, smart TVs)
  definition_status: considered
  notes: |
    The Commission considered effects on both the narrowest market (dedicated stand-alone music recognition apps for smart mobile devices) and broader possible markets for ACR software solutions for each of PCs, smart mobile devices, smart wearables (including smart watches), smart watches, and smart TVs. The question of segmentation by underlying technology (watermarking vs. fingerprinting) was left open.
- market_id: pm_4
  name: Licensing of music data (music charts data)
  definition_status: left_open
  notes: |
    Both parties license music charts data (Shazam's music discovery charts vs. Apple's music consumption charts). The Commission investigated substitutability but found it unnecessary to conclude on whether these belong to the same product market, as no SIEC would arise under any plausible definition. The Commission noted this is a horizontal overlap area but not the core of the transaction.
- market_id: pm_5
  name: |
    Online advertising (including possible sub-segment for online advertising for music enthusiasts)
  definition_status: left_open
  notes: |
    The Commission considered the market for online advertising, consistent with prior decisional practice distinguishing online from offline advertising, and with possible further segmentations (search vs. non-search; by platform). A possible separate sub-segment for online advertising for music enthusiasts was also considered. The exact product market definition was left open as no SIEC would arise under any plausible definition.
geographic_markets_considered:
- market_id: gm_1
  name: Software solutions and/or apps platforms — EEA-wide or worldwide (left open)
  definition_status: left_open
  notes: |
    Commission concluded the exact geographic scope for software solutions and/or apps platforms (and sub-segments) can be left open; prior practice treated smart mobile device OS markets as EEA-wide or worldwide, and PC OS as worldwide (recital 91).
- market_id: gm_2
  name: Digital music streaming apps — EEA-wide or national (left open)
  definition_status: left_open
  notes: |
    Commission left open whether the geographic market for digital music streaming apps on smart mobile devices is EEA-wide or national; the Concentration raises no significant impediment to effective competition under any plausible geographic definition (recital 104).
- market_id: gm_3
  name: Music recognition apps / ACR software solutions — at least EEA-wide
  definition_status: defined
  notes: |
    Commission concluded the geographic scope is at least EEA-wide, given no significant differences in customer demand and requirements across EEA countries (recital 118).
- market_id: gm_4
  name: Licensing of music data — left open (at least EEA-wide or worldwide)
  definition_status: left_open
  notes: |
    Commission left open the exact geographic scope of the licensing of music data market; undertakings offering such services are generally active both in the EEA and worldwide, although local providers also exist (recital 128).
- market_id: gm_5
  name: |
    Online advertising — national in scope or alongside linguistic borders within EEA
  definition_status: defined
  notes: |
    Commission concluded that the market for online advertising and its possible sub-segments should be defined as national in scope or alongside linguistic borders within the EEA, consistent with prior decisional practice (recital 140).
theories_of_harm:
- theory_id: toh_1
  name: Data advantage — music taste data for streaming advertising
  description: |
    Shazam collects granular music-preference and behavioural data from its users. Post-Transaction, Apple could use this data to improve targeting for Apple Music or to disadvantage rival streaming services in online advertising, strengthening Apple Music's competitive position.
- theory_id: toh_2
  name: Input foreclosure — removal of referral links to rival streaming services
  description: |
    Shazam generates referral traffic to multiple digital music streaming apps (Spotify, Deezer, etc.) as well as Apple Music. Post-Transaction, Apple could modify Shazam to steer users toward Apple Music and away from rivals, damaging competitors' user-acquisition funnel.
- theory_id: toh_3
  name: Conglomerate foreclosure — ACR software solutions
  description: |
    Apple's market power in mobile and desktop OS platforms could be leveraged, post-Transaction, to foreclose competing ACR software solution providers from access to Apple's ecosystem (iOS, macOS, Siri).
