ai_summary: >
  The European Commission cleared Apple's acquisition of Shazam in September 2018
  after a Phase II investigation, unconditionally (no conditions or remedies). The
  case was referred to the Commission by seven national competition authorities who
  raised initial concerns. Three main theories of harm were investigated: (i) Apple
  could exploit Shazam's music-preference user data to gain an advertising advantage
  for Apple Music; (ii) Apple could modify Shazam to remove or degrade referral links
  to rival streaming services; (iii) Apple could foreclose competing ACR software
  solution providers via its platform ecosystem. The Commission found that Shazam's
  data was not sufficiently large or unique to give Apple a meaningful advantage,
  that the referral traffic from Shazam to rival services was commercially
  insignificant, and that no evidence of ability or incentive to foreclose ACR
  competitors was established. This case is a key early precedent for data-advantage
  theories of harm in digital acquisitions and for the use of multi-NCA Article 22
  referrals to bring sub-threshold deals under EC review.
  [AI-generated summary — verify against source]

