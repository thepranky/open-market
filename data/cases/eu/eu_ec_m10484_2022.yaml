product_markets_considered:
- market_id: pm_1
  name: Production and bottling of fruit juices
  definition_status: considered
  notes: The Commission considered that there is a plausible relevant product market for the
    production and bottling of fruit juices, which it subsequently examined for potential segmentations.
    The assessment factored in distinctions for specific product types under a conservative
    approach.
- market_id: pm_2
  name: Production and bottling of fruit juices segmented by type of packaging (carton and aseptic
    PET) and production process (aseptic and non-aseptic, ambient and chilled)
  definition_status: defined
  notes: The market investigation confirmed previous findings that segmentations by type of
    packaging (carton vs. aseptic PET) and production process (aseptic vs. non-aseptic, ambient
    vs. chilled) constitute separate product markets within the broader production and bottling
    of fruit juices.
- market_id: pm_3
  name: Production and bottling of fruit juices segmented by organic and non-organic NABs
  definition_status: considered
  notes: While market participants generally indicated it was reasonably easy to switch between
    organic and non-organic production, the Commission, under a conservative approach, factored
    this as a possible distinction in its assessment without conclusively defining separate
    markets.
- market_id: pm_4
  name: Production and bottling of fruit juices segmented by private label and contract manufacturing
  definition_status: considered
  notes: The Commission considered branded contract manufacturing as a separate market from
    the production and bottling of private label NABs for the purpose of the present case's
    assessment, given the Target's activity in branded fruit juices.
- market_id: pm_5
  name: Sale of juices
  definition_status: considered
  notes: The Commission considered that plausible relevant product markets exist separately
    for juice, which served as a basis for further segmentation analysis.
- market_id: pm_6
  name: Sale of orange juice
  definition_status: defined
  notes: Based on market investigation findings regarding demand, prices, and brands, the Commission
    concluded that orange juice is not substitutable with other fruit juices and constitutes
    a separate product market.
- market_id: pm_7
  name: Sale of orange juice segmented by not-from-concentrate (NFC) and from-concentrate (FC)
  definition_status: considered
  notes: The Commission explored the possibility of further segmenting orange juice into NFC
    and FC, and factored this distinction into its assessment under a conservative approach
    without reaching a definitive conclusion on separate markets.
- market_id: pm_8
  name: Sale of juices segmented by organic and non-organic
  definition_status: defined
  notes: Based on market investigation findings, the majority of downstream competitors considered
    organic and non-organic juices to be non-substitutable due to factors like purchasing decisions
    and raw material prices, leading the Commission to treat this as a valid segmentation.
- market_id: pm_9
  name: Sale of juices segmented by on-trade and off-trade channels
  definition_status: defined
  notes: The majority of downstream competitors considered market conditions for on-trade and
    off-trade sales channels to differ in terms of pricing, volumes, format, and logistics,
    indicating a valid segmentation for assessment purposes.
- market_id: pm_10
  name: Sale of juices segmented by private label and branded products
  definition_status: defined
  notes: The majority of downstream competitors considered the sale of private label juices
    to differ from branded fruit juices in terms of pricing, volumes, format, and delivery logistics,
    suggesting these are distinct market segments.
geographic_markets_considered:
- market_id: gm_1
  name: Production and bottling of fruit juices — national (France affected)
  definition_status: considered
  notes: The Commission concluded that the precise geographic market definition for the production
    and bottling of juices could be left open, but conducted its analysis on the basis of national
    markets for France under a conservative approach. Market investigation results were consistent
    with national scope.
- market_id: gm_2
  name: Production and bottling of fruit juices — national (Netherlands affected)
  definition_status: considered
  notes: The Commission conducted its analysis on the basis of national markets for the Netherlands
    for the production and bottling of juices, under a conservative approach, while leaving
    the precise geographic market definition open.
- market_id: gm_3
  name: Production and bottling of fruit juices — national (Ireland affected)
  definition_status: considered
  notes: The Commission conducted its analysis on the basis of national markets for Ireland
    for the production and bottling of juices, under a conservative approach, while leaving
    the precise geographic market definition open.
- market_id: gm_4
  name: Production and bottling of fruit juices — national (Belgium affected)
  definition_status: considered
  notes: The Commission conducted its analysis on the basis of national markets for Belgium
    for the production and bottling of juices, under a conservative approach, while leaving
    the precise geographic market definition open.
- market_id: gm_5
  name: Sale of juices — national (France affected)
  definition_status: considered
  notes: Consistent with its past practice, the Commission considered the market for the sale
    of juices to be national in scope for France due to differing competitive conditions. The
    analysis was conducted at the national level under a conservative approach, despite leaving
    the precise definition open.
- market_id: gm_6
  name: Sale of juices — national (Netherlands affected)
  definition_status: considered
  notes: The Commission assessed the market for the sale of juices in the Netherlands at the
    national level under a conservative approach, consistent with its past practice, while leaving
    the precise geographic market definition open.
- market_id: gm_7
  name: Sale of juices — national (Ireland affected)
  definition_status: considered
  notes: The Commission assessed the market for the sale of juices in Ireland at the national
    level under a conservative approach, consistent with its past practice, while leaving the
    precise geographic market definition open.
- market_id: gm_8
  name: Sale of juices — national (Belgium affected)
  definition_status: considered
  notes: The Commission assessed the market for the sale of juices in Belgium at the national
    level under a conservative approach, consistent with its past practice, while leaving the
    precise geographic market definition open.
