  page: '19'
  quote_snippet: Based on the above considerations, and in light of the results of the market
    investigation and of all the information available to it, the Commission concludes that
    the Transaction does not raise serious doubts as to its compatibility with the internal
    market in relation to customer or input foreclosure in France in the markets for (i) the
    production and bottling of branded ambient fruit juices in PET packaging; (ii) the production
    and bottling of branded ambient fruit juices in carton packaging; (iii) the production and
    bottling of branded chilled fruit juices in PET packaging.; (iv) sale of branded fruit juices
    in retail stores; (v) sale of branded orange juices in retail stores.
