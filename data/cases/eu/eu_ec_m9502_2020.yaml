product_markets_considered:
- market_id: pm_1
  name: Vinyl pyridine latex (VP Latex)
  definition_status: defined
  notes: The Commission concluded that VP Latex constitutes a distinct product market from other
    synthetic latex products, without the need for further segmentation by application or grade.
- market_id: pm_2
  name: Carboxylated nitrile butadiene latex (XNBR)
  definition_status: left_open
  notes: The exact scope of the product market definition (XNBR as a single product or sub-segmented
    by applications) was left open as the transaction did not give rise to serious doubts under
    any alternative.
- market_id: pm_3
  name: Carboxylated styrene butadiene latex (XSBR)
  definition_status: left_open
  notes: The exact scope of the product market definition (XSBR as a single product or sub-segmented
    by applications) was left open as the transaction did not give rise to serious doubts under
    any alternative. The Commission noted strong supply-side substitutability across grades
    and applications.
- market_id: pm_4
  name: Styrene acrylic (SA)
  definition_status: left_open
  notes: The exact scope of the product market definition (overall SA market or segmentation
    by application) was left open as the transaction did not raise serious doubts under any
    alternative.
- market_id: pm_5
  name: High solids styrene butadiene (HS-SB)
  definition_status: left_open
  notes: The exact scope of the product market definition (overall HS-SB market or segmentation
    by application or grade) was left open as the transaction did not raise serious doubts under
    any alternative.
geographic_markets_considered:
- market_id: gm_1
  name: Vinyl pyridine latex (VP Latex) — EEA-wide
  definition_status: considered
  notes: The Commission considered the relevant geographic market for VP Latex to be EEA-wide,
    despite arguments for a worldwide market, but stated the assessment would not change even
    if it were worldwide.
- market_id: gm_2
  name: Carboxylated nitrile butadiene latex (XNBR) — EEA-wide/worldwide
  definition_status: left_open
  notes: The exact scope of the geographic market definition (worldwide or EEA-wide) was left
    open as the transaction did not raise serious doubts under any alternative.
- market_id: gm_3
  name: Carboxylated styrene butadiene latex (XSBR) — EEA-wide/worldwide
  definition_status: considered
  notes: The Commission considered the relevant geographic market for XSBR to be EEA-wide, but
    stated the assessment would not raise serious doubts regardless of whether the market is
    considered EEA-wide or worldwide, so it was left open.
- market_id: gm_4
  name: Styrene acrylic (SA) — EEA-wide/worldwide
  definition_status: left_open
  notes: The exact scope of the geographic market definition (EEA or worldwide) was left open
    as the transaction did not raise serious doubts under any alternative.
- market_id: gm_5
  name: High solids styrene butadiene (HS-SB) — EEA-wide/worldwide
  definition_status: left_open
  notes: The exact scope of the geographic market definition (EEA or worldwide) was left open
    as the transaction did not raise serious doubts under any alternative.
