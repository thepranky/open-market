  page: '4'
  quote_snippet: (16) VP Latex is an aqueous polymer used in heavy duty rubber goods, primarily
    tyres, to promote the adhesion between reinforcing cords or fabric and rubber compounds.
    The most common use of VP Latex is in the tyre cord application, whereby nylon or polyester
    yarns are dipped or coated in VP Latex before being embedded in a tyre to reinforce it against
    high pressure and temperatures. Both Parties are active in the production and sale of VP
    Latex, primarily for the tyre cord application.
  extraction_method: pdf_extracted
