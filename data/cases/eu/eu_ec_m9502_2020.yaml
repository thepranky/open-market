- passage_id: sp_23
  source_document_id: eu_ec_m9502_2020_decision
  page: '26'
  quote_snippet: (127) Where a concentration raises serious doubts as regards its compatibility
    with the internal market, the parties may undertake to modify the concentration to remove
    the grounds for the serious doubts identified by the Commission. Pursuant to Article 6(2)
    of the Merger Regulation, where the Commission finds that, following modification by the
    undertakings concerned, a notified concentration no longer raises serious doubts, it shall
    declare the concentration compatible with the internal market pursuant to Article 6(1)(b)
    of the Merger Regulation.
