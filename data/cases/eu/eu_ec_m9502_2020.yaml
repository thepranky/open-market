  page: '11'
  quote_snippet: (48) XNBR is an aqueous emulsion polymer of acrylonitrile-butadiene, stabilized
    with antioxydants. It is mainly used in the production of rubber gloves, but also in other
    applications such as the binding of nonwoven fabrics and the production of textile and rubber
    goods. Its good resistance to other chemicals (such as water, oils, fats, greases, alcohols
    as well as various solvents), and high abrasion and tear resistance make it commonly used
    in applications requiring the material to perform its elastomeric function in the presence
    of chemical agents.
  extraction_method: pdf_extracted
