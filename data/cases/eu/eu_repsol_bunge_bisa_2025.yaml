- passage_id: sp_36
  source_document_id: eu_repsol_bunge_bisa_2025_decision
  page: '3'
  quote_snippet: 'The concentration has a Union dimension because it exceeds the turnover thresholds
    referred to in Article 1(2) of the Merger Regulation: the undertakings concerned have a
    combined aggregate worldwide turnover of more than € 2 500 million (Repsol: € […]; Bunge:
    € […]), each of them has a Union-wide turnover of more than € 250 million (Repsol: € […];
    Bunge: € […]) and they do not achieve more than two-thirds of their aggregate Union-wide
    turnover within one and the same Member State.'
  extraction_method: pdf_extracted
