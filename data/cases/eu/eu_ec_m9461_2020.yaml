- passage_id: sp_4
  source_document_id: eu_ec_m9461_2020_decision
  page: '13'
  quote_snippet: 'In any event, the exact relevant product market definition for treatments
    of moderate to severe UC and CD can be left open. The Transaction gives rise to serious
    doubts as to its compatibility with the internal market regardless of whether the relevant
    markets are defined as: (i) all post-conventional treatments for UC and CD; (ii) all post-conventional
    treatments for UC and CD excluding anti-TNFs; or (iii) IL-23 inhibitors.'
  extraction_method: pdf_extracted
  review_status: unreviewed
