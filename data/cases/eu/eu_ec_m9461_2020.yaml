- passage_id: sp_5
  source_document_id: eu_ec_m9461_2020_decision
  page: '10'
  quote_snippet: The remainder of this Section focuses on the potential segmentations of the
    post-conventional treatments for UC and CD. In this respect, the market investigation was
    not conclusive, in part because some of the drugs analysed (notably IL-23 inhibitors) are
    still at the development stage and there is an intrinsic level of uncertainty in assessing
    their future characteristics and market positioning.
  extraction_method: pdf_extracted
