- passage_id: sp_6
  source_document_id: eu_ec_m9461_2020_decision
  page: '22'
  quote_snippet: As regards product market definition, the Commission has not assessed the market
    for the treatment of uveitis in the past. In line with the Parties’ views, the Commission
    considers that, for the purpose of this Decision, the exact scope of the market for uveitis
    treatments can be left open as the Transaction does not give rise to serious doubts as to
    its compatibility with the internal market even under the narrowest market definition giving
    rise to an overlap between the Parties’ drugs (i.e. market for the treatments of non-infectious
    posterior uveitis).
  extraction_method: pdf_extracted
