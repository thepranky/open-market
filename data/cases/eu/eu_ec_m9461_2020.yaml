- passage_id: sp_3
  source_document_id: eu_ec_m9461_2020_decision
  page: '13'
  quote_snippet: 'Based on the above information, three alternative product market definitions
    giving rise to overlaps between the Parties can be envisaged, namely: (i) the market for
    post-conventional treatments for UC and CD, including all biologics and innovative small
    molecules; (ii) the market for post-conventional treatments for UC and/or CD excluding anti-TNFs;
    and (iii) the market for IL-23 inhibitors for UC and CD.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_3
  supports_geographic_markets: []
