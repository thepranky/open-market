  quote_snippet: The market investigation confirmed that (i) conventional and (ii) post-conventional
    treatments for UC and CD belong to separate markets. This is due to the fact that conventional
    treatments are used to treat patients suffering from less severe forms of UC and CD, before
    the use of post-conventional biologics and innovative small molecule drugs.
