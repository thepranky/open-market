- passage_id: sp_5
  source_document_id: eu_ald_leaseplan_2022_decision
  page: '3'
  quote_snippet: 'The majority of respondents to the market investigation that expressed a view
    consider that operational and financial leasing are two distinct markets because: i) different
    regulatory regimes apply to operational and financial leasing ii) operational and financial
    leasing require different expertise and capabilities iii) lessors generally specialize either
    in operational or financial leasing and iv) customers are interested in either operational
    or financial leasing and do not generally see them as alternatives to each other.'
  extraction_method: pdf_extracted
