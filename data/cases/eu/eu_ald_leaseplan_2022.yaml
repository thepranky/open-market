product_markets_considered:
- market_id: pm_1
  name: Operational leasing
  definition_status: defined
  notes: The Commission defines one market for operational leasing, which includes fleet management
    services, as supported by market investigation respondents and prior decisions. It distinguishes
    it from financial leasing.
- market_id: pm_2
  name: Financial leasing
  definition_status: defined
  notes: The Commission distinguishes financial leasing from operational leasing, noting different
    regulatory regimes, expertise, supplier specialization, and customer interest. Financial
    leasing requires a banking licence in many EEA Member States.
- market_id: pm_3
  name: Operational leasing of vehicles of up to 3.5 tons
  definition_status: considered
  notes: While the Commission previously left open the segmentation by vehicle weight, the market
    investigation in this case confirmed that operational leasing of vehicles up to 3.5 tons
    constitutes a distinct market from heavier vehicles. The assessment focuses on this segment
    as the Parties are almost exclusively active in it.
geographic_markets_considered:
- market_id: gm_1
  name: Operational leasing — national
  definition_status: defined
  notes: The Commission confirms that the relevant geographic market for operational leasing
    services is national in scope, based on national tax regulations, registration, and insurance
    requirements that make cross-border leasing difficult.
- market_id: gm_2
  name: Financial leasing — national
  definition_status: considered
  notes: Based on market investigation, the Commission noted that financial leasing markets
    are national in scope due to national tax and regulatory factors, though the primary focus
    of the decision's assessment is operational leasing.
- market_id: gm_3
  name: Operational leasing — national (Czechia affected)
  definition_status: defined
  notes: The Commission explicitly refers to the 'Czech market for operational leasing' in its
    competitive assessment, consistent with its overall finding of national geographic markets
    for operational leasing.
- market_id: gm_4
  name: Operational leasing — national (Finland affected)
  definition_status: defined
  notes: The Commission refers to the 'Finnish operational leasing market' in its competitive
    assessment, consistent with its overall finding of national geographic markets for operational
    leasing.
- market_id: gm_5
  name: Operational leasing — national (Ireland affected)
  definition_status: defined
  notes: The Commission refers to the 'Irish market for operational leasing' in its competitive
    assessment, consistent with its overall finding of national geographic markets for operational
    leasing.
- market_id: gm_6
  name: Operational leasing — national (Luxembourg affected)
  definition_status: defined
  notes: The Commission refers to 'operational leasing in Luxembourg' in its competitive assessment,
    consistent with its overall finding of national geographic markets for operational leasing.
- market_id: gm_7
  name: Operational leasing — national (Norway affected)
  definition_status: defined
  notes: The Commission refers to the 'Norwegian operational leasing market' in its competitive
    assessment, consistent with its overall finding of national geographic markets for operational
    leasing.
- market_id: gm_8
  name: Operational leasing — national (Portugal affected)
  definition_status: defined
  notes: The Commission refers to the 'Portuguese operational leasing market' in its competitive
    assessment, consistent with its overall finding of national geographic markets for operational
    leasing.
