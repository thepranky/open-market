- passage_id: sp_7
  source_document_id: eu_ald_leaseplan_2022_decision
  page: '5'
  quote_snippet: 'The vast majority of the respondents to the market investigation expressed
    a view that operational leasing of passenger and commercial vehicles of up to 3.5 tons constitute
    a distinct product market of heavier vehicles because: the different weight categories require
    lessors to have different expertise and capabilities (ii) different lessors offer the different
    weight categories and (iii) customers do not see vehicles in the different weight categories
    as alternatives to each other.'
