product_markets_considered:
- market_id: pm_1
  name: Collection, processing and blending of stainless steel scrap
  definition_status: defined
  notes: The Commission concluded that different types of scrap constitute different markets
    due to lack of demand- and supply-side substitutability. It found that stainless steel scrap
    forms a separate market. The analysis focused on the combined activities of collection,
    processing, and blending.
- market_id: pm_2
  name: Collection, processing and blending of nickel alloy scrap
  definition_status: defined
  notes: The Commission applied the same reasoning as for stainless steel scrap, concluding
    that nickel alloy scrap constitutes a separate market due to lack of substitutability with
    other metal scrap types and the technical/cost challenges of substituting with primary raw
    materials.
- market_id: pm_3
  name: Collection, processing and blending of titanium scrap
  definition_status: considered
  notes: The Commission decided to analyse this market by analogy with its decisional practice
    on titanium scrap, as no evidence suggested otherwise. The analysis focuses on the combined
    activities of collection, processing, and blending.
- market_id: pm_4
  name: Production and wholesale of stainless steel flat products
  definition_status: considered
  notes: For the purposes of its Decision, the Commission applied its previous decisional practice
    to analyse this market as a downstream market for vertical links. This market includes sub-segments
    where Aperam is active, such as hot rolled black band, hot rolled white band, and cold rolled
    products.
- market_id: pm_5
  name: Nickel alloy products
  definition_status: considered
  notes: For the purposes of its Decision, the Commission applied its previous decisional practice
    to analyse this market as a downstream market for vertical links. This market includes sub-segments
    where Aperam is active, such as semis, bars, wire, wire rod, strip, and plates/sheets.
- market_id: pm_6
  name: Trade in metal scrap — ferrous scrap
  definition_status: considered
  notes: Referenced as a market defined in previous Commission decisions.
- market_id: pm_7
  name: Trade in metal scrap — non-ferrous scrap
  definition_status: considered
  notes: Referenced as a market defined in previous Commission decisions. Potential sub-segments
    for aluminium, copper, and zinc scrap were left open in previous cases.
geographic_markets_considered:
- market_id: gm_1
  name: Collection, processing and blending of stainless steel scrap — at most EEA-wide
  definition_status: considered
  notes: The Commission considers the geographic market for the processing and blending of stainless
    steel scrap to be at most EEA-wide, acknowledging that smaller suppliers may operate on
    a more regional basis. Transport costs and customer location are key drivers.
- market_id: gm_2
  name: Collection, processing and blending of nickel alloy scrap — EEA-wide
  definition_status: considered
  notes: The market investigation results suggest an EEA-wide geographic market for the supply
    of nickel alloy scrap, with transport costs being less relevant due to its higher value.
- market_id: gm_3
  name: Collection, processing and blending of titanium scrap — EEA-wide
  definition_status: considered
  notes: By analogy with previous decisional practice and given that transport costs play a
    lesser role due to its high value, the Commission will analyse this market on an EEA-wide
    basis.
- market_id: gm_4
  name: Production and wholesale of stainless steel flat products — EEA-wide
  definition_status: considered
  notes: The Commission's previous decisional practice for the production and wholesale of stainless
    steel products considered the market to be at least EEA-wide in scope, and no evidence in
    this case suggested otherwise.
- market_id: gm_5
  name: Nickel alloy products — EEA-wide
  definition_status: considered
  notes: The Commission's previous decisional practice for the production and wholesale of nickel
    alloys considered the market to be at least EEA-wide in scope, and no evidence in this case
    suggested otherwise.
- market_id: gm_6
  name: Trade in metal scrap — at least EEA-wide
  definition_status: considered
  notes: Referenced as a market found to be at least EEA-wide in previous Commission decisions.
- market_id: gm_7
  name: Collection and processing of metal scrap — national or regional (possible radius of
    approx. 200 km)
  definition_status: left_open
  notes: Referenced as a market where the geographic dimension was considered smaller than the
    trade market, and its scope (national or regional with a 200 km catchment radius) was left
    open in previous Commission decisions.
