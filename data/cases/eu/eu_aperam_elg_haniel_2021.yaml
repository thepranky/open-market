  quote_snippet: In line with the Commission’s previous practice, the results of the market
    investigation indicate that different types of scrap constitute different markets. The majority
    of respondents replied in the market investigation that stainless steel scrap and other
    types of metal scrap are not interchangeable in stainless steel production.
