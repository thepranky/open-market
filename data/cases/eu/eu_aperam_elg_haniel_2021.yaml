- passage_id: sp_16
  source_document_id: eu_aperam_elg_haniel_2021_decision
  page: '7'
  quote_snippet: For the purposes of the assessment of the vertical link between stainless steel
    scrap and the production of stainless steel products, the Commission considers that the
    relevant level of the supply chain at which to conduct the assessment is the processing
    and supply of the blended stainless steel scrap to the customer. Therefore, the geographic
    market for the processing and blending of stainless steel scrap is at most EEA-wide. The
    fact that smaller stainless steel scrap suppliers are not active throughout the EEA will
    be taken into account in the competitive assessment.
