- passage_id: sp_4
  source_document_id: eu_aperam_elg_haniel_2021_decision
  page: '5'
  quote_snippet: 'The same reasoning applies for nickel alloy scrap. A majority of respondents
    replied that nickel alloy scrap is not substitutable with any other types of metal scrap.19
    As a customer explained: “Substitution with primary raw materials is technically possible,
    but would incur a non sustainable cost disadvantage. Substitution with other types of metal
    scrap is technically impossible, since the chemical contents would not be appropriate for
    the intended production”.20 This indicates that nickel alloy scrap also constitutes a separate
    market.'
  extraction_method: pdf_extracted
