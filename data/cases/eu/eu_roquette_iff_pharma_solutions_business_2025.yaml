source_passages:
- passage_id: sp_1
  source_document_id: eu_roquette_iff_pharma_solutions_business_2025_decision
  page: '3'
  quote_snippet: The Parties’ activities overlap and give rise to horizontally affected markets
    in the supply of microcrystalline cellulose (MCC) and croscarmellose sodium (CCS), which
    are cellulosic excipients used in various applications including food, pharmaceuticals,
    food supplements, and other industrial applications.
  extraction_method: pdf_extracted
  review_status: unreviewed
