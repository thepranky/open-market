  page: '5'
  quote_snippet: In the past, the Commission considered that the pharmaceutical excipients market
    comprising MCC was essentially EEA-wide. More recently, the Commission considered that the
    market for MCC was at least EEA-wide, if not worldwide, although the geographic market definition
    was ultimately left open.
