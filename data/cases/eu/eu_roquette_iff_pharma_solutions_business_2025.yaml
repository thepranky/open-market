- passage_id: sp_2
  source_document_id: eu_roquette_iff_pharma_solutions_business_2025_decision
  page: '4'
  quote_snippet: The results of the market investigation indicate that there is a distinct product
    market for MCC. According to the majority of both customers and suppliers MCC is not, or
    only to a limited extent substitutable for other excipients (such as lactose), as MCC has
    unique chemical properties and substitutes such as lactose are often not substitutes as
    there is a trend to providing lactose-free formulas.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
