  page: '5'
  quote_snippet: The results of the market investigation confirm that the geographic market
    is at least EEA-wide and more likely worldwide in scope. Suppliers confirm that they supply
    MCC globally from few manufacturing facilities. The majority of customers sources MCC on
    a global basis with suppliers located across the globe.
