  supports_commitments: []
- passage_id: sp_3
  source_document_id: eu_roquette_iff_pharma_solutions_business_2025_decision
  page: '4'
  quote_snippet: In any event, for the purposes of this decision, it can be left open whether
    a distinction should be made between MCC for pharmaceutical applications and MCC for nutraceutical
    applications, as the Transaction does not raise serious doubts as to its compatibility with
    the internal market and the EEA Agreement even under the narrowest plausible product market
    definition, namely the supply of MCC for pharmaceutical applications and the supply of MCC
    for nutraceutical applications separately.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
