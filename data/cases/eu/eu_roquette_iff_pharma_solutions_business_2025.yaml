- passage_id: sp_4
  source_document_id: eu_roquette_iff_pharma_solutions_business_2025_decision
  page: '5'
  quote_snippet: CCS, also known as modified cellulose gum, is a cellulose ether consisting
    of cross-linked sodium Carboxymethyl Cellulose (CMC, also known as cellulose gum). CCS is
    mainly used as a disintegrant in pharmaceutical and nutraceutical applications (to facilitate
    the breakup of tablets, capsules or granules in the intestinal tract after oral administration).
    It can also be used in other industrial applications. Both Parties produce and supply CCS
    for pharmaceutical and nutraceutical applications.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_2
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_5
  source_document_id: eu_roquette_iff_pharma_solutions_business_2025_decision
  page: '6'
  quote_snippet: The results of the market investigation indicate that there is indeed a distinct
    product market for CCS. According to the majority of both customers and suppliers CCS is
    not, or only to a limited extent substitutable for other excipients (such as sodium starch
    glycolate), as CCS has very specific disintegration properties and cannot be easily substituted
    for other disintegrants in existing formulas.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
