- passage_id: sp_6
  source_document_id: eu_olin_mitsui_bwa_jv_2022_decision
  page: '6'
  quote_snippet: In its previous decisions, the Commission has not reached a conclusion on whether
    EDC constitutes a distinct product market, observing only that the merchant market in EDC
    is limited in size, as most EDC producers are vertically integrated into the production
    of PVC and the majority of their EDC production is for captive consumption.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
