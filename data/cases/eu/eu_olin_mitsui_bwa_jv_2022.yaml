- passage_id: sp_2
  source_document_id: eu_olin_mitsui_bwa_jv_2022_decision
  page: '4'
  quote_snippet: As concerns the potential distinction between solid CS and liquid CS that the
    Commission considered in previous cases, the exact market definition can be left open in
    this case. The supply of solid CS constitutes only minimal part of the overall market (c.
    1%). Furthermore, Olin does not produce solid CS, and BWA JV is not expected to be active
    in the trading of solid CS. Thus, the competitive assessment will remain the same regardless
    of whether the relevant market comprises both forms of CS or whether it is limited to liquid
    CS only.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_1
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_3
  source_document_id: eu_olin_mitsui_bwa_jv_2022_decision
  page: '5'
  quote_snippet: In light of the above, the Commission considers that it may be appropriate
    to define separate product markets for the direct supply of CS and for the trading of CS.
    However, in this case the appropriate product market definition can be left open as the
    Transaction does not give rise to competitive concerns under either definition.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
