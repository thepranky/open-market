  page: '7'
  quote_snippet: In light of the above, the Commission considers that it may be appropriate
    to define separate product markets for the direct supply of EDC and for the trading of EDC.
    However, in this case it can be left open whether direct supply by producers and the trading
    of EDC form separate product markets, as the Transaction does not give rise to competition
    concerns under either market definition.
