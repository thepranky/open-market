product_markets_considered:
- market_id: pm_1
  name: Supply of Caustic Soda (CS)
  definition_status: left_open
  notes: The Commission considered whether to segment the market between liquid and solid CS,
    and between direct supply and trading of CS, but left both definitions open as the transaction
    did not raise concerns under any plausible definition.
- market_id: pm_2
  name: Trading of Caustic Soda (CS)
  definition_status: left_open
  notes: The Commission's market investigation suggested that it may be appropriate to define
    a separate market for the trading of CS, distinct from direct supply, but ultimately left
    the definition open for the purpose of the decision.
- market_id: pm_3
  name: Supply of Ethylene Dichloride (EDC)
  definition_status: considered
  notes: While the Commission had not previously concluded on whether EDC constitutes a distinct
    product market, for the purpose of this decision, it considered the supply of EDC to be
    a relevant market. The potential distinction between direct supply and trading was left
    open.
- market_id: pm_4
  name: Trading of Ethylene Dichloride (EDC)
  definition_status: left_open
  notes: The Commission considered it may be appropriate to define a separate market for the
    trading of EDC, distinct from direct supply, but ultimately left the definition open for
    the purpose of the decision.
- market_id: pm_5
  name: Supply of Epichlorohydrin
  definition_status: considered
  notes: The Commission identified the supply of epichlorohydrin as a downstream market for
    the purpose of assessing vertical links. While the Notifying Parties suggested the market
    is global, the Commission left the exact geographic market definition open.
- market_id: pm_6
  name: Supply of VCM
  definition_status: left_open
  notes: The Commission's past decisions have left open whether VCM constitutes a product market.
    For this decision, it was identified as a downstream market in the vertical assessment.
geographic_markets_considered:
- market_id: gm_1
  name: Supply of Caustic Soda (CS) — EEA-wide/North West Europe/Global
  definition_status: left_open
  notes: The Commission previously considered the geographic market for CS to be at least North
    West Europe, potentially broader (EEA-wide or global). For this decision, it left the exact
    geographic definition open as the transaction raised no concerns under any plausible scope.
- market_id: gm_2
  name: Trading of Caustic Soda (CS) — worldwide
  definition_status: considered
  notes: The Commission's market investigation indicated that the appropriate geographic market
    for the trading of CS would be global, primarily due to the broader reach offered by traders.
- market_id: gm_3
  name: Supply of Ethylene Dichloride (EDC) — EEA-wide/North West Europe/Global
  definition_status: left_open
  notes: The Commission previously had not concluded on the precise geographic scope of the
    market for EDC. For this decision, the exact geographic market definition was left open
    as the transaction did not give rise to an affected market under any plausible definition
    (global, EEA-wide, or North West Europe).
- market_id: gm_4
  name: Trading of Ethylene Dichloride (EDC) — worldwide
  definition_status: considered
  notes: Based on the market investigation, the Commission considered the appropriate geographic
    market definition for the trading of EDC to be global, consistent with its findings for
    CS trading.
- market_id: gm_5
  name: Supply of Epichlorohydrin — EEA and worldwide
  definition_status: left_open
  notes: The Notifying Parties submitted that the market for epichlorohydrin is global, and
    the Commission left the exact geographic market definition open for the purpose of this
    decision.
- market_id: gm_6
  name: Supply of VCM — worldwide
  definition_status: considered
  notes: Although Olin produces VCM only in North America, the Commission considered a hypothetical
    global geographic market for the purpose of assessing the vertical link to EDC trading.
theories_of_harm: []
commitments: []
