- passage_id: sp_4
  source_document_id: eu_olin_mitsui_bwa_jv_2022_decision
  page: '4'
  quote_snippet: As for the trading of CS, the Commission’s market investigation suggested that
    it may be appropriate to define a separate market from direct supply of CS. In the Commission’s
    market investigation, producers identified several services provided by traders that they
    would not be able to replicate internally. Likewise, industrial customers who procure CS
    from traders confirmed that these services are attractive to them.
  extraction_method: pdf_extracted
