- passage_id: sp_7
  source_document_id: eu_olin_mitsui_bwa_jv_2022_decision
  page: '7'
  quote_snippet: For the purpose of this decision, the Commission considers that supply of EDC
    is a relevant market. While the majority of EDC is used captively to produce PVC, several
    producers and traders supply EDC on the merchant market to customers who use it to produce
    VCM, PVC, chlorinated organics intermediates or solvents. For BWA JV, trading of EDC is
    one of its primary activities.
  extraction_method: pdf_extracted
  review_status: unreviewed
