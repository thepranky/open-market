  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_3
  source_document_id: eu_ec_m10133_2021_decision
  page: '5'
  quote_snippet: In any event, for the purpose of assessing the Transaction, the exact scope
    of the product market definition can be left open since none of the above-mentioned plausible
    alternative product market definitions (namely, e-Clinical trial solutions (including centralised
    and decentralised solutions); e-Clinical trial solutions (including only centralised solutions);
    cardiac safety services (including centralised and decentralised solutions); cardiac safety
    services (including only centralised solutions); medical imaging solutions (including centralised
    and decentralised solutions); and medical imaging solutions (including only centralised
    solutions)) affects the outcome of the competitive assessment of the Transaction.
  extraction_method: pdf_extracted
  review_status: unreviewed
