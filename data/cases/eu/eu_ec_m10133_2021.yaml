- passage_id: sp_2
  source_document_id: eu_ec_m10133_2021_decision
  page: '4'
  quote_snippet: The Notifying Parties suggest that there is one broad market including all
    e-Clinical trial solutions, in view of the strong supply-side substitutability between cardiac
    safety solutions, medical imaging services, and other business lines. The Notifying Parties
    add that plausible markets for e-Clinical trial solutions or (more narrowly) for cardiac
    safety and medical imaging should include both centralised and decentralised services.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
