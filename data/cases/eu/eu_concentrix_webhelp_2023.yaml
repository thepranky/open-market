- passage_id: sp_4
  source_document_id: eu_concentrix_webhelp_2023_decision
  page: '3'
  quote_snippet: 'Segmentation by functionality. According to the 2022 Gartner report, the overall
    market for IT services can be segmented by functionality into: (i) business process services
    (meaning BPO), (ii) consulting, (iii) application implementation and managed services, (iv)
    infrastructure implementation and managed services, (v) infrastructure as a service, and
    (vi) hardware support, (9). These functionalities are also referred to in the industry as
    ‘service level 2’ of the Gartner report.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
