product_markets_considered:
- market_id: pm_1
  name: IT services
  definition_status: left_open
  notes: The Commission considered segmenting the market for IT services by functionality (BPO,
    consulting, application implementation, infrastructure services, IaaS, hardware support)
    and by industry sector, but ultimately left the definition open for the purpose of this
    decision.
- market_id: pm_2
  name: Business Process Outsourcing (BPO) services
  definition_status: segmented
  notes: BPO services are identified as a sub-segment of IT services by functionality (Gartner
    service level 2). The Commission further considered sub-segmenting BPO services into administration,
    CXM, finance and accounting, human resources, operations, and supply chain management. A
    majority of market participants agreed to this sub-segmentation.
- market_id: pm_3
  name: Customer Experience Management (CXM) BPO services
  definition_status: considered
  notes: CXM BPO services are a sub-segment of BPO services, primarily focused on direct customer
    contact activities. The Commission's market investigation and internal documents support
    considering CXM BPO services as a separate product market for the purpose of the decision,
    further segmented by industry verticals for the competitive assessment.
- market_id: pm_4
  name: IT consulting services
  definition_status: left_open
  notes: IT consulting services are identified as a sub-segment of IT services where the parties
    overlap, but the overall market definition for IT services was left open.
geographic_markets_considered:
- market_id: gm_1
  name: IT services — worldwide/EEA-wide/national
  definition_status: left_open
  notes: The Commission's evidence regarding the geographic scope for IT services and its segments
    was inconclusive, suggesting it is likely wider than national but leaving the precise definition
    open.
- market_id: gm_2
  name: Customer Experience Management (CXM) BPO services, segmented by industry verticals —
    national
  definition_status: considered
  notes: Despite the overall geographic market for IT services being left open, the Commission
    chose to assess the effects of the transaction at the national level for CXM BPO services,
    segmented by industry verticals, as the narrowest plausible scope.
