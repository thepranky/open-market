- passage_id: sp_3
  source_document_id: eu_apollo_management_tenneco_2022_decision
  page: '7'
  quote_snippet: (32) From a supply-side perspective, MAFTEC is currently the most important
    manufacturer of PCW blankets globally. MAFTEC currently produces [80-90]% of all dry-laid
    PCW blankets,23 [90-100]% of which are processed into support mats for the automotive industry.24
    As also noted at paragraph (21) above, MAFTEC does not manufacture blankets made of materials
    other than PCW. A switching in manufacturing would require significant investment, which
    MAFTEC is unable to realize in a timely and sufficient manner [proprietary production details].25
    It follows that there is no sufficient supply-side substitution between PCW blankets and
    blankets made of alternative materials.
  extraction_method: pdf_extracted
