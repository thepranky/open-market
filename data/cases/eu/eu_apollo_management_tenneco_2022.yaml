source_passages:
- passage_id: sp_1
  source_document_id: eu_apollo_management_tenneco_2022_decision
  page: '9'
  quote_snippet: (44) The Commission considers that, for the purposes of the present case, it
    may be left open whether PCW belongs to the same product market with other types of insulating
    materials, and whether, within the plausible market for PCW blankets, there should be a
    further distinction between dry-laid and wet-laid PCW, as the Transaction does not lead
    to serious doubts as to its compatibility with the internal market, regardless of the market
    definition adopted. Since MAFTEC only manufactures dry-laid PCW blankets, the Commission
    will assess the Transaction under the most precautionary basis, considering a market for
    dry-laid PCW blankets.
  extraction_method: pdf_extracted
