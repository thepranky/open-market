  source_document_id: eu_apollo_management_tenneco_2022_decision
  page: '12'
  quote_snippet: (57) With regard to whether supporting mats made of alternative materials to
    PCW, as well as supporting mats made out of dry-laid and wet-laid PCW should be considered
    to belong to the same market, the same considerations as under (25) to (38) for PCW blankets
    apply. The Commission therefore considers that the exact market definition can be left open,
    as the Transaction does not lead to serious doubts as to its compatibility with the internal
    market, regardless of the market definition retained. The Commission will, on a precautionary
    basis, assess the Transaction considering the narrowest plausible market for dry-laid PCW
    supporting mats.
