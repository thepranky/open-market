product_markets_considered:
- market_id: pm_1
  name: PCW blankets
  definition_status: left_open
  notes: The Commission considered various segmentations including dry-laid versus wet-laid
    PCW blankets, needle-punched versus non-needle-punched, and PCW blankets versus alternative
    insulating materials. While the exact market definition was left open, the assessment focused
    on dry-laid PCW blankets on a precautionary basis.
- market_id: pm_2
  name: Insulation components for automobile exhaust systems (PCW support mats)
  definition_status: left_open
  notes: The Commission confirmed the manufacture of PCW support mats as a separate market from
    PCW blankets. It left open whether supporting mats made of alternative materials or different
    types of PCW (dry-laid vs wet-laid) should belong to the same market, assessing the transaction
    on the narrowest plausible market for dry-laid PCW supporting mats.
- market_id: pm_3
  name: Automobile exhaust systems (hot-ends)
  definition_status: left_open
  notes: The Commission previously left open whether exhaust systems should be one market or
    segmented by hot-ends/other components, and whether hot-ends should be segmented by gasoline/diesel
    engines. For this case, it left the definition open but assessed the transaction considering
    the narrowest plausible markets for hot-ends separately for gasoline, diesel, and CTOHs,
    with a focus on gasoline.
geographic_markets_considered:
- market_id: gm_1
  name: Dry-laid PCW blankets — worldwide
  definition_status: considered
  notes: The Commission considered the market to be worldwide based on sourcing patterns, global
    operations of manufacturers, insignificant transport costs, and lack of hindering regulations,
    despite some price differences across regions.
- market_id: gm_2
  name: Dry-laid PCW support mats — worldwide
  definition_status: considered
  notes: The Commission considered the market to be worldwide, based on market investigation
    findings that hot-end manufacturers source globally, suppliers are active globally, transport
    costs are insignificant, and there are no hindering regulations, despite some regional price
    differences.
- market_id: gm_3
  name: Automobile exhaust systems (hot-ends) — at least EEA-wide
  definition_status: considered
  notes: The Commission previously left the geographic market for automotive components to OEMs
    open, but found it to be at least EEA-wide. It maintained this approach, conducting its
    assessment on an at least EEA-wide basis without departing from past findings.
