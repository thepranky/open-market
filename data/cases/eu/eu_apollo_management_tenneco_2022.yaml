- passage_id: sp_2
  source_document_id: eu_apollo_management_tenneco_2022_decision
  page: '6'
  quote_snippet: (24) The relevant product market comprises all products which are regarded
    as interchangeable or substitutable by the customer, by reason of the products’ characteristics,
    their prices and their intended use.11 The Commission has therefore investigated whether,
    from a demand-side perspective, dry-laid PCW blankets are regarded as interchangeable with
    (i) PCW mats or other forms of PCW, (ii) blankets made from other materials, and (iii) wet-laid
    PCW blankets, and more narrowly, (iv) whether a distinction between needle-punched and non-needle-punched
    PCW blankets was warranted. The Commission has further taken considerations of supply-side
    substitutability and potential competition into account.
  extraction_method: pdf_extracted
  review_status: unreviewed
