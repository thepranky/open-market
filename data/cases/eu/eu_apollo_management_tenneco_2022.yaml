  page: '10'
  quote_snippet: (46) The results of the market investigation confirmed that manufacturers of
    PCW support mats source PCW blankets on a worldwide level.38 The Notifying Party confirms
    that MAFTEC, the most important supplier of dry-laid PCW blankets, supplies its blankets
    on a worldwide basis.39 The majority of manufacturers of PCW support mats responded that
    transportation costs for their products are insignificant, and in any case below 10% of
    the product’s final price,40 while there are no regulations, certification processes or
    other factors that would hinder the import of PCW blankets into the EEA from any region
    worldwide.41
