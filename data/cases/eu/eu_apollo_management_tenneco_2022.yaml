  page: '9'
  quote_snippet: '(45) The Notifying Party submits that the market for the manufacture and supply
    of PCW blankets is global in scope for the following reasons: (i) MAFTEC manufactures PCW
    blankets in two plants in Japan and ships them worldwide; (ii) other manufacturers of PCW
    blankets also operate on a worldwide basis; (iii) the transport costs do not generally represent
    a material percentage of the final price; (iv) prices are uniform across geographies; and
    (iv) there are no national regulations or tariffs that hinder the imports of blankets.37'
