  source_document_id: eu_ec_m9929_2020_decision
  page: '4'
  quote_snippet: The Commission has consistently defined the market for the generation and wholesale
    supply of electricity as encompassing the domestic generation of electricity in power stations
    within a certain geographic market, traded on the wholesale market, as well as electricity
    physically imported into that geographic market via interconnectors, and irrespective of
    the different sources of electric energy
