  source_document_id: eu_ec_m9929_2020_decision
  page: '4'
  quote_snippet: In previous decisions, the Commission has taken the view that generation and
    wholesale supply of electricity are a single relevant product market because the generation
    of electricity is not an autonomous market activity from its wholesale supply.
