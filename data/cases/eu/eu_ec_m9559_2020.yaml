  quote_snippet: In prior decisions, the Commission made a distinction, within the market for
    security systems, between (i) manned guarding services; (ii) alarm installation and maintenance
    (i.e. electronic guarding equipment); and (iii) alarm monitoring and response.6 Hereafter,
    segments (ii) and (iii) will be referred to as “alarm services”.
