  page: '7'
  quote_snippet: The Commission has previously considered that there is an overall retail market
    for mobile telecommunication services constituting a separate market from retail fixed telecommunication
    services. In previous decisions, the Commission did not further segment the overall retail
    mobile market based on the type of service (e.g. voice calls, SMS, data services), or the
    type of network technology (e.g. 2G, 3G, 4G). The Commission considered possible segments
    of the overall retail market for mobile telecommunication services between pre-paid or post-paid
    services and private customers or business customers, concluding that these did not constitute
    separate product markets but rather represent market segments within an overall retail market.
