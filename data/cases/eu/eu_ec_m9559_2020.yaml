  page: '7'
  quote_snippet: The results of the market investigation conducted in the present case generally
    supported the market definition derived from the Commission’s past decisional practice.29
    Notably, the respondents highlighted several demand-side and supply-side substitutability
    issues. In particular, one respondent stressed that not all retail telecommunication services
    providers offer M2M services, the reverse being also true. Furthermore, remote monitoring
    and control as well as predictive maintenance are key features for M2M services that are
    not necessary for traditional telecommunication services.
