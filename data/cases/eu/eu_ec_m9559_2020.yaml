- passage_id: sp_34
  source_document_id: eu_ec_m9559_2020_decision
  page: '8'
  quote_snippet: As for the geographic scope of M2M services, the market investigation has yielded
    mixed results depending on the area of activity of the responding operator. The majority
    of operators active in Spain consider that a potential market for M2M services is national
    in scope35, whereas suppliers of M2M services mainly active outside of Spain have considered
    the geographic market to be wider in scope.36 However, the respondents that argued for a
    wider geographic scope referred to devices which cross borders (e.g., connected cars), for
    which a multi-national SIM card from a single connectivity provider would be required.37
    This is not the case for alarm devices, which are installed at a fixed location.
  extraction_method: pdf_extracted
