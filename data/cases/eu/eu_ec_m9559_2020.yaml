- passage_id: sp_2
  source_document_id: eu_ec_m9559_2020_decision
  page: '3'
  quote_snippet: Prosegur Alarmas and TEF, via its subsidiary TIS, are active in the supply
    of alarm services7, while they do not offer manned guarding services as PCS does. While
    Prosegur Alarms mainly supplies alarm services to residential and SME customers, TEF mainly
    supplies SME customers. Accordingly, the Transaction only concerns the markets for alarms
    services and not the wider market for security systems.
  extraction_method: pdf_extracted
