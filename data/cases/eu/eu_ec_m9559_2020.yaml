product_markets_considered:
- market_id: pm_1
  name: Market for security systems
  definition_status: left_open
  notes: The Commission considered a distinction within the market for security systems between
    (i) manned guarding services; (ii) alarm installation and maintenance; and (iii) alarm monitoring
    and response. Segments (ii) and (iii) are referred to as 'alarm services'. The exact product
    market definition was left open as the transaction did not raise serious doubts under any
    plausible definition.
- market_id: pm_2
  name: Alarm installation and maintenance services
  definition_status: left_open
  notes: Considered as a segment of the market for security systems. The Commission previously
    considered that this market could be further divided by customer type (residential and business
    customers), but left the market definition open.
- market_id: pm_3
  name: Alarm monitoring and response services
  definition_status: left_open
  notes: Considered as a segment of the market for security systems. The Commission previously
    considered whether alarm monitoring and alarm response could be distinct and whether it
    could be further divided by customer type (residential and business customers), but left
    the exact product market definition open.
- market_id: pm_4
  name: Peace of Mind solutions
  definition_status: defined
  notes: The Commission concluded that Peace of Mind solutions do not form part of the market
    for security systems, despite exerting some competitive constraint.
- market_id: pm_5
  name: Retail supply of mobile telecommunication services
  definition_status: left_open
  notes: The Commission previously considered an overall retail market for mobile telecommunication
    services, separate from fixed services, and did not further segment it by service type or
    network technology, or by pre-paid/post-paid or customer type. For this decision, the exact
    product market definition was left open for the part excluding M2M services.
- market_id: pm_6
  name: M2M services
  definition_status: defined
  notes: The Commission concluded that M2M (machine-to-machine) services constitute a separate
    market.
- market_id: pm_7
  name: Retail supply of fixed telephony services
  definition_status: left_open
  notes: The Commission considered an overall retail market for fixed telephony services including
    VoIP services. Possible distinctions between local/national and international calls or residential/non-residential
    customers were considered but left open.
- market_id: pm_8
  name: Retail supply of fixed internet access services
  definition_status: left_open
  notes: The Commission previously considered possible segmentations within fixed internet access
    services by product type, distribution mode, and customer type, and also noted it should
    not be segmented by download speed. For this decision, the exact product market definition
    was left open.
- market_id: pm_9
  name: Retail supply of TV services
  definition_status: left_open
  notes: The Commission previously distinguished Free-to-Air (FTA) TV and pay-TV, and considered
    further segmentations for pay-TV (linear vs non-linear, distribution technologies, premium
    vs basic services). For this decision, the exact product market definition was left open.
- market_id: pm_10
  name: Retail supply of multiple play services
  definition_status: left_open
  notes: The Commission previously considered the existence of distinct markets for multiple
    play offerings but left it open. The market investigation in this case generally supported
    the possibility of a potential separate market.
geographic_markets_considered:
- market_id: gm_1
  name: Market for security systems — national (Spain affected)
  definition_status: defined
  notes: The Commission concluded that the market for security systems, including any plausible
    segmentation thereof, is national in scope.
- market_id: gm_2
  name: Retail mobile telecommunication services (excluding M2M services) — national (Spain
    affected)
  definition_status: defined
  notes: The Commission found that the overall market for retail mobile telecommunication services
    (except M2M services) is national in scope.
- market_id: gm_3
  name: M2M services — geographic market left open
  definition_status: left_open
  notes: The Commission assessed whether the geographic market was national or regional, but
    ultimately left the definition open, noting mixed results from the market investigation
    (national for Spanish operators, wider for international operators, but alarm devices are
    at a fixed location).
- market_id: gm_4
  name: Retail supply of fixed telephony services — geographic market left open
  definition_status: left_open
  notes: Previous decisions concluded this market was national in scope. For the purpose of
    this decision, the exact geographic market definition was left open.
- market_id: gm_5
  name: Retail supply of fixed internet access services — geographic market left open
  definition_status: left_open
  notes: Previous decisions concluded this market was national in scope. For the purpose of
    this decision, the exact geographic market definition was left open.
- market_id: gm_6
  name: Retail supply of TV services — geographic market left open
  definition_status: left_open
  notes: The Commission previously considered that this market is either national, or limited
    to the geographic coverage of a supplier’s cable network. For the purpose of this decision,
    the exact geographic market definition was left open.
- market_id: gm_7
  name: Retail supply of multiple play services — geographic market left open
  definition_status: left_open
  notes: Previous decisions considered the geographic scope would be national as components
    are offered nationally. For the purpose of this decision, the exact geographic market definition
    was left open.
