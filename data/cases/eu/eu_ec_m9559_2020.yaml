  page: '13'
  quote_snippet: 'The Commission also considered whether pay-TV can be segmented further according
    to: (i) linear vs non-linear pay-TV services;59 (ii) distribution technologies (e.g. cable,
    satellite, or terrestrial);60 (ii) distribution technologies (e.g. cable, satellite, or
    terrestrial);61 and (iii) premium vs basic pay-TV services.62 In certain countries, due
    to the large penetration of pay-TV services and the fact that such services also carry the
    main FTA channels, the Commission has identified two separate product markets for: (i) basic
    pay-TV services (including FTA services) and (ii) premium pay-TV services. In previous cases,
    the Commission has left open the market definition with regard to each of these potential
    sub-segments.'
