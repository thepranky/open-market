  source_document_id: eu_ec_m9559_2020_decision
  page: '5'
  quote_snippet: With regard to the other above-mentioned segmentations, namely between (i)
    manned guarding services; (ii) alarm installation and maintenance (i.e. electronic guarding
    equipment); and (iii) alarm monitoring and response services and, for (ii) and (iii), a
    further potential sub-segmentation between residential and business customers, the Commission
    considers that, in any event, for the purposes of this decision, the exact product market
    definition with regard to the market for security systems can be left open, as the Transaction
    does not raise serious doubts as to its compatibility with the internal market or the functioning
    of the EEA Agreement under any plausible product market definition.
