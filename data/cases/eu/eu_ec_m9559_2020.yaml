  page: '11'
  quote_snippet: In previous cases, the Commission considered, but ultimately left open, possible
    segmentations within the supply of retail fixed internet access services according to (i)
    product type, distinguishing between narrowband, broadband and dedicated access; (ii) distribution
    mode, distinguishing between xDSL, fibre, cable (fixed-only) and internet provided through
    the mobile network infrastructure (fixed-wireless); and (iii) customer type, distinguishing
    between residential and small business customers on the one hand, and larger business customers
    and public authorities on the other.49 At the same time, the Commission noted that the retail
    market for fixed internet access services should not be segmented according to download
    speed.
