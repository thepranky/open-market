  source_document_id: eu_carlyle_altadia_2022_decision
  page: '2'
  quote_snippet: '(5) The undertakings concerned have a combined aggregate worldwide turnover
    of more than EUR 5 000 million in 2020 (Carlyle: EUR […]; Altadia: EUR […])4. Each of them
    has a Union-wide turnover in excess of EUR 250 million in 2020 (Carlyle: EUR […]; Altadia:
    EUR […]), but they do not achieve more than two-thirds of their aggregate Union-wide turnover
    within one and the same Member State. The Transaction therefore has a Union dimension.'
