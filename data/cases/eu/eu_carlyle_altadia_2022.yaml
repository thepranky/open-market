product_markets_considered:
- market_id: pm_1
  name: Metal and mineral commodities
  definition_status: left_open
  notes: The Commission listed a number of specific metal and mineral commodities (cerium oxide,
    molybdenum oxide, potassium carbonate, sodium carbonate, vanadium pentoxide, wollastonite,
    and zircon oxide) where Traxys is active. While the exact product market definition was
    left open, the Commission assessed the market by commodity on an EEA-level for the purposes
    of the decision.
- market_id: pm_2
  name: Ceramic tile intermediates
  definition_status: left_open
  notes: The Commission identified specific ceramic tile intermediates (frits and glazes, glaze
    stains, digital inks, and body stains) where Altadia is active. Although the exact product
    market definition was left open, the Commission performed its assessment on the basis of
    separate EEA-wide product markets for each of these intermediates.
geographic_markets_considered:
- market_id: gm_1
  name: Metal and mineral commodities — EEA-wide
  definition_status: left_open
  notes: For the upstream metal and mineral commodities, the Commission left the exact geographic
    market definition open but conducted its assessment on an EEA-level.
- market_id: gm_2
  name: Ceramic tile intermediates — EEA-wide
  definition_status: left_open
  notes: For the downstream ceramic tile intermediates, the Commission left the exact geographic
    market definition open but performed its assessment on an EEA-wide basis.
