- passage_id: sp_12
  source_document_id: eu_ec_m9981_2021_decision
  page: '11'
  quote_snippet: The Commission considers that the question of whether the geographic scope
    of the market for the manufacture and supply of release liners (and any plausible sub segmentation)
    is EEA-wide or global may be left open for the purposes of this decision as it does not
    alter the conclusions of the competitive assessment. However, the Commission has carried
    out the competitive assessment on the basis of the narrowest plausible geographic market,
    that is, an EEA-wide market.
  extraction_method: pdf_extracted
