- passage_id: sp_11
  source_document_id: eu_ec_m9981_2021_decision
  page: '10'
  quote_snippet: The Notifying Party submits that the market for the supply of release liners
    is at least EEA-wide because (i) release liners producers supply across the EEA and beyond
    regardless of their mills’ location; (ii) customers source release liners from different
    countries across the EEA notwithstanding their own plants’ location; (iii) transport costs
    are low; and (iv) prices are generally consistent across the EEA.
  extraction_method: pdf_extracted
  review_status: unreviewed
