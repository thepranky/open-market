product_markets_considered:
- market_id: pm_1
  name: Production and supply of release liners
  definition_status: segmented
  notes: The Commission considered segmenting the market for release liners by substrate (film-based
    and paper-based) but left the question open. For the purpose of the decision, the assessment
    focused on paper-based release liners.
- market_id: pm_2
  name: Production and supply of paper-based release liners
  definition_status: segmented
  notes: The Commission assessed this market as a plausible segment, but also considered whether
    it should be further segmented by type (glassine, CCK, other), which was ultimately left
    open. Ahlstrom-Munksjö only produces glassine and CCK release liners.
- market_id: pm_3
  name: Production and supply of glassine release liners
  definition_status: considered
  notes: The Commission considered this as a plausible segment for assessment within paper-based
    release liners, without definitively concluding on the segmentation.
- market_id: pm_4
  name: Production and supply of SAL
  definition_status: segmented
  notes: The Commission considered segmenting SAL by substrate (film-based vs. paper-based)
    and form (reels vs. sheets), but left both questions open. The market for alternatives to
    SAL was deemed separate.
geographic_markets_considered:
- market_id: gm_1
  name: Production and supply of release liners — EEA-wide
  definition_status: left_open
  notes: The Commission considered the geographic scope to be at least EEA-wide or global, but
    left the exact definition open. The competitive assessment was conducted on the narrowest
    plausible market, EEA-wide.
- market_id: gm_2
  name: Production and supply of SAL — EEA-wide
  definition_status: left_open
  notes: The Commission considered the geographic scope to be at least EEA-wide or global, but
    left the exact definition open. The competitive assessment was conducted on the narrowest
    plausible market, EEA-wide.
