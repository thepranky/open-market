- passage_id: sp_3
  source_document_id: eu_ec_m9981_2021_decision
  page: '5'
  quote_snippet: For the purposes of this decision, the Commission considers that it can be
    left open whether paper-based and film-based release liners belong to separate product markets,
    as the Transaction does not raise any competition concerns, irrespective of the exact market
    definition adopted. As Ahlstrom-Munksjö does not produce film-based release liners (see
    paragraph (15)), this decision looks only at paper-based release liners.
  extraction_method: pdf_extracted
  review_status: unreviewed
