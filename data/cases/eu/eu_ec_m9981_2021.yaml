- passage_id: sp_2
  source_document_id: eu_ec_m9981_2021_decision
  page: '5'
  quote_snippet: The Commission has considered release liners on a number of occasions and has
    ultimately left open the question of whether all types of release liners belong to the same
    relevant product market or whether they should be segmented by substrate (namely film-based
    and paper-based release liners).
  extraction_method: pdf_extracted
