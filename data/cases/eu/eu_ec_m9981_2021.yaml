source_passages:
- passage_id: sp_1
  source_document_id: eu_ec_m9981_2021_decision
  page: '3'
  quote_snippet: Release liners (also called release base papers) are surface-treated specialty
    papers used as release carrier and backing webs for a wide range of self-adhesive products,
    including labels, graphic arts (e.g. for printed graphic face stock), industrial applications
    (e.g. casting sheets, industrial processing sheets), envelopes (to cover the self-adhesive
    strips of postal envelopes and mailing bags), tapes (e.g. as carrier for supported and unsupported
    adhesives) and medical (e.g. for medical dressings and tapes) and hygiene products.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
