- passage_id: sp_14
  source_document_id: eu_ec_m9981_2021_decision
  page: '11'
  quote_snippet: The Notifying Party agrees with the Commission’s precedent and considers that
    geographic markets for SAL narrower than the EEA-wide are not plausible and that for large
    customers the geographic scope of the market is global. According to the Notifying Party,
    the market is at least EEA-wide in scope because suppliers located in different Member States
    do not face any impediment to commercialising their sales throughout and beyond the EEA.
  extraction_method: pdf_extracted
