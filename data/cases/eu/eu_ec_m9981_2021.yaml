- passage_id: sp_8
  source_document_id: eu_ec_m9981_2021_decision
  page: '8'
  quote_snippet: The Commission has previously considered whether (i) film-based and paper-based
    SAL and (ii) SAL sold in reels and SAL sold in sheets could be distinct markets but ultimately
    left the question open. The Commission has also previously considered that, while alternatives
    to SAL (such as labels that are fixed on the basis of gum, labels fixed by glue activated
    by heat, wet-glue labels, sleeves, in-mould labels and direct printing) may to some extent
    be substitutable with SAL on the demand-side, they are not to be regarded as forming part
    of the same relevant product market.
  extraction_method: pdf_extracted
