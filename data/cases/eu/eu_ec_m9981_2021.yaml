- passage_id: sp_7
  source_document_id: eu_ec_m9981_2021_decision
  page: '7'
  quote_snippet: SAL is paper or film (i.e. synthetic material) pre-coated with a pressure-activated
    adhesive and protected by a backing material or paper. SAL is used in a number of different
    products, e.g. price tags, product information, functional, security and promotional labels.
  extraction_method: pdf_extracted
