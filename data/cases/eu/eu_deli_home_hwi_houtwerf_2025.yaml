  source_document_id: eu_deli_home_hwi_houtwerf_2025_decision
  page: '5'
  quote_snippet: Moreover, based on the results of the market investigation, it is likely relevant
    to segment the market for the wholesale of timber construction materials by material type,
    i.e. in relation to this Transaction between MDF and HDF, oriented strand board (‘OSB’),
    coated particle boards and uncoated particle boards, plywood, and sawn wood/timber.
  extraction_method: pdf_extracted
