product_markets_considered:
- market_id: pm_1
  name: Wholesale of timber construction materials to the DIY retail channel (segmented by material)
  definition_status: left_open
  notes: The Commission assessed this market at the 'narrowest plausible level' by segmenting
    it by sales channel (to DIY retailers) and material type. Segmentation by intended use and
    branded/unbranded products was not considered relevant.
- market_id: pm_2
  name: Retail sale of timber construction materials (segmented by sales channel and material)
  definition_status: left_open
  notes: The Commission assessed this market at the 'narrowest plausible level' by segmenting
    it by sales channel (to non-professional customers, i.e., DIY retail) and material type.
    Segmentation by intended use was not considered relevant.
geographic_markets_considered:
- market_id: gm_1
  name: Wholesale of timber construction materials to the DIY retail channel — national (Netherlands
    and Belgium affected)
  definition_status: considered
  notes: While the Commission considered the market 'likely cross-border regional in scope,
    and in relation to this Transaction, potentially encompassing Benelux', it was assessed
    at the national level as the 'narrowest plausible level'.
- market_id: gm_2
  name: Retail sale of timber construction materials — national (Netherlands and Belgium affected)
  definition_status: considered
  notes: While the Commission considered the market 'likely local in scope, corresponding to
    a catchment area of ca. 30 km from the store', it was assessed at the national level for
    the vertical assessment.
