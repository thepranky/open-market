  source_document_id: eu_deli_home_hwi_houtwerf_2025_decision
  page: '4'
  quote_snippet: Based on the results of the market investigation and in line with the Commission’s
    prior decisional practice, the wholesale of timber construction materials should be segmented
    by sales channel, i.e. between sales to DIY retailers and sales to professional retailers,
    e.g. builders’ merchants.
