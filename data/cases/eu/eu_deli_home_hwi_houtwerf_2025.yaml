- passage_id: sp_13
  source_document_id: eu_deli_home_hwi_houtwerf_2025_decision
  page: '3'
  quote_snippet: The Transaction gives rise to horizontally affected markets in the Netherlands
    and Belgium in relation to the wholesale of timber construction materials to the DIY retail
    channel, and certain sub-segments thereof. The Transaction also gives rise to vertically
    affected markets, between the wholesale of certain timber construction materials to DIY
    retailers (upstream) and the DIY retail of such materials (downstream) in the Netherlands
    and Belgium. The Transaction could also give rise to conglomerate effects as the Parties
    supply other home improvement products to DIY retailers alongside timber construction materials.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets: []
  supports_geographic_markets: []
