  supports_commitments: []
- passage_id: sp_14
  source_document_id: eu_deli_home_hwi_houtwerf_2025_decision
  page: '3'
  quote_snippet: The Transaction further results in horizontal overlaps and vertical links for
    a number of other markets.5 However, none of these overlaps or links give rise to affected
    markets within the meaning of recital 25(g) Annex I to Regulation (EU) 2023/9146, as they
    meet the conditions for review under point 5 or benefit from the flexibility clauses of
    point 8 of the Notice on Simplified Treatment7. Therefore, these overlaps and links will
    not be further discussed in this decision.
  extraction_method: pdf_extracted
