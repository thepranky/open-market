product_markets_considered:
- market_id: pm_1
  name: Licensing of broadcasting rights for pre-produced audio-visual content
  definition_status: left_open
  notes: The Commission considered segmenting the market by nature and content type (premium
    films, regularly occurring football events, intermittently played football events, other
    sports) and by exhibition window (pay TV / FTA, linear / non-linear, VOD / PPV / first pay
    TV window / second pay TV window / FTA TV). However, it ultimately left the exact product
    market definition open.
- market_id: pm_2
  name: Wholesale supply of TV channels
  definition_status: left_open
  notes: The Commission previously identified separate markets for FTA TV channels and pay TV
    channels, with further segmentation into premium and basic pay TV channels. It also considered
    sub-division by channel genre (film, sport, news, youth) and infrastructure (cable, satellite,
    DTT, IPTV) but left these questions open in previous decisions. For this decision, the exact
    definition was left open.
- market_id: pm_3
  name: Retail supply of audio-visual services
  definition_status: left_open
  notes: The Commission considered the retail provision of FTA TV and pay TV services as separate
    markets. It also considered segmenting retail pay TV by linear vs. non-linear services or
    premium vs. basic services, and whether to include different distribution technologies in
    the same market. For this decision, the exact definition was left open.
- market_id: pm_4
  name: Sale of TV advertising space
  definition_status: considered
  notes: The Commission considered TV advertising a distinct product market, separate from other
    forms of media. It left open questions about a wider market for video format across platforms
    and whether advertising on pay TV and FTA TV are part of the same market. For the purpose
    of this decision, the Commission considered that the market does not need to be further
    segmented based on the financing model (FTA or pay TV).
- market_id: pm_5
  name: Retail supply of mobile telecommunications services
  definition_status: left_open
  notes: The Commission previously identified an overall retail market for mobile telecommunications
    services, separate from fixed telecommunications services. It examined potential segmentations
    by pre-paid/post-paid services, private/business customers, type of service, or network
    technology, concluding these were segments within the overall market. For this decision,
    the exact definition was left open.
- market_id: pm_6
  name: Retail supply of fixed internet access services
  definition_status: left_open
  notes: The Commission considered segmentations by product type (narrowband, broadband, dedicated
    access), distribution mode (xDSL, fiber, cable, mobile broadband), and customer type (residential/small
    business vs. large business), but ultimately left the market definition open. It concluded
    that large business customers form part of business connectivity services and that fixed
    internet services provided through mobile network infrastructure should be excluded.
geographic_markets_considered:
- market_id: gm_1
  name: Licensing of broadcasting rights for pre-produced audio-visual content — national (Czechia,
    Slovakia, Bulgaria affected)
  definition_status: considered
  notes: Based on market investigation results showing content licensing primarily on a national
    basis, the Commission considered the geographic market for the licensing of broadcasting
    rights to be national in scope for the purpose of this decision.
- market_id: gm_2
  name: Wholesale supply of TV channels — national (Czechia, Slovakia, Bulgaria affected)
  definition_status: considered
  notes: The market investigation indicated that agreements for wholesale TV channels are generally
    negotiated on a national basis, with TV retailers having a national footprint. Thus, the
    Commission considered the market to be national.
- market_id: gm_3
  name: Retail supply of audio-visual services — national (Czechia, Slovakia, Bulgaria affected)
  definition_status: considered
  notes: The market investigation did not contradict previous findings that the market is national
    or corresponds to the relevant language area, as distributors primarily offer services nationally.
    The countries where parties are active (Czechia, Slovakia, Bulgaria) are also linguistic
    regions. The Commission considered the market national in scope for this decision.
- market_id: gm_4
  name: Sale of TV advertising space — national (Czechia, Slovakia, Bulgaria affected)
  definition_status: considered
  notes: 'The market investigation confirmed previous findings that the market is national or
    corresponds to the relevant language area, as purchasers overwhelmingly procure advertising
    inventory on a national basis. The countries where parties are active (Czechia, Slovakia,
    Bulgaria) are also linguistic regions. The Commission considered the market national in
    scope for this decision. Note: The concluding paragraph (66) in the source text refers to
    ''retail provision of TV services'' but contextually it appears to be a typo and meant to
    refer to ''sale of TV advertising space'', consistent with paragraph (65).'
- market_id: gm_5
  name: Retail supply of mobile telecommunications services — national (Czechia, Slovakia, Bulgaria
    affected)
  definition_status: considered
  notes: The market investigation did not indicate a departure from previous findings that the
    market for retail mobile telecommunication services is national in scope due to regulatory
    barriers and national coverage.
- market_id: gm_6
  name: Retail supply of fixed internet access services — national (Czechia, Slovakia affected)
  definition_status: considered
  notes: The market investigation did not indicate a departure from previous findings that the
    market for fixed internet access services is national in scope due to national upstream
    wholesale services and pricing policies.
