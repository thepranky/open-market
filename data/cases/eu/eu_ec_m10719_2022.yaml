  page: '9'
  quote_snippet: The Commission concludes that for the purposes of this Decision, it is not
    necessary to further segment the market for the generation and distribution of district
    heating, because in its competitive assessment, it considers that Ennatuurlijk has a natural
    monopoly in the wider product market in relation to its district heating networks and therefore,
    the competitive assessment and its outcome would not differ should the market be segmented
    between the generation and distribution of district heating..
