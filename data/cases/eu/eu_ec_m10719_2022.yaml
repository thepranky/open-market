source_passages:
- passage_id: sp_1
  source_document_id: eu_ec_m10719_2022_decision
  page: '4'
  quote_snippet: In light of the fact that electrical engineering services for substations are
    always provided together with the rental/lease thereof in the Netherlands, the Commission
    will therefore, for the purposes of this Decision, carry out its competitive assessment
    on the basis of a product market comprising both the leasing/renting of substations and
    installation and maintenance services of the same. No distinction will be made between installation
    and maintenance, as all providers in the Netherlands provide both installation and maintenance
    as one package. No distinction will be made between residential and non-residential customers
    either, as all customers within the substation segment are all non-residential.15 The Commission
    leaves open whether a distinction based on infrastructure/industry/tertiary sector should
    be made, but will make this distinction for the purposes of the competitive assessment in
    order to assess the narrowest plausible market, which for the purposes of this Decision,
    would be the infrastructure sector.
  extraction_method: pdf_extracted
