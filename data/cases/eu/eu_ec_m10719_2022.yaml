- passage_id: sp_3
  source_document_id: eu_ec_m10719_2022_decision
  page: '7'
  quote_snippet: The Commission has confirmed the Notifying Parties’ statements regarding the
    different regulatory requirements between heat metering for small and large capacity connections
    in the Netherlands. In light of these requirements, the Commission considers that for the
    purposes of this Decision, heat metering services in the Netherlands could plausibly be
    segmented between large (above 100kW) and small (below 100kW) capacity connections. In any
    event, given that the Transaction would not raise serious doubts as to its compatibility
    with the internal market even under the narrowest plausible product market definition, the
    Commission will leave the exact product market definition open for the purposes of this
    Decision.
  extraction_method: pdf_extracted
