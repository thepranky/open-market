authority: European Commission
jurisdiction: EU
sector: manufacturing
outcome: cleared
procedure_stage: phase1
decision_date: '2025-03-26'
parties:
- name: MONDI
  role: acquirer
- name: SCHUMACHER PACKAGING (GERMAN & DUTCH & UK BUSINESS
  role: target
source_documents:
- doc_id: eu_mondi_schumacher_packaging_german_du_2025_decision
  title: MONDI / SCHUMACHER PACKAGING (GERMAN & DUTCH & UK BUSINESS — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.11786
  pdf_url: http://publications.europa.eu/resource/cellar/0dc5b233-371b-11f0-8a44-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Manufacture and supply of corrugated cases
  definition_status: left_open
  notes: The Commission focused its assessment on this market, explicitly stating it would define
    its product and geographic scope, but ultimately left the exact definitions open.
- market_id: pm_2
  name: Manufacture and supply of conventional corrugated cases
  definition_status: left_open
  notes: The Commission's market investigation confirmed that a distinction between conventional,
    heavy-duty, and litho-laminated cases is appropriate, but the exact product market definition
    was left open.
- market_id: pm_3
  name: Manufacture and supply of heavy-duty corrugated cases
  definition_status: left_open
  notes: The Commission considered the segmentation appropriate, but the market investigation
    was inconclusive on the exact definition, particularly regarding 'Schwerwellpappe'. The
    Commission assessed the transaction based on a broader definition including 'Schwerwellpappe'
    for practical purposes, while leaving the formal definition open.
- market_id: pm_4
  name: Manufacture and supply of litho-laminated cases
  definition_status: left_open
  notes: The Commission found that litho-laminated cases are distinct from flexo-printing based
    on market feedback. The exact product market definition was left open, but the Commission
    assessed the transaction on the basis of the narrowest plausible market definition (litho-laminated
    cases).
geographic_markets_considered:
- market_id: gm_1
  name: Manufacture and supply of corrugated cases — local
  definition_status: left_open
  notes: The Commission's market investigation confirmed a local dimension for corrugated cases,
    with varying radii depending on the type of case. However, the exact geographic market definition
    was left open.
- market_id: gm_2
  name: Manufacture and supply of conventional corrugated cases — local (300 km radius)
  definition_status: left_open
  notes: The market investigation supported a 300 km radius for conventional cases. The exact
    geographic market definition was left open.
- market_id: gm_3
  name: Manufacture and supply of heavy-duty corrugated cases — local (400 km radius)
  definition_status: left_open
  notes: The market investigation supported a 400 km radius for heavy-duty cases, which is wider
    than for conventional cases. The exact geographic market definition was left open.
- market_id: gm_4
  name: Manufacture and supply of litho-laminated cases — local (400 km radius)
  definition_status: left_open
  notes: The market investigation supported a 400 km radius for litho-laminated cases, which
    is wider than for conventional cases. The exact geographic market definition was left open.
theories_of_harm: []
commitments: []
source_passages:
- passage_id: sp_1
  source_document_id: eu_mondi_schumacher_packaging_german_du_2025_decision
  page: '3'
  quote_snippet: |
    The Parties are both active in corrugated packaging. In the EEA, their activities overlap in the manufacture and supply of corrugated sheets and corrugated cases. Mondi is also active in the upstream market for the production and supply of corrugated case materials (‘CCM’).
    (9) On the basis of the Commission’s previous market definitions and depending on the metrics and the data set used,5 the Transaction leads to technically affected markets related to the manufacture and supply of corrugated cases.
    These markets are therefore the focus of the present decision.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
