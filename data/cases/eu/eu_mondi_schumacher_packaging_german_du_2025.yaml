  source_document_id: eu_mondi_schumacher_packaging_german_du_2025_decision
  page: '7'
  quote_snippet: In any event, for the purposes of the present case, the exact geographic market
    definition may be left open, given that the Transaction does not raise serious doubts as
    to its compatibility with the internal market or with the EEA Agreement with respect to
    the markets for the manufacture and supply of conventional, heavy-duty and litho-laminated
    corrugated cases under any plausible market definition.
  extraction_method: pdf_extracted
