- passage_id: sp_4
  source_document_id: eu_mondi_schumacher_packaging_german_du_2025_decision
  page: '5'
  quote_snippet: 'There are three main types of corrugated cases: (i) conventional, (ii) heavy-duty
    (cases for customers that need a high level of protection for their goods in transit, typically
    used in the industrial or automotive segments, with limited decoration),9 and (iii) litho-laminated
    cases (secondary packaging to distribute goods, that may also be used as ‘shelf-ready’ packaging;
    accordingly, they need to meet the requirements of both distribution and promotional purposes).'
  extraction_method: pdf_extracted
