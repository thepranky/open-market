  source_document_id: eu_mondi_schumacher_packaging_german_du_2025_decision
  page: '5'
  quote_snippet: In the absence of any affected markets regarding the production of CCM or sheets,
    the Commission will only define the product and geographic market for the manufacture and
    supply of corrugated cases.
  extraction_method: pdf_extracted
  review_status: unreviewed
