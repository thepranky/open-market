- passage_id: sp_4
  source_document_id: eu_nokia_infinera_2025_decision
  page: '5'
  quote_snippet: '(21) In case M.4003 Ericsson / Marconi the Commission considered that optical
    transport equipment can be segmented into three categories based on the functions performed
    by devices in each category: (i) bandwidth management devices situated at the core of the
    optical network;22 (ii) aggregation devices situated at the edge of the optical network
    and used to aggregate customers into the core network;23 and (iii) WDM systems.24'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_2
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_5
  source_document_id: eu_nokia_infinera_2025_decision
  page: '7'
  quote_snippet: (27) The results of the market investigation are inconclusive as to whether
    the relevant market for the supply of optical transport equipment must be further segmented
    by type of device (into bandwidth management devices, aggregation devices and WDM systems).
    The feedback received from market participants during the market investigation confirmed
    that, despite the ongoing technological advancements in the market for the supply of optical
    transport equipment, the market transformation is still in progress. Thus, although there
    is a technological shift that has led to increased use of WDM systems, bandwidth management
    devices and aggregation devices are still relevant for the assessment.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
