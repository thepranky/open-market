- passage_id: sp_20
  source_document_id: eu_nokia_infinera_2025_decision
  page: '6'
  quote_snippet: '(24) The Notifying Party submits that the optical network industry has evolved
    significantly since the Commission’s 2006 decision in M.4214 Alcatel / Lucent Technologies.
    In particular, the Notifying Party submits that: (a) Bandwidth management devices and aggregation
    devices would today be considered as legacy categories of products that have almost entirely
    been replaced by WDM systems.27 Accordingly, the industry typically would distinguish between:
    (i) WDM systems and (ii) non-WDM or legacy products comprising both bandwidth management
    devices and aggregation devices.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
