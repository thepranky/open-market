- passage_id: sp_3
  source_document_id: eu_nokia_infinera_2025_decision
  page: '12'
  quote_snippet: '(50) The competitive assessment will consider the following product market
    and its potential segments that are affected as set out in Table 16 of this Decision (excluding
    pluggable transceiver modules, though considering such modules as a possible constraint):
    (1) overall optical transport equipment, (2) WDM systems (all applications), (3) WDM systems
    for metro applications, (4) WDM systems for long-haul applications, (5) WDM systems for
    terrestrial applications, (6) WDM systems for subsea applications, (7) WDM systems for DCI
    applications, and (8) legacy (non-WDM) devices.'
  extraction_method: pdf_extracted
