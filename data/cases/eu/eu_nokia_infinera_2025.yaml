  page: '12'
  quote_snippet: (51) In M.4003 Ericsson / Marconi and M.4214 Alcatel / Lucent Technologies,64
    the Commission considered that the geographic market for optical transport equipment, and
    its possible segments, is at least EEA-wide, if not broader, for various reasons. These
    include customers and suppliers having an EEA (if not worldwide) presence, the evolution
    of IP technology and EEA/worldwide standardisation, the fact that prices and tenders for
    these products are normally negotiated on an EEA (if not worldwide) basis and that transport
    costs are not a determining factor when considering suppliers. Ultimately, the Commission
    left the exact geographic market definition open.
  extraction_method: pdf_extracted
