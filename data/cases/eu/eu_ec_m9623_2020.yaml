product_markets_considered:
- market_id: pm_1
  name: Supply of FRCs
  definition_status: defined
  notes: FRCs are used to treat refinery residue in hydroprocessing. The Commission considered
    that the product market should not be broader than FRCs and that no further sub-segmentation
    (e.g., between fixed bed and ebullated bed technologies) was necessary.
- market_id: pm_2
  name: Recycling of SRCs
  definition_status: defined
  notes: SRCs are spent FRCs that can be recycled. The Commission found no need for sub-segmentation
    based on different recycling stages, recovered materials/technology (e.g., pyro- or hydrometallurgical
    processes), or types of SRCs (e.g., from fixed bed vs. ebullated bed reactors).
geographic_markets_considered:
- market_id: gm_1
  name: Supply of FRCs — EEA and worldwide
  definition_status: left_open
  notes: The Notifying Parties suggested a worldwide market. The market investigation also pointed
    towards a worldwide market, but the Commission noted regional differences in supplier presence.
    The exact geographic market definition was left open as the concentration would not raise
    serious doubts under either an EEA or worldwide definition.
- market_id: gm_2
  name: Recycling of SRCs — EEA-wide or EMEA-wide
  definition_status: left_open
  notes: The Notifying Parties proposed an EEA-wide market, potentially including the Middle
    East and Asia, due to significant transport and regulatory costs for hazardous spent catalysts.
    The market investigation indicated the market is likely EEA-wide or EMEA-wide (Europe, Middle
    East and Asia). The exact geographic market definition was left open as the concentration
    would not raise serious doubts under either definition.
