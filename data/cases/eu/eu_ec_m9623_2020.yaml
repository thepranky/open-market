  page: '9'
  quote_snippet: According to the Notifying Parties, the geographic market for SRCs is EEA-wide,
    potentially including the Middle East and Asia as (i) transport costs for SRCs are significant,
    limiting the profitability of transporting the waste product from a refinery to a recycling
    facility, and (ii) as spent catalysts are toxic/hazardous, the related regulatory costs
    mean that recyclers in a different region are at a competitive disadvantage.47
