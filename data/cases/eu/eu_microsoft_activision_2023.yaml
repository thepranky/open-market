- passage_id: sp_8
  source_document_id: eu_microsoft_activision_decision
  page: '21'
  quote_snippet: Contrary to the Notifying Party's submissions, the Commission's findings indicate
    that when gamers start playing a newly released game, they mostly spend less time playing
    other games of the same genre. That is, substitution mostly takes place within genres while
    substitution across genres is substantially less frequent. This indicates that at least
    a segmentation of the market for game development and publishing by genre would be appropriate.
  extraction_method: pdf_extracted
