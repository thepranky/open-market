  source_document_id: eu_microsoft_activision_decision
  page: '22'
  quote_snippet: Based on the results of the market investigation, the Commission considers
    that the market for game development and publishing is highly differentiated on the basis
    of game genres. In this regard, genres constitute an important distinguishing factor between
    video games that affects to a certain degree the level of competition between them. However,
    there exists some uncertainty as to whether such differentiation allows to conclude that
    all or certain game genres form separate product markets from other genres.
  extraction_method: pdf_extracted
