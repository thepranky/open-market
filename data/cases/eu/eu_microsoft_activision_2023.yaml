- passage_id: sp_6
  source_document_id: eu_microsoft_activision_decision
  page: '19'
  quote_snippet: In light of the above, for the purposes of this Decision, the Commission concludes
    that the development and publishing of mobile games does not belong to the same product
    market as the development and publishing of PC and console games, respectively. The Commission
    will not assess the potential separate market for the development of mobile games, as the
    combined market share of the Parties on this market remains below 20%. Moreover, the Commission
    concludes that the product market definition can be left open with regard to a segmentation
    based on platform between PC and console, as the outcome of the analysis will be the same
    regardless of whether the Commission considers an overall market for game development and
    publishing of PC and console games, or potential separate markets for the development of
    (i) PC; and (ii) console games, respectively.
  extraction_method: pdf_extracted
