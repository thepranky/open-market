- passage_id: sp_1
  source_document_id: eu_microsoft_activision_decision
  page: '15'
  quote_snippet: 'In Microsoft/ZeniMax, the Commission considered potential segmentations of
    the market for video game publishing and development on the basis of: (i) gaming platforms
    (i.e., PC games, console games and mobile games); (ii) game genres (e.g., strategy, simulation,
    action, adventure, role-playing etc.); or (iii) type of games (e.g., premium or "AAA" games,
    casual games). The Commission left the precise market definition open.'
  extraction_method: pdf_extracted
