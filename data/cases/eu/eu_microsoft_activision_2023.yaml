product_markets_considered:
- market_id: pm_1
  name: Development and publishing of PC and console video games
  definition_status: discussed
  notes: 'The Commission concluded that the relevant product market is the overall market for
    development and publishing of PC and console video games. Mobile games were excluded (separate
    market, not assessed due to low combined share). The Commission left open whether this market
    should be further segmented by: (i) gaming platform (PC vs. console); (ii) game genres (action
    & adventure, shooter/battle royale, RPG, sports, racing, fighting, strategy); and (iii)
    game types (AAA vs. non-AAA). Market investigation results were inconclusive or mixed on
    all sub-segmentations. The Commission''s telemetry analysis indicated genre segmentation
    may be appropriate, but the outcome of the competitive assessment would be the same regardless.'
- market_id: pm_2
  name: Supply of gaming hardware (consoles)
  definition_status: left_open
  notes: Mentioned in a footnote as a market in which Microsoft is active but Activision Blizzard
    is not, so no horizontal overlap. Microsoft's shares remain below 30% at worldwide and EEA-wide
    level, so not vertically affected. The Commission explicitly states it does not assess this
    market in the present decision.
- market_id: pm_3
  name: PC and console video game distribution (overall market)
  definition_status: discussed
  notes: 'The Commission assessed multiple possible segmentations: (1) physical vs. digital
    — rejected, one overall market; (2) by platform — mobile distribution found separate from
    PC/console; PC vs. console left open; (3) by payment model — no segmentation warranted;
    (4) by type of access (download vs. streaming) — no segmentation warranted. The Commission
    concluded an overall market for PC and console game distribution, leaving open only the
    PC vs. console sub-segmentation. Mobile game distribution was found to be a separate (potential)
    market but will not be further assessed.'
- market_id: pm_4
  name: Distribution of mobile games (potential separate market)
  definition_status: defined
  notes: The Commission concluded that mobile game distribution is a separate market from PC
    and console game distribution, but chose not to further assess it as the Transaction would
    likely not significantly impede effective competition on this market.
- market_id: pm_5
  name: Distribution of PC and video console games
  definition_status: left_open
  notes: The Commission left open the geographic scope of this market (worldwide vs EEA-wide),
    noting the outcome of analysis is the same either way. The product market definition itself
    is referenced but not formally concluded in this chunk.
- market_id: pm_6
  name: Operating systems for PCs (PC OS)
  definition_status: defined
  notes: The Commission, following prior precedents (Google/Motorola Mobility, Google/Fitbit,
    Microsoft/Nuance), concluded from market investigation that there is a separate market for
    PC OS, distinct from OS for mobile devices and OS for servers. Activision Blizzard does
    not supply operating systems.
- market_id: pm_7
  name: Operating systems for mobile devices
  definition_status: considered
  notes: Distinguished from PC OS by the Commission and market participants as a separate market.
    Activision Blizzard does not supply operating systems, so no overlap. Referenced as a comparator/boundary
    market in the PC OS analysis.
geographic_markets_considered:
- market_id: gm_1
  name: Geographic market for development and publishing of PC and console video games
  definition_status: left_open
  notes: The Commission concluded the market is at least EEA-wide, leaving open whether it is
    EEA-wide or worldwide, as the outcome of the analysis is the same regardless.
- market_id: gm_2
  name: Geographic market for PC and console video game distribution
  definition_status: left_open
  notes: The Commission found the geographic scope is at least EEA-wide and possibly worldwide,
    consistent with prior precedent in Microsoft/ZeniMax. The definition was left open between
    EEA-wide and worldwide. The geographic scope was confirmed to be the same for possible platform
    segmentations and physical vs. digital segmentations.
- market_id: gm_3
  name: Distribution of PC and video console games — worldwide or EEA-wide
  definition_status: left_open
  notes: The Commission explicitly left open whether the geographic scope of the market for
    distribution of PC and video console games is worldwide or EEA-wide, as the outcome of the
    analysis is the same either way.
theories_of_harm: []
