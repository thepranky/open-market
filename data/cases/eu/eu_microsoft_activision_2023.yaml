- passage_id: sp_3
  source_document_id: eu_microsoft_activision_decision
  page: '16'
  quote_snippet: The Notifying Party considers that the game publishing market may currently
    be segmented between PC/console games and native mobile games. While the distinction between
    PC and console games has blurred, there remain differences between PC/console games and
    mobile games, for example in terms of development resources, technical differences and game
    characteristics (e.g., play session lengths and graphics). However, going forward, convergence
    between platforms is going to increase further. In any case, the Notifying Party considers
    that the precise product market definition can be left open for the purpose of assessing
    this Transaction.
  extraction_method: pdf_extracted
  review_status: unreviewed
