  source_document_id: eu_microsoft_activision_decision
  page: '25'
  quote_snippet: 'In Microsoft/ZeniMax83, the Commission considered whether the market for video
    game distribution should be segmented according to physical vs. digital distribution. Further,
    in relation to digital distribution, the Commission considered whether segmentations were
    appropriate by: (i) gaming platforms (PC, console and mobile); (ii) payment model (upfront
    payment vs. subscription); and (iii) type of access to games (download vs. streaming). The
    Commission left open the product market definition as regards physical vs. digital distribution
    and a possible segmentation by gaming platforms, whereas it found that a segmentation by
    payment model and type of access was not warranted.'
