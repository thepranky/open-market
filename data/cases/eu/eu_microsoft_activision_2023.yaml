- passage_id: sp_14
  source_document_id: eu_microsoft_activision_decision
  page: '15'
  quote_snippet: Microsoft is also active in the market for the supply of gaming hardware. As
    Activision Blizzard is not active in this market, the Transaction does not result in a horizontal
    overlap. As for vertical relationships, Microsoft's market shares in the market for the
    supply of gaming hardware (even when considering only console hardware) remain below 30%
    at the worldwide and EEA-wide level. Therefore, the market for the supply of gaming consoles
    is not vertically affected. In any case, with regard to the vertical relationship with the
    development and publishing of console video games upstream, the relevant activity downstream
    is the distribution of video games, i.e. the sale of video games, which implies a prior
    sale of console gaming hardware with the sole purpose of allowing these games to be distributed
    and then played in that hardware.
  extraction_method: pdf_extracted
  review_status: unreviewed
