product_markets_considered:
- market_id: pm_1
  name: Automotive financing services
  definition_status: left_open
  notes: The Commission considered various plausible distinctions within this market but left
    the exact definition open as the transaction did not raise serious doubts under any plausible
    definition.
- market_id: pm_2
  name: Motor vehicle lending
  definition_status: left_open
  notes: Considered as a separate market within consumer credit for the purchase of motor vehicles.
    The distinction between captive and non-captive activities was also left open.
- market_id: pm_3
  name: Lending to SMEs
  definition_status: left_open
  notes: A segmentation of the corporate banking market based on customer group. The exact definition
    was left open, including a potential separate segment for lending to car dealerships.
- market_id: pm_4
  name: Lending to car dealerships
  definition_status: considered
  notes: Considered as a plausible narrower market within lending to SMEs. Market investigation
    results were not conclusive regarding a separate market identification, but the Commission
    analyzed it as the narrowest plausible market.
- market_id: pm_5
  name: Motor vehicle leasing services (overall)
  definition_status: left_open
  notes: The Commission left open the exact product market definition for motor vehicle leasing,
    but focused its assessment on plausible separate markets for operational and financial leasing,
    and standalone fleet management services.
- market_id: pm_6
  name: Operational leasing for motor vehicles
  definition_status: considered
  notes: Considered a separate product market from financial leasing. Includes leasing of the
    vehicle coupled with fleet management services. Segmentation by customer size (large corporate
    vs. SMEs) and for vehicles up to 3.5 tons was considered.
- market_id: pm_7
  name: Financial leasing for motor vehicles
  definition_status: considered
  notes: Considered a separate product market from operational leasing. The primary objective
    is the financing of the acquisition of a vehicle, leading to ownership by the lessee.
- market_id: pm_8
  name: Standalone fleet management services
  definition_status: left_open
  notes: The Commission considered whether a distinction should be drawn between 'funded' and
    'unfunded' fleet leasing, leaving the market definition open in past decisions. For this
    decision, it focuses on it as a plausible separate market.
- market_id: pm_9
  name: Savings accounts
  definition_status: defined
  notes: Identified as a separate market based on past practice, but not assessed further due
    to no affected markets arising from the transaction.
- market_id: pm_10
  name: Insurance distribution
  definition_status: left_open
  notes: Identified as separate from insurance provision, with potential segmentation between
    life/non-life and specific non-life products (motor vehicle insurance, extended warranties,
    maintenance contracts). Not assessed further as no affected markets arose.
- market_id: pm_11
  name: Manufacturing and supply of passenger cars
  definition_status: left_open
  notes: Considered separate from commercial vehicles, with various sub-segments for car types
    (mini, small, medium, large, executive, luxury, sport, SUVs, multipurpose, electric cars).
    The question of segmentation was left open.
- market_id: pm_12
  name: Manufacturing and supply of commercial vehicles
  definition_status: left_open
  notes: Considered separate from passenger cars, with potential segmentation into LCVs, medium
    trucks, and heavy trucks, and further sub-segmentation for LCVs. The question of segmentation
    was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Automotive financing services — national
  definition_status: considered
  notes: The geographic markets for automotive financing services (including motor vehicle lending
    and leasing services) have previously been considered national in scope.
- market_id: gm_2
  name: Motor vehicle lending — national
  definition_status: considered
  notes: The geographic markets for motor vehicle lending have previously been considered national
    in scope, and market investigation confirmed this.
- market_id: gm_3
  name: Lending to SMEs — national
  definition_status: considered
  notes: Past decisions considered this market national, and market investigation results confirmed
    this.
- market_id: gm_4
  name: Lending to car dealerships — national
  definition_status: considered
  notes: Though a narrow plausible market, its geographic scope is national, in line with the
    broader lending to SMEs market.
- market_id: gm_5
  name: Motor vehicle leasing services — national
  definition_status: left_open
  notes: The Commission found that the scope of leasing markets is at least national due to
    differences between Member States. Market investigation results suggested national scope,
    so the Commission assessed effects on national markets, but left the exact definition open.
- market_id: gm_6
  name: Operational leasing for motor vehicles — national
  definition_status: left_open
  notes: The Commission found that the scope of leasing markets is at least national due to
    differences between Member States. Market investigation results suggested national scope,
    so the Commission assessed effects on national markets, but left the exact definition open.
- market_id: gm_7
  name: Financial leasing for motor vehicles — national
  definition_status: left_open
  notes: The Commission found that the scope of leasing markets is at least national due to
    differences between Member States. Market investigation results suggested national scope,
    so the Commission assessed effects on national markets, but left the exact definition open.
- market_id: gm_8
  name: Standalone fleet management services — national
  definition_status: left_open
  notes: The geographic scope for standalone fleet management services is inferred to be national,
    aligned with other leasing markets. The overall geographic definition for leasing was left
    open.
- market_id: gm_9
  name: Savings accounts — national
  definition_status: defined
  notes: This market was identified as national in scope in past practice and the current market
    investigation did not suggest diverging from this practice.
- market_id: gm_10
  name: Insurance distribution — national
  definition_status: considered
  notes: The Commission acknowledged that insurance distribution channels may be national or
    wider, or even local (for Italy), but left the question open in prior decisions. The exact
    geographic scope was not conclusively defined for this case as no affected markets arose.
- market_id: gm_11
  name: Manufacturing and supply of passenger cars and commercial vehicles — EEA-wide or national
  definition_status: left_open
  notes: The Commission ultimately left open whether the geographic scope of these markets is
    EEA-wide or national. For LCVs, it considered national scope in previous decisions.
theories_of_harm: []
commitments: []
