  page: '24'
  quote_snippet: '(115) Finally, respondents point out that the FCA Bank Transaction will generally
    have no or very limited impact on the markets for motor vehicle lending in France and Portugal.
    One competitor explains that there would be no impact because: “the companies/brands involved
    already have a strong partnership with one of the financial institutions that act as captive
    in this deal”. Respondents’ feedback to the market investigation supports the Commission’s
    understanding that the Transaction is a mere reorganisation of activities and will not bring
    any acquisition of control by CACF over activities it did not already jointly control with
    Stellantis. The Transaction will only lead to a change from joint to sole control.99 Hence,
    the Commission considers that the FCA Bank Transaction will not raise any competition concerns
    in relation to motor vehicle lending, segment for non-captive activities, in France and
    Portugal.'
  extraction_method: pdf_extracted
