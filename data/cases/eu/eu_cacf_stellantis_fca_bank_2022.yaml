  quote_snippet: (47) In past decisions, the Commission considered whether a distinction should
    be drawn between ‘funded’ fleet leasing (operational leasing accompanied by fleet management
    services) and ‘unfunded’ fleet leasing (fleet management services provided on a standalone
    basis).41 Although the Commission left the market definition open, a previous Commission
    investigation suggested that the segmentation into funded and unfunded was not appropriate,
    because the main function of full fleet leasing and management services is the outsourcing
    of the management of the vehicle fleet to a leasing company which may or may not be backed
    by an operational lease component; and both funded and unfunded vehicle leasing can be offered
    by the same suppliers.42
