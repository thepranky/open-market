  quote_snippet: (42) In past cases, the Commission has considered that financial leasing and
    operational leasing constitute separate product markets, as leasing agreements for financial
    leases are concluded with the main purpose of financing vehicles to enable a customer to
    ultimately purchase a vehicle and do not generally involve any of the additional services
    which are usually included in an operational leasing contract.36 However, in the Daimler/BMW/Car
    Sharing JV decision, in light of the supply-side substitutability in that specific case,
    the Commission conducted its assessment on the basis of an overall leasing market combining
    operational and financial leasing.37
