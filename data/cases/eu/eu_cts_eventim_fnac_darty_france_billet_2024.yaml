source_documents:
- doc_id: eu_cts_eventim_fnac_darty_france_billet_2024_decision
  title: CTS EVENTIM / FNAC DARTY / FRANCE BILLET — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.11279
  pdf_url: http://publications.europa.eu/resource/cellar/80a91131-1625-11f0-b1a3-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Overall market for the distribution of tickets
  definition_status: left_open
  notes: The Commission ultimately left open the precise scope of the overall market for the
    distribution of tickets but considered it for assessment purposes, comprising both direct
    and indirect distribution.
- market_id: pm_2
  name: Direct distribution of tickets (segmented by event categories, services provided, or
    IT solution used)
  definition_status: segmented
  notes: The Commission assessed potential segmentations within direct distribution by categories
    of events (sporting events, museums/exhibitions, shows/concerts), services provided (software,
    access control), and IT solution used (IT ticketing management software or self-ticketing),
    but ultimately left the overall market definition open.
- market_id: pm_3
  name: Indirect distribution of tickets (segmented by distribution channel, category of event,
    or nature of services)
  definition_status: segmented
  notes: The Commission assessed potential segmentations within indirect distribution by distribution
    channel (online vs offline), category of event (music/concert, theatre/comedy, etc.), and
    nature of services offered, but ultimately left the overall market definition open.
- market_id: pm_4
  name: Supply of IT ticketing management services enabling direct distribution
  definition_status: left_open
  notes: The Notifying Parties proposed this as a separate market. The Commission considered
    it within the broader 'distribution of tickets' market, particularly as a solution enabling
    direct distribution, but did not definitively define it as a separate market. Market investigation
    respondents had mixed views on whether solutions differ by event type, but indicated IT
    ticketing management software and self-ticketing could be separate.
- market_id: pm_5
  name: Overall market for the production and organisation of events (including promotion activities)
  definition_status: left_open
  notes: The Commission considered an overall market including promotion activities for assessment
    purposes, while also assessing two distinct segments (production/organisation excluding
    promotion, and promotion). The exact scope was ultimately left open.
- market_id: pm_6
  name: Production and organisation of events (excluding promotion activities)
  definition_status: segmented
  notes: Considered as a distinct segment within the broader market for the production and organisation
    of events. The exact scope was ultimately left open as part of the overall market.
- market_id: pm_7
  name: Promotion of events
  definition_status: segmented
  notes: Considered as a distinct segment within the broader market for the production and organisation
    of events. The exact scope was ultimately left open as part of the overall market.
geographic_markets_considered:
- market_id: gm_1
  name: Overall market for the distribution of tickets — national (France affected)
  definition_status: considered
  notes: The Commission decided to assess this market at a national level, primarily for France,
    supported by market investigation results and precedent.
- market_id: gm_2
  name: Direct distribution of tickets (segmented by event categories, services provided, or
    IT solution used) — national (France affected)
  definition_status: considered
  notes: The geographic scope for potential segmentations within direct distribution was also
    considered national, aligned with the overall ticketing market.
- market_id: gm_3
  name: Indirect distribution of tickets (segmented by distribution channel, category of event,
    or nature of services) — national (France affected)
  definition_status: considered
  notes: The geographic scope for potential segmentations within indirect distribution was also
    considered national, aligned with the overall ticketing market.
- market_id: gm_4
  name: Supply of IT ticketing management services enabling direct distribution — national (France
    affected)
  definition_status: considered
  notes: The geographic scope for IT ticketing management services enabling direct distribution
    was considered national, aligned with the overall ticketing market, despite mixed market
    investigation results.
- market_id: gm_5
  name: Overall market for the production and organisation of events (including promotion activities)
    — national, larger than national, or EEA-wide
  definition_status: left_open
  notes: The Commission explicitly left open the geographic scope, considering national, larger
    than national (e.g., linguistic borders), or EEA-wide, due to mixed market investigation
    results and variation by event type.
theories_of_harm: []
commitments: []
