- passage_id: sp_28
  source_document_id: eu_cts_eventim_fnac_darty_france_billet_2024_decision
  page: '13'
  quote_snippet: As regards IT ticketing management services specifically, the Notifying Parties
    stress the importance of national regulations specific to France which affect the design
    and functionalities of the software for IT ticketing management services. As a result, software
    underlying IT ticketing management services used in other countries cannot be automatically
    used in France. Furthermore, customers sourcing IT ticketing management services regularly
    need IT support which requires a national presence of the supplier, and the events for which
    tickets are distributed are national.
  extraction_method: pdf_extracted
