- passage_id: sp_12
  source_document_id: eu_cts_eventim_fnac_darty_france_billet_2024_decision
  page: '34'
  quote_snippet: As a preliminary remark, the Notifying Parties consider that the market for
    IT ticketing management solutions enabling direct distribution is upstream from the market
    for the production and organisation of events as IT ticketing management solutions are an
    input to the producers and organisers of events. In contrast, the Notifying Parties submit
    that the market for indirect distribution (and its potential segments) are downstream from
    the market for the production and organisation of events. For the reasons set out in paragraph
    (147), the Commission considers both potential markets as well as a potential overall market
    for direct and indirect distribution to be downstream from the market for the production
    and organisation of events.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
