  page: '11'
  quote_snippet: In relation to a potential distinction between direct and indirect distribution
    of tickets, a small majority of respondents to the market investigation expressing a view
    indicate that these should not constitute separate markets. Respondents cite complementarity
    of the two distribution channels as a reason for an overall market. A minority of respondents
    that expressed a view refer to differences between clients, needs, services, competitors
    and fiscal conditions as reasons justifying a distinction between the two.
