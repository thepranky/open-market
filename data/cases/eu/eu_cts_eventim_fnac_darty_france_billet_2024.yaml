- passage_id: sp_1
  source_document_id: eu_cts_eventim_fnac_darty_france_billet_2024_decision
  page: '12'
  quote_snippet: In light of the above, including the contradictory views expressed by market
    participants described in the previous paragraph, and for the purposes of this decision,
    the Commission considers that the exact product market definition with regard to the distribution
    of tickets can be left open, as the Transaction does not raise serious doubts as to its
    compatibility with the internal market under any plausible product market definition. The
    Commission will conduct its assessment considering the ticketing market from the perspective
    of companies sourcing ticketing services, whereby the overall ticketing market (comprising
    both direct and indirect distribution) covers the solutions required to enable direct or
    indirect distribution respectively.
  extraction_method: pdf_extracted
