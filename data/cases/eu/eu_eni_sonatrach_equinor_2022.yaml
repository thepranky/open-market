  quote_snippet: The Commission will therefore conduct the assessment of the Transaction considering
    a market for the downstream wholesale supply of natural gas, without distinguishing further
    between (i) natural gas in gaseous form and natural gas that originated from LNG, and (ii)
    between bilateral, over the counter gas supply contracts with delivery point at the PSV
    and transactions on the regulated exchange managed by GME.
