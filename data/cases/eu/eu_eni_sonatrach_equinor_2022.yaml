product_markets_considered:
- market_id: pm_1
  name: Exploration of crude oil and natural gas
  definition_status: considered
  notes: The Commission considered this market without distinguishing between crude oil and
    natural gas. Although the parties are active, their combined market share is below [0-5]%,
    so it was not considered an affected market and was not discussed further in the decision
    for competitive assessment purposes.
- market_id: pm_2
  name: Development, production and upstream wholesale supply of natural gas
  definition_status: considered
  notes: The Commission generally considers a separate market for this activity. The question
    of whether this market should encompass both natural gas in gaseous form and LNG was left
    open, but for the purpose of the assessment, the Commission focused on production and upstream
    wholesale supply of natural gas in gaseous form only, as the In Salah JV is not active in
    LNG and other parties' supplies to Italy are primarily gaseous.
- market_id: pm_3
  name: Downstream wholesale supply of natural gas
  definition_status: considered
  notes: The Commission previously found this to be a distinct product market. The question
    of including gas trading on hubs was left open. The market investigation clarified that
    distinguishing between gas originating from LNG or gaseous form is not relevant for downstream
    wholesale supply. The question of including bilateral transactions and regulated exchange
    trading was left open, but for its assessment, the Commission did not distinguish between
    these categories.
- market_id: pm_4
  name: Gas import infrastructure
  definition_status: considered
  notes: The Commission considered whether to sub-segment this market between regasification
    services for LNG and international pipelines, ultimately leaving the question open in previous
    decisions. For this decision, the Commission adopted the narrowest potential market definition,
    considering the Transmediterranean pipeline as a natural monopoly for the import of Algerian
    gas into Italy.
geographic_markets_considered:
- market_id: gm_1
  name: Exploration of crude oil and natural gas — worldwide
  definition_status: considered
  notes: In line with previous decisions, the Commission considered the market for the exploration
    of crude oil and natural gas to be worldwide in scope.
- market_id: gm_2
  name: Development, production and upstream wholesale supply of natural gas — into Italy
  definition_status: considered
  notes: The Commission has previously found this market to potentially comprise the EEA or
    be narrower. The market investigation indicated a narrower scope due to transport infrastructure
    dependencies. Given the activities of the parties, the Commission focused its analysis on
    a market comprising upstream wholesale supplies of natural gas in gaseous form into Italy,
    including exports from Algeria, Azerbaijan, Libya, and Russia.
- market_id: gm_3
  name: Downstream wholesale supply of natural gas — national (Italy affected)
  definition_status: considered
  notes: The Commission has generally defined this geographic market as at least national in
    scope. While the Notifying Party suggested a wider-than-national scope, the market investigation
    results were not conclusive. The Commission left the exact scope open but conducted its
    assessment based on a national market in Italy as the narrowest potential scope.
- market_id: gm_4
  name: Gas import infrastructure — national (Italy affected) (Transmediterranean pipeline)
  definition_status: considered
  notes: In recent decisions, this market was considered at least national in scope, focusing
    on infrastructures connected to the Italian transmission grid. For this decision, the Commission
    adopted the narrowest potential market definition, treating the Transmediterranean pipeline
    as a natural monopoly for the import of Algerian gas into Italy.
