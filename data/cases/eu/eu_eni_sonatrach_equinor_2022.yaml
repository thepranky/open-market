- passage_id: sp_5
  source_document_id: eu_eni_sonatrach_equinor_2022_decision
  page: '8'
  quote_snippet: As the In Salah JV is not active in the supply of LNG, and the supplies of
    Eni, Sonatrach and Equinor into Italy (where, as will be explained below, the Commission
    focuses its analysis) are primarily in gaseous form, the Commission will analyse the effects
    of the Transaction under the most conservative approach, focusing its assessment on production
    and upstream wholesale supply of natural gas in gaseous form only.
  extraction_method: pdf_extracted
