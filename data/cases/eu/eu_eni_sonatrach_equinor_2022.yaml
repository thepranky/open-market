- passage_id: sp_3
  source_document_id: eu_eni_sonatrach_equinor_2022_decision
  page: '6'
  quote_snippet: In its decisional practice, the Commission has generally considered a separate
    market for the development, production and upstream wholesale supply of natural gas where
    large upstream producers and exporters tend to sell large volumes of gas to downstream wholesalers/importers.13
    The Commission has also considered whether this market should encompass the upstream wholesale
    supply of liquefied natural gas (“LNG”), but ultimately left this question open.14
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_2
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_4
  source_document_id: eu_eni_sonatrach_equinor_2022_decision
  page: '7'
  quote_snippet: In any case, the question of whether the market for the development, production
    and upstream wholesale supply of natural gas should encompass both natural gas in gaseous
    form and LNG can be left open, as the Transaction does not raise serious doubts as to its
    compatibility with the internal market, irrespective of the precise market delineation.
    The Commission’s assessment does not change depending on whether LNG is considered part
    of the market, as the Parties’ market shares do not differ materially between the two alternative
    market delineations.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
