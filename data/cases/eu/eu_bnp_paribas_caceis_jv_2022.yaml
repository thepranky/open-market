  page: '15'
  quote_snippet: In previous decisions, the Commission took the view that the geographic scope
    of the market for software was at least EEA-wide. In relation to middleware in Oracle /
    Sun Microsystems and in DELL / EMC, the Commission considered the relevant geographic market
    for the overall middleware market and sub-segments thereof to be worldwide. However, the
    Commission has also noted in the past that national regulations may affect the geographic
    scope of the software market, as there are geographic variations in the nature of each end
    application the software caters for.
