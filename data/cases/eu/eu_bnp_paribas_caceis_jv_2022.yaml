product_markets_considered:
- market_id: pm_1
  name: Provision of Corporate Trust Services (CTS)
  definition_status: left_open
  notes: The Commission left the exact scope of the overall product market for CTS open, while
    conducting its competitive assessment on specific plausible segments.
- market_id: pm_2
  name: CTS for indirect employee shareholding
  definition_status: defined
  notes: The Commission considered CTS for indirect employee shareholding to differ from other
    CTS, thus forming a separate market. However, the JV will not be active in this market,
    so it was not an affected market and was not further considered in the decision.
- market_id: pm_3
  name: CTS to listed companies
  definition_status: defined
  notes: The Commission considered CTS to listed companies to form a separate market from CTS
    to unlisted companies.
- market_id: pm_4
  name: CTS to unlisted companies
  definition_status: defined
  notes: The Commission considered CTS to unlisted companies to form a separate market from
    CTS to listed companies, but this market was not affected by the transaction.
- market_id: pm_5
  name: CTS for investor shareholding to listed companies
  definition_status: considered
  notes: The Commission found the market investigation results inconclusive on whether CTS for
    investor shareholding and CTS for direct employee shareholding form part of the same or
    separate markets. However, for the purpose of the decision, the competitive assessment was
    conducted for this plausible product market definition.
- market_id: pm_6
  name: CTS for direct employee shareholding to listed companies
  definition_status: considered
  notes: The Commission found the market investigation results inconclusive on whether CTS for
    investor shareholding and CTS for direct employee shareholding form part of the same or
    separate markets. However, for the purpose of the decision, the competitive assessment was
    conducted for this plausible product market definition.
- market_id: pm_7
  name: Software (middleware products for banking and financial sector)
  definition_status: left_open
  notes: The Commission did not conclude on the precise product market definition for software,
    including middleware products like RegistrAccess, VotAccess, and GIE software, as the transaction
    did not raise serious doubts under any plausible definition.
- market_id: pm_8
  name: Banking services (corporate and investment banking)
  definition_status: left_open
  notes: The Commission did not conclude on the precise product market definition for banking
    services, particularly corporate and investment banking, as the transaction did not raise
    serious doubts under any plausible definition.
geographic_markets_considered:
- market_id: gm_1
  name: Corporate Trust Services — national (France affected)
  definition_status: defined
  notes: The Commission concluded that the market for CTS and its possible further segments
    is national in scope, particularly in France, due to national regulatory environments, linguistic
    preferences, and market barriers.
- market_id: gm_2
  name: Software — national / EEA-wide / worldwide (plausible)
  definition_status: left_open
  notes: The Commission noted that national regulations might affect the geographic scope of
    the software market, and while acknowledging this, left the precise geographic market definition
    open as no serious doubts arose under any plausible definition (national, EEA-wide, or worldwide).
- market_id: gm_3
  name: Banking services (corporate and investment banking) — national / EEA-wide / worldwide
    (plausible)
  definition_status: left_open
  notes: The Commission, consistent with previous practice, left open the exact geographic market
    definition for banking services, including corporate and investment banking, as no serious
    doubts arose under any plausible definition (national, EEA-wide, or worldwide).
theories_of_harm: []
commitments: []
