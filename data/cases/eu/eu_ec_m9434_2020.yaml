  source_document_id: eu_ec_m9434_2020_decision
  page: '31'
  quote_snippet: In conclusion, the market investigation appears to confirm that ARINC and SITA
    are considered to offer alternative datalink network services. However, the question of
    whether ARINC and SITA constitute separate markets or belong to a single product market
    can be left open as the Transaction does not raise serious doubts regarding its compatibility
    with the internal market under any of those segmentations.
