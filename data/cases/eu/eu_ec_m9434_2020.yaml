product_markets_considered:
- market_id: pm_1
  name: Military GNSS receivers
  definition_status: defined
  notes: The Commission defined a separate product market for military GPS receivers. It also
    considered a possible differentiation by type of application/platform but did not definitively
    resolve it for the purpose of the decision. The relationship between Galileo PRS receivers
    and GPS receivers was not conclusively determined, but they were perceived as complementary
    rather than substitutes.
- market_id: pm_2
  name: Military airborne radios
  definition_status: defined
  notes: The Commission defined a separate product market for military airborne radios, distinct
    from military ground radios, military data links, and SATCOMs. It considered a possible
    differentiation by frequency band (HF, VHF/UHF) but concluded no further segmentation was
    necessary for the decision.
- market_id: pm_3
  name: Military ground radios
  definition_status: defined
  notes: The Commission defined a separate product market for military ground radios, distinct
    from military airborne radios, military data links, and SATCOMs. The market investigation
    for fixed and deployable ground radios was not conclusive, and no further segmentation was
    deemed necessary. Raytheon indicated its intention to exit this segment.
- market_id: pm_4
  name: Military data links
  definition_status: defined
  notes: The Commission defined a separate product market for military data links, distinct
    from military radios. The market investigation on segmentation between SA and ISR data links
    was not conclusive, and no further segmentation was deemed necessary.
- market_id: pm_5
  name: SATCOMs (military)
  definition_status: defined
  notes: The Commission defined a separate product market for SATCOMs, distinct from other military
    airborne communications systems. It noted demand-side segmentation between narrowband, wideband,
    and protected SATCOMs but found supply-side analysis inconclusive, concluding no further
    segmentation was necessary for the decision.
- market_id: pm_6
  name: EO/IR sensors (military)
  definition_status: left_open
  notes: The market investigation confirmed the Notifying Party’s view that segmentation by
    range (short-, mid-, and long-range) reflects market conditions and implies distinct product
    markets. However, it also suggested an alternative segmentation by mission type (surveillance,
    reconnaissance, targeting). The exact market definition was left open as no competition
    concerns arose regardless of the definition.
- market_id: pm_7
  name: Bombs (military)
  definition_status: left_open
  notes: The market investigation confirmed that bombs, projectiles, and missiles constitute
    distinct product markets due to limited demand-side and supply-side substitutability. However,
    the exact product market definition for PGMs was left open as no competition concerns arose.
- market_id: pm_8
  name: Projectiles (military)
  definition_status: left_open
  notes: The market investigation confirmed that bombs, projectiles, and missiles constitute
    distinct product markets due to limited demand-side and supply-side substitutability. However,
    the exact product market definition for PGMs was left open as no competition concerns arose.
- market_id: pm_9
  name: Missiles (military)
  definition_status: left_open
  notes: The market investigation confirmed that bombs, projectiles, and missiles constitute
    distinct product markets. It also suggested a further segmentation for missiles into strategic
    and tactical types due to limited substitutability. However, the exact product market definition
    for PGMs was left open as no competition concerns arose.
- market_id: pm_10
  name: PGM actuation systems
  definition_status: left_open
  notes: The Commission had previously considered guided missile actuation systems as a separate
    product market. The market investigation confirmed that segmentation distinguishing Thrust
    Vector-based Actuation (TVA) and fin-based actuation systems for PGMs reflects market conditions
    and that they constitute distinct markets. However, the exact product market definition
    was ultimately left open as no competition concerns arose.
- market_id: pm_11
  name: IMUs for PGMs
  definition_status: left_open
  notes: The market investigation indicated that a segmentation distinguishing lower end tactical
    IMUs from navigation IMUs for PGMs reflects market conditions, confirming they constitute
    distinct product markets. Consumer grade IMUs were not considered for PGMs. The exact product
    market definition was ultimately left open as no competition concerns arose.
- market_id: pm_12
  name: Datalink network services (ARINC/SITA)
  definition_status: left_open
  notes: Market investigation indicated that ARINC and SITA are considered alternative datalink
    network services. However, the Commission left open the question of whether they constitute
    separate markets or a single product market, as the transaction did not raise serious doubts
    under any segmentation.
