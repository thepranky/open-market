  quote_snippet: In conclusion, the market investigation appears to confirm the Notifying Party’s
    claim that long-, mid-, and short-range EO/IR sensors constitute three distinct product
    markets due to limited demand-side and supply-side substitutability. However, the market
    investigation also suggests that an alternative way of defining product markets for EO/IR
    sensors would be based on their final use, i.e. that the markets for EO/IR sensors for surveillance,
    for reconnaissance, and for targeting would constitute three distinct product markets.
