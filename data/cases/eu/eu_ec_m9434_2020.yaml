  quote_snippet: From a demand side perspective, according to the results of the market investigation,
    most market participants consider that civilian and military GNSS receivers constitute separate
    product markets due to limited substitutability for customers in terms of, e.g., product
    characteristics, applications and prices.18 One respondent to the market investigation indicated
    that ‘[m]ilitary receivers utilize a different signal and have technical features that ordinary,
    civilian receivers do not include, such as enhanced security to prevent disruption of signals’.
