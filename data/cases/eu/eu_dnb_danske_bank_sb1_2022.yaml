  quote_snippet: Considering all elements above, namely the explanations of the Notifying Parties,
    the feedback from other market participants on demand-side and supply-side substitutability,
    as well as the Commission’s past practice, the Commission considers that payment services
    segmented by payment situations, i.e., P2P transfers, payments in a POS environment, e-Commerce
    as well as invoice services, might each form separate product markets, which can each be
    further sub-segmented, as detailed below.
