  page: '42'
  quote_snippet: However, market participants also point towards a broader regional dimension.
    For example, one market participant explained that “[g]enerally, fundamental regulatory
    changes have had an effect in the Nordics. The introduction of SEPA pushes the banking sector
    in the Nordics, as in the rest of the EU, to move from country-based payment infrastructures
    with proprietary country solutions and regulators, towards a common EU – or in the case
    of P27 a pan-Nordic – infrastructure based on common ISO20022 payment standards and common
    regulation”.
