- passage_id: sp_36
  source_document_id: eu_dnb_danske_bank_sb1_2022_decision
  page: '34'
  quote_snippet: In view of the above, the Commission finds that the relevant geographic scope
    of a market for e-Commerce checkout solutions is wider than national and either regional
    (i.e., the Nordics) or EEA-wide. For the purpose of this decision, the Commission will assess
    the narrower regional market, at the level of the Nordics (for the purposes of this Decision
    defined to include Denmark, Finland, Norway and Sweden), where the focus of the Proposed
    Transaction is. The exact geographic market definition can be left open since the Transaction
    does not give rise to serious doubts as to its compatibility with the internal market or
    the functioning of the EEA agreement under any plausible geographic market definition (i.e.,
    regional or EEA-wide).
  extraction_method: pdf_extracted
