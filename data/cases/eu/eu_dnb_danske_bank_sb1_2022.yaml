product_markets_considered:
- market_id: pm_1
  name: P2P payments via mobile wallets
  definition_status: defined
  notes: The Commission concluded that cash payments and online banking (via browser or banking
    apps) are not part of the same product market as payments via mobile wallets in P2P payment
    situations, due to significant differences in convenience for end-users.
- market_id: pm_2
  name: POS payments overall
  definition_status: left_open
  notes: The Commission considered potential segments for (i) POS payments excluding cash; and
    (ii) POS payments excluding cash and cards (i.e., payments via mobile wallets). The question
    of whether cash payments or card payments are part of the same product market as payments
    via mobile wallets in POS payment situations was left open.
- market_id: pm_3
  name: E-Commerce payments overall
  definition_status: left_open
  notes: The Commission considered potential segments for (i) E-Commerce payments excluding
    other online payment methods, such as bank transfers, direct debit or BNPL (i.e., payments
    via mobile wallets); and (ii) E-Commerce payments excluding other online card payment methods.
    The question of whether card payments or other online payments are part of the same product
    market as mobile wallet payments in an e-Commerce environment was left open.
- market_id: pm_4
  name: Invoice services to end-users overall
  definition_status: left_open
  notes: The Commission considered a plausible separate market for invoice services to end-users
    via mobile wallets (i.e., excluding other channels such as online banking, mobile banking
    apps or e-mail). The question of whether such a separate market exists or if the market
    was wider including other channels was left open.
- market_id: pm_5
  name: e-Commerce checkout solutions
  definition_status: left_open
  notes: The Commission found that a separate product market exists for e-Commerce checkout
    solutions, distinct from in-store (POS) payment services, but left the exact definition
    open, including whether direct integration of specific payment methods is a substitute.
- market_id: pm_6
  name: Retail banking
  definition_status: left_open
  notes: The Commission assessed a plausible market for retail banking, which includes all banking
    services to private individuals and very small enterprises, but left the exact product market
    definition open.
- market_id: pm_7
  name: Current accounts (within Retail banking)
  definition_status: left_open
  notes: The Commission considered a plausible narrower market for current accounts within retail
    banking, but left the exact product market definition open.
- market_id: pm_8
  name: Card issuing
  definition_status: left_open
  notes: The Commission assessed a plausible market for card issuing, distinct from merchant
    acquiring and card processing, but left the exact product market definition open, including
    potential narrower segments.
- market_id: pm_9
  name: Card issuing segments
  definition_status: left_open
  notes: 'The Commission considered plausible narrower segments for card issuing based on: (i)
    debit and credit cards, (ii) personal and corporate cards, (iii) national and international
    cards, (iv) selective and general cards and (v) universal and special purpose cards, but
    left the exact product market definition open.'
- market_id: pm_10
  name: Merchant acquiring
  definition_status: left_open
  notes: The Commission considered merchant acquiring to be a distinct product market, segmented
    into POS and e-Commerce merchant acquiring, with potential further segmentation by type
    of payment card schemes, payment card brands, type of payment card, and wholesale/retail
    merchant acquiring. However, the exact product market definition was left open for this
    case.
- market_id: pm_11
  name: Payment systems
  definition_status: left_open
  notes: The Commission assessed a separate product market for payment systems, upstream to
    the market for payment services, but left the exact product market definition open, including
    potential further segmentation by type of payments.
geographic_markets_considered:
- market_id: gm_1
  name: P2P payments via mobile wallets — national
  definition_status: defined
  notes: The Commission concluded that payment service markets for P2P payments, and especially
    mobile P2P payment services, are national in geographic scope.
- market_id: gm_2
  name: POS payments overall — national or EEA-wide
  definition_status: left_open
  notes: The Commission considered the geographic market for POS payments (and its plausible
    segments) as national or EEA-wide in scope, leaving the exact geographic market definition
    open.
- market_id: gm_3
  name: E-Commerce payments overall — national or EEA-wide
  definition_status: left_open
  notes: The Commission considered the geographic market for e-Commerce payments (and its plausible
    segments) as national or EEA-wide in geographic scope, leaving the exact geographic market
    definition open.
- market_id: gm_4
  name: Invoice services to end-users overall — national
  definition_status: defined
  notes: The Commission found that invoice payments, or invoicing services to end-users, are
    national in scope, supported by market investigation feedback.
- market_id: gm_5
  name: e-Commerce checkout solutions — regional (the Nordics) or EEA-wide
  definition_status: left_open
  notes: The Commission found the relevant geographic scope to be wider than national and either
    regional (the Nordics) or EEA-wide. For the purpose of this decision, the narrower regional
    market (Nordics) was assessed, but the exact geographic market definition was left open.
- market_id: gm_6
  name: Retail banking — national
  definition_status: defined
  notes: The Commission concluded that the geographic scope of the markets for retail banking
    and segments therein is national in scope, consistent with previous decisional practice
    and market investigation feedback.
- market_id: gm_7
  name: Card issuing — national
  definition_status: defined
  notes: The Commission concluded that the geographic scope of the markets for card issuing
    and segments therein is national in scope, consistent with previous decisional practice
    and market investigation feedback.
- market_id: gm_8
  name: Merchant acquiring — national or EEA-wide
  definition_status: left_open
  notes: The Commission left open whether merchant acquiring services (or potential segments
    thereof) are national or EEA-wide in scope, as it would not change the outcome of the assessment,
    despite mixed feedback from the market investigation.
- market_id: gm_9
  name: Payment systems — national or wider than national
  definition_status: left_open
  notes: The Commission's market investigation indicated that competitive conditions generally
    still take place at a national level for payment systems, but market participants also pointed
    towards a broader regional dimension. The exact geographic scope was left open.
