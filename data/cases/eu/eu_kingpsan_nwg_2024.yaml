    membranes - i.e., possibly EEA-wide, corresponding to the Nordic region or national in scope,
    but the exact geographic market definition of waterproofing membranes (including possible
    segmentations) can be left open, as the competitive assessment does not differ irrespective
    of the segmentation adopted, and serious doubts as to the Proposed Transaction’s compatibility
    with the internal market or the functioning of the EEA Agreement do not arise under any
