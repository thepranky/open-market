- passage_id: sp_2
  source_document_id: eu_kingpsan_nwg_2024_decision
  page: '5'
  quote_snippet: The Commission finds that the exact product market definition for waterproofing
    membranes and its plausible segmentations according to application type, technology or materials
    used (i.e., bitumen or synthetic; and, within bitumen, SBS or APP) can be left open, since
    the competitive assessment does not differ irrespective of the segmentation adopted, and
    serious doubts as to the Proposed Transaction’s compatibility with the internal market or
    the functioning of the EEA Agreement competition concerns do not arise under any plausible
    market definition.
  extraction_method: pdf_extracted
