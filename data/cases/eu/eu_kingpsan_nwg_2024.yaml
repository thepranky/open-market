  quote_snippet: 'The Commission will conduct its competitive assessment considering the narrowest
    plausible market definition (i.e., considering the narrowest plausible product segmentations
    for: (i) all non-liquid waterproofing membranes - i.e., the market for the manufacture and
    supply of (a) bitumen waterproofing membranes and (b) synthetic waterproofing membranes,
    as well as for (ii) all bitumen waterproofing membranes – i.e., the markets for the manufacture
