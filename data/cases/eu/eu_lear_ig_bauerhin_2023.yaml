product_markets_considered:
- market_id: pm_1
  name: Manufacturing and supply of seat thermal solutions
  definition_status: left_open
  notes: The Commission discussed, but ultimately left open, whether there is a market for the
    production and supply of seat thermal solutions. It considered it likely to be a distinct
    market that can be further segmented into seat thermal heat mats and seat ventilation systems.
    The exact definition was left open as the transaction did not raise serious doubts even
    under the narrowest plausible market definition.
- market_id: pm_2
  name: Manufacturing and supply of seat thermal heat mats
  definition_status: considered
  notes: The Commission considered this as a distinct market, as a sub-segment of seat thermal
    solutions, and used it as the narrowest plausible market definition for its competitive
    assessment.
- market_id: pm_3
  name: Manufacturing and supply of seat ventilation systems
  definition_status: considered
  notes: The Commission considered this as a distinct market, as a sub-segment of seat thermal
    solutions, and used it as the narrowest plausible market definition for its competitive
    assessment.
- market_id: pm_4
  name: Production and supply of sensors used in cars
  definition_status: left_open
  notes: The Commission discussed, but ultimately left open in past decisions, whether there
    is a separate product market for sensors used in cars. Market investigation respondents
    generally agreed it is a distinct market, which the Commission considered likely, with a
    sub-segment for pressure sensors used in car seats.
- market_id: pm_5
  name: Production and supply of pressure sensors used in car seats
  definition_status: considered
  notes: The Commission considered this as a distinct market, as a sub-segment of sensors used
    in cars, and used it as the narrowest plausible market definition for its competitive assessment.
- market_id: pm_6
  name: JIT assembly of complete car seats
  definition_status: left_open
  notes: The Commission discussed a potential market for JIT assembly of complete car seats,
    but ultimately left it open in past decisions. The Notifying Party and market investigation
    respondents support it as a separate market, and the Commission considered it likely to
    be distinct, but left the exact definition open for the purpose of the decision, assessing
    it under the narrowest plausible definition.
geographic_markets_considered:
- market_id: gm_1
  name: Seat thermal solutions — EEA-wide
  definition_status: considered
  notes: Past decisions considered markets for automotive components at least EEA-wide. The
    Notifying Party argued for a global market. The Commission considered the market to be at
    least EEA-wide and potentially broader (including neighbouring countries or other global
    regions), but analysed the impact based on the EEA as the narrowest plausible scope.
- market_id: gm_2
  name: Seat sensors — EEA-wide
  definition_status: considered
  notes: Past decisions on sensors suggested a likely global scope, leaving it open. The Notifying
    Party submitted it was global. The Commission considered the market at least EEA-wide and
    potentially global, but analysed the impact based on the EEA as the narrowest plausible
    scope.
- market_id: gm_3
  name: JIT assembly of complete car seats — EEA-wide
  definition_status: considered
  notes: Past decisions on JIT assembly of complete car seats considered the geographic scope
    to be at least EEA-wide, sometimes leaving it open. The Notifying Party and market investigation
    supported an at least EEA-wide scope. The Commission considered it at least EEA-wide and
    analysed the impact based on the EEA as the narrowest plausible scope.
