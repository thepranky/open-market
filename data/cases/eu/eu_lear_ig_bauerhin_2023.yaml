- passage_id: sp_3
  source_document_id: eu_lear_ig_bauerhin_2023_decision
  page: '6'
  quote_snippet: In any event, for the purposes of this Decision, it can be left open, first,
    whether the manufacturing and supply of seat thermal solutions is a separate market from
    (i) a wider market for the production and supply of seat components or (ii) a wider market
    that would also encompass HVAC systems, or, second, whether the market for the manufacturing
    and supply of seat thermal solutions should be sub-segmented, as the Transaction does not
    raise serious doubts as to its compatibility with the internal market or the functioning
    of the EEA Agreement even under the narrowest plausible market definition, i.e., the separate
    markets for seat thermal heat mats and seat ventilation systems.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
