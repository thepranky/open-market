  source_document_id: eu_msc_gip_iii_italo_2024_decision
  page: '5'
  quote_snippet: As regards the geographic market definition, the Commission has in the past
    considered (but ultimately left open) that the market for the provision of travel agency
    services is likely national in scope because of linguistic and cultural borders.14 More
    recently, the Commission assessed the effects of a transaction on the market for online
    travel intermediation at the EEA level, because online travel agents are generally active
    and their services are rather homogenous across the EEA and language and regulatory barriers
    to expand across Member States had reduced over the years.15
  extraction_method: pdf_extracted
