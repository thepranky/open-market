product_markets_considered:
- market_id: pm_1
  name: Passenger high-speed rail services
  definition_status: left_open
  notes: The Commission considered a separate market for passenger rail transport services,
    identifying relevant markets as point-to-point travel on routes (O&D pairs). It also considered
    whether to distinguish between high-speed and non-high-speed services, and between time-sensitive
    and non-time-sensitive passengers, but ultimately left the exact product market definition
    open.
- market_id: pm_2
  name: Provision of travel agency services
  definition_status: left_open
  notes: The Commission considered segmenting this market by type of customers (business vs.
    leisure travel) and by distribution channel (online vs. brick-and-mortar agencies). MSC
    Group is active in offline services.
- market_id: pm_3
  name: Provision of tour operator services
  definition_status: left_open
  notes: The Commission's prior practice distinguished between leisure and business travel within
    this market. MSC Group is active in leisure travel services by tour operators.
- market_id: pm_4
  name: Provision of passenger ferry services
  definition_status: considered
  notes: null
- market_id: pm_5
  name: Provision of passenger cruise services
  definition_status: considered
  notes: The market for oceanic cruises is considered distinct from coastal/riverine cruises
    and land-based holidays.
geographic_markets_considered:
- market_id: gm_1
  name: Passenger high-speed rail services — point-to-point routes (Italy affected)
  definition_status: left_open
  notes: Prior decisions identified relevant markets as point-to-point travel (O&D pair). Trenitalia
    also assesses on a national basis (Italy as a whole). The exact geographic market definition
    was left open.
- market_id: gm_2
  name: Provision of travel agency services — national (Italy affected)
  definition_status: left_open
  notes: Past decisions considered the market likely national due to linguistic and cultural
    borders. More recently, online travel intermediation was assessed at the EEA level. The
    Notifying Parties focus on Italy for MSC Group's offline activities.
- market_id: gm_3
  name: Provision of tour operator services — national (Italy affected)
  definition_status: left_open
  notes: Prior decisions considered these markets national in scope.
- market_id: gm_4
  name: Provision of passenger ferry services — point-to-point routes (Mediterranean Sea affected)
  definition_status: considered
  notes: The geographic market for passenger ferry services was considered on an O&D basis,
    consistent with prior decisions and unchallenged by the Notifying Parties. MSC Group is
    active in the Mediterranean Sea.
- market_id: gm_5
  name: Provision of passenger cruise services — national (Italy affected)
  definition_status: considered
  notes: The geographic market for passenger cruise services was considered national in scope,
    consistent with precedents that cited country-specific marketing channels and unchallenged
    by the Notifying Parties.
