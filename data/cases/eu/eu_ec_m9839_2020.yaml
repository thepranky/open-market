  source_document_id: eu_ec_m9839_2020_decision
  page: '3'
  quote_snippet: In previous decisions, the Commission has distinguished between the wholesale
    and retail distribution of vehicles.6 The Commission has concluded that the wholesale distribution
    of PCs and the wholesale distribution of LCVs are separate markets and that it was not necessary
    to conduct a further segmentation by car type (e.g., mini cars, small or medium cars, etc.),
    as manufacturers usually distribute different car types covering different market segments
    under the same distribution channel.
  extraction_method: pdf_extracted
