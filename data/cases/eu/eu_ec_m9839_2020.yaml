- passage_id: sp_18
  source_document_id: eu_ec_m9839_2020_decision
  page: '5'
  quote_snippet: The Notifying Party notes that the German Federal Cartel Office did not yet
    conclude on the exact geographic scope of retail distribution markets for (new or used)
    PCs and LCVs.11 Nonetheless, the Notifying Party considers the relevant retail market to
    be national in scope as customers increasingly use the internet to compare prices across
    the country (in particular with respect to used cars) and are willing to travel longer distances
    to buy a vehicle, exemplified by increasing interest in factory pick-up. In any event, the
    Notifying Party considers that the exact definition of the geographic scope of the market
    can be left open.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
