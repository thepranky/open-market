- passage_id: sp_26
  source_document_id: eu_ec_m9839_2020_decision
  page: '6'
  quote_snippet: The Notifying Party claims that the exact definition of the geographic scope
    of the market can be left open, although it considers the relevant market to be national
    in scope because customers can increasingly search for OE spare parts online across Germany
    and have them installed by independent repair shops. When zooming into the local level,
    the Notifying Party considers the metropolitan area of Hamburg to be the narrowest plausible
    geographic scope of the market for the purpose of this case. Customers that source OE spare
    parts together with car repair and maintenance services are typically willing to drive a
    certain distance (50-100 km) in order to get these services at a lower price.
  extraction_method: pdf_extracted
