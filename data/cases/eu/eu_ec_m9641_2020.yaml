product_markets_considered:
- market_id: pm_1
  name: Market for infrastructure for gas imports
  definition_status: left_open
  notes: The Commission considered the question of sub-segmenting this market into regasification
    services, interconnection points with international gas pipelines, and underground gas storage
    in previous decisions, ultimately leaving the exact market definition open. For the purpose
    of this decision, it was also left open whether pipelines and regasification terminals belong
    to the same relevant product market or separate relevant product markets.
- market_id: pm_2
  name: Gas storage
  definition_status: considered
  notes: The Commission considers gas storage as a separate market. Any possible segmentation
    (e.g., pore/cavern or H-gas/L-gas) is left open, as these distinctions were found to be
    irrelevant for Italy.
- market_id: pm_3
  name: Small-scale LNG services (SSLNG services)
  definition_status: left_open
  notes: The Notifying Parties submitted that no distinct market for SSLNG services exists yet,
    as projects are at a very preliminary stage. The market investigation was inconclusive on
    the substitutability with ordinary regasification services, noting it as a nascent and undeveloped
    market. The Commission left open whether these services belong to the same product market
    as regasification terminal services or a separate market.
- market_id: pm_4
  name: Gas transmission (via high-pressure systems)
  definition_status: defined
  notes: The Commission considers that gas networks for the transmission of gas are natural
    monopolies and each of them constitutes a distinct product market, consistent with previous
    decisional practice and confirmed by the market investigation.
geographic_markets_considered:
- market_id: gm_1
  name: Infrastructure for gas imports — national (Italy affected)
  definition_status: considered
  notes: Past decisions considered the market for infrastructure for gas imports, including
    LNG regasification terminals, to be national in scope but left it open. For this decision,
    based on market investigation, the Commission considers the geographic scope to be national.
- market_id: gm_2
  name: SSLNG services — national (Italy affected)
  definition_status: considered
  notes: The Notifying Parties suggested a broader-than-national dimension. Market investigation
    results were mixed. The Commission decided to base its assessment on the most narrow plausible
    market definition, i.e., national, consistent with the geographic dimension of the market
    for infrastructure for gas imports.
- market_id: gm_3
  name: Gas transmission (via high-pressure systems) — national (Italy affected)
  definition_status: considered
  notes: Consistent with its past decisional practice and confirmed by market investigation
    results, the Commission considers the market for gas transmission to be national in scope,
    limited to Italian territory.
- market_id: gm_4
  name: Gas storage — national (Italy affected)
  definition_status: considered
  notes: Based on market investigation results and consistent with decisional practice, the
    Commission considers the market for gas storage to be national in scope.
