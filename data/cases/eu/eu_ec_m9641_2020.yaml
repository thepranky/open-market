- passage_id: sp_8
  source_document_id: eu_ec_m9641_2020_decision
  page: '6'
  quote_snippet: With respect to the question whether the services of SSNLG, which are still
    in development in Italy, are substitutable with ordinary regasification services, the results
    of the market investigation are inconclusive. On the one hand, the majority of respondents
    to the market investigation have indicated that SSLNG services are distinct from the traditional
    regasification services offered by LNG terminals.14 One respondent submitted that SSLNG
    services are very different from conventional LNG services in terms of market, logistic
    costs, operations, etc.15 On the other hand, another respondent submitted that it is too
    early in the development of the SSLNG market in Italy to provide an opinion on the differences
    between SSLNG services and traditional services provided by regasification terminals.16
    In general, respondents to the market investigation confirmed that this is a nascent market,
    not yet sufficiently developed, and therefore it could be difficult to provide a final view.
  extraction_method: pdf_extracted
  review_status: unreviewed
