- passage_id: sp_12
  source_document_id: eu_ec_m9641_2020_decision
  page: '7'
  quote_snippet: The results of the market investigation indicate that the geographic scope
    of the market for infrastructure for gas imports in general, and for regasification terminals
    in particular, is national.23 The majority of the respondents to the market investigation
    also confirmed that the different regasification terminals in Italy are substitutable, irrespective
    of their different locations in Italy.24 Therefore, for the purpose of this decision, the
    Commission considers that the market for infrastructure for gas imports (possibly split
    between pipelines and regasification terminals) is national.
  extraction_method: pdf_extracted
