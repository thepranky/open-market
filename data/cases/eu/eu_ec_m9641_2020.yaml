  page: '6'
  quote_snippet: However, for the purpose of this decision, the Commission considers that it
    may be left open whether SSLNG services belong to the same product market as regasification
    terminals services (or, under a broader product market definition, to the overall market
    for infrastructure for gas imports) or are part of a separate product market, as the Transaction
    does not raise serious doubts as to its compatibility with the internal market, regardless
    of the market definition adopted.
