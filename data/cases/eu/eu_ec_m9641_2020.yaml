- passage_id: sp_7
  source_document_id: eu_ec_m9641_2020_decision
  page: '5'
  quote_snippet: The Notifying Parties submitted that all regasification terminal operators
    are considering to start offering Small-scale LNG services (SSLNG). Such services consist
    in processing LNG delivered by large cargoes in order to sell it as a fuel to LNG-fuelled
    trucks or ships. SSLNG can also be used to divide large LNG shipments in smaller LNG loads
    to deliver through smaller ships (for example to local networks in Sardinia). According
    to the Notifying Parties, all projects relating to SSLNG are still at a very preliminary
    stage and there is no market for SSLNG services yet, distinct from the market for infrastructure
    for gas imports or from the possible regasification service segment.
  extraction_method: pdf_extracted
  review_status: unreviewed
