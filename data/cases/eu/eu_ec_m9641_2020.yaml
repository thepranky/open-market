- passage_id: sp_13
  source_document_id: eu_ec_m9641_2020_decision
  page: '8'
  quote_snippet: With respect to SSLNG services, the Notifying Parties submit that a future
    potential separate market for SSLNG services provided by LNG terminals would most likely
    have a geographic dimension broader than national. The results of the market investigation
    are mixed, with some respondents pointing to a national dimension of the market and other
    respondents to a supra-national dimension, dependent on the specific location of the different
    SSLNG terminals.25 In any case, and consistently with the geographic dimension of the market
    for infrastructure for gas imports, the Commission will base its assessment on the most
    narrow plausible market definition, i.e. national.
  extraction_method: pdf_extracted
