product_markets_considered:
- market_id: pm_1
  name: Pharmaceutical wholesale distribution in Italy
  definition_status: defined
  notes: The Commission considered the market for pharmaceutical wholesale in Italy should encompass
    full-line wholesalers and exclude short-liners and direct deliveries. Further segmentations
    by product or customer group were deemed inappropriate.
- market_id: pm_2
  name: Pharmaceutical retail distribution in Italy
  definition_status: left_open
  notes: The Commission left open the exact product market definition for pharmaceutical retail
    market in Italy, as no competition concerns arose on any plausible product market. Past
    practice suggested a distinction between Rx and OTC products, and the Italian NCA made a
    distinction between pharmaceutical products and para-pharmaceutical products.
geographic_markets_considered:
- market_id: gm_1
  name: Pharmaceutical wholesale distribution — catchment areas (Italy affected)
  definition_status: left_open
  notes: The Commission considered national markets inappropriate for pharmaceutical wholesale
    in Italy, preferring narrower catchment areas. While market investigation and quantile methodology
    suggested 90 minutes, and the Notifying Party proposed 171 minutes, the exact delineation
    was left open for the purpose of the decision as no concerns arose under either plausible
    definition. Market shares were reported for both 90 and 171 minutes driving time.
- market_id: gm_2
  name: Pharmaceutical retail distribution — local (Italy affected)
  definition_status: left_open
  notes: The Commission noted that the pharmaceutical retail market presents national features
    on the supply-side but is local in nature on the demand-side, consistent with past practice
    and the Italian NCA's view of municipal territory. However, the exact geographic market
    definition and the relevance of municipal boundaries were left open as no competition concerns
    arose.
