- passage_id: sp_6
  source_document_id: eu_phoenix_mckesson_2022_decision
  page: '11'
  quote_snippet: (45) In light of the foregoing, the Commission considers that the geographic
    markets for pharmaceutical wholesale in Italy are narrower than national. The Commission
    also considers that the alternative geographic market definition proposed by the Notifying
    Party, i.e., 171 minutes driving time, is likely too broad. The exact delineation of the
    catchment areas can be left open for the purposes of the present decision, as pharmaceutical
    wholesale markets are in any event not wider than national, and the Transaction does not
    raise any competition concerns under any alternative plausible market definition. For the
    purposes of the competitive assessment, the Commission will indicate the market shares for
    the two catchment areas of 90 minutes and 171 minutes driving time.
  extraction_method: pdf_extracted
