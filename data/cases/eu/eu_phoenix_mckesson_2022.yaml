- passage_id: sp_4
  source_document_id: eu_phoenix_mckesson_2022_decision
  page: '9'
  quote_snippet: (39) In line with its past practice, the Commission considers that national
    markets would be inappropriate for the assessment of the Italian market. The market investigation
    results confirmed that all competitors deliver pharmacies located in urban areas at least
    twice a day and the majority of competitors indicated that the same applies to pharmacies
    located in rural areas.38 The vast majority of customers who responded to the market investigation
    indicated that the average number of deliveries is twice a day.39 Thus, although wholesalers
    compete in a given country through a network of depots, the ability to compete for given
    customers depends on the location of the depots. The market investigation results suggested
    that the shorter the distance between a depot and a customer, the greater the competitive
    advantage.40 Therefore, it would not appear feasible for wholesalers to provide this type
    of service twice a day at national level in the absence of a nation-wide network of local
    depots. For instance, McKesson has only two depots located in Northern Italy, and thus cannot
    provide short-term deliveries throughout the whole Italian territory.
