- passage_id: sp_5
  source_document_id: eu_phoenix_mckesson_2022_decision
  page: '10'
  quote_snippet: (44) While the catchment area of 171 minutes driving time, as proposed by the
    Notifying Party, would seem appropriate considering the analysis of the Parties’ driving
    time distribution in Italy, the market investigation results and the application of the
    quantile threshold methodology would point to a smaller catchment area. For these purposes,
    in its competitive assessment, the Commission will indicate the market shares for the two
    catchment areas of 90 minutes and 171 minutes driving time. The third potential alternative
    market definition, based on a catchment area within which 97-98% of turnover of a given
    depot is achieved, will not be further discussed in this decision, given that this catchment
    area would broadly coincide with the catchment area of 171 minutes proposed by the Notifying
    Party.
  extraction_method: pdf_extracted
