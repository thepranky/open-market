product_markets_considered:
- market_id: pm_1
  name: Container terminal services
  definition_status: left_open
  notes: The Commission considered a possible distinction between hinterland traffic and transhipment
    traffic but left the segmentation open for the purposes of this decision, as the Transaction
    would not raise serious doubts under any plausible alternative definition. It will assess
    the effects on 'container terminal services overall' as well as the segmented markets.
- market_id: pm_2
  name: Deep-sea container liner shipping services
  definition_status: left_open
  notes: The Commission also considered a plausible reefer container liner shipping sub-segment
    within deep-sea services.
- market_id: pm_3
  name: Short-sea container liner shipping services
  definition_status: left_open
  notes: The Commission left open the exact product market definition, including potential sub-segmentation
    for reefer containers and whether it should be considered alongside the transport of wheeled
    cargo. It will assess the effects on this market as well as the plausible narrower market
    for short-sea reefer container liner shipping services.
- market_id: pm_4
  name: Storage, leasing, repair and maintenance of containers
  definition_status: considered
  notes: Considered as a potential market, but not an affected market due to combined market
    share being below 10% nationally in Germany.
- market_id: pm_5
  name: Inland transportation services
  definition_status: left_open
  notes: The Commission left open whether rail, road, and water inland transport constitute
    separate product markets and the precise geographic definition, as the Transaction would
    not raise serious doubts.
geographic_markets_considered:
- market_id: gm_1
  name: Container terminal services — Northern Europe (for transhipment traffic)
  definition_status: left_open
  notes: The precise geographic market definition was left open. This range was considered as
    the broadest scope for transhipment traffic. Market investigation respondents did not deny
    the scope could be as wide as Northern Europe.
- market_id: gm_2
  name: Container terminal services — Hamburg-Le Havre range (for transhipment and hinterland
    traffic)
  definition_status: considered
  notes: The Commission explicitly stated it would assess the effects on this geographic market.
- market_id: gm_3
  name: Container terminal services — Hamburg-Antwerp range (for transhipment and hinterland
    traffic)
  definition_status: left_open
  notes: The precise geographic market definition was left open. This range was considered as
    a narrower possible scope for hinterland traffic. The majority of market investigation respondents
    indicated this range would be a suitable alternative for hinterland traffic.
- market_id: gm_4
  name: Container terminal services — national (Germany affected, for hinterland traffic)
  definition_status: left_open
  notes: The precise geographic market definition was left open. 'German ports only' was considered
    as the narrowest possible scope for hinterland traffic. The Commission explicitly stated
    it would assess the effects on this geographic market.
- market_id: gm_5
  name: Deep-sea container liner shipping services — legs of trade
  definition_status: defined
  notes: The geographic market is defined on the basis of individual legs of trades, in line
    with the Commission’s prior decisional practice.
- market_id: gm_6
  name: Short-sea container liner shipping services — single legs of trade (including country
    pairs)
  definition_status: left_open
  notes: The Commission left open the exact geographic market definition for short-sea container
    liner shipping, including whether it should be defined on the basis of single trades/corridors
    or single legs of trade. However, it will assess the effects on the narrowest plausible
    geographic market, single legs of trade (including country pairs).
- market_id: gm_7
  name: Inland transportation services — national or wider
  definition_status: left_open
  notes: The Commission left open the precise definition of the geographic market for inland
    transportation as the Transaction would not raise serious doubts.
theories_of_harm: []
commitments: []
