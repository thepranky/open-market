- passage_id: sp_14
  source_document_id: eu_hapaglloyd_eurogate_eurogate_container_terminal_wi_2022_decision
  page: '9'
  quote_snippet: The Commission has considered that for container terminal services in deep-sea
    ports, the relevant geographic market is in essence determined by the geographic area the
    container terminal generally serves (catchment area). For example, concerning terminals
    in Northern Europe and in Hamburg in particular, the Commission considered that the relevant
    geographical dimension is in its broadest scope Northern Europe (for transhipment traffic)
    and in its narrowest possible scope the catchment area of the ports in the range Hamburg
    – Antwerp (for hinterland traffic) or possibly even narrower, comprising the German ports
    only. However, the precise geographic market definition has been left open.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets: []
