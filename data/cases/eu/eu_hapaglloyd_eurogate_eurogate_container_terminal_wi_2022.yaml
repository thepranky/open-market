  source_document_id: eu_hapaglloyd_eurogate_eurogate_container_terminal_wi_2022_decision
  page: '10'
  quote_snippet: On whether the market for container terminal services should be segmented between
    hinterland and transhipment traffic, the majority of the respondents to the market investigation
    indicated that they agree with this segmentation. However, for the purposes of this decision,
    this question can be left open, as the Transaction would not raise serious doubts as to
    its compatibility with the internal market under any of the plausible alternative product
    market definitions.
  extraction_method: pdf_extracted
