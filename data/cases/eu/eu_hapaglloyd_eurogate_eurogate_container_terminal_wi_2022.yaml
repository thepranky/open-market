  page: '11'
  quote_snippet: A possible narrower product market for deep-sea container liner shipping services
    is that for the transport of refrigerated goods, which could be limited to refrigerated
    (reefer) containers only or could include transport in conventional bulk reefer vessels.
    In past cases, the Commission has looked separately at the plausible narrower markets for
    reefer containers and non-refrigerated containers only when the share of reefer containers
    in relation to all containerised cargo is 10% or more on both legs of a trade.
  extraction_method: pdf_extracted
