  page: '9'
  quote_snippet: In its prior decisional practice, the Commission has defined a separate market
    for container terminal services, and has considered a possible distinction between hinterland
    traffic (containers transported directly to/from a container vessel from/to the hinterland
    via barge, truck or train) and transhipment traffic (containers destined for the onward
    transportation to other ports or other vessels).
