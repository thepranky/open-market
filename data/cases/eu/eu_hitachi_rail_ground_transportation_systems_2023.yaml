  pdf_url: http://publications.europa.eu/resource/cellar/974638ed-ea0d-11ee-bf53-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Standalone interlocking projects
  definition_status: defined
  notes: The Commission concluded that standalone interlocking projects constitute a distinct
    product market, and there was no need to further segment this market by type of technology
    (non-electronic or computer-based).
- market_id: pm_2
  name: ATP wayside projects
  definition_status: defined
  notes: The Commission concluded that ATP wayside projects should be distinguished from OBU
    projects, and further segmented them into legacy vs. ETCS projects, and overlay vs. resignalling
    projects.
- market_id: pm_3
  name: OCS projects
  definition_status: defined
  notes: The Commission concluded that OCS projects form a distinct product market without further
    segmentation by type, level, or project size.
- market_id: pm_4
  name: CBTC systems for metros
  definition_status: considered
  notes: The Commission considered this product market for its assessment, confirming the relevance
    of previous decisions' definitions which distinguished metro and light rail projects, and
    within metros, conventional and CBTC systems.
- market_id: pm_5
  name: ATP OBU projects
  definition_status: left_open
  notes: The Commission distinguished ATP OBU projects from ATP wayside projects and segmented
    them between ETCS and legacy systems. However, a further segmentation between sales to rolling
    stock OEMs and sales to rolling stock operators was considered but ultimately left open
    as the transaction did not raise serious doubts under any plausible definition.
- market_id: pm_6
  name: Rolling stock
  definition_status: defined
  notes: 'The Commission maintained its previous distinctions: mainline trains (further segmented
    by intercity/regional, locomotive-hauled/self-propelled, and traction technology) and urban
    trains (further segmented by metros, trams, automated people movers).'
geographic_markets_considered:
- market_id: gm_1
  name: Standalone interlocking projects — national (France, Germany, Italy affected)
  definition_status: defined
  notes: The market for standalone interlocking projects was concluded to be national in scope
    due to adaptation requirements for national systems and signalling rules, and national features
    in demand-side considerations.
- market_id: gm_2
  name: Legacy ATP wayside overlay projects — national
  definition_status: defined
  notes: The Commission confirmed its previous findings that markets for legacy ATP wayside
    projects are national in scope.
- market_id: gm_3
  name: Legacy ATP wayside resignalling projects — national
  definition_status: defined
  notes: The Commission confirmed its previous findings that markets for legacy ATP wayside
    projects are national in scope.
- market_id: gm_4
  name: ETCS ATP wayside overlay projects — national
  definition_status: defined
  notes: Contrary to previous decisions, the market investigation in this case strongly suggested
    that ETCS ATP wayside overlay projects are national in scope due to national infrastructure
    managers, country-by-country bidding strategies, and specific national characteristics for
    operation and interfaces with OCS and legacy systems.
- market_id: gm_5
  name: ETCS ATP wayside resignalling projects — national
  definition_status: defined
  notes: Contrary to previous decisions, the market investigation in this case strongly suggested
    that ETCS ATP wayside resignalling projects are national in scope, noting that the standardisation
    trend has not fully materialised and strong national elements remain.
- market_id: gm_6
  name: OCS projects — national/EEA-wide
  definition_status: left_open
  notes: While market investigation results suggested national features (differences in homologation,
    prices, performance, interoperability), the exact geographic market definition was left
    open as the transaction did not raise serious doubts under any plausible definition.
- market_id: gm_7
  name: CBTC systems for metros — EEA-wide/wider
  definition_status: left_open
  notes: The market investigation confirmed that the CBTC systems market is likely at least
    EEA-wide, with some global features. However, it was left open whether the market is wider
    than EEA (including UK and Switzerland) as the transaction did not raise serious doubts.
- market_id: gm_8
  name: ETCS OBU projects — EEA-wide/wider
  definition_status: left_open
  notes: Previous decisions considered ETCS OBU projects EEA-wide due to EU-wide standards and
    interoperability. Current market investigation also suggested EEA-wide scope. However, the
    exact geographic market definition was left open as the transaction did not raise serious
    doubts under any plausible definition.
- market_id: gm_9
  name: Legacy OBU projects — national
  definition_status: left_open
  notes: Previous decisions defined legacy OBU projects as national due to strong barriers to
    entry and non-standardized systems. Current market investigation confirmed national features.
    The exact geographic market definition was left open as the transaction did not raise serious
    doubts under any plausible definition.
- market_id: gm_10
  name: Mainline rolling stock — national/EEA-wide (including Switzerland)
  definition_status: considered
  notes: The Commission considered competitive assessment at both EEA-wide (including Switzerland)
    and national levels, as previous market investigations were inconclusive regarding the exact
    geographic scope.
- market_id: gm_11
  name: Urban rolling stock — EEA-wide
  definition_status: considered
  notes: Based on previous decisions, the Commission considered the market for urban rolling
    stock to be EEA in scope for its assessment.
