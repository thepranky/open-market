  quote_snippet: '(80) Within ATP wayside projects (both for legacy and ETCS projects), the
    Commission distinguished separate markets for: (a) Overlay projects: these projects relate
    to the separate procurement of ATP wayside systems as standalone subsystems (i.e. without
    interlockings) placed over a pre-existing interlocking infrastructure; (b) Resignalling
    projects: these projects relate to the joint procurement of ATP wayside systems and interlockings
    as part of a bundled project.'
