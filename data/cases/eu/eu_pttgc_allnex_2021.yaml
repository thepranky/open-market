- passage_id: sp_2
  source_document_id: eu_pttgc_allnex_2021_decision
  page: '7'
  quote_snippet: For the purposes of this Decision, it is not necessary to further explore a
    narrower product market by industrial application, as the focus of the competitive assessment
    is potential customer foreclosure and Allnex’s shares of demand are already minimal considering
    the current broader product markets downstream (see Table 4 to Table 6 below). Under such
    a potential narrower product market, for which the input products would be the same, the
    same arguments would apply and the possibility of customer foreclosure would be even more
    remote. The issue of a potential segmentation of coating resins by industrial application
    can therefore be left open.
  extraction_method: pdf_extracted
