  quote_snippet: The Commission has previously considered that the appropriate geographic market
    for coating resins is either EEA-wide or worldwide.8 In line with the Commission’s previous
    decisional practice, the Notifying Party considers that the appropriate geographic scope
    is likely worldwide and at least EEA-wide.9 The Commission’s market investigation did not
    give any grounds to depart from the Commission’s recent decisional practice, and for the
    purpose of the current decision, it can be left open whether the appropriate geographic
    scope is worldwide or EEA-wide, as the Transaction does not give rise to serious doubts
    under either geographic scope.
