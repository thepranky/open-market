product_markets_considered:
- market_id: pm_1
  name: Coating resins (segmented by delivery technology and chemistry)
  definition_status: defined
  notes: The Commission concluded that separate coating resins markets exist segmented by delivery
    technology and chemistry. The vertically affected product markets are radcure waterborne
    ultra-violet polyurethane dispersion ("UV PUD") and polyester powders. The segmentation
    by industrial application was left open.
- market_id: pm_2
  name: Crosslinkers (segmented by delivery technology and chemistry)
  definition_status: defined
  notes: The Commission concluded that separate crosslinkers markets exist segmented by delivery
    technology and chemistry. The only vertically affected market within crosslinkers is crosslinkers
    amino resins. Segmentation by industrial application was left open.
- market_id: pm_3
  name: Diisocyanates
  definition_status: defined
  notes: The Commission considered separate markets for Hexamethylene diisocyanate (HDI), Isophorone
    diisocyanate (IPDI), 4,4′-Dicyclohexylmethane diisocyanate (H12MDI), Toluene diisocyanate
    (TDI), Methylene diphenyl diisocyanate (MDI), and Monomeric MDI (mMDI). HDI derivatives
    also constitute a separate market from HDI. The affected markets are HDI and IPDI.
- market_id: pm_4
  name: Methyl methacrylate (MMA)
  definition_status: defined
  notes: The Commission considered MMA and MMA derivatives to constitute separate product markets.
    PTTGC does not sell MMA derivatives, and the assessment applied to the narrower market for
    MMA.
- market_id: pm_5
  name: Styrene monomer
  definition_status: defined
  notes: The Commission considered styrene monomer to be a separate relevant product market
    without further segmentation.
- market_id: pm_6
  name: Glycerol
  definition_status: considered
  notes: The Commission left open whether all polyhydric alcohols or glycerol constitutes a
    separate product market but performed its competitive assessment on the narrowest plausible
    basis, a separate market for glycerol.
- market_id: pm_7
  name: Purified terephthalic acid (PTA)
  definition_status: considered
  notes: The Commission left open whether the relevant market is PTA or a broader market including
    di-methyl terephthalate (DMT), but performed its competitive assessment on the narrowest
    plausible basis, a market for PTA, as PTTGC does not produce DMT.
- market_id: pm_8
  name: Mono-ethylene glycol (MEG)
  definition_status: considered
  notes: The Commission considered separate markets for MEG, DEG, and TEG, or a broader market
    of ethylene glycol, but performed its competitive assessment on the narrowest basis, separate
    markets for MEG and DEG.
- market_id: pm_9
  name: Di-ethylene glycol (DEG)
  definition_status: considered
  notes: The Commission considered separate markets for MEG, DEG, and TEG, or a broader market
    of ethylene glycol, but performed its competitive assessment on the narrowest basis, separate
    markets for MEG and DEG.
- market_id: pm_10
  name: Xylene
  definition_status: considered
  notes: The Commission left open whether xylene constitutes a separate market or is part of
    a broader market for gasoline additives, but performed its competitive assessment on the
    narrowest basis, xylene.
geographic_markets_considered:
- market_id: gm_1
  name: Coating resins — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission's previous decisional practice considered the geographic market for
    coating resins to be either EEA-wide or worldwide. For the purpose of this Decision, it
    was left open as the transaction does not give rise to serious doubts under either scope.
- market_id: gm_2
  name: Crosslinkers amino resins — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission previously considered the geographic market for crosslinkers amino resins
    to be either EEA-wide or worldwide. For the purpose of this decision, it was left open as
    the transaction does not give rise to serious doubts under either scope.
- market_id: gm_3
  name: Diisocyanates (HDI and IPDI) — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission previously considered the geographic market for HDI and IPDI to be either
    EEA-wide or worldwide. For the purpose of this decision, it was left open as the transaction
    does not give rise to serious doubts under either scope.
- market_id: gm_4
  name: Methyl methacrylate (MMA) — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission previously considered the geographic market for MMA to be either EEA-wide
    or worldwide. For the purpose of this decision, it was left open as the transaction does
    not give rise to serious doubts under either scope.
- market_id: gm_5
  name: Styrene monomer — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission previously considered the geographic market for styrene to be either
    EEA-wide or worldwide. For the purpose of this decision, it was left open as the transaction
    does not give rise to serious doubts under either scope.
- market_id: gm_6
  name: Glycerol — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission previously considered the geographic market for glycerol to be either
    EEA-wide or worldwide. For the purpose of this decision, it was left open as the transaction
    does not give rise to serious doubts under either scope.
- market_id: gm_7
  name: Purified terephthalic acid (PTA) — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission previously considered the geographic market for PTA to be either EEA-wide
    or worldwide. For the purpose of this decision, it was left open as the transaction does
    not give rise to serious doubts under either scope.
- market_id: gm_8
  name: Ethylene glycols (MEG and DEG) — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission previously considered the geographic market for ethylene glycols (including
    MEG and DEG) to be either EEA-wide or worldwide. For the purpose of this decision, it was
    left open as the transaction does not give rise to serious doubts under either scope.
- market_id: gm_9
  name: Xylene — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission previously considered the geographic market for xylene to be either
    EEA-wide or worldwide. For the purpose of this decision, it was left open as the transaction
    does not give rise to serious doubts under either scope.
