    market definition can be left open, as the Transaction does not give rise to serious doubts
    under any potential product market delineation. In order to perform its competitive assessment
    in the present case, based on the results of the market investigation, the Commission will
    consider the narrowest plausible market, i.e. the market for the supply of SMC.
