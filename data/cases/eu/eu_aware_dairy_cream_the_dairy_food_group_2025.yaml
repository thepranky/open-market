- passage_id: sp_3
  source_document_id: eu_aware_dairy_cream_the_dairy_food_group_2025_decision
  page: '3'
  quote_snippet: 'In previous cases, the Commission identified separate segments for bulk cream
    and non-bulk cream as they are supplied to different customer groups and are intended for
    different uses: while bulk cream is sold in tanker loads to butter makers or large food
    processors, non-bulk cream is sold in different types of containers (pallecons, pergals,
    polybottles or pots) to the catering trade or small food processors or multi-nationals.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-12'
