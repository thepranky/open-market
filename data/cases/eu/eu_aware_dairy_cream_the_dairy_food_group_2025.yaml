  page: '7'
  quote_snippet: 'For the purposes of assessing the Transaction under the narrowest plausible
    product market definition, the competitive assessment will be carried out for the following
    segmentation where the Parties’ activities overlap and give rise to affected markets: the
    supply of dairy spray cream (including both branded products and private or white label
    products) in the retail segment.'
