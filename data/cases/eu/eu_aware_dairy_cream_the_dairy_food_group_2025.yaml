  quote_snippet: The market investigation indicated that the market for the supply of bulk cream
    constitutes a distinct market from the supply of non-bulk cream. The majority of market
    participants that expressed an opinion confirmed that bulk cream and non-bulk cream are
    separate markets because of differences in customer groups, intended use and packaging.
