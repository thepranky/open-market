product_markets_considered:
- market_id: pm_1
  name: Supply of bulk cream
  definition_status: defined
  notes: The Commission considers that the supply of bulk cream and the supply of non-bulk cream
    constitute distinct markets.
- market_id: pm_2
  name: Supply of dairy spray cream (including both branded products and private or white label
    products) in the retail segment
  definition_status: considered
  notes: The exact product market definition for spray cream was left open, but the competitive
    assessment was carried out for the supply of dairy spray cream in the retail segment, including
    both branded and private label products, as the narrowest plausible market where overlaps
    give rise to affected markets. Segmentation analysis confirmed spray cream and liquid cream
    are separate markets, the market for spray cream should not be segmented between dairy and
    non-dairy, and the market for dairy spray cream should be segmented by distribution channel
    (retail vs OOH), but not by branded vs private label within retail.
- market_id: pm_3
  name: Supply of SMC
  definition_status: considered
  notes: The exact product market definition for SMC was left open, but for competitive assessment,
    the Commission considered the market for the supply of SMC as the narrowest plausible market,
    based on market investigation findings that SMC constitutes a distinct market despite some
    interchangeability with skimmed milk powder (SMP).
geographic_markets_considered:
- market_id: gm_1
  name: Supply of bulk cream — national (Netherlands affected)
  definition_status: considered
  notes: The precise geographic market definition for bulk cream was left open, but the competitive
    assessment was carried out at the narrowest plausible market, i.e., a national market limited
    to the Netherlands.
- market_id: gm_2
  name: Supply of dairy spray cream (retail) — regional (Belgium, the Netherlands and Germany
    affected)
  definition_status: considered
  notes: The precise geographic market definition for dairy spray cream was left open, but the
    competitive assessment was carried out at three plausible regional levels, including Belgium,
    the Netherlands and Germany.
- market_id: gm_3
  name: Supply of dairy spray cream (retail) — regional (Belgium, the Netherlands, Germany and
    France affected)
  definition_status: considered
  notes: The precise geographic market definition for dairy spray cream was left open, but the
    competitive assessment was carried out at three plausible regional levels, including Belgium,
    the Netherlands, Germany and France.
- market_id: gm_4
  name: Supply of dairy spray cream (retail) — EEA-wide
  definition_status: considered
  notes: The precise geographic market definition for dairy spray cream was left open, but the
    competitive assessment was carried out at three plausible regional levels, including the
    EEA-wide market.
- market_id: gm_5
  name: Supply of SMC — national (Belgium affected)
  definition_status: considered
  notes: The precise geographic market definition for SMC was left open, but the competitive
    assessment was carried out at the narrowest plausible market, i.e., a national market encompassing
    Belgium.
