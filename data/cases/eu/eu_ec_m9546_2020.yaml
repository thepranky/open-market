- passage_id: sp_4
  source_document_id: eu_ec_m9546_2020_decision
  page: '13'
  quote_snippet: (45) In light of the above and the results of the market investigation, the
    Commission finds the market for the provision of equipment services to be separate from
    the market from in-flight catering services. The question whether in-flight equipment services
    constitute a separate market can be left open, as the Transaction is unlikely to raise serious
    doubts as to its compatibility with the internal market under any plausible market definition.
    For the purpose of this decision, the Commission will assess the effects of the Transaction
    on a plausible narrower product market for in-flight equipment services. The Commission
    will also leave open the question whether the geographic market is EEA-wide or worldwide
    and will assess the effects of the Transaction under each of the two plausible geographic
    market definitions.
  extraction_method: pdf_extracted
