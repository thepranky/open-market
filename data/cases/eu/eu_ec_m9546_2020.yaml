  page: '11'
  quote_snippet: (33) In view of the above considerations and in line with its past decisional
    practice, the Commission concludes for the purpose of this decision that the relevant product
    market for in-flight catering services comprises the entire range of meals for all travel
    classes (economy/business/first class) for all types of flights (short-haul/long-haul) and
    that the question whether the market for in-flight catering services should be segmented
    by type of supplier can be left open. For the purpose of this decision, the Commission leaves
    open the question whether the relevant geographic market is limited to the airport’s catchment
    area or encompasses several neighbouring airports with respect to the following geographic
    areas that may comprise several airports (i) Frankfurt, Dusseldorf and Cologne-Bonn airports,
    (ii) Hamburg and Hannover airports, (iii) Berlin Tegel, Berlin Schönefeld and Leipzig airports,
    as this would not change the outcome of the competitive assessment.
