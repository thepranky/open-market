  page: '10'
  quote_snippet: (32) In view of the above considerations and in line with its previous decisional
    practice,55 the Commission considers that, for the purpose of this decision, the geographic
    market for the provision of in-flight catering services is either the airport’s catchment
    area or at most a geographic area encompassing several neighbouring airports, namely (i)
    Frankfurt, Dusseldorf and Cologne-Bonn airports, (ii) Hamburg and Hannover airports, (iii)
    Berlin Tegel, Berlin Schönefeld and Leipzig airports, where the Notifying Party argues that
    the geographic market is broader than the airport’s catchment area. Therefore, the Commission
    will assess the effects of the Transaction on the narrowest plausible geographic market
    definition (i.e. the airport’s immediate catchment area) and on the plausible broader geographic
    areas where the Notifying Party claims that the geographic market definition is broader
    than the airport’s catchment area.
