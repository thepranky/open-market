- passage_id: sp_3
  source_document_id: eu_ec_m9546_2020_decision
  page: '8'
  quote_snippet: (26) In view of the above considerations and in line with its decisional practice,
    the Commission concludes that the market for the provision of in-flight catering services
    comprises the entire range of meals for all travel classes (economy/business/first class)
    and for all types of flights (short-haul/long-haul). Furthermore, in view of the above considerations
    and in line with its decisional practice, the Commission considers that, for the purpose
    of this decision, the question whether in-flight catering services should be segmented by
    type of supplier (“traditional” and “non-traditional” suppliers) can be left open, as this
    would not change the outcome of the competitive assessment.
  extraction_method: pdf_extracted
  review_status: unreviewed
