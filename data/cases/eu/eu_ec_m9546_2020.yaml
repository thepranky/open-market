product_markets_considered:
- market_id: pm_1
  name: In-flight catering services
  definition_status: defined
  notes: The Commission concluded that the market for in-flight catering services comprises
    the entire range of meals for all travel classes (economy/business/first class) and for
    all types of flights (short-haul/long-haul). The question of segmentation by type of supplier
    ("traditional" and "non-traditional") was left open.
- market_id: pm_2
  name: In-flight equipment services
  definition_status: considered
  notes: The Commission considers equipment services a relevant separate market, not ancillary
    to in-flight catering. The question of segmentation by type of customers was left open,
    but the assessment would proceed on a plausible narrower market for in-flight equipment
    services.
- market_id: pm_3
  name: Lounge management services
  definition_status: left_open
  notes: The Commission left open whether there is a separate market for lounge management services
    or if they belong to the market for ground handling services.
- market_id: pm_4
  name: Ready-made food products to the commercial foodservice sector
  definition_status: considered
  notes: The Commission considered the relevant market to be the supply of ready-made food products
    to the commercial foodservice sector. The question of further subdivision by product type
    (frozen, chilled, fresh) was left open.
- market_id: pm_5
  name: Retail on-board services
  definition_status: left_open
  notes: The Commission left open whether the market for retail on-board services should be
    segmented by type of product (snacking products and duty-free products).
- market_id: pm_6
  name: Passenger air transport services
  definition_status: considered
  notes: For the purpose of assessing vertical relationships, the Commission considered an overall
    market for passenger air transport services. The question of segmentation into charter/scheduled
    flights or time-sensitive/non-time-sensitive passengers was left open.
geographic_markets_considered:
- market_id: gm_1
  name: In-flight catering services — airport’s catchment area
  definition_status: considered
  notes: The Commission considered the geographic market to be either the airport's catchment
    area or an area encompassing several neighboring airports. The assessment would proceed
    on the narrowest plausible definition (airport's immediate catchment area) and on broader
    areas where the Notifying Party claimed a broader market.
- market_id: gm_2
  name: In-flight catering services — geographic area encompassing several neighbouring airports
    (Germany affected)
  definition_status: left_open
  notes: 'The Commission explicitly listed three such areas in Germany: (i) Frankfurt, Dusseldorf
    and Cologne-Bonn airports; (ii) Hamburg and Hannover airports; (iii) Berlin Tegel, Berlin
    Schönefeld and Leipzig airports.'
- market_id: gm_3
  name: In-flight equipment services — EEA-wide
  definition_status: left_open
  notes: The Commission considered the geographic scope to be either EEA-wide or worldwide but
    left the question open.
- market_id: gm_4
  name: In-flight equipment services — worldwide
  definition_status: left_open
  notes: The Commission considered the geographic scope to be either EEA-wide or worldwide but
    left the question open.
- market_id: gm_5
  name: Lounge management services — catchment area of a single airport
  definition_status: left_open
  notes: The Commission considered the geographic market for lounge management services to be
    local (airport catchment area) based on previous decisions for overall ground handling services,
    but left the question open.
- market_id: gm_6
  name: Ready-made food products to the commercial foodservice sector — national
  definition_status: left_open
  notes: The Commission left open whether the geographic market was national or EEA-wide.
- market_id: gm_7
  name: Ready-made food products to the commercial foodservice sector — EEA-wide
  definition_status: left_open
  notes: The Commission left open whether the geographic market was national or EEA-wide.
- market_id: gm_8
  name: Retail on-board services — EEA-wide
  definition_status: left_open
  notes: The Commission concluded the market was at least EEA-wide and left open whether it
    was worldwide.
- market_id: gm_9
  name: Retail on-board services — worldwide
  definition_status: left_open
  notes: The Commission concluded the market was at least EEA-wide and left open whether it
    was worldwide.
- market_id: gm_10
  name: Passenger air transport services — airport-by-airport basis
  definition_status: considered
  notes: The Commission considered the geographic market for passenger air transport services
    (for vertical assessment with in-flight catering) to comprise every route to or from a given
    airport.
