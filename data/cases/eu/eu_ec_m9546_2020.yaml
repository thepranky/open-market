authority: European Commission
jurisdiction: EU
sector: transport
outcome: cleared
procedure_stage: phase1
decision_date: '2020-04-03'
parties: []
source_documents:
- doc_id: eu_ec_m9546_2020_decision
  title: M.9546 — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.9546
