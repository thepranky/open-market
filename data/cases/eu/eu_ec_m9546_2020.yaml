  quote_snippet: (46) Lounge services comprise the provision of a rest area in an airport, typically
    accompanied by additional food, beverage, rest and shower facilities. Lounges may be provided
    by airports, airlines and third-party service providers, and entry is typically based on
    payment of a fee, purchase of a business or first class airline ticket or inclusion in a
    travel membership programme.76 Consequently, lounge management services are provided to
    an airport or to an airline or airline alliance.
