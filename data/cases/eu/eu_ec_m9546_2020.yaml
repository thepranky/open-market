- passage_id: sp_2
  source_document_id: eu_ec_m9546_2020_decision
  page: '7'
  quote_snippet: (21) The Commission notes that airline requirements with respect to in-flight
    catering services may differ depending on the type of flight. The Commission further observes
    that the provision of in-flight catering services on long haul flights may require additional
    infrastructure investments in comparison to the supply of such services on short/medium
    haul flights. However, in view of the results of the market investigation and in line with
    its past decisional practice, the Commission considers that a segmentation of in-flight
    catering services by type of flights (short/medium haul vs long haul) is not warranted.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
