product_markets_considered:
- market_id: pm_1
  name: Freight forwarding services
  definition_status: left_open
  notes: The Commission considered various sub-segmentations including domestic/cross-border,
    mode of transport (air, land, sea), door-to-door multimodal, and type of transported cargo
    (cold/ambient, fresh/frozen). While indications suggested a distinction between ambient
    and cold cargo could be relevant, the market investigation results were inconclusive. A
    further distinction between fresh and frozen cargo within cold cargo freight forwarding
    was deemed not warranted. The Commission ultimately left the exact product market definition
    open but adopted a conservative approach to assess the transaction on the potential segment
    for cold cargo freight forwarding, including available direct and indirect routes.
- market_id: pm_2
  name: Short-sea shipping services
  definition_status: considered
  notes: The Commission investigated whether other modes of transportation (e.g., road) are
    substitutable for short-sea shipping services. For routes between Northern Europe and the
    British Isles (via the Channel Tunnel) and Scandinavia and the Baltic region, the relevant
    product market was considered to include both road transportation and short-sea shipping
    services. For other routes, the assessment was based on short-sea shipping services to the
    exclusion of alternative modes. The Commission confirmed a distinction between RoRo/RoPax
    and LoLo services and suggested a market for unitised cargo (containers and trailers) is
    relevant. A segmentation between cold and ambient cargo was suggested but not definitively
    concluded as most ferry operators can transport both.
geographic_markets_considered:
- market_id: gm_1
  name: Freight forwarding services — country pairs
  definition_status: left_open
  notes: The market investigation yielded mixed results regarding the geographic scope (national,
    regional, EU, global). However, a vast majority of freight forwarders mentioned corridors
    corresponding to country pairs. The Commission adopted a conservative approach, assessing
    the transaction under the narrowest plausible market definition for international freight
    forwarding, taking into account country pairs, but ultimately left the exact geographic
    market definition open. The assessment of horizontal overlaps focused on cold cargo freight
    forwarding between Denmark and the UK, including indirect transportation modes.
- market_id: gm_2
  name: Short-sea shipping services for unitised cargo on RoRo and RoPax vessels — country pairs
    (Scandinavia-British Isles, Northern Europe-Baltic region)
  definition_status: left_open
  notes: The Commission confirmed that the broadest plausible market definition for short-sea
    shipping services corresponds to trade routes (corridors) with possible further segmentation
    by country-pairs. For the Scandinavia – British Isles corridor, the Commission assessed
    on the basis of country pairs (Denmark-UK, Sweden-UK, Norway-UK), excluding indirect routes,
    but left the exact definition open. For the Northern Europe – Baltic region corridor, the
    Commission assessed on the basis of the Germany-Lithuania country pair, excluding indirect
    routes, but left the exact definition open.
