  quote_snippet: (12) In its previous decisions, the Commission has considered the possibility
    of sub-segmenting this market into domestic15 and cross-border freight forwarding,16 and
    into freight forwarding by air, land (road and rail17) and sea.18 In CMA CGM/OPDR, however,
    the Commission defined a market for door-to-door transport services,19 in which providers
    compete for the same customers irrespective of the specific mode of transportation.20
