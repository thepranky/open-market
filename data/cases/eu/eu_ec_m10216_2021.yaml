  page: '12'
  quote_snippet: (49) In light of the results of the market investigation, the Commission concludes
    with respect to the routes between (i) Northern Europe and the British Isles (via the Channel
    Tunnel) and (ii) Scandinavia and the Baltic region that the relevant product market includes
    both road transportation and short-sea shipping services. For the other routes, because
    the market investigation elicited mixed results, the Commission will assess the Transaction
    under the narrowest plausible product market definition (i.e., short-sea shipping services,
    to the exclusion of alternative modes of transportation).
