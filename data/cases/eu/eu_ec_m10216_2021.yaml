- passage_id: sp_5
  source_document_id: eu_ec_m10216_2021_decision
  page: '9'
  quote_snippet: (36) Conversely, when asked about their main points of origin and points of
    destination, a vast majority of freight forwarders mentioned corridors corresponding to
    country pairs (e.g., from Denmark to the UK or Sweden to the UK).61 Besides, some of the
    market participants identified possible input foreclosure issues, which could possibly occur
    on the routes connecting specific country pairs.62 In light of this, the Commission adopted
    a conservative approach and, similarly to the approach adopted in DFDS / Norfolk, assessed
    the Transaction under the narrowest plausible market definition for international freight
    forwarding, taking into account country pairs. However, the exact geographic market definition
    can be left open, as the Transaction does not raise serious doubts under any plausible market
    definition.
