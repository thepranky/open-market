  source_document_id: eu_facebook_whatsapp_decision
  page: '14'
  quote_snippet: The market investigation also supported to a large extent the existence of
    a further sub-segmentation of the online advertising market between search and non-search
    advertising. Indeed, the majority of the advertisers who took part in the market investigation
    considered that search and non-search ads are not substitutable as they serve different
    purposes (for search ads, mainly generating direct user traffic to the merchant's website,
    while, for non-search ads, mainly building brand awareness) and, as a result, most advertisers
    would not be likely to switch from one type to another in the event of a 5-10% price increase.
