product_markets_considered:
- market_id: pm_1
  name: Consumer communications apps for smartphones
  definition_status: considered
  notes: The Commission considered the narrowest relevant product market to be consumer communications
    apps for smartphones, encompassing all operating systems and all communications functionalities.
    It explicitly left open whether to include traditional electronic communications services
    but assessed the Transaction on the narrowest basis. The Commission also left open sub-segmentation
    by OS and by functionality, finding neither appropriate. The market was formally adopted
    'for the purpose of the assessment of the present case' (para. 34), giving it 'considered'
    rather than 'defined' status.
- market_id: pm_2
  name: Social networking services
  definition_status: left_open
  notes: The Commission assessed whether consumer communications apps such as Facebook Messenger
    and WhatsApp fall within the scope of social networking services, but left the exact market
    boundaries open since no competition concerns arise under any alternative market definition.
    The Commission also considered but left open whether social networking services should be
    segmented by intended use (private/entertainment vs. professional). It concluded that segmentation
    by platform or operating system is not appropriate.
- market_id: pm_3
  name: Online advertising services (online vs. offline; sub-segments left open)
  definition_status: left_open
  notes: The Commission concluded that online advertising constitutes a relevant market separate
    from offline advertising, consistent with Google/DoubleClick and Microsoft/Yahoo! Search
    Business precedents. Sub-segmentation into search vs. non-search, online advertising on
    social networking websites, and mobile vs. static online advertising were all considered
    and left open. The Commission stated that narrower definitions would not change the outcome.
    WhatsApp is not active in advertising; the market was assessed solely because of Facebook's
    activities.
geographic_markets_considered:
- market_id: gm_1
  name: Consumer communications apps – EEA-wide (at least), possibly worldwide
  definition_status: considered
  notes: The Commission considered the geographic market to be at least EEA-wide, if not worldwide.
    It adopted an EEA-wide approach as more conservative, given that the Parties' market shares
    are greater in the EEA. The Notifying Party argued for EEA-wide or worldwide scope. Prior
    decisions left the exact scope open but found factors pointing to at least EEA-wide; the
    market investigation found no major differences in consumer communications app offerings
    across the world. The Commission examined penetration differences, roaming charges, and
    Member State-level data and rejected national sub-segmentation. The WhatsApp subscription
    fee in Italy and the UK was found insufficient to justify national markets.
- market_id: gm_2
  name: Social networking services – EEA-wide (at least), possibly worldwide
  definition_status: considered
  notes: The Commission adopted an EEA-wide geographic market for social networking services
    as a conservative approach, noting indications that the scope could be global. The conclusion
    mirrors that for consumer communications apps.
- market_id: gm_3
  name: Online advertising – national or linguistic borders within the EEA
  definition_status: defined
  notes: The Commission concluded that the online advertising market and its possible sub-segments
    should be defined as national in scope or alongside linguistic borders within the EEA. This
    mirrors prior precedents in Google/DoubleClick and Microsoft/Yahoo! Search Business, and
    was confirmed by the market investigation in this case.
