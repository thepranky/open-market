- passage_id: sp_30
  source_document_id: eu_facebook_whatsapp_decision
  page: '15'
  quote_snippet: The market investigation in this case generally confirmed the Commission's
    previous findings as regards the geographic market definition for online advertising. The
    majority of the respondents to the market investigation stated that advertisers typically
    purchase online advertising space and conduct advertising campaigns on a national (or linguistic)
    basis, although a number of respondents also pointed out that, depending on the type of
    campaign, global companies may also procure advertising space on a broader geographic scale
    (EEA-wide or even worldwide). Moreover, the majority of the respondents submitted that prices
    for online advertising tend to differ depending on the country, based on a number of factors,
    such as demand and supply, local market conditions, Internet penetration rate, etc.
  extraction_method: pdf_extracted
