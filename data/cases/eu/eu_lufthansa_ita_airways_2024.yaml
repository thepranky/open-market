product_markets_considered:
- market_id: pm_1
  name: Scheduled passenger air transport services
  definition_status: defined
  notes: The Commission defined the relevant markets for scheduled passenger air transport services
    on the basis of the 'point of origin/point of destination' (O&D) approach. The network dimension
    of competition and strong presence at certain airports are taken into account in the competitive
    assessment. Segmentations considered and their conclusions are detailed in the geographic
    market notes.
- market_id: pm_2
  name: Feeder traffic
  definition_status: defined
  notes: The relevant upstream market for feeder traffic is defined as the provision of access
    to flights for connecting passengers on an O&D basis or a group of feeder routes. This service
    is recognized as an important input for airlines.
- market_id: pm_3
  name: Airport infrastructure services
  definition_status: defined
  notes: The market is defined for the provision of airport infrastructure services to airlines,
    including runway facilities, taxiways, and other airport infrastructure. No further distinction
    within these services was considered necessary.
- market_id: pm_4
  name: Air cargo transport services
  definition_status: defined
  notes: The Commission defined a separate product market for air cargo services, without further
    segmentation. It excludes 'door-to-door' services offered by integrators, but their spare
    capacity is taken into account.
- market_id: pm_5
  name: Maintenance, Repair, and Overhaul (MRO) services
  definition_status: left_open
  notes: The Commission did not find it necessary to determine the exact product market definition
    for MRO services as the transaction would not significantly impede effective competition
    under any plausible definition. Prior practice distinguished between line maintenance, heavy
    maintenance, engine maintenance, and components maintenance.
- market_id: pm_6
  name: Ground handling services
  definition_status: left_open
  notes: The Commission did not find it necessary to determine an exact product market definition
    for ground handling services, as the transaction would not significantly impede effective
    competition under any plausible definition. Prior decisions noted segments like ramp services
    and passenger services.
- market_id: pm_7
  name: Cargo handling services
  definition_status: left_open
  notes: The Commission did not find it necessary to determine an exact product market definition
    for cargo handling services, as the transaction would not significantly impede effective
    competition under any plausible definition. It is considered separate from ramp passenger
    and baggage handling.
- market_id: pm_8
  name: Flight training services
  definition_status: left_open
  notes: The Commission did not find it necessary to determine an exact product market definition
    for flight training services, as the transaction would not significantly impede effective
    competition under any plausible definition. Civil flight simulator training is distinct
    from real flight training.
- market_id: pm_9
  name: Online flight ticketing distribution services
  definition_status: considered
  notes: The Commission considers a separate market for online flight ticketing distribution
    services encompassing both direct and indirect distribution for the purpose of the decision,
    in line with precedents and parties' submissions. Prior cases suggest distinctions within
    online intermediation of travel services.
geographic_markets_considered:
- market_id: gm_1
  name: Scheduled passenger air transport services — O&D basis (Each O&D pair is a distinct
    market)
  definition_status: defined
  notes: |
    The geographic market is defined on an O&D (origin and destination) city-pair basis for scheduled passenger air transport services. Airport substitutability for specific city-pairs was assessed:
    - Düsseldorf: DUS and CGN are within the same market; DTM and NRN question left open (para 73).
    - Milan: LIN and MXP belong to the same market; BGY question left open (para 73). However, for airport infrastructure services, LIN is considered a distinct market (para 331).
    - New York: JFK and EWR belong to the same market; LGA and SWF question left open (para 73).
    - Rome: FCO and CIA belong to the same market (para 73).
    - Brussels: left open, but will take into consideration which airport carriers fly to (para 136).
    - Frankfurt: left open, but will take into consideration which airport carriers fly to (para 162).
    - Hamburg: left open, but will take into consideration which airport carriers fly to (para 171).
    - Munich: left open, but will take into consideration which airport carriers fly to (para 205).
    - Stuttgart: left open, but will take into consideration which airport carriers fly to (para 230).
    - Vienna: left open, but will take into consideration which airport carriers fly to (para 237).
    - Zurich: left open, but will take into consideration which airport carriers fly to (para 248).
- market_id: gm_2
  name: Feeder traffic — O&D basis (Each O&D pair is a distinct market, connecting airports
    generally not substitutable)
  definition_status: defined
  notes: Feeder traffic is defined on an O&D basis. Connecting airports are generally not substitutable
    by other airports in the same area due to the inability of secondary airports to accommodate
    hub-and-spoke operations and limited inter-airport connections.
- market_id: gm_3
  name: Airport infrastructure services — local (Milan-Linate Airport (LIN) affected)
  definition_status: defined
  notes: The geographic scope for airport infrastructure services is considered the catchment
    area of individual airports. Milan-Linate (LIN) is deemed a distinct market from Milan-Malpensa
    (MXP) and Bergamo (BGY) due to LIN's ability to serve 'premium passengers,' higher congestion,
    and differing characteristics for carriers.
- market_id: gm_4
  name: Air cargo transport services — European-wide (Intra-European routes affected)
  definition_status: considered
  notes: For intra-European air cargo transport, the market is assessed as European-wide.
- market_id: gm_5
  name: Air cargo transport services — intercontinental (Europe to North America, North America
    to Europe, Europe to Japan, Japan to Europe affected)
  definition_status: considered
  notes: For intercontinental air cargo transport where parties' activities overlap, the market
    is assessed for routes from Europe to North America, North America to Europe, Europe to
    Japan, and Japan to Europe.
- market_id: gm_6
  name: Maintenance, Repair, and Overhaul (MRO) services — geographic scope
  definition_status: left_open
  notes: The geographic scope for MRO services is left open as the transaction does not raise
    competition concerns under any plausible definition. Prior decisions suggested EEA-wide
    for heavy maintenance, local for line maintenance, and worldwide for engine and components
    maintenance.
- market_id: gm_7
  name: Ground handling services — geographic scope
  definition_status: left_open
  notes: The geographic market definition for ground handling services is left open as the transaction
    would not significantly impede effective competition irrespective of the definition. Prior
    decisions suggested restriction to a specific airport, with potential for a wider catchment
    area.
- market_id: gm_8
  name: Cargo handling services — geographic scope
  definition_status: left_open
  notes: The geographic market definition for cargo handling services is left open as the transaction
    would not significantly impede effective competition irrespective of the definition. Prior
    decisions suggested restriction to a specific airport (or two neighbouring airports).
- market_id: gm_9
  name: Flight training services — geographic scope
  definition_status: left_open
  notes: The geographic market definition for flight training services is left open as the transaction
    would not significantly impede effective competition irrespective of the definition. Prior
    decisions considered the market to be worldwide or at least EEA-wide.
- market_id: gm_10
  name: Online flight ticketing distribution services — geographic scope
  definition_status: left_open
  notes: The geographic market definition for online flight ticketing distribution services
    is left open as the transaction does not lead to competition concerns under any plausible
    definition. The parties argue worldwide scope, while prior decisions found the upstream
    GDS market to be EEA-wide.
