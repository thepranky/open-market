- passage_id: sp_4
  source_document_id: eu_ec_m10284_2021_decision
  page: '3'
  quote_snippet: For the purpose of this Decision, the Commission will consider that there is
    a separate product market for metal food cans, as the market investigation did not reveal
    any reasons to depart from the product market definition followed by the Commission in previous
    cases. As regards the further possible segmentations set out above, ultimately, the exact
    product market definition can be left open, because the Transaction does not raise serious
    doubts as to its compatibility with the internal market under any plausible market definition.
  extraction_method: pdf_extracted
