product_markets_considered:
- market_id: pm_1
  name: Aluminium sheet for food cans
  definition_status: considered
  notes: The Commission adopted this market definition for the purpose of its assessment, in
    line with previous practice.
- market_id: pm_2
  name: Metal food cans
  definition_status: considered
  notes: The Commission considered a separate product market for metal food cans. While further
    segmentations (by metal type, can type) were considered in past decisions, the exact product
    market definition for these sub-segments was ultimately left open in this decision.
- market_id: pm_3
  name: Aluminium 2-piece DRD food cans
  definition_status: considered
  notes: While the broader metal food cans market definition was generally considered with sub-segmentation
    left open, the competitive assessment focused specifically on aluminium 2-piece DRD food
    cans, as this was the only area with a vertical link to the parties' activities.
geographic_markets_considered:
- market_id: gm_1
  name: Aluminium sheet for food cans — EEA and Swiss market
  definition_status: considered
  notes: The Commission considered the EEA and Swiss market for the supply of aluminium sheet
    for food cans in its assessment, in line with previous practice.
- market_id: gm_2
  name: Aluminium 2-piece DRD food cans — national markets
  definition_status: considered
  notes: For the competitive assessment of aluminium 2-piece DRD food cans, the Commission considered
    national markets, even though the overall geographic market definition was left open.
- market_id: gm_3
  name: Aluminium 2-piece DRD food cans — cross-border regional markets
  definition_status: considered
  notes: For the competitive assessment of aluminium 2-piece DRD food cans, the Commission considered
    cross-border regional markets, even though the overall geographic market definition was
    left open. Specific regions were identified where Crown European Tinplate is active.
