  quote_snippet: In past decisions regarding the production and supply of aluminium flat rolled
    products (‘FRPs’)5, the Commission has considered aluminium sheet for food cans as a distinct
    product market from other categories of FRPs on the basis that substitution is not possible
    from either the supply-side or the demand-side perspective.
