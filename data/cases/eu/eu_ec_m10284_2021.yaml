  source_document_id: eu_ec_m10284_2021_decision
  page: '4'
  quote_snippet: Moreover, in the production of food cans, aluminium sheet is only used in the
    production of 2-piece DRD food cans. Therefore, for the purpose of this Decision, the competitive
    assessment will focus on the impact of the Transaction with regard to aluminium 2-piece
    DRD food cans, which is the only area in respect of which a vertical link with KPS’ activities
    can be identified.
