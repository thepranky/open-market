  source_document_id: eu_ec_m10284_2021_decision
  page: '4'
  quote_snippet: 'Crown European Tinplate is active in the downstream production and supply
    of aluminium 2-piece DRD food cans: a. in Croatia, France, Germany, Greece, Italy, Poland,
    Portugal, Slovenia, Spain; and b. in four cross-border regions in Europe13: (i) Portugal,
    Spain and Southern France; (ii) Benelux, Northern France and Western Germany;; (iii) Italy,
    Austria, Bulgaria, Croatia, Greece, Germany, Romania, Slovenia and Southern France; and
    (iv) Poland, Czech Republic, Denmark, Eastern Germany, Latvia, Lithuania, Slovakia and Sweden.'
