case_id: eu_broadcom_vmware_2023
case_name: Broadcom / VMware
authority: European Commission
jurisdiction: EU
sector: tech
outcome: cleared_with_conditions
procedure_stage: phase2
decision_date: '2023-07-12'
parties:
- name: Broadcom
  role: acquirer
- name: VMware
  role: target
source_documents:
- doc_id: eu_broadcom_vmware_2023_decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.10806
  pdf_url: https://ec.europa.eu/competition/mergers/cases1/202520/M_10806_10624386_6538_3.pdf
  title: Broadcom / VMware — Decision
  doc_type: decision
product_markets_considered:
- market_id: pm_1
  name: IT Asset Management & Software Asset Management (ITAM & SAM)
  definition_status: left_open
  notes: The Commission left the exact product market definition for ITOM software
    open but carried out its assessment on the narrowest possible market, which is
    ITAM & SAM based on Gartner segmentation.
- market_id: pm_2
  name: System Infrastructure software
  definition_status: left_open
  notes: The Commission left the exact product market definition for System Infrastructure
    software open but carried out its assessment on the narrowest possible market,
    which includes ITACM and DSAC based on IDC segmentation.
- market_id: pm_3
  name: Network software
  definition_status: left_open
  notes: The Commission left the exact product market definition for Network software
    open, noting no overlap between Network Management software and Network Infrastructure
    software.
- market_id: pm_4
  name: Virtualization software
  definition_status: segmented
  notes: The Commission identified a broader market for virtualization software, which
    it then segmented into a narrower market for server virtualization software.
- market_id: pm_5
  name: Server virtualization software
  definition_status: defined
  notes: This market excludes containerization software and includes both open-source
    and proprietary virtualization software. It is further segmented based on deployment
    model.
- market_id: pm_6
  name: Server virtualization software (on-premises and private cloud deployments)
  definition_status: defined
  notes: This market segment for server virtualization software is distinguished from
    public cloud deployments based on demand and supply-side factors.
- market_id: pm_7
  name: Server virtualization software (public cloud deployments)
  definition_status: defined
  notes: This market segment for server virtualization software is distinguished from
    on-premises and private cloud deployments based on demand and supply-side factors,
    including security, data privacy, data sovereignty, and high barriers to switching.
- market_id: pm_8
  name: FC HBAs
  definition_status: defined
  notes: The Commission found FC HBAs to be a distinct product market, as other HBA
    technologies are not valid alternatives due to technical complexity and disruption.
- market_id: pm_9
  name: Storage adapters
  definition_status: defined
  notes: The Commission defined a market for storage adapters without further segmentation,
    confirming that they cannot be replaced by HBAs and that segmentation by protocol
    is not necessary due to tri-mode adapters.
- market_id: pm_10
  name: NICs
  definition_status: segmented
  notes: The Commission identified a broader market for NICs and defined Ethernet
    NICs as a narrower relevant product market within it.
- market_id: pm_11
  name: Ethernet NICs
  definition_status: defined
  notes: This market is defined within the broader NICs market, excluding non-Ethernet
    NICs and SmartNICs. Segmentation by bandwidth speed (above/below 25 Gb/s) was
    left open.
- market_id: pm_12
  name: SmartNICs
  definition_status: defined
  notes: The Commission concluded that the market for Ethernet NICs does not include
    SmartNICs, implying a separate market for SmartNICs due to fundamental differences
    in function, price, and required expertise.
geographic_markets_considered:
- market_id: gm_1
  name: ITOM software — worldwide or at least EEA-wide
  definition_status: left_open
  notes: The Commission left the exact geographic market definition open but considered
    it to be worldwide or at least EEA-wide based on precedents.
- market_id: gm_2
  name: System Infrastructure software — worldwide or at least EEA-wide
  definition_status: left_open
  notes: The Commission left the exact geographic market definition open, citing precedents
    suggesting a worldwide or at least EEA-wide scope for storage software.
- market_id: gm_3
  name: Network software — worldwide or at least EEA-wide
  definition_status: left_open
  notes: The Commission left the exact geographic market definition open, based on
    precedents indicating at least EEA-wide, if not global, for Network Management
    software.
- market_id: gm_4
  name: Virtualization software — worldwide
  definition_status: defined
  notes: The Commission concluded that the geographic scope for the market for virtualization
    software, and any segmentation thereof, is worldwide.
- market_id: gm_5
  name: FC HBAs — worldwide
  definition_status: defined
  notes: The Commission concluded that the geographic scope for the market for FC
    HBAs is global, consistent with market investigation findings and previous decisions.
- market_id: gm_6
  name: Storage adapters — worldwide
  definition_status: defined
  notes: The Commission concluded that the geographic scope for the market for storage
    adapters is worldwide, based on market investigation results showing global presence
    of suppliers and customers, and uniform conditions of competition.
- market_id: gm_7
  name: NICs — worldwide
  definition_status: defined
  notes: The Commission concluded that the geographic scope for the market for NICs
    is worldwide, consistent with market investigation findings and previous decisions.
