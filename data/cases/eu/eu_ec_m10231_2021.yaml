- passage_id: sp_5
  source_document_id: eu_ec_m10231_2021_decision
  page: '5'
  quote_snippet: (21) From the supply side, direct leasing represents higher risk for lessors
    compared to SLBs because, unlike with SLBs, with direct leasing the lessor bears the risk
    of finding a lessee for the aircraft.26 In addition, ordering aircraft directly from airframers
    is highly complicated and requires very specific expertise that only a minority of lessors
    have.27 While more than 150 lessors are active in SLB, only about 15-20 are regularly active
    in direct dry leasing.28
  extraction_method: pdf_extracted
  review_status: unreviewed
