- passage_id: sp_3
  source_document_id: eu_ec_m10231_2021_decision
  page: '4'
  quote_snippet: '(17) In previous decisions, the Commission considered two distinct markets
    for aircraft leasing:15 (a) Wet leasing: by which the aircraft is leased with its crew,
    maintenance and insurance. These are typically short term transactions between two airlines.16
    The Parties are not active in wet leasing.'
  extraction_method: pdf_extracted
