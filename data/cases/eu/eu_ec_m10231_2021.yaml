  quote_snippet: (25) On the basis of the above, the Commission concludes that there is a separate
    market for dry leasing. It can be left open whether the market for dry leasing should be
    further segmented between type of leasing or type of aircraft, as the Transaction does not
    raise competition concerns under any plausible market definition.
