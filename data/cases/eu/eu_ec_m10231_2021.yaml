- passage_id: sp_8
  source_document_id: eu_ec_m10231_2021_decision
  page: '6'
  quote_snippet: (24) Specifically in relation to direct dry leasing, market participants explained
    that direct leasing of wide body aircraft represent a higher risk to lessors compared to
    leasing of narrow body aircraft. Wide body aircraft are three times more expensive than
    narrow body aircraft and demand for them is much smaller than for narrow body aircraft.
    Consequently, it is more difficult for lessors to find a lessee for wide body aircraft.
  extraction_method: pdf_extracted
