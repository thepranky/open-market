  role: target
source_documents:
- doc_id: eu_novo_holdings_novo_nordisk_catalent_2024_decision
  title: NOVO HOLDINGS / NOVO NORDISK / CATALENT — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.11486
  pdf_url: http://publications.europa.eu/resource/cellar/f8f9c199-30ca-11f0-8a44-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: CDMO services
  definition_status: segmented
  notes: The Commission considered segmenting CDMO services between APIs and FDPs, and between
    CMO and CDO services, with the latter left open in past cases. The market investigation
    for this decision confirmed the distinction between API and FDP services.
- market_id: pm_2
  name: CDO FDP services
  definition_status: left_open
  notes: The precise product market definition for CDO services was left open, as the Transaction
    did not raise serious doubts irrespective of the definition adopted.
- market_id: pm_3
  name: CDO FDP services for solubility enhancing technologies
  definition_status: segmented
  notes: The Commission concluded that solubility-enhancing technologies constitute a plausible
    market within CDMO FDP services for solid dose formats. Further segmentation based on the
    type of solubility-enhancing technology was considered but left open.
- market_id: pm_4
  name: CDO FDP services for lipid-based drug delivery systems (LBDDs)
  definition_status: considered
  notes: Considered as the narrowest plausible affected market within the broader solubility-enhancing
    technologies for the purposes of the assessment.
- market_id: pm_5
  name: CMO FDP services
  definition_status: segmented
  notes: The CMO FDP services market is further segmented based on the manufactured pharmaceutical
    form, including injectables, semi-solid, liquids, and solids.
- market_id: pm_6
  name: CMO FDP services for injectables
  definition_status: segmented
  notes: The market for CMO FDP services for injectables is considered further segmented based
    on the exact format of the injectable (e.g., PFS, cartridges, vials).
- market_id: pm_7
  name: CMO FDP services for PFS
  definition_status: left_open
  notes: The precise market definition for CMO FDP services for PFS was left open, specifically
    regarding whether clinical and commercial supply constitute separate markets, and to what
    extent commercial supply can be segmented based on the speed of the production line.
- market_id: pm_8
  name: CMO FDP services for solids
  definition_status: segmented
  notes: This market is further segmented based on solubility-enhancing technologies versus
    non-solubility-enhancing technologies.
- market_id: pm_9
  name: CMO FDP services for ODTs
  definition_status: left_open
  notes: The exact product market definition for CMO FDP services for ODTs was left open.
- market_id: pm_10
  name: Anti-obesity preparations excluding dietetics (ATC class A8A)
  definition_status: left_open
  notes: The Commission considered the relevant market to be ATC class A8A, but left open whether
    further segmentation based on the type of molecule used in the obesity preparation is appropriate.
- market_id: pm_11
  name: GLP-1 receptor agonists indicated for diabetes (ATC class A10S)
  definition_status: left_open
  notes: The Commission considered the relevant market to be ATC class A10S, but left open the
    possibility of a split between older generation (daily) and new generation (weekly) GLP-1
    receptor agonists.
- market_id: pm_12
  name: Opioid use disorder treatments (ATC3 class N7F)
  definition_status: left_open
  notes: The Commission assessed the narrowest plausible market, ATC3 class N7F, but left the
    exact market definition open.
geographic_markets_considered:
- market_id: gm_1
  name: CMO FDP services (general upstream) — EEA-wide/worldwide
  definition_status: left_open
  notes: The exact geographic market definition for upstream CMO services was left open, considering
    EEA, global, or global excluding China.
- market_id: gm_2
  name: Finished pharmaceutical products (downstream general) — national
  definition_status: considered
  notes: This refers to the Commission's past consistent practice of defining geographic markets
    for finished pharmaceutical products as national in scope, while also acknowledging a trend
    towards EEA-level standardization more recently.
- market_id: gm_3
  name: Anti-obesity preparations excluding dietetics (ATC class A8A) — national/EEA-wide
  definition_status: left_open
  notes: The Commission considered both national and EEA-wide geographic markets for anti-obesity
    preparations, leaving the precise definition open.
- market_id: gm_4
  name: GLP-1 receptor agonists indicated for diabetes (ATC class A10S) — national/EEA-wide
  definition_status: left_open
  notes: The Commission considered both national and EEA-wide geographic markets for GLP-1 receptor
    agonists, leaving the precise definition open.
- market_id: gm_5
  name: Opioid use disorder treatments (ATC3 class N7F) — EEA-wide
  definition_status: considered
  notes: The downstream market for Opioid Use Disorder treatments was assessed on an EEA-wide
    basis, as indicated by market share data for Orexo’s Zubsolv.
- market_id: gm_6
  name: CMO FDP services for PFS — EEA-wide/worldwide
  definition_status: considered
  notes: The geographic market for CMO FDP services for PFS was assessed as at least EEA-wide,
    if not global (potentially excluding China).
theories_of_harm: []
commitments: []
