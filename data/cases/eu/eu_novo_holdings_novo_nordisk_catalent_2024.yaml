  page: '21'
  quote_snippet: For completeness, the Commission investigated whether there could be a potential
    split between older generation (daily) GLP-1 receptor agonists and new generation (weekly)
    GLP-1 receptor agonists. The market feedback received mostly pointed towards the fact that
    the older generation of GLP-1 receptor agonists likely still exercised competitive constraints
    over the new generation but only to a limited extent. In any case, the specific market definition
    can be left open as the Transaction does not raise serious doubts as to the compatibility
    with the internal market regardless of the market definition.
