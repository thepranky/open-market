- passage_id: sp_7
  source_document_id: eu_novo_holdings_novo_nordisk_catalent_2024_decision
  page: '8'
  quote_snippet: (30) In its previous decisions, the Commission identified separate markets
    according to whether the product manufactured and supplied was an API or an FDP.25 In Chr.
    Hansen / Lonza / JV, the Commission distinguished the services offered for those two types
    of products. Services at the API level involve the evaluation, characterisation, development
    of production and scaling processes in relation to the manufacturing of the actual molecule.
    Services at FDP level mostly pertain to the development of appropriate dosage formulation
    and large-scale manufacture of the final drug product.
