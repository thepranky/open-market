  page: '7'
  quote_snippet: (29) Regardless of the precise product market definition, the Transaction does
    not give rise to any vertically affected links with respect to CDO services and only gives
    rise to a horizontally affected market under two plausible product market definitions, specifically
    the market for CDO FDP services for solubility enhancing technologies or (if a narrower
    market is defined) lipid-based drug delivery systems.24 The precise product market definition
    for CDO services can be left open, as regardless of the definition adopted the Transaction
    does not raise serious doubts as to its compatibility with the internal market.
