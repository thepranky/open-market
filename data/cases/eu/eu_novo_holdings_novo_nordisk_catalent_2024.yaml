  quote_snippet: (27) The Commission has previously analysed several transactions involving
    CDMO services, consistently distinguishing between the supply of CDMO services for APIs
    and those for FDPs. While it has also explored the possibility of separate markets for CMO
    and CDO services, it has ultimately left this question open.22 However, no specific assessment
    of potential sub-segments within the CDO services market has been conducted.
