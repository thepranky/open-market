- passage_id: sp_5
  source_document_id: eu_novo_holdings_novo_nordisk_catalent_2024_decision
  page: '18'
  quote_snippet: (80) In light of the above, the Commission concludes that solubility-enhancing
    technologies constitute a plausible market within the CDMO FDP services for solid dose formats.
    The Commission further considers that this market can be further segmented based on the
    type of solubility-enhancing technology, but leaves the market open, since no serious doubts
    arise under any plausible market definition in relation to solubility-enhancing technologies
    – the narrowest relevant plausible affected market in this case being that for LBDDs. At
    the same time, and for the purposes of this Decision, the Commission will focus its assessment
    on the narrowest plausible affected market in the non-solubility-enhancing technologies
    segment, specifically the market for CMO FDP services for ODTs, leaving the exact product
    market definition open, as the Transaction does not raise serious doubts about its compatibility
    with the internal market.
