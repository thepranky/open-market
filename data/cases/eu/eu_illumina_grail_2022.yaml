        from member states where the transaction fell below national thresholds. Decision
        subject to further appeal to the CJEU.

ai_summary: >
  The European Commission prohibited Illumina's acquisition of GRAIL in September 2022,
  finding that the transaction would harm competition in the nascent market for
  multi-cancer early detection (MCED) tests. The Commission's theory centred on vertical
  foreclosure: as the dominant supplier of NGS platforms — the essential technology
  underpinning MCED tests — Illumina would have the ability and incentive to harm
  GRAIL's rivals post-acquisition, reducing innovation competition in a market of
  significant public-health importance. The decision is notable for applying Article 22
  referral jurisdiction to a transaction that fell below notification thresholds in most
  EU member states, and for blocking a deal in an emergent, pre-revenue market.
