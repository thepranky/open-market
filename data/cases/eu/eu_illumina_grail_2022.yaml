theories_of_harm:
  - theory_id: toh_1
    name: Vertical foreclosure – next-generation sequencing (NGS) inputs
    description: >
      Illumina, dominant supplier of NGS platforms used in GRAIL's cancer early-detection
      tests, could foreclose GRAIL's rivals by degrading or foreclosing access to NGS
      technology, raising their costs or delaying access to next-generation sequencers.
  - theory_id: toh_2
    name: Harm to innovation competition in early cancer detection
    description: >
      GRAIL's rivals in the liquid biopsy / multi-cancer early detection market rely on
      Illumina sequencers; post-merger Illumina would have the ability and incentive to
      harm those rivals, reducing innovation competition in a nascent but high-value market.

product_markets_considered:
  - market_id: pm_1
    name: Next-generation sequencing (NGS) platforms and consumables
    definition_status: defined
    notes: >
      Commission defined a distinct market for NGS platforms used in clinical applications,
      including liquid biopsy tests. Illumina held a dominant position globally and in the EEA.
  - market_id: pm_2
    name: Liquid biopsy / multi-cancer early detection (MCED) tests
    definition_status: defined
    notes: >
      Commission defined an emerging product market for MCED tests, noting that
      GRAIL's Galleri test was the only commercially available MCED product at the time.

geographic_markets_considered:
  - market_id: gm_1
    name: EEA (NGS platforms and consumables)
    definition_status: defined
  - market_id: gm_2
    name: EEA / worldwide (MCED tests)
    definition_status: discussed
    notes: >
      Commission considered both EEA-wide and worldwide geographic scope for MCED tests,
      leaving the precise delineation open as the analysis did not change under either approach.

