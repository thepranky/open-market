- passage_id: sp_23
  source_document_id: eu_qualcomm_nxp_2018_decision
  page: '57'
  quote_snippet: (238) The Notifying Party submits that the geographic market definition
    in the Commission's previous cases, notably in NXP/Freescale, should also be retained
    in this Decision and that the relevant geographic market for all semiconductors
    should be considered as worldwide in scope. It is further argued that as market
    conditions in the semiconductor industry have not changed materially, there is
    no justification to define narrower markets than the worldwide market. In fact,
    suppliers of semiconductors conduct business on a worldwide basis, with recourse
    to manufacturing plants located around the world; suppliers compete on a worldwide
    level; customers have cross-border sourcing strategies and also compete on a worldwide
    level; no regulatory barriers to trade of semiconductors on a worldwide level
    exist, there are no quotas, tariffs, or technical specifications that could hinder
    cross-border trade; and transportation costs remain low, with minimal impact on
    pricing.
  extraction_method: pdf_extracted
