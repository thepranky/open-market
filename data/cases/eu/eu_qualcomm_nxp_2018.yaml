  quote_snippet: (249) The various leading transit service technologies such as MIFARE,
    FeliCa, and Calypso are offered on a worldwide basis, although deployed to various
    degrees in different regions. MIFARE is the leading worldwide transit service
    technology, deployed in 750 cities worldwide252. FeliCa is primarily used in Japan,
    but has also been deployed for transit systems elsewhere, including in Hong Kong,
    India, Indonesia, Singapore253. Calypso, initially developed by a number of European
    transit operators, is deployed across 125 cities in 25 countries, with primary
    focus on certain European countries (including France, Belgium, Italy) but also
    in Israel, Canada, Mexico, and several North African countries254.
