- passage_id: sp_3
  source_document_id: eu_qualcomm_nxp_2018_decision
  page: '20'
  quote_snippet: '(55) Finally, overall, respondents to the market investigation also
    subscribe to the segmentation of the market by end-use proposed by the Notifying
    Party, although additional categories are also suggested. With regard to the segmentation
    by field use-application, the market investigation provided mixed results. While
    most of the customers consider that a distinction should, at least, be made for
    semiconductors used in the following function blocks: (i) hearables (including
    true wireless headsets), (ii) wearables (watches and fitness), (iii) drones and
    smart cameras, (iv) smart cities, and (v) smart home (including home entertainment),
    competitors'' replies were mixed. In particular, Renesas and Nordic highlight
    that the market for standardised chips is generally a single market, and while
    customers can choose to put the chips in different end applications, the chips
    and the market for their sales is the same46. With regard to a potential segmentation
    of semiconductors in the hearables IoT space, the market investigation did not
    provide a clear indication on whether TWS headphones provide different functionalities
    respect to other semiconductors in the hearables IoT space47.'
  extraction_method: pdf_extracted
