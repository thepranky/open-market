  page: '56'
  quote_snippet: (232) With regard to other IP that does not qualify as SEPs, the
    Commission notes that both Qualcomm and NXP possess IP that is relevant for the
    purpose of NFC technology. Given that NFC technology can be viewed as a separate
    product market, the Commission considers that non-SEP IP related to NFC technology
    may be viewed as a distinct product market from non-SEP IP related to other technologies
    (as well as from SEP IP related to NFC). The Commission notes, however, that contrary
    to SEPs, a non-SEP for a given functionality/product may in theory be substitutable
    with another non-SEP which allows making that same functionality/product or even
    with another non-SEP which allows making a substitutable functionality/product.
