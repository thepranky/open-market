case_id: eu_qualcomm_nxp_2018
case_name: Qualcomm / NXP Semiconductors
authority: European Commission
jurisdiction: EU
sector: tech
outcome: cleared_with_conditions
procedure_stage: phase2
decision_date: '2018-01-18'
parties:
- name: Qualcomm
  role: acquirer
- name: NXP Semiconductors
  role: target
source_documents:
- doc_id: eu_qualcomm_nxp_2018_decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.8306
  pdf_url: https://ec.europa.eu/competition/mergers/cases/decisions/m8306_3479_3.pdf
  title: Qualcomm / NXP Semiconductors — Decision
  doc_type: decision
product_markets_considered:
- market_id: pm_1
  name: Non-cellular V2X radio chip for automotive safety applications
  definition_status: left_open
  notes: The Commission left open the exact product market definition for chips for
    the safety function for automotive applications, including non-cellular V2X radio
    chips, as the transaction did not raise competition concerns irrespective of the
    precise market definition.
- market_id: pm_2
  name: Semiconductors for Internet of Things applications
  definition_status: left_open
  notes: The Commission left open the exact product market definition for IoT semiconductors
    as the transaction did not raise competition concerns irrespective of the precise
    market definition.
- market_id: pm_3
  name: Baseband chipsets
  definition_status: left_open
  notes: The Notifying Party argued against further segmentation of baseband chipsets
    and the Commission noted that the exact product market definition could be left
    open as the transaction would not result in any affected market for baseband chipsets.
- market_id: pm_4
  name: NFC chips (merchant market)
  definition_status: defined
  notes: The Commission concluded that NFC chips (including underlying technology)
    sold on the merchant market constitute a separate product market, distinct from
    alternative technologies like BTLE, QR codes, and MST.
- market_id: pm_5
  name: Embedded Secure Element (SE) chips (including SE OS)
  definition_status: considered
  notes: The Commission left open the exact product market definition for SE chips,
    noting it could be wider to include HCE and TEE. However, the competitive assessment
    was carried out on the possible product market of embedded SEs (including SE OS),
    as NXP supplied only this type in combined NFC/SE solutions.
- market_id: pm_6
  name: Combined NFC/SE solutions
  definition_status: defined
  notes: The Commission considers the combined NFC/SE solution to constitute a distinct
    product market, separate from standalone NFC chips and SE chips.
- market_id: pm_7
  name: Speech enhancement software
  definition_status: defined
  notes: The Commission considers speech enhancement software as a separate product
    market, distinct from other components in a mobile device, with a narrower market
    for solutions incorporating a Qualcomm baseband chipset possibly existing.
- market_id: pm_8
  name: Smart amplifier chips
  definition_status: defined
  notes: The Commission considers smart amplifier chips as a separate product market,
    distinct from other mobile device components, with a narrower market for solutions
    incorporating a Qualcomm baseband chipset possibly existing.
- market_id: pm_9
  name: Transit service technologies
  definition_status: defined
  notes: The Commission assessed market power in this market and concluded that the
    merged entity would hold a dominant position, implying its definition as a relevant
    market.
- market_id: pm_10
  name: Standard Essential Patents (SEPs) related to cellular and NFC technology
  definition_status: defined
  notes: In line with its previous decisions, the Commission considers each SEP related
    to cellular and NFC technology as a separate market, noting that standard implementers
    cannot design around them.
- market_id: pm_11
  name: Non-SEP IP related to NFC technology
  definition_status: left_open
  notes: The Commission considers that non-SEP IP related to NFC technology may be
    viewed as a distinct product market from non-SEP IP related to other technologies,
    but leaves the exact definition open.
geographic_markets_considered:
- market_id: gm_1
  name: All relevant semiconductor products (automotive semiconductors, IoT semiconductors,
    baseband chipsets, NFC, SE, and combined NFC/SE chips, smart amplifiers) — worldwide
  definition_status: considered
  notes: The Commission concluded that the geographic scope for all relevant semiconductor
    product markets is likely worldwide, consistent with previous decisions and market
    investigation findings.
- market_id: gm_2
  name: Speech enhancement software — worldwide
  definition_status: left_open
  notes: The Commission left open the exact geographic market definition for speech
    enhancement software, noting that the transaction did not raise competition concerns
    irrespective of its scope.
- market_id: gm_3
  name: Transit service technologies — worldwide
  definition_status: considered
  notes: The Commission concluded that the market for transit service technologies
    is likely worldwide, based on the global offerings of leading technologies and
    worldwide procurement by customers.
- market_id: gm_4
  name: Standard Essential Patents (SEPs) related to cellular and NFC technology —
    at least EEA-wide
  definition_status: considered
  notes: The Commission maintained its previous conclusion that the market for the
    licensing of SEPs is at least EEA-wide.
- market_id: gm_5
  name: Non-SEP IP related to NFC technology — at least EEA-wide
  definition_status: left_open
  notes: The Commission considered the market for the licensing of non-SEP IP relevant
    for NFC technology is likely to be at least EEA-wide, but left the exact definition
    open.
