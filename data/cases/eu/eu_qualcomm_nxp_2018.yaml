- passage_id: sp_8
  source_document_id: eu_qualcomm_nxp_2018_decision
  page: '45'
  quote_snippet: (170) The Commission considers that while there are a number of elements
    that support distinguishing SEs (including the SE OS) from other technologies,
    in particular HCE and TEE, the question as to whether the relevant product market
    should be wider than SEs to also include other technologies can be left open for
    the purposes of this Decision. The competitive assessment will be carried out
    on the possible product market of embedded SEs (including the SE OS), which is
    the market where NXP holds the most market power. Embedded SE is the only type
    of SEs currently supplied by NXP, and it supplies them only as part of the company's
    combined NFC/SE solution, and not as a standalone product184. Carrying out the
    competitive assessment by using a wider product market definition, namely one
    which would comprise not only SE but also alternative technologies, in particular
    HCE and TEE, would be unlikely to raise any additional concerns, considering in
    particular the more limited market position of NXP on such wider product market185.
  extraction_method: pdf_extracted
