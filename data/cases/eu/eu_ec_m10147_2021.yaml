  page: '8'
  quote_snippet: (42) The Commission notes that (i) there are significant differences between
    EEA and non-EEA prices for MIBK, (ii) the transportation costs associated with importing
    MIBK into the EEA are significant (10-12%) and (iii) in addition, some tariffs (0-5%) may
    as well apply to imports of MIBK into the EEA. These elements could point towards a potential
    EEA-wide market for MIBK. The market investigation did not provide any indications pointing
    towards either plausible alternative potential geographic market definition (i.e. EEA-wide
    or worldwide) for MIBK. In any event, for the purpose of assessing the Transaction, the
    exact scope of the geographic market definition can be left open since the above-mentioned
    plausible alternative geographic market definitions (EEA-wide or worldwide), do not affect
    the outcome of the competitive assessment of the Transaction as to its compatibility with
    the internal market or the functioning of the EEA Agreement.
