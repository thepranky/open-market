- passage_id: sp_2
  source_document_id: eu_ec_m10147_2021_decision
  page: '6'
  quote_snippet: (19) As regards a potential narrower market definition, distinguishing between
    each individual type of special bisphenol for polycarbonate resin, the Commission observes
    that while there appears to be some degree of substitutability between various categories
    of special bisphenols for polycarbonate resins, important price-differences among these
    categories of products would point towards the absence of complete demand-side substitutability,
    at least for some categories of customers. As regards supply-side substitutability, the
    Commission notes that the Notifying Parties acknowledge that it is not always possible to
    switch production easily between certain types of special bisphenol for polycarbonate resins
    (and in particular it is not possible to switch production between BisOPPEO-FL and other
    types of special bisphenol for polycarbonate resins).
  extraction_method: pdf_extracted
  review_status: unreviewed
