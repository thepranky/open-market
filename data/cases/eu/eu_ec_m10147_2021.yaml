- passage_id: sp_1
  source_document_id: eu_ec_m10147_2021_decision
  page: '5'
  quote_snippet: (18) As regards potential market definitions broader than the supply of special
    bisphenols for polycarbonate resins, the Commission notes that both demand- and supply-side
    substitutability between special bisphenol for polycarbonate resins on the one hand and
    other types of bisphenols or special bisphenols on the other is limited. In particular,
    as regards demand-side substitutability, special bisphenol for polycarbonate resins fulfil
    specific functions, and provide specific characteristics, such as heat resistance and durability,
    to polycarbonate resins that other special bisphenols (or other types of bisphenols), such
    as special bisphenol for epoxy resins, do not provide.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
