    are rather expensive non-hazardous speciality chemical products, with low unit transport
    costs. These elements could point towards a potential global market for such products. The
    market investigation did not provide any indications pointing towards either plausible alternative
    potential geographic market definitions (i.e. EEA-wide or worldwide) for special bisphenols
    for polycarbonate resins.
