  page: '7'
  quote_snippet: (33) The Commission notes that 4,4’ biphenol is a non-hazardous speciality
    chemical products, that is actively traded around the world. There are tariffs applied to
    imports of 4,4’ biphenol from outside the EEA, nonetheless, these represent only 5.5% of
    the sale price, and these tariffs do not apply to Japanese suppliers, as a result of the
    EU-Japan trade agreements. These elements could point towards a potential global market
    for 4,4’ biphenol. The market investigation did not provide any indications pointing towards
    either plausible alternative potential geographic market definition (i.e. EEA-wide or worldwide)
    for 4,4 biphenol.
  extraction_method: pdf_extracted
