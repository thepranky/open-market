- passage_id: sp_14
  source_document_id: eu_ec_m10147_2021_decision
  page: '6'
  quote_snippet: '(23) The Notifying Parties submit that the geographic market for special bisphenols
    for polycarbonate resins is global given that: (i) suppliers are active globally from production
    facilities across the world; (ii) customers in the EEA are supplied from facilities located
    in other world regions; and (iii) there are no regulatory or other barriers preventing a
    new or existing supplier located outside the EEA from supplying customers located within
    the EEA.'
  extraction_method: pdf_extracted
