  page: '6'
  quote_snippet: (21) In any event, the Commission considers that, for the purpose of this decision,
    the precise question of whether the relevant product market (i) comprises all special bisphenols,
    (ii) comprises only special bisphenols for polycarbonate resins or (iii) is segmented between
    all individual types of special bisphenols for polycarbonate resins listed in paragraph
    (14) (Table 1) above can be left open, as these alternative product market definitions do
    not affect the outcome of the competitive assessment of the Transaction as to its compatibility
    with the internal market or the functioning of the EEA Agreement.
  extraction_method: pdf_extracted
