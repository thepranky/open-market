  quote_snippet: (564) The Notifying Parties submit that API suppliers are active globally.
    The Parties indicate that only [30-40]% of the valid certificates awarded to control the
    quality of pharmaceutical substances183 were held by European manufacturers, while Chinese
    and Indian manufacturers held together [50-60]% of these certificates in 2017.184 The Parties
    further submit that the share of Indian and Chinese manufacturers has steadily increased
    over recent years. In the Parties’ view, the fact that the majority of CEP holders are from
    outside of Europe shows that suppliers are able to compete in Europe regardless of their
    location.
