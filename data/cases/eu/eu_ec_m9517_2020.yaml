- passage_id: sp_4
  source_document_id: eu_ec_m9517_2020_decision
  page: '8'
  quote_snippet: (23) The market investigation was inconclusive regarding whether products with
    different galenic forms are substitutable.26 A large majority of responding pharmacies indicated
    that different form factors might not be interchangeable to treat the same symptoms or illness,
    especially for nervous system treatments,27 while an overwhelming majority of competitors
    consider that different galenic forms do compete with each other.28 The Commission notes
    that the Commission’s assessment does not significantly differ in the present case should
    the relevant product markets be sub-segmented at the galenic form level or comprise all
    galenic forms. Moreover, no additional Group 1(+) or 2 markets arise from the Transaction
    if the relevant product markets were defined based on different galenic forms, except where
    this is explicitly mentioned in Section 5, and in none of those cases the competitive assessment
    changes. Therefore, the question of whether the relevant molecule markets should be further
    segmented based on the galenic form of FDPs can be left open, as it has no impact on the
    competitive assessment of the Transaction.
  extraction_method: pdf_extracted
