- passage_id: sp_7
  source_document_id: eu_ec_m9517_2020_decision
  page: '8'
  quote_snippet: (21) In the present case, the responses to the market investigation suggest
    that, for the molecules involved in this case, different genericized molecules, including
    from the same ATC3 class, do not form part of the same product market, in particular since
    they are not interchangeable for patients and pharmacies,19 and their price-setting modalities
    differ.20 Relatedly, respondents to the market investigation also indicated that certain
    genericized molecules belonging to wider groups of molecules with the same or similar mode
    of actions, such benzodiazepines, are generally not interchangeable.21 However, with regard
    to anticholinergics specifically, while the majority of respondents also consider that different
    molecules generally do not form part of the same product market, 22 the Commission notes
    that the answers received in the market investigation to this question were mixed regarding
    the Lithuanian market.23 These elements indicate that, with the possible exception of anticholinergics,24
    the molecules offered by the Parties and analysed in the present case each form a separate
    product market.
  extraction_method: pdf_extracted
