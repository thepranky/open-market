- passage_id: sp_3
  source_document_id: eu_ec_m9517_2020_decision
  page: '7'
  quote_snippet: (17) In previous decisions, the Commission found that, at molecule level, the
    originator (i.e. the first product that was launched on the market for a specific molecule)
    and generics (i.e. products that were launched after the originator’s loss of exclusivity)
    generally form part of the same market. This is because generics are versions of originator
    medicines, which are specifically designed to compete with those medicines and normally
    represent the closest substitute to them.
  extraction_method: pdf_extracted
  review_status: unreviewed
