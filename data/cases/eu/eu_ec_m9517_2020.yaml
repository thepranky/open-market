product_markets_considered:
- market_id: pm_1
  name: Finished Dose Pharmaceuticals (FDPs) at molecule level
  definition_status: defined
  notes: The Commission defines the relevant product markets for Finished Dose Pharmaceuticals
    (FDPs) at the level of individual molecules, which includes both originator and generic
    products based on the same active pharmaceutical ingredient, as they are generally considered
    interchangeable. This approach is consistent with prior decisions in genericized FDP markets.
- market_id: pm_2
  name: Finished Dose Pharmaceuticals (FDPs) segmented by galenic form
  definition_status: left_open
  notes: The Commission considered whether to further segment FDP markets based on galenic form,
    but the market investigation was inconclusive regarding substitutability. As the competitive
    assessment would not significantly differ, this question was left open.
- market_id: pm_3
  name: Anticholinergic agents
  definition_status: left_open
  notes: For anticholinergic agents, the Commission explicitly left open whether the market
    includes all anticholinergic agents combined or each separate agent. This was because the
    competitive assessment did not raise serious doubts regardless of the definition.
- market_id: pm_4
  name: Active Pharmaceutical Ingredients (APIs) for each individual molecule
  definition_status: defined
  notes: For Active Pharmaceutical Ingredients (APIs), the Commission considers the supply of
    APIs for each individual molecule as a separate product market, consistent with past decisions
    and the views of the Notifying Parties.
- market_id: pm_5
  name: Outlicensing for each individual molecule
  definition_status: defined
  notes: The Commission considers outlicensing for each individual molecule to be a relevant
    product market, consistent with its past decisions and the lack of contrary indications
    from the Notifying Parties or the market investigation.
geographic_markets_considered:
- market_id: gm_1
  name: Finished Dose Pharmaceuticals (FDPs) — national
  definition_status: defined
  notes: The geographic markets for FDPs are defined as national in scope, consistent with Commission
    precedents and confirmed by the market investigation due to national regulatory and reimbursement
    schemes.
- market_id: gm_2
  name: Active Pharmaceutical Ingredients (APIs) for each individual molecule — EEA-wide or
    worldwide
  definition_status: left_open
  notes: The precise geographic scope for API markets (whether EEA-wide or worldwide) was left
    open as the transaction did not raise serious doubts under any plausible definition. Past
    decisions considered them at least EEA-wide or possibly global.
- market_id: gm_3
  name: Outlicensing for each individual molecule — EEA-wide
  definition_status: defined
  notes: The geographic scope for outlicensing markets is considered EEA-wide, aligning with
    Commission precedents and without contrary indications from the parties or market investigation.
