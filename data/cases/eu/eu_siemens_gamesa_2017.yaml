product_markets_considered:
- market_id: pm_1
  name: Supply of onshore wind turbines
  definition_status: considered
  notes: |
    For the purpose of the present case the Commission considered that separate markets exist for onshore and offshore wind turbines (recital 10). Onshore and offshore turbines differ in power output, design, certification, cost structure and market dynamics. The Commission did not further segment the onshore market by power output (recital 30), technology (recital 38), or wind speed. For wind speed, the exact market definition for onshore was left open as it would not impact the competitive assessment (recital 41). Seven key players are active in the supply of onshore wind turbines in the EEA: Enercon, Gamesa, GE Alstom, Nordex/Acciona, Senvion, Siemens and Vestas (recital 25). The `considered` status reflects the Commission's "for the purpose of the present case" framing, consistent with the 2024 Notice guidance on working assumptions in merger cases.
- market_id: pm_2
  name: Supply of offshore wind turbines
  definition_status: considered
  notes: |
    For the purpose of the present case the Commission considered that separate markets exist for onshore and offshore wind turbines (recital 10). Offshore turbines are structurally different products with larger rotor size, different certification requirements, higher cost, and serve a different customer base (large utilities and sophisticated consortiums). The Commission did not segment by power output (recital 37) or technology (recital 38). Five major players compete offshore: MHI-Vestas, Siemens, Senvion, GE Alstom and Adwen (Gamesa) (recital 25). The competitive assessment for offshore was the primary focus of Section 5.1.1. Adwen (Gamesa's offshore subsidiary) was found not to be a significant competitive constraint on Siemens (recital 74). The `considered` status reflects the Commission's "for the purpose of the present case" framing.
- market_id: pm_3
  name: Manufacture and supply of gearboxes for wind turbines
  definition_status: left_open
  notes: |
    The Commission found no segmentation is warranted between gearboxes for onshore and offshore turbines, based on supply-side substitutability — suppliers can adapt gearboxes to fit either setting — consistent with prior practice (M.6361 – ZF/Hansen). From a demand-side, customers do not consider them substitutable but supply-side interchangeability means no segmentation is necessary (recital 63-64). The exact market definition was left open. The Parties' activities primarily give rise to potential vertical relationships (gearbox supply to third-party turbine OEMs), not horizontal overlaps — Gamesa's external supply is minimal, [0-5]% of market (recital 59, 64).
- market_id: pm_4
  name: Manufacture and supply of generators for wind turbines
  definition_status: left_open
  notes: |
    The Commission focused its assessment on induction generators for geared turbines, since Gamesa does not use or sell synchronous generators (for direct drive turbines) either onshore or offshore (recital 69). The exact product market definition was left open. Potential sub-segmentation into induction vs. synchronous generators was noted but not resolved (recital 67-69). The Parties' activities primarily give rise to potential vertical relationships, not horizontal overlaps — Gamesa's generator production is mostly captive. The competitive assessment for generators focused on input and customer foreclosure (Section 5.2.2).
geographic_markets_considered:
- market_id: gm_1
  name: Supply of offshore wind turbines — EEA-wide (not wider)
  definition_status: considered
  notes: |
    For the purpose of this case, the Commission considered that the geographic scope of the offshore wind turbine market cannot be wider than the EEA (recital 53). Determining factors were: (1) transportation costs and logistical complexity of maritime installation, including jack-up vessel costs of EUR 150,000/day (recital 48); (2) mandatory presence of a service team near wind farms for warranty obligations (recital 51); and (3) transportation costs prevent non-EEA-based suppliers from effectively competing (recital 49). The Notifying Party argued for at least EEA-wide or potentially global scope (recital 42). Prior Commission practice treated the market as at least EEA-wide (M.6222 – GE/Converteam, recital 43). The Commission's conclusion caps the scope at EEA-wide without formally defining a lower bound.
- market_id: gm_2
  name: Supply of onshore wind turbines — EEA-wide (not wider)
  definition_status: considered
  notes: |
    The Commission applied the same geographic reasoning as for offshore turbines mutatis mutandis to the onshore market (recital 56). Transportation costs for onshore turbines are particularly significant given the complexities of road transport for large components. Servicing requirements also demand supplier proximity to wind farms (recital 55). The Commission concluded that the geographic scope for the onshore market cannot be considered wider than the EEA (recital 58). Prior Commission practice treated the market as at least EEA-wide but left the exact definition open (recital 43).
- market_id: gm_3
  name: Manufacture and supply of gearboxes for wind turbines — EEA-wide (left open)
  definition_status: left_open
  notes: |
    The Commission found in past decisions (M.6361 – ZF/Hansen, paragraphs 16-17) that the geographic scope of the gearbox market was likely EEA-wide, based on transport costs and technical specifications differing by region (recital 65). The Notifying Party argued for a global scope. The market investigation revealed that customers regularly procure gearboxes from outside the EEA (recital 66). The exact definition was left open given the transaction does not raise serious doubts regardless of the geographic definition (recital 66).
- market_id: gm_4
  name: |
    Manufacture and supply of generators for wind turbines — EEA-wide or wider (left open)
  definition_status: left_open
  notes: |
    The Notifying Party submitted the geographic scope is at least EEA-wide, citing uniform technology worldwide and global customer sourcing; the market investigation confirmed procurement from beyond the EEA (recital 70). The Commission left the exact definition open given the transaction does not raise doubts regardless of the geographic definition (recital 71). No strong Commission geographic assessment was made for generators beyond leaving the definition open.
