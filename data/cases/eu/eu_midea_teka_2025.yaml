sector: manufacturing
outcome: cleared
procedure_stage: phase1
decision_date: '2025-03-03'
parties:
- name: MIDEA
  role: acquirer
- name: TEKA
  role: target
source_documents:
- doc_id: eu_midea_teka_2025_decision
  title: MIDEA / TEKA — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.11684
  pdf_url: http://publications.europa.eu/resource/cellar/90d3f684-30cb-11f0-8a44-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Manufacture and supply of built-in kitchen hoods (at OBM level)
  definition_status: left_open
  notes: The Commission identified this as a horizontally affected market for further investigation.
    While the market investigation generally confirmed segmentation into individual MDA products,
    the further segmentation of kitchen hoods into built-in and freestanding was left open for
    the purposes of this case.
- market_id: pm_2
  name: Manufacture and supply of microwave ovens for third parties (at OEM level)
  definition_status: left_open
  notes: The Commission identified this as a horizontally affected market. The distinction between
    OBM and OEM sales was taken into account for market segmentation. However, the overall product
    market definition for microwave ovens was left open.
- market_id: pm_3
  name: Wholesale market for the manufacture and supply of microwave ovens (at OEM level)
  definition_status: left_open
  notes: Identified as the upstream market in a vertically affected relationship for microwave
    ovens. The overall product market definition for microwave ovens was left open.
- market_id: pm_4
  name: Retail market for microwave ovens (at OBM level)
  definition_status: left_open
  notes: Identified as the downstream market in a vertically affected relationship for microwave
    ovens. The overall product market definition for microwave ovens was left open.
- market_id: pm_5
  name: Wholesale market for the manufacture and supply of built-in kitchen hoods (at OEM level)
  definition_status: left_open
  notes: Identified as the upstream market in a vertically affected relationship for kitchen
    hoods. However, the specific vertical relationship for built-in kitchen hoods was not further
    considered due to negligible market shares. The further segmentation of kitchen hoods into
    built-in and freestanding was left open.
- market_id: pm_6
  name: Retail market for built-in kitchen hoods (at OBM level)
  definition_status: left_open
  notes: Identified as the downstream market in a vertically affected relationship for kitchen
    hoods. However, the specific vertical relationship for built-in kitchen hoods was not further
    considered due to negligible market shares. The further segmentation of kitchen hoods into
    built-in and freestanding was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Manufacture and supply of built-in kitchen hoods (at OBM level) — national (Spain affected)
  definition_status: left_open
  notes: The geographic market for the manufacture and supply of MDAs at OBM level is generally
    national. The Commission indicated that the geographic market definition can be left open
    for the purpose of this decision.
- market_id: gm_2
  name: Manufacture and supply of microwave ovens for third parties (at OEM level) — EEA-wide
  definition_status: left_open
  notes: The geographic market for the manufacture and supply of MDAs at OEM level is considered
    to be at least EEA-wide or global. The Commission indicated that the geographic market definition
    can be left open for the purpose of this decision.
- market_id: gm_3
  name: Retail market for microwave ovens (at OBM level) — national
  definition_status: left_open
  notes: Identified as a downstream market in a vertically affected relationship. The geographic
    market for MDAs at OBM level is generally national, but the definition was left open.
- market_id: gm_4
  name: Wholesale market for the manufacture and supply of microwave ovens (at OEM level) —
    EEA-wide
  definition_status: left_open
  notes: Identified as an upstream market in a vertically affected relationship. The geographic
    market for MDAs at OEM level is at least EEA-wide, but the definition was left open.
- market_id: gm_5
  name: Wholesale market for the manufacture and supply of built-in kitchen hoods (at OEM level)
    — EEA-wide
  definition_status: left_open
  notes: Identified as an upstream market in a vertically affected relationship, but this specific
    vertical relationship was not further considered due to negligible market shares. The geographic
    market for MDAs at OEM level is at least EEA-wide, but the definition was left open.
- market_id: gm_6
  name: Retail market for built-in kitchen hoods (at OBM level) — national (Spain affected)
  definition_status: left_open
  notes: Identified as a downstream market in a vertically affected relationship, but this specific
    vertical relationship was not further considered due to negligible market shares. The geographic
    market for MDAs at OBM level is generally national, but the definition was left open.
theories_of_harm: []
commitments: []
