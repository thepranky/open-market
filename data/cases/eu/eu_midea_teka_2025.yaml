  source_document_id: eu_midea_teka_2025_decision
  page: '3'
  quote_snippet: 'Among the large variety of products produced and supplied by both Parties
    on a number of different markets (at national or EEA-wide level), only two products supplied
    on two specific markets were identified where the combined market shares exceed the limit
    values for the application of the simplified procedure and thus give rise to horizontally
    affected markets requiring further investigation: (i) manufacture and supply of built-in
    kitchen hoods at Original Brand Manufacturer (‘OBM’) level in Spain'
  extraction_method: pdf_extracted
