  source_document_id: eu_midea_teka_2025_decision
  page: '7'
  quote_snippet: Since the Parties’ combined market share in the downstream market is close
    to 0 and the transaction specific increment in the upstream market is negligible, this vertical
    relationship will not be further considered in this decision. On the upstream wholesale
    market for the manufacture and supply of built-in kitchen hoods in the EEA, Midea’s market
    share was [0-5]% in value and [0-5]% in volume, while the market share of Teka was [40-50]%
    in value and [50-60]% in volume, resulting in a combined market share of [40-50]% in value
    and [50-60]% in volume. The downstream market shares of the Parties in the retail market
    for kitchen hoods in Spain are close to 0.
