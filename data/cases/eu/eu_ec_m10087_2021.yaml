  page: '9'
  quote_snippet: Wholesale leased lines are part-circuits that allow telecommunications providers
    to connect their own networks to end user sites for the supply of business connectivity
    services. In addition, wholesale leased lines are an input for the provision of fixed and
    mobile telecommunications services.
