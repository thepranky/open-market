- passage_id: sp_6
  source_document_id: eu_ec_m10087_2021_decision
  page: '11'
  quote_snippet: In light of the above, the Commission considers that, for the purpose of this
    decision, the relevant product market is the overall wholesale supply of leased lines market
    (which includes various wholesale inputs, ranging from leased lines to other wholesale access
    products, which fulfil certain high-quality access requirements). The question whether this
    product market includes dark fiber or not, can be left open as the Transaction would not
    raise serious doubts as to its compatibility with the internal market or the functioning
    of the EEA Agreement under any of the plausible product market definitions considered.
  extraction_method: pdf_extracted
  review_status: unreviewed
