- passage_id: sp_5
  source_document_id: eu_ec_m10087_2021_decision
  page: '9'
  quote_snippet: In previous decisions, the Commission has considered a general product market
    for wholesale supply of leased lines and potential further segmentations between trunk and
    terminating segments, passive and activated lines, as well as according to bandwidth (below/above
    2Mbits/s). The Commission has also considered a further segmentation of the wholesale leased
    lines market into passive (dark fiber) and active infrastructure (traditional managed leased
    lines, Ethernet services with guaranteed bandwidth). Ultimately, the Commission left the
    market definition open.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
