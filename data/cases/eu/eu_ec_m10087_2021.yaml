source_passages:
- passage_id: sp_1
  source_document_id: eu_ec_m10087_2021_decision
  page: '5'
  quote_snippet: 'Wholesale broadband access (also defined as wholesale access to internet services)
    includes different types of access to fixed connections that allow internet service providers
    to provide services to end consumers. It comprises: (i) physical access at a fixed location
    (such as local loop unbundling (“LLU”)17), (ii) non-physical or virtual network access at
    a fixed location (such as “bitstream” access), and (iii) resale of a fixed provider''s internet
    access services (“wholesale resale broadband access”).'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_1
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_2
  source_document_id: eu_ec_m10087_2021_decision
  page: '7'
  quote_snippet: The results of the market investigation are inconclusive regarding whether
    there is a single overall wholesale broadband access market in Belgium. Similarly, the results
    of the market investigation are also inconclusive regarding a possible segmentation (i)
    according to the level where the point of interconnection is situated, that connects the
    infrastructure of the wholesale provider and that of the customer (i.e. local broadband
    access / central broadband access), (ii) according to the type of access to fixed connections,
    or (iii) according to the type of technology (cable or copper / DSL pair / fiber).
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_1
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_3
  source_document_id: eu_ec_m10087_2021_decision
  page: '7'
  quote_snippet: In light of the above, the Commission considers that, for the purpose of this
    decision, the question of the exact scope of the wholesale broadband access market with
    respect to its possible segmentations ((i) the level where the point of interconnection
    is situated (i.e., wholesale local or central broadband access), (ii) the type of access
    to fixed connections (i.e., wholesale LLU, bitstream or resale broadband access), or (iii)
    the type of technology (i.e., cable or copper, DSL pair or fiber)) can be left open as the
    Transaction does not raise serious doubts as to its compatibility with the internal market
    or the functioning of the EEA Agreement under any of the plausible product market definitions
    considered.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
