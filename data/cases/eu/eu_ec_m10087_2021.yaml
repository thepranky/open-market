product_markets_considered:
- market_id: pm_1
  name: Wholesale broadband access
  definition_status: left_open
  notes: The Commission considered segmentations by type of access (LLU, bitstream, resale),
    by interconnection point (local/central broadband access), and by technology (cable or copper
    / DSL pair / fiber), but left the exact definition open.
- market_id: pm_2
  name: Wholesale supply of leased lines
  definition_status: left_open
  notes: The Commission considered segmentations between trunk and terminating segments, passive
    and activated lines, according to bandwidth (below/above 2Mbits/s), and whether to include
    dark fiber, but left the question of including dark fiber open.
- market_id: pm_3
  name: Retail mobile telecommunications services
  definition_status: defined
  notes: The Commission defined an overall market for retail mobile telecommunications services,
    without further subdivisions based on customer type, tariff, network technology, or service
    type.
- market_id: pm_4
  name: Retail fixed voice services
  definition_status: defined
  notes: The Commission defined an overall retail fixed voice market, including all subdivisions
    between local/national and international calls, residential and non-residential customers,
    and Voice over Internet Protocol (“VoIP”) services.
- market_id: pm_5
  name: Retail fixed internet services
  definition_status: defined
  notes: The Commission defined an overall market for retail fixed internet access services,
    excluding FWA services and retail business connectivity services, and without further segmentation
    by customer type, product type, distribution technology, or download speed.
- market_id: pm_6
  name: Retail business connectivity services
  definition_status: left_open
  notes: The Commission considered an overall retail business connectivity market, including
    broadband access for large business customers, leased lines, and VPN services, but left
    open whether it should be segmented by technology or download speed.
- market_id: pm_7
  name: Potential market for the retail supply of multi-play services
  definition_status: left_open
  notes: The Commission left open the question of whether a separate market for multi-play services
    exists, distinct from the underlying individual telecommunications services.
