- passage_id: sp_21
  source_document_id: eu_ec_m10255_2021_decision
  page: '12'
  quote_snippet: Finally, the Notifying Party argues that no competition concerns can be expected
    to arise even when considering narrower local markets within Norway. Indeed, even at the
    level of a catchment area covering Oslo city only or a 100 km radius around Oslo, the Parties
    would hold a combined share of [50-60]% and [40-50]%, respectively, but Aleris would only
    add a de minimis increment of [0-5]% as it operates a single clinic in the area generating
    a very limited turnover in the market for ophthalmological treatments.
