  page: '12'
  quote_snippet: In addition, the vast majority of respondents to the market investigation confirmed
    that, post-Transaction, patients would still have sufficient alternatives left in Norway
    in general and in Oslo specifically, for refractive laser surgery on its own or in combination
    with RLE surgery, and that the Transaction would not materially affect the market conditions
    or lead to increased prices or reduced capacity.
  extraction_method: pdf_extracted
