product_markets_considered:
- market_id: pm_1
  name: Ophthalmological treatments and services
  definition_status: considered
  notes: The Commission considered this as a plausible, broader product market definition.
- market_id: pm_2
  name: Refractive laser surgery
  definition_status: left_open
  notes: The Commission left open the exact product market definition for refractive laser surgery,
    as the transaction did not raise serious doubts irrespective of the alternative market definitions
    considered.
- market_id: pm_3
  name: Refractive lens exchange (RLE) surgery
  definition_status: left_open
  notes: The Commission left open the exact product market definition for RLE surgery, as the
    transaction did not raise serious doubts irrespective of the alternative market definitions
    considered.
- market_id: pm_4
  name: Market for ophthalmological treatments (refractive laser surgery and RLE surgery combined)
  definition_status: considered
  notes: The Commission assessed the transaction based on a combination of refractive laser
    surgery and RLE surgery, referred to as the market for ophthalmological treatments.
- market_id: pm_5
  name: Implantation of intraocular lenses (including RLE, cataract surgery and cataract top-up
    surgery)
  definition_status: considered
  notes: The Commission considered a broader market for the RLE surgery segment, including different
    treatment procedures similar to RLE for the implantation of intraocular lenses.
geographic_markets_considered:
- market_id: gm_1
  name: Ophthalmological treatments and services — national (Sweden and Norway affected)
  definition_status: considered
  notes: The Commission carried out its competitive assessment at a national level for the countries
    where the Parties' activities overlap, although the overall exact geographic market definition
    was left open.
- market_id: gm_2
  name: Ophthalmological treatments and services — city level (Sweden and Norway affected)
  definition_status: considered
  notes: The Commission considered city level as a potentially narrower relevant market, alongside
    national and 100km catchment area scopes, but left the overall exact geographic market definition
    open.
- market_id: gm_3
  name: Ophthalmological treatments and services — 100 km catchment area (Sweden and Norway
    affected)
  definition_status: considered
  notes: The Commission considered a 100 km catchment area as a potentially narrower relevant
    market, alongside national and city level scopes, but left the overall exact geographic
    market definition open.
- market_id: gm_4
  name: Refractive laser surgery — National (Norway affected)
  definition_status: left_open
  notes: The Commission assessed refractive laser surgery in Norway at a national level, consistent
    with its general approach to geographic markets for this decision, but ultimately left the
    exact market definition open.
- market_id: gm_5
  name: Refractive laser surgery — City of Oslo (Norway affected)
  definition_status: left_open
  notes: The Commission assessed refractive laser surgery at the city level for Oslo, consistent
    with its general approach to geographic markets for this decision, but ultimately left the
    exact market definition open.
- market_id: gm_6
  name: Refractive laser surgery — 100 km radius around Oslo (Norway affected)
  definition_status: left_open
  notes: The Commission assessed refractive laser surgery within a 100 km radius around Oslo,
    consistent with its general approach to geographic markets for this decision, but ultimately
    left the exact market definition open.
- market_id: gm_7
  name: RLE surgery — National (Norway affected)
  definition_status: left_open
  notes: The Commission assessed RLE surgery in Norway at a national level, consistent with
    its general approach to geographic markets for this decision, but ultimately left the exact
    market definition open.
- market_id: gm_8
  name: RLE surgery — City of Oslo (Norway affected)
  definition_status: left_open
  notes: The Commission assessed RLE surgery at the city level for Oslo, consistent with its
    general approach to geographic markets for this decision, but ultimately left the exact
    market definition open.
- market_id: gm_9
  name: RLE surgery — 100 km radius around Oslo (Norway affected)
  definition_status: left_open
  notes: The Commission assessed RLE surgery within a 100 km radius around Oslo, consistent
    with its general approach to geographic markets for this decision, but ultimately left the
    exact market definition open.
- market_id: gm_10
  name: RLE surgery — National (Sweden affected)
  definition_status: left_open
  notes: The Commission assessed RLE surgery in Sweden at a national level, consistent with
    its general approach to geographic markets for this decision, but ultimately left the exact
    market definition open.
- market_id: gm_11
  name: RLE surgery — City of Stockholm (Sweden affected)
  definition_status: left_open
  notes: The Commission assessed RLE surgery at the city level for Stockholm, consistent with
    its general approach to geographic markets for this decision, but ultimately left the exact
    market definition open.
- market_id: gm_12
  name: RLE surgery — 100 km radius around Stockholm (Sweden affected)
  definition_status: left_open
  notes: The Commission assessed RLE surgery within a 100 km radius around Stockholm, consistent
