  source_document_id: eu_ec_m10255_2021_decision
  page: '13'
  quote_snippet: In view of the above and the information obtained over the course of the market
    investigation, the Commission considers that the Transaction does not raise serious doubts
    as to its compatibility with the internal market with respect to refractive laser surgery
    in Norway, including the city of or local 100 km catchment area around Oslo, as well as
    on a broader market including both refractive laser surgery and RLE surgery.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
