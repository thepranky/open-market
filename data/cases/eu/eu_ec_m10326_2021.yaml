  source_document_id: eu_ec_m10326_2021_decision
  page: '7'
  quote_snippet: The Commission has previously concluded that the exact market definition of
    the Polish pensions’ system can be left open. In a previous case, the market investigation
    had indicated that obligatory pensions (pillars one and two) and voluntary pensions (pillar
    three) form two separate product markets, but the Commission ultimately left the market
    definition open.
