product_markets_considered:
- market_id: pm_1
  name: Life insurance and its possible sub-segments
  definition_status: left_open
  notes: The Commission considered segmenting the life insurance market by purpose (pure risk,
    pension, savings/investment), customer type (individuals, group/corporate), and type of
    risk covered (based on Polish Insurance Act classifications). However, it ultimately left
    the precise product market definition open.
- market_id: pm_2
  name: Pensions in Poland and its possible sub-segments (open pension funds)
  definition_status: left_open
  notes: The Commission considered segmenting the Polish pensions market into obligatory (pillars
    one and two) and voluntary (pillar three) pensions, but ultimately left the exact market
    definition open.
geographic_markets_considered:
- market_id: gm_1
  name: Life insurance (and its possible sub-segments) — national (Poland affected)
  definition_status: considered
  notes: For the purposes of this decision, the Commission considered the geographic scope of
    the market for life insurance to be national in Poland.
- market_id: gm_2
  name: Pensions (and its possible sub-segments) — national (Poland affected)
  definition_status: considered
  notes: For the purposes of this decision, the Commission considered the geographic scope of
    the market for pensions to be national in Poland.
