- passage_id: sp_2
  source_document_id: eu_ec_m10326_2021_decision
  page: '6'
  quote_snippet: In the present case, the question whether the market for life insurance should
    be further segmented on the basis of the purpose served by the product, customer type and/or
    different risks covered can be left open since the Transaction does not give rise to serious
    doubts as to its compatibility with the internal market or the functioning of the EEA agreement
    under any of these plausible market definitions.
  extraction_method: pdf_extracted
