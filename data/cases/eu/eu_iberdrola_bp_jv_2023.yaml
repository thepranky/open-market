  page: '18'
  quote_snippet: The Commission’s recent decisional practice concluded that the geographic scope
    of the market for e-mobility services is national. This is because eMSPs tend to provide
    a unified nation-wide offer and pricing policy, particularly considering that these services
    are offered as digital applications generally available throughout the country where eMSPs
    are active.
  extraction_method: pdf_extracted
