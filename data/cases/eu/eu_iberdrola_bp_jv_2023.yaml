  source_document_id: eu_iberdrola_bp_jv_2023_decision
  page: '15'
  quote_snippet: A large majority of the CPOs who responded to the market investigation are
    active at a national level in Spain and/or Portugal. Of those, the majority set their prices
    uniformly at the national level, though some set prices at a regional or local level. This
    confirms that the market has elements of national competition.
  extraction_method: pdf_extracted
