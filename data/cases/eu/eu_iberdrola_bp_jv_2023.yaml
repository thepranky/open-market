- passage_id: sp_13
  source_document_id: eu_iberdrola_bp_jv_2023_decision
  page: '16'
  quote_snippet: Based on the above, the Commission considers that, for the purposes of this
    Decision, for both Spain and Portugal the market for the installation, operation and maintenance
    of public EV charging stations is national in scope with elements of local competition.
    For that reason, in addition to the analysis at the national level, the local impact of
    the Transaction will be analysed on the basis of local catchment areas.
  extraction_method: pdf_extracted
