- passage_id: sp_2
  source_document_id: eu_iberdrola_bp_jv_2023_decision
  page: '12'
  quote_snippet: Based on the above, the Commission considers that, for the purposes of this
    Decision, the product market for the installation, operation and maintenance of public EV
    charging stations should be segmented by charging speeds between regular, fast and ultra-fast,
    and that the exact delineation of what constitutes regular, fast and ultra-fast charging
    speeds can be left open because the Transaction does not raise serious doubts as to its
    compatibility with the internal market under either of the two plausible delineations of
    charging speed (i.e., either <22 kW / 22-100 kW / >100 kW or <22 kW / 22-150 kW / >150 kW).
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_1
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_3
  source_document_id: eu_iberdrola_bp_jv_2023_decision
  page: '13'
  quote_snippet: Based on the above, the Commission considers that, for the purposes of this
    Decision, it can be left open whether the product market for the installation, operation
    and maintenance of public EV charging stations should be segmented between on- and off-motorway
    charging stations, because the Transaction does not raise serious doubts as to its compatibility
    with the internal market under any plausible market definition. The assessment will focus
    on the narrowest plausible markets, i.e. separate markets for on- and off-motorway public
    EV charging stations.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_1
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_4
  source_document_id: eu_iberdrola_bp_jv_2023_decision
  page: '17'
  quote_snippet: The Commission has previously considered the market for the provision of e-mobility
    services as a separate market from the market for the installation, operation and maintenance
    of public EV charging stations. However, the Commission left open whether further segmentations
    of this market are required, e.g., based on the charging speed of the EV charging stations
    available through a particular e-mobility service.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_2
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_5
  source_document_id: eu_iberdrola_bp_jv_2023_decision
  page: '18'
  quote_snippet: Based on the above, the Commission considers that, for the purposes of this
    Decision and in line with previous practice, there is a market for the provision of e-mobility
    services, and that it can be left open as to whether further segmentations of this market
    are required, i.e, based on the charging speed of the EV charging stations available through
    a particular e-mobility service and/or for on- and off-motorway EV charging stations, because
    the Transaction does not raise serious doubts as to its compatibility with the internal
    market under any plausible segmentation of the market for the provision of e-mobility services.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_2
  supports_geographic_markets: []
  supports_theories: []
