product_markets_considered:
- market_id: pm_1
  name: Installation, operation and maintenance of EV charging stations
  definition_status: segmented
  notes: The Commission segmented the product market between public and private EV charging
    stations. It further segmented public EV charging stations by charging speeds (regular,
    fast, and ultra-fast) and left open the exact delineation of these speed categories. It
    also left open whether there are separate markets for on- and off-motorway public EV charging
    stations.
- market_id: pm_2
  name: Provision of e-mobility services
  definition_status: left_open
  notes: The Commission considered there is a market for the provision of e-mobility services
    and left open whether further segmentations based on charging speed or location (on-/off-motorway)
    are required.
- market_id: pm_3
  name: Ownership or operation of land and sites suitable for EV charging stations
  definition_status: left_open
  notes: The Commission considered the relevant product market to be the ownership or operation
    of land and sites suitable for EV charging stations, and left open whether it should be
    further segmented by type of site (fuel station sites or non-fuel station sites).
- market_id: pm_4
  name: Retail supply of electricity to large customers connected to high and medium voltage
    grid
  definition_status: defined
  notes: null
- market_id: pm_5
  name: Retail supply of electricity to small industrial and residential customers connected
    to low voltage grid
  definition_status: defined
  notes: null
geographic_markets_considered:
- market_id: gm_1
  name: Installation, operation and maintenance of public EV charging stations — national with
    local elements (Spain and Portugal affected)
  definition_status: considered
  notes: The Commission considered the market to be national in scope with elements of local
    competition in both Spain and Portugal. The local impact of the Transaction was analyzed
    based on local catchment areas, using various distance metrics.
- market_id: gm_2
  name: Provision of e-mobility services — national (Spain and Portugal affected)
  definition_status: defined
  notes: null
- market_id: gm_3
  name: Ownership or operation of land and sites suitable for EV charging stations — national
    (Spain and Portugal affected)
  definition_status: defined
  notes: null
- market_id: gm_4
  name: Retail supply of electricity — national (Spain and Portugal affected)
  definition_status: defined
  notes: null
