product_markets_considered:
- market_id: pm_1
  name: Asset management
  definition_status: left_open
  notes: The Commission considered various segmentations for asset management, including by
    customer type (retail vs. institutional) and product type (mutual funds, tailor-made funds,
    portfolio management), as well as further sub-segmentations (e.g., active vs. passive asset
    management for institutional clients). However, the precise definition was ultimately left
    open for the purpose of this decision.
- market_id: pm_2
  name: Fund administration
  definition_status: considered
  notes: The Commission considered fund administration to constitute a distinct product market
    based on previous cases and confirmed by the market investigation, encompassing back office
    and middle office activities.
- market_id: pm_3
  name: Insurance provision
  definition_status: considered
  notes: The Commission referenced previous decisions distinguishing between a market for insurance
    provision and insurance distribution, and further segmenting insurance provision into life
    insurance, non-life insurance, and reinsurance.
- market_id: pm_4
  name: Life insurance provision
  definition_status: left_open
  notes: The Commission referenced previous decisions that segmented life insurance provision
    by purpose (pure risk protection, savings/investment, pension products) and by customer
    type (group vs. individual products). For the purpose of this decision, the exact scope
    of the market was left open.
- market_id: pm_5
  name: Non-life insurance provision
  definition_status: left_open
  notes: The Commission referenced previous decisions that distinguished non-life insurance
    into various segments (e.g., accident and sickness, motor vehicle, property, credit and
    suretyship). Further segmentation for credit and suretyship was also noted. For the purpose
    of this decision, the exact scope of the market was left open.
- market_id: pm_6
  name: Reinsurance
  definition_status: left_open
  notes: The Commission referenced previous decisions that identified reinsurance as a broad
    category within insurance provision. For the purpose of this decision, the exact scope of
    the market was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Asset management — national or EEA-wide
  definition_status: left_open
  notes: The Commission considered previous findings that the geographic market for asset management
    could be national or EEA-wide, with institutional asset management likely wider than national.
    The market investigation confirmed the international nature of competition. However, the
    precise definition was left open.
- market_id: gm_2
  name: Fund administration — national or worldwide
  definition_status: left_open
  notes: The Commission considered previous decisions that left open whether the geographic
    market for fund administration should be considered national or wider in scope (e.g., worldwide).
    The precise geographic scope was left open for this case.
- market_id: gm_3
  name: Life insurance provision — national
  definition_status: left_open
  notes: The Commission considered previous findings that the geographic market for the provision
    of life insurance and its respective segments is national in scope. However, for the purpose
    of this decision, the exact geographic market definition was left open.
- market_id: gm_4
  name: Non-life insurance provision — national
  definition_status: left_open
  notes: The Commission considered previous findings that the geographic market for non-life
    insurance and its segments is generally national in scope, with the exception of large commercial
    risks (specialty insurance) which is likely at least EEA-wide. However, for the purpose
    of this decision, the exact geographic market definition was left open.
- market_id: gm_5
  name: Reinsurance — global
  definition_status: considered
  notes: The Commission referenced previous findings that the geographic scope of the reinsurance
    market has been considered global due to the need to pool risks on a worldwide basis.
theories_of_harm: []
commitments: []
