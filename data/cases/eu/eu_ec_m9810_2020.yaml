  quote_snippet: In its decisional practice, the Commission considered a relevant product market
    for asset management overall, including the creation and management of mutual funds which
    are then marketed on an “off-the-shelf” basis (including to retail customers), the provision
    of portfolio management services to institutional investors (pension funds, institutions
    and international organisations), and the provision of custody services related to asset
    management.
