  supports_commitments: []
- passage_id: sp_4
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '10'
  quote_snippet: The results of the market investigation confirm that the conclusions reached
    by the Commission in its previous practice are still valid for Greece today. The Commission
    therefore considers that gas networks for the transmission of gas are natural monopolies
    and each of them constitute a distinct product market.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
