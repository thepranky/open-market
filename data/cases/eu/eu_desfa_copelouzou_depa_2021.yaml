- passage_id: sp_9
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '11'
  quote_snippet: The results of the market investigation confirm that a gas storage market has
    not yet developed in Greece. A number of respondents confirmed that there is currently no
    storage facility for natural gas in Greece. A clear majority of customers also confirmed
    that short-term storage provided by LNG terminals cannot be considered as equivalent to
    underground gas storage services.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
