- passage_id: sp_15
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '14'
  quote_snippet: The Notifying Parties note that in Greece the Trans Adriatic Pipeline (“TAP”)
    (running across Greece from the Turkish border to Albania and into Italy) is now operational
    and is thus a second balancing zone or entry-exit system where the amount of gas put into
    the system balances with the amount taken out (in addition to the balancing zone associated
    with DESFA’s transmission network). Given that it is an international pipeline its balancing
    zone is wider than Greece. However, given that TAP cannot currently be used for physical
    gas transportation services between two points in Greece, on a conservative basis the Parties
    provided their analysis of the market for the transmission of natural gas as the NNGTS balancing
    zone encompassing the territory of Greece.
  extraction_method: pdf_extracted
  review_status: unreviewed
