- passage_id: sp_3
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '9'
  quote_snippet: The results of the market investigation conducted in the present case indicated
    that most entities that import gas in Greece do so by using both pipelines and regasification
    terminals. The majority of those respondents who provided a definite answer consider that
    regasification terminals and pipelines are interchangeable facilities in order to carry
    out the import of gas. However, a number of respondents consider the two types of infrastructures
    to be more complementary than substitutable solutions.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
