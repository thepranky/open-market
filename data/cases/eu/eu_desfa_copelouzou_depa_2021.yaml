- passage_id: sp_14
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '14'
  quote_snippet: In its past decisional practice, the Commission has generally considered the
    market for gas transmission to be national, although noting that the region covered by the
    physical infrastructure grid constitutes the narrowest possible delineation of the geographic
    market.
  extraction_method: pdf_extracted
