- passage_id: sp_2
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '10'
  quote_snippet: The Commission considers that, for the purposes of this decision, it may be
    left open whether pipelines and regasification terminals belong to the same relevant product
    market or belong to separate relevant product markets, as the Transaction does not lead
    to serious doubts as to its compatibility with the internal market, regardless of the market
    definition adopted.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
