  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_5
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '10'
  quote_snippet: The transmission of natural gas consists of physical gas transportation services
    via high-pressure pipelines to gas wholesale suppliers that aim to resell their gas either
    to other gas wholesalers, to distributors, or to large industrial customers that are directly
    connected to the gas transmission network.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
