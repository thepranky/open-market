- passage_id: sp_13
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '14'
  quote_snippet: A majority of the respondents confirmed in the market investigation that the
    Commission’s decisional practice of considering the market for gas transmission systems
    as being national, covering the physical infrastructure grid, is still valid for Greece
    today. In this respect, one customer noted that “DESFA is the only TSO operating on national
    scale.” The Commission therefore considers the market for gas transmission to be national
    in scope, in line with its decisional practice.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets: []
