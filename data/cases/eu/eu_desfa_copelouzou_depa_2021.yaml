- passage_id: sp_1
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '9'
  quote_snippet: 'In previous decisions, the Commission considered the question whether the
    market for infrastructure for gas imports could be sub-segmented into the following markets:
    (i) regasification services for the import of liquid natural gas; (ii) interconnection points
    with international gas pipelines; and (iii) underground gas storage.'
  extraction_method: pdf_extracted
  review_status: unreviewed
