- passage_id: sp_7
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '11'
  quote_snippet: In view of the above, the Commission considers that gas storage belongs to
    a separate market. As the Parties are not active in such a market and there is currently
    no gas storage market in Greece, in this Decision gas storage will not be dealt with further.
  extraction_method: pdf_extracted
