  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '11'
  quote_snippet: The results of the market investigation with regard to the geographic scope
    of the market for infrastructure for gas imports point to it being national in scope. The
    majority of competitors submitted that the market is national in scope.
  extraction_method: pdf_extracted
  review_status: unreviewed
