- passage_id: sp_10
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '14'
  quote_snippet: In light of the above, including the responses to the market investigation
    and the view of the Notifying Parties, the Commission considers that the geographic market
    for gas import infrastructure and the possible sub-segment for regasification terminals
    is national, or even wider (comprising Greece and other countries in South East Europe).
    For the purposes of this Decision, the question can be left open, as the Transaction does
    not lead to serious doubts as to its compatibility with the internal market regardless of
    the market definition adopted in this respect.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
