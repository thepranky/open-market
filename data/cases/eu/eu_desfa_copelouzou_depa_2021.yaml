- passage_id: sp_12
  source_document_id: eu_desfa_copelouzou_depa_2021_decision
  page: '11'
  quote_snippet: The Notifying Parties submit that, given Greece’s land and sea borders, the
    positioning of gas import infrastructure in the wider region, and the technical specifications
    of the Greek gas infrastructure, in this case the market should not be delineated on a national
    basis, but should instead comprise at least Greece, the Balkans and countries of South and
    Eastern Europe, as well as Turkey.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets: []
  supports_geographic_markets:
