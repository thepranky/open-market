product_markets_considered:
- market_id: pm_1
  name: Flavours
  definition_status: left_open
  notes: The Notifying Party proposed 'flavour solutions' but stated the definition could be
    left open. The Commission's past practice considered a single market for flavours, with
    potential segmentation by application (savoury food, sweet food, dairy, beverages, pharmaceuticals)
    and between 'natural' and 'non-natural' flavours. The market investigation revealed customers
    and competitors consider flavour solutions for savoury food significantly different from
    those for sweet food and beverages, and highly customised. However, the Commission ultimately
    left the exact product market definition open, as no concerns would arise even under the
    narrowest plausible definition.
- market_id: pm_2
  name: Functional ingredients
  definition_status: left_open
  notes: The Notifying Party proposed 'functional solutions'. The Commission's past practice
    found enzymes and emulsifiers to constitute distinct markets, but ultimately left the definitions
    open, including further segmentations within each (industrial/specialty enzymes; synthetic/lecithin-derived
    emulsifiers). The market investigation revealed customers and competitors consider functional
    solutions for savoury food significantly different from those for sweet food and beverages,
    and highly customised. The Commission ultimately left the exact product market definition
    open, as no concerns would arise even under the narrowest plausible definition.
- market_id: pm_3
  name: Systems
  definition_status: left_open
  notes: The Notifying Party contested separate markets for flavour and functional systems/blends,
    preferring 'flavor solutions' and 'functional solutions'. The Commission's past practice
    considered a distinct market for 'systems for food applications' and also 'functional ingredient
    systems', but ultimately left these open. The Commission ultimately left the exact product
    market definition for systems open, as no competition concerns would arise even if narrower
    markets (systems for food applications and functional ingredient systems) were defined.
- market_id: pm_4
  name: Colour ingredients for food production
  definition_status: left_open
  notes: The Notifying Party accepted 'colour ingredients for food production' but submitted
    the market definition could be left open. The Commission's past practice considered the
    existence of such a market but left the precise definition open. The Commission ultimately
    left the exact product market definition open, as no competition concerns would arise regardless
    of definition.
- market_id: pm_5
  name: Cultures
  definition_status: left_open
  notes: The Notifying Party accepted 'cultures', with possible segmentation by end-application
    (dairy, meat, plant-based food), but submitted the definition could be left open. The Commission's
    past practice considered a separate market for cultures and segmentations between dairy,
    meat, and plant-based food cultures, but ultimately left the definition open. The Commission
    ultimately left the exact product market definition for cultures open, as no concerns would
    arise even if narrower markets were defined.
- market_id: pm_6
  name: Casings
  definition_status: left_open
  notes: The Notifying Party accepted 'casings', with possible segmentation between man-made
    and natural casings, but submitted the definition could be left open. The Commission's past
    practice considered a broader market for casings and segmentation between man-made and natural
    casings, but ultimately left the question of sub-segmentation open. The Commission ultimately
    left the exact product market definition for casings open, as no concerns would arise even
    if narrower markets were defined.
- market_id: pm_7
  name: Smoked herring
  definition_status: left_open
  notes: The Notifying Party considered a single market for 'all processed pelagic fish' but
    left the definition open. The Commission's past practice distinguished secondary processing
    of pelagic fish from primary, and considered further segmentation by fish species (mackerel,
    herring, sardines). The Commission ultimately left the exact product market definition for
    smoked herring open, as no competition concerns would arise even if narrower markets (based
    on fish species) were defined.
- market_id: pm_8
  name: Vegetable-based bread toppings
  definition_status: left_open
  notes: The Notifying Party considered a single market for 'all vegetable-based bread toppings'
    but left the definition open. The Commission's past practice considered sweet and savoury
    spreadable products as separate markets, and further considered distinctions within savoury
    bread toppings (vegetable-, seafood-, meat-based) and within vegetable-based toppings (fresh/ambient,
    organic/non-organic), but left all precise definitions open. The Commission ultimately left
    the exact product market definition for vegetable-based bread toppings open, as no competition
    concerns would arise even if narrower markets were defined.
- market_id: pm_9
  name: Plant-based milk
  definition_status: left_open
  notes: The Notifying Party accepted that the relevant product market could be 'plant-based
    milk' but left the definition open. The Commission's past practice distinguished between
    plant-based milk and dairy-based milk, but ultimately left the market definition open. The
    Commission ultimately left the exact product market definition open, as no competition concerns
    would arise even if narrower markets (i.e. plant-based milk) were defined.
geographic_markets_considered:
- market_id: gm_1
  name: Flavours — EEA-wide or worldwide
  definition_status: left_open
  notes: The Notifying Party submitted the relevant geographic market is worldwide, but left
    the definition open. Commission's past practice considered the market for flavours to be
    at least EEA-wide and potentially global. The Commission's assessment confirmed the geographic
    market for relevant food ingredients is EEA-wide or worldwide. The Commission ultimately
    left the exact geographic market definition open, as no competition concerns would arise
    regardless of whether it is defined as EEA-wide or worldwide.
- market_id: gm_2
  name: Functional ingredients — EEA-wide or worldwide
  definition_status: left_open
  notes: The Notifying Party submitted the relevant geographic market is worldwide, but left
    the definition open. Commission's past practice considered both emulsifiers and enzymes,
    including all potential segmentations, to be EEA-wide or global in scope. The market investigation
    confirmed the geographic market for relevant food ingredients is EEA-wide or worldwide.
    The Commission ultimately left the exact geographic market definition open, as no competition
    concerns would arise regardless of whether it is defined as EEA-wide or worldwide.
- market_id: gm_3
  name: Systems for food applications — EEA or worldwide
  definition_status: left_open
  notes: The Notifying Party submitted the definition could be left open. The Commission's past
    practice considered whether the geographic dimension for systems for food applications is
    global, but left it open. The Commission ultimately left the exact geographic market definition
    open, as no competition concerns would arise regardless of whether it is defined as EEA
    or worldwide.
- market_id: gm_4
  name: Colour ingredients for food production — EEA-wide or worldwide
  definition_status: left_open
  notes: The Notifying Party considered the relevant geographic market to be worldwide, but
    left the definition open. The Commission's past practice considered the geographic market
    to be at least EEA-wide but left it open. The Commission ultimately left the exact geographic
    market definition open, as no competition concerns would arise regardless of whether it
    is defined as EEA-wide or worldwide.
- market_id: gm_5
  name: Cultures — EEA-wide or worldwide
  definition_status: left_open
  notes: The Notifying Party submitted the relevant geographic market is worldwide, but left
    it open. The Commission's past practice considered whether the market for cultures is EEA-wide
    or worldwide but left the definition open. The Commission ultimately left the exact geographic
    market definition open, as no competition concerns would arise regardless of whether it
    is defined as EEA-wide or worldwide.
- market_id: gm_6
  name: Casings — EEA-wide or worldwide
  definition_status: left_open
  notes: The Notifying Party suggested the geographic market for casings is EEA-wide but left
    the definition open. The Commission's past practice considered whether the market for casings
    is EEA-wide, but left it open. The Commission ultimately left the exact geographic market
    definition open, as no competition concerns would arise regardless of whether it is defined
    as EEA-wide or worldwide.
- market_id: gm_7
  name: Smoked herring — national (France affected)
  definition_status: left_open
  notes: The Notifying Party left the geographic market definition open. The Commission's past
    practice considered markets for secondary processed pelagic herring products to be national
    in scope. The Commission ultimately left the exact geographic market definition open, as
    no competition concerns would arise regardless of whether it is defined as national or wider.
- market_id: gm_8
  name: Vegetable-based bread toppings — national (France affected)
  definition_status: left_open
  notes: The Notifying Party left the geographic market definition open. The Commission's past
    practice considered the potential market for vegetable-based savoury bread toppings to be
    national in scope. The Commission ultimately left the exact geographic market definition
    open, as no competition concerns would arise regardless of whether it is defined as national
    or wider.
- market_id: gm_9
  name: Plant-based milk — national (France affected)
  definition_status: left_open
  notes: The Notifying Party left the geographic market definition open. The Commission's past
    practice considered the market for the distribution of beverages to be national. The Commission
    ultimately left the exact geographic market definition open, as no competition concerns
    would arise regardless of whether it is defined as national or wider.
