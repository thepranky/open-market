  source_document_id: eu_cma_cgm_bollore_logistics_2024_decision
  page: '2'
  quote_snippet: In previous decisions, the Commission defined the product market for the provision
    of container liner shipping services as the provision of regular, scheduled services for
    the carriage of cargo by container. This market can be distinguished from non-liner shipping
    (tramp, specialised transport) because of the regularity and frequency of the service. In
    addition, the use of containers separates these services from other non-containerised transport
    services, such as the transport of bulk cargo.
