product_markets_considered:
- market_id: pm_1
  name: Container liner shipping services
  definition_status: defined
  notes: Defined as the provision of regular, scheduled services for the carriage of cargo by
    container, distinguished from non-liner shipping and non-containerised transport services.
- market_id: pm_2
  name: Deep-sea container liner shipping services
  definition_status: defined
  notes: Defined as a segment of container liner shipping, involving the offer of regular, scheduled
    services for the sea transportation of containerised cargo.
- market_id: pm_3
  name: Deep-sea container liner shipping services — Reefer vs. Dry Containers
  definition_status: left_open
  notes: Possible narrower market for transport of refrigerated (reefer) containers, distinct
    from non-refrigerated (dry) containers, considered relevant when reefer containers represent
    10% or more of all containerised cargo on both legs of a trade. The exact definition was
    left open, but the Commission assessed the effects based on this narrower plausible delimitation.
- market_id: pm_4
  name: Short-sea container liner shipping services
  definition_status: defined
  notes: Defined as a segment of container liner shipping, involving the provision of regular,
    scheduled intra-continental (usually coastal trade) services for the sea transportation
    of containerised cargo.
- market_id: pm_5
  name: Short-sea container liner shipping services — Wheeled Cargo (Ro-Ro)
  definition_status: left_open
  notes: The Commission left open whether the transport of wheeled cargo (roll-on/roll-off or
    Ro-Ro shipping) belongs to the market for short-sea container liner shipping services. CMA
    CGM's activity in Ro-Ro services is marginal.
- market_id: pm_6
  name: Short-sea container liner shipping services — Reefer vs. Dry Containers
  definition_status: left_open
  notes: The Commission left open whether the provision of short-sea container liner shipping
    services should be sub-segmented between refrigerated (reefer) and non-refrigerated (dry)
    container shipping services, whenever the share of reefer containers is 10% or more on both
    legs of a trade. Market investigation confirmed the appropriateness of the distinction,
    and the Commission assessed the effects by reference to all plausible delimitations.
- market_id: pm_7
  name: Freight forwarding services
  definition_status: defined
  notes: Defined as the organisation of transportation of items on behalf of customers, possibly
    including activities such as customs clearance, warehousing, and ground services.
- market_id: pm_8
  name: Freight forwarding services — Domestic vs. Cross-border & Modes of Transport
  definition_status: left_open
  notes: 'The Commission considered segmenting freight forwarding services between domestic
    and cross-border, and by modes of transport (air, land, sea). Market investigation was inconclusive
    on these segmentations. The exact market definition was left open, but the assessment was
    conducted by reference to the narrowest plausible definitions: domestic and cross-border
    services, segmented by modes of transport.'
- market_id: pm_9
  name: Freight forwarding services — Type of Transported Goods
  definition_status: left_open
  notes: The Commission's investigation found that a segmentation based on types of transported
    goods is not appropriate, as most freight forwarders do not specialise by goods type.
- market_id: pm_10
  name: Contract logistics services
  definition_status: defined
  notes: Defined as the part of the supply chain process that plans, implements, and controls
    the efficient and effective flow and storage of goods, services, and related information
    from origin to consumption to meet customer requirements. Identified as a distinct product
    market from bare transportation, freight forwarding, or warehousing services.
- market_id: pm_11
  name: Contract logistics services — Type of Operations, Goods/Industry, Logistics Provider
  definition_status: left_open
  notes: The Commission previously considered segmenting contract logistics markets by (i) cross-border
    vs. domestic, (ii) type of goods/industry, and (iii) Lead Logistics Providers (LLPs) vs.
    traditional logistics providers (3PLs), but left the precise scope open. Market investigation
    results generally supported these segmentations. The exact definition was left open, but
    the assessment was conducted by reference to the narrowest plausible delimitations based
    on these criteria.
- market_id: pm_12
  name: Finished Vehicle Logistics (FVL) services
  definition_status: left_open
  notes: The Commission considered a potential separate market for FVL services, involving specific
    know-how for car manufacturers' supply chains. Segmentation by vehicle type and mode of
    transport (rail, road, sea) was also considered. Bolloré Logistics' activity in FVL is marginal
    and was not further discussed in this decision.
geographic_markets_considered:
- market_id: gm_1
  name: Deep-sea container liner shipping services — one-way legs of trade
  definition_status: defined
  notes: The geographic market for deep-sea container liner shipping services is defined on
    the basis of one-way legs of trade, where several ports within the same geographic area
    are generally substitutable. The Commission will assess effects based on legs of trade connecting
    regions of substitutable ports (e.g., North America, Far East Asia, etc.).
- market_id: gm_2
  name: Deep-sea container liner shipping services — North Europe vs. Mediterranean
  definition_status: left_open
  notes: Market investigation responses were mixed on whether to differentiate between North
    Europe and Mediterranean regions within Europe. The question was left open, but the Commission
    conducted its assessment distinguishing these regions as the narrowest plausible segmentation.
- market_id: gm_3
  name: Deep-sea container liner shipping services — French Overseas Territories (Martinique,
    Guadeloupe, French Guiana, Réunion, Mayotte) vs. wider regions
  definition_status: left_open
  notes: The Commission's market investigation revealed reasons to consider distinct markets
    for deep-sea container liner shipping services in legs of trade to/from Martinique, Guadeloupe,
    French Guiana, Réunion, and Mayotte, due to specificities and limited substitutability with
    other ports in their respective regions. The exact geographic market definition was left
    open, but the assessment was conducted by reference to these narrower plausible delimitations.
- market_id: gm_4
  name: Short-sea container liner shipping services — single legs of trade (North Europe and
    Mediterranean)
  definition_status: left_open
  notes: The Commission considered the geographic market for short-sea container liner shipping
    services to be defined on the basis of either single trades/corridors or single legs of
    trade. The exact definition was left open, but the Commission assessed the effects by reference
    to the narrowest plausible delimitations, i.e., single legs of trade within North Europe
    and Mediterranean regions.
- market_id: gm_5
  name: Freight forwarding services — national or wider
  definition_status: left_open
  notes: The Commission left open whether the geographic scope of freight forwarding services
    should be national or wider (e.g., EEA-wide), as market investigation results were inconclusive.
    The assessment was conducted by reference to the narrowest plausible delimitations, i.e.,
    nation-wide markets.
- market_id: gm_6
  name: Sea freight forwarding services — infra-national (French Overseas Territories)
  definition_status: left_open
  notes: The Commission's market investigation found reasons to consider distinct infra-national
    markets for sea freight forwarding services in Martinique, Guadeloupe, French Guiana, Saint
    Martin, Réunion, and Mayotte due to geographic isolation, unique supply structures, specific
    know-how requirements, and distinct demand patterns. The exact definition was left open,
    but the assessment was conducted by reference to these narrower segments of the French market.
- market_id: gm_7
  name: Contract logistics services — national or EEA-wide
  definition_status: left_open
  notes: The Commission previously found the contract logistics market to be EEA-wide, leaving
    open a possible segmentation into national markets. Market investigation responses were
    mixed, with some considering it worldwide/EEA-wide and others noting national sourcing.
    The exact definition was left open, but the assessment was conducted by reference to the
    narrowest plausible delimitations, i.e., nation-wide markets.
- market_id: gm_8
  name: Finished Vehicle Logistics (FVL) services — EEA-wide or national
  definition_status: left_open
  notes: For a potential FVL segment, the Commission considered the geographic scope could be
    either EEA-wide or national, but ultimately left the exact geographic market definition
    open.
