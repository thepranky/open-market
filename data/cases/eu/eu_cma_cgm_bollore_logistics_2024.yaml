  page: '13'
  quote_snippet: 'For purposes of the present case, the exact geographic market definition may
    be left open, given that the Transaction does not raise serious doubts as to its compatibility
    with the internal market or the functioning of the EEA Agreement with respect to the provision
    of short-sea container liner shipping services under any plausible market definition. The
    Commission will assess the effects of the Transaction by reference to the narrowest plausible
    geographic market delimitations, i.e., single legs of trade: (a) North Europe: – From/to
    Baltic States (Estonia, Latvia, and Lithuania) to/from British Isles (United-Kingdom and
    Ireland); – From/to Baltic States to/from Iberia (Spain, Portugal, and Gibraltar); – From/to
    Baltic States to/from Poland; and – From/to Iberia to/from British Isles. (b) Mediterranean:
    – Intra-Med; – Intra-East Med; and – Intra-West Med.'
