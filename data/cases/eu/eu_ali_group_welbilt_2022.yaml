source_passages:
- passage_id: sp_1
  source_document_id: eu_ali_group_welbilt_2022_decision
  page: '5'
  quote_snippet: 'As serious doubts would arise irrespective of the product market definition
    and considering that the commitments offered by the Notifying Party solve those serious
    doubts irrespective of the relevant product market considered, the exact product market
    definition can be left open. For the purpose of this decision, the effects of the concentration
    will be assessed for the combined direct and indirect sales channels for (i) a possible
    overall market for ice-making machines; and (ii) possible distinct markets for each ice-making
    machine type: modular cubers (with and without the accessories), self-contained cubers,
    flake ice-making machines, scale ice-making machines and nugget ice-making machines.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-12'
  supports_markets:
  - pm_1
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_2
  source_document_id: eu_ali_group_welbilt_2022_decision
  page: '5'
  quote_snippet: 'The results of the market investigation confirmed the Commission’s previous
    finding that the various types of ice-making machines mentioned in paragraph (12) are part
    of different product markets. A large majority of customers and the majority of competitors18
    consider that the different types of ice machines are not substitutable for the final customers
    and their commercial needs, in particular because of size of the ice making machine, characteristics
    of the ice produced, scope of use etc. More specifically, the majority of customers agree
    that modular cubers (which may come with accessories such as: storage bins and dispensers),
    self-contained cubers, flake ice-making machines, and scale ice-making machines constitute
    separate product markets.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-12'
  supports_markets:
  - pm_1
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_3
  source_document_id: eu_ali_group_welbilt_2022_decision
  page: '4'
  quote_snippet: The Notifying Party acknowledges that the Commission previously found separate
    markets for various sub-segments of ice-making machines, but considers that the degree of
    supply-side and demand-side substitutability could lead to wider markets. From a supply
    side production lines of ice-making machines are flexible, and many manufacturers supply
    all types of products and customers. From the customers’ perspective, the Notifying Party
    considers that they can easily substitute between one type of ice machine and another. The
    Parties submit that is not necessary to define the relevant markets since the proposed remedy
    will eliminate all overlaps for ice-making machines.
  extraction_method: pdf_extracted
