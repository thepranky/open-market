  page: '8'
  quote_snippet: The outcome of the Commission’s market investigation provides strong indications
    that speed oven product markets comprise those types of ovens that allow faster cooking
    times than conventional ovens by combining at least microwave and either convection or impingement
    technology, regardless of size and sales channel. Under the Notifying Party’s terminology,
    this would include high-speed ovens and accelerated ovens, and exclude fast ovens and accelerated
    panini presses from the product scope of the relevant market.
  extraction_method: pdf_extracted
