- passage_id: sp_34
  source_document_id: eu_ali_group_welbilt_2022_decision
  page: '6'
  quote_snippet: The Notifying Party submit that the relevant geographic market is at least
    EEA-wide, if not even wider in certain instances (i.e., for global key accounts). At the
    production level of the value chain, where the Parties are active, competition occurs between
    manufacturers for supply opportunities (notably key accounts and distributors) across the
    EEA. Customers at this level of the value chain, in turn, will search for suppliers across
    the EEA rather than localized at the national level. Products are shipped across the EEA
    to customers, if not over even wider distances (i.e., Welbilt supplies its ice-making machine
    to the EEA from […]) and prices are homogeneous across the EEA. Therefore, in the Parties'
    view the concentration should be assessed on an EEA-wide basis.
