- passage_id: sp_19
  source_document_id: eu_ali_group_welbilt_2022_decision
  page: '8'
  quote_snippet: First, with respect to heating technology, the majority of both competitors
    and customers confirmed that an oven needs to combine at least microwave and either convection
    or impingement, to effectively compete in the speed oven market.40 Contrary to the Notifying
    Party’s claims, a majority of customers41 and competitors42 do not consider fast ovens,
    i.e. multi-technology ovens without microwave, such as Lincat’s CiBO, or accelerated panini
    presses, i.e. multi-technology panini presses without convection, such as Electrolux’s SpeeDelight,
    to be in competition with speed ovens.
  extraction_method: pdf_extracted
  review_status: unreviewed
