  title: MERCEDES-BENZ / TOTALENERGIES / STELLANTIS / ACC — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.10524
  pdf_url: http://publications.europa.eu/resource/cellar/2b0c2de2-d859-11ec-a95f-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Manufacture and supply of battery cells and modules
  definition_status: left_open
  notes: The Commission considered the precise market definition for the manufacture and supply
    of battery cells and modules for the automotive sector to be left open, but analyzed the
    market for battery cells and modules (excluding battery systems) using Li-ion technology
    as the narrowest plausible product market for assessing vertical effects.
- market_id: pm_2
  name: Segmentation of battery cells and modules by product form (cells/modules vs. battery
    packs/systems)
  definition_status: left_open
  notes: The Commission had previously considered but left open whether to further segment the
    market into modules or integrated battery packs. The market investigation confirmed a distinction
    between cells/modules and packs/systems, but the Commission ultimately left the precise
    segmentation open for the purposes of this decision, while focusing its analysis on cells
    and modules (excluding battery systems) given ACC's activities.
- market_id: pm_3
  name: Segmentation of battery cells and modules by technology (Li-ion vs. NiMH)
  definition_status: left_open
  notes: The Commission previously indicated a possible distinction by cell technology but left
    it open. The market investigation found that a distinction between Li-ion and NiMH was not
    warranted due to the marginal role of NiMH. The Commission ultimately left the precise segmentation
    open, while focusing its analysis on Li-ion technology given ACC's activities.
- market_id: pm_4
  name: Manufacture and supply of passenger cars
  definition_status: left_open
  notes: The Commission previously considered separate markets for PCs and LCVs, and segments
    of PCs by size/type and propulsion technology. For the purpose of this decision, the exact
    market definition for PCs and its potential sub-segments was left open, but the assessment
    focused on the PC segment of EVs (including BEVs vs HEVs) where vertical effects could arise.
- market_id: pm_5
  name: Segmentation of passenger cars by size/type
  definition_status: segmented
  notes: The Commission's decisional practice has defined separate product markets for various
    PC types (mini, small, medium, large, executive, luxury, sport, SUV, multipurpose) and further
    segmented SUVs by size in previous decisions. However, for the current decision, this segmentation
    was ultimately left open.
- market_id: pm_6
  name: 'Segmentation of passenger cars by propulsion technology (ICE vs. EV, and within EVs:
    BEV vs. HEV vs. FCEV)'
  definition_status: left_open
  notes: 'The Commission previously considered but left open segmentation by propulsion technology
    (ICE vs EV, and within EVs: BEV vs HEV). The Notifying Parties suggested a market for LEVs
    (BEVs, HEVs, FCEVs), but the market investigation indicated FCEVs are not part of the same
    market as BEVs and HEVs. The Commission left the exact definition open but focused its assessment
    on the PC segment of EVs and its sub-segments (BEVs vs HEVs).'
- market_id: pm_7
  name: Manufacture and supply of light commercial vehicles (LCVs)
  definition_status: left_open
  notes: The Commission has considered separate markets for LCVs. For the purpose of this decision,
    the exact market definition for LCVs and its potential sub-segments (particularly by propulsion
    technology) was left open, but the assessment focused on the LCV segment of EVs (including
    BEVs vs HEVs) where vertical effects could arise.
- market_id: pm_8
  name: Segmentation of light commercial vehicles by size/weight
  definition_status: segmented
  notes: The Commission's decisional practice has distinguished and further segmented LCVs by
    size/weight in previous decisions. The market investigation for this case found that a segmentation
    was not warranted for electric LCVs with regard to size or loading capacity.
- market_id: pm_9
  name: Segmentation of light commercial vehicles by propulsion technology (BEV vs. ICE)
  definition_status: left_open
  notes: The Commission previously considered it unnecessary to sub-segment LCV markets between
    LEVs and ICEs. The market investigation was inconclusive regarding this segmentation. The
    Commission left the exact definition open but focused its assessment on the LCV segment
    of EVs (including BEVs vs HEVs).
geographic_markets_considered:
- market_id: gm_1
  name: Manufacture and supply of battery cells and modules — worldwide or EEA-wide
  definition_status: left_open
  notes: The Commission had left the geographic definition open in previous decisions, indicating
    worldwide or EEA-wide. Notifying parties suggested worldwide but provided EEA-wide data.
    The market investigation was inconclusive, with some elements suggesting EEA-wide. The Commission
    left the definition open for this decision.
- market_id: gm_2
  name: Manufacture and supply of passenger cars — EEA-wide or national
  definition_status: left_open
  notes: The Commission has previously considered the market for PCs to be national in scope.
    The Notifying parties suggested leaving the geographic market definition open, providing
    national level information. The Commission left the definition open for this decision.
- market_id: gm_3
  name: Manufacture and supply of light commercial vehicles — EEA-wide or national
  definition_status: left_open
  notes: The Commission has previously considered the market for LCVs to be national in scope.
    The Notifying parties suggested leaving the geographic market definition open, providing
    national level information. The Commission left the definition open for this decision.
