  quote_snippet: The Target operates in France and Germany and focuses on the development, manufacturing
    and supply of cells and modules (using the Li-ion chemistry only) on a large scale, i.e.
    designed for mass production mainly for the automotive industry. The Target does not manufacture
    battery packs (or systems).
