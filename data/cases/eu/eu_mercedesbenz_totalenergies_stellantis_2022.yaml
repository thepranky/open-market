- passage_id: sp_2
  source_document_id: eu_mercedesbenz_totalenergies_stellantis_2022_decision
  page: '6'
  quote_snippet: In any case, as the activities of ACC in the market for the manufacture and
    supply of battery cells and modules for the automotive sector under any plausible product
    market definition or sub-segment (between modules and cells versus integrated battery packs,
    Li-ion versus NiMH batteries) will remain below 20%, the Commission considers that for the
    purposes of the present decision, the precise market definition can be left open, since
    the Transaction does not raise serious doubts as to its compatibility with the internal
    market or the functioning of the EEA Agreement, under any plausible product market definition.
  extraction_method: pdf_extracted
