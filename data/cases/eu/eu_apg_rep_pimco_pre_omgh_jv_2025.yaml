  page: '4'
  quote_snippet: With regard to the market for rental of retail spaces, the Commission has considered,
    but ultimately left open, a plausible market for (i) the rental of retail spaces in real
    estate properties (including shopping centres and retail parks) of at least 8,000 sqm and
    10,000 sqm respectively, and (ii) a distinct market for the rental of retail spaces in shopping
    centres of at least 8,000 sqm and 10,000 sqm respectively.
