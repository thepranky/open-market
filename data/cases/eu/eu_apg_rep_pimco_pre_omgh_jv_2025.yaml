  page: '5'
  quote_snippet: For the purpose of the analysis in this case, and on a conservative basis,
    the Commission has only taken into account competing assets which also have a gross lettable
    area (“GLA”) in excess of 10,000 sqm, since all of the shopping centres (including OCs)
    located in the overlapping countries in which the Target and the Notifying Parties have
    controlling interests (13) have a GLA in excess of 10,000 sqm.
