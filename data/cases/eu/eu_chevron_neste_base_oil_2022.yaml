  source_document_id: eu_chevron_neste_base_oil_2022_decision
  page: '8'
  quote_snippet: For the purpose of this decision, the exact product market definition can be
    left open between an overall market for lubricants and separate markets for automotive,
    industrial, marine and aviation lubricants, as the Proposed Transaction does not raise serious
    doubts as to its compatibility with the internal market or the functioning of the EEA Agreement
    under any plausible market definition.
  extraction_method: pdf_extracted
