- passage_id: sp_8
  source_document_id: eu_chevron_neste_base_oil_2022_decision
  page: '7'
  quote_snippet: The Commission will retain the product market definition provided in its past
    decisional practice as described in paragraph (25). The market investigation did not produce
    any evidence indicating that the Commission’s case practice is no longer valid. The Commission
    will therefore analyse the effects of the Proposed Transaction on the market for the production
    and wholesale of crude oil.
  extraction_method: pdf_extracted
