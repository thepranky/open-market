- passage_id: sp_5
  source_document_id: eu_enstall_schletter_2024_decision
  page: '4'
  quote_snippet: Market participants confirmed that there are separate relevant product markets
    for rooftop solar mounting systems and ground-mount systems. These respective systems have
    different product characteristics, intended use, suppliers, and customers. Ground-mount
    systems are typically much larger and require different type of construction compared to
    rooftop solar mounting systems. Customers of ground-mount systems are typically engineering,
    procurement, and construction (‘EPC’) contractors, whereas the customers of rooftop solar
    mounting systems are typically wholesalers.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
