- passage_id: sp_7
  source_document_id: eu_enstall_schletter_2024_decision
  page: '4'
  quote_snippet: Market participants suggested that the markets for rooftop solar systems are
    rather national in scope. Customers procure these systems mostly from suppliers at national
    level, especially because these suppliers’ products need to comply with national technical
    and regulatory requirements which differ across EEA countries, and in addition to that are
    readily available, and the brands are well-known. Moreover, it is important for suppliers
    to have a national presence, in particular, to be able to offer customers trainings, technical
    support, and aftersales services in their local language. Transport costs can play a material
    role. Prices vary to a considerable degree across EEA countries.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
