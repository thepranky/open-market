- passage_id: sp_8
  source_document_id: eu_enstall_schletter_2024_decision
  page: '5'
  quote_snippet: As the Transaction does not give rise to serious doubts under any plausible
    geographic market definition (i.e. EEA-wide or national), it is not necessary to conclude
    on the exact scope of the geographic market. For the purposes of this decision, the Commission
    will carry out its competitive assessment on the basis of the narrowest plausible geographic
    market, i.e. the national level.
  extraction_method: pdf_extracted
