  page: '35'
  quote_snippet: For the above reasons, the Commission has decided not to oppose the notified
    operation as modified by the commitments and to declare it compatible with the internal
    market and with the functioning of the EEA Agreement, subject to full compliance with the
    conditions in Section B of the Final Commitments annexed to the present decision and with
    the obligations contained in the other sections of the said commitments. This decision is
    adopted in application of Article 6(1)(b) in conjunction with Article 6(2) of the Merger
    Regulation and Article 57 of the EEA Agreement.
