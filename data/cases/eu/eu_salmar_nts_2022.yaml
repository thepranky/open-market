product_markets_considered:
- market_id: pm_1
  name: Farmed salmon vs. wild salmon
  definition_status: considered
  notes: The Commission's past practice distinguishes between farmed salmon and wild salmon.
- market_id: pm_2
  name: Farming and primary processing of salmon vs. secondary processing of salmon
  definition_status: considered
  notes: The Commission's past practice distinguishes between farming and primary processing
    of salmon and secondary processing of salmon.
- market_id: pm_3
  name: Salmon farmed within the EEA vs. salmon farmed outside the EEA
  definition_status: considered
  notes: The Commission's past practice considered salmon farmed within the EEA as a separate
    product market from salmon farmed outside the EEA.
- market_id: pm_4
  name: Salmon farmed in Scotland vs. salmon farmed elsewhere in the EEA
  definition_status: considered
  notes: The Commission's past practice considered salmon farmed in Scotland as a separate product
    market due to consumer preference and price premium.
- market_id: pm_5
  name: Farming and primary processing of Icelandic salmon
  definition_status: considered
  notes: The Commission, for the purpose of this decision, considered primary processed Icelandic
    salmon a separate product market from Norwegian salmon, supported by market investigation
    findings on quality, labelling, price, availability, and transport.
- market_id: pm_6
  name: Farming and primary processing of Norwegian salmon
  definition_status: considered
  notes: The Commission, for the purpose of this decision, considered primary processed Norwegian
    salmon a separate product market from Icelandic salmon. The possibility of further segmentation
    between North and South Norway was left open.
- market_id: pm_7
  name: Farming and primary processing of salmon in North Norway vs. South Norway
  definition_status: left_open
  notes: The Commission considered further segmentation of the Norwegian salmon market into
    North and South Norway, based on quality, price, availability, and environmental conditions.
    However, the question was left open as the transaction did not raise concerns under either
    definition.
- market_id: pm_8
  name: Supply of pens for the aquaculture industry
  definition_status: left_open
  notes: The Commission did not conclude on the exact product market definition for the supply
    of pens, as the outcome of the assessment would remain the same under plausible definitions,
    but noted the Notifying Party's view.
- market_id: pm_9
  name: Supply of cameras for the aquaculture industry
  definition_status: left_open
  notes: The Commission did not conclude on the exact product market definition for the supply
    of cameras, as the outcome of the assessment would remain the same under plausible definitions,
    but noted the Notifying Party's view.
geographic_markets_considered:
- market_id: gm_1
  name: Farming and primary processing of Icelandic salmon — EEA-wide
  definition_status: considered
  notes: The geographic market for farming and primary processing of Icelandic salmon was considered
    EEA-wide, in line with past Commission decisions and market investigation findings.
- market_id: gm_2
  name: Farming and primary processing of Norwegian salmon — EEA-wide
  definition_status: considered
  notes: The geographic market for farming and primary processing of Norwegian salmon was considered
    EEA-wide, in line with past Commission decisions and market investigation findings, regardless
    of potential further product market segmentation.
- market_id: gm_3
  name: Supply of pens for the aquaculture industry — global
  definition_status: left_open
  notes: The Notifying Party submitted that the market for pens is global. However, the Commission
    did not find it necessary to conclude on the exact geographic market definition as the overall
    outcome would remain the same.
- market_id: gm_4
  name: Supply of cameras for the aquaculture industry — global
  definition_status: left_open
  notes: The Notifying Party submitted that the market for camera systems is global. However,
    the Commission did not find it necessary to conclude on the exact geographic market definition
    as the overall outcome would remain the same.
theories_of_harm: []
commitments: []
