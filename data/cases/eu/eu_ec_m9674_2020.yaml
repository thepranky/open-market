  page: '21'
  quote_snippet: Although it cannot be excluded that in some specific locations there could
    be specific problems of site scarcity and/or of local authorization processes longer and
    more difficult than on average (and that this can have an influence on the specific pricing),
    the Commission considers that this element only cannot justify a market definition al local
    level, considering that all the other elements point to a national dimension of the market.
    In any case, the Commission in its analysis will consider a potential distinction between
    rural and urban areas – also in connection with the existing passive arrangements between
    the Parties – to take into account this possible difference in the competitive dynamics
    between rural areas and areas more densely populated, where barriers to entry could be somehow
    more relevant.
