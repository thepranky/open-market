  page: '29'
  quote_snippet: For the purposes of this Decision and in line with the result of the market
    investigation, the Commission considers that the geographic scope of the market for wholesale
    services for fixed backhaul is national in scope and corresponds to the territory of Italy.
    A national scope appears to be the most appropriate to assess the Transaction in light of
    the concerns expressed by some market participants, linked to possible detrimental effects
    of the Transaction on potential competition at national level.
