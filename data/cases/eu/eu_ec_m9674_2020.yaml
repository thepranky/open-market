product_markets_considered:
- market_id: pm_1
  name: Hospitality services to TV and radio broadcasting operators
  definition_status: defined
  notes: The Commission considered these services but explicitly concluded they are not part
    of the relevant market for hospitality services to telecommunication operators.
- market_id: pm_2
  name: Hospitality services on macro-sites to customers other than TV and radio broadcasters
  definition_status: left_open
  notes: The Commission left open the exact segmentation between MNOs, FWA suppliers, and other
    telecom operators (like IoT providers) but assessed the impact of the Transaction considering
    both a general market for all these customers and distinct markets for MNOs and FWA suppliers.
- market_id: pm_3
  name: Hospitality services on micro-sites
  definition_status: defined
  notes: The Commission concluded the relevant product market is the overall supply of hospitality
    services on micro sites, without further segmentation, noting that this type of site is
    primarily intended to satisfy MNOs’ demand.
- market_id: pm_4
  name: Retail provision of mobile telecommunications services, excluding M2M subscriptions
  definition_status: defined
  notes: This market includes traditional mobile telecommunications services, excluding M2M
    subscriptions, and is considered separately from fixed telecommunications services.
- market_id: pm_5
  name: Retail provision of M2M subscriptions
  definition_status: defined
  notes: The Commission, in line with previous decisions, considers M2M subscriptions to belong
    to a separate market within retail mobile telecommunications services.
- market_id: pm_6
  name: Wholesale access and call origination on public mobile telephone networks
  definition_status: defined
  notes: The Commission retains its previous product market definition for this market, considering
    the services generally supplied together as key elements for non-MNOs.
- market_id: pm_7
  name: Retail fixed internet access services
  definition_status: considered
  notes: 'The Commission considered two alternative product market definitions for assessment:
    either the overall retail market for fixed Internet access services (excluding mobile network
    infrastructure-based services) or a narrower hypothetical market for services supplied based
    on FWA technology only, due to the vertical link with hospitality services on macro-sites
    relevant for FWA networks.'
- market_id: pm_8
  name: Wholesale fixed internet access services
  definition_status: considered
  notes: 'The Commission considered two alternative product market definitions for assessment:
    either the overall wholesale supply of fixed access (encompassing all technologies) or a
    narrower hypothetical market for services supplied based on FWA technology only, due to
    the vertical link with hospitality services on macro-sites relevant for FWA networks.'
- market_id: pm_9
  name: Wholesale supply of fixed backhaul services
  definition_status: left_open
  notes: The Commission explicitly left open the exact product market definition for wholesale
    fixed backhaul services, as the transaction did not raise competition concerns under any
    possible definition. However, its analysis would focus on fixed fiber backhauling services.
geographic_markets_considered:
- market_id: gm_1
  name: Hospitality services on macro-sites — national (Italy affected)
  definition_status: defined
  notes: The Commission concluded the geographic market is national in scope, corresponding
    to Italy. While a complainant argued for local markets and the Commission considered potential
    distinction between rural and urban areas, these were not sufficient to redefine the market
    as local.
- market_id: gm_2
  name: Hospitality services on micro-sites — national (Italy affected)
  definition_status: defined
  notes: While the micro-sites market is considered nascent, the Commission concluded that the
    geographic market for hospitality services on micro-sites is national, aligned with the
    macro-site market and general market investigation findings.
- market_id: gm_3
  name: Retail provision of mobile telecommunications services, excluding M2M subscriptions
    — national (Italy affected)
  definition_status: defined
  notes: The Commission, in line with previous decisions, considered the geographic scope of
    the retail mobile telecommunications services market to be national, corresponding to the
    territory of Italy.
- market_id: gm_4
  name: Retail provision of M2M subscriptions — national (Italy affected)
  definition_status: defined
  notes: The Commission, in line with previous decisions, considered the geographic scope of
    the retail M2M subscriptions market to be national, corresponding to the territory of Italy.
- market_id: gm_5
  name: Wholesale access and call origination on public mobile telephone networks — national
    (Italy affected)
  definition_status: defined
  notes: The Commission considered the geographic scope of this wholesale market to be national,
    corresponding to Italy, primarily due to regulatory barriers related to national MNO licenses.
- market_id: gm_6
  name: Retail fixed internet access services — national (Italy affected)
  definition_status: defined
  notes: The Commission concluded the geographic market for retail fixed internet services is
    national in scope, corresponding to the territory of Italy, in line with previous decisions
    and finding no reasons to depart from this position.
- market_id: gm_7
  name: Wholesale fixed internet access services — national (Italy affected)
  definition_status: left_open
  notes: The Commission explicitly left open the exact geographic market definition for wholesale
    fixed internet access services, stating that the transaction did not raise serious doubts
    under any alternative definition. However, precedent indicated support for a national scope.
- market_id: gm_8
  name: Wholesale supply of fixed backhaul services — national (Italy affected)
  definition_status: defined
  notes: The Commission considered the geographic scope of the market for wholesale fixed backhaul
    services to be national, corresponding to the territory of Italy, in line with market investigation
    results and concerns expressed by market participants regarding potential competition at
    the national level.
