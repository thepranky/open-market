- passage_id: sp_5
  source_document_id: eu_ec_m9674_2020_decision
  page: '17'
  quote_snippet: 'With respect to a possible segmentation between different telecommunications
    operators (MNOs, FWA suppliers), the majority of the respondents to the market investigation
    submitted that requirements for hospitality services on macro-sites are the same for suppliers
    of mobile telecommunications services and providers of FWA, at least to a certain extent.51
    In general, FWA equipment would be comparable to MNOs’ equipment, although sometimes smaller.
    Energy requirements could be met within the same infrastructure as MNOs. On the other hand,
    FWA services would target a customer base living in the less densely populated areas in
    Italy, where fixed fiber telecommunication services are not as capillary as in the more
    densely populated areas: in this context FWA suppliers needs a smaller number of sites for
    their operations (in the range of hundreds sites). On the contrary, MNOs would need capillary
    distribution in urban and rural areas and have a much greater need for sites (in the range
    of thousands sites).'
  extraction_method: pdf_extracted
  review_status: unreviewed
