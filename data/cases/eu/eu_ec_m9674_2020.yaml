  source_document_id: eu_ec_m9674_2020_decision
  page: '18'
  quote_snippet: With respect to macro-sites, the result of the market investigation has not
    been conclusive as regards the possible distinction between hospitality services to MNOs
    and FWA suppliers. Therefore, the Commission leaves this question open and will analyse
    the impact of the Transaction considering both a general market for hospitality services
    on macro-sites to customers other than TV and radio broadcasters, and distinct markets for
    hospitality services on macro-sites to (i) MNOs and (ii) FWA suppliers.
  extraction_method: pdf_extracted
  review_status: unreviewed
