  quote_snippet: With respect to micro-sites, the vast majority of respondents to the market
    investigation submitted that MNOs using hospitality services on macro-sites would consider
    hospitality services on micro-sites as a complement and not as an alternative for their
    network. Micro-cells are used in combination with macro cells to improve coverage and capacity
