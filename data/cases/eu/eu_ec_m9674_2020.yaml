- passage_id: sp_2
  source_document_id: eu_ec_m9674_2020_decision
  page: '17'
  quote_snippet: The vast majority of the participants to the market investigation49 confirmed
    that suppliers of mobile telecommunications services and suppliers of TV/Radio broadcasting
    services have different requirements for hospitality services.50 Generally, towers originally
    designed to serve MNOs would be limited in their ability to offer hospitality services to
    radio and TV broadcasters. Moreover, TV and radio broadcasters need higher transmission
    power and need to be located outside of densely populated areas, while MNOs would require
    capillary distribution of antennas especially in densely populated areas.
  extraction_method: pdf_extracted
