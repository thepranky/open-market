  source_document_id: eu_ec_m9674_2020_decision
  page: '28'
  quote_snippet: The vast majority of the respondents to the market investigation submitted
    that the different transmission means (i.e. wireless, fiber and copper lines) do not satisfy
    the same backhauling needs (e.g. in terms of capacity and other relevant parameters).92
    The different transmission would address different backhauling needs in relation to capacity,
    stability, time-to-deploy and costs. However, fiber would offer the highest reliability
    in terms of capacity, throughput, latency, etc. and would be the only option for future
    5G backhauling.
  extraction_method: pdf_extracted
