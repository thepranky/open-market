- passage_id: sp_4
  source_document_id: eu_ec_m9674_2020_decision
  page: '18'
  quote_snippet: As for the question whether the other categories of customers (excluding TV
    and radio broadcasters, i.e. in particular IoT providers) form part of a separate market,
    the Commission considers that this question can also be left open. Indeed, whilst the Commission
    does not find serious doubts as to the compatibility of the Transaction as a result of horizontal
    or vertical effects in relation to this customer group, this does not affect the conclusion
    that serious doubts arise in relation to the overall market for the supply of hospitality
    services to all customers other than TV and radio broadcasters. This is because the current
    demand by these customers is marginal compared to the demand by MNOs and FWA suppliers56
    and thus does not affect the competitive analysis for the overall market for hospitality
    services to all customers other than TV and radio broadcasters.
  extraction_method: pdf_extracted
  review_status: unreviewed
