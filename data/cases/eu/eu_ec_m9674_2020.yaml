- passage_id: sp_6
  source_document_id: eu_ec_m9674_2020_decision
  page: '19'
  quote_snippet: With respect to the market for hospitality services on micro-sites, the Commission
    notes, based on the market reconstruction57, that this type of sites would be primarily
    intended to satisfy MNOs’ demand up to 2027, with sales to this customer group representing
    more than 95% on each year covered by the market reconstruction, by both volume and value.
    Further, there is no evidence in the file that the effects of the Transaction in relation
    to the supply of hospitality services on micro-sites to customers other than MNOs would
    be different. In this context, the Commission considers that, for the purposes of this Decision,
    the relevant product market would be the overall supply of hospitality services on micro
    sites, without any further segmentation.
  extraction_method: pdf_extracted
  review_status: unreviewed
