- passage_id: sp_24
  source_document_id: eu_ec_m9674_2020_decision
  page: '19'
  quote_snippet: The Parties submit that the market for hospitality services is national in
    scope, because MNOs would purchase hospitality services from a TowerCo so that they can
    in turn provide services according to the terms of their license, which is typically for
    the territory of a given Member State. Therefore, MNOs would purchase services from operators
    that can provide solutions across the entire territory of a Member State. MNOs would not
    approach TowerCos for a single access purchase at a certain location and they will either
    rely on TowerCos to manage their networks in its entirety or to provide access to a set
    of locations across the territory under the license. To address these needs, TowerCos would
    provide a diversified portfolio of assets conveniently located across the country. These
    features would explain why there are no local TowerCos for MNOs.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
