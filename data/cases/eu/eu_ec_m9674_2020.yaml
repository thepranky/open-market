  quote_snippet: In the present case, the question of the exact product market definition for
    wholesale services for fixed backhaul can be left open, as the Transaction does not raise
    competition concerns under any possible product market definition. In any case, the competitive
    analysis will focus on fixed fiber backhauling services, irrespective of a segmentation
    by active or passive infrastructure services, considering that (i) future roll-out would
    mainly involve fiber connections due to 5G capacity requirements, (ii) MNOs typically self-supply
    wireless backhaul services.
