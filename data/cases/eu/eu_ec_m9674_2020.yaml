- passage_id: sp_15
  source_document_id: eu_ec_m9674_2020_decision
  page: '25'
  quote_snippet: Thus, for the purpose of this Decision, the Commission considers that the relevant
    product market is either the overall retail market for the provision of fixed Internet access
    services, including all customer groups, product types, distribution modes and speeds/bandwidths,
    excluding only the supply of fixed internet services provided through mobile network infrastructure83,
    or a hypothetical narrower market where services are only supplied based on FWA technology.
    As the operators in these markets which would be affected by the Transaction are the same,
    the vertical analysis of the effects of the Transaction in relation to these retail services
    will be undertaken jointly and in the following any reference to the “retail fixed markets”
    should be intended to cover both the overall retail market for the provision of fixed internet
    access services and the hypothetical narrower market where services are only supplied based
    on FWA technology.
  extraction_method: pdf_extracted
