- passage_id: sp_10
  source_document_id: eu_mytheresa_ynap_2025_decision
  page: '8'
  quote_snippet: The Commission’s market investigation in this case indicates that (i) consumers
    view retailers operating a 1P model as competing closely with retailers operating a 3P model;
    (ii) most brands generally work with both 1P and 3P distribution models, as they present
    complementary advantages; (iii) several retailers (including the Parties) are capable of
    offering (and actually offer) both 1P and 3P models; and (iv) brands and retailers usually
    decide together which model to use, taking factors such as brand strategy, operational costs
    and stock management preferences into account.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
