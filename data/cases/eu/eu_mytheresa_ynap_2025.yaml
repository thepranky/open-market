- passage_id: sp_6
  source_document_id: eu_mytheresa_ynap_2025_decision
  page: '8'
  quote_snippet: For the purposes of this decision, the exact product market definition can
    be left open, as the Transaction does not give rise to competition concerns even on a conservative,
    narrower online retail market for luxury goods (excluding offline channels). Competitive
    constraints posed by offline retailers are taken into account in the competitive assessment
    (see Section 6.2.7) below.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
