product_markets_considered:
- market_id: pm_1
  name: Online retail supply of multi-brand, multi-product personal luxury goods (excluding
    pre-owned goods)
  definition_status: considered
  notes: The Commission considered this as the narrowest plausible market definition for its
    assessment, although the exact product market definition was left open as the transaction
    did not raise competition concerns even under this narrowest definition. This market excludes
    offline channels, mono-brand/DTC channels, mono-product/specialised channels, and pre-owned
    goods.
- market_id: pm_2
  name: Luxury goods (excluding mass-market goods)
  definition_status: defined
  notes: Segmented from mass-market goods.
- market_id: pm_3
  name: Online vs. offline retail of luxury goods
  definition_status: left_open
  notes: The exact product market definition between online and offline retail of luxury goods
    was left open, but competitive constraints from offline channels were considered.
- market_id: pm_4
  name: 1P vs. 3P distribution models for online retail supply of personal luxury goods
  definition_status: left_open
  notes: The Commission found no need to distinguish between 1P and 3P distribution models.
- market_id: pm_5
  name: Multi-brand vs. mono-brand (DTC) retailers for online luxury goods
  definition_status: left_open
  notes: The exact product market definition between multi-brand and mono-brand (DTC) retailers
    was left open, but competitive constraints from mono-brand/DTC channels were considered.
- market_id: pm_6
  name: Multi-product vs. specialised (mono-product) retailers for online luxury goods
  definition_status: left_open
  notes: The exact product market definition between multi-product and mono-product retailers
    was left open, but competitive constraints from mono-product channels were considered.
- market_id: pm_7
  name: New vs. pre-owned luxury goods
  definition_status: left_open
  notes: The exact product market definition between new and pre-owned luxury goods was left
    open, but competitive constraints from pre-owned goods were considered.
- market_id: pm_8
  name: Manufacture and wholesale supply of luxury goods
  definition_status: left_open
  notes: The exact product market definition, including whether it should be segmented by product
    categories, was left open.
- market_id: pm_9
  name: Supply of e-commerce services
  definition_status: left_open
  notes: The exact product market definition, including whether it should be segmented by different
    types of e-commerce services, was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Online retail supply of luxury goods — consumer-facing side — national or EEA-wide
  definition_status: left_open
  notes: The Commission left open whether the geographic market for the consumer-facing side
    is national or EEA-wide, as the transaction did not raise serious doubts irrespective of
    the definition.
- market_id: gm_2
  name: Online retail supply of luxury goods — business-facing side — EEA-wide
  definition_status: considered
  notes: The Commission assessed the transaction on an EEA-wide basis for the business-facing
    side, although the exact definition was left open as the transaction did not raise serious
    doubts even at this narrowest plausible level.
- market_id: gm_3
  name: Manufacture and wholesale supply of luxury goods — EEA-wide or wider
  definition_status: left_open
  notes: The geographic market for the manufacture and wholesale supply of luxury goods was
    left open, but the Commission considered it likely to be EEA-wide or wider in scope.
- market_id: gm_4
  name: Supply of e-commerce services — EEA-wide or wider
  definition_status: left_open
  notes: The geographic market for the supply of e-commerce services was left open, but the
    Commission considered it likely to be EEA-wide or wider in scope.
