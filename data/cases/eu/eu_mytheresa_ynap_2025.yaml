  quote_snippet: For the purposes of this decision, the exact product market definition can
    be left open, as the Transaction does not give rise to competition concerns even on a narrower
    market for online multi-brand retail of luxury goods (excluding mono-brand/DTC channels).
    Competitive constraints posed by mono-brand retailers’ online sales are taken into account
    in the competitive assessment (see Section 6.2.7) below.
  extraction_method: pdf_extracted
