- passage_id: sp_7
  source_document_id: eu_mytheresa_ynap_2025_decision
  page: '7'
  quote_snippet: 'The Commission has previously considered, on a conservative basis, that online
    and offline retail of luxury goods may form separate markets because: (i) online retailers
    predominantly monitor other online players and may not compete closely with offline players,
    (ii) brands do not consider online and offline channels substitutable, and (iii) consumers
    use online and offline for different purposes.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_3
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_8
  source_document_id: eu_mytheresa_ynap_2025_decision
  page: '9'
  quote_snippet: Consequently, the Commission considers that, for the purposes of this decision,
    there is no need to distinguish between online retailers operating a 1P model and those
    operating a 3P model in the context of the online retail supply of personal luxury goods.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
