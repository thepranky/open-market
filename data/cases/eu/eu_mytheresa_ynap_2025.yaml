  page: '8'
  quote_snippet: The Commission has in the past not considered a distinction between retailers
    operating a 1P vs 3P distribution model for the purpose of defining the relevant market
    for the online retail supply of personal luxury goods.
  extraction_method: pdf_extracted
  review_status: unreviewed
