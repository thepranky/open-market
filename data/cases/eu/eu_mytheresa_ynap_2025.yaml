- passage_id: sp_2
  source_document_id: eu_mytheresa_ynap_2025_decision
  page: '10'
  quote_snippet: For the reasons explained above, the Commission considers that luxury goods
    form a separate market from mass-market goods. As regards the other parameters examined
    above, the exact product market definition can be left open for the purposes of this decision,
    since the Transaction does not give rise to competition concerns even under the narrowest
    plausible market definition, i.e., the product market for the online retail supply of multi-brand,
    multi-product personal luxury goods (excluding pre-owned goods).
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
