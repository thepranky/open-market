  page: '7'
  quote_snippet: Therefore, the Commission considers that luxury goods form a separate market
    from mass-market goods and will consequently conduct its competitive assessment on a separate
    retail market for luxury goods (excluding mass-market goods).
  extraction_method: pdf_extracted
