- passage_id: sp_3
  source_document_id: eu_mytheresa_ynap_2025_decision
  page: '6'
  quote_snippet: The Commission has recently considered the market for online retail supply
    of luxury goods in 2023 in case M.10926 Farfetch / Richemont / YNAP. In that case, the relevant
    product market was considered to be the online retail supply of multi-brand, multi-product
    personal luxury goods (excluding pre-owned personal luxury goods).
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
