  page: '9'
  quote_snippet: The Commission has in the past concluded, on a conservative basis, that multi-brand
    and mono-brand (i.e., brands’ DTC) channels form distinct markets. This is because, e.g.,
    brands view multi-brand retailers as additional distribution channels rather than direct
    competitors and multi-brand retailers often consider that DTC channels are not close substitutes
    to their websites.
  extraction_method: pdf_extracted
