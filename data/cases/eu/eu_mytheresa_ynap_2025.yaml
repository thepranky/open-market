  quote_snippet: The Commission’s market investigation results were in line with its findings
    in case M.10926 Farfetch / Richemont / YNAP, i.e., that there is a plausible separate product
    market for the online retail supply of multi-brand, multi-product personal luxury goods
    (excl. pre-owned goods).
