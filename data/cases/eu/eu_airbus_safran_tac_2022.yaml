  definition_status: left_open
  notes: null
- market_id: pm_17
  name: Aircraft brakes and wheels
  definition_status: left_open
  notes: The Commission's previous decisions considered brakes and wheels as one market, and
    more recently, segmented by aircraft type (general aviation, business jets, military fixed-wing
    UAVs, military fixed-wing trainers, and helicopters), but not by weight range or brake material
    (steel vs. carbon). Market investigation indicated brakes and wheels for large commercial
    aircraft as a specific market, but segmentation into narrow-body/single-aisle and wide-body/twin-aisle
    was inconclusive.
