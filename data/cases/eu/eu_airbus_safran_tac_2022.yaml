  page: '9'
  quote_snippet: It follows that, in line with the Commission’s decisional practice, large commercial
    aircraft, regional aircraft and business / corporate jets are considered separate product
    markets for the purpose of this decision. Whether large commercial aircraft should be further
    sub-segmented can be left open for the purpose of the present decision, as the Transaction
    does not raise serious doubts as to its compatibility with the internal market under any
    plausible product market definition.
