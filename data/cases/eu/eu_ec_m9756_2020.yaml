- passage_id: sp_2
  source_document_id: eu_ec_m9756_2020_decision
  page: '5'
  quote_snippet: The results of the market investigation were somewhat mixed as to the question
    whether the different purity grades of CMC (technical, intermediate-purity and high-purity)
    are substitutable from a demand perspective. While about a third of responding customers
    indicated there is no substitutability at all between the three different grades, two other
    fractions, almost equal in strength as the first one indicate either that intermediate-purity
    CMC can be substituted with high-purity CMC, but not with technical CMC, or that all purity
    grades can be substituted. The market investigation therefore shows that customers clearly
    distinguish technical CMC from higher purity grades of CMC. However, the results of the
    market investigation do not allow the Commission to conclude regarding the ability of customers
    to substitute high-purity CMC with intermediate-purity CMC. At the same time, there are
    indications that there is no supply-side substitutability between the different purity grades
    of CMC.
  extraction_method: pdf_extracted
  review_status: unreviewed
