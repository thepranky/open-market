- passage_id: sp_3
  source_document_id: eu_ec_m9756_2020_decision
  page: '6'
  quote_snippet: Ultimately, for assessing the Transaction, Commission considers that a potential
    segmentation of CMC by application would not be relevant. As regards a potential segmentation
    of CMC by grade, the Commission considers that the exact scope of the product market definition
    can be left open between CMC as a single product or segmented between technical and purified
    CMC or segmented between technical, intermediate-purity and high-purity, since the Transaction
    does not give rise to serious doubts as to its compatibility with the internal market under
    any of the various combinations of the above-mentioned alternative market definitions.
  extraction_method: pdf_extracted
  review_status: unreviewed
