  page: '8'
  quote_snippet: The Commission has previously considered caustic soda to constitute a separate
    product market. It has ultimately left open whether liquid and solid caustic soda constitute
    two separate product markets, but found that any further segmentation within liquid or solid
    caustic soda would not be appropriate, given that most producers can easily produce different
    concentrations.
