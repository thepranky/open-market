- passage_id: sp_11
  source_document_id: eu_ec_m9756_2020_decision
  page: '7'
  quote_snippet: The market investigation revealed that a majority of customers would consider
    procuring CMC outside the EEA in case of a small but significant non-transitory increase
    in CMC prices in the EEA. Consistent with this, a majority of customers mentioned that they
    consider CMC supplied by Chinese and Turkish suppliers, but not suppliers from North or
    South America, as a credible alternative to CMC supplied by Nouryon or CP Kelco for the
    supply of CMC for their plants in the EEA.
  extraction_method: pdf_extracted
