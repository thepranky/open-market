- passage_id: sp_1
  source_document_id: eu_ec_m9756_2020_decision
  page: '4'
  quote_snippet: The Notifying Party submits that the relevant product market should be defined
    as the overall market for the manufacture and supply of CMC. The Notifying Party acknowledges
    that there are certain demand-side substitutability limitations that could justify a further
    segmentation between the technical and purified CMC grades. However, the Notifying Party
    takes the view that there is a strong degree of supply-side substitutability between different
    purity grades of CMC.
  extraction_method: pdf_extracted
