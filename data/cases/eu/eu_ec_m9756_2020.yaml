product_markets_considered:
- market_id: pm_1
  name: Carboxymethyl cellulose (CMC)
  definition_status: left_open
  notes: The Commission considered segmenting CMC by purity grade (technical, intermediate-purity,
    high-purity) and by application, but ultimately left the product market definition open,
    as the transaction did not raise competition concerns under any definition. Segmentation
    by application was deemed not relevant due to supply-side substitutability.
- market_id: pm_2
  name: Sodium hydroxide (caustic soda)
  definition_status: left_open
  notes: The Commission considered whether to segment caustic soda by its form (liquid or solid)
    but left the product market definition open as the transaction did not raise competition
    concerns.
- market_id: pm_3
  name: Monochloroacetic acid (MCA)
  definition_status: defined
  notes: The Commission confirmed its past precedent that MCA constitutes a separate product
    market without further segmentation.
geographic_markets_considered:
- market_id: gm_1
  name: Carboxymethyl cellulose (CMC) — wider than EEA-wide
  definition_status: left_open
  notes: The Commission considered geographic markets for CMC as EEA-wide, EMEA (Europe, Middle
    East and Africa, plus China), or worldwide, but left the definition open. Market investigation
    suggested a market larger than EEA, including Chinese and Turkish suppliers, but excluding
    North/South America. Logistic factors and higher transport costs were mentioned as potential
    barriers.
- market_id: gm_2
  name: Sodium hydroxide (caustic soda) — wider than EEA-wide
  definition_status: left_open
  notes: The Commission considered geographic markets for caustic soda ranging from North-West
    Europe to EEA-wide or worldwide. The market investigation did not contradict precedents,
    and the definition was left open.
- market_id: gm_3
  name: Monochloroacetic acid (MCA) — wider than Western Europe
  definition_status: left_open
  notes: The Commission considered geographic markets for MCA as regional (Western Europe),
    EEA-wide, or combined EEA and USA. While past precedents suggested Western Europe, recent
    developments indicate a wider scope, but the definition was ultimately left open.
