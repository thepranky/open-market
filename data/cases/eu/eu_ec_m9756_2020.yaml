- passage_id: sp_12
  source_document_id: eu_ec_m9756_2020_decision
  page: '7'
  quote_snippet: In light of the above, the Commission considers that the relevant geographic
    market for CMC is more likely to be wider than EEA-wide, possibly encompassing Europe, Middle
    East and Africa (EMEA), and including CMC producers from China as well, but not North and
    South America. For the avoidance of doubt, throughout all this decision, the term “worldwide”
    will be deemed to encompass the entire world, including North and South America; while “EMEA”
    will be used when referring to the geographic zone comprising Europe, Middle East and Africa,
    plus China. In any event, for the purposes of assessing the Transaction, the exact scope
    of the geographic market definition can be left open since under both an EEA-wide or larger
    geographic market definition (EMEA, or world-wide), the Transaction does not give rise to
    serious doubts as to its compatibility with the internal market.
  extraction_method: pdf_extracted
