- passage_id: sp_6
  source_document_id: eu_montagu_hg_waystone_2022_decision
  page: '7'
  quote_snippet: While some competitors are aware of instances where proprietary ManCo competed
    with third-party ManCo to provide standalone ManCo services,29 the vast majority of them
    indicated that third-party ManCo service providers do not usually have the required expertise
    to compete for bundled mandates.
  extraction_method: pdf_extracted
