  source_document_id: eu_montagu_hg_waystone_2022_decision
  page: '10'
  quote_snippet: On the market for provision of third-party ManCo services to UCITS funds in
    Ireland, the Notifying Parties submit that they would hold a combined market shares of [25-30]%,
    with an increment of [5-10]% brought about by UI/Waystone. Generally all competing ManCo
    service providers have the relevant expertise and service UCITS funds.
  extraction_method: pdf_extracted
