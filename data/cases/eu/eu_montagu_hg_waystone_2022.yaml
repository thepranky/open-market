- passage_id: sp_1
  source_document_id: eu_montagu_hg_waystone_2022_decision
  page: '6'
  quote_snippet: In any event, for the purposes of this decision, the Commission considers that
    it is not necessary to conclude whether the market for the provision of ManCo services should
    be further segmented (by types of funds served, by ManCo services provided, into proprietary
    and third-party ManCo services, or by a combination of these segmentations), since competition
    concerns are unlikely to arise under any plausible product market definition.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
