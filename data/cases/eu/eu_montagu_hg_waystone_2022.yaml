- passage_id: sp_4
  source_document_id: eu_montagu_hg_waystone_2022_decision
  page: '8'
  quote_snippet: On the basis of the above market definitions, the proposed concentration gives
    rise to horizontally affected markets in relation to (i) the provision of third-party ManCo
    services in Ireland and (ii) the provision of third-party ManCo services to UCITS funds
    in Ireland.
  extraction_method: pdf_extracted
  review_status: unreviewed
