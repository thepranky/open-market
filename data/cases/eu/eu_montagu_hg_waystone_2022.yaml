- passage_id: sp_5
  source_document_id: eu_montagu_hg_waystone_2022_decision
  page: '6'
  quote_snippet: ManCo services offered on a standalone basis are usually offered by ‘third-party
    players’ such as the Targets. Finally, some ManCo firms, ‘hybrid’ ManCo service providers,
    offer ManCo services both as part of bundled mandates and on a standalone basis.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
