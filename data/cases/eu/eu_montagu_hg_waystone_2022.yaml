- passage_id: sp_2
  source_document_id: eu_montagu_hg_waystone_2022_decision
  page: '6'
  quote_snippet: The results of the market investigation generally support the Notifying Parties’
    view of an overall product market encompassing all types of ManCo services and offered to
    both AIF and UCITS funds. However, the results of the market investigation were inconclusive
    as to whether the market for the provision of ManCo services should be further segmented
    depending on whether ManCo services are offered as part of a bundled mandate, together with
    other asset management services, or not.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_1
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_3
  source_document_id: eu_montagu_hg_waystone_2022_decision
  page: '5'
  quote_snippet: The Notifying Parties claim that the relevant product market is the market
    for the provision of ManCo services, without any further segmentations.
  extraction_method: pdf_extracted
