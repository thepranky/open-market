- passage_id: sp_11
  source_document_id: eu_ec_m9934_2021_decision
  page: '15'
  quote_snippet: (68) On balance, the market investigation likely calls for a reassessment of
    the Commission’s conclusions in an earlier case as to the geographic market definition for
    mineral fibre sandwich panels. Already the stark differences in the Parties’ respective
    market share across EEA countries suggest a geographic market that is not EEA-wide. Importantly,
    the market investigation refuted a key basis for the Commission’s conclusion in an earlier
    case, namely the difference in the relative transport costs for mineral fibre sandwich panels
    and foam sandwich panels.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
