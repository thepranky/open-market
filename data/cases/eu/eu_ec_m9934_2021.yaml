product_markets_considered:
- market_id: pm_1
  name: Foam sandwich panels
  definition_status: defined
  notes: The Commission concluded that foam sandwich panels and mineral fibre sandwich panels
    constitute separate product markets. For the purpose of this Decision, all potential sub-segments
    by end-use application (standard vs. refrigerating, wall vs. roof) are included within the
    single product market for foam sandwich panels.
- market_id: pm_2
  name: Mineral fibre sandwich panels
  definition_status: defined
  notes: The Commission concluded that foam sandwich panels and mineral fibre sandwich panels
    constitute separate product markets.
- market_id: pm_3
  name: Single skin construction sheets
  definition_status: left_open
  notes: The Commission left open whether the market for single skin construction sheets includes
    all potential sub-segments by end-use application (decking, roofing, and wall cladding),
    as the competitive assessment remained the same even on the basis of the narrowest possible
    product markets.
- market_id: pm_4
  name: Purlins
  definition_status: left_open
  notes: The Commission left open whether purlins belong to a hypothetical wider market for
    finished flat carbon steel products or whether purlins constitute a separate product market,
    as the competitive assessment remained the same even on the basis of the narrowest plausible
    product market.
geographic_markets_considered:
- market_id: gm_1
  name: Foam sandwich panels — national/cross-border regional (EEA affected)
  definition_status: left_open
  notes: The Commission found significant factual and evidentiary elements pointing to national
    markets, but ultimately left open whether the market for foam sandwich panels is national
    or cross-border regional in scope.
- market_id: gm_2
  name: Mineral fibre sandwich panels — EEA-wide/cross-border regional/national (EEA affected)
  definition_status: left_open
  notes: While past decisions suggested an EEA-wide scope, the market investigation in this
    case indicated strong evidence for national or at most cross-border regional markets for
    mineral fibre sandwich panels. However, the question of the precise market definition was
    left open.
- market_id: gm_3
  name: Single skin construction sheets — national (EEA affected)
  definition_status: defined
  notes: The Commission concluded that the relevant geographic market for the production and
    supply of single skin construction sheets is national in scope, consistent with its earlier
    findings.
- market_id: gm_4
  name: Purlins — EEA-wide/narrower (EEA affected)
  definition_status: left_open
  notes: The Commission left open whether the market for purlins is EEA-wide or narrower, as
    the transaction would not raise serious doubts regardless of the geographic market definition.
