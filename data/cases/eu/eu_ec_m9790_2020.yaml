- passage_id: sp_1
  source_document_id: eu_ec_m9790_2020_decision
  page: '5'
  quote_snippet: (15) The Parties propose that the upstream market for present purposes should
    be the wholesale supply of precast concrete and non-concrete components to retailers.28
    The Parties confirmed29 that, in view of regulatory considerations, both KP1 and its competitors
    who offer similar products to KP1's infiller blocks and thermal bridge breakers (which are
    the non-concrete components) do not sell them on a standalone basis, but sell them also
    only in conjunction with their own beams. In view of this, the Commission’s assessment will
    focus specifically on the concrete components, in line with precedent.
