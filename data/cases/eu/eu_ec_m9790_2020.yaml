  source_document_id: eu_ec_m9790_2020_decision
  page: '5'
  quote_snippet: (19) In line with Commission’s precedents, the Parties agree that the upstream
    market is national in scope. However, given that KP1 sells its products at the wholesale
    level in France to GBMs nationally and to BME’s GBM chain, Raboni, which is active solely
    in two French regions, Ile-de-France and Normandie, the Parties submit that the impact of
    the Transaction should be assessed at both the national level and in Ile-de-France and Normandie.
