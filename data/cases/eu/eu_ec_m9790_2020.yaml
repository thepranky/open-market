product_markets_considered:
- market_id: pm_1
  name: wholesale supply of precast concrete components to retailers
  definition_status: left_open
  notes: The Commission considered further segmentation of this market, specifically for "Poutrelles
    Hourdis" (infiller beams and blocks), but ultimately left the exact product market definition
    open.
- market_id: pm_2
  name: retail sales of building materials to professional end-customers
  definition_status: left_open
  notes: The Commission considered sub-segmentation based on sales to General Builders' Merchants
    (GBMs) versus Specialist Builders' Merchants (SBMs), and by specific product groups within
    building materials, but ultimately left the precise definition open. KP1 does not sell its
    products to SBMs.
geographic_markets_considered:
- market_id: gm_1
  name: wholesale supply of precast concrete components to retailers — national (France affected)
  definition_status: left_open
  notes: The Commission noted that the parties agreed the upstream market is national in scope,
    but also considered regional assessment due to BME's limited regional activity. Ultimately,
    the market definition was left open.
- market_id: gm_2
  name: wholesale supply of precast concrete components to retailers — regional (Ile-de-France
    and Normandie affected)
  definition_status: left_open
  notes: The market investigation suggested a regional scope (around 250 km from production
    plants), but the Commission ultimately left the geographic market definition open, assessing
    the transaction under both national and regional scopes.
- market_id: gm_3
  name: retail sales of building materials to professional end-customers — national (France
    affected)
  definition_status: left_open
  notes: The parties submitted a national scope, but the Commission also considered regional
    scope due to BME's limited activity. The market definition was ultimately left open.
- market_id: gm_4
  name: retail sales of building materials to professional end-customers — regional (Ile-de-France
    and Normandie affected)
  definition_status: left_open
  notes: The market investigation confirmed a regional scope (around 100 km from the delivery
    site). The Commission considered this regional scope along with a national scope but ultimately
    left the geographic market definition open.
