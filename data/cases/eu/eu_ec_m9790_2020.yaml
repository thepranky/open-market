  quote_snippet: '(16) The results of the market investigation confirmed that “Poutrelles Hourdis”,
    the local classification of infiller beams and blocks (pre-stressed concrete products),
    can be considered as a separate product market: “En effet le marché de la poutrelle est
    un marché assez particulier”.30 Also, a GBM retailer distinguished a “pre-stressed concrete
    beams and infiller blocks” market when he provided feedback on the impact of the Transaction.31'
