  page: '17'
  quote_snippet: |
    In the third place, the above conclusions (recitals (60) and (66)) are confirmed by the result of the market investigation. The majority of respondents considered that competition would likely increase or stay the same on the wholesale market for international roaming services and the retail market for mobile telecommunications services.58 The majority of respondents to the market investigation did not raise any issues related to vertical competition concerns arising from the Transaction on the market for wholesale international roaming services on the one hand, and the market for retail supply of mobile telecommunications services on the other hand.59
    (71) In light of the analysis above, the Commission concludes that the proposed Transaction would not raise serious doubts as to its compatibility with the internal market relative to (1) any hypothetical input foreclosure strategy of the Notifying Parties in relation to the downstream markets for the retail supply of mobile telecommunication services, and (2) any hypothetical customer foreclosure strategy of the Notifying Parties in relation to the upstream markets for wholesale international roaming services.
  extraction_method: pdf_extracted
