product_markets_considered:
- market_id: pm_1
  name: Overall retail market for mobile telecommunications services
  definition_status: considered
  notes: The Commission considered the relevant product market to be the overall retail market
    for mobile telecommunications services, without further segmentation by type of service,
    type of customers, or network technology. This was in line with previous practice and not
    objected to by the Notifying Party.
- market_id: pm_2
  name: Overall retail market for fixed telephony services
  definition_status: considered
  notes: The Commission considered the relevant product market to be the overall retail market
    for fixed telephony services, including VoIP services, without any further segmentations.
    This was in line with previous practice and not objected to by the Notifying Party.
- market_id: pm_3
  name: Wholesale market for international roaming services comprising both terminating calls
    and originating calls
  definition_status: defined
  notes: The Commission concluded that the market for international roaming services, comprising
    both terminating calls and originating calls, constitutes a separate product market. This
    was consistent with previous decisions and not objected to by the Notifying Party.
- market_id: pm_4
  name: Wholesale market for mobile call termination services on each individual mobile network
  definition_status: considered
  notes: The Commission considered that termination on each individual mobile network constitutes
    a separate product market for wholesale call termination services, in line with its previous
    decisional practice. The Notifying Party did not object to this definition.
- market_id: pm_5
  name: Wholesale market for fixed call termination services on each individual fixed network
  definition_status: considered
  notes: The Commission considered that termination on each individual fixed network constitutes
    a separate product market for wholesale call termination services, in line with its previous
    decisional practice. The Notifying Party did not object to this definition.
geographic_markets_considered:
- market_id: gm_1
  name: Retail mobile telecommunications services — national (Cyprus, France, Ireland, Italy,
    Malta, Poland affected)
  definition_status: considered
  notes: The Commission considered the market for retail mobile services to be national in scope,
    consistent with previous decisions and considering that licenses to mobile operators are
    granted on a national basis. This was not objected to by the Notifying Party.
- market_id: gm_2
  name: Retail supply of fixed telephony services — national (Cyprus, France, Ireland, Malta,
    Poland affected)
  definition_status: considered
  notes: The Commission consistently considered the market for the supply of fixed telephony
    services to be national in scope, reflecting national regulation and upstream wholesale
    services. This was not objected to by the Notifying Party.
- market_id: gm_3
  name: Wholesale market for international roaming services — national (Cyprus, France, Ireland,
    Italy, Malta, Poland affected)
  definition_status: considered
  notes: The Commission considered the wholesale market for international roaming to be national
    in scope, given that operating licenses for mobile services are nationally restricted due
    to regulatory barriers. The Notifying Party did not object.
- market_id: gm_4
  name: Wholesale market for mobile call termination services — national (Cyprus, France, Ireland,
    Italy, Malta, Poland affected)
  definition_status: considered
  notes: The Commission considered the wholesale market for mobile call termination services
    to be national in scope, as each market corresponds to the operator's network dimensions,
    which are nationally limited due to regulatory barriers. This was not objected to by the
    Notifying Party.
- market_id: gm_5
  name: Wholesale market for fixed call termination services — national (Cyprus, France, Ireland,
    Malta affected)
  definition_status: considered
  notes: The Commission considered the wholesale market for fixed call termination services
    to be national in scope, as the geographic scope of each market corresponds to the operator's
    network dimensions, which are nationally limited due to regulatory barriers. The Notifying
    Party agreed with this definition.
