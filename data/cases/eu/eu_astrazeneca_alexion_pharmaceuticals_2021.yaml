source_documents:
- doc_id: eu_astrazeneca_alexion_pharmaceuticals_2021_decision
  title: Astrazeneca / Alexion Pharmaceuticals — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.10165
  pdf_url: http://publications.europa.eu/resource/cellar/94fd5da2-65b2-11ed-9f85-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Treatments for pharmaceutical products in development
  definition_status: considered
  notes: The Commission generally referred to its past decisions where it envisaged market definitions
    based on indication, mode of action, and line of treatment for pharmaceutical products in
    development.
- market_id: pm_2
  name: Treatments of Lupus nephritis (LN)
  definition_status: left_open
  notes: The Commission assessed potential segmentations based on Mode of Action (MoA) and Line
    of Treatment (LoT) but found the market investigation inconclusive. It ultimately left the
    exact scope of the market open.
- market_id: pm_3
  name: Treatments for Follicular Lymphoma (FL)
  definition_status: left_open
  notes: The market investigation was not conclusive as to whether the treatments for FL should
    be sub-segmented, with potential segmentations by MoA or LoT remaining unclear.
- market_id: pm_4
  name: Treatments for Peripheral T-Cell Lymphoma (PTCL)
  definition_status: left_open
  notes: The market investigation was not conclusive on sub-segmentation for PTCL treatments,
    considering segmentation based on MoA and PTCL subtypes. The exact profile of pipeline drugs
    remained highly speculative.
geographic_markets_considered:
- market_id: gm_1
  name: Treatments for pharmaceutical products in development — at least EEA-wide
  definition_status: considered
  notes: The Commission referenced its consistent view from past decisions that markets for
    pipeline drugs are at least EEA-wide.
- market_id: gm_2
  name: Treatments of Lupus nephritis (LN) — at least EEA-wide
  definition_status: considered
  notes: The Commission explicitly stated that it consistently considered the markets for pipeline
    drugs to be at least EEA-wide, and the Notifying Party did not dispute this.
