  source_document_id: eu_astrazeneca_alexion_pharmaceuticals_2021_decision
  page: '2'
  quote_snippet: When defining relevant product markets in past decisions dealing with pharmaceutical
    products in development (also called pipeline products),6 the Commission has generally envisaged
    market definitions based on the indication, the mode of action (“MoA”) and, where relevant,
    the line of treatment (“LoT”),7 but ultimately left open the exact delineation of the market
    definition.
