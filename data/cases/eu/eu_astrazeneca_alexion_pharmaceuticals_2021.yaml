- passage_id: sp_4
  source_document_id: eu_astrazeneca_alexion_pharmaceuticals_2021_decision
  page: '5'
  quote_snippet: 'Segmentation based on the MoA: LN drugs with different MoAs target different
    pathways and, thus, may translate into distinct efficacy and safety profiles, which are
    key factors for physicians when prescribing drugs. However, at this stage, given the limited
    available data, the exact efficacy and safety profile of the various LN pipeline drugs remains
    uncertain.'
  extraction_method: pdf_extracted
