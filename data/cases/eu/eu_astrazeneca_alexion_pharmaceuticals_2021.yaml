  page: '8'
  quote_snippet: In the absence of Commission precedents for FL treatments, the Notifying Party
    submits that all marketed and pipeline treatments for FL belong to the same product market
    and should not be further segmented. In any event, according to the Notifying Party , this
    question can be left open as no competition concerns arise under any plausible market definitions.
