  page: '5'
  quote_snippet: In any event, for the purposes of this decision, the Commission concludes that
    the exact scope of the market for treatments of LN can be left open since the Transaction
    does not give rise to serious doubts as to its compatibility with the internal market and
    the functioning of the EEA Agreement under any plausible market definitions (i.e. segmentations
    by MoA and by LoT).
