product_markets_considered:
- market_id: pm_1
  name: Air compressors
  definition_status: left_open
  notes: The Commission considered air compressors and gas compressors to be separate markets.
    For air compressors, the Commission considered potential sub-segmentations by output pressure
    (low, medium, high), oil-free vs. oil-lubricated, stationary vs. portable, and by technology.
    The exact definitions for these sub-segments were left open. A segmentation by application
    was considered not warranted and rejected.
- market_id: pm_2
  name: Vacuum pumps
  definition_status: left_open
  notes: The Commission considered vacuum pumps to be a distinct product market from compressors.
    Potential sub-segmentations between oil-injected and oil-free vacuum pumps and by type of
    technology were considered but left open. A segmentation by application was considered not
    warranted and rejected.
- market_id: pm_3
  name: Air ends
  definition_status: left_open
  notes: The Commission noted prior decisional practice regarding a relevant product market
    for air ends, with plausible segmentation between oil-free and oil-lubricated. The market
    investigation suggested plausible segmentation between oil-injected vs. oil-free, by output
    pressure, and potentially by technology. Segmentation by application was considered not
    warranted and rejected.
geographic_markets_considered:
- market_id: gm_1
  name: Air compressors — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission previously considered the market for air compressors to be at least
    EEA-wide, and possibly global, but left the definition open. The market investigation showed
    mixed results, indicating it could be EEA-wide or worldwide. Ultimately, the exact definition
    was left open.
- market_id: gm_2
  name: Vacuum pumps — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission had no previous analysis of the market for vacuum pumps. The market
    investigation indicated a worldwide market. The Commission ultimately left the exact geographic
    market definition open between EEA and worldwide.
- market_id: gm_3
  name: Air ends — EEA-wide or worldwide
  definition_status: left_open
  notes: Previous Commission decisions considered the market for air ends to be national or
    EEA-wide, with a later decision considering it at least EEA-wide. The market investigation
    responses pointed to a worldwide market, and the Commission considered it at least EEA-wide
    and probably worldwide, but ultimately left the exact geographic scope open.
