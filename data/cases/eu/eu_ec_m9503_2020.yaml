  source_document_id: eu_ec_m9503_2020_decision
  page: '11'
  quote_snippet: In Ingersoll-Rand / Man, the Commission left open whether these are national
    or EEA-wide markets. The Commission acknowledged that there are nearly no trade barriers
    between the European countries concerned, however it took account of (i) existing strong
    national preferences in the market relations between compressor and air end suppliers and
    users, and (ii) the importance for customers of the reliability of products and good after-sales
    service.60 However, in the subsequent case Alchemy / Compare, the Commission considered
    that the market for compressor air ends is at least EEA-wide.
