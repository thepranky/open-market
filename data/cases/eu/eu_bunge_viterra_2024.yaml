product_markets_considered:
- market_id: pm_1
  name: Marketing (supply) of Rapeseed Oilseeds
  definition_status: considered
  notes: The Commission will separately consider the marketing (supply) of oilseeds, further
    segmented by specific type of crop.
- market_id: pm_2
  name: Marketing (supply) of Soybean Oilseeds
  definition_status: considered
  notes: The Commission will separately consider the marketing (supply) of oilseeds, further
    segmented by specific type of crop.
- market_id: pm_3
  name: Marketing (supply) of Sunflower Seed Oilseeds
  definition_status: considered
  notes: The Commission will separately consider the marketing (supply) of oilseeds, further
    segmented by specific type of crop.
- market_id: pm_4
  name: Purchasing (demand) of Rapeseed Oilseeds
  definition_status: considered
  notes: The Commission will separately consider the purchasing (demand) of oilseeds, further
    segmented by specific type of crop. The assessment of purchasing power is not limited to
    origination shares, but also considers overall demand shares.
- market_id: pm_5
  name: Purchasing (demand) of Soybean Oilseeds
  definition_status: considered
  notes: The Commission will separately consider the purchasing (demand) of oilseeds, further
    segmented by specific type of crop. The assessment of purchasing power is not limited to
    origination shares, but also considers overall demand shares.
- market_id: pm_6
  name: Purchasing (demand) of Sunflower Seed Oilseeds
  definition_status: considered
  notes: The Commission will separately consider the purchasing (demand) of oilseeds, further
    segmented by specific type of crop. The assessment of purchasing power is not limited to
    origination shares, but also considers overall demand shares.
- market_id: pm_7
  name: Direct purchasing of Rapeseed Oilseeds from farmers (origination)
  definition_status: considered
  notes: The Commission will separately consider the subsegment of direct purchasing of oilseeds
    from farmers (origination), further segmented by specific type of crop.
- market_id: pm_8
  name: Direct purchasing of Soybean Oilseeds from farmers (origination)
  definition_status: considered
  notes: The Commission will separately consider the subsegment of direct purchasing of oilseeds
    from farmers (origination), further segmented by specific type of crop.
- market_id: pm_9
  name: Direct purchasing of Sunflower Seed Oilseeds from farmers (origination)
  definition_status: considered
  notes: The Commission will separately consider the subsegment of direct purchasing of oilseeds
    from farmers (origination), further segmented by specific type of crop.
- market_id: pm_10
  name: Crude Rapeseed Oil
  definition_status: considered
  notes: The Commission considers that crude and refined oilseed oils form separate markets,
    and within crude oil seed, each type (rapeseed, sunflower, soybean) constitutes a separate
    product market.
- market_id: pm_11
  name: Crude Sunflower Oil
  definition_status: considered
  notes: The Commission considers that crude and refined oilseed oils form separate markets,
    and within crude oil seed, each type (rapeseed, sunflower, soybean) constitutes a separate
    product market.
- market_id: pm_12
  name: Crude Soybean Oil
  definition_status: considered
  notes: The Commission considers that crude and refined oilseed oils form separate markets,
    and within crude oil seed, each type (rapeseed, sunflower, soybean) constitutes a separate
    product market.
- market_id: pm_13
  name: Bulk Refined Rapeseed Oil (BRSO)
  definition_status: considered
  notes: The Commission considers that BRSO and PRSO form separate markets, and within BRSO,
    each type (rapeseed, sunflower, soybean) constitutes a separate product market.
- market_id: pm_14
  name: Bulk Refined Sunflower Oil (BRSO)
  definition_status: considered
  notes: The Commission considers that BRSO and PRSO form separate markets, and within BRSO,
    each type (rapeseed, sunflower, soybean) constitutes a separate product market.
- market_id: pm_15
  name: Bulk Refined Soybean Oil (BRSO)
  definition_status: considered
  notes: The Commission considers that BRSO and PRSO form separate markets, and within BRSO,
    each type (rapeseed, sunflower, soybean) constitutes a separate product market.
- market_id: pm_16
  name: Packed Refined Rapeseed Oil (PRSO)
  definition_status: left_open
  notes: The market definition for PRSO can be left open as no competition concerns arise. For
    the purpose of this decision, it will be assessed at the narrowest plausible level.
- market_id: pm_17
  name: Packed Refined Sunflower Oil (PRSO)
  definition_status: left_open
  notes: The market definition for PRSO can be left open as no competition concerns arise. For
    the purpose of this decision, it will be assessed at the narrowest plausible level.
- market_id: pm_18
  name: GMO vs non-GMO Crude Soybean Oil
  definition_status: left_open
  notes: The market investigation confirmed a distinction between GMO and non-GMO soybean oils
    is warranted, but the question of whether they are part of the same product market can remain
    open as no serious doubts arise under any alternative market definitions.
- market_id: pm_19
  name: Margarine
  definition_status: defined
  notes: The Commission confirmed that margarine is a distinct product market, separate from
    other vegetable fats.
- market_id: pm_20
  name: FAME Biodiesel
  definition_status: left_open
  notes: The exact product market definition for biodiesel can be left open as the Transaction
    does not give rise to competition concerns. For the purpose of this decision, it will be
    assessed at the narrowest plausible level, FAME biodiesel.
- market_id: pm_21
  name: Crude Glycerine
  definition_status: defined
  notes: The Commission considers that crude glycerine and refined glycerine form part of different
    product markets.
- market_id: pm_22
  name: Refined Glycerine
  definition_status: defined
  notes: The Commission considers that crude glycerine and refined glycerine form part of different
    product markets.
- market_id: pm_23
  name: Rapeseed Meals
  definition_status: considered
  notes: The Commission will assess the effects of the Transaction on the markets for the supply
    of rapeseed meals, soybean meals and sunflower meals separately, as oilseed meals were found
    not to be substitutable with other NGFI.
- market_id: pm_24
  name: Soybean Meals
  definition_status: considered
  notes: The Commission will assess the effects of the Transaction on the markets for the supply
    of rapeseed meals, soybean meals and sunflower meals separately, as oilseed meals were found
    not to be substitutable with other NGFI.
- market_id: pm_25
  name: Sunflower Meals
  definition_status: considered
  notes: The Commission will assess the effects of the Transaction on the markets for the supply
    of rapeseed meals, soybean meals and sunflower meals separately, as oilseed meals were found
    not to be substitutable with other NGFI.
- market_id: pm_26
  name: GMO vs non-GMO Soybean Meals
  definition_status: left_open
  notes: The market investigation confirmed the relevance of a distinction between GMO and non-GMO
    soybean meals, but the question of whether they are part of the same product market can
    remain open as no competition concerns can be identified under any alternative market definitions.
geographic_markets_considered:
- market_id: gm_1
  name: Purchasing (demand) of Oilseeds — catchment area (500km radius)
  definition_status: considered
  notes: The Commission's market investigation suggests a radius of 500km around a production
    plant for the purchasing of oilseed.
- market_id: gm_2
  name: Crude Oilseed Oil — catchment area (500km radius)
  definition_status: considered
  notes: The Commission considers the market for crude oilseed oil to be smaller than EEA-wide
    in scope, corresponding to catchment areas of 500 km. The competitive assessment is conducted
    at the national level first, and then at catchment area level.
- market_id: gm_3
  name: Bulk Refined Seed Oil (BRSO) — catchment area (750km radius)
  definition_status: considered
  notes: The Commission considers the market for BRSOs to be smaller than EEA-wide in scope,
    corresponding to catchment areas of 750 km. The competitive assessment is conducted at the
    national level first, and then at catchment area level.
- market_id: gm_4
  name: Packed Refined Rapeseed Oil (PRSO) — national
  definition_status: left_open
  notes: The exact geographic market definition can be left open as no competition concerns
    arise for PRSO regardless of whether the geographic scope is defined as EEA-wide or national.
    For the purpose of this decision, it will be assessed at national level.
- market_id: gm_5
  name: Packed Refined Sunflower Oil (PRSO) — national
  definition_status: left_open
  notes: The exact geographic market definition can be left open as no competition concerns
    arise for PRSO regardless of whether the geographic scope is defined as EEA-wide or national.
    For the purpose of this decision, it will be assessed at national level.
- market_id: gm_6
  name: FAME Biodiesel — EEA-wide
  definition_status: left_open
  notes: The exact geographic market definition for FAME biodiesel can be left open as the Transaction
    does not give rise to competition concerns. For the purpose of this decision, it will be
    assessed at EEA level.
- market_id: gm_7
  name: Crude Glycerine — EEA-wide
  definition_status: left_open
  notes: The exact geographic market definition for crude glycerine can be left open as the
    Transaction does not give rise to competition concerns. For the purpose of this decision,
    it will be assessed at EEA level.
- market_id: gm_8
  name: Rapeseed Meals — catchment area (500km radius)
  definition_status: considered
  notes: The market investigation suggests that a radius of 500km should be used for rapeseed
    meals.
- market_id: gm_9
  name: Sunflower Meals — catchment area (750km radius)
  definition_status: considered
  notes: The market investigation suggests that a radius of at least 750km should be used for
    sunflower meals.
- market_id: gm_10
  name: Soybean Meals — national or catchment area
  definition_status: left_open
  notes: The geographic scope for soybean meal markets is smaller than EEA-wide, and likely
    to be national or limited to catchment areas around crushing plants and ports of entry of
    soybean meal into the EEA.
- market_id: gm_11
  name: Purchasing (demand) of Sunflower Seed Oilseeds — national (Hungary affected)
  definition_status: considered
  notes: The Commission preliminarily finds that the Transaction raises serious doubts for the
    purchasing of sunflower seed in Hungary, based on a national assessment which serves as
    a first step before catchment area analysis.
- market_id: gm_12
  name: Bulk Refined Sunflower Oil (BRSO) — national (Hungary affected)
  definition_status: considered
  notes: The Commission found that the Parties would be able to distort competition for this
    market at the national level in Hungary. The quoted passage contains a typo, referring to
    'rapeseed BRSO in Poland' instead of 'sunflower BRSO in Hungary', but the context of the
    section (8.4.3.1. Hungary) indicates it refers to sunflower BRSO in Hungary. The national
    level is used as a first step for assessment.
- market_id: gm_13
  name: Rapeseed Meals — national (Hungary affected)
  definition_status: considered
  notes: The Commission found that the Transaction is likely to raise concerns for this market
    at the national level in Hungary, based on a national assessment which serves as a first
    step before catchment area analysis.
