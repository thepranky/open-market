  source_document_id: eu_cooper_viatris_european_otc_business_2024_decision
  page: '8'
  quote_snippet: The Commission has in the past considered that the relevant market for drugs
    for constipation should be defined at the ATC3 (class A6A).30 In other cases where drugs
    for constipation were analysed, the Commission similarly found that products in the ATC4
    classes of A6A are interchangeable to some degree, while ultimately leaving open the questions
    of whether the market should be defined at the ATC4 or ATC3 level,31 the distinction between
    Rx and OTC,32 and the distinction according to galenic forms (e.g. tablets, liquids, suppositories).
