case_id: eu_cooper_viatris_european_otc_business_2024
case_name: COOPER / VIATRIS (EUROPEAN OTC BUSINESS
authority: European Commission
jurisdiction: EU
sector: manufacturing
outcome: cleared
procedure_stage: phase1
decision_date: '2024-06-26'
parties:
- name: COOPER
  role: acquirer
- name: VIATRIS (EUROPEAN OTC BUSINESS
  role: target
source_documents:
- doc_id: eu_cooper_viatris_european_otc_business_2024_decision
  title: COOPER / VIATRIS (EUROPEAN OTC BUSINESS — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.11383
  pdf_url: http://publications.europa.eu/resource/cellar/42566421-7d9d-11ef-a67d-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: Drugs for constipation
  definition_status: left_open
  notes: The Commission considered past practice to define the market at ATC3 level, but ultimately
    left open whether it should be defined at ATC4 or ATC3 level, or segmented by Rx/OTC distinction,
    galenic forms, or mode of action, as the transaction did not raise concerns under narrower
    plausible markets.
- market_id: pm_2
  name: Laxative Enemas
  definition_status: considered
  notes: The Commission assessed the overlap in this market but concluded no serious doubts,
    noting substitutability for adult patients and distinct target patient groups.
- market_id: pm_3
  name: Laxative Enemas for infants
  definition_status: considered
  notes: The Commission considered this a plausible market, noting reduced substitutability
    for infants compared to adults, particularly for enemas in certain situations.
- market_id: pm_4
  name: Osmotic laxatives (with and without electrolytes)
  definition_status: considered
  notes: The Commission assessed this as a plausible market by combining A6A6 and A6A7, and
    found no competition concerns.
- market_id: pm_5
  name: Fibre laxatives
  definition_status: considered
  notes: The Commission assessed the overlap in this CHC3 class for Spain and found no competition
    concerns.
- market_id: pm_6
  name: Fibre laxatives in powder form
  definition_status: considered
  notes: The Commission assessed the overlap in this narrower CHC4 class for Spain and found
    no competition concerns.
- market_id: pm_7
  name: Suppositories
  definition_status: considered
  notes: The Commission assessed the overlap in this CHC4 class for France and found no competition
    concerns.
- market_id: pm_8
  name: Antiseptics and Disinfectants
  definition_status: left_open
  notes: The Commission previously defined the market at ATC3 D8A but in this decision left
    the product market definition open, as the transaction did not raise serious doubts under
    any plausible definition.
- market_id: pm_9
  name: Skin disinfection
  definition_status: considered
  notes: This CHC3 class was identified as an affected market for antiseptics and disinfectants
    in France, and the Commission found no concerns.
- market_id: pm_10
  name: Wound disinfection
  definition_status: considered
  notes: This CHC3 class was identified as an affected market for antiseptics and disinfectants
    in France and Italy, and the Commission found no concerns.
- market_id: pm_11
  name: Wound disinfection (liquids / lotions)
  definition_status: considered
  notes: This CHC4 class was identified as an affected market for antiseptics and disinfectants
    in France and Italy, and the Commission found no concerns.
- market_id: pm_12
  name: Wound disinfection (ointments / creams)
  definition_status: considered
  notes: This CHC4 class was identified as an affected market for antiseptics and disinfectants
    in France, and the Commission found no concerns.
- market_id: pm_13
  name: Liver disorder products, hepatic protectors and lipotropics
  definition_status: left_open
  notes: While past practice considered this ATC3 class, the market investigation in this case
    indicated that the Parties' products were not substitutable, leading the Commission to not
    further address these products as belonging to the same relevant product market.
- market_id: pm_14
  name: Topical products for joint and muscular pain
  definition_status: considered
  notes: The Commission considered the scope to be ATC3 M2A and CHC4 02E1K, without further
    segmentation by molecules/APIs. The question of segmentation by product form was left open.
- market_id: pm_15
  name: Magnesium supplements
  definition_status: left_open
  notes: The exact product market definition was left open, as no serious doubts arose even
    under the narrowest plausible market (ATC4 A12C1). Market investigation results for substitutability
    were mixed.
- market_id: pm_16
  name: Prostate products
  definition_status: left_open
  notes: The exact product market definition was left open, as no serious doubts arose even
    under the narrowest plausible market (CHC4 12F1C).
- market_id: pm_17
  name: Earwax removal products
  definition_status: defined
  notes: The Commission concluded that systemic homeopathic solutions and mechanical earwax
    removers should not be included, defining the market as narrower earwax removal products
    (ATC4 S2D1).
- market_id: pm_18
  name: Tonics
  definition_status: left_open
  notes: The market investigation indicated that the Parties' products in this CHC3 class had
    different end uses and did not compete, leading the Commission to not further address these
    products.
- market_id: pm_19
  name: Mouthwash for halitosis
  definition_status: left_open
  notes: The exact product market definition was left open, as no serious doubts arose under
    any plausible market definition. Market investigation results were inconclusive regarding
    substitutability with other mouthwashes.
- market_id: pm_20
  name: Wart/corn removal products
  definition_status: left_open
  notes: The exact product market definition was left open, as no serious doubts arose under
    any plausible market definition. Market investigation results were inconclusive regarding
    substitutability across different modes of action.
- market_id: pm_21
  name: Antiparasitic haircare products
  definition_status: left_open
  notes: The exact product market definition was left open, as no serious doubts arose under
    any plausible market definition. Market investigation results were inconclusive regarding
    substitutability across different forms.
- market_id: pm_22
  name: FDPs
  definition_status: left_open
  notes: For the FDPs that are vertically affected, the precise delineation of the market was
    left open because no competition concerns arose under any plausible relevant market definition.
- market_id: pm_23
  name: Private hospital services
  definition_status: left_open
  notes: For the purposes of this case, the product market definition for hospital services
    was left open as no serious doubts arose even under the narrowest plausible definition.
- market_id: pm_24
  name: Retail sale of health and beauty products
  definition_status: left_open
  notes: The exact product market definition was left open as no serious doubts arose under
    any plausible definition for the purposes of this case.
geographic_markets_considered:
- market_id: gm_1
  name: FDPs — national (various countries affected)
  definition_status: defined
  notes: The Commission consistently defines the relevant markets for FDPs as national in scope,
    and found no indications in the market investigation to depart from this practice for this
    case, including for vertically affected FDPs.
- market_id: gm_2
  name: Private hospital services — local (Attica, Greece affected)
  definition_status: defined
  notes: The Commission concluded the relevant market for general private hospital services
    to be local in scope (Attica).
- market_id: gm_3
  name: Retail sale of health and beauty products — national (Germany affected)
  definition_status: considered
  notes: The Commission typically defines this market as national, influenced by uniform pricing
    and marketing strategies, and considered this for the vertical assessment in Germany.
theories_of_harm: []
commitments: []
