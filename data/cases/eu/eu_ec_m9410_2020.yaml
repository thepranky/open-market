  quote_snippet: (157) The Commission has in the past considered the market for EOAs and its
    potential sub-segments.173 While acknowledging that MEA, DEA and TEA are used in different
    applications for which they are not substitutable, the Commission also noted that these
    three products might be substitutable to some extent when used as solvents. On the supply-side,
    the Commission noted that these three products are invariably produced together within the
    same production facilities, while pointing out that switching production between MEA, DEA
    and TEA can be difficult. The Commission ultimately left open whether EOAs constitutes a
    single product market or it should be further sub-segmented between MEA, DEA and TEA.
