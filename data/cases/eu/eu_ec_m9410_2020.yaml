  quote_snippet: (176) The majority of respondents to the market investigation confirmed that
    pygas is not generally substitutable with other products, though some respondents pointed
    out that for particular applications there may be a degree of substitutability with other
    chemical products (for example, toluene might be used as a gasoline blending component in
    place of pygas).193 Respondents to the market investigation generally considered that treated
    and untreated pygas are substitutable, though some pointed out that treated and untreated
    pygas have different product qualities and that untreated pygas is usually processed into
    treated pygas on-site, rather than being sold on the merchant market.194
