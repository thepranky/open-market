  page: '8'
  quote_snippet: (27) Butyl rubber is an elastomer produced by polymerisation of isobutylene
    with a smaller amount of isoprene. Butyl rubber can be further halogenated using chlorine
    or bromine processes. The products obtained are referred to, separately as halogenated chlorobutyl
    rubber and halogenated bromobutyl rubber (respectively), or jointly as halogenated butyl
    rubber – as opposed to non-halogenated butyl rubber. Around 75% of global butyl rubber output
    is in the form of halogenated butyl rubber (with the remainder being non-halogenated butyl
    rubber). All major global butyl rubber producers produce both regular and halogenated butyl
    rubber.
  extraction_method: pdf_extracted
