  quote_snippet: (305) The market investigation indicated that the relevant geographic market
    for butadiene could be EEA-wide or even worldwide.311 The majority of respondents considered
    that the market for butadiene is worldwide or EEA-wide, noting that butadiene is traded
    around the world and that the EEA is a net exporter of butadiene due to comparatively low
    feedstock prices in Europe.312 Competitors explained that, given the favourable feedstock
    prices within the EEA, imports to the EEA are relatively limited.313 However, the majority
    of customers responding to the market investigation confirmed that they could credibly source
    butadiene from suppliers based outside the EEA for use in their facilities within the EEA.314
