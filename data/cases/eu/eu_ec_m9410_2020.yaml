product_markets_considered:
- market_id: pm_1
  name: butyl rubber
  definition_status: left_open
  notes: The Commission considered segmenting butyl rubber into non-halogenated and halogenated,
    and further into halogenated bromobutyl or chlorobutyl rubber, but left the precise definition
    open as no serious doubts were raised under any plausible definition.
- market_id: pm_2
  name: Ethylene glycols (EGs)
  definition_status: left_open
  notes: The Commission considered whether EGs constitute a separate single product market or
    whether they should be further sub-segmented between mono-ethylene glycol (MEG), di-ethylene
    glycol (DEG) and tri-ethylene glycol (TEG), but left the precise definition open.
- market_id: pm_3
  name: Ethylene propylene terpolymer rubber and ethylene propylene co-polymer (EP(D)M)
  definition_status: left_open
  notes: The Commission considered whether EPDM and EPM should be part of the same market or
    segmented, but left the precise definition open.
- market_id: pm_4
  name: Polyethylene
  definition_status: left_open
  notes: The Commission considered polyethylene as a single relevant product market or segmented
    between HDPE, LDPE and LLDPE (further segmented into C4, C6, C8 LLDPE), but left the exact
    scope open.
- market_id: pm_5
  name: Polypropylene resins (PP resins)
  definition_status: left_open
  notes: The Commission considered whether the market for PP resins should be segmented between
    homopolymers, impact (block) co-polymers and random co-polymers, but left the exact product
    market definition open.
- market_id: pm_6
  name: Ethanolamines (EOAs)
  definition_status: left_open
  notes: The Commission considered whether EOAs constitute a single product market or should
    be further sub-segmented between mono-ethanolamine (MEA), di-ethanolamine (DEA) and tri-ethanolamine
    (TEA), but left the exact scope open.
- market_id: pm_7
  name: Pygas
  definition_status: left_open
  notes: The Commission considered whether there is a distinct market for pygas overall, or
    if there are separate markets for untreated pygas and treated pygas, but left this question
    open.
- market_id: pm_8
  name: Tailgas
  definition_status: left_open
  notes: The Commission has not previously considered the market definition for tailgas. Market
    investigation indicated no further subcategories are necessary.
- market_id: pm_9
  name: Raffinate-2
  definition_status: left_open
  notes: The Commission has not previously considered the product market definition for raffinate-2.
    Market investigation indicated no further segmentation is necessary.
- market_id: pm_10
  name: Polybutadiene rubber (PBR)
  definition_status: considered
  notes: The Commission, in line with previous decisions, considered PBR to form a single relevant
    product market.
- market_id: pm_11
  name: Hydrogen
  definition_status: left_open
  notes: The Commission considered segmenting hydrogen by its mode of delivery (tonnage, bulk,
    and cylinders), consistent with precedents, but left the exact scope open.
- market_id: pm_12
  name: Hydrogenated nitrile butadiene rubber (HNBR)
  definition_status: left_open
  notes: The Commission has not previously considered the product market definition for HNBR.
    Market investigation indicated that it may be appropriate to define a separate product market
    for HNBR, and no further segmentation (e.g. by grade) is considered relevant.
- market_id: pm_13
  name: Ethylene oxide (EO)
  definition_status: left_open
  notes: The Commission considered whether onsite and off-site supplies constituted two separate
    markets, but ultimately left the exact market definition open.
- market_id: pm_14
  name: Butadiene
  definition_status: left_open
  notes: The Commission previously considered butadiene a separate product market, but in more
    recent decisions left the precise definition open. Market investigation confirmed no further
    segmentation is necessary.
- market_id: pm_15
  name: Chloroprene rubber
  definition_status: left_open
  notes: The Commission previously found chloroprene rubber forms a separate product market,
    but in this case, left the precise definition open. Market investigation suggested it might
    be appropriate to segment by grade.
- market_id: pm_16
  name: Ethylene
  definition_status: left_open
  notes: The Commission previously considered ethylene a separate relevant product market. Market
    investigation largely confirmed this view.
- market_id: pm_17
  name: Butene-1 (C4)
  definition_status: left_open
  notes: The Commission has not previously considered butene-1 as a separate relevant product
    market, treating LAOs as a single market or leaving segmentation open. Market investigation
    showed mixed views on substitutability within LAOs for polyethylene production.
- market_id: pm_18
  name: Propylene
  definition_status: left_open
  notes: The Commission previously considered propylene a separate market or left it open. Market
    investigation confirmed it as a separate market but identified three grades (polymer, chemical,
    industrial/refinery) with high supply-side substitutability.
- market_id: pm_19
  name: Hexene-1 (C6)
  definition_status: left_open
  notes: The Commission has not previously considered hexene-1 a separate relevant product market,
    typically treating LAOs as a single market or leaving segmentation open. Market investigation
    noted partial substitutability with other LAOs for polyethylene production but not for other
    chemical syntheses.
geographic_markets_considered:
- market_id: gm_1
  name: butyl rubber — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission's precedents considered the market to be at least EEA-wide, and probably
    larger. Market investigation strongly supported a worldwide scope due to global supply/demand,
    few barriers to trade, and global sourcing by customers.
- market_id: gm_2
  name: Ethylene glycols (EGs) — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedents considered the market to be at least EEA-wide, Western Europe,
    or possibly global. Market investigation indicated it is likely worldwide, or at least EEA-wide,
    due to significant worldwide trade patterns, ease of transport, and commodity nature.
- market_id: gm_3
  name: Ethylene propylene terpolymer rubber and ethylene propylene co-polymer (EP(D)M) — EEA-wide
    or worldwide
  definition_status: left_open
  notes: Commission precedents considered the market at least EEA-wide and probably larger.
    Market investigation strongly indicated a worldwide scope.
- market_id: gm_4
  name: Polyethylene — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedents considered the market to be Western Europe or EEA-wide, and possibly
    global. Market investigation indicated it is likely worldwide.
- market_id: gm_5
  name: Polypropylene resins (PP resins) — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedents left open whether the market was Western Europe, EEA-wide or
    global. Market investigation strongly indicated it is likely worldwide or at least EEA-wide.
- market_id: gm_6
  name: Ethanolamines (EOAs) — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedents considered the market to be at least EEA-wide, and possibly global.
    Market investigation indicated it is likely worldwide, specifically for DEA.
- market_id: gm_7
  name: Pygas — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedents considered the market to be Western Europe or EEA-wide. Market
    investigation indicated it is at least EEA-wide, if not global, due to lack of material
    barriers to trading.
- market_id: gm_8
  name: Tailgas — national, pipeline network, EEA-wide, or worldwide
  definition_status: left_open
  notes: The Commission has not previously considered the geographic market definition for tailgas.
    Market investigation results were inconclusive, suggesting it could be national, regional
    (pipeline network), or EEA-wide.
- market_id: gm_9
  name: Raffinate-2 — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission has not previously considered the geographic market definition for raffinate-2.
    Market investigation indicated it is likely EEA-wide, or potentially worldwide, despite
    transportation limitations.
- market_id: gm_10
  name: Polybutadiene rubber (PBR) — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission previously considered the geographic market for synthetic latex products
    (including PBR) to be EEA-wide. Market investigation indicated it is likely worldwide or
    at least EEA-wide.
- market_id: gm_11
  name: Hydrogen — tonnage (EEA-wide/worldwide), bulk (national/EEA-wide), cylinders (national)
  definition_status: left_open
  notes: Commission precedents found tonnage hydrogen market EEA-wide, and national for bulk
    and cylinders. Market investigation confirmed EEA-wide for tonnage (with some worldwide
    elements), national for cylinders, and national/EEA-wide for bulk.
- market_id: gm_12
  name: Hydrogenated nitrile butadiene rubber (HNBR) — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission has not previously considered the geographic market definition for HNBR.
    Market investigation indicated it is likely worldwide due to global trade patterns and sourcing
    by global automotive manufacturers.
- market_id: gm_13
  name: Ethylene oxide (EO) — regional or EEA-wide
  definition_status: left_open
  notes: Commission precedents considered the market to be Western Europe or regional due to
    transportation difficulties. Market investigation indicated it is likely regional or EEA-wide,
    with significant cross-border trade flows within and beyond the EEA.
- market_id: gm_14
  name: Butadiene — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedents found the market to be Western Europe or 'Western Europe +'.
    Market investigation indicated it could be EEA-wide or worldwide due to global trade and
    EEA as a net exporter.
- market_id: gm_15
  name: Chloroprene rubber — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedents considered the market EEA-wide, if not wider, and noted global
    operations. Market investigation indicated it is likely worldwide or at least EEA-wide.
- market_id: gm_16
  name: Ethylene — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedents considered the market to be as broad as pipeline networks due
    to flammability. Market investigation confirmed global shipping is possible, but viability
    in EEA is limited by pipeline network access.
- market_id: gm_17
  name: Butene-1 (C4) — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedents considered the geographic market for all LAOs (including butene-1)
    to be global or at least EEA-wide. Market investigation confirmed global trade for LAOs
    with ease.
- market_id: gm_18
  name: Propylene — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedents considered the market at least Western European and possibly
    EEA-wide. Market investigation suggested the market is global due to steady inter-regional
    flows and global pricing influences.
- market_id: gm_19
  name: Hexene-1 (C6) — EEA-wide or worldwide
  definition_status: left_open
  notes: Commission precedents considered the geographic market for all LAOs (including hexene-1)
    to be global or at least EEA-wide. Market investigation confirmed global trade for LAOs,
    including hexene-1, with ease.
