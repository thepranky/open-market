product_markets_considered:
- market_id: pm_1
  name: Operation and management of lower-pressure gas distribution networks (DSOs)
  definition_status: considered
  notes: The Commission previously found the operation and management of a lower-pressure gas
    distribution network to be a relevant product market and a natural monopoly. For the purposes
    of the present case, the Commission will assess the effects of the Transaction by reference
    to separate markets for the DSOs’ distribution networks and for the local distribution of
    gas through LDSs.
- market_id: pm_2
  name: Local distribution of gas through LDSs
  definition_status: considered
  notes: The Commission has previously assessed, but left open, whether LDSs are part of a single
    market for the distribution of natural gas. For the purposes of the present case, the Commission
    will assess the effects of the Transaction by reference to separate markets for the DSOs’
    distribution networks and for the local distribution of gas through LDSs.
- market_id: pm_3
  name: Retail supply of natural gas to small customers (annual consumption below 630 MWh)
  definition_status: considered
  notes: The exact product market definition of the retail supply of gas market in Czechia is
    left open. The Commission will assess the effects of the Transaction on the market for small
    customers, with an annual consumption below 630 MWh.
- market_id: pm_4
  name: Retail supply of natural gas to large customers (annual consumption above 630 MWh)
  definition_status: considered
  notes: The exact product market definition of the retail supply of gas market in Czechia is
    left open. The Commission will assess the effects of the Transaction on the market for large
    customers, with an annual consumption above 630 MWh.
geographic_markets_considered:
- market_id: gm_1
  name: Operation and management of lower-pressure gas distribution networks (DSOs) — local
    (Czechia affected)
  definition_status: considered
  notes: The Commission will assess the effects of the Transaction by reference to the narrowest
    plausible geographic market delimitations, i.e., geographic markets corresponding to the
    territory covered by each (regional or local) distribution network.
- market_id: gm_2
  name: Local distribution of gas through LDSs — local (Czechia affected)
  definition_status: considered
  notes: The Commission will assess the effects of the Transaction by reference to the narrowest
    plausible geographic market delimitations, i.e., geographic markets corresponding to the
    territory covered by each (regional or local) distribution network.
- market_id: gm_3
  name: Retail supply of natural gas to large customers (annual consumption above 630 MWh) —
    national (Czechia affected)
  definition_status: left_open
  notes: The exact geographic market definition can be left open. For the purposes of this decision,
    the Commission will only assess the market for the retail supply of natural gas at the national
    level.
- market_id: gm_4
  name: Retail supply of natural gas to small customers (annual consumption below 630 MWh) —
    national (Czechia affected)
  definition_status: left_open
  notes: The exact geographic market definition can be left open. For the purposes of this decision,
    the Commission will only assess the market for the retail supply of natural gas at the national
    level.
