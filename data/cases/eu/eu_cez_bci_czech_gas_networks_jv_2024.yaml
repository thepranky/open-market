- passage_id: sp_1
  source_document_id: eu_cez_bci_czech_gas_networks_jv_2024_decision
  page: '6'
  quote_snippet: In previous decisions, the Commission, the gas product markets have been segmented
    into (i) exploration of crude oil and natural gas, (ii) the development, production, and
    upstream wholesale supply of natural gas, (iii) downstream wholesale supply of natural gas,
    (iv) gas transmission (via high- pressure systems), (v) gas distribution (via lower-pressure
    systems), (vi) gas storage, (vii) gas trading, (viii) retail supply of gas (to end customers),
    and (ix) the markets for the infrastructure for gas imports.26
  extraction_method: pdf_extracted
