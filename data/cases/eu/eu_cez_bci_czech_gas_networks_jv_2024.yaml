- passage_id: sp_7
  source_document_id: eu_cez_bci_czech_gas_networks_jv_2024_decision
  page: '9'
  quote_snippet: Therefore, for purposes of the present case, the Commission considers that
    the exact product market definition of the retail supply of gas market in Czechia can be
    left open as the Transaction does not raise serious doubts as to its compatibility with
    the internal market under any plausible market definition. As market shares are not significantly
    different in the additional sub-segmentations considered above, the Commission will assess
    the effects of the Transaction only on the markets for (i) small customers, with an annual
    consumption below 630 MWh (‘small customers’) and (ii) large customers, with an annual consumption
    above 630 MWh (‘large customers’).
  extraction_method: pdf_extracted
