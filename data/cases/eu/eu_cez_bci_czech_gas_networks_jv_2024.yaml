- passage_id: sp_5
  source_document_id: eu_cez_bci_czech_gas_networks_jv_2024_decision
  page: '7'
  quote_snippet: For purposes of the present case, the exact product market definition, namely
    the question of whether LDSs are part of DSOs’ distribution markets, may be left open, considering
    that the Transaction does not raise serious doubts as to its compatibility with the internal
    market under any plausible market definition. The Commission will assess the effects of
    the Transaction by reference to the narrowest plausible product market delimitations, i.e.,
    separate markets for the DSOs’ distribution networks and for the local distribution of gas
    through LDSs.
  extraction_method: pdf_extracted
