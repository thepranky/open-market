- passage_id: sp_6
  source_document_id: eu_omers_abp_kenter_2023_decision
  page: '6'
  quote_snippet: 'The results of the market investigation however suggest that there could be
    a distinct market for the assessment and interpretation of metering data, for example, in
    order to suggest measures to reduce energy consumption: while all responding competitors
    indicated that they provide such services, only a minority of customers source these services
    from their metering services suppliers. The majority of responding customers assess and
    interpret the metering data in-house and a small minority of customers rely on another supplier
    than its metering supplier. For the purpose of this Decision, the question can however be
    left open as the Transaction does not lead to an overlap on the possible segment for the
    assessment and interpretation of metering data with a specific objective.'
  extraction_method: pdf_extracted
