- passage_id: sp_4
  source_document_id: eu_omers_abp_kenter_2023_decision
  page: '6'
  quote_snippet: Concerning the possible segment for sub-metering activities, the majority of
    responding customers and competitors to the market investigation consider that sub-meters
    and main meters belong to the same market. One competitor noted that “meters and sub-meters
    both serve the same underlying customer demand for insights on energy consumption”. The
    large majority of customers source sub-meters from the same suppliers than main meters.
    In any case, the question can be left open, as it does not affect the Commission’s conclusions
    regarding the compatibility of the Transaction with the internal market.
  extraction_method: pdf_extracted
