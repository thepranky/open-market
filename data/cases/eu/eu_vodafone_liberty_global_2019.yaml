    services constitutes one single market without the need to distinguish between type of call
    (local, national and international) or technology (traditional fixed lines or Voice over
    internet Protocol ("VoIP")11). Nonetheless, it agrees that the product market definition
    can be left open for the purposes of the assessment of the Transaction.
