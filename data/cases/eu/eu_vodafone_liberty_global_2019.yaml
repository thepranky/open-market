product_markets_considered:
- market_id: pm_1
  name: Retail supply of fixed telephony services
  definition_status: considered
  notes: The Commission considered that the relevant product market encompasses the retail provision
    of fixed telephony services both through fixed telephony lines and through VoIP services.
    The question as to whether residential and non-residential customers constitute separate
    markets or rather separate segments within the same market was left open.
- market_id: pm_2
  name: Retail supply of fixed internet access services
  definition_status: defined
  notes: The market includes all product types, distribution modes, and speeds/bandwidths, for
    residential and small business customers. It explicitly excludes fixed internet services
    provided through mobile network infrastructure. Large business customers are considered
    part of a separate market (retail business connectivity services).
- market_id: pm_3
  name: Retail supply of mobile telecommunications services
  definition_status: defined
  notes: The Commission concluded there is an overall retail market for mobile telecommunications
    services, without further subdivision by type of service, tariff, or customer. OTT services
    are excluded.
- market_id: pm_4
  name: Retail supply of TV services
  definition_status: left_open
  notes: The question whether the market for the supply of TV retail services should be segmented
    (by technology, FTA/Pay TV, linear/non-linear, MDU/SDU in Germany) was left open. The Commission
    considered that the Transaction would not significantly impede effective competition irrespective
    of the exact product market definition.
- market_id: pm_5
  name: Retail supply of TV signal transmission to MDU customers in Germany
  definition_status: defined
  notes: The Commission concluded that retail supply of TV signal transmission services to MDU
    (Multiple Dwelling Unit) customers constitutes a separate market from SDU customers. Within
    the MDU market, it was determined that neither satellite, terrestrial, nor IPTV are substitutes
    for retail TV signal transmission via cable and fibre (FTTB/H).
- market_id: pm_6
  name: Retail supply of TV signal transmission to SDU customers in Germany
  definition_status: left_open
  notes: The Commission concluded that retail supply of TV signal transmission services to SDU
    (Single Dwelling Unit) customers constitutes a separate market from MDU customers. However,
    for SDU customers, the question of which technologies (cable TV, IPTV, satellite, DVB-T,
    OTT) are included in the market was left open.
- market_id: pm_7
  name: Retail supply of multiple play services
  definition_status: left_open
  notes: The overall question as to whether there exist one or more multiple play markets, which
    are distinct from each of the underlying individual telecommunications services, was left
    open due to inconclusive market investigation results across all countries.
- market_id: pm_8
  name: 2P bundles (fixed telephony and internet services) in Germany
  definition_status: considered
  notes: For Germany, the Commission committed to assessing the effects of the transaction on
    specific multiple play bundles, including 2P bundles (fixed telephony and internet services),
    even though the overall market definition for multiple play services was left open.
- market_id: pm_9
  name: 3P bundles (fixed telephony, internet and TV services) in Germany
  definition_status: considered
  notes: For Germany, the Commission committed to assessing the effects of the transaction on
    specific multiple play bundles, including 3P bundles combining fixed telephony, internet
    and TV services.
- market_id: pm_10
  name: 3P bundles (fixed telephony, internet and mobile services) in Germany
  definition_status: considered
  notes: For Germany, the Commission committed to assessing the effects of the transaction on
    specific multiple play bundles, including 3P bundles combining fixed telephony, internet
    and mobile services.
- market_id: pm_11
  name: 4P bundles in Germany
  definition_status: considered
  notes: For Germany, the Commission committed to assessing the effects of the transaction on
    specific multiple play bundles, including 4P bundles.
- market_id: pm_12
  name: Retail business connectivity services
  definition_status: left_open
  notes: The market for retail business connectivity services is for large business customers,
    distinct from fixed internet access for residential/SMEs. The question of whether it should
    be further segmented into broadband access for large business, leased lines, and VPN services
    was left open.
- market_id: pm_13
  name: Retail internet hosting services
  definition_status: left_open
  notes: The product market definition for retail internet hosting services, including potential
    segments like co-location, shared/dedicated hosting, managed services, and content delivery
    services, was left open.
- market_id: pm_14
  name: Wholesale call termination services on fixed networks
  definition_status: defined
  notes: The Commission defined each of the Parties' individual fixed network as constituting
    a separate product market for wholesale call termination services, as there is no substitute
    for call termination on an individual network.
- market_id: pm_15
  name: Wholesale leased lines
  definition_status: left_open
  notes: The question whether the wholesale leased lines market should be further segmented
    (trunk vs. terminating, bandwidth above/below 2 Mbit/s, active vs. passive infrastructure)
    was left open, as the Transaction does not raise competition concerns under any possible
    product market definition.
- market_id: pm_16
  name: Wholesale termination and hosting of calls to non-geographic numbers
  definition_status: defined
  notes: The Commission considered there is an overall wholesale market for termination and
    hosting of calls to non-geographic numbers, distinct from other wholesale termination services
    due to different regulatory regimes, and no further segmentation was deemed necessary.
- market_id: pm_17
  name: Wholesale provision of domestic call transit services on fixed networks
  definition_status: defined
  notes: The Commission considered that there is a separate wholesale market for the provision
    of domestic call transit services on fixed networks, distinct from the international wholesale
    market for voice carrier services.
- market_id: pm_18
  name: Wholesale international carrier services
  definition_status: left_open
  notes: The exact product market definition for wholesale international carrier services was
    left open, as the Transaction does not raise competition concerns under any plausible market
    definition.
- market_id: pm_19
  name: Wholesale internet connectivity services
  definition_status: left_open
  notes: The question of whether the overall market for wholesale internet connectivity services
    should be further segmented between transit and peering, as well as the existence of a separate
    market for Tier 1 transit providers, was left open.
- market_id: pm_20
  name: Wholesale call termination services on mobile networks
  definition_status: defined
  notes: The Commission defined each individual mobile network as constituting a separate wholesale
    market for call termination, as there is no substitute for call termination on an individual
    network.
- market_id: pm_21
  name: Wholesale international roaming services
  definition_status: defined
  notes: The Commission retained its previous product market definition of a separate wholesale
    market for international roaming, comprising both terminating and originating calls.
- market_id: pm_22
  name: Wholesale supply and acquisition of TV channels — Czechia, Hungary, Romania
  definition_status: left_open
  notes: For Czechia, Hungary, and Romania, the question whether the market should be further
    segmented (i) between FTA or Pay TV, (ii) Premium Pay TV or Basic Pay TV, (iii) by genre,
    or (iv) between different types of infrastructures was left open, as no competition concerns
    would arise.
- market_id: pm_23
  name: Wholesale supply and acquisition of TV channels (FTA vs. Pay TV) in Germany
  definition_status: defined
  notes: For Germany, the Commission concluded that the market for the wholesale supply and
    acquisition of TV channels should be further divided between FTA and pay TV channels. Other
    possible segmentations were left open.
- market_id: pm_24
  name: Wholesale TV signal transmission via cable in Germany
  definition_status: defined
  notes: The Commission concluded that the wholesale TV signal transmission market via cable
    in Germany constitutes a separate product market, not substitutable by satellite, IPTV,
    or DVB-T, given the specificities of the German market and market investigation results.
    It would also consider a market including IPTV for completeness.
- market_id: pm_25
  name: Intermediary TV signal delivery (cable and FTTB/H) in Germany
  definition_status: defined
  notes: The Commission concluded that the relevant product market includes both cable and FTTB/H
    (fibre-to-the-building/home) for intermediary TV signal delivery, limited to Level 3 operators.
    Other non-cable infrastructures like satellite and IPTV are excluded.
- market_id: pm_26
  name: Licensing and acquisition of broadcasting rights for TV content
  definition_status: left_open
  notes: The question of whether the market should be subdivided by Pay TV/FTA, linear/non-linear
    broadcast, exhibition window, or content type was left open across all countries, as no
    competition concerns would arise under any possible definition. Exclusive rights were not
    further considered.
geographic_markets_considered:
- market_id: gm_1
  name: Retail supply of fixed telephony services — national (Czechia, Germany, Romania, Hungary
    affected)
  definition_status: defined
  notes: The Commission defined the relevant geographic market as national in scope for each
    of Czechia, Germany, Romania, and Hungary, supported by market investigation findings regarding
    national pricing strategies and regulation.
- market_id: gm_2
  name: Retail supply of fixed internet access services — national (Czechia, Germany, Hungary,
    Romania affected)
  definition_status: defined
  notes: The Commission defined the relevant geographic market as national in scope for each
    of Czechia, Germany, Hungary, and Romania, based on market investigation findings supporting
    national competitive conditions and regulatory regimes.
- market_id: gm_3
  name: Retail supply of mobile telecommunications services — national (Czechia, Germany, Hungary,
    Romania affected)
  definition_status: defined
  notes: The Commission considered the geographic scope to be national for each of the territories
    where the parties operate mobile telecommunication services.
- market_id: gm_4
  name: Retail supply of TV services — national (Czechia, Germany, Romania, Hungary affected)
  definition_status: defined
  notes: The Commission considered the relevant geographic market for the retail supply of TV
    services to be national in scope for each of the territories where the parties are active.
- market_id: gm_5
  name: Retail supply of TV signal transmission to SDU customers in Germany — left_open
  definition_status: left_open
  notes: For the retail supply of TV signals to SDU customers in Germany, the geographic market
    definition was left open, as the Transaction would not significantly impede effective competition
    irrespective of the definition.
- market_id: gm_6
  name: Retail supply of multiple play services — national (Czechia, Germany, Romania, Hungary
    affected)
  definition_status: defined
  notes: The Commission considered that the geographic scope of any plausible retail market
    for multiple play services would be national, corresponding to each of the territories where
    the parties are active.
- market_id: gm_7
  name: Retail business connectivity services — national (Czechia, Germany, Romania, Hungary
    affected)
  definition_status: defined
  notes: The Commission defined the relevant geographic market for retail business connectivity
    services as national in scope for each of the territories where the parties are active.
- market_id: gm_8
  name: Retail internet hosting services — left_open
  definition_status: left_open
  notes: The exact geographic market definition for retail internet hosting services (national,
    EEA-wide, or worldwide) was left open, as the Transaction does not raise competition concerns
    under any possible definition.
- market_id: gm_9
  name: Wholesale call termination services on fixed networks — national (Czechia, Germany,
    Romania, Hungary affected)
  definition_status: defined
  notes: The Commission considered the geographic scope of the wholesale market for call termination
    on a fixed network to be national, corresponding to each of the territories where the parties
    are active.
- market_id: gm_10
  name: Wholesale leased lines — nationwide (Czechia, Germany, Romania, Hungary affected)
  definition_status: defined
  notes: The Commission considered the market for wholesale leased lines to be nationwide in
    scope, corresponding to each of the territories where the parties are active.
- market_id: gm_11
  name: Wholesale termination and hosting of calls to non-geographic numbers — national (Czechia,
    Germany affected)
  definition_status: defined
  notes: The Commission considered the geographic scope of the wholesale market for termination
    and hosting of calls to non-geographic numbers to be national, corresponding to Czechia
    and Germany.
- market_id: gm_12
  name: Wholesale provision of domestic call transit on fixed networks — national (Czechia,
    Germany, Hungary affected)
  definition_status: defined
  notes: The Commission considered the geographic scope of the wholesale market for domestic
    call transit on fixed networks to be national, corresponding to each of Czechia, Germany,
    and Hungary.
- market_id: gm_13
  name: Wholesale international carrier services — global
  definition_status: defined
  notes: The Commission concluded that the geographic market for wholesale international carrier
    services is global in scope.
- market_id: gm_14
  name: Wholesale internet connectivity services — left_open
  definition_status: left_open
  notes: The question of whether the geographic market definition for wholesale internet connectivity
    services is global or regional was left open, as the Transaction does not raise competition
    concerns under any possible geographic market definition.
- market_id: gm_15
  name: Wholesale call termination services on mobile networks — national (Czechia, Germany,
    Hungary, Romania affected)
  definition_status: defined
  notes: The Commission considered the geographic scope of the wholesale market for call termination
    on mobile networks to be national, corresponding to each of the territories where the parties
    are active.
- market_id: gm_16
  name: Wholesale international roaming services — national (Czechia, Germany, Hungary, Romania
    affected)
  definition_status: defined
  notes: The Commission considered the wholesale market for international roaming services to
    be national in scope, corresponding to each of the territories where the parties are active.
- market_id: gm_17
  name: Wholesale supply and acquisition of TV channels — national (Czechia, Germany, Hungary,
    Romania affected)
  definition_status: considered
  notes: While the exact geographic scope (national or linguistically homogeneous area) was
    left open, for the purpose of this Decision, the Commission committed to analysing the impact
    of the Transaction at a national level for Czechia, Germany, Hungary, and Romania, due to
    the parties' activities in these countries.
- market_id: gm_18
  name: Intermediary TV signal delivery (cable and FTTB/H) in Germany — regional
  definition_status: defined
  notes: The Commission defined the market for intermediary TV signal delivery in Germany as
    regional in scope, limited to the area of the relevant Level 3 operator, supported by market
    investigation findings that demand is local and can only be satisfied by Level 3 operators
    in direct reach.
- market_id: gm_19
  name: Licensing and acquisition of broadcasting rights for TV content — national (Czechia,
    Germany, Hungary, Romania affected)
  definition_status: considered
  notes: While the exact geographic scope (national or linguistically homogeneous area) was
    left open, for the purpose of this Decision, the Commission committed to analysing the impact
    of the Transaction at a national level for Czechia, Germany, Hungary, and Romania.
