    and products offered: (i) the local (limited to the area where the web-hosting centre is
    located) supply of basic co-location services such as connectivity, power, and the facilities;
    (ii) the national supply of shared and dedicated hosting consisting of hosting a customer''s
    web-site on the web host''s servers and providing the necessary support applications; (iii)
    the national, possibly cross-border regional, supply of managed services to outsource complex
    enterprise applications and support infrastructure, including "front-end" and "back-office"
    applications hosted on the providers'' platforms (so-called ASP), and (iv) the national
    supply of content delivery services such as Streaming Content Delivery Services and Static
    Content Delivery Products.181 However, the Commission did not conclude on the exact market
