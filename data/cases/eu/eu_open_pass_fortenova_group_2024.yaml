- passage_id: sp_2
  source_document_id: eu_open_pass_fortenova_group_2024_decision
  page: '6'
  quote_snippet: The Notifying Party agrees that the supply of fresh fruits and vegetables constitute
    different markets but does not consider it necessary to further segment these markets according
    to the type of fruits or vegetables. Moreover, the Notifying Party considers a segmentation
    based on the level in the supply chain, i.e. between the production level and the wholesale
    level is warranted for both the supply of fresh fruits and fresh vegetables. The Notifying
    Party considers that in any event, the product market definition can be left open because
    the Transaction does not give rise to serious doubts under all plausible market definitions.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
