product_markets_considered:
- market_id: pm_1
  name: Production and wholesale supply of fresh fruits and fresh vegetables
  definition_status: left_open
  notes: The Commission considered but left open whether to segment these markets by level in
    the supply chain (production vs. wholesale) and by type/category of fruits/vegetables (except
    bananas).
- market_id: pm_2
  name: Production and supply of sweet spreadable products
  definition_status: left_open
  notes: The Commission left open the question of whether a narrower sub-segment for chocolate
    spreadable products should be considered, as well as segmentation by sales channel or label
    (branded/private label).
- market_id: pm_3
  name: Supply of non-perishable vegetables
  definition_status: left_open
  notes: The Commission considered but left open whether to segment this market based on packaging
    (cans/glass), type of vegetables, and sales channel (retailers/HoReCa).
- market_id: pm_4
  name: Wholesale supply of non-food daily consumer goods
  definition_status: left_open
  notes: The Commission contemplated but left open segmentation between several broad product
    categories, including electrical products, cookware, clothing/footwear, DIY, health/beauty,
    toys/games, sporting goods, and stationery.
- market_id: pm_5
  name: Procurement of daily consumer goods
  definition_status: left_open
  notes: The Commission considered a distinct market for the procurement of daily consumer goods
    and various segmentations (e.g., into 19 or 23 product categories, and by sales channels
    like food-retailing, cash and carry stores). It decided to assess the effects on all plausible
    market definitions, specifically for fresh fruits and vegetables, preserved food, and other
    non-food products usually found in supermarkets.
- market_id: pm_6
  name: Retail distribution of daily consumer goods
  definition_status: left_open
  notes: The Commission considered a segmentation between modern distribution channel outlets
    (supermarkets, hypermarkets, discount stores) and small-format stores (convenience stores,
    kiosks, specialised outlets).
- market_id: pm_7
  name: Rental of real estate properties
  definition_status: left_open
  notes: 'The Commission considered segmentation by: (i) distinct from development and management
    services, (ii) residential vs. commercial use, (iii) commercial properties into office,
    retail, and industrial, and (iv) retail properties by size (e.g., shopping centres of at
    least 8,000 sqm or 10,000 sqm).'
geographic_markets_considered:
- market_id: gm_1
  name: Production and wholesale supply of fresh fruits and fresh vegetables — national (Croatia,
    Slovenia affected)
  definition_status: left_open
  notes: The Commission's precedents considered the market to be at least national, if not regional
    or EEA-wide. The market investigation confirmed this, but for the purpose of the decision,
    the Commission assessed the effects on the narrowest plausible geographic market (national
    level) where market shares were highest.
- market_id: gm_2
  name: Production and supply of sweet spreadable products — national (Croatia, Slovenia affected)
  definition_status: considered
  notes: The Commission considered the geographic market to be national in scope, consistent
    with its precedents and the market investigation.
- market_id: gm_3
  name: Supply of non-perishable vegetables — national (Croatia, Slovenia affected)
  definition_status: considered
  notes: The Commission considered the market to be national in scope, consistent with its precedents
    and the market investigation, despite the Notifying Party arguing for a broader scope.
- market_id: gm_4
  name: Wholesale supply of non-food daily consumer goods — national (Croatia, Slovenia affected)
  definition_status: considered
  notes: The Commission considered the market to be at least national in scope, consistent with
    its precedents and the market investigation.
- market_id: gm_5
  name: Procurement of daily consumer goods — national (Croatia, Slovenia affected)
  definition_status: left_open
  notes: The Commission's precedents defined the market as national, but one precedent also
    indicated it could be wider. The market investigation did not provide reasons to depart,
    so the Commission left it open but assessed the effects on the narrowest plausible (national)
    level.
- market_id: gm_6
  name: Retail distribution of daily consumer goods — local (Croatia, Slovenia affected)
  definition_status: left_open
  notes: The Commission's precedents defined this market by reference to catchment areas (10,
    20, or 30 minutes driving time) depending on store size. The market investigation did not
    provide reasons to depart from this. The geographic market definition was left open.
- market_id: gm_7
  name: Rental of real estate properties — national or narrower (Croatia affected)
  definition_status: left_open
  notes: The Commission's precedents considered the geographic scope to be national or narrower
    (regional or local), but ultimately left the question open. The market investigation did
    not provide reasons to depart from this.
