- passage_id: sp_13
  source_document_id: eu_open_pass_fortenova_group_2024_decision
  page: '12'
  quote_snippet: 'In previous decisions, the Commission has considered a distinct market for
    the procurement of daily consumer goods, comprising the purchase of daily consumer goods
    by customers such as wholesalers, retailers and other firms from upstream producers and
    suppliers. The Commission considered a further segmentation of that market into 19 relevant
    product markets corresponding to different types of goods, namely: (i) meat and sausages,
    (ii) poultry and eggs, (iii) bread and pastries, (iv) dairy products, (v) fresh fruits and
    vegetables, (vi) beer, (vii) wine and spirits, (viii) non-alcoholic beverages, (ix) hot
    beverages, (x) confectionery, (xi) basic food products, (xii) preserved food, (xiii) frozen
    food, (xiv) baby food, (xv) pet food, (xvi) body care articles (e.g. creams, lotions) and
    cosmetics (make-up and perfumes); (xvii) detergents, polishes and cleaning products, (xviii)
    other drugstore products; and (xix) other non-food products usually found in supermarkets
    (e.g. newspapers, magazines, entertainment).'
  extraction_method: pdf_extracted
