- passage_id: sp_15
  source_document_id: eu_open_pass_fortenova_group_2024_decision
  page: '13'
  quote_snippet: For the purpose of this decision, the Commission will assess the effects of
    the Transaction on all plausible market definitions on which the Parties’ activities overlap
    for the procurement of daily consumer goods, i.e. on the market for the procurement of (i)
    fresh fruits and vegetables (for completeness, the Commission will also take into account
    plausible further distinctions (i.a) between fresh fruits and fresh vegetables, (i.b) within
    each of these categories, between various types of fruits and vegetables and (i.c) within
    each of these segmentations, by sales channel), and (ii) preserved food (with a plausible
    further distinction for non-perishable vegetables and sweet spreadable products) and (iii)
    other non-food products usually found in supermarkets (for completeness, the Commission
    will also take into account a plausible further distinction for household products).
  extraction_method: pdf_extracted
