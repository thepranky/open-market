- passage_id: sp_1
  source_document_id: eu_open_pass_fortenova_group_2024_decision
  page: '6'
  quote_snippet: In past decisions, the Commission considered that the production and wholesale
    supply of fresh fruits and fresh vegetables belong to separate markets, due to the fresh
    fruits and fresh vegetables’ difference in characteristics, prices and intended use. The
    Commission considered, but ultimately left open, the question of whether a further segmentation
    of each of these markets (i) based on the level in the supply chain, i.e. between the production
    level and the wholesale level, and (ii) by type/category of fruits (with the exception of
    bananas, which the Commission considered to constitute a distinct market) and vegetables.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
