product_markets_considered:
- market_id: pm_1
  name: Trading services for derivative contracts
  definition_status: considered
  notes: The Commission referenced previous decisions where the provision of trading services
    for derivative contracts was distinguished based on underlying asset classes, execution
    environment, types of contracts, and currency pairs. These are not definitive conclusions
    for this specific case but inform the subsequent analysis.
- market_id: pm_2
  name: FX trading services
  definition_status: left_open
  notes: The Commission considered that separate FX trading services markets exist for exchange-traded
    and OTC traded FX products. However, further distinctions (trading channel, pre-trade transparency,
    type of contract, currency) were left open as they would not affect the outcome of the assessment.
- market_id: pm_3
  name: Derivatives clearing
  definition_status: defined
  notes: The Commission concluded that there are separate product markets for the clearing of
    derivatives by underlying asset class, execution environment, type of customer, and type
    of contract. For this decision, distinctions by customer and contract type were not considered
    relevant, focusing on OTC FX clearing and OTC IRD clearing.
- market_id: pm_4
  name: Trade processing services
  definition_status: defined
  notes: The Commission, informed by market investigation, concluded that trade processing services
    consist of separate markets by asset class, trade type (bilateral, tri-party), and service
    type (at least NOE messaging, PB give-up management, CCP connectivity).
- market_id: pm_5
  name: Prime broker (PB) give-up management services
  definition_status: defined
  notes: The Commission concluded that PB give-up management services are a separate relevant
    product market from other trade processing services and can be distinguished by asset class
    and trade type. Further distinctions by service type or trading channel were left open.
- market_id: pm_6
  name: NOE messaging services
  definition_status: defined
  notes: The Commission concluded that NOE messaging services are a separate product market
    from other trade processing services, and can be distinguished by asset class and trade
    type. Further distinctions by type of contract, execution environment, trading channels
    (electronic vs. bilateral/voice), and independent vs. captive provision were left open.
- market_id: pm_7
  name: CCP connectivity services
  definition_status: defined
  notes: The Commission concluded that CCP connectivity services are a separate product market
    from other trade processing services, and that it is appropriate to define separate markets
    by asset class. Whether narrower markets delineated by type of trade or only for OTC traded
    derivatives would be appropriate was left open.
- market_id: pm_8
  name: Credit limit management for OTC derivatives
  definition_status: defined
  notes: The Commission considered that credit limit management services are a separate product
    market from other trade processing services. However, distinctions by asset class, pre-
    and post-trade provision, and third-party provision were left open as not affecting the
    outcome.
- market_id: pm_9
  name: Trade confirmation services
  definition_status: defined
  notes: The Commission considered the relevant product market to be the provision of trade
    confirmations. Distinctions by asset class or for third-party provision were left open as
    not affecting the outcome.
- market_id: pm_10
  name: Portfolio compression services
  definition_status: defined
  notes: The Commission concluded that portfolio compression services are separate product markets
    from trade processing services and are split by asset class. The question of whether there
    are separate markets for third-party providers versus CCPs was left open.
- market_id: pm_11
  name: Portfolio reconciliation services
  definition_status: defined
  notes: The Commission concluded that portfolio reconciliation services are separate product
    markets from trade processing services and are split by asset class. The question of whether
    there are separate markets for third-party providers versus CCPs was left open.
- market_id: pm_12
  name: Margin management services
  definition_status: defined
  notes: The Commission concluded that margin management services are separate product markets
    from trade processing services and are split by asset class. The question of whether there
    are separate markets for third-party providers versus CCPs was left open.
- market_id: pm_13
  name: Basis risk mitigation services
  definition_status: defined
  notes: The Commission concluded that basis risk mitigation services are separate product markets
    from trade processing services and are split by asset class. The question of whether there
    are separate markets for third-party providers versus CCPs was left open.
- market_id: pm_14
  name: RED codes
  definition_status: left_open
  notes: The market investigation indicated that RED codes likely are a separate market. However,
    the Commission left open whether RED codes form a distinct market or are part of a larger
    market comprising other identifiers (e.g., LEIs paired with ISINs), as this would not affect
    the outcome.
geographic_markets_considered:
- market_id: gm_1
  name: OTC FX trading services — worldwide or at least EEA-wide
  definition_status: left_open
  notes: The Commission noted that the relevant geographic market for OTC FX trading is likely
    global and at least EEA-wide, but left the exact definition open as it did not affect the
    assessment's outcome.
- market_id: gm_2
  name: Bilateral FX NOE messaging services — worldwide
  definition_status: defined
  notes: The Commission, based on market investigation, concluded that the geographic market
    for bilateral FX NOE messaging services is worldwide.
- market_id: gm_3
  name: CCP connectivity services — worldwide
  definition_status: defined
  notes: The Commission, based on market investigation, concluded that the relevant geographic
    market for CCP connectivity services is worldwide.
- market_id: gm_4
  name: Credit limit management for OTC derivatives — worldwide
  definition_status: defined
  notes: The Commission concluded that the geographic scope of the market for credit limit management
    for OTC derivatives is worldwide, noting that Traiana is the only third-party provider globally.
- market_id: gm_5
  name: Portfolio compression, portfolio reconciliation, margin management and basis risk mitigation
    — global
  definition_status: defined
  notes: The Commission concluded that the geographic market for portfolio compression, portfolio
    reconciliation, margin management, and basis risk mitigation is global, regardless of asset
    class or whether CCPs are included.
- market_id: gm_6
  name: RED codes — worldwide
  definition_status: defined
  notes: The Commission, informed by market investigation, concluded that the relevant geographic
    market for RED codes is worldwide.
