sector: manufacturing
outcome: cleared
procedure_stage: unknown
decision_date: '2021-06-30'
parties:
- name: AMD
  role: acquirer
- name: Xilinx
  role: target
source_documents:
- doc_id: eu_amd_xilinx_2021_decision
  title: AMD / Xilinx — Decision
  doc_type: decision
  case_page_url: https://competition-cases.ec.europa.eu/cases/M.10097
  pdf_url: http://publications.europa.eu/resource/cellar/8e5ffa9f-42f8-11ec-89db-01aa75ed71a1.0005.01/DOC_1
product_markets_considered:
- market_id: pm_1
  name: CPUs, discrete GPUs and FPGAs
  definition_status: defined
  notes: The Commission concluded that these three categories of semiconductor products belong
    to separate product markets.
- market_id: pm_2
  name: CPUs (including CPU-based SoCs and CPUs with integrated GPUs)
  definition_status: defined
  notes: The Commission concluded that for the purpose of this Decision, it would not distinguish
    CPUs from CPU-based SoCs or discrete CPUs from CPUs that contain an integrated GPU, effectively
    defining the CPU market to be inclusive of these forms.
- market_id: pm_3
  name: CPUs based on architecture (x86 vs. non-x86)
  definition_status: left_open
  notes: Segmentation between x86 CPUs and non-x86 CPUs was considered but left open by the
    Commission, as the distinction would not change the competitive assessment. Precedents previously
    found them to be separate markets due to incompatibility and high switching costs.
- market_id: pm_4
  name: CPUs for computers vs. CPUs for non-computer devices
  definition_status: left_open
  notes: Segmentation between CPUs for computer devices and CPUs for non-computer devices was
    considered but left open by the Commission, as the distinction would not change the competitive
    assessment. Precedents previously found them to be separate markets.
- market_id: pm_5
  name: CPUs by device type (e.g. servers, desktops, laptops)
  definition_status: left_open
  notes: Segmentation of CPUs for computer devices by device type (e.g., servers, desktops,
    laptops) was considered but left open by the Commission, as the distinction would not raise
    competition concerns.
- market_id: pm_6
  name: Discrete GPUs
  definition_status: defined
  notes: The Commission concluded that discrete GPUs constitute a separate product market from
    integrated GPUs, which are usually integrated into CPUs.
- market_id: pm_7
  name: Discrete GPUs for data centres
  definition_status: defined
  notes: The Commission concluded that discrete GPUs for data centres and discrete GPUs for
    gaming and professional visualisation constitute separate markets.
- market_id: pm_8
  name: Discrete GPUs for gaming and professional visualisation
  definition_status: defined
  notes: The Commission concluded that discrete GPUs for gaming and professional visualisation
    constitute a separate market from discrete GPUs for data centres. The market includes gaming
    and other professional visualisation tasks.
- market_id: pm_9
  name: Discrete GPUs (including graphics cards)
  definition_status: defined
  notes: The Commission concluded that graphics cards fall into the same market as the discrete
    GPUs they house, based on supply-side substitutability.
- market_id: pm_10
  name: FPGAs vs. CPLDs
  definition_status: defined
  notes: The Commission concluded that FPGAs and CPLDs fall into different product markets.
- market_id: pm_11
  name: FPGAs vs. ASICs/ASSPs
  definition_status: defined
  notes: The Commission concluded that FPGAs and ASICs/ASSPs fall into different product markets.
- market_id: pm_12
  name: FPGAs (including standalone FPGAs and FPGA SoCs)
  definition_status: defined
  notes: The Commission concluded that standalone FPGAs and FPGA SoCs are in the same market,
    effectively defining the FPGA market to be inclusive of these forms.
- market_id: pm_13
  name: FPGAs segmented by performance level (high-end, mid-range, low-end)
  definition_status: left_open
  notes: Segmentation of FPGAs based on performance levels was considered but left open by the
    Commission, due to inconclusive results from the market investigation and no change to the
    competitive assessment.
- market_id: pm_14
  name: FPGAs for computer vs. non-computer devices
  definition_status: left_open
  notes: Segmentation of FPGAs between those for computer devices and non-computer devices was
    considered but left open by the Commission, due to inconclusive replies from the market
    investigation and no change to the competitive assessment.
- market_id: pm_15
  name: FPGAs used in different industrial sectors (e.g. automotive, telecommunications)
  definition_status: left_open
  notes: Segmentation of FPGAs based on the industrial sector of use was considered but left
    open by the Commission, due to insufficient clarity on supplier's ability to adjust production
    for specific environmental factors and no change to the competitive assessment.
- market_id: pm_16
  name: FPGAs by specific use cases
  definition_status: left_open
  notes: Segmentation of FPGAs based on specific use cases was considered but left open by the
    Commission, due to insufficient feedback on suppliers' ability to adjust production and
    no change to the competitive assessment.
- market_id: pm_17
  name: FPGAs for data centres vs. FPGAs used outside data centres
  definition_status: left_open
  notes: Segmentation of FPGAs between those used in data centres and those used outside data
    centres was considered but left open by the Commission, due to inconclusive results and
    no change to the competitive assessment.
- market_id: pm_18
  name: FPGAs vs. FPGA accelerator cards
  definition_status: left_open
  notes: The Commission left open whether FPGA accelerator cards are part of the same market
    as FPGAs, as the competitive assessment would not change.
- market_id: pm_19
  name: Chipsets
  definition_status: left_open
  notes: The Commission left open whether chipsets belong to the same product market as CPUs,
    noting that the distinction would have no effect on the competitive assessment.
- market_id: pm_20
  name: Semi-custom SoCs for the gaming market
  definition_status: left_open
  notes: The Commission considered these products distinct from CPUs, discrete GPUs, and FPGAs,
    and left open their exact market definition, as it would not change the outcome of the competitive
    assessment.
geographic_markets_considered:
- market_id: gm_1
  name: CPUs — worldwide
  definition_status: defined
  notes: The geographic market for CPUs was found to be worldwide in scope.
- market_id: gm_2
  name: FPGAs — worldwide
  definition_status: defined
  notes: The geographic market for FPGAs was found to be worldwide in scope.
- market_id: gm_3
  name: GPUs — worldwide
  definition_status: defined
  notes: The geographic market for GPUs was found to be worldwide in scope.
- market_id: gm_4
  name: Chipsets — worldwide
  definition_status: considered
  notes: A previous Commission decision (Intel/McAfee) found the geographic market for chipsets
    to be worldwide. This decision did not explicitly re-confirm or define it for chipsets in
    its conclusion, but only for CPUs, FPGAs, and GPUs.
theories_of_harm: []
commitments: []
