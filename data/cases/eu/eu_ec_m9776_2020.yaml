product_markets_considered:
- market_id: pm_1
  name: Merchant acquiring services
  definition_status: defined
  notes: The Commission considered merchant acquiring to constitute a separate product market,
    consistent with its precedents. It further assessed potential segmentations, ultimately
    defining POS merchant acquiring and e-commerce merchant acquiring as separate markets, while
    leaving others open or finding them not appropriate.
- market_id: pm_2
  name: POS merchant acquiring services
  definition_status: defined
  notes: Defined as a separate product market from e-commerce merchant acquiring.
- market_id: pm_3
  name: E-commerce merchant acquiring services
  definition_status: defined
  notes: Defined as a separate product market from POS merchant acquiring. Whether it can be
    further subdivided between APMs and card-based payments was left open.
- market_id: pm_4
  name: Merchant acquiring services segmented by payment card schemes (international/domestic)
  definition_status: left_open
  notes: The market investigation was inconclusive on this segmentation, and the precise scope
    was left open.
- market_id: pm_5
  name: Merchant acquiring services segmented by payment card brands (e.g. Visa, Mastercard)
  definition_status: left_open
  notes: The market investigation was inconclusive on this segmentation, and the precise scope
    was left open.
- market_id: pm_6
  name: Merchant acquiring services segmented by type of payment card (debit/credit)
  definition_status: left_open
  notes: The market investigation was inconclusive on this segmentation, and the precise scope
    was left open.
- market_id: pm_7
  name: Merchant acquiring services segmented by SMEs and large merchants
  definition_status: considered
  notes: The Commission considered such a segmentation not appropriate.
- market_id: pm_8
  name: Wholesale merchant acquiring and retail merchant acquiring services
  definition_status: considered
  notes: The Commission considered such a segmentation not appropriate for the purposes of this
    Transaction given the affected Member States.
- market_id: pm_9
  name: Manufacture and supply of POS terminals
  definition_status: defined
  notes: 'The market investigation confirmed the Notifying Party''s view of two distinct markets
    for POS terminals: manufacture/supply and provision/management.'
- market_id: pm_10
  name: Provision and management of POS terminals
  definition_status: defined
  notes: The market investigation confirmed this as a distinct market from manufacture and supply
    of POS terminals.
- market_id: pm_11
  name: Manufacture and supply of POS terminals segmented by type (traditional, mPOS, smartPOS)
  definition_status: left_open
  notes: The market investigation was not conclusive on this segmentation, and the question
    was left open as it would not change the competitive assessment.
- market_id: pm_12
  name: Provision and management of POS terminals segmented by customer size (SMEs and large
    customers)
  definition_status: considered
  notes: The Commission considered such a segmentation not appropriate.
- market_id: pm_13
  name: Acquiring processing services
  definition_status: defined
  notes: The Commission defined this as a separate product market and found no further segmentation
    appropriate, aligning with the Notifying Party's views.
- market_id: pm_14
  name: E-commerce acceptance services
  definition_status: defined
  notes: The Commission defined this as a separate product market, distinct from e-commerce
    merchant acquiring, and found no further segmentation appropriate. No horizontally or vertically
    affected market at EEA level.
- market_id: pm_15
  name: In-store acceptance services
  definition_status: defined
  notes: The Commission defined this as a separate product market distinct from merchant acquiring
    and acquiring processing, and found no further segmentation appropriate.
- market_id: pm_16
  name: NSP services in Germany
  definition_status: left_open
  notes: The Commission noted that NSP services may constitute a separate product market, comparable
    to domestic POS merchant acquiring, but ultimately left the definitive market definition
    open as the competitive assessment did not reveal concerns regardless.
geographic_markets_considered:
- market_id: gm_1
  name: POS merchant acquiring services — national
  definition_status: defined
  notes: The market investigation supported national markets for POS merchant acquiring services,
    noting the importance of local presence and the differing sets of competitors in each country.
- market_id: gm_2
  name: E-commerce merchant acquiring services — EEA-wide
  definition_status: defined
  notes: The market investigation and market structure supported an EEA-wide or global market
    for e-commerce merchant acquiring.
- market_id: gm_3
  name: Manufacture and supply of POS terminals — EEA-wide
  definition_status: defined
  notes: The market investigation confirmed the Notifying Party's view that this market is at
    least EEA-wide, due to terminals not being country-specific and customers being sophisticated
    international buyers.
- market_id: gm_4
  name: Provision and management of POS terminals — national
  definition_status: defined
  notes: The market investigation confirmed the Notifying Party's view that this market is national
    in scope, due to the need for local presence for maintenance and support.
- market_id: gm_5
  name: Acquiring processing services — EEA-wide
  definition_status: defined
  notes: The market investigation supported an EEA-wide market definition for acquiring processing
    services, as they are IT services deliverable from anywhere with common requirements across
    the EEA.
- market_id: gm_6
  name: E-commerce acceptance services — EEA-wide
  definition_status: defined
  notes: The market investigation supported an EEA-wide scope, with customers having EEA-wide
    procurement strategies and international players able to supply throughout the EEA.
- market_id: gm_7
  name: In-store acceptance services — EEA-wide
  definition_status: defined
  notes: The market investigation results supported an EEA-wide scope for in-store acceptance
    services, with customers sourcing from providers across the EEA and international players
    capable of supplying them.
