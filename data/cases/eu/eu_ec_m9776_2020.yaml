  quote_snippet: (28) The Commission’s market investigation was inconclusive as to whether the
    sub- segmentations considered in previous Commission decisions, namely (i) types of payment
    card schemes (international/domestic), (ii) payment card brands (e.g. Visa, Mastercard),
    and (iii) type of payment card (debit/credit) are appropriate. Regarding the segmentation
    between POS merchant acquiring and e-commerce merchant acquiring, the market investigation
    provided sufficient evidence to conclude that these constitute separate product markets.
    By contrast, the Commission considers that the market investigation did not provide sufficient
    evidence to distinguish between (i) SMEs and large merchants and (ii) wholesale merchant
    acquiring and retail merchant acquiring.
