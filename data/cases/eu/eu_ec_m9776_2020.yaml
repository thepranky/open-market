- passage_id: sp_21
  source_document_id: eu_ec_m9776_2020_decision
  page: '27'
  quote_snippet: '(109) In-store acceptance is a technical service that allows a merchant to
    optimise connection to multiple acquirers: it is a centralised platform that connects all
    POS terminals to all its merchant acquirers and allows concentration of transaction flows,
    multiple-acquirer switching or reporting services. In-store acceptance is not a mandatory
    technical service and is only provided to large retailers which have a significant volume
    of terminals and transactions for which optimisation of payment flows is necessary. The
    market investigation confirmed that a significant proportion of customers do not require
    in-store acceptance services at all and that those that do require in-store acceptance services
    procure them separately from other services such as merchant acquiring.130 Therefore, the
    Commission considers that in-store acceptance services constitute a market that is distinct
    from merchant acquiring and acquiring processing, the latter two being mandatory services,
    required by all types of customers.'
  extraction_method: pdf_extracted
  review_status: unreviewed
