- passage_id: sp_23
  source_document_id: eu_ec_m9776_2020_decision
  page: '32'
  quote_snippet: (132) It results from the above, that for the purposes of this decision, NSP
    services may constitute a separate product market. Such a market would be comparable to
    the domestic POS merchant acquiring services in other countries, as mentioned in this decision,
    but also includes additional functions, specific to the German market. Therefore, for the
    purposes of this decision the plausible markets for POS merchant acquiring for international
    card transactions and one for NSP services with its specific functions for domestic card
    transactions in Germany are assessed separately, followed by a conclusion for the overall
    market for POS merchant acquiring in Germany. However, for the purposes of this decision,
    it can ultimately be left open whether NSP services and POS merchant acquiring in Germany
    constitute separate markets or whether they form an overall market including both types
    of services. This is because the competitive assessment did not reveal competition concerns
    for any respective market definition.
  extraction_method: pdf_extracted
