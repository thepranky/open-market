  page: '5'
  quote_snippet: A number of elements point to the possibility that luxury and expedition cruises
    could form part of the same relevant market distinct from the overall cruise market, although
    the boundaries around the edges of this possible cruise segment appear blurred.
  extraction_method: pdf_extracted
