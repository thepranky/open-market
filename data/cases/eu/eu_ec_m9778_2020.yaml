- passage_id: sp_5
  source_document_id: eu_ec_m9778_2020_decision
  page: '5'
  quote_snippet: The ship size differs according to the type of cruise. For example, contemporary
    cruise brands operate the largest vessels (from approximately 100 000 GT and above). Premium
    cruises operate vessels that are somewhat smaller between 40 000 GT and 120 000 GT. Luxury
    and expedition cruise operations have smaller cruise ships (between 5,000 GT – and 60 000
    GT).
  extraction_method: pdf_extracted
  review_status: unreviewed
