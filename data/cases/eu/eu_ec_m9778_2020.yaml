- passage_id: sp_3
  source_document_id: eu_ec_m9778_2020_decision
  page: '4'
  quote_snippet: The Notifying Parties claim that land-based holidays and river cruises are,
    for at least some customers, substitutable for oceanic cruise holidays and exert competitive
    pressure on cruise operators. They nonetheless submit that the relevant product market within
    which to assess the Transaction is the market for oceanic cruises.
  extraction_method: pdf_extracted
