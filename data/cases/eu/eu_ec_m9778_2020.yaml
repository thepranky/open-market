  quote_snippet: For the purposes of this decision, it is not necessary to conclude on whether
    luxury/expedition cruises constitute a separate product market, as in any event the Transaction
    would not raise serious doubts as to its compatibility with the internal market.
  extraction_method: pdf_extracted
