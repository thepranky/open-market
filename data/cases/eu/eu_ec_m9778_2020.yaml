- passage_id: sp_10
  source_document_id: eu_ec_m9778_2020_decision
  page: '9'
  quote_snippet: A minority of respondents provided responses indicating that the relevant geographic
    market could be seen as comprising a cluster of German-speaking countries (i.e. Austria
    and Germany). However, since there is limited recourse to online booking when booking a
    luxury/expedition cruise, with customers tending to book through travel agents, which predominantly
    operate at national level, the Commission considers that there is not sufficient evidence
    to depart from the conclusion reached in its previous decisions that cruise markets are
    national.
  extraction_method: pdf_extracted
