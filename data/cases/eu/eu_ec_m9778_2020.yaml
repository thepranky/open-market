- passage_id: sp_1
  source_document_id: eu_ec_m9778_2020_decision
  page: '3'
  quote_snippet: Oceanic cruises involve a journey on board a ship undertaken for leisure purposes
    in maritime waters. Oceanic cruises generally combine cabins, restaurants, bars, casinos,
    swimming pools, spas, gyms, theatres, and shopping into a floating resort. Cruises typically
    embark from one port and then visit a number of destinations, either for a day or overnight,
    before returning to the same port or a different port to continue the journey.
  extraction_method: pdf_extracted
