  source_document_id: eu_ec_m10061_2021_decision
  page: '4'
  quote_snippet: 'The market investigation conducted in the present case confirmed the Commission’s
    findings in previous cases that (the production of): (i) CSDs; (ii) iced/ready-to-drink
    tea; (iii) iced/ready-to-drink coffee; (iv) packaged/bottled water; (v) energy drinks; (vi)
    juices; (vii) coffee; (viii) spirits; (ix) plant-based beverages/milk; (x) beer; and (xi)
    cider can be distinguished,8 since they ‘[address] different customer needs’.'
