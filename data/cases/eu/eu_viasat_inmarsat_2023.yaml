  source_document_id: eu_viasat_inmarsat_decision
  page: '26'
  quote_snippet: the results of the market investigation confirmed that the supply of satellite
    connectivity by SSPs can be segmented according to the industry of application. More specifically,
    the majority of respondents to the market investigation who expressed a view confirmed there
    is a separate market for the supply of satellite services to the aviation sector, for which
    satellite connectivity services for other industry segments/end-uses (e.g. maritime, consumer
    broadband internet) are not substitutable due to the specific requirements in the aviation
    sector (such as geographic coverage, specific technical equipment, airworthiness certifications,
    and others).
