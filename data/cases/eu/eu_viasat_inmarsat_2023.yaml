  - sp_47
- theory_id: toh_5
  name: Horizontal non-coordinated effects in the market for broadband IFC services to commercial
    aviation customers
  theory_type: horizontal
  theory_outcome: dismissed
  description: 'The Commission assessed SIEC from horizontal non-coordinated effects in the
    global and EEA-wide market for the supply of broadband IFC services to commercial aviation
    customers (and potential segments thereof, including satellite-only excluding ATG/hybrid).
    Dismissed on three principal grounds: (i) the merged entity''s market position remains moderate
    — globally [30-40]% with [10-20]pp increment, Intelsat [20-30]% and Panasonic [20-30]% remaining
    as significant competitors; at EEA level [30-40]% with [0-10]pp increment, below Panasonic
    at [40-50]%; (ii) customers have sufficient switching possibilities post-Transaction, with
    Intelsat, Panasonic, and Anuvu each constituting credible alternatives, and SpaceX at least
    constraining the merged entity; (iii) the market is nascent with expected further entry
    (OneWeb and other LEO operators) and partnerships, including hybrid GEO/LEO solutions. The
    Notifying Party also argued that vertical integration is not critical to success, that the
    market is highly dynamic and at an early stage, and that airlines have contractual remedies
    and multi-sourcing leverage. The Commission also concluded Ka-band is not necessary to compete
    and that non-vertically integrated providers (Panasonic, Anuvu) compete effectively by leasing
    SNO capacity.'
  verification:
    status: source_linked
