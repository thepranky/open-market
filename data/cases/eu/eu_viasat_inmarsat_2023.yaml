- passage_id: sp_10
  source_document_id: eu_viasat_inmarsat_decision
  page: '27'
  quote_snippet: The Commission agrees and considers that broadband and narrowband connectivity
    are not substitutable as each serves different customer needs. Broadband connectivity solutions
    have more bandwidth and can be used for more data-intensive applications, such as streaming
    or video-conferences. Narrowband connectivity solutions are less susceptible to signal interference
    and are used for less data-intensive tasks where resilience is critical, such as safety
    communication.
