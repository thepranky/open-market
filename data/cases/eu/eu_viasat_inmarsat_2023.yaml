  page: '30'
  quote_snippet: In light of the above, for the purpose of this decision, the Commission concludes
    that the relevant product market in this case is the overall market for the supply of broadband
    IFC services to commercial aviation customers, including both Ka- and Ku-bands and both
    GEO- and LEO-based solutions, and for both short-haul and long-haul flights. For the purpose
    of this Decision, the question of whether that market should be further segmented according
    to whether the IFC services are based on satellite technology or ATG technology or hybrid
    (satellite and ATG) can be left open because the Transaction would not significantly impede
    effective competition under any plausible market definition.
