product_markets_considered:
- market_id: pm_1
  name: Supply of satellite capacity (broadband satellite capacity)
  definition_status: left_open
  notes: Commission considers the relevant product market is likely the market for the supply
    of broadband satellite capacity. The question of whether this is part of a broader market
    (including narrowband) or should be further segmented (GEO/LEO, HTS/non-HTS, Ka-band/Ku-band)
    is left open since no SIEC under any plausible definition. The market investigation confirmed
    a separate market for the supply of satellite capacity at SNO level, distinguished from
    SSP and VAR levels. Broadband vs narrowband segmentation confirmed. Segmentation by industry
    segment, GEO vs NGSO/LEO, HTS vs non-HTS, and Ka-band vs Ku-band all left open.
- market_id: pm_2
  name: Supply of broadband IFC services to commercial aviation customers
  definition_status: defined
  notes: 'Commission concludes there is an overall market for broadband IFC services to commercial
    aviation customers, including Ka- and Ku-band, GEO- and LEO-based solutions, and both short-haul
    and long-haul flights (para 129). Possible further segmentation by satellite vs ATG/hybrid
    technology left open. Commission confirmed: (1) broadband vs narrowband segmentation warranted;
    (2) commercial vs business aviation segmentation warranted; (3) short-haul vs long-haul
    segmentation not warranted; (4) Ka-band vs Ku-band not warranted; (5) GEO vs LEO not warranted;
    (6) satellite vs ATG/hybrid left open.'
- market_id: pm_3
  name: Supply of IFC services to business aviation customers
  definition_status: left_open
  notes: Commission considers the relevant product market is likely the market for the supply
    of IFC services to business aviation customers. Further segmentation questions (broadband
    vs narrowband; large vs small business aircraft; aircraft size sub-segments) left open as
    no SIEC under any plausible definition. Commission confirmed this market is separate from
    commercial aviation IFC market.
- market_id: pm_4
  name: Supply of satellite connectivity services to maritime customers
  definition_status: considered
  notes: The Commission explicitly noted in footnote 147 (p.35) that the Transaction does not
    lead to horizontally affected markets in other markets where the Parties' activities overlap,
    citing maritime satellite connectivity as an example of a non-affected market alongside
    EEA government customers. No market definition analysis or competitive assessment was conducted
    for maritime connectivity. The Parties overlap here (Inmarsat is a major maritime connectivity
    provider) but the overlap does not exceed the affected-market threshold or was otherwise
    confirmed not to raise concerns.
geographic_markets_considered:
- market_id: gm_1
  name: Supply of satellite capacity — worldwide
  definition_status: defined
  notes: Commission concluded that the market for the supply of satellite capacity (and any
    potential segments thereof, including broadband satellite capacity) is worldwide in scope
    (para 81). Market investigation confirmed majority of market participants (both GEO and
    LEO SNOs) supply satellite capacity globally and conditions of competition are sufficiently
    homogenous at the worldwide level (para 80).
- market_id: gm_2
  name: Supply of broadband IFC services to commercial aviation customers — worldwide/EEA-wide
    (left open)
  definition_status: left_open
  notes: Commission considers the market is likely worldwide in scope, but left open whether
    the geographic scope is at least EEA-wide or worldwide, since the Transaction would not
    significantly impede effective competition under any plausible definition (para 134). Majority
    of customers confirmed procurement at worldwide level even for short-haul flights. Some
    differences due to coverage offered by IFC suppliers depending on geographic region. Both
    globally and in the EEA, the Parties exceed the 20% threshold.
- market_id: gm_3
  name: Supply of IFC services to business aviation customers — worldwide
  definition_status: defined
  notes: Commission concluded that the market for the supply of IFC services to business aviation
    customers (and the potential segment of large business jets) is worldwide in scope (para
    153). Market investigation confirmed procurement for both business aviation and large business
    jets is worldwide in scope, with conditions of competition sufficiently homogeneous at the
    worldwide level (para 152).
theories_of_harm:
- theory_id: toh_1
  name: Horizontal non-coordinated effects in the market for IFC services to business aviation
    customers
  theory_type: horizontal
  theory_outcome: dismissed
  description: 'The Commission assessed SIEC from horizontal non-coordinated effects in the
    global market for broadband IFC services to business aviation customers (and the potential
    sub-segment for large business jets). Dismissed because: (i) the merged entity''s market
    position is moderate ([20-30]% broadly, [30-40]% in large business jets sub-segment), with
    Gogo ([60-70]%) and Iridium ([40-50]%) remaining as larger competitors; (ii) customers retain
    switching ability due to credible alternatives (Iridium, Gogo, SES, IDAIR, Intelsat, Smart
    Sky, SpaceX); (iii) market is nascent with likely new entry or partnerships within three
    years. The Notifying Party also argued countervailing buyer power from VARs (Collins Aerospace,
    Honeywell Aerospace, Satcom Direct).'
  verification:
    status: source_linked
  source_passage_refs:
  - sp_28
  - sp_29
  - sp_30
  - sp_31
  - sp_32
- theory_id: toh_2
  name: Vertical effects — satellite capacity (upstream) / IFC services to commercial and business
    aviation (downstream)
  theory_type: vertical
  theory_outcome: dismissed
  description: The Commission identified vertical links between the supply of satellite capacity
    (upstream) and broadband IFC services to commercial and business aviation (downstream).
    These links are pre-existing as both parties are vertically integrated SNOs/SSPs. The Commission
    dismissed vertical concerns on the basis that the merged entity would not have a significant
    degree of market power in the affected markets, and therefore would lack the ability to
    foreclose downstream (input foreclosure) or upstream (customer foreclosure) rivals.
  verification:
    status: source_linked
  source_passage_refs:
  - sp_33
  - sp_34
  - sp_35
  - sp_36
- theory_id: toh_3
  name: Conglomerate effects
  theory_type: conglomerate
  theory_outcome: dismissed
  description: The Commission expressly stated the Transaction does not give rise to affected
    markets related to a conglomerate relationship.
  verification:
    status: source_linked
  source_passage_refs:
  - sp_37
- theory_id: toh_4
  name: Horizontal non-coordinated effects — supply of satellite capacity and potential segments
  theory_type: horizontal
  theory_outcome: dismissed
  description: 'The Commission assessed whether the merger would give rise to horizontal non-coordinated
    effects in the global market for the supply of satellite capacity (narrowest: broadband
    Ka-band HTS GEO satellite capacity). The theory was dismissed on three principal grounds:
    (i) combined market shares are moderate today ([20-30]%) and the increment is limited; (ii)
    the merged entity will not be pivotal and will not possess appreciable market power in the
    near future, given high levels of spare/excess capacity among competitors; and (iii) a sufficient
    number of credible alternatives exist post-Transaction (both GEO and LEO SNOs). The Notifying
    Party also argued the capacity is largely captive, the market is fungible, entry barriers
    are falling, and NGSO expansion will drive prices down. Market investigation respondents
    confirmed neutral competitive impact.'
  verification:
    status: source_linked
  source_passage_refs:
  - sp_27
  - sp_38
  - sp_39
  - sp_40
  - sp_41
  - sp_42
  - sp_43
  - sp_44
  - sp_45
  - sp_46
  - sp_47
- theory_id: toh_5
  name: Horizontal non-coordinated effects in the market for broadband IFC services to commercial
    aviation customers
  theory_type: horizontal
  theory_outcome: dismissed
  description: 'The Commission assessed SIEC from horizontal non-coordinated effects in the
    global and EEA-wide market for the supply of broadband IFC services to commercial aviation
    customers (and potential segments thereof, including satellite-only excluding ATG/hybrid).
    Dismissed on three principal grounds: (i) the merged entity''s market position remains moderate
    — globally [30-40]% with [10-20]pp increment, Intelsat [20-30]% and Panasonic [20-30]% remaining
    as significant competitors; at EEA level [30-40]% with [0-10]pp increment, below Panasonic
    at [40-50]%; (ii) customers have sufficient switching possibilities post-Transaction, with
    Intelsat, Panasonic, and Anuvu each constituting credible alternatives, and SpaceX at least
    constraining the merged entity; (iii) the market is nascent with expected further entry
    (OneWeb and other LEO operators) and partnerships, including hybrid GEO/LEO solutions. The
    Notifying Party also argued that vertical integration is not critical to success, that the
    market is highly dynamic and at an early stage, and that airlines have contractual remedies
    and multi-sourcing leverage. The Commission also concluded Ka-band is not necessary to compete
    and that non-vertically integrated providers (Panasonic, Anuvu) compete effectively by leasing
    SNO capacity.'
  verification:
    status: source_linked
