  source_document_id: eu_viasat_inmarsat_decision
  page: '20'
  quote_snippet: In light of the above, the Commission considers that the relevant product market
    in this case is likely the market for the supply of broadband satellite capacity. For the
    purposes of this Decision, the question of whether the market for the supply of broadband
    satellite capacity is part of a broader market for the supply of satellite capacity (including
    both broadband and narrowband) or should be further segmented based on (i) GEO or LEO satellite
    capacity, (ii) HTS or non-HTS capacity, and (iii) Ka-band or Ku-band capacity can be left
    open, since the Transaction would not significantly impede effective competition under any
    plausible market definition.
