product_markets_considered:
- market_id: pm_1
  name: Market for the supply of satellite capacity (broadband)
  definition_status: left_open
  notes: The Commission concluded the relevant product market is likely the market for the supply
    of broadband satellite capacity. The question of whether it is part of a broader market
    (including narrowband) or should be further segmented by (i) GEO/LEO, (ii) HTS/non-HTS,
    (iii) Ka-band/Ku-band was left open as the Transaction would not significantly impede effective
    competition under any plausible market definition. The Parties' only overlap at SNO level
    is in HTS GEO broadband (Ka-band) satellite capacity. The Commission considered segmentations
    between broadband/narrowband (confirmed as distinct), by industry segment (no need to segment),
    GEO vs NGSO/LEO (majority said no segmentation needed), HTS vs non-HTS (mixed results),
    Ka-band vs Ku-band (mixed results). Supply-side substitutability not considered at market
    definition stage due to inability to adjust satellite capacity post-launch.
- market_id: pm_2
  name: Market for the supply of broadband IFC services to commercial aviation customers
  definition_status: considered
  notes: 'The Commission concluded (for this Decision) that the relevant product market is the
    overall market for the supply of broadband IFC services to commercial aviation customers,
    including both Ka- and Ku-bands, both GEO- and LEO-based solutions, and both short-haul
    and long-haul flights. The question of further segmentation by satellite vs. ATG/hybrid
    technology was left open. The Commission confirmed: (1) broadband and narrowband IFC not
    substitutable (separate); (2) commercial and business aviation form separate markets; (3)
    no segmentation between short-haul and long-haul warranted; (4) Ka- and Ku-band are substitutable
    and part of same market; (5) GEO- and LEO-based IFC solutions are substitutable. There was
    also analysis of whether ATG/hybrid should be included, left open.'
- market_id: pm_3
  name: Market for the supply of IFC services to business aviation customers
  definition_status: left_open
  notes: The Commission concluded that the relevant product market is likely the market for
    the supply of IFC services to business aviation customers. Questions of further segmentation
    by service type (broadband/narrowband), aircraft type (large/small business aircraft), or
    aircraft size were left open as the Transaction would not significantly impede effective
    competition under any plausible market definition. The market investigation confirmed the
    broadband/narrowband distinction for this sector, but results on aircraft size/type segmentation
    were mixed. The Commission also separated commercial and business aviation IFC markets (see
    commercial IFC market entry).
geographic_markets_considered: []
theories_of_harm:
- theory_id: toh_1
  name: Horizontal non-coordinated effects in the market for IFC services to business aviation
    customers
  theory_type: horizontal
  theory_outcome: dismissed
  description: 'The Commission assessed SIEC from horizontal non-coordinated effects in the
    global market for broadband IFC services to business aviation customers (and the potential
    sub-segment for large business jets). Dismissed because: (i) the merged entity''s market
    position is moderate ([20-30]% broadly, [30-40]% in large business jets sub-segment), with
    Gogo ([60-70]%) and Iridium ([40-50]%) remaining as larger competitors; (ii) customers retain
    switching ability due to credible alternatives (Iridium, Gogo, SES, IDAIR, Intelsat, Smart
    Sky, SpaceX); (iii) market is nascent with likely new entry or partnerships within three
    years. The Notifying Party also argued countervailing buyer power from VARs (Collins Aerospace,
    Honeywell Aerospace, Satcom Direct).'
  verification:
    status: source_linked
  source_passage_refs:
  - sp_28
  - sp_29
  - sp_30
  - sp_31
  - sp_32
- theory_id: toh_2
  name: Vertical effects — satellite capacity (upstream) / IFC services to commercial and business
    aviation (downstream)
  theory_type: vertical
  theory_outcome: dismissed
  description: The Commission identified vertical links between the supply of satellite capacity
    (upstream) and broadband IFC services to commercial and business aviation (downstream).
    These links are pre-existing as both parties are vertically integrated SNOs/SSPs. The Commission
    dismissed vertical concerns on the basis that the merged entity would not have a significant
    degree of market power in the affected markets, and therefore would lack the ability to
    foreclose downstream (input foreclosure) or upstream (customer foreclosure) rivals.
  verification:
    status: source_linked
  source_passage_refs:
  - sp_33
  - sp_34
  - sp_35
  - sp_36
- theory_id: toh_3
  name: Conglomerate effects
  theory_type: conglomerate
  theory_outcome: dismissed
  description: The Commission expressly stated the Transaction does not give rise to affected
    markets related to a conglomerate relationship.
  verification:
    status: source_linked
  source_passage_refs:
  - sp_37
- theory_id: toh_4
  name: Horizontal non-coordinated effects — supply of satellite capacity and potential segments
  theory_type: horizontal
  theory_outcome: dismissed
  description: 'The Commission assessed whether the merger would give rise to horizontal non-coordinated
    effects in the global market for the supply of satellite capacity (narrowest: broadband
    Ka-band HTS GEO satellite capacity). The theory was dismissed on three principal grounds:
    (i) combined market shares are moderate today ([20-30]%) and the increment is limited; (ii)
    the merged entity will not be pivotal and will not possess appreciable market power in the
    near future, given high levels of spare/excess capacity among competitors; and (iii) a sufficient
    number of credible alternatives exist post-Transaction (both GEO and LEO SNOs). The Notifying
    Party also argued the capacity is largely captive, the market is fungible, entry barriers
    are falling, and NGSO expansion will drive prices down. Market investigation respondents
    confirmed neutral competitive impact.'
  verification:
    status: source_linked
  source_passage_refs:
