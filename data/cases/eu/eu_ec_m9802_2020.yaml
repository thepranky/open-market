  quote_snippet: In light of the above, the Commission concludes that, for the purpose of this
    decision and in line with its precdents, the wholesale supply of FTA/basic pay TV channels,
    and of premium pay TV channels should be considered as constituting two separate product
    markets, each including its ancillary services. The Commission also considers that each
    of these markets should not be further segmented based on the distribution technology of
    the channel in question. In that respect, the question whether these markets can be further
    segmented by genre can be left open, since the Transaction does not raise serious doubts
    as to its compatibility with the internal market or the functioning of the EEA Agreement
    under any such plausible product market definitions.
