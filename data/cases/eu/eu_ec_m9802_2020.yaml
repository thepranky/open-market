  quote_snippet: In light of the above, the Commission concludes that, for the purpose of this
    decision and in line with its previous practice, it is appropriate to consider as relevant
    the market for the non-captive production of AV content, while the question whether that
    relevant product marked needs to be further sub-segmented on the basis of content type or
    exhibition windows, or between scripted and non-scripted content, and between commissioned
    AV production or AV production for-hire can be left open, since the Transaction does not
    raise serious doubts as to its compatibility with the internal market or the functioning
    of the EEA Agreement under any such plausible product market definitions.
