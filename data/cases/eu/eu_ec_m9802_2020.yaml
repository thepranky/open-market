  quote_snippet: In its decision of 24 February 2015 in case M.7194 – Liberty Global/Corelio/W&W/De
    Vijver Media, the Commission has considered that, given that (i) FTA channels were mostly
    supplied together with basic pay TV channels, and (ii) the competitive assessment would
    remain the same even if FTA channels were regarded as belonging to a separate product market
    from that of basic pay TV, it was not necessary to make a distinction between FTA and basic
    pay TV channels on the market for wholesale supply of TV channels in that case.
