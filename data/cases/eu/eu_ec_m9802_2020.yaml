product_markets_considered:
- market_id: pm_1
  name: Production of AV content
  definition_status: considered
  notes: The Commission concluded that, for the purpose of this decision, it is appropriate
    to consider as relevant the market for the non-captive production of AV content. The question
    whether this market needs to be further sub-segmented on the basis of content type, exhibition
    windows, scripted and non-scripted content, or between commissioned AV production or AV
    production for-hire was left open.
- market_id: pm_2
  name: Licensing of broadcasting rights for pre-existing individual AV content
  definition_status: considered
  notes: The Commission considered that a relevant market for the licensing of broadcasting
    rights for pre-existing individual AV content has to be considered. The question whether
    this market needs to be further sub-segmented on the basis of content type, exhibition windows,
    scripted and non-scripted content, and premium and non-premium content was left open.
- market_id: pm_3
  name: Wholesale supply of FTA/basic pay TV channels
  definition_status: considered
  notes: The Commission concluded that the wholesale supply of FTA/basic pay TV channels should
    be considered as a separate product market, including its ancillary services. This market
    should not be further segmented based on the distribution technology. The question whether
    this market can be further segmented by genre was left open.
- market_id: pm_4
  name: Wholesale supply of premium pay TV channels
  definition_status: considered
  notes: The Commission concluded that the wholesale supply of premium pay TV channels should
    be considered as a separate product market, including its ancillary services. This market
    should not be further segmented based on the distribution technology. The question whether
    this market can be further segmented by genre was left open.
- market_id: pm_5
  name: Retail supply of AV services
  definition_status: left_open
  notes: The Commission left open the question as to whether the market for the retail supply
    of AV services should be segmented according to the type of AV services (FTA/basic pay AV
    services versus premium pay AV services, and/or linear versus non-linear services), and/or
    according to the distribution technology.
- market_id: pm_6
  name: Retail supply of fixed internet access services
  definition_status: left_open
  notes: The Commission concluded that the exact scope of the product market definition in relation
    to the provision of retail fixed internet access services can be left open. It considered
    but ultimately left open possible segmentations according to product type (narrowband, broadband,
    dedicated access), distribution technology (xDSL, fibre, cable), and customer type (residential,
    small business, larger business, public authorities).
- market_id: pm_7
  name: Retail supply of mobile telecommunication services
  definition_status: defined
  notes: The Commission concluded that the relevant product market is the overall retail market
    for mobile telecommunications services, without any further segmentations according to the
    type of services (voice calls, SMS, MMS, mobile internet data), the type of customers (pre-paid/post-paid,
    private/business), or the network technology (2G/3G/4G).
- market_id: pm_8
  name: Retail supply of multiple play bundles
  definition_status: left_open
  notes: The Commission left open the question as to whether there exist one or more multiple
    play markets which are distinct from each of the underlying individual telecommunications
    services. It noted the possibility of several possible markets, such as a market for fixed
    bundles (dual play, triple play) and another separate market for fixed-mobile convergence
    bundles (quadruple play).
- market_id: pm_9
  name: TV advertising
  definition_status: defined
  notes: The Commission concluded that the market for TV advertising constitutes a separate
    market from radio and online advertising. The question whether the market for TV advertising
    includes both Pay and FTA TV channels and/or AVOD services or whether it can be divided
    into those two segments was left open.
- market_id: pm_10
  name: Radio advertising
  definition_status: defined
  notes: The Commission concluded that the market for radio advertising constitutes a separate
    market from TV and online advertising.
- market_id: pm_11
  name: Online advertising
  definition_status: defined
  notes: The Commission concluded that the market for online advertising constitutes a separate
    market from TV and radio advertising.
geographic_markets_considered:
- market_id: gm_1
  name: Production of AV content — national or regional (Flanders or Flanders and Brussels Capital
    Region affected)
  definition_status: left_open
  notes: The Commission considered that the question whether the geographic scope of the market
    for the production of TV content was national or regional (the Flemish Region or the combination
    of the Flemish Region and the Brussels Capital Region) could be left open.
- market_id: gm_2
  name: Licensing of broadcasting rights for pre-existing individual AV content — national or
    by linguistic area (Dutch-speaking areas of Belgium affected)
  definition_status: left_open
  notes: The Commission concluded that the question whether the relevant geographic market for
    the licensing of individual broadcasting rights for AV content is national or by linguistic
    area (the Dutch-speaking areas of Belgium) can be left open.
- market_id: gm_3
  name: Wholesale supply of TV channels — Telenet's footprint, regional or national (Belgium
    affected)
  definition_status: left_open
  notes: The Commission concluded that the relevant geographic market for the wholesale supply
    of TV channels (including all possible sub-segments) is either the local footprint of Telenet's
    cable network, or its enlarged regional or national scopes, and the exact definition was
    left open.
- market_id: gm_4
  name: Retail supply of fixed internet access services — national (Belgium affected)
  definition_status: defined
  notes: The Commission concluded that, for the purpose of this decision, the relevant market
    for the provision of fixed internet services is national in scope, consistent with its previous
    practice.
- market_id: gm_5
  name: Retail supply of mobile telecommunication services — national (Belgium affected)
  definition_status: defined
  notes: The Commission concluded that, for the purpose of this decision, the relevant market
    for the retail provision of mobile telecommunications services is national in scope, consistent
    with its previous practice.
- market_id: gm_6
  name: TV advertising — national or regional (Flemish region, potentially including Brussels-capital
    region affected)
  definition_status: left_open
  notes: The Commission previously considered that the geographic markets for TV advertising
    is either national or regional (along linguistic lines; in Belgium concerning the Flemish
    region, potentially including the Brussels-capital region).
- market_id: gm_7
  name: Radio advertising — national or regional (Flemish region, potentially including Brussels-capital
    region affected)
  definition_status: left_open
  notes: The Commission previously considered that the geographic markets for radio advertising
    is either national or regional (along linguistic lines; in Belgium concerning the Flemish
    region, potentially including the Brussels-capital region).
- market_id: gm_8
  name: Online advertising — national or regional (Flemish region, potentially including Brussels-capital
    region affected)
  definition_status: left_open
  notes: The Commission previously considered that the geographic markets for online advertising
    is either national or regional (along linguistic lines; in Belgium concerning the Flemish
    region, potentially including the Brussels-capital region).
