  quote_snippet: In light of the above, the Commission concludes that, for the purpose of this
    decision and in light of its previous practice, the relevant geographic market for the wholesale
    supply of TV channels, including all the possible sub-segments, is either the local footprint
    of Telenet's cable network, or its enlarged regional or national scopes. In that respect,
    the Commission considers that the exact geographic market definition (i.e. whether it corresponds
    to Telenet's footprint, is regional or national) can be left open, since the Transaction
    does not raise serious doubts as to its compatibility with the internal market or the functioning
    of the EEA Agreement under any such plausible geographic market definitions.
