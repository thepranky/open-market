- passage_id: sp_2
  source_document_id: eu_ec_m9971_2021_decision
  page: '5'
  quote_snippet: '(18) The market investigation was not fully conclusive regarding whether the
    market for clearing services should be further segmented or not: − Segmentation between
    low-value and large-value payments: the results of the market investigation were mixed.
    A large majority of customers of payment clearing services consider that the two segments
    present similar competitive dynamics. However, virtually all providers of payment clearing
    services generally take the opposite view, stressing the existence of different providers
    and requirements, while acknowledging some convergence; − Segmentation between domestic
    and cross-border payments: the results of the market investigation suggest that the clearing
    of domestic payments and cross-border payments may constitute distinct markets. Around half
    of the respondents consider that the two segments present different competitive dynamics
    and landscape (due to the existence of different regulations, prices, currencies, etc.).
    However, a third of the respondents takes the opposite view and several of them stressed
    that the above distinction may become less relevant with P27; − Segmentation between batch
    and instant payments: the results of the market investigation suggest that the clearing
    of instant payments and batch payments could be part of the same market. For most participants,
    both types of payments are characterized by similar competitive dynamics and landscape;
    − Segmentation between A2A and card payments: most respondents consider that the clearing
    of card payments and A2A payments could be part of the same market. However, a significant
    minority takes the opposite view. A few market participants also stress a trend towards
    convergence.'
  extraction_method: pdf_extracted
  review_status: unreviewed
