- passage_id: sp_1
  source_document_id: eu_ec_m9971_2021_decision
  page: '4'
  quote_snippet: (14) Payment clearing services refer to the processing of interbank payments
    prior to the completion of the transaction and the transfer of funds (i.e. the settlement).
    P27 and Bankgirot are active in the clearing process but do not conduct the settlement process,
    which is carried out by distinct providers (typically central banks). In other words, clearing
    services entail all the processes that precede the transfer of funds, such as transmitting
    and reconciling interbank payments, confirming verifying that there are funds or credit
    available on individual accounts, authorising the transactions, etc.
  extraction_method: pdf_extracted
