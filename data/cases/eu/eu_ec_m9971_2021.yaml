- passage_id: sp_4
  source_document_id: eu_ec_m9971_2021_decision
  page: '6'
  quote_snippet: (20) In Mastercard/Nets,23 the Commission assessed the market for A2A invoice
    payment services, i.e. services/applications allowing end-users to transfer money from one
    bank account to another for the payment of invoices, which are mainly used for payments
    that are recurring (e.g. monthly utilities bill) but can also be used for the payment of
    one-off invoices. The Commission ultimately left open the question of whether A2A invoice
    payment services are part of a wider market for invoice payment services including recurring
    card-based payments, or segmented based on the types of transactions (e.g. C2B, B2B) and
    A2A payment methods (such as direct debit (i.e. A2A payment initiated by the payee on the
    basis of payer’s consent), credit transfer (i.e. A2A payment initiated by payer), payment
    slip, etc.).
