product_markets_considered:
- market_id: pm_1
  name: Distribution of aluminium
  definition_status: defined
  notes: The Commission concluded that a distinction by metal type is warranted, thus defining
    the distribution of aluminium as a separate market from other metals.
- market_id: pm_2
  name: Distribution of other metals (stainless steel, copper, brass, bronze)
  definition_status: defined
  notes: The Commission considered a distinction by metal type warranted, but found horizontal
    overlaps in other metals to be marginal and not giving rise to affected markets.
- market_id: pm_3
  name: Distribution of aluminium by producers/mills vs. wholesalers
  definition_status: left_open
  notes: The Commission investigated whether sales by producers/mills constitute a separate
    market from sales by wholesalers but left the definition open as no serious doubts arose
    regardless of this segmentation.
- market_id: pm_4
  name: Distribution of aluminium by wholesalers offering value-added services vs. not offering
    value-added services
  definition_status: left_open
  notes: The Commission investigated a segmentation based on value-added services offered by
    wholesalers but left the definition open due to mixed market investigation results and no
    serious doubts arising.
- market_id: pm_5
  name: Distribution of flat aluminium products
  definition_status: considered
  notes: The Commission considered that the distribution of flat aluminium products could constitute
    a distinct market due to differences in competitive dynamics, and would consider this segmentation
    in its competitive assessment.
- market_id: pm_6
  name: Distribution of long aluminium products
  definition_status: considered
  notes: The Commission considered that the distribution of long aluminium products could constitute
    a distinct market due to differences in competitive dynamics, and would consider this segmentation
    in its competitive assessment.
- market_id: pm_7
  name: Sub-segmentation within flat and long aluminium products (e.g. coils, bars, tubes, sheets)
  definition_status: left_open
  notes: The market investigation did not support a further sub-segmentation of flat and long
    aluminium products into narrower types, and this segmentation was not considered further
    in the decision.
geographic_markets_considered:
- market_id: gm_1
  name: Distribution of aluminium products — national (Denmark, Sweden, Finland affected)
  definition_status: left_open
  notes: The investigation suggested national markets for the wholesale distribution of aluminium
    products. However, the precise geographic market definition was left open as no serious
    doubts arose regardless of whether markets were considered national or regional.
- market_id: gm_2
  name: Distribution of aluminium products — regional (Nordics affected)
  definition_status: left_open
  notes: While the investigation suggested national markets, the Commission also considered
    regional markets (Nordics) in its competitive assessment. The precise geographic market
    definition was ultimately left open.
