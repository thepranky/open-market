- passage_id: sp_18
  source_document_id: eu_jd_sports_groupe_courir_2024_decision
  page: '16'
  quote_snippet: (73) In line with its decisional practice, the Commission’s investigation in
    the present case confirmed that while some parameters of competition can be influenced by
    national considerations, for the purpose of the competitive assessment, the scope of the
    geographic market for the retail supply of sports footwear and the retail supply of sports
    apparel (whether or not sub-segmented into leisure and performance) should be local, as
    consumers consider the geographic proximity of sports footwear/sports apparel stores and
    the possibility to visit such stores in person as important factors in their purchasing
    decisions for sports footwear and sports apparel.
  extraction_method: pdf_extracted
