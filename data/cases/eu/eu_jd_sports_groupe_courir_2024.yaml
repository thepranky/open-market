product_markets_considered:
- market_id: pm_1
  name: Retail supply of sports goods
  definition_status: segmented
  notes: The Commission considered the broader market for the retail supply of sports goods
    but then segmented it by product category. The Notifying Party's view was that the market
    should not be further segmented.
- market_id: pm_2
  name: Retail supply of sports footwear
  definition_status: defined
  notes: The Commission defined this market as a segment of the broader sports goods market,
    and further considered segmentation into leisure and performance sports footwear. This market
    includes mono-brands and online sales.
- market_id: pm_3
  name: Retail supply of sports apparel
  definition_status: defined
  notes: The Commission defined this market as a segment of the broader sports goods market,
    and further considered segmentation into leisure and performance sports apparel. This market
    includes mono-brands and online sales.
- market_id: pm_4
  name: Retail supply of sports equipment
  definition_status: defined
  notes: The Commission defined this market as a segment of the broader sports goods market.
    Segmentation between performance and leisure was found not to be relevant for sports equipment.
- market_id: pm_5
  name: Retail supply of leisure sports footwear
  definition_status: considered
  notes: The Commission assessed the competitive impact of the transaction based on this narrowest
    plausible market definition.
- market_id: pm_6
  name: Retail supply of performance sports footwear
  definition_status: considered
  notes: The Commission assessed the competitive impact of the transaction based on this narrowest
    plausible market definition.
- market_id: pm_7
  name: Retail supply of leisure sports apparel
  definition_status: considered
  notes: The Commission assessed the competitive impact of the transaction based on this narrowest
    plausible market definition.
- market_id: pm_8
  name: Retail supply of performance sports apparel
  definition_status: considered
  notes: The Commission assessed the competitive impact of the transaction based on this narrowest
    plausible market definition.
geographic_markets_considered:
- market_id: gm_1
  name: Retail supply of leisure sports footwear — local (EEA affected)
  definition_status: considered
  notes: 'The Commission considered the geographic market to be local across the EEA, with specific
    catchment area proxies depending on the urban/rural density: 30-minute drive for smaller
    cities/rural areas, 20-minute drive for large cities/Paris region, and 30-minute walk/3km/15-minute
    drive for Paris Intramuros.'
