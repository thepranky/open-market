- passage_id: sp_20
  source_document_id: eu_jd_sports_groupe_courir_2024_decision
  page: '22'
  quote_snippet: '(93) Hence, the Commission considers that across the EEA, the relevant geographic
    markets are local and that the most appropriate proxies to define local markets and assess
    competition at a local level is to define catchment areas corresponding to: (a) 30-minute
    drive around the Parties’ stores in smaller cities and rural areas; (b) a 20-minute drive
    around the Parties’ stores in large cities and the Paris region; (c) a 30-minute walk/3km/15min-drive
    for Paris Intramuros.'
