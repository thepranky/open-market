- passage_id: sp_12
  source_document_id: eu_jd_sports_groupe_courir_2024_decision
  page: '11'
  quote_snippet: (50) In any event, in this specific case it is not necessary to conclude on
    the exact scope of the product market definition in the markets for the retail supply of
    sports footwear and sports apparel as the Final Commitments address the Commission’s serious
    doubts in the market for the retail supply of sports footwear/the retail supply of sports
    apparel under all plausible product market definitions. Therefore, the exact scope of the
    product market definition for the retail supply of sports footwear and the retail supply
    of leisure sports apparel, whether comprising an overall market for the retail supply of
    sports footwear/the retail supply of leisure sports apparel or separate markets for the
    retail supply of leisure sports footwear/apparel and performance sports footwear/apparel,
    can be left open.
  extraction_method: pdf_extracted
