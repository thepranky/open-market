- passage_id: sp_19
  source_document_id: eu_jd_sports_groupe_courir_2024_decision
  page: '22'
  quote_snippet: (92) In light of the above, for the purpose of this case, the Commission considers
    that the relevant geographic markets for the retail supply of leisure sports footwear and
    for the retail supply of sports apparel (possibly further segmented between leisure and
    performance) are likely local in scope as described below. However, with regards to the
    competition parameters which are influenced by national competition dynamics, these will
    likely be the same across all locally affected markets and will therefore be assessed overall
    at national level.
  extraction_method: pdf_extracted
