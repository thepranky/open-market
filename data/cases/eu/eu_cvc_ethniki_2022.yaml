- passage_id: sp_2
  source_document_id: eu_cvc_ethniki_2022_decision
  page: '6'
  quote_snippet: '(26) In light of the above, the Commission concludes that, for the purposes
    of this Decision, a separate relevant product market should be defined for health insurance
    services. This market should not include insurance policies that offer cash payments in
    case of accidents or critical illness. The question whether the relevant market for health
    insurance services should be sub-segmented by customer type can be left open as the Transaction
    does not raise serious doubts as to its compatibility with the internal market or the functioning
    of the EEA Agreement, under any of the following plausible product market definitions: (i)
    all health insurance services; (ii) individual health insurance services; or (iii) group
    health insurance services.'
