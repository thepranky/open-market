product_markets_considered:
- market_id: pm_1
  name: Health insurance services
  definition_status: defined
  notes: The Commission concluded that a separate relevant market should be defined for health
    insurance services, excluding insurance products that offer cash payments in case of accidents
    or critical illness. The question of sub-segmentation by customer type (individual vs. group)
    was left open as the transaction did not raise serious doubts under any plausible definition.
- market_id: pm_2
  name: Individual health insurance services
  definition_status: left_open
  notes: The Commission's investigation on whether to sub-segment the health insurance services
    market by customer type (individual vs. group) did not provide conclusive evidence and was
    ultimately left open for the purposes of this decision, as the transaction did not raise
    serious doubts under any plausible definition.
- market_id: pm_3
  name: Group health insurance services
  definition_status: left_open
  notes: The Commission's investigation on whether to sub-segment the health insurance services
    market by customer type (individual vs. group) did not provide conclusive evidence and was
    ultimately left open for the purposes of this decision, as the transaction did not raise
    serious doubts under any plausible definition.
- market_id: pm_4
  name: General private hospital services
  definition_status: defined
  notes: The Commission concluded that public and private hospital services in Greece do not
    belong to the same market. Within private hospital services, separate markets are defined
    for general private, maternity, and diagnostic centre services. The Commission found it
    unnecessary to segment general private hospital services further by medical specialisation
    or between inpatient/outpatient services.
- market_id: pm_5
  name: Maternity hospital services
  definition_status: defined
  notes: The Commission concluded that public and private hospital services in Greece do not
    belong to the same market. Within private hospital services, separate markets are defined
    for general private, maternity, and diagnostic centre services. While the product market
    was defined, the geographic market was left open as it was not affected by the transaction.
- market_id: pm_6
  name: Diagnostic centre services
  definition_status: defined
  notes: The Commission concluded that public and private hospital services in Greece do not
    belong to the same market. Within private hospital services, separate markets are defined
    for general private, maternity, and diagnostic centre services. While the product market
    was defined, the geographic market was left open as it was not affected by the transaction.
geographic_markets_considered:
- market_id: gm_1
  name: Health insurance services — national (Greece affected)
  definition_status: defined
  notes: The Commission confirmed that the market for health insurance services (and its plausible
    sub-segments) is national in scope, covering the entire territory of Greece.
- market_id: gm_2
  name: Individual health insurance services — national (Greece affected)
  definition_status: defined
  notes: The Commission concluded that the plausible market for individual health insurance
    services is national in scope, covering the entire territory of Greece. This follows from
    the decision to leave open the sub-segmentation of the broader health insurance market by
    customer type, but to confirm the national scope for all plausible health insurance markets.
- market_id: gm_3
  name: Group health insurance services — national (Greece affected)
  definition_status: defined
  notes: The Commission concluded that the plausible market for group health insurance services
    is national in scope, covering the entire territory of Greece. This follows from the decision
    to leave open the sub-segmentation of the broader health insurance market by customer type,
    but to confirm the national scope for all plausible health insurance markets.
- market_id: gm_4
  name: General private hospital services — local (Attica affected)
  definition_status: defined
  notes: Contrary to prior HCC decisions, the Commission's investigation found that the relevant
    geographic market for general private hospital services is local in scope, limited to Attica,
    due to factors like patient preferences, insurer views, and CVC's internal documents.
- market_id: gm_5
  name: Maternity private hospital services — national or local (Greece/Attica affected)
  definition_status: left_open
  notes: The Commission explicitly left open the geographic scope for maternity private hospital
    services, noting that it was not affected by the proposed transaction under any plausible
    geographic market delineation.
- market_id: gm_6
  name: Diagnostic centre services — national or local (Greece/Attica affected)
  definition_status: left_open
  notes: The Commission explicitly left open the geographic scope for diagnostic centre services,
    noting that it was not affected by the proposed transaction under any plausible geographic
    market delineation.
