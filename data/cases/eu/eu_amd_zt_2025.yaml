- passage_id: sp_6
  source_document_id: eu_amd_zt_2025_decision
  page: '8'
  quote_snippet: 'Based on the above, the Commission considers that, for the purpose of this
    Decision, it can be left open whether the market for the supply of data centre servers should
    be segmented further by price band (low-end: below USD 100 000; mid-range: USD 100 000 –
    USD 999 999; and high-end: USD 1 million and above) or based on any other criteria such
    as use case/workload. The Commission considers that the outcome of the competitive assessment
    does not change regardless of any market definition based on these segmentations.'
  extraction_method: pdf_extracted
  review_status: unreviewed
