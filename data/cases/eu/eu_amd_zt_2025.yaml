- passage_id: sp_5
  source_document_id: eu_amd_zt_2025_decision
  page: '8'
  quote_snippet: The market investigation confirms the Commission’s previous practice for defining
    the relevant product market for the supply of data centre servers. The majority of respondents
    that expressed a view consider that there is a distinct product market for the supply of
    data centre servers. Equally, the majority of respondents that expressed a view also considered
    that potential segmentations of the market for the supply of data centre servers by performance
    (using the afore-mentioned price bands as a proxy) remain valid.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
