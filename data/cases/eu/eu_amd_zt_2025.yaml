- passage_id: sp_3
  source_document_id: eu_amd_zt_2025_decision
  page: '5'
  quote_snippet: Based on the above, the Commission considers that, for the purpose of this
    Decision, it can be left open whether the market for FPGAs should be further segmented (i)
    based on the performance levels; (ii) between FPGAs for computer and non-computer devices;
    (iii) between FPGAs used in different industrial sectors; (iv) based on the specific use
    cases; and/or (v) between FPGAs for data centres and FPGAs used outside data centres. The
    Commission also considers that it can be left open whether FPGA-based SmartNICs are part
    of the same market as FPGAs. The Commission considers that the outcome of the competitive
    assessment does not change regardless of these potential segmentations.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
