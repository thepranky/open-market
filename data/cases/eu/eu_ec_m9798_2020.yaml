- passage_id: sp_12
  source_document_id: eu_ec_m9798_2020_decision
  page: '12'
  quote_snippet: (58) Within glow plugs, the majority of customers responding to the Commission’s
    market investigation consider that a further sub-segmentation does not apply and that the
    same suppliers produce all types, while one customer outlines a further sub-segmentation
    between ceramic and metallic glow plugs. However, the majority of manufacturers of glow
    plugs responding to the Commission’s market investigation consider that a further sub-segmentation
    is applicable between ceramic and metallic glow plugs (as indicated by one of the respondents
    “[b]oth types have different heating behavior, different supply voltage” and because they
    are based in a “completely different technology […] [a] switch from one type to the other
    is not easily possible”). The majority of manufacturers of glow plugs also confirm that
    they produce both metallic and ceramic glow plugs.
  extraction_method: pdf_extracted
