  quote_snippet: (28) For the purpose of this decision, it can be left open whether the relevant
    product market should comprise VCTs as a whole or whether a sub-segmentation by component
    (phasers, center bolts and solenoids) or by type of VCT (hydraulic and electric phaser VCTs)
    or by type of engine (diesel v gasoline) is necessary, since the proposed Transaction does
    not raise serious doubts as to its compatibility with the internal market under either product
    market definition adopted.
