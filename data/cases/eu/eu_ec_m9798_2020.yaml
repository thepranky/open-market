  page: '8'
  quote_snippet: (35) The majority of customers responding to the Commission’s market investigation
    consider that a further sub-segmentation within ignition coils does not apply. However,
    the majority of ignition coil manufacturers responding to the Commission’s market investigation
    consider that ignition coils could be further sub-segmented into brick ignition coils and
    plug top ignition coil; pencil coil, top coil and modules; rectangular shaped coils and
    stick shaped coils; plug-top coil, coil near plug, pencil coil, coil pack; lamination stacks;
    and pencil type, COP). The majority of ignition coil manufacturers also confirmed that they
    produced all different types.
  extraction_method: pdf_extracted
