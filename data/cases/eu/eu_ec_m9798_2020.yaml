  quote_snippet: (59) In view of the results of the market investigation, and of the views expressed
    by the Notifying Party, for the purposes of this decision, the Commission considers that
    (i) glow plugs and (ii) GPCMs constitute separate product markets. For the purposes of this
    decision, the exact product market definition within glow plugs can ultimately be left open
    as either encompassing the market for glow-plugs overall, or as being further sub-segmented
    between (i) metallic glow plugs and (ii) ceramic glow plugs, as the proposed Transaction
    does not raise serious doubts as to its compatibility with the internal market under either
    delineation. The sale of GPCMs alone does not give rise to any affected market in the IAM
    channel, therefore this market will not be discussed any further.
