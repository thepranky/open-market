product_markets_considered:
- market_id: pm_1
  name: VCTs for LVs (OEM/OES channel)
  definition_status: left_open
  notes: The Commission left open whether the relevant product market should comprise VCTs as
    a whole or whether a sub-segmentation by component (phasers, center bolts and solenoids)
    or by type of VCT (hydraulic and electric phaser VCTs) or by type of engine (diesel v gasoline)
    is necessary.
- market_id: pm_2
  name: Ignition coils for LVs (OEM/OES and IAM channels)
  definition_status: left_open
  notes: The Commission left open whether ignition coils overall constitute a relevant product
    market, or whether a further sub-segmentation between COP ignition coils and coil pack ignition
    coils should apply.
- market_id: pm_3
  name: EGR valves for LVs (IAM channel)
  definition_status: left_open
  notes: The Commission left open whether the relevant product market should comprise EGR valves
    as a whole, whether sub-segmentations depending on the type of engine (gasoline/diesel)
    and valve (pressure or electronically controlled) are necessary or whether EGR valves should
    be part of a broader market of EGR systems.
- market_id: pm_4
  name: Glow plugs for LVs (IAM channel)
  definition_status: left_open
  notes: The Commission considers glow plugs and GPCMs to constitute separate product markets.
    Within glow plugs, the exact market definition was left open as encompassing the market
    for glow-plugs overall, or as being further sub-segmented between metallic glow plugs and
    ceramic glow plugs.
- market_id: pm_5
  name: GPCMs for LVs (IAM channel)
  definition_status: defined
  notes: The Commission considers glow plugs and GPCMs to constitute separate product markets.
    The sale of GPCMs alone does not give rise to any affected market in the IAM channel.
