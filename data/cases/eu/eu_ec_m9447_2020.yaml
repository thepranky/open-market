product_markets_considered:
- market_id: pm_1
  name: High voltage (HV) products
  definition_status: considered
  notes: 'In previous cases, the Commission has acknowledged the existence of an HV product
    market, subdividing electrical products and systems according to their respective voltage
    levels into three broad product segments: Low Voltage (''LV'') products (<1 kV), Medium
    Voltage (''MV'') products (1 kV to 52 kV), and High Voltage (''HV'') products (>52 kV).
    This case does not define the market for HV products but refers to prior decisional practice.'
- market_id: pm_2
  name: Transformers
  definition_status: left_open
  notes: The Commission left open the precise product market definition for transformers, having
    considered whether power and distribution transformers constituted separate relevant product
    markets or whether they belong to an overall market for transformers. The Notifying Party
    submitted that the relevant product market is the overall transformers market, arguing against
    further segmentation by voltage type, technology, or end-use. The market investigation largely
    supported segmentation by transformer type (power, distribution, traction transformers)
    but the Commission found that no competition concerns arose regardless of the ultimate definition.
- market_id: pm_3
  name: Railway rolling stock
  definition_status: left_open
  notes: The Commission left open the precise product market definition for railway rolling
    stock, having previously considered trains reaching speeds equal to or higher than 250 km/h
    (high and very high-speed trains) as a separate product market, distinct from intercity
    trains, and potential further sub-segmentation between high-speed trains (250-300 km/h)
    and very high-speed trains (>300 km/h). The Notifying Party also suggested segments for
    very high-speed trains, high-speed trains, and mainline railway rolling stock (intercity
    and regional trains). The Commission concluded that no concerns arose even on the narrowest
    segments (intercity/regional trains).
- market_id: pm_4
  name: Energy Automation and Information Systems (EAIS)
  definition_status: left_open
  notes: 'The Commission left open the precise product market definition for EAIS. It previously
    considered an overall market for EAIS and potential sub-segments: power system management
    (further segmented into SAS, NMS, EMS, DMS, WAMS) and protection relays, as well as turnkey
    vs. individual components. The Notifying Party submitted an overall EAIS market. The market
    investigation results were mixed but generally supported segmentation. However, no competition
    concerns arose under any plausible market definition.'
- market_id: pm_5
  name: Enterprise Application Software (EAS)
  definition_status: left_open
  notes: The Commission left open the precise product market definition for EAS. It previously
    considered a market for EAS as a segment within business software, with potential sub-segments
    like ERP, CRM, SRM, SCM, PLM, BA. The Notifying Party submitted an overall EAS market. The
    market investigation results were mixed but generally supported segmentation. However, no
    competition concerns arose under any plausible market definition.
- market_id: pm_6
  name: T&D turnkey systems
  definition_status: left_open
  notes: The Commission left open the precise scope of the product market definition for T&D
    Turnkey systems. It previously considered an overall market for T&D turnkey systems and
    potential segments for HVDC stations/systems, FACTS, and substations (AIS, GIS, Hybrid,
    Mobile). The market investigation confirmed T&D turnkey systems as a separate market, with
    mixed results on sub-segmentation. The Commission concluded that no serious doubts arose
    on the narrowest plausible segmentation.
- market_id: pm_7
  name: Power semiconductors
  definition_status: left_open
  notes: The Commission left open the precise scope of the product market definition for power
    semiconductors. It previously distinguished between ICs, discretes, sensors and actuators,
    and within discretes, further segments like power transistors and thyristors, rectifiers
    and power diodes. The Notifying Party distinguished between discretes and modules, and considered
    further segmentation into thyristors, diodes/rectifiers, IGCTs, GTOs, GCTs, and IGBTs, but
    argued against segmentation by power levels (power, high power, extra high power). The market
    investigation showed mixed results on power level segmentation. The Commission concluded
    that no serious doubts arose on the narrowest plausible segmentation.
- market_id: pm_8
  name: EV charging infrastructure
  definition_status: left_open
  notes: The Commission left open the precise scope of the product market definition for charging
    infrastructure for electric vehicles. The Notifying Party submitted that charging infrastructure
    for electric vehicles could form a distinct product market without further distinction between
    vehicle types. The market investigation found that EV charging infrastructure could be viewed
    as a separate market and could be segmented into charging infrastructure for public transport
    and for other electric vehicles. However, no serious doubts arose on the narrowest plausible
    segmentation (charging infrastructure for electric buses used for public transportation).
- market_id: pm_9
  name: Internet of things (IoT) platforms
  definition_status: left_open
  notes: The Commission left open the precise scope of the product market definition for IoT
    platforms. The Notifying Party submitted the market for the supply of IoT platforms, or
    alternatively, a broader market for “infrastructure software.” The market investigation
    indicated that industrial IoT platforms should not be considered separately from other IoT
    platforms and are part of a broader 'infrastructure software' market. No serious doubts
    arose on the narrowest plausible segmentation, which is IoT platforms.
geographic_markets_considered:
- market_id: gm_1
  name: Transformers — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission left open the precise geographic market definition for transformers,
    having previously considered it to be at least EEA-wide in scope, possibly even worldwide.
    The Notifying Party argued it is global. The market investigation was not conclusive, but
    no horizontal concerns arose under either definition because Hitachi is not active in the
    EEA for transformers.
- market_id: gm_2
  name: Railway rolling stock — EEA-wide or worldwide (excluding China, South Korea and Japan)
  definition_status: considered
  notes: The Commission previously considered the relevant markets for high and very high-speed
    rolling stock to be at least EEA-wide (including Switzerland), not excluding the possibility
    of these markets being worldwide (excluding China, South Korea and Japan), and leaving the
    precise geographic market definition open. For regional and intercity trains, the market
    was considered likely at least EEA-wide. The Notifying Party also submitted similar views.
    The provided chunks do not contain a specific Commission assessment or conclusion for the
    geographic market of railway rolling stock for the current case.
- market_id: gm_3
  name: Energy Automation and Information Systems (EAIS) — EEA-wide or worldwide
  definition_status: considered
  notes: The Commission previously considered the plausible EAIS markets to be EEA-wide or worldwide,
    but ultimately left the precise geographic market definition open. The Notifying Party submitted
    that the relevant geographic market for EAIS is global. The provided chunks do not contain
    a specific Commission assessment or conclusion for the geographic market of EAIS for the
    current case, beyond referring to prior practice and the Notifying Party's view.
- market_id: gm_4
  name: Enterprise Application Software (EAS) — EEA-wide or worldwide
  definition_status: considered
  notes: The Commission previously considered the relevant geographic market for EAS to be EEA-wide
    or worldwide, with high function solutions for HR and FMS considered global. The Notifying
    Party submitted that the relevant geographic market for EAS is global. The provided chunks
    do not contain a specific Commission assessment or conclusion for the geographic market
    of EAS for the current case, beyond referring to prior practice and the Notifying Party's
    view.
- market_id: gm_5
  name: Grid Integration (GI) products — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission left open the precise geographic market definition for GI products.
    The Notifying Party submitted that HVDC stations and FACTS are tendered globally, and power
    semiconductors and EV charging infrastructure markets are global. The market investigation
    indicated a worldwide market for all sub-segments of GI products, with competitors confirming
    substitutability and similar standards across regions. However, the Commission concluded
    that there was no need to close the geographic market definition as the transaction did
    not raise serious doubts under any plausible market definition.
- market_id: gm_6
  name: Internet of things (IoT) platforms — EEA-wide or worldwide
  definition_status: left_open
  notes: The Commission left open the precise geographic market definition for IoT platforms.
    The Notifying Party submitted that the geographic scope is global. The market investigation
    gave strong indications that the market for IoT platforms is worldwide in scope, with market
    conditions being the same globally. The Commission concluded there was no need to close
    the geographic market definition as the transaction did not lead to serious doubts under
    any plausible market definition (EEA-wide or worldwide).
