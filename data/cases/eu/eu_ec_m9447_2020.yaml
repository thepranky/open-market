  page: '30'
  quote_snippet: The Notifying Party submits that the geographic scope of both the market for
    IoT platforms or the broader market for infrastructure software is global in scope. According
    to the Notifying Party, licensing agreements for IoT platforms such as the Lumada platform
    are generally concluded on a global basis and the objective conditions for competition are
    essentially the same across the world. Neither import restrictions, transport costs nor
    technical requirements constitute significant limitations. Certain country-specific limitations
    due to regulations may exist, but, as far as the supply-side is concerned, they do not constitute
    an obstacle for swift supply on a global basis.
