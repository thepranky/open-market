product_markets_considered:
- market_id: pm_1
  name: Wholesale supply of leased lines
  definition_status: left_open
  notes: The Commission considered various possible segmentations (network layer, speed, passive/active
    nature of the line, leased lines with traditional interfaces vs. Ethernet services, and
    transmission means), but ultimately left the exact product market definition open as the
    transaction did not raise competitive concerns under any plausible definition. Past CNMC
    decisions in Spain had segmented the market between managed wholesale leased lines ('lit
    fibre') and dark fibre.
- market_id: pm_2
  name: Wholesale supply of dark fibre
  definition_status: considered
  notes: This market was considered as a "narrowly defined sub-segment" or "potential sub-segment"
    of the wholesale supply of leased lines. The Commission specifically assessed this sub-segment
    for vertical relationships, noting that Lyntia's market share exceeded 30% in Spain and
    the metropolitan area of Madrid.
- market_id: pm_3
  name: Wholesale supply of lit fibre
  definition_status: considered
  notes: This market was considered as a "potential sub-segment" of the wholesale supply of
    leased lines. Lyntia’s market share on this market in Spain did not exceed 5% by revenue
    in 2021.
- market_id: pm_4
  name: Supply of colocation services provided by third party data centres
  definition_status: considered
  notes: The Commission adopted its previous decisional practice, defining a market for colocation
    services provided by third-party data centres (excluding in-house data centres) and noting
    it was not appropriate to sub-divide it further (e.g., by carrier-owned/neutral, wholesale/retail,
    or customer type).
geographic_markets_considered:
- market_id: gm_1
  name: Wholesale supply of leased lines — national / narrower (Spain affected)
  definition_status: left_open
  notes: The Commission left open whether the geographic market should be national or narrower
    (limited to a metropolitan area) as the transaction did not give rise to serious doubts
    under any plausible definition. Previous Commission decisions considered it national, while
    the CNMC in Spain considered managed lines national and dark fibre potentially national
    interurban and metropolitan.
- market_id: gm_2
  name: Wholesale supply of dark fibre — national (Spain affected)
  definition_status: considered
  notes: This geographic scope was considered for the "potential sub-segment" of dark fibre,
    where Lyntia's market share exceeded 30% and vertical concerns were assessed.
- market_id: gm_3
  name: Wholesale supply of dark fibre — metropolitan area (Madrid affected)
  definition_status: considered
  notes: This geographic scope, specifically the Madrid metropolitan area, was considered for
    the "potential sub-segment" of dark fibre, where Lyntia's market share exceeded 30% and
    vertical concerns were assessed, particularly regarding Data4's activities in Madrid.
- market_id: gm_4
  name: Supply of colocation services provided by third party data centres — metropolitan area
    (Spain affected)
  definition_status: considered
  notes: The Commission adopted its previous decisional practice defining the geographic scope
    as each metropolitan area, corresponding to a radius of around 50 km from the city centre.
    Madrid is the specific metropolitan area where AXA's Data4 is active.
theories_of_harm: []
commitments: []
source_passages:
- passage_id: sp_1
  source_document_id: eu_axa_im_swiss_life_morrison_co_2022_decision
  page: '3'
  quote_snippet: In previous decisions, the Commission considered possible segmentations of
    the market for the wholesale supply of leased lines according to (i) network layer (trunk
    vs. terminating (i.e., backhaul) segments of leased lines); (ii) speed (terminating leased
    lines with bandwidth below 2 Mbps vs. above 2 Mbps); (iii) passive or active nature of the
    line (the distinction corresponding to dark fibre on the one hand and managed leased lines
    and Ethernet services with guaranteed bandwidth on the other); (iv) leased lines with traditional
    interfaces vs. Ethernet services with guaranteed bandwidth; and (v) transmission means (wireless,
    fibre, copper lines), but ultimately left open the exact product market definition.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
