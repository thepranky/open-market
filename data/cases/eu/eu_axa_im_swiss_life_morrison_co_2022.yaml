- passage_id: sp_2
  source_document_id: eu_axa_im_swiss_life_morrison_co_2022_decision
  page: '3'
  quote_snippet: In Spain, the national competition authority (“CNMC”) most recently reviewed
    the market in a case concerning Lyntia.6 It concluded that the market for the wholesale
    supply of leased lines should be segmented between (i) managed wholesale leased lines (“lit
    fibre”) and (ii) dark fibre.
  extraction_method: pdf_extracted
