- passage_id: sp_3
  source_document_id: eu_axa_im_swiss_life_morrison_co_2022_decision
  page: '4'
  quote_snippet: The Commission’s investigation did not provide any indications that it would
    be appropriate for the Commission to depart from its previous decisional practice. In this
    case, the question whether the market for the wholesale supply of leased lines should be
    further segmented according to (i) network layer (trunk vs. terminating (i.e., backhaul)
    segments of leased lines); (ii) speed (terminating leased lines with bandwidth below 2 Mbps
    vs. above 2 Mbps); (iii) passive or active nature of the line (the distinction corresponding
    to dark fibre on the one hand and managed leased lines and Ethernet services with guaranteed
    bandwidth on the other); (iv) leased lines with traditional interfaces vs. Ethernet services
    with guaranteed bandwidth; and (v) transmission means (wireless, fibre, copper lines), can
    be left open since the Transaction does not give rise to serious doubts as to its compatibility
    with the internal market under any plausible product market definition.
  extraction_method: pdf_extracted
  review_status: unreviewed
