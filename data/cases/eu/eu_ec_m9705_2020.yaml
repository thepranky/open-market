product_markets_considered:
- market_id: pm_1
  name: Sale of advertising space
  definition_status: left_open
  notes: The Commission considered segmenting the market into online and offline advertising
    space, and further segmenting offline advertising into written press (daily and non-daily),
    television, and radio advertising space. However, it ultimately left the precise product
    market definition open.
- market_id: pm_2
  name: Manufacture and supply of passenger cars and commercial vehicles
  definition_status: left_open
  notes: The Commission considered separate markets for passenger cars and commercial vehicles,
    with further sub-segmentation for passenger cars (mini, small, medium, large, executive,
    luxury, sport coupés, multipurpose vehicles, SUVs, electric cars) and commercial vehicles
    (LCVs, medium trucks, heavy trucks). It ultimately left the precise product market definition
    open.
- market_id: pm_3
  name: Manufacture and supply of mini cars
  definition_status: considered
  notes: This market segment was identified as an 'affected market' by the Commission due to
    EXOR's (through FCA) market share exceeding 30% in both EEA and Italy.
- market_id: pm_4
  name: Manufacture and supply of multipurpose vehicles
  definition_status: considered
  notes: This market segment was identified as an 'affected market' by the Commission due to
    EXOR's (through FCA) market share exceeding 30% in Italy.
geographic_markets_considered:
- market_id: gm_1
  name: Sale of advertising space — national (Italy affected)
  definition_status: considered
  notes: The Commission's assessment for the purpose of the decision was that the geographic
    market is national, specifically in Italy, for the sale of advertising space and its possible
    sub-segments.
- market_id: gm_2
  name: Manufacture and supply of passenger cars and commercial vehicles — EEA-wide or national
  definition_status: left_open
  notes: The Commission left open whether the geographic scope of this market is EEA-wide or
    national.
- market_id: gm_3
  name: Manufacture and supply of mini cars — EEA-wide
  definition_status: considered
  notes: This geographic market for mini cars was identified as an 'affected market' by the
    Commission due to EXOR's (through FCA) market share exceeding 30% in the EEA.
- market_id: gm_4
  name: Manufacture and supply of mini cars — national (Italy affected)
  definition_status: considered
  notes: This geographic market for mini cars was identified as an 'affected market' by the
    Commission due to EXOR's (through FCA) market share exceeding 30% in Italy.
- market_id: gm_5
  name: Manufacture and supply of multipurpose vehicles — national (Italy affected)
  definition_status: considered
  notes: This geographic market for multipurpose vehicles was identified as an 'affected market'
    by the Commission due to EXOR's (through FCA) market share exceeding 30% in Italy.
theories_of_harm: []
