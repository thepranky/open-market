- passage_id: sp_2
  source_document_id: eu_ec_m9705_2020_decision
  page: '3'
  quote_snippet: (10) In previous decisions, the Commission considered that the market for advertising
    space may be segmented into (i) online and (ii) offline advertising space.10 Within offline
    advertising space, the Commission found that a further segmentation between (i) written
    press (ii) television and (iii) radio advertising space could be relevant.11 In addition,
    within the written press segment, the Commission considered that (i) daily and (ii) non-daily
    written press may constitute separate markets.12
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
