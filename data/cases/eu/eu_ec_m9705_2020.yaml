- passage_id: sp_3
  source_document_id: eu_ec_m9705_2020_decision
  page: '3'
  quote_snippet: (12) The Commission considers that for the purpose of the present decision
    the exact product market definition for the sale of advertising space (whether overall or
    segmented into online and offline advertising which is further sub-segmented into advertising
    in the written press, daily and non-daily, on the radio or on television) can be left open
    as the Transaction does not raise serious doubts as to its compatibility with the internal
    market or the functioning of the EEA Agreement under any plausible market definition for
    the sale of advertising space.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
