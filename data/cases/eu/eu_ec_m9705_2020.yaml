  page: '3'
  quote_snippet: (9) The Parties’ activities do not lead to any horizontal overlaps. The Transaction
    only gives rise to a vertical relationship between GEDI’s activities in the upstream market
    for the sale of advertising space in Italy and EXOR’s activities, through FCA, as a manufacturer
    and supplier of passenger cars and light commercial vehicles (“LCVs”).
  extraction_method: pdf_extracted
