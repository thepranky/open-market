- passage_id: sp_8
  source_document_id: eu_ec_m9705_2020_decision
  page: '3'
  quote_snippet: '(32) Therefore, on the basis of the information provided by the Notifying
    Party, the Commission considers that the affected markets are: - the upstream market for
    the sale of advertising space in Italy and its possible sub- segments: (i) on daily written
    press; (ii) on non-daily written press; (iii) online; (iv) on radio; and, (v) on television.
    - the downstream markets for o the manufacture and supply of (a) mini cars and (b) multipurpose
    vehicles in Italy, and o the manufacture and supply of mini cars in the EEA.'
  extraction_method: pdf_extracted
