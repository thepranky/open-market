  quote_snippet: As regards the question whether transcription software used to enhance user
    accessibility (“accessibility software”) should be distinguished from transcription software,
    the market investigation did not provide elements indicating that accessibility software
    is separate from transcription software, but rather a specific use case of the latter.21
    The Commission considers that such distinction can be left open, as the Transaction does
    not lead to anticompetitive concerns, regardless of the market definition adopted.
