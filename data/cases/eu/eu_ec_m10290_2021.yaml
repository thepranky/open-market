- passage_id: sp_14
  source_document_id: eu_ec_m10290_2021_decision
  page: '16'
  quote_snippet: 'In the above respect, the Commission observes that mobile productivity applications
    have fewer features, provide less functionality and are less user-friendly than applications
    designed for PCs. From the supply-side perspective, productivity applications for PCs are
    written for different hardware environments: faster processors, larger screens and also
    the presence of a mouse and physical keyboard. From the demand point of view, typically,
    users use their smart mobile devices mainly to read and check items or make small edits,
    and not for intensive work over extended periods of time. The Commission therefore considers
    that the relevant product market is the market for productivity software for PCs (desktop
    and laptops), excluding mobile productivity applications, without further segmentations.'
  extraction_method: pdf_extracted
