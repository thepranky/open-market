  page: '8'
  quote_snippet: Based on the above considerations, the Commission observes that fundamental
    supply-side substitutability exists between different geographic areas. Transcription technology
    remains the same, regardless of the territory, and its adaptation to a specific language
    merely depends on the existence of sufficient business opportunities. The Commission, therefore,
    concludes that the relevant geographic markets for transcription software for healthcare
    and for transcription software outside healthcare, and relevant segmentations thereof, are
    at least EEA-wide, if not global.
