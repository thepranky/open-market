product_markets_considered:
- market_id: pm_1
  name: Transcription software for healthcare
  definition_status: defined
  notes: The Commission defines a separate market for transcription software for healthcare,
    including ambient transcription software for healthcare, due to specific linguistic and
    technical integration issues (e.g., with EHR systems).
- market_id: pm_2
  name: Transcription software outside healthcare
  definition_status: left_open
  notes: The Commission leaves open whether there is an overall market for transcription software
    outside healthcare, with a possible segmentation by industry, as it does not affect the
    assessment's outcome. This market also includes accessibility software and different levels
    of supply chain (APIs/SDKs vs. out-of-the-box solutions) as segmentations that are left
    open.
- market_id: pm_3
  name: Customer engagement solutions
  definition_status: left_open
  notes: The Commission considers customer engagement solutions (possibly segmented into voice
    engagement, digital engagement, and voice biometrics) distinct from transcription software
    due to additional elements and different use cases. It leaves open whether the segments
    are part of the same market.
- market_id: pm_4
  name: Cloud services and data analytics
  definition_status: defined
  notes: The Commission concludes the relevant product market is the overall market for cloud
    services and data analytics, without further segmentation between PaaS and IaaS, consistent
    with market investigation findings.
- market_id: pm_5
  name: Enterprise communication services
  definition_status: segmented
  notes: The Commission considers that the relevant product market includes enterprise communications
    services, distinct from consumer services. The question of a separate market for enterprise
    communication services in the healthcare sector is left open.
- market_id: pm_6
  name: Productivity software for PCs (desktop and laptops)
  definition_status: defined
  notes: The Commission concludes that the relevant product market is productivity software
    for PCs (desktop and laptops), excluding mobile productivity applications, without further
    segmentations. This is based on differences in features, functionality, user-friendliness,
    hardware environments, and typical user behaviour.
- market_id: pm_7
  name: OS for PCs
  definition_status: defined
  notes: The Commission concludes that the relevant product market is the market for OS for
    PCs, distinguishing it from OS for mobile devices, a view supported by the market investigation.
- market_id: pm_8
  name: CRM software
  definition_status: left_open
  notes: The Commission leaves the exact product market definition for CRM software open, including
    whether it should be segmented by industry, functionality, type of service, and customer
    size, as this does not affect the competitive assessment's outcome.
geographic_markets_considered:
- market_id: gm_1
  name: Transcription software for healthcare — at least EEA-wide, if not global
  definition_status: defined
  notes: The Commission concludes the relevant geographic market for transcription software
    for healthcare is at least EEA-wide, if not global, noting fundamental supply-side substitutability
    despite language differences and specific medical requirements.
- market_id: gm_2
  name: Transcription software outside healthcare — at least EEA-wide, if not global
  definition_status: defined
  notes: The Commission concludes the relevant geographic market for transcription software
    outside healthcare is at least EEA-wide, if not global, based on supply-side substitutability.
- market_id: gm_3
  name: Customer engagement solutions — at least EEA-wide, if not global
  definition_status: left_open
  notes: The Commission considers the relevant geographic market for customer engagement solutions
    to be at least EEA-wide, if not global, but leaves the exact definition open as it does
    not affect the assessment's outcome.
- market_id: gm_4
  name: Cloud services and data analytics — worldwide
  definition_status: defined
  notes: The Commission concludes that the relevant geographic market for cloud and data analytics
    services is worldwide, based on multinational suppliers and global accessibility of solutions.
- market_id: gm_5
  name: Enterprise communication services — global or at least EEA-wide
  definition_status: defined
  notes: The Commission concludes that the market for enterprise communication services is global
    or at least EEA-wide, considering that services are provided on a global scale despite some
    regional differences.
- market_id: gm_6
  name: Productivity software — worldwide
  definition_status: defined
  notes: The Commission concludes that the relevant geographic market for productivity software
    is worldwide, as it is installed in globally sold devices and provided as globally accessible
    SaaS.
- market_id: gm_7
  name: OS for PCs — worldwide
  definition_status: defined
  notes: The Commission concludes that the relevant geographic market for OS for PCs is worldwide,
    based on global demand and installation on globally sold PCs.
- market_id: gm_8
  name: CRM software — at least EEA-wide
  definition_status: left_open
  notes: The Commission considers the market for CRM software to be at least EEA-wide but leaves
    the exact geographic market definition open as it does not affect the competitive assessment's
    outcome.
