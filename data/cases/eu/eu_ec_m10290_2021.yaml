  quote_snippet: Since transcription software for healthcare raises specific linguistic and
    technical integration issues (because transcription software for healthcare needs to be
    integrated with EHR systems to enable doctors to directly dictate patient’s medical information
    in it),20 the Commission considers that transcription software for healthcare belongs to
    a separate market.
