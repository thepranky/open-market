- passage_id: sp_3
  source_document_id: eu_ec_m10290_2021_decision
  page: '7'
  quote_snippet: As to the possible distinction between transcription software and ambient transcription
    software, the replies to the market investigation have further indicated that there are
    similarities between transcription software and ambient transcription software, as they
    are both based on transcription technology.24 Ambient transcription, however, is different
    in that it is able to capture conversation between individuals. To implement such functionality,
    the software needs to be able to distinguish and recognise different speakers. At the moment,
    ambient transcription software does not appear to be fully developed yet. Therefore, its
    current functions are mostly based on transcription software. It is possible, in the future,
    that ambient transcription software develops into a separate product market as it distinguishes
    itself further from dictation transcription software. The Commission considers that, at
    the moment, ambient transcription software belongs to the same market as transcription software.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
