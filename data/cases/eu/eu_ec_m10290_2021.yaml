  quote_snippet: Almost all respondents to the market investigation agree that the geographic
    scope of the market for communication services is global.56 There are some geographic differences
    (for example, a different legal framework for privacy in the EEA and in the United States)
    that could militate toward having markets divided by region, such as the EEA.57 Generally,
    however, in view to the globalisation of many business sectors, communication services are
    provided on a global scale. The Commission therefore concludes that the market for enterprise
    communication services is global or at least EEA-wide in scope.
