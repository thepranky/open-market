- passage_id: sp_2
  source_document_id: eu_hf_iri_2022_decision
  page: '3'
  quote_snippet: The Parties’ competitors contacted by the Commission generally consider appropriate
    to sub-segment the market research activities in consumer panel services, RMS and customized
    market research. Moreover, some stakeholders suggested that a sub-segmentation according
    to business area or product segments, as suggested by the Parties, would be appropriate.9
    This would be mainly due to the fact that different products are purchased through different
    sales channels for which different types of services are required.10 Market participants
    therefore tend to specialize in particular product categories and sales channels.
  extraction_method: pdf_extracted
  review_status: unreviewed
