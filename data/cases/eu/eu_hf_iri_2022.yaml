product_markets_considered:
- market_id: pm_1
  name: Market research services
  definition_status: left_open
  notes: The Commission considered possible sub-categorizations including consumer panel services,
    retail measurement services, and customised market research, as well as distinctions by
    business area (e.g., health and automotive research). However, the final product market
    definition was left open as the transaction does not raise serious doubts regardless of
    the definition adopted.
- market_id: pm_2
  name: Retail measurement services (RMS)
  definition_status: left_open
  notes: The Commission assessed overlaps in Retail Measurement Services (RMS) as a potential
    sub-segment of the broader market research services market. Within RMS, the Commission considered
    further segmentation into RMS for consumer packaged goods (CPG) and RMS for General Merchandise
    Products (GMP), noting that the parties' activities focus on different segments. Ultimately,
    the product market definition was left open, as the transaction does not raise serious doubts
    regardless of the definition adopted.
geographic_markets_considered:
- market_id: gm_1
  name: Market research services — EEA-wide
  definition_status: left_open
  notes: The Commission explicitly left open whether the geographic market for market research
    services is national or EEA-wide, concluding that the transaction does not raise serious
    doubts regardless of the definition adopted.
- market_id: gm_2
  name: Market research services — national
  definition_status: left_open
  notes: The Commission explicitly left open whether the geographic market for market research
    services is national or EEA-wide, concluding that the transaction does not raise serious
    doubts regardless of the definition adopted. Competitors suggested markets are national
    due to customer assessment at a national level.
- market_id: gm_3
  name: Retail measurement services (RMS) — EEA-wide
  definition_status: left_open
  notes: The Commission assessed overlaps in RMS at the EEA level. The overall geographic market
    definition for market research services (which includes RMS) was left open.
- market_id: gm_4
  name: Retail measurement services (RMS) — national (Germany affected)
  definition_status: left_open
  notes: The Commission assessed overlaps in RMS at the national level in Germany. The overall
    geographic market definition for market research services (which includes RMS) was left
    open.
- market_id: gm_5
  name: Retail measurement services (RMS) — national (France affected)
  definition_status: left_open
  notes: The Transaction gives rise to affected markets in RMS in France. The overall geographic
    market definition for market research services (which includes RMS) was left open.
- market_id: gm_6
  name: Retail measurement services (RMS) — national (Italy affected)
  definition_status: left_open
  notes: The Transaction gives rise to affected markets in RMS in Italy. The overall geographic
    market definition for market research services (which includes RMS) was left open.
- market_id: gm_7
  name: Retail measurement services (RMS) — national (Spain affected)
  definition_status: left_open
  notes: The Commission assessed overlaps in RMS at the national level in Spain. The overall
    geographic market definition for market research services (which includes RMS) was left
    open.
- market_id: gm_8
  name: Retail measurement services (RMS) — national (The Netherlands affected)
  definition_status: left_open
  notes: The Commission assessed overlaps in RMS at the national level in The Netherlands. The
    overall geographic market definition for market research services (which includes RMS) was
    left open.
