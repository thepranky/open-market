source_passages:
- passage_id: sp_1
  source_document_id: eu_hf_iri_2022_decision
  page: '3'
  quote_snippet: The Commission has previously assessed the product market for market research
    services as encompassing a wide range of services and products aimed at measuring and understanding
    consumer attitudes and purchasing behaviour. In previous cases, the Commission considered
    a possible sub-categorization of the relevant product market into (i) consumer panel services,
    (ii) retail measurement services (‘RMS’) and (iii) customised market research.7 The Commission
    has furthermore considered a possible distinction of market research services by business
    area (in particular for health and automotive research).8 However, the final product market
    definition with regard to these potential sub-segmentations was left open in previous decisions.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
