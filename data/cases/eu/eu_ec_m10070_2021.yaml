product_markets_considered:
- market_id: pm_1
  name: Wholesale broadband access market
  definition_status: left_open
  notes: The Commission considered segmenting this market by type of access (physical access
    / LLU, non-physical / virtual network access / bitstream, and wholesale resale broadband
    access), by point of interconnection (local and central broadband access), and by technology
    (DSL/copper, cable, and fiber). The exact definition was left open as the transaction did
    not raise serious doubts.
- market_id: pm_2
  name: Wholesale leased lines market
  definition_status: left_open
  notes: The Commission considered segmenting this market by trunk and terminating segments,
    passive and activated lines, bandwidth (below/above 2Mbits/s), and into passive (dark fiber)
    and active infrastructure. The question of whether this product market includes dark fiber
    was left open.
- market_id: pm_3
  name: Retail mobile telecommunications services market
  definition_status: defined
  notes: The Commission considered but did not adopt further segmentations based on customer
    type (business or private), tariff (pre-paid or post-paid), network technology (2G/3G, 3G/UMTS
    and 4G/LTE), or type of service (national or international calls, internet data services,
    voice and text services).
- market_id: pm_4
  name: Retail fixed voice services market
  definition_status: defined
  notes: The Commission considered an overall market for retail fixed voice services without
    further subdivisions between local/national and international calls, residential and non-residential
    customers, and including Voice over Internet Protocol (“VoIP”) services.
- market_id: pm_5
  name: Retail fixed internet services market
  definition_status: defined
  notes: The Commission defined an overall market for the retail supply of fixed internet access
    services, excluding retail business connectivity services, and without the need to further
    segment the market by product type, distribution technology, customer type or download speed.
- market_id: pm_6
  name: Retail business connectivity services market
  definition_status: left_open
  notes: This market includes broadband access for large business customers, leased lines, and
    VPN services, but excludes connectivity services for residential, SMEs and small-office-home-offices
    customers. The question of whether this market could be further segmented by technology
    or download speed was left open.
- market_id: pm_7
  name: Potential retail market for multi-play services
  definition_status: left_open
  notes: The Commission left open the question of whether this market was separate from the
    retail markets for television, voice and Internet access. While the popularity of multi-play
    offers is growing, its commercial development is still evolving.
