  page: '21'
  quote_snippet: However, other respondents consider that there is no such separate market.
    As noted above (paragraph (96)), from the demand side, customers can and do switch easily
    between purchasing their services as part of a multi-play offering or separately (e.g. “unpicking”
    the bundle), subject to their needs. From the supply side, operators who already offer separate
    services can easily offer these services as a bundle, and vice versa. Finally, while the
    popularity of multi-play offers in Belgium is certainly growing, its commercial development
    is still evolving.
  extraction_method: pdf_extracted
