- passage_id: sp_2
  source_document_id: eu_ec_m10070_2021_decision
  page: '6'
  quote_snippet: In previous decisions, including relating to the Belgian market,24 the Commission
    defined the product market as a separate wholesale broadband access market, and left the
    question open as to whether it should be subdivided according to the type of access (i.e.,
    LLU, bitstream or resale (see paragraph (15) above)), or based on the level where the point
    of interconnection is situated.25 The latter connects the infrastructure of the wholesale
    provider and that of the customer and comprises (i) local broadband access and (ii) central
    broadband access.26
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
