  quote_snippet: A majority of the respondents to the market investigation considered that a
    possible market for multi-play offers (irrespective of what type of bundles are included
    in such a possible market) would be national in scope.126 This view, however, does not necessarily
    align with the results of the market investigation obtained in relation to retail fixed
    internet access services, which would be one of the components of such a hypothetical market.
