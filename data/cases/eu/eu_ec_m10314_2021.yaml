- passage_id: sp_7
  source_document_id: eu_ec_m10314_2021_decision
  page: '5'
  quote_snippet: In the market investigation, the majority of competitors were of the view that
    companies active in electrical engineering services are typically present at national level
    and that prices are essentially the same throughout the national territory. The majority
    also indicated that the market for the installation/maintenance of electrical infrastructures
    should be viewed as national, with one competitor even indicating that it could be even
    EEA-wide or wider. The majority of customers also agreed that most companies active in electrical
    engineering services are present at national level.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets: []
