product_markets_considered:
- market_id: pm_1
  name: Electrical engineering services
  definition_status: left_open
  notes: The Commission considered various sub-segmentations including by type of business (residential/non-residential),
    type of work (installation/maintenance), nature of service (infrastructures/industry/tertiary
    sector), specific engineering services (telecommunication networks, substations, power lines,
    public lighting), and for power lines, by type of voltage (high/medium/low) or overhead/underground.
    The precise market definition was ultimately left open as the transaction did not raise
    serious doubts under any plausible definition.
- market_id: pm_2
  name: Mechanical engineering services
  definition_status: left_open
  notes: The Commission considered various sub-segmentations including by type of work (installation/maintenance),
    type of business (residential/non-residential), and type of customer (infrastructures/industry/tertiary).
    The precise market definition was ultimately left open as the transaction did not raise
    serious doubts under any plausible definition.
geographic_markets_considered:
- market_id: gm_1
  name: Electrical engineering services — national/regional
  definition_status: left_open
  notes: The Commission considered the geographic market to be at least national, with some
    market investigation responses suggesting a national scope and others noting regional presence.
    The precise geographic definition was ultimately left open as the transaction did not raise
    serious doubts under either national or regional definitions.
- market_id: gm_2
  name: Mechanical engineering services — national/regional
  definition_status: left_open
  notes: The Commission considered whether the geographic market should be national or regional,
    as this was left open in past decisions. The Notifying Parties submitted a national scope.
    The precise geographic definition was ultimately left open as the transaction did not raise
    serious doubts under any plausible definition.
