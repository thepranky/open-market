- passage_id: sp_1
  source_document_id: eu_ec_m10314_2021_decision
  page: '3'
  quote_snippet: Electrical engineering services include services on electrical and telecommunication
    networks, substations, voice data-image, power supply, public lighting, etc. In its previous
    decisions, the Commission has distinguished between the provision of (i) electrical, (ii)
    mechanical and (iii) thermal/air-conditioning engineering services, although it left the
    precise market definition open.
