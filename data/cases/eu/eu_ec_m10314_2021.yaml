  source_document_id: eu_ec_m10314_2021_decision
  page: '3'
  quote_snippet: Within electrical engineering services, the Commission has considered the possibility
    of further sub-segmenting the market depending on (i) the type of business (residential/non-residential);
    (ii) the type of work (installation/maintenance); and (iii) the nature of the service (infrastructures/industry/tertiary
    sector).
  extraction_method: pdf_extracted
