- passage_id: sp_8
  source_document_id: eu_ec_m10314_2021_decision
  page: '6'
  quote_snippet: In conclusion, according to the market investigation the geographic scope of
    the provision of electrical engineering services, in particular for power lines, is most
    likely national although, for the purposes of this Decision, it can be left open whether
    the market should be defined as national or regional, as the Transaction does not raise
    serious doubts as to its compatibility with the internal market under either geographic
    market definition.
  extraction_method: pdf_extracted
