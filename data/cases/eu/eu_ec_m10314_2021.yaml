- passage_id: sp_6
  source_document_id: eu_ec_m10314_2021_decision
  page: '5'
  quote_snippet: In its previous decisions, the Commission has considered that the geographic
    scope of electrical engineering markets was at least national, although the precise definition
    was ultimately left open. While it is true that in one case concerning France the Commission
    considered both national and regional shares due to the existence of national players, the
    market investigation in that same case suggested that the geographic scope for the provision
    of services to power lines was most likely national because the competitive conditions were
    similar throughout France.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
