- passage_id: sp_3
  source_document_id: eu_ec_m10314_2021_decision
  page: '5'
  quote_snippet: The Commission considers that, for the purposes of this Decision, it can be
    left open whether the provision of electrical engineering services should be sub-segmented
    according to the type of business, the type of work or the nature of the service; whether
    distinct product markets should be considered for telecommunication networks, substations,
    power lines or public lighting; or whether power lines should be further sub-segmented according
    to the type of voltage or between overhead and underground power lines, as the Transaction
    does not raise serious doubts as to its compatibility with the internal market under any
    of the plausible product market definitions.
  extraction_method: pdf_extracted
