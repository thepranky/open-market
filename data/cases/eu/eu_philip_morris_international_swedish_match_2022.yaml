- market_id: pm_1
  name: Snus
  definition_status: considered
  notes: The Commission considers snus a separate market from other smokeless tobacco or nicotine
    products, and no further segmentation is necessary.
- market_id: pm_2
  name: Nicotine pouches
  definition_status: considered
  notes: The Commission considers nicotine pouches a separate market from other smokeless tobacco
    or nicotine products, and no further segmentation is necessary.
- market_id: pm_3
  name: FMC
  definition_status: considered
  notes: The Commission considers FMC a separate market from other combustible tobacco products,
    and no further segmentation is necessary.
- market_id: pm_4
  name: RYO
  definition_status: considered
  notes: The Commission considers RYO a separate market from other combustible tobacco products,
    and no further segmentation is necessary.
- market_id: pm_5
  name: Heated tobacco products
  definition_status: considered
  notes: The Commission considers heated tobacco products a separate market from combustible
    tobacco products, and no further segmentation is necessary.
- market_id: pm_6
  name: Nicotine powder
  definition_status: left_open
  notes: The Commission considered it appropriate to leave open the exact product market definition
    of nicotine powder and salt, irrespective of the formulation, as the competitive assessment
    would not differ.
- market_id: pm_7
  name: Wholesale distribution of combustible tobacco, smoke-free, and related products
  definition_status: considered
  notes: The Commission considers the wholesale distribution of combustible tobacco, smoke-free,
    and related products a separate market from the distribution of other products, and no further
    segmentation is necessary.
