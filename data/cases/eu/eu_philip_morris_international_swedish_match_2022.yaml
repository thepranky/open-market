    the geographic market definition for snus is national in scope.31 For example, a customer
    points out at the regulatory differences between countries for the wholesale supply of snus
    indicating that snus is mainly sold ‘in Norway and Sweden due to EU regulation[s] prohibiting
    snus-products in other jurisdictions’.32 Another customer explains that conditions of competition
    vary, and are different in Norway than in other countries, as snus products sold in Norway
    require regulatory approval by the Norwegian Ministry of Health, and prices differ by country
    (they are higher in Norway than in neighbouring countries).33
