  source_document_id: eu_rwe_newco_eemshaven_2022_decision
  page: '5'
  quote_snippet: The Commission has previously defined the geographic market for the generation
    and wholesale supply of electricity as national in scope.19 However, the Commission has
    also recognised that the presence of a sufficiently large interconnection capacity between
    Member States may justify a broader geographical scope.20 This could also be the case if
    two or more Member States belong to the same bidding zone.21
