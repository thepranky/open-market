- passage_id: sp_3
  source_document_id: eu_rwe_newco_eemshaven_2022_decision
  page: '15'
  quote_snippet: The Commission considers the market for the provision of congestion management
    services to be a distinct market, separate from the market for the provision of balancing
    and ancillary services. Potential congestion and imbalance in the network are different
    problems for which TenneT is responsible and from the demand-side perspective of TenneT
    the provision of such services are for different purposes. From a supply-side perspective,
    there are different bidding processes for each of imbalance and congestion (see above paragraphs
    (32) and (51) respectively).
  extraction_method: pdf_extracted
