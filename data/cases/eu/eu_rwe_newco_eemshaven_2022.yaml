- passage_id: sp_7
  source_document_id: eu_rwe_newco_eemshaven_2022_decision
  page: '16'
  quote_snippet: The Commission considers that the geographic scope of the market for congestion
    management services in relation to the Netherlands is at least national. While each specific
    congestion event relates to a specific location, in general generation assets throughout
    the Netherlands are active on the supply side of congestion management services. TenneT,
    the only purchaser on the demand side, is also active on a national level. It can be left
    open whether the geographic scope is wider than national as, based on the conservative assumption
    of a national market, the Transaction does not lead to serious doubts as to its compatibility
    with the internal market and the functioning of the EEA Agreement.
  extraction_method: pdf_extracted
  review_status: unreviewed
