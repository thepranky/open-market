- passage_id: sp_2
  source_document_id: eu_rwe_newco_eemshaven_2022_decision
  page: '5'
  quote_snippet: For the purposes of this decision, and in light of the above, the Commission
    finds no reason to deviate from its consolidated case practice. The Commission therefore
    considers that the overall market for generation and wholesale supply of electricity constitutes
    a separate market encompassing both the trading on the wholesale market of the generated
    electricity within a certain geographic market and the electricity that is physically imported
    into this geographic market via interconnectors, irrespective of the source of generated
    electricity (such as nuclear, lignite, wind, solar, etc.).
  extraction_method: pdf_extracted
