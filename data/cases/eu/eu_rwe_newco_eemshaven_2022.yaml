- passage_id: sp_1
  source_document_id: eu_rwe_newco_eemshaven_2022_decision
  page: '3'
  quote_snippet: The Commission has a consolidated case practice of defining the product market
    for the generation and wholesale supply of electricity as encompassing both (i) the trading
    on the wholesale market of the generated electricity within a certain geographic market9
    and (ii) the electricity that is physically imported into this geographic market via interconnectors,
    irrespective of the source of generated electricity (such as nuclear, lignite, wind, solar,
    etc.).
  extraction_method: pdf_extracted
