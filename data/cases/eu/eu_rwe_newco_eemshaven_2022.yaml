  source_document_id: eu_rwe_newco_eemshaven_2022_decision
  page: '8'
  quote_snippet: In light of the foregoing, the Commission considers that the appropriate scope
    of the market for the generation and wholesale supply of electricity regarding the Netherlands
    is national, corresponding to the Dutch bidding zone, while acknowledging the reality of
    flows from neighbouring bidding zones.
