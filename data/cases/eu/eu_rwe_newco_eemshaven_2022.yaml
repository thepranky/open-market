product_markets_considered:
- market_id: pm_1
  name: Generation and wholesale supply of electricity
  definition_status: defined
  notes: The Commission defines this market as encompassing both the trading on the wholesale
    market of generated electricity within a certain geographic market and electricity physically
    imported via interconnectors, irrespective of the source of generation. A further segmentation
    by hours of the day (peak/off-peak) or by source of electricity production (renewable/conventional)
    was considered but not warranted.
- market_id: pm_2
  name: Balancing and ancillary services
  definition_status: defined
  notes: The Commission considers the provision of balancing and ancillary services to be a
    distinct product market from the generation and wholesale supply of electricity.
- market_id: pm_3
  name: aFRR
  definition_status: defined
  notes: Within balancing and ancillary services, the Commission considers FCR, aFRR, and mFRR
    to constitute separate product markets.
- market_id: pm_4
  name: aFRR upwards and downwards regulation
  definition_status: left_open
  notes: The market investigation was inconclusive on whether separate markets exist for upwards
    and downwards regulation of aFRR, and the Commission left the question open.
- market_id: pm_5
  name: Congestion management services
  definition_status: defined
  notes: The Commission considers the market for the provision of congestion management services
    to be distinct from the market for balancing and ancillary services due to different purposes
    and bidding processes.
- market_id: pm_6
  name: Redispatching and capacity restriction agreements
  definition_status: left_open
  notes: The Commission left open whether the product market for congestion management services
    should be segmented between redispatching and capacity restriction agreements.
geographic_markets_considered:
- market_id: gm_1
  name: Generation and wholesale supply of electricity — national (the Netherlands affected)
  definition_status: defined
  notes: The Commission's assessment, including a price-equality analysis, found that despite
    interconnections, the geographic market is national in scope, corresponding to the Dutch
    bidding zone. It also concluded there was no justification for a narrower-than-national
    market.
- market_id: gm_2
  name: aFRR — national (the Netherlands affected)
  definition_status: considered
  notes: Based on previous practice and market investigation, the Commission conducted its competitive
    assessment for aFRR at the national level.
- market_id: gm_3
  name: Congestion management services — national (the Netherlands affected)
  definition_status: considered
  notes: The Commission considers the geographic scope to be at least national, acknowledging
    that specific congestion events have local elements and solutions might sometimes come from
    cross-border areas. The question of a wider scope was left open.
