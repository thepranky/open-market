  quote_snippet: In previous decisions, the Commission has defined the provision of freight
    forwarding services as a distinct product market from both contract logistics and transportation
    services. The Commission has further considered segments of the freight forwarding market
    depending on the modes of transport, between air, sea and land (including rail and road).
