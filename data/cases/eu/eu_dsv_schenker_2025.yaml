  page: '21'
  quote_snippet: In this regard, for the purposes of the present case, the exact delineation
    of the geographic market definition can be left open, given that the Transaction would not
    raise serious doubts as to its compatibility with the internal market under any plausible
    market definition. While there are indications that several of the large air and sea freight
    forwarders are able to offer their services globally, out of caution and to ensure that
    all potential effects of the Transaction have been taken into consideration, the Commission
    will also assess the effects of the Transaction on trade lanes linking the national market
    with different regions of the world (e.g., in relation to the German freight forwarding
    market, different lanes to/from North America, Asia Pacific or Africa) for air and sea freight
    forwarding.
