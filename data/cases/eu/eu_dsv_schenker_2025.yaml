product_markets_considered:
- market_id: pm_1
  name: Freight Forwarding Services
  definition_status: left_open
  notes: The Commission assessed freight forwarding services as distinct from contract logistics
    and transportation services, and considered segmentation by mode (air, sea, land). While
    these segments were assessed, the precise product market definition for freight forwarding
    services was ultimately left open.
- market_id: pm_2
  name: Land Freight Forwarding
  definition_status: left_open
  notes: Segmentation between rail and road, FTL/LTL/groupage, and domestic and cross-border
    services was considered but ultimately left open. The Commission assessed the effects on
    the basis of these potential segmentations.
- market_id: pm_3
  name: Air Freight Forwarding
  definition_status: left_open
  notes: Segmentation between international trade lanes was considered. The precise product
    market definition for air freight forwarding was ultimately left open.
- market_id: pm_4
  name: Sea Freight Forwarding
  definition_status: left_open
  notes: Segmentation between FCL and LCL was considered. The precise product market definition
    for sea freight forwarding was ultimately left open.
- market_id: pm_5
  name: Contract Logistics Services
  definition_status: left_open
  notes: The Commission confirmed the distinction between freight forwarding and contract logistics.
    It confirmed potential segmentation by type of goods/industry and by type of logistics provider
    (LLP/3PL). Segmentation by cross-border/domestic was found not warranted. The precise product
    market definition was left open.
- market_id: pm_6
  name: Finished Vehicles Logistics (FVL)
  definition_status: left_open
  notes: The Commission considered FVL as potentially distinct from freight forwarding and contract
    logistics based on previous decisions and market investigation. However, the exact market
    definition was left open and not further discussed, as the transaction would not raise serious
    doubts.
geographic_markets_considered:
- market_id: gm_1
  name: Freight Forwarding Services — national/EEA-wide
  definition_status: left_open
  notes: The Commission's previous decisions left open whether freight forwarding markets are
    national or EEA-wide. Market investigation indicated a preference for national/local providers,
    suggesting national scope. However, the precise delineation was left open as the transaction
    raised no serious doubts.
- market_id: gm_2
  name: Air Freight Forwarding — national with international trade lanes
  definition_status: left_open
  notes: Segmentation by international trade lanes was investigated for air freight forwarding,
    with mixed results from the market investigation regarding demand and supply side substitutability.
    The exact geographic market definition was left open, but the Commission assessed effects
    on trade lanes out of caution.
- market_id: gm_3
  name: Sea Freight Forwarding — national with FCL/LCL and international trade lanes
  definition_status: left_open
  notes: Segmentation by international trade lanes was investigated for sea freight forwarding,
    with mixed results from the market investigation regarding demand and supply side substitutability.
    The exact geographic market definition was left open, but the Commission assessed effects
    on trade lanes out of caution, also distinguishing FCL/LCL.
- market_id: gm_4
  name: Contract Logistics Services — national/EEA-wide
  definition_status: left_open
  notes: Previous Commission decisions considered the market EEA-wide, leaving open national
    segmentation. Market investigation did not provide indications to deviate from this. The
    exact geographic market definition was left open, but the Commission assessed effects on
    national markets.
theories_of_harm: []
commitments: []
