  source_document_id: eu_ec_m9866_2020_decision
  page: '9'
  quote_snippet: In previous decisions, the Commission considered that the market for wholesale
    mobile call termination services is national in scope, as each wholesale market for call
    termination corresponds to the dimensions of the operator’s network and is limited to the
    national territory of the operator's network.35 This is primarily due to regulatory barriers
    as the geographic scope of a network licence is, in principle, limited to areas which do
    not extend beyond the borders of a Member State.
