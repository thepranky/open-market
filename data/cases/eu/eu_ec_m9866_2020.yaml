- passage_id: sp_2
  source_document_id: eu_ec_m9866_2020_decision
  page: '5'
  quote_snippet: 'For the purpose of the present decision, the Commission considers that the
    question whether the retail supply of TV services can be segmented between FTA and pay TV
    services and in turn pay TV services should be further segmented according to: (i) linear
    and non-linear pay TV services, (ii) basic and premium pay TV services, and (iii) the distribution
    technology employed, can be left open since the Transaction does not raise serious doubts
    as to its compatibility with the internal market or the functioning of the EEA Agreement
    under any of the possible product market definitions set out in this paragraph.'
  extraction_method: pdf_extracted
