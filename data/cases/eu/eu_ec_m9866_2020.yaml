- passage_id: sp_20
  source_document_id: eu_ec_m9866_2020_decision
  page: '9'
  quote_snippet: The Commission observes that nothing in the present case indicates that it
    would be justified to depart from its position – in particular, considering that the geographic
    scope of each wholesale market for mobile call termination corresponds to the geographic
    dimension of each mobile operator’s network which, due to regulatory barriers, is limited
    to the national territory within which it operates. Consequently, for the purpose of the
    present decision, and in line with its previous decisional practice the Commission considers
    that the market for wholesale mobile call termination services is national in scope.
