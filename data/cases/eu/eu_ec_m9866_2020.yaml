product_markets_considered:
- market_id: pm_1
  name: Retail supply of pay-TV services
  definition_status: left_open
  notes: The Commission considered segmentations of retail TV services between FTA and pay-TV,
    and within pay-TV services, according to linear vs. non-linear, basic vs. premium, and distribution
    technology employed. However, it ultimately left the exact product market definition open
    as the transaction did not raise serious doubts under any possible definition.
- market_id: pm_2
  name: Wholesale mobile call termination services
  definition_status: defined
  notes: The Commission defined this market as termination on each individual mobile network,
    based on the principle that there is no substitute for call termination on an individual
    network.
- market_id: pm_3
  name: Wholesale fixed call termination services
  definition_status: defined
  notes: The Commission defined this market as termination on each individual fixed network,
    based on the principle that there are no potential substitutes for call termination on an
    individual fixed network.
- market_id: pm_4
  name: Retail mobile communications services
  definition_status: left_open
  notes: The Commission considered potential segmentations by type of service (voice, SMS, data)
    or network technology, as well as by pre-paid/post-paid and private/business customers,
    but left the exact market definition open.
- market_id: pm_5
  name: Retail supply of fixed telephony services
  definition_status: left_open
  notes: The Commission considered whether the market should be segmented into fixed voice services
    and VoIP services but left the exact product market definition open.
geographic_markets_considered:
- market_id: gm_1
  name: Retail supply of pay-TV services — national (Greece affected)
  definition_status: considered
  notes: The Commission considered the market to be national in Greece, noting that pay-TV operators
    offer services nationally and are subject to a national regulatory framework. It also stated
    the assessment would be the same if the market was limited to the coverage area of each
    cable operator.
- market_id: gm_2
  name: Retail mobile communication services — national (Greece, Cyprus, Slovenia, Croatia,
    Bulgaria affected)
  definition_status: considered
  notes: The Commission consistently found the market for retail mobile communication services
    to be national in scope, particularly due to national licensing.
- market_id: gm_3
  name: Retail supply of fixed telephony services — national (Greece, Cyprus, Slovenia, Croatia,
    Bulgaria affected)
  definition_status: considered
  notes: The Commission consistently found the market for fixed telephony services to be national
    in scope, reflecting the importance of national regulation and upstream services provided
    on a national basis.
- market_id: gm_4
  name: Wholesale mobile call termination services — national (Greece, Cyprus, Slovenia, Croatia,
    Bulgaria affected)
  definition_status: considered
  notes: The Commission found this market to be national in scope, as each wholesale market
    for call termination corresponds to the dimensions of the operator’s network and is limited
    to national territory due to regulatory barriers.
- market_id: gm_5
  name: Wholesale fixed call termination services — national (Greece, Cyprus, Slovenia, Croatia,
    Bulgaria affected)
  definition_status: considered
  notes: The Commission found this market to be national in scope, as each wholesale market
    for call termination corresponds to the dimensions of the operator’s network and is limited
    to national borders due to regulatory barriers.
