- passage_id: sp_8
  source_document_id: eu_santander_stellantis_opel_bank_assets_2022_decision
  page: '6'
  quote_snippet: 'In previous decisions, the Commission has considered a segmentation of the
    corporate banking market based on the customer group, i.e. a segmentation between: (i) banking
    services to large corporate customers; and (ii) banking services to SMEs. The Commission
    has also considered a segmentation of banking services to large corporate customers based
    on the category of products (e.g. loans, savings, etc.), as well as within banking services
    to SMEs a separate segment for lending to car dealers32.'
  extraction_method: pdf_extracted
