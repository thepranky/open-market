- passage_id: sp_29
  source_document_id: eu_santander_stellantis_opel_bank_assets_2022_decision
  page: '4'
  quote_snippet: 'The undertakings concerned have a combined aggregate worldwide turnover of
    more than EUR 5,000 million in 202122 (Stellantis: EUR […] million; Santander: EUR […] million;
    the SCF-Stellantis JVs: EUR […] million). Each of them has a Union-wide turnover in excess
    of EUR 250 million in 2021 (Stellantis: EUR […] million; Santander: EUR […] million; the
    SCF-Stellantis JVs: EUR […] million), but they do not achieve more than two-thirds of their
    aggregate Union-wide turnover within one and the same Member State. The notified operation
    therefore has a Union dimension.'
