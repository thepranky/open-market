- passage_id: sp_5
  source_document_id: eu_santander_stellantis_opel_bank_assets_2022_decision
  page: '4'
  quote_snippet: 'For completeness, the Commission notes that the Parties’ activities also overlap
    in the provision of: (i) financial leasing services for motor vehicles; and (ii) provision
    of insurance products. Nevertheless, in light of the fact that under all potential market
    delineations, the Parties’ combined market shares in these markets remain below 20%, and
    their combined or individual market shares remain below 30% in all neighbouring markets,
    these two markets and their potential sub-segments will not be assessed any further for
    the purposes of the present decision.'
  extraction_method: pdf_extracted
