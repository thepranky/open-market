- passage_id: sp_1
  source_document_id: eu_santander_stellantis_opel_bank_assets_2022_decision
  page: '6'
  quote_snippet: In any event, the exact product market definition for automotive financing
    services can be left open, as the Transaction does not raise any serious doubts as to its
    compatibility with the internal market under any plausible market definition. In conclusion,
    for the purposes of this decision, the Commission will analyse the automotive financing
    market at the narrowest plausible market of motor vehicle lending (based on a market of
    both captive and non-captive activities together, as well as for non-captive activities
    separately).
  extraction_method: pdf_extracted
