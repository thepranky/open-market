  quote_snippet: In any event, the exact definition of the product market for lending to SMEs
    can be left open, as the Transaction does not raise any serious doubts as to its compatibility
    with the internal market under any plausible market definition. In conclusion, for the purposes
    of this decision, the Commission will analyse the market for lending to SMEs at the narrowest
    plausible market of lending to car dealers as well as the overall market for lending to
    SMEs.
