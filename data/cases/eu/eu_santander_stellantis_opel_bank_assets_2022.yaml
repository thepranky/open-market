  source_document_id: eu_santander_stellantis_opel_bank_assets_2022_decision
  page: '5'
  quote_snippet: The results of the market investigation in this case did not indicate that
    there is a need to depart from the finding of a separate market for automotive financing
    services as further segmented into the markets for motor vehicle lending and leasing services
    for motor vehicles.29 The results also confirmed that captive and non-captive financing
    institutions compete in the same market for automotive financing services.30
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
