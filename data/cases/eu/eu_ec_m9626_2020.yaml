- passage_id: sp_9
  source_document_id: eu_ec_m9626_2020_decision
  page: '6'
  quote_snippet: 'The Commission has previously distinguished two different levels of wholesale
    distribution of refined fuel products: (i) ex-refinery sales (primary level of distribution)
    and (ii) non-retail sales (secondary level of distribution). It has previously doubted whether
    this distinction would also apply to wholesale sales of fuel in Poland, but decided to leave
    the precise market definition open.'
  extraction_method: pdf_extracted
  review_status: unreviewed
