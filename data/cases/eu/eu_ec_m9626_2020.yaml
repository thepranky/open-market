- passage_id: sp_3
  source_document_id: eu_ec_m9626_2020_decision
  page: '4'
  quote_snippet: Balancing and ancillary services can be defined as the services consisting
    in maintaining the voltage in the grid within a very narrow bandwidth. Transmission System
    Operators (“TSOs”) purchase electricity, on a balancing exchange or bilaterally, in order
    to cover deviations between production and consumption within their control areas. In previous
    decisions, the Commission has treated balancing and ancillary services as a separate product
    market from that for the generation and wholesale supply of electricity.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_2
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_4
  source_document_id: eu_ec_m9626_2020_decision
  page: '4'
  quote_snippet: The Commission has identified different categories of balancing and ancillary
    services, namely primary (frequency containment reserve), secondary (automatic frequency
    restoration reserve) and tertiary (manual frequency restoration reserve, fast active disturbance
    reserve and peak load reserve), on the basis of the order of activation and the magnitude
    of frequency deviation. The Commission has however left open whether the market for these
    different categories of balancing and ancillary services could correspond to distinct product
    markets.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_2
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
