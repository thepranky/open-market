- passage_id: sp_8
  source_document_id: eu_ec_m9626_2020_decision
  page: '6'
  quote_snippet: With respect to HFO, a distinction should be made between on the one hand,
    HFO used as a motor fuel for large marine engines, and one the other hand, HFO used as an
    energy source/fuel for inland industrial processes (e.g. power plants, horticulture, industrial
    laundry, etc.).
  extraction_method: pdf_extracted
  review_status: unreviewed
