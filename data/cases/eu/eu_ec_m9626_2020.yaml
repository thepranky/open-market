- passage_id: sp_6
  source_document_id: eu_ec_m9626_2020_decision
  page: '5'
  quote_snippet: In previous decisions, the Commission has concluded that district heating constitutes
    a separate product market, which includes the distribution of thermal energy in the form
    of steam and/or hot water from central or decentralised sources of production (heating plants)
    through a network to multiple buildings or sites for use of space or process heating.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
