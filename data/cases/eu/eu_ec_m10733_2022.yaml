    (a) Product markets: the contract logistics services markets by reference to (i) the type of operations, whether domestic or cross-border; (ii) the type of good handled or the industry serviced; and (iii) the type of logistics provider (LLPs and 3PLs), as well as the FVL segment by reference to (i) the type of vehicles; (ii) the mode of transport; and (iii) the type of operations, whether collection of finished cars, compound services or regional delivery of finished cars.
