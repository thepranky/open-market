  source_document_id: eu_ec_m10733_2022_decision
  page: '3'
  quote_snippet: In previous decisions, the Commission defined the freight forwarding services
    market as ‘the organisation of transportation of items (possibly including activities such
    as customs clearance, warehousing, ground services, etc.) on behalf of customers according
    to their needs’.5 The Commission also considered possible sub-segmentations of the freight
    forwarding product market, namely (i) between domestic freight forwarding and cross-border
    freight forwarding and, (ii) depending on the modes of transport (i.e. freight forwarding
    by air, land and sea).
