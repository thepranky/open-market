product_markets_considered:
- market_id: pm_1
  name: Freight forwarding services
  definition_status: left_open
  notes: 'The Commission considered possible sub-segmentations: (i) domestic vs. cross-border
    freight forwarding and (ii) by modes of transport (air, land, sea). The exact definition
    was left open as the transaction would not raise serious doubts under any plausible market
    definition.'
- market_id: pm_2
  name: Contract logistics services
  definition_status: left_open
  notes: 'The Commission considered segmentations: (i) cross-border vs. domestic, (ii) by type
    of good handled or industry serviced, and (iii) into lead logistics providers (LLPs) and
    traditional logistics providers (3PLs). A potential market for Finished Vehicle Logistics
    (FVL) services was also considered, with further segmentations. The exact definition was
    left open as the transaction would not raise serious doubts under any plausible market definition.'
- market_id: pm_3
  name: Container liner shipping services
  definition_status: considered
  notes: The market involves regular, scheduled services for cargo carriage by container, distinguished
    from non-liner and non-containerised transport. The Commission further distinguished between
    deep-sea and short-sea container shipping services.
- market_id: pm_4
  name: Deep-sea container liner shipping services
  definition_status: considered
  notes: This market involves regular, scheduled services for sea transportation of containerised
    cargo. A narrower market for the transport of refrigerated (reefer) goods was considered
    but left open.
- market_id: pm_5
  name: Short-sea container liner shipping services
  definition_status: considered
  notes: This market provides regular, scheduled intra-continental container shipping services.
    The Commission considered but left open sub-segmentations between reefer/dry container shipping
    and between Roll on-Roll off (Ro-Ro) and Lift on-Lift off (Lo-Lo) shipping services.
- market_id: pm_6
  name: Ro-Ro shipping services
  definition_status: considered
  notes: Ro-Ro shipping services correspond to the transport of wheeled cargo on ships using
    a loading ramp. This was considered a potential separate relevant product market, distinct
    from Lo-Lo vessels.
geographic_markets_considered:
- market_id: gm_1
  name: Freight forwarding services — national/wider (geographic scope left open)
  definition_status: left_open
  notes: The Commission previously left open whether the market should be national or wider
    (trans-national/EEA-wide), citing language and regulatory barriers vs. a trend for trans-national
    networks. Sea freight forwarding was previously defined as at least national.
- market_id: gm_2
  name: Contract logistics services — EEA-wide/national (geographic scope left open)
  definition_status: left_open
  notes: The Commission previously found the contract logistics market to be EEA-wide, leaving
    open a possible segmentation into national markets. For FVL, it considered EEA-wide or national
    scope.
- market_id: gm_3
  name: Deep-sea container liner shipping services — individual legs of trade
  definition_status: defined
  notes: The geographic market is defined on the basis of individual legs of trade (e.g., Northern
    Europe – North America eastbound and westbound separately).
- market_id: gm_4
  name: Short-sea container liner shipping services — single trades/corridors or single legs
    of trade (geographic scope left open)
  definition_status: left_open
  notes: The Commission considered defining this market based on either single trades or corridors,
    or single legs of trade. For Ro-Ro shipping services, it considered single trades. The exact
    geographic definition was left open.
theories_of_harm: []
commitments: []
