- passage_id: sp_4
  source_document_id: eu_ec_m10733_2022_decision
  page: '4'
  quote_snippet: In previous decisions, the Commission has considered that contract logistics
    services is the part of the supply chain process that plans, implements and controls the
    efficient, effective flow and storage of goods, services and related information from the
    point of origin to the point of consumption in order to meet customers’ requirements.11
    The focal point of contract logistics is the management of the flow of goods for customers
    either across the total supply chain or an element of it.12
  extraction_method: pdf_extracted
