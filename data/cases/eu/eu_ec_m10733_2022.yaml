- passage_id: sp_13
  source_document_id: eu_ec_m10733_2022_decision
  page: '8'
  quote_snippet: Roll on-Roll off (‘Ro-Ro’) shipping services correspond to the transport of
    wheeled cargo (lorries, cars, etc.) on ships33 with vessels which take on cargo via a loading
    ramp fitted as part of the vessel. In previous decisions, the Commission has considered
    that Ro-Ro shipping services constitute a potential separate relevant product market which
    excludes shipping services provided by Lift on-Lift off (‘Lo-Lo’) vessels, that is vessels
    which use dock mounted cranes to lift and stack containers on the vessel.34 Ro-Ro shipping
    requires specific port facilities (access ramp, vehicle storage areas, etc.) and ships distinct
    from the vessels and facilities used for container cargo.
  extraction_method: pdf_extracted
