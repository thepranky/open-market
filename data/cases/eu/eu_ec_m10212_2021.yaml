- passage_id: sp_2
  source_document_id: eu_ec_m10212_2021_decision
  page: '5'
  quote_snippet: 'However, for the purposes of this decision, the exact product market definition
    can be left open as the proposed Transaction does not raise serious doubts as to its compatibility
    with the internal market or the functioning of the EEA Agreement under any plausible market
    definition. The Commission will therefore analyse the effects of the proposed Transaction
    on the basis of separate product markets for: (i) the retail supply of electricity to all
    large industrial customers (ie. those with an annual consumption above 0.1 GWh); (ii) the
    retail supply of electricity to large industrial customers with annual consumption levels
    between 0.1 GWh and 2 GWh; (iii) the retail supply of electricity to large industrial customers
    with annual consumption levels between 2 GWh and 10 GWh; (iv) the retail supply of electricity
    to large industrial customers with annual consumption levels above 10 GWh and; (v) the retail
    supply of “green” electricity to large industrial customers through PPAs.'
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
  - pm_1
  supports_geographic_markets: []
  supports_theories: []
  supports_commitments: []
- passage_id: sp_3
  source_document_id: eu_ec_m10212_2021_decision
  page: '4'
  quote_snippet: 'The market investigation therefore indicated that there could be additional
    separate product markets regarding large industrial customers, according to the size of
    yearly electricity consumption. The vast majority of competitors noted that the retail supply
    of electricity to large industrial should be further segmented according to: (i) customers
    with annual consumption between 0.1 and 2 GWh; (ii) customers with annual consumption between
    2 and 10 GWh; and (iii) customers with annual consumption above 10 GWh in view of their
    different consumption patterns.'
  extraction_method: pdf_extracted
