- passage_id: sp_26
  source_document_id: eu_ec_m10212_2021_decision
  page: '6'
  quote_snippet: All of the competitors replying to the Commission’s market investigation confirmed
    that they were active in supplying electricity to large industrial customers in Denmark
    only, as opposed to two or more Nordic countries.30 A majority of competitors also indicated
    that the majority of Danish suppliers retailing electricity to large industrial customers
    were not active in other Nord Pool countries.31 A majority of customers replying to the
    Commission’s market investigation also indicated that their suppliers were also active throughout
    Denmark, as opposed to two or more Nordic countries.
  extraction_method: pdf_extracted
