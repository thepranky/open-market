  quote_snippet: In its early decisions considering e-mobility services, the Commission had
    considered (i) a broad market for the provision of e-mobility solutions and (ii) a market
    for the manufacturing, supply and installation of charging infrastructure for e-mobility
    solutions.45 In a more recent decision, the Commission considered whether the market for
    installation and operation of public electric vehicle (“EV”) charging stations may be further
    segmented. In that case, the Commission considered that the installation and operation of
    public EV charging stations on- motorways and off-motorways should be considered as separate
    product markets.
