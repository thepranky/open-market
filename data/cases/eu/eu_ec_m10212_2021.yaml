- passage_id: sp_9
  source_document_id: eu_ec_m10212_2021_decision
  page: '5'
  quote_snippet: The market investigation also provided indications that there could also be
    a separate market for electricity produced from renewable sources (“green” electricity),
    with a majority of both customers and competitors expressing this view.17 However, certain
    market participants considered that this should only be the case for “green” electricity
    that is supplied through corporate power purchase agreements (“PPAs”).18 Indeed, a majority
    of customers and competitors who replied to the market investigation noted that it was appropriate
    to distinguish a separate market for the supply of “green” electricity through PPAs with
    the owner of renewable generation assets.
