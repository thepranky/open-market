ai_summary: >
  The European Commission cleared Google's acquisition of Fitbit in January 2021 after
  a Phase II investigation, subject to significant behavioural remedies. The Commission
  identified concerns across three overlapping theories of harm: horizontal overlap in
  wearables, Google's potential data advantage in advertising, and vertical foreclosure
  of the Android/WearOS ecosystem. The remedies focused on data separation and
  interoperability commitments rather than structural divestiture. This case is notable
  as an early precedent for data-advantage theories of harm in digital mergers and for
  the Commission's use of long-duration behavioural commitments.
