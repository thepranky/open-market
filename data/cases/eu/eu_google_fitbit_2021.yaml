case_id: eu_google_fitbit_2021
case_name: "Google / Fitbit"
jurisdiction: EU
authority: European Commission
decision_date: "2021-01-14"
case_type: merger
procedure_stage: phase2
sector: digital / platforms
parties:
  - name: Google LLC
    role: acquirer
  - name: Fitbit Inc
    role: target
outcome: cleared_with_remedies
remedies:
  - "Google committed not to use Fitbit health and wellness data for Google Ads for 10 years."
  - "Interoperability commitments: Android must continue to interoperate with third-party wearables."
  - "Effective separation of Fitbit health data from Google's advertising systems."
theories_of_harm:
  - theory_id: toh_1
    name: Horizontal consolidation – wearables / fitness OS
    description: >
      Google and Fitbit both active in wearables; combined entity could foreclose rival
      wearable manufacturers from access to Android/WearOS ecosystem.
  - theory_id: toh_2
    name: Data advantage in digital advertising
    description: >
      Fitbit's granular health and location data could strengthen Google's dominance
      in online advertising by enabling superior audience targeting.
  - theory_id: toh_3
    name: Vertical foreclosure – wearable OS / app ecosystem
    description: >
      Google could degrade API access or interoperability for rival wearable OEMs
      relying on Android connectivity.

product_markets_considered:
  - market_id: pm_1
    name: Wrist-worn wearable devices
    definition_status: defined
    notes: >
      Commission concluded relevant product market is wrist-worn wearable devices (recital 79).
      Further segmentation (fitness trackers vs smartwatches, GPS, cellular) left open as Parties
      do not overlap — would not change competitive assessment.
  - market_id: pm_2
    name: Wearable OS / platforms
    definition_status: discussed
    notes: >
      Market left partially open; Commission assessed competitive effects on both
      narrow (WearOS) and broader (all wearable OS) bases.
  - market_id: pm_3
    name: Online advertising (general search advertising)
    definition_status: defined
    notes: >
      Commission relied on prior precedent defining a market for general search
      advertising in which Google holds a dominant position.

geographic_markets_considered:
  - market_id: gm_1
    name: EEA (wrist-worn wearable devices)
    definition_status: defined
  - market_id: gm_2
    name: EEA (online advertising)
    definition_status: defined

