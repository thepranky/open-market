  quote_snippet: In light of this, the Commission preliminarily finds for the purposes of this
    Decision that the markets for industrial flooring are at least national in scope and potentially
    EEA-wide. In any event, the precise geographic market definition can be left open, as the
    Transaction does not raise serious doubts as to its compatibility with the internal market
    in relation to industrial flooring when assessed either on the basis of national markets
    or on the basis of an EEA-wide market.
