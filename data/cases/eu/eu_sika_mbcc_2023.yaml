product_markets_considered:
- market_id: pm_1
  name: Chemical admixtures (overall market)
  definition_status: defined
  notes: The Commission concluded that the overall market of chemical admixtures is a relevant
    product market for the purpose of this Decision, alongside the narrower market of concrete
    admixtures. The Commission also noted that breadth of portfolio and position in infrastructure/underground
    applications would be taken into account in the competitive assessment.
- market_id: pm_2
  name: Concrete admixtures (narrower market)
  definition_status: defined
  notes: The Commission defined the narrower market of concrete admixtures as a relevant product
    market alongside the overall chemical admixtures market. Possible further segmentation by
    application (residential/commercial vs. infrastructure/underground) was considered but the
    Commission declined to define separate markets based on residential/commercial applications,
    while noting it would account for infrastructure/underground positioning in the competitive
    assessment.
- market_id: pm_3
  name: Injection resins (concrete works)
  definition_status: defined
  notes: The Commission concluded that injection resins constitute a distinct product market
    within concrete works, in line with its decisional practice and market investigation results.
- market_id: pm_4
  name: Resin-based grouts (concrete works)
  definition_status: defined
  notes: The Commission concluded resin-based grouts form a distinct product market. The Notifying
    Party contended the market includes both epoxy and polyester grouts; the Commission confirmed
    in line with decisional practice.
- market_id: pm_5
  name: Bonding agents (concrete works)
  definition_status: defined
  notes: The Commission concluded bonding agents constitute a distinct product market within
    concrete works, consistent with prior decisional practice.
- market_id: pm_6
  name: Primers (concrete works)
  definition_status: defined
  notes: The Commission concluded primers constitute a distinct product market within concrete
    works, consistent with prior decisional practice.
- market_id: pm_7
  name: Impregnations including coats/coatings (concrete works)
  definition_status: defined
  notes: The Commission defined impregnations (including coats/coatings) as a distinct product
    market. The Notifying Party argued that impregnations include coats and coatings; a majority
    of customers disagreed on demand-side substitutability, but a majority of competitors agreed
    on supply-side substitutability. The Commission ultimately included coats/coatings within
    impregnations.
- market_id: pm_8
  name: Corrosion protection/control (concrete works)
  definition_status: defined
  notes: The Commission concluded corrosion protection/control constitutes a distinct product
    market within concrete works, consistent with prior decisional practice.
- market_id: pm_9
  name: Structural reinforcing/strengthening and ancillaries including cleaners and release
    agents (concrete works)
  definition_status: defined
  notes: The Commission concluded structural reinforcing/strengthening and ancillaries (including
    cleaners, release agents etc.) constitute a distinct product market within concrete works,
    consistent with prior decisional practice.
- market_id: pm_10
  name: Premix mortars (dry vs. paste distinction)
  definition_status: defined
  notes: The Commission distinguished between dry and paste premix mortars, rejecting the Notifying
    Party's argument that mortars of different physical forms belong to the same market. Wet
    premix mortar is no longer used in the EEA and is not assessed further. The Commission concluded
    it will distinguish between dry and paste mortars for the purpose of this Decision.
- market_id: pm_11
  name: 'Premix mortars (distinction based on application: construction, façade, tile-fixing)'
  definition_status: considered
  notes: 'The Commission distinguished between mortars based on application (construction, façade,
    tile-fixing), consistent with prior decisions. The market investigation supported this segmentation:
    a large majority of customers confirmed different applications require specific mortars
    that are not interchangeable. The Commission''s final conclusion on this segmentation is
    not fully stated in the supplied chunks (text ends mid-analysis at page 16).'
- market_id: pm_12
  name: Industrial flooring (overall and technology-based sub-segments)
  definition_status: left_open
  notes: The Commission conducted formal market definition analysis. It preliminarily found
    that industrial flooring constitutes a distinct market from tiles and linoleum, and that
    different flooring technologies (PU-based, epoxy-based, MMA-based, cementitious, hybrid
    PU/cementitious) are likely to constitute separate markets. However, the precise product
    market definition was ultimately left open, as the transaction does not raise serious doubts
    regardless of whether sub-segmentation by technology is applied or an overall industrial
    flooring market is used. The Commission assessed both the overall market and the technology
    sub-segments conservatively.
- market_id: pm_13
  name: Industrial flooring
  definition_status: left_open
  notes: The Commission preliminarily found the markets for industrial flooring to be at least
    national in scope and potentially EEA-wide, but left the precise geographic market definition
    open. The product market definition for industrial flooring is not formally concluded in
    these chunks (only the geographic scope is addressed here). No serious doubts raised.
- market_id: pm_14
  name: Sealants (overall market and sub-segments)
  definition_status: left_open
  notes: The Commission assessed whether sealants should be distinct from adhesives (agreed),
    and whether the sealants market should be sub-segmented by end-use (DIY/consumer vs. construction)
    and by technology (acrylic, polysulfide, polyurethane, silicone, silyl-modified polymers).
    Market investigation results provided some support for the Notifying Party's arguments against
    sub-segmentation, but were not entirely conclusive. The Commission left the precise product
    market definition open and assessed both the overall sealants market and sub-segments conservatively.
    No serious doubts raised.
- market_id: pm_15
  name: Sealants (construction and DIY/consumer)
  definition_status: left_open
  notes: The Commission left the precise geographic market definition open for sealants, but
    the product market definition discussion appears in prior chunks. In this chunk, the Commission
    states it will conservatively assess both overall EEA and national markets. The product
    market definition itself (construction vs DIY/consumer segmentation) is referenced but the
    formal conclusion on product market definition is not fully contained in this chunk — the
    geographic scope is what is left open here.
- market_id: pm_16
  name: Adhesives
  definition_status: discussed
  notes: The Commission references prior decisions that segmented adhesives by end-use group
    (DIY/consumers, construction, industrial) and by technology (water-based, reactive, hot-melts,
    solvent-based). The Notifying Party argues against sub-segmentation by end-use group and
    by technology. The Commission's own conclusion on the product market definition for adhesives
    is not present in this chunk — only the prior precedents and the Notifying Party's position
    are set out. Definition status is possible_segmentation based on the segmentation analysis
    initiated here.
- market_id: pm_17
  name: Waterproofing – segmented by application type and technology (acrylic liquid membranes
    used under tiling; acrylic liquid membranes other applications; PU liquid membranes; epoxy
    liquid membranes; bitumen liquid; bitumen felts; PVC/TPO bonding sheets; other non-liquid
    membranes; PU injection resins; damp proofing injection; epoxy injection systems)
  definition_status: discussed
  notes: The Commission's preliminary market investigation confirmed segmentation by waterproofing
    application type and technology as narrowest plausible markets, consistent with prior decisional
    practice (M.7498). The Notifying Party argued against sub-segmentation, proposing three
    broader groupings (liquid-applied membranes, sheet membranes, injections). The Commission
    preliminarily finds these distinct segments constitute separate markets but the text supplied
    covers only the preliminary assessment; no final conclusive definition is stated. The Commission
    states it will 'conservatively assess the Transaction based on the narrowest plausible product
    segmentation', indicating a left-open / possible-segmentation posture for the formal decision.
geographic_markets_considered:
- market_id: gm_1
  name: Chemical admixtures / Concrete admixtures — national markets (EEA)
  definition_status: defined
  notes: The Commission preliminarily concluded that geographic markets for chemical admixtures
    (and concrete admixtures) in the EEA are national in scope, though it noted cross-border
    deliveries are common and that catchment-area definitions (~400-500 km radius) could also
    be appropriate. Past decisions had left the question open between EEA-wide and narrower;
    the Commission here assessed on national basis as most conservative. The notifying party
    also submitted national dimension was appropriate.
- market_id: gm_2
  name: Concrete works — national geographic markets
  definition_status: defined
  notes: The Commission concluded that the relevant geographic market for each segment within
    concrete works is national in scope, consistent with prior decisional practice. The Notifying
    Party accepted national markets as the narrowest plausible definition for assessment purposes.
- market_id: gm_3
  name: Industrial flooring — geographic market (national or EEA-wide)
  definition_status: left_open
  notes: The Commission assessed the geographic scope of industrial flooring markets. Past decisions
    left the question open but assessed sub-segments on a national basis as the narrowest plausible
    market. The Commission's market investigation confirmed the national level as the narrowest
    plausible market while also indicating the market could be EEA-wide. The geographic market
    definition was ultimately left open between national and EEA-wide.
- market_id: gm_4
  name: Geographic market for industrial flooring
  definition_status: left_open
  notes: The Commission preliminarily found that the markets for industrial flooring are at
    least national in scope and potentially EEA-wide. Market participants reported both similarities
    (pricing, regulatory standards) and differences between Member States. The precise geographic
    market definition was left open as no serious doubts arose under either national or EEA-wide
    assessment.
- market_id: gm_5
  name: Geographic market for sealants
  definition_status: left_open
  notes: In prior decisions, the Commission considered geographic markets for sealants/adhesives
    as varying by application — at least EEA-wide for some, national for others. Most recently,
    the DIY/consumer segment was considered likely national, while the professional construction
    segment was found likely supra-national (Western Europe, Central and Eastern Europe, Scandinavia).
    The Notifying Party presented analysis on the narrowest plausible (national) basis. The
    Commission's own assessment is noted as not entirely conclusive; the chunks end before the
    Commission's final conclusion on geographic scope for sealants is provided.
- market_id: gm_6
  name: EEA-wide or national markets for sealants
  definition_status: left_open
  notes: The Commission explicitly left open the precise geographic market definition for sealants
    (construction and DIY/consumer), stating it will conservatively assess both the overall
    EEA market and each relevant national market. Market investigation evidence showed 80%/75%
    of customers and 60%/67% of suppliers can procure/sell throughout the EEA or worldwide.
