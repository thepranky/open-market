  quote_snippet: In line with previous Commission precedents, the results of the market investigation
    indicated that public lighting could be considered a separate product market. Furthermore,
    the majority of both customers and competitors indicated that there were no grounds to further
    separate the market according to the type of service provided e.g. between traditional lighting
    (such as street lighting, traffic lights) or “smart” urban electrical equipment e.g. video-surveillance
    etc. on the basis that a significant majority of customers and all competitors indicated
    that providers can carry out engineering services for both traditional lighting and “smart”
    urban electrical equipment.
