  quote_snippet: For the purposes of this decision, the Commission considers that, within electrical
    engineering services, there is a separate market for electrical engineering services for
    power lines, which should be divided further between high-voltage networks, on the one hand,
    and medium to low-voltage networks, on the other hand. The question whether this product
    market should be further segmented between installation and maintenance services, or between
    other types of power lines, can be left open as the Transaction does not raise serious doubts
    as to its compatibility with the internal market or the functioning of the EEA agreement
    under any plausible market definition.
