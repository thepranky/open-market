product_markets_considered:
- market_id: pm_1
  name: Installation and maintenance services for catenaries and overhead contact lines
  definition_status: considered
  notes: The Commission found that installation and maintenance are within the same product
    market. A separation by type of system (catenaries and overhead contact lines versus third
    rail) is warranted. The market investigation was inconclusive on further segmentation by
    type of customer (long-distance versus metropolitan rail), but the Commission decided to
    focus on long-distance rail. A distinction between conventional and high-speed rail was
    not considered necessary.
- market_id: pm_2
  name: Manufacture and supply of catenary equipment
  definition_status: left_open
  notes: The Commission confirmed the existence of a separate market for the manufacture and
    supply of catenary equipment. The question of whether to segment the market between catenary
    equipment for trains and tramways was left open as it did not raise serious doubts.
- market_id: pm_3
  name: Electrical engineering services for telecommunication networks
  definition_status: considered
  notes: The Commission considers a separate market for electrical services for telecommunication
    networks. The question of further segmentation between installation and maintenance services
    or between different types of telecommunication networks (fixed/mobile) was left open.
- market_id: pm_4
  name: Electrical engineering services for power lines
  definition_status: considered
  notes: The Commission considers a separate market for electrical engineering services for
    power lines, further divided between high-voltage and medium-to-low voltage networks. The
    question of further segmentation between installation and maintenance services or between
    overhead and underground lines was left open.
- market_id: pm_5
  name: Electrical engineering services for substations
  definition_status: considered
  notes: The Commission considers a separate market for electrical services for substations,
    distinct from power lines engineering services. The question of further segmentation between
    installation and maintenance services was left open.
- market_id: pm_6
  name: Electrical engineering services for public lighting
  definition_status: considered
  notes: The Commission considers a separate market for electrical engineering services for
    public lighting, which does not need to be segmented further by type of service (traditional
    vs. smart equipment). The question of further segmentation between installation and maintenance
    services was left open.
- market_id: pm_7
  name: Electrical engineering services for the civil nuclear industry
  definition_status: considered
  notes: The Commission confirmed the existence of a separate market for electrical engineering
    services for the civil nuclear industry, due to specific knowledge and expertise requirements.
    The question of further segmentation between installation and maintenance services was left
    open.
- market_id: pm_8
  name: Deployment and operation of optical fibre networks in low density public-initiative
    areas
  definition_status: left_open
  notes: The Commission had previously considered this a separate product market due to specificities
    of the French market and regulatory framework. It left open whether 'zones AMEL' are part
    of the same market as 'zones RIP', and whether to segment by type of network (e.g., copper,
    FttO, FttH). For the purposes of this decision, the exact market definition was left open,
    but the Commission assessed effects on this potential market and narrower markets by type
    of network.
- market_id: pm_9
  name: Provision of HVAC installation and maintenance services for the civil nuclear industry
  definition_status: considered
  notes: The Commission confirmed the existence of a separate market for HVAC engineering services
    for the civil nuclear industry due to high expertise requirements. Respondents tended to
    indicate separate markets for installation and maintenance works, as maintenance is less
    sophisticated. For the assessment, the Commission considered separate markets for installation
    and maintenance.
geographic_markets_considered:
- market_id: gm_1
  name: Installation and maintenance services for catenaries and overhead contact lines — national
    (Belgium affected)
  definition_status: defined
  notes: The market investigation clearly indicated that this market is national in scope due
    to providers being based in the same country as customers and differing national regulations,
    certifications, and technical standards.
- market_id: gm_2
  name: Installation and maintenance services for catenaries and overhead contact lines — national
    (Luxembourg affected)
  definition_status: defined
  notes: Although not explicitly stated as 'defined' for Luxembourg as a separate entry, the
    analysis of the Luxembourg market in paragraph 161 (which discusses the national railway
    operator CFL) and paragraph 162 (combined market share 'in Luxembourg') implies a national
    scope, further reinforced by the general conclusion in paragraph 29 regarding national scope
    for these services. The commitment is specifically for Belgium.
- market_id: gm_3
  name: Manufacture and supply of catenary equipment — EEA-wide
  definition_status: considered
  notes: The market investigation confirmed the market is at least EEA-wide, primarily based
    on customer feedback indicating comparable national regulations, technical standards, and
    certification processes across the EEA, and customers sourcing equipment on an EEA-wide
    or worldwide basis.
- market_id: gm_4
  name: Electrical engineering services for telecommunication networks — national/regional (France
    affected)
  definition_status: left_open
  notes: The Commission previously considered this market most likely national but left the
    precise scope open, assessing it at both national and regional levels. Market investigation
    feedback was mixed, noting both national players and regional contracts (e.g., for fibre
    rollout).
- market_id: gm_5
  name: Electrical engineering services for power lines — national/regional (France affected)
  definition_status: left_open
  notes: Previous decisions considered high-voltage power lines national in scope, while leaving
    power lines overall open between national and regional. Market investigation showed large
    suppliers are national, but smaller providers operate regionally, particularly for medium
    and low-voltage networks. The Commission ultimately left the exact geographic market definition
    open but analyzed effects at both national and regional levels.
- market_id: gm_6
  name: Electrical engineering services for substations — national/regional (France affected)
  definition_status: left_open
  notes: Previous decisions considered this market national. Market investigation feedback was
    mixed, with some suppliers active regionally and others nationally. Most customers sourced
    nationwide, with consistent prices. The Commission left the exact geographic market definition
    open but analyzed effects at both national and regional levels.
- market_id: gm_7
  name: Electrical engineering services for public lighting — national/regional (France affected)
  definition_status: left_open
  notes: The Commission previously considered this market national. Market investigation feedback
    from customers and competitors supported a national scope due to national players and similar
    pricing. The Commission left the exact geographic market definition open but analyzed effects
    at both national and regional levels.
- market_id: gm_8
  name: Electrical engineering services for the civil nuclear industry (installation services)
    — national (France affected)
  definition_status: considered
  notes: Service providers for the civil nuclear industry are typically present nation-wide,
    especially for installation and larger maintenance projects. The Commission decided to analyze
    installation services at a national level and maintenance services at a regional level.
- market_id: gm_9
  name: Electrical engineering services for the civil nuclear industry (maintenance services)
    — regional (France affected)
  definition_status: considered
  notes: Service providers for the civil nuclear industry are typically present nation-wide
    for larger projects, but smaller maintenance projects can be addressed by local players.
    The Commission decided to analyze maintenance services at a regional level, as specified
    for the civil nuclear industry.
- market_id: gm_10
  name: Deployment and operation of optical fibre networks in low density public-initiative
    areas — regional (France affected)
  definition_status: considered
  notes: The Commission previously found this market national in scope but assessed it at a
    regional level because vertically affected markets only arose regionally.
- market_id: gm_11
  name: Provision of HVAC installation services for the civil nuclear industry — national (France
    affected)
  definition_status: defined
  notes: Market investigation confirmed that service providers are typically nation-wide due
    to the volume of activities and qualifications required. All customers sourced nationally.
- market_id: gm_12
  name: Provision of HVAC maintenance services for the civil nuclear industry — unknown (France
    affected)
  definition_status: left_open
  notes: For HVAC maintenance services, the exact geographic market definition was left open
    as the parties do not overlap in these activities.
