product_markets_considered:
- market_id: pm_1
  name: Market for the distribution of OBE devices
  definition_status: considered
  notes: The Commission considered the market for the distribution of OBE devices as the narrowest
    plausible product market for its assessment, leaving open whether OBE devices are substitutable
    to other means of toll payment. The distinction between distribution to cars and trucks
    was also considered not relevant for this case in Spain.
- market_id: pm_2
  name: Market for the management of toll motorway concessions
  definition_status: considered
  notes: The Commission defined this market as one of two related to toll motorway concessions
    (the other being for the grant of concessions). For the purpose of assessing the vertical
    relationship with OBE distribution, this market was adopted. The question of distinguishing
    from other transport modes was left open.
geographic_markets_considered:
- market_id: gm_1
  name: Market for the distribution of OBE devices — geographic scope left open
  definition_status: left_open
  notes: The Commission's latest decisional practice left open whether this market is national
    or EEA-wide. For the purposes of the present case, the question was also left open as the
    transaction would not raise serious doubts under any plausible definition. Bip&Drive is
    active in Spain.
- market_id: gm_2
  name: Market for the management of toll motorway concessions — national (Spain affected)
  definition_status: considered
  notes: While prior decisional practice often defined this market according to the Origin &
    Destination method, for the purpose of assessing the vertical link with OBE devices in this
    case, the market was considered national in scope due to the perspective of OBE distributors
    and national regulatory requirements in Spain.
