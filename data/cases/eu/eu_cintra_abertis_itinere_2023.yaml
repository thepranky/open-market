  page: '5'
  quote_snippet: In case M.7075, the Commission held that the geographic scope of the market
    for the distribution of OBE devices was likely national, mainly because the customer base
    of OBE distributors (drivers) was essentially national and they mainly used the devices
    on the national motorways, even though the OBE devices might be interoperable on a wider
    basis than national.19
