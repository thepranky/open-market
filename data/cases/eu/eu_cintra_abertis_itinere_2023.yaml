- passage_id: sp_2
  source_document_id: eu_cintra_abertis_itinere_2023_decision
  page: '5'
  quote_snippet: That said, for the purposes of the present case, the question of whether OBE
    devices are substitutable to other means of toll payments may be left open as the Transaction
    would not raise serious doubts as to its compatibility with the internal market under any
    alternative product market definition. The Commission will assess the effects of the Transaction
    on the narrowest plausible product market, that is, the market for the distribution of OBE
    devices.
  extraction_method: pdf_extracted
