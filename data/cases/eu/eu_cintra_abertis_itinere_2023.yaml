source_passages:
- passage_id: sp_1
  source_document_id: eu_cintra_abertis_itinere_2023_decision
  page: '4'
  quote_snippet: In its decision in case M.7075 - Cintra/Abertis/Itinere/Bip&Drive JV, the Commission
    concluded that the different methods of toll payment, that is, by cash, credit/debit card
    or using an OBE device do not form part of the same product market and defined a market
    for the distribution of OBE devices as distinct from other methods of toll payment.13 However,
    in its most recent decisional practice, the Commission has left open whether the market
    for the distribution of OBE devices constitutes a distinct market and whether OBE devices
    are substitutable to other means of toll payment.14
  extraction_method: pdf_extracted
  review_status: unreviewed
