product_markets_considered:
- market_id: pm_1
  name: Global custody services
  definition_status: considered
  notes: The Commission considered global custody to comprise a broad set of services as a single
    heterogeneous market. It was left open whether global custody and fund administration services
    should be considered a combined market.
- market_id: pm_2
  name: Local custody services
  definition_status: left_open
  notes: The Commission considered a plausible market for local custody services but did not
    conclude on whether it constitutes a separate product market.
- market_id: pm_3
  name: Fund administration services
  definition_status: considered
  notes: The Commission considered fund administration to comprise a range of services as a
    single heterogeneous market. It was left open whether fund administration and global custody
    services should be considered a combined market.
- market_id: pm_4
  name: Asset management
  definition_status: left_open
  notes: The Commission considered a market for asset management, leaving open the question
    of further segmentation by client type (retail/institutional) and management type (active/passive)
    or by mutual funds.
geographic_markets_considered:
- market_id: gm_1
  name: Global custody services — national (France affected)
  definition_status: left_open
  notes: The Commission ultimately left the geographic market definition open, noting that the
    market investigation indicated global custody services might be national in scope, but the
    transaction did not give rise to competitive concerns under any plausible definition. The
    assessment was performed on a national market in France, where affected overlaps arose.
- market_id: gm_2
  name: Local custody services — national
  definition_status: considered
  notes: The Commission considered the market to be national in scope, consistent with previous
    decisions, as the market investigation did not indicate otherwise.
- market_id: gm_3
  name: Fund administration services — national (France and Belgium affected)
  definition_status: left_open
  notes: The Commission ultimately left the geographic market definition open, noting that the
    market investigation indicated fund administration services might be national in scope,
    but the transaction did not give rise to competitive concerns under any plausible definition.
    The assessment was performed on national markets in France and Belgium, where affected overlaps
    arose.
- market_id: gm_4
  name: Asset management — global, EEA-wide or national
  definition_status: considered
  notes: The Commission considered the market to be global, EEA-wide or national in scope, consistent
    with previous decisions, as the market investigation did not indicate otherwise.
