  page: '7'
  quote_snippet: Stevedoring services for containers (also called container terminal services)
    are an input for the provision of (short-sea) container liner shipping services. The provision
    of container stevedoring services by terminal operators involves the loading, unloading,
    storage and land-side handling for inland transportation of containerised cargo.26 It relates
    only to freight and does not concern passenger services.
