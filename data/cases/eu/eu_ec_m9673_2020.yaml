- passage_id: sp_4
  source_document_id: eu_ec_m9673_2020_decision
  page: '4'
  quote_snippet: In its prior decisional practice, the Commission has left open “whether shipping
    services should be part of a broader door-to-door multimodal transport services market.”9
    Should a separate market for shipping services exist, the Commission has considered that
    (i) container shipping is distinct from non-containerised shipping (such as bulk shipping),
    (ii) short-sea container shipping is distinct from long-sea container shipping (that is,
    deep-sea shipping), (iii) container liner shipping (scheduled service) is different from
    non-liner shipping (that is, charter, tramp or specialised transport services).10
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
  last_checked_date: '2026-06-13'
  supports_markets:
