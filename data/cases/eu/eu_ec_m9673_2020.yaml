- passage_id: sp_13
  source_document_id: eu_ec_m9673_2020_decision
  page: '7'
  quote_snippet: Therefore, for the purposes of this decision, and on the basis of its precedents
    and the arguments put forward by the Parties, the Commission considers that the cross-Channel
    routes, that is, the routes between UK and France (as serviced by BF) do not belong to the
    same geographic market as routes to the Channel Islands (serviced by Condor) because of,
    among others, the lack of demand-side substitutability and the specific topography of the
    Channel Islands ports (tidal movements and shallowness), which require a specific type of
    vessels for providing such services.
  extraction_method: pdf_extracted
