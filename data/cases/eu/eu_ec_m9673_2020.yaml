product_markets_considered:
- market_id: pm_1
  name: Ferry services (freight and passengers)
  definition_status: left_open
  notes: The Commission considered the overall market for ferry/shipping services, and left
    open whether this includes both passenger and freight ferry services, whether it includes
    both RoRo and LoLo services, and whether it includes both business and tourist passengers,
    as the transaction would not raise serious doubts under any alternative definition.
- market_id: pm_2
  name: Freight (short-sea container liner) shipping services
  definition_status: left_open
  notes: The Commission considered various segmentations for freight shipping services, including
    container vs non-containerised, short-sea vs long-sea, liner vs non-liner, reefer vs non-reefer,
    RoRo vs LoLo, and feeder services, but left the exact definition open for the purpose of
    this decision.
- market_id: pm_3
  name: Passenger shipping services
  definition_status: left_open
  notes: The Commission previously defined separate markets for business and tourist passenger
    services and considered rail and air as possible substitutes for foot passengers. For this
    decision, the distinction between business and tourist services was left open due to the
    majority of Condor's passengers being tourists and no resulting difference in assessment.
- market_id: pm_4
  name: Stevedoring services (container terminal services)
  definition_status: left_open
  notes: The Commission left open the exact delineation of the product market for stevedoring
    services, including whether it should be segmented between hinterland and transhipment traffic,
    as the transaction would not raise serious doubts under any plausible definition.
geographic_markets_considered:
- market_id: gm_1
  name: Ferry services (freight and passengers) — Channel Islands routes (UK/France affected)
  definition_status: defined
  notes: The Commission explicitly distinguished routes to the Channel Islands from cross-Channel
    routes, noting differences in demand-side substitutability, topography of ports, and stringent
    authorisation agreements. While the overall geographic market definition was left open,
    this segmentation was a specific finding.
- market_id: gm_2
  name: Ferry services (freight and passengers) — cross-Channel routes (UK-France affected)
  definition_status: defined
  notes: The Commission explicitly distinguished cross-Channel routes (UK-France) from routes
    to the Channel Islands based on lack of demand-side substitutability and specific port topographies.
    While the overall geographic market definition was left open, this segmentation was a specific
    finding.
- market_id: gm_3
  name: Freight (short-sea container) shipping services — unspecified
  definition_status: left_open
  notes: The Commission's prior practice considered segmenting by single trade/corridor or single
    leg of trades, but the exact scope for short-sea container shipping services was left open.
- market_id: gm_4
  name: Passenger shipping services — unspecified
  definition_status: left_open
  notes: The Commission's prior practice for passenger shipping services examined Western Channel,
    Short Sea, and North Sea routes, but did not conclude on a precise geographic definition
    in this decision.
- market_id: gm_5
  name: Stevedoring services (container terminal services) — unspecified
  definition_status: left_open
  notes: The Commission left open whether the geographic market for container terminal services
    encompasses ports of a region, a catchment area, or one Member State, as the transaction
    would not raise serious doubts under any alternative definition.
- market_id: gm_6
  name: Stevedoring services (container terminal services) — Southern England ports
  definition_status: considered
  notes: The Commission considered the Southern England ports as a possible geographic market
    for assessment purposes, without formally defining it as the relevant market.
- market_id: gm_7
  name: Stevedoring services (container terminal services) — Port of Portsmouth
  definition_status: considered
  notes: The Commission assessed the transaction's effects at the narrowest level of the Port
    of Portsmouth, where a vertical relationship arises, without formally defining it as the
    appropriate geographic market.
theories_of_harm: []
commitments: []
