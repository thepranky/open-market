- passage_id: sp_3
  source_document_id: eu_ec_m9673_2020_decision
  page: '5'
  quote_snippet: The Notifying Parties submit that, as a general rule, almost all ferry service
    providers offer passenger and freight services and many will be able to do so on the same
    vessel.17 With regard to transportation services to and from the Channel Islands, where
    the Target is active, they consider that the relevant product markets should be considered
    broadly (including passenger and freight ferry services in the same market), since a standalone
    passenger ferry service would be uneconomic and unsustainable.18
  extraction_method: pdf_extracted
  review_status: unreviewed
