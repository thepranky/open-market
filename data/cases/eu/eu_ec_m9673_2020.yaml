  source_document_id: eu_ec_m9673_2020_decision
  page: '5'
  quote_snippet: First, with regard to freight ferry services, the Commission notes that there
    is no need, for the purposes of assessing the Transaction, to distinguish between reefer
    and non-reefer services or RoRo and LoLo freight services. The Target only offers RoRo freight
    services and it can offer both reefer and non-reefer services while there is no horizontal
    overlap arising from the Transaction.
  extraction_method: pdf_extracted
