  quote_snippet: The Commission has previously defined two separate markets within passenger
    shipping services, namely the market for business passenger services and the market for
    tourist passenger services14 and concluded that there was a separate market for tourist
    passenger shipping.15 The Commission has also noted that, for passengers travelling by ferry
    without a car, rail and air transport could be a possible substitute.16
  extraction_method: pdf_extracted
