- passage_id: sp_1
  source_document_id: eu_ec_m9673_2020_decision
  page: '5'
  quote_snippet: In light of the above, the Commission considers that the relevant product market
    concerns the market for the provision of ferry/shipping services overall and it can be left
    open (i) whether this includes both passenger and freight ferry services; (ii) whether this
    includes both RoRo and LoLo services; and (iii) whether this includes both business and
    tourist passengers, since the Transaction would not raise serious doubts as to its compatibility
    with the internal market under those alternative product market definitions.
  extraction_method: pdf_extracted
