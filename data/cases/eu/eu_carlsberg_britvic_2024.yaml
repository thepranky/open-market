- passage_id: sp_21
  source_document_id: eu_carlsberg_britvic_2024_decision
  page: '7'
  quote_snippet: Carlsberg and Britvic both supply a broad range of different beverages belonging
    to different product markets, which are typically purchased by the same set of customers
    (e.g. distributors, retailers or horeca customers) for the same end use (i.e. sale to final
    consumers for on-trade or off-trade consumption). However, the Commission considers that
    the merged entity will not be able to leverage its position to engage in exclusionary practices
    in these related markets.
