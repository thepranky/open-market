product_markets_considered:
- market_id: pm_1
  name: Production and supply of non-alcoholic beverages
  definition_status: considered
  notes: The Commission previously found this market to be segmented into carbonated and non-carbonated
    soft drinks.
- market_id: pm_2
  name: Production and supply of carbonated soft drinks
  definition_status: considered
  notes: Previously found to be a separate product market from non-carbonated soft drinks.
- market_id: pm_3
  name: Production and supply of non-carbonated soft drinks
  definition_status: segmented
  notes: Previously found to be a separate product market from carbonated soft drinks. Further
    potential segmentations within this market (water, ready-to-drink teas, fruit juices, energy
    and sport drinks, dilutables) were considered or left open.
- market_id: pm_4
  name: Water (within non-carbonated soft drinks)
  definition_status: considered
  notes: The Commission previously considered water to belong to a separate product market within
    non-carbonated soft drinks.
- market_id: pm_5
  name: Ready-to-drink teas (within non-carbonated soft drinks)
  definition_status: considered
  notes: The Commission previously considered ready-to-drink teas to belong to a separate product
    market within non-carbonated soft drinks.
- market_id: pm_6
  name: Fruit juices, energy and sport drinks (potential segmentations within non-carbonated
    soft drinks)
  definition_status: left_open
  notes: The Commission considered further potential segmentations within non-carbonated soft
    drinks for these categories but left the question open.
- market_id: pm_7
  name: Dilutables
  definition_status: left_open
  notes: The exact product market definition for dilutables was left open, but it was considered
    that if it were a separate market, it would be vertically affected and subject to analysis.
- market_id: pm_8
  name: Wholesale distribution of beverages
  definition_status: left_open
  notes: The Commission previously identified a separate market for wholesale distribution of
    beverages. A potential distinction between 'off trade' and 'on trade' channels was considered
    but left open. In the present case, the exact product market definition was left open as
    no competition concerns would arise.
geographic_markets_considered:
- market_id: gm_1
  name: Production and supply of non-alcoholic beverages — national
  definition_status: considered
  notes: The Commission previously assessed these markets on a national basis and, while leaving
    the exact definition open, continued to assess the transaction under a conservative national
    approach.
- market_id: gm_2
  name: Wholesale distribution of beverages — national (France affected)
  definition_status: considered
  notes: The Commission previously considered this market to be national in scope and confirmed
    this for France in the present case for its assessment.
