product_markets_considered:
- market_id: pm_1
  name: Finished Dose Pharmaceuticals - Ophthalmological anti-infectives (ATC3 class S1A)
  definition_status: left_open
  notes: The Commission considered the ATC3 class S1A (Ophthalmological anti-infectives) as
    relevant for this transaction, consistent with its approach of dividing pharmaceutical products
    into therapeutic classes. While previous decisions and the current assessment used ATC3
    as a starting point, the exact market definition was ultimately left open as the transaction
    did not raise serious doubts under any plausible product market definition. An alternative
    market definition combining S1A and ATC4 S1C1 (ophthalmological anti-inflammatory and anti-infective
    combinations containing corticosteroids), considered in the past, was deemed not relevant
    for this transaction as the Parties are not active in S1C1.
- market_id: pm_2
  name: Contract manufacturing organisation (CMO) services
  definition_status: left_open
  notes: The Commission defined CMO services as arrangements where a manufacturer provides upstream
    manufacturing services of Finished Dose Pharmaceuticals (FDPs) under contract for a third
    party. In previous decisions, the market definition for CMO services was left open, specifically
    whether it should be an overall market or segmented. For the purpose of the assessment of
    this transaction, the segment of sterile liquid pharmaceuticals was identified as relevant.
    However, the exact product market definition for CMO services, including any segments, was
    ultimately left open as the transaction did not raise serious doubts regardless of the market
    definition considered.
- market_id: pm_3
  name: Contract manufacturing organisation (CMO) services for sterile liquid pharmaceuticals
  definition_status: left_open
  notes: This specific segment of CMO services was considered relevant for the assessment of
    the transaction, given Leo Pharma's activity in producing anti-infective eye drops. However,
    consistent with the broader CMO services market, the exact product market definition was
    ultimately left open by the Commission.
geographic_markets_considered:
- market_id: gm_1
  name: Finished Dose Pharmaceuticals - national (Sweden affected)
  definition_status: defined
  notes: For Finished Dose Pharmaceuticals (FDPs), the Commission adhered to its previous decisions,
    defining the relevant geographic market as national in scope. This applied to the distribution
    of ophthalmological anti-infectives (ATC3 class S1A), where Advanz's market share exceeded
    30% in Sweden, making it a focus of the vertical assessment.
- market_id: gm_2
  name: Contract manufacturing organisation (CMO) services - worldwide or at least EEA-wide
  definition_status: left_open
  notes: The Commission noted that previous decisions found the relevant geographic market for
    CMO services to be worldwide or at least EEA-wide, given that these services are generally
    procured globally irrespective of where the products are marketed. For this transaction,
    the exact geographic market definition was left open as neither of these plausible alternatives
    affected the outcome of the competitive assessment.
