product_markets_considered:
- market_id: pm_1
  name: Coating Resins
  definition_status: considered
  notes: The Commission considered a segmentation by chemistry and delivery technology, and
    potentially by industrial application, while noting that a distinction by industrial application
    did not impact the outcome of the competitive assessment.
- market_id: pm_2
  name: Crosslinkers
  definition_status: considered
  notes: The Commission considered crosslinkers on the basis of chemistry, and for crosslinkers-amino
    resins, crosslinkers-phenolic resins, aziridines crosslinkers, and carbodiimide crosslinkers,
    it also potentially distinguished between industrial applications, but not for polyisocyanate
    crosslinkers.
- market_id: pm_3
  name: Diisocyanates
  definition_status: defined
  notes: The Commission concluded that the market for diisocyanates can be segmented by compound
    (i.e., HDI, IPDI, H12MDI, TDI, MDI, and mMDI) without further segmentation.
- market_id: pm_4
  name: Linear Polyols
  definition_status: defined
  notes: The Commission considered that polyester, polyether, and polycarbonate diols constitute
    separate markets.
- market_id: pm_5
  name: Solar Coatings
  definition_status: left_open
  notes: The Commission left open the exact product market definition for solar coatings, considering
    that it did not impact the competitive assessment due to the lack of any actual vertical
    relationships.
geographic_markets_considered:
- market_id: gm_1
  name: Coating Resins — EEA-wide or Worldwide
  definition_status: left_open
  notes: The Commission did not conclude on the exact geographic market definition for coating
    resins (EEA-wide or worldwide) as it did not impact the outcome of the competitive assessment.
- market_id: gm_2
  name: Crosslinkers — EEA-wide or Worldwide
  definition_status: left_open
  notes: The Commission did not conclude on the exact geographic market definition for crosslinkers
    (EEA-wide or worldwide) as it did not impact the outcome of the competitive assessment.
- market_id: gm_3
  name: Diisocyanates — EEA-wide or Worldwide
  definition_status: left_open
  notes: The Commission did not conclude on the exact geographic market definition for diisocyanate
    compounds (EEA-wide or worldwide) as it would not impact the competitive assessment.
- market_id: gm_4
  name: Linear Polyols — EEA-wide or Worldwide
  definition_status: left_open
  notes: The Commission left open the exact geographic market definition for polyols (EEA-wide
    or worldwide) as it did not impact the outcome of the competitive assessment.
- market_id: gm_5
  name: Solar Coatings — EEA-wide or Worldwide
  definition_status: left_open
  notes: The Commission left open the exact geographic market definition for solar coatings
    as it did not impact the competitive assessment due to the lack of actual vertical relationships.
