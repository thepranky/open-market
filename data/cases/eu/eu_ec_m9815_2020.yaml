- passage_id: sp_5
  source_document_id: eu_ec_m9815_2020_decision
  page: '6'
  quote_snippet: 'In light of the feedback from market participants and the information available
    to it, the Commission concludes that the product market for the repair and maintenance of
    elevators and escalators could be segmented into (i) repair and maintenance services for
    elevators and escalators (combined); and (ii) repair and maintenance services for each of:
    (i) elevators; and (ii) escalators.'
  extraction_method: pdf_extracted
