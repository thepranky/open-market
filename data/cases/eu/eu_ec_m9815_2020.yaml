  source_document_id: eu_ec_m9815_2020_decision
  page: '6'
  quote_snippet: 'Feedback from market participants indicated that customer preferences and
    regulations for services provided on escalators vary among countries and that national presence
    is required. An escalator MRO provider stated: “the Company regards the market for maintenance
    of escalators as different on a national basis as customer preferences and regulations vary
    from country to country and market presence in each country is necessary to make the business
    profitable”28.'
