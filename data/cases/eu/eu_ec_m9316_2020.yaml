  page: '20'
  quote_snippet: As regards the possibility of a market larger than national in scope, competitors
    considered that they would not be able to bid competitively in an EEA State where they are
    not present.108 Similarly, customers considered that paving companies from neighbouring
    countries cannot bid competitively without presence in their own Member State, in this case
    Sweden.109 Barriers include cultural differences, language and lack of contacts.110
