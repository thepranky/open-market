- passage_id: sp_16
  source_document_id: eu_ec_m9316_2020_decision
  page: '17'
  quote_snippet: Given the perishable nature of asphalt, the definition of the relevant geographic
    market revolves around the appropriate radius of the catchment area within which most of
    the competition takes place. In this regard customers indicated that they source close to
    100 % of their asphalt within a radius of 50 km from their paving projects,92 while 5 out
    of 7 competitors submitted that they sell 85%-100% of their asphalt within this radius.93
    Thus, most of the competitive interactions between competitors with fixed plants in Norway
    and Sweden take place within a radius of 50 km from the asphalt plant.
  extraction_method: pdf_extracted
