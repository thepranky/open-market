    considers that asphalt is a market separate from paving. The Commission does not distinguish
    between warm, half-warm and cold mix asphalt in this case as practically the only type of
    asphalt that matters for the competitive assessment is warm asphalt. The issue of mobile
    plants is taken into account in the geographic market definition as they can only be a viable
    customer choice in certain areas.
