- passage_id: sp_9
  source_document_id: eu_ec_m9316_2020_decision
  page: '23'
  quote_snippet: The Parties do not have any horizontal overlap in construction as the Target
    is not active in construction. Peab’s share in construction stays below 30 % under any market
    definition that the Commission considers plausible in all three EEA states involved in the
    Transaction.124 Thus construction markets are of interest because they are the downstream
    leg of a vertical link involving aggregates in the upstream market. In these vertical relationships
    the competitive assessment is the same under any market definition that the Commission considers
    plausible.
