- passage_id: sp_4
  source_document_id: eu_ec_m9316_2020_decision
  page: '12'
  quote_snippet: In line with previous decisions, the Commission considers a distinct market
    for the supply of bitumen, with a potential further segmentation, depending on the type
    of bitumen.55 In this case, the Target processes the purchased bitumen predominantly for
    its own asphalt production in Norway,56 and sells any surplus on an ad-hoc basis to third
    parties.57 Because of the Target’s minor activity, the competitive assessment would not
    change under any plausible product market definition. For the purpose of this case, the
    exact product market definition can therefore be left open, as regardless of the exact product
    market definition for bitumen, no competition concerns would arise as a result of the transaction.
  extraction_method: pdf_extracted
  review_status: unreviewed
