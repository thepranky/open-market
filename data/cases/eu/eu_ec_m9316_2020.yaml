product_markets_considered:
- market_id: pm_1
  name: Aggregates
  definition_status: left_open
  notes: The Commission considered segmentations between primary vs secondary/recycled aggregates,
    specialist vs other aggregates, and crushed rock vs gravel and sand. It decided not to distinguish
    primary from secondary/recycled, and specialist from other aggregates, for the purpose of
    the assessment. For crushed rock vs gravel and sand, while the market investigation suggested
    they belong to one market, the question was ultimately left open.
- market_id: pm_2
  name: Bitumen
  definition_status: left_open
  notes: The Commission considered a distinct market for bitumen, with potential further segmentation
    by type, but left the exact definition open due to the Target's minor activity and no resulting
    competition concerns.
- market_id: pm_3
  name: Asphalt
  definition_status: defined
  notes: The Commission considered asphalt to be a distinct market separate from paving and
    did not distinguish between warm, half-warm, and cold mix asphalt, focusing on warm asphalt
    for the assessment.
- market_id: pm_4
  name: Paving (contract surfacing)
  definition_status: defined
  notes: The Commission considered paving to be a single, distinct product market, separate
    from the materials used.
- market_id: pm_5
  name: Ready-mix concrete (RMX)
  definition_status: defined
  notes: The Commission consistently considered RMX to be a single, distinct product market
    without further subdivisions.
- market_id: pm_6
  name: Construction
  definition_status: left_open
  notes: Due to no horizontal overlap and Peab's low market shares, the Commission left the
    exact market definition open, as it would not change the competitive assessment of the vertical
    links with aggregates.
- market_id: pm_7
  name: Transport (cargo/bulk shipping)
  definition_status: left_open
  notes: Given the Target's minor activity in transport (one cargo ship and one bulk carrier),
    the Commission left the market definition open as no competition concerns were foreseen.
geographic_markets_considered:
- market_id: gm_1
  name: Aggregates — local/regional (Finland, Norway, Sweden affected)
  definition_status: considered
  notes: The Commission generally considered a 50km radius but noted regional variations, such
    as an 80km radius in sparsely populated areas or longer distances (around 200km) in northern
    Norway due to boat transport.
- market_id: gm_2
  name: Bitumen — national/local (Norway affected)
  definition_status: left_open
  notes: The Commission noted that the Target sells bitumen over distances up to 600km in Norway
    and that market investigation did not contradict past findings. However, it left the exact
    scope open as no competition concerns would arise.
- market_id: gm_3
  name: Asphalt — local (Norway and Sweden affected)
  definition_status: considered
  notes: The Commission generally considered a 50km radius due to the perishable nature of asphalt,
    but allowed for regional differences such as an 80km radius in sparsely populated areas,
    longer distances via boat transport in northern Norway, and mobile asphalt plants acting
    as competitive constraints in northern Sweden and most of Norway.
- market_id: gm_4
  name: Paving (contract surfacing) — national (Norway and Sweden affected)
  definition_status: defined
  notes: The Commission defined the paving market as national, based on national bidding, suppliers
    constraining each other nationally, and barriers to entry for foreign competitors.
- market_id: gm_5
  name: Ready-mix concrete (RMX) — local (Finland, Norway, Sweden affected)
  definition_status: left_open
  notes: The Commission considered plausible geographic markets of 25km or 50km around each
    plant, with a narrower catchment area in urban areas and a wider one in rural/sparsely populated
    regions. It decided to use a 50km radius as a general assumption for a more prudent analysis
    but left the ultimate definition open.
- market_id: gm_6
  name: Construction — national/wider (Finland, Norway, Sweden affected)
  definition_status: considered
  notes: The Commission considered the market for construction to be national or wider, noting
    that major players are active in multiple countries, but did not conclude on a precise definition.
- market_id: gm_7
  name: Transport (cargo/bulk shipping) — local/national (Norway affected)
  definition_status: left_open
  notes: Given the small size of the ships involved and the limited competition concerns, the
    Commission left the geographic market definition open, noting it would be smaller than worldwide.
