- passage_id: sp_18
  source_document_id: eu_ec_m9316_2020_decision
  page: '19'
  quote_snippet: A majority of both customers and competitors considered that paving players
    bid nationally and not only regionally.106 As bidding has substantial costs, it is unlikely
    that a firm would bid in a tender if it did not consider that it has a non-negligible chance
    of success. Consequently, the fact that bidding takes place nationally indicates that suppliers
    constrain each other in the entire EEA state concerned and not only in the region where
    they have equipment or employees. This would therefore be indicative of a national market.
    In the same vein, respondents to the market investigation were of the view that paving suppliers
    can bid competitively anywhere in the EEA state regardless of having equipment and employees
    in the area, even if they considered that local presence is an advantage.107 The Commission
    notes that having an advantage implies differentiation within the same market rather than
    separate markets.
  extraction_method: pdf_extracted
  review_status: unreviewed
  confidence_score: 0.7
