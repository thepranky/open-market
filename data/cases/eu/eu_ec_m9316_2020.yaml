- passage_id: sp_15
  source_document_id: eu_ec_m9316_2020_decision
  page: '18'
  quote_snippet: 'Based on the above, the Commission will retain geographic markets with a radius
    of 50 km but will take into account regional differences in the competitive assessment as
    appropriate. These regional differences are as follows: i.) in sparsely populated areas
    a radius of 80 km may be more appropriate; ii.) in northern Norway boat transport is also
    an alternative that can result in a larger geographic market as boat transport allows larger
    volumes, which reduces perishability; and iii.) in northern Sweden and in Norway outside
    the metropolitan areas, mobile asphalt plants can also be competitive constraints.'
  extraction_method: pdf_extracted
