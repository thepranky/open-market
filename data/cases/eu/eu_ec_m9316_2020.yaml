  quote_snippet: For the present case, the Commission considers the market for construction
    to be national or wider. Peab itself is active in construction in Finland, Sweden and Norway,
    which is also the case for Skanska. NCC and Veidekke have a presence in construction in
    both Norway and Sweden126. However, companies do not compete in all parts of the EEA, and
    market investigation provided no information on whether presence in the respective country
    is a perquisite for successfully competing for construction projects.
