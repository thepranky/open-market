product_markets_considered:
- market_id: pm_1
  name: Accessible-luxury handbags
  definition_status: defined
  notes: 'The Court formally defined accessible-luxury handbags as a relevant antitrust product
    market, distinct from mass-market handbags and true-luxury handbags. The market was established
    through both qualitative Brown Shoe analysis (four indicia for each boundary: peculiar characteristics/unique
    production facilities, distinct prices, industry recognition, and sensitivity to price changes)
    and quantitative HMT analysis conducted by Dr. Loren K. Smith. The candidate market was
    defined using NPD''s ''Bridge'' and ''Contemporary'' brand categories, comprising over 200
    brands. Handbags are defined as ''small to medium-sized bags used for carrying personal
    items and money and have handles or a strap and are designed to be held in the hand or worn
    over the shoulder.'' Accessible-luxury handbags are generally priced between $100 and $1,000.
    The FTC proposed this market; Defendants argued for a single undifferentiated handbag market.
    The Court found in the FTC''s favour.'
- market_id: pm_2
  name: Mass-market handbags (fast fashion / opening price point)
  definition_status: considered
  notes: Mass-market handbags are identified as a separate submarket from accessible-luxury
    handbags but are not the central focus of the FTC's challenge. The Court considered this
    segment as a boundary marker to define the accessible-luxury submarket. The Court found
    mass-market and true-luxury handbags are not reasonably interchangeable with accessible-luxury
    handbags.
- market_id: pm_3
  name: True-luxury handbags (luxury / pinnacle luxury / traditional European luxury)
  definition_status: considered
  notes: True-luxury handbags are identified as a separate submarket from accessible-luxury
    handbags but are not the central focus. The Court used this as the upper boundary of the
    accessible-luxury market. The Court found that true-luxury and mass-market handbags are
    not reasonably interchangeable with accessible-luxury handbags.
geographic_markets_considered:
- market_id: gm_1
  name: United States
  definition_status: defined
  notes: Both parties agreed that the relevant geographic market is the United States. The Court
    noted this agreement and proceeded on that basis.
theories_of_harm:
- theory_id: toh_1
  name: Horizontal unilateral effects — elimination of head-to-head competition between close
    competitors (Coach, Kate Spade, Michael Kors)
  theory_type: horizontal
  theory_outcome: upheld
  description: 'The Court found compelling qualitative and quantitative evidence that Coach,
    Kate Spade, and Michael Kors are particularly close competitors. Post-merger, the elimination
    of head-to-head competition would give Tapestry incentive to raise prices and reduce discounting.
    Dr. Smith''s UPP analysis indicated an average price increase of 18% (baseline) or 13.1%
    (conservative), and merger simulation indicated ~17% average price increase and ~$365 million
    annual consumer harm. Internal documents showed the merging parties identified each other
    as primary/closest competitors and engaged in conquesting and counter-conquesting. The Court
    rejected defendants'' rebuttal arguments regarding: (1) low entry barriers; (2) brand autonomy
    ensuring continued competition; (3) procompetitive rationale of revitalising Michael Kors;
    and (4) consumers as price-setters for discretionary goods.'
