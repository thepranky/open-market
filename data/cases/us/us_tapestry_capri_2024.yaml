- passage_id: sp_14
  source_document_id: sdny_tapestry_capri_pi_opinion
  page: '64'
  quote_snippet: 'Here, four Brown Shoe indicia favor recognizing accessible-luxury handbags
    as a different product market than mass-market handbags: peculiar characteristics, distinct
    prices, industry recognition, and sensitivity to price changes. See 370 U.S. at 325. Likewise,
    four Brown Shoe indicia favor recognizing accessible-luxury handbags as a different product
    market than true-luxury handbags: unique production facilities, distinct prices, industry
    recognition, and sensitivity to price changes. See id. Examining the indicia holistically,
    and especially considering the highly compelling evidence of industry recognition, the Court
    finds that accessible-luxury handbags are a relevant antitrust market distinct from mass-market
    handbags and true-luxury handbags.'
  extraction_method: pdf_extracted
