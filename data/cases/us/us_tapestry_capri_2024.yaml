ai_summary: |
  A federal district court in the Southern District of New York granted the FTC's preliminary injunction blocking Tapestry's $8.5bn acquisition of Capri Holdings in October 2024, in what became a landmark accessible luxury goods merger challenge. Judge Rochon accepted the FTC's narrow product market definition centred on "accessible luxury" handbags (approx. $100–$1,000, manufactured in Southeast Asia, relying on discounting, with genuine materials), finding that Coach, Kate Spade (Tapestry) and Michael Kors (Capri) were close competitors within that submarket. The court found the FTC demonstrated a likelihood of success on its Section 7 claim and that the merger would harm competition on multiple dimensions — price, discounting, promotions, innovation, design, and employee wages/benefits. Tapestry and Capri terminated the merger agreement on November 14, 2024, without pursuing the appeal. This case is notable for applying a narrow submarket approach to consumer goods outside traditional antitrust markets and for the FTC's emphasis on ordinary-course business documents as key evidence. [AI-generated summary — verify against source]
