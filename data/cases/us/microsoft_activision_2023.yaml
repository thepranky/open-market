case_id: us_microsoft_activision_2023
case_name: "Microsoft / Activision Blizzard"
jurisdiction: US
authority: FTC
decision_date: "2023-07-10"
  # Date of the federal district court PI denial — the determinative procedural event.
  # The FTC's Part 3 administrative complaint was voluntarily dismissed without an ALJ
  # decision on the merits. No adjudicated decision date exists for the administrative track.
case_type: merger
procedure_stage: federal_district_court
  # The FTC pursued two parallel tracks: (1) Part 3 administrative proceedings, and
  # (2) a federal PI action in N.D. Cal. The PI denial (July 2023) was the outcome-determining
  # event. The admin complaint was voluntarily dismissed after the deal closed. No ALJ
  # initial decision was ever issued.
sector: digital / platforms
parties:
  - name: Microsoft Corporation
    role: acquirer
  - name: Activision Blizzard Inc
    role: target
outcome: cleared
remedies:
  - "10-year licensing agreements with Sony, Nintendo, and NVIDIA to supply Call of Duty on their platforms."
  - "Cloud gaming licensing agreement with Boosteroid and other cloud providers."
  - "Cloud gaming rights in the UK ring-fenced for 15 years (CMA condition)."
theories_of_harm:
  - theory_id: toh_1
    name: Vertical foreclosure – console gaming
    description: >
      FTC alleged Microsoft would withhold or degrade Activision Blizzard's titles
      (primarily Call of Duty) from rival consoles (PlayStation), harming Sony's
      ability to compete in the console gaming market.
  - theory_id: toh_2
    name: Vertical foreclosure – cloud gaming
    description: >
      FTC alleged Microsoft would foreclose rival cloud gaming platforms from access
      to Activision Blizzard's game portfolio, entrenching Microsoft's Azure-based
      Game Pass / Xbox Cloud Gaming service.
  - theory_id: toh_3
    name: Horizontal consolidation – gaming subscription services
    description: >
      Combined entity would be the largest gaming subscription service provider,
      with Call of Duty, King/Candy Crush, and existing Xbox Game Pass content,
      potentially foreclosing rival subscription services.

product_markets_considered:
  - market_id: pm_1
    name: High-performance console gaming
    definition_status: discussed
    notes: >
      FTC alleged a distinct market for high-performance console gaming excluding
      mobile gaming. The precise scope was contested; no adjudicated market definition
      ruling was made in the US proceedings — the federal PI action was denied on
      other grounds and the administrative case was dismissed without a merits decision.
  - market_id: pm_2
    name: Cloud gaming services / subscription
    definition_status: discussed
    notes: >
      FTC alleged a distinct emerging market for cloud gaming subscription services,
      distinct from downloaded console and PC gaming. No adjudicated finding was made;
      source needed for any attributed propositions.
  - market_id: pm_3
    name: Gaming content / AAA game publishing
    definition_status: discussed
    notes: >
      The FTC complaint referenced gaming content markets in the context of foreclosure
      theories. No formal market definition ruling was issued in the US proceedings.

geographic_markets_considered:
  - market_id: gm_1
    name: United States (console gaming)
    definition_status: discussed
  - market_id: gm_2
    name: United States (cloud gaming)
    definition_status: discussed

