ai_summary: >
  The FTC challenged Microsoft's $68.7bn acquisition of Activision Blizzard on vertical
  foreclosure and horizontal consolidation theories. The FTC alleged Microsoft would
  withhold Call of Duty from rival consoles (primarily PlayStation) and foreclose cloud
  gaming platforms from Activision's game portfolio. In July 2023, the Northern District
  of California denied the FTC's motion for a federal preliminary injunction, finding the
  FTC had not demonstrated a likelihood of success on its foreclosure theories. The deal
  closed in October 2023. Microsoft had pre-committed to 10-year licensing agreements with
  Sony, Nintendo, and NVIDIA for Call of Duty access. The FTC's Part 3 administrative
  proceedings were voluntarily dismissed without any ALJ decision on the merits. No
  adjudicated market definition finding was made in the US proceedings. This case is
  a significant US precedent on the incentive prong in vertical foreclosure analysis and
  the limits of the FTC's ability to block deals through the federal PI mechanism.
  [AI-generated summary — verify against source]

