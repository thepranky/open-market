theories_of_harm:
  - theory_id: toh_1
    name: Elimination of the ultra-low-cost carrier (ULCC) competitive constraint
    description: >
      Spirit Airlines, as the largest ULCC in the US, exerts a particularly strong
      downward pressure on fares wherever it operates (the "Spirit effect"). Absorbing
      Spirit into JetBlue, a higher-cost low-cost carrier, would eliminate this
      price discipline and raise fares for price-sensitive travellers on affected routes.
  - theory_id: toh_2
    name: Horizontal consolidation on overlap routes
    description: >
      JetBlue and Spirit overlap on a significant number of city-pair routes; the merger
      would eliminate direct head-to-head competition on those routes.

product_markets_considered:
  - market_id: pm_1
    name: Scheduled air passenger service – overlap city-pair routes
    definition_status: defined
    notes: >
      Court applied the "city-pair" approach standard in US airline merger cases.
      Each origin-destination pair (including connecting itineraries) constitutes a
      separate relevant market. Markets analysed at both non-stop and connecting service levels.
  - market_id: pm_2
    name: ULCC air passenger service (price-sensitive travellers)
    definition_status: discussed
    notes: >
      DOJ argued for a distinct market for ultra-low-cost air travel, given that
      price-sensitive travellers treat ULCCs as non-substitutable with LCCs or
      network carriers. The court's analysis referenced this framing without formally
      adopting a standalone ULCC market.

geographic_markets_considered:
  - market_id: gm_1
    name: Individual city-pair routes (United States)
    definition_status: defined
    notes: >
      Geographic market defined at the level of individual origin-destination city pairs
      consistent with established US airline merger precedent (e.g., DOJ v. US Airways/American).

