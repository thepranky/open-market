ai_summary: >
  A federal district court in Massachusetts blocked JetBlue's $3.8bn acquisition of
  Spirit Airlines in January 2024, finding that the merger would substantially lessen
  competition in US air travel markets. The court's analysis centred on the elimination
  of the "Spirit effect" — the documented phenomenon whereby Spirit's presence on a
  route depresses fares charged by all carriers on that route. As the largest ULCC,
  Spirit exerted a disproportionate competitive constraint on prices for price-sensitive
  travellers. The court rejected JetBlue's efficiency arguments and found that entry by
  other ULCCs would not be timely or sufficient to restore lost competition. Spirit
  subsequently filed for bankruptcy. This decision reinforces the city-pair market
  definition approach in US airline cases and the importance of ULCC competition theory.
