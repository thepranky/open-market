    page: "7"
    quote_snippet: >
      The Competition and Markets Authority (CMA) has decided that the anticipated acquisition
      (the Merger) of Inmarsat Group Holdings Limited (Inmarsat) by Viasat, Inc (Viasat)
      (together, the Parties or, for statements referring to the future, the Merged Entity)
      may not be expected to result in a substantial lessening of competition (SLC) in the
      supply of broadband inflight connectivity (IFC) services to commercial airlines or
      business aircraft operators serving the United Kingdom (UK).
