case_type: merger
ai_summary: |
  The CMA cleared Viasat's anticipated acquisition of Inmarsat in its Phase 2 final report dated 9 May 2023, finding no substantial lessening of competition (SLC) in either of the two relevant markets. The investigation focused on the supply of broadband inflight connectivity (IFC) services — assessed as two separate product markets: supply to commercial airlines and supply to operators of large business aircraft, both on a global geographic basis with competitive assessment focused on UK-connected routes. In both markets the CMA found the Parties compete closely and would likely remain close competitors absent the Merger. However, significant and growing constraints from Panasonic, Intelsat, and (increasingly) Starlink were found sufficient in commercial aviation, and constraints from Gogo, Starlink, Intelsat, and Satcom Direct sufficient in business aviation, such that no SLC was expected in either segment. The CMA ran in parallel with the European Commission (M.10807), which also cleared the transaction unconditionally in May 2023. [AI-generated summary — verify against source]
