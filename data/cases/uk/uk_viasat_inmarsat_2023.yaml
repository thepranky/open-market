case_id: uk_viasat_inmarsat_2023
case_name: "Viasat / Inmarsat (CMA)"
jurisdiction: UK
authority: CMA
authority_reference: ME/6997/22
decision_date: "2023-05-09"
case_type: merger
procedure_stage: phase2
sector: satellite communications / inflight connectivity
parties:
  - name: Viasat Inc
    role: acquirer
  - name: Inmarsat Group Holdings Limited
    role: target
outcome: cleared
remedies: []
commitments: []

theories_of_harm:
  - theory_id: toh_1
    name: Horizontal unilateral effects in the supply of broadband IFC services to commercial airlines
    theory_type: horizontal
    theory_outcome: dismissed
    description: >
      The CMA assessed whether the Merger would give rise to an SLC through the loss of
      competition between Viasat and Inmarsat in the supply of broadband IFC to commercial
      airlines. The CMA found the Parties compete closely (particularly in widebody
      opportunities), but concluded that significant constraints from Panasonic, Intelsat,
      and (increasingly) Starlink would remain, such that no SLC was expected. Theory dismissed.
    verification:
      status: source_linked
  - theory_id: toh_2
    name: Horizontal unilateral effects in the supply of broadband IFC services to large business aircraft operators
    theory_type: horizontal
    theory_outcome: dismissed
    description: >
      The CMA assessed whether the Merger would give rise to an SLC through the loss of
      competition between Viasat and Inmarsat in the supply of broadband IFC to large business
      aircraft operators. The Parties compete closely and would remain close competitors absent
      the Merger (para 9.63). However, the CMA found that Gogo and Starlink would likely become
      significant constraints on the Merged Entity, and Intelsat and Satcom Direct moderate
      constraints. At para 9.65 the CMA concluded that the aggregate constraints are significant
      and likely to increase, such that no SLC was expected. Theory dismissed.
    verification:
      status: source_linked

product_markets_considered:
  - market_id: pm_1
    name: Supply of broadband IFC services to commercial airlines
    definition_status: defined
    notes: >
      CMA found the relevant product market is the supply of broadband IFC services to
      commercial airlines without further segmentation (para 7.20). ATG and satellite-based
      services found to be in the same market (para 7.11). Narrowband excluded as not
      substitutable (para 7.13). Short-haul/long-haul segmentation considered but not applied
      as suppliers bid across both types (para 7.20). Parties' overlap only in broadband IFC.
    verification:
      status: source_linked
    market_importance: core_assessed
  - market_id: pm_2
    name: Supply of broadband IFC services to operators of large business aircraft
    definition_status: defined
    notes: >
      CMA found the relevant product market is the supply of broadband IFC services to
      operators of large business aircraft without further segmentation (para 7.25). Commercial
      and business aviation assessed as separate product markets (para 7.15). Small business
      aircraft excluded because the Parties' antennae are currently too large to fit on small
      aircraft — no Parties' overlap there (para 7.23).
    verification:
      status: source_linked
    market_importance: core_assessed
  - market_id: pm_3
    name: Supply of narrowband IFC services
    definition_status: discussed
    notes: >
      CMA accepted the Parties' submission that broadband and narrowband IFC services are not
      substitutable due to different customer needs and technical capabilities (para 7.13).
      Parties do not overlap materially in narrowband supply (para 7.13, fn 139). Excluded
      from competitive assessment; all subsequent analysis refers only to broadband IFC.
    verification:
      status: source_linked
    market_importance: assessed_no_overlap
  - market_id: pm_4
    name: Supply of IFC services to small business aircraft operators
    definition_status: discussed
    notes: >
      CMA explicitly considered segmenting business aviation into large and small aircraft
      (para 7.22–7.23). Small aircraft require smaller antennae; the Parties' antennae are
      too large to fit on small business aircraft. No Parties' overlap. Excluded from
      competitive assessment; only large business aircraft considered (para 7.23).
    verification:
      status: source_linked
    market_importance: assessed_no_overlap

geographic_markets_considered:
  - market_id: gm_1
    name: Global supply of broadband IFC services to commercial airlines
    definition_status: defined
    notes: >
      CMA found the relevant geographic market is global (para 7.30), but focused its
      competitive assessment on routes to and from the UK. Demand-side and supply-side
      dynamics vary somewhat across geographies but global scope adopted. Short-haul/long-haul
      geographic differences noted but not used to define separate geographic markets.
    verification:
      status: source_linked
    market_importance: core_assessed
  - market_id: gm_2
    name: Global supply of broadband IFC services to operators of large business aircraft
    definition_status: defined
    notes: >
      CMA found it appropriate to treat the provision of broadband IFC services to large
      business aircraft as a single global market given that some customers require global
      coverage (para 7.32). Assessment focused on large business aircraft used or most
      likely to be used by UK consumers and businesses (para 7.33).
    verification:
      status: source_linked
    market_importance: core_assessed

