  - name: Meta Platforms Inc
    role: acquirer
  - name: GIPHY Inc
    role: target
outcome: blocked
remedies: []
theories_of_harm:
  - theory_id: toh_1
    name: Horizontal consolidation – display advertising on social media
    description: >
      GIPHY had nascent advertising capabilities (GIPHY Ads) that could have developed
      into a competitive constraint on Meta's social media advertising. Acquisition
      removed a potential competitor from the display advertising space.
  - theory_id: toh_2
    name: Vertical foreclosure – GIF API supply to third-party platforms
    description: >
      Post-acquisition, Meta could degrade or restrict GIPHY's GIF API access to
      rival social media platforms (TikTok, Twitter, Snap etc.), foreclosing them
      from a content feature used to drive engagement and reducing their ability
      to compete with Meta's own platforms (Facebook, Instagram, WhatsApp).

product_markets_considered:
  - market_id: pm_1
    name: Social media
    definition_status: defined
    notes: >
      CMA defined a market for social media services in which Meta (Facebook, Instagram)
      holds a strong market position. Competitors include TikTok, Twitter/X, and Snapchat.
  - market_id: pm_2
    name: Display advertising on social media
    definition_status: defined
    notes: >
      CMA defined a market for social media display advertising; Meta holds a dominant
      position. GIPHY Ads was an early-stage competing product.
  - market_id: pm_3
    name: Provision of GIF libraries / searchable GIF APIs
    definition_status: defined
    notes: >
      CMA defined a distinct market for provision of GIF content libraries and APIs
      to third-party platforms; GIPHY was the leading provider with Tenor (Google) as
      the only significant alternative.

geographic_markets_considered:
  - market_id: gm_1
    name: UK (social media)
    definition_status: defined
  - market_id: gm_2
    name: UK (display advertising on social media)
    definition_status: defined
  - market_id: gm_3
    name: Global (GIF libraries / APIs)
    definition_status: defined
    notes: >
      GIF API supply assessed on a global basis given that API contracts are not
      constrained by national boundaries.

