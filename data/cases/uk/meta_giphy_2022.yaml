  - passage_id: sp_2
    source_document_id: cma_meta_giphy_final_report
    page: "272"
    paragraph: "8.10"
    section: "8 Vertical Effects — conclusion on foreclosure"
    quote_snippet: >
      For the reasons set out below, our conclusion is that the Merged Entity will have
      both the ability and incentive to foreclose its social media rivals in this way, thus
      having the effect of further strengthening Facebook's significant market power in social
      media. On that basis we conclude that the Merger has resulted, or may be expected to
      result, in a substantial lessening of competition in the supply of social media services.
    extraction_method: manually_added
