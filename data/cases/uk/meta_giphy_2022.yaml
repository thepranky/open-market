    page: "269"
    paragraph: "7.279"
    section: "7 Horizontal Effects — conclusion on horizontal unilateral effects"
    quote_snippet: >
      On the basis of the above assessment, our view is that the Merger will lead to a
      substantial lessening of competition in the supply of display advertising services
      in the UK arising from a loss of dynamic competition.
