    section: "5 Market definition — GIPHY's position in the supply of searchable GIF libraries"
    quote_snippet: >
      We found that the relevant market for the competitive assessment of the Merger is the
      supply of searchable GIF libraries (including both video and non-video GIFs, but
      excluding non-GIF stickers and other types of content, and including both API/SDK and
      O&O distribution channels) on a global basis.
    extraction_method: manually_added
