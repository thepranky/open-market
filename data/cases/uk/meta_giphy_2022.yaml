ai_summary: >
  The CMA blocked Meta's acquisition of GIPHY in its final report in November 2022,
  ordering divestiture of GIPHY to a purchaser approved by the CMA. The case was notable
  for two overlapping theories of harm: first, the elimination of GIPHY's nascent
  advertising product as a competitive constraint on Meta in social media display
  advertising; and second, the risk that Meta would foreclose rival social media
  platforms (TikTok, Twitter, Snapchat) from access to GIPHY's GIF API, a feature
  used to drive user engagement. The CMA concluded that no remedies short of full
  divestiture could adequately address the competition concerns. This is one of the
  CMA's most prominent Phase II digital merger decisions post-Brexit.
