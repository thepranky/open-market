  - title: "Perú: The New Merger Control Law Has Been Officially Published"
    firm: "Garrigues"
    url: "https://www.garrigues.com/en_GB/new/peru-new-merger-control-law-has-been-officially-published"
    date: "2021"
    summary: "Foundational alert on Law No. 31112, which introduced mandatory pre-merger control across all economic sectors in Peru. Covers notification thresholds (combined or individual sales/assets), INDECOPI's ex officio powers, voluntary notification option, and special provisions for financial and insurance sector transactions."
  - title: "Peru — Merger Control Laws and Regulations 2024"
    firm: "ICLG"
    url: "https://iclg.com/practice-areas/merger-control-laws-and-regulations/peru"
