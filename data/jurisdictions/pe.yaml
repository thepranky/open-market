jurisdiction_id: pe
jurisdiction_name: Peru
last_verified: "2026-06-17"

authority:
  name: Instituto Nacional de Defensa de la Competencia y de la Protección de la Propiedad Intelectual
  abbreviation: INDECOPI
  url: https://www.indecopi.gob.pe/
  filing_url: https://www.indecopi.gob.pe/

regime:
  mandatory: true
  suspensory: true   # Article 11 Legislative Decree 1034 (as amended) — standstill obligation
  voluntary: false

legal_basis:
  - citation: "Legislative Decree No 1034 (Antitrust Law / Ley de Represión de Conductas Anticompetitivas), as amended by Legislative Decree No 1510 of 2020 — Chapter III (Concentrations, Articles 8–17a)"
    url: "https://www.indecopi.gob.pe/"
    note: >
      Mandatory pre-merger notification was introduced in Peru by Legislative Decree
      No 1510 of March 2020 (in force 14 June 2021 for the notification obligation).
      Prior to 2021, Peru had no mandatory pre-merger notification. Articles 8–17a of
      Legislative Decree 1034 govern concentrations. Article 8 defines concentrations.
      Article 9 sets the notification thresholds. Article 11 imposes the standstill obligation.
  - citation: "Regulation for the Control of Business Concentrations (Reglamento para el Control de Concentraciones Empresariales), approved by Supreme Decree No 039-2021-PCM"
    url: "https://www.indecopi.gob.pe/"
    source_type: official_guidance

filing:
  deadline_from_signing_days: 30
  deadline_from_closing_days: null
  pre_closing_required: true
  note: >
    Notification must be filed within 30 calendar days of the concentration agreement
    being concluded (signing). The standstill obligation requires awaiting INDECOPI
    clearance or expiry of the review period before implementing.

review_periods:
  phase_1:
    days: 30
    day_type: working
    extendable_to_days: null
    legal_basis: "Article 14(1) Legislative Decree 1034 (as amended)"
    note: >
      Phase I: 30 working days from receipt of a complete notification. If INDECOPI
      does not initiate a Phase II investigation, the concentration is cleared.
  phase_2:
    days: 90
    day_type: working
    extendable_to_days: 120
    legal_basis: "Article 14(2) Legislative Decree 1034 (as amended)"
    note: >
      Phase II: up to 90 working days, extendable to 120. INDECOPI may clear,
      clear with conditions, or prohibit.

fees:
  structure: >
    Filing fee applies; amount based on deal size (verify current UIT-based amounts
    with INDECOPI before filing). Peru uses the UIT (Unidad Impositiva Tributaria)
    to index fees annually.
  source: "INDECOPI fee schedule (subject to annual revision)"
  source_type: official_guidance
  source_url: "https://www.indecopi.gob.pe/"
  annual_adjustment: true

# ── Threshold tests ───────────────────────────────────────────────────────────

threshold_tests:
  - test_id: pe_combined_domestic_and_each_party
    description: >
      Combined value (sales/gross income or assets) in Peru of all parties in the
      preceding year is at least 118,000 UIT (≈ PEN 649,000,000 at the 2026 UIT of
      S/ 5,500) AND at least two parties individually reach at least 18,000 UIT each
      (≈ PEN 99,000,000). Thresholds are fixed in UIT and the PEN equivalent moves
      with the annually revised UIT.
    legal_basis: "Article 6(1) Law No 31112 (2021); Reglamento, Supreme Decree 039-2021-PCM"
    source_url: "https://www.gob.pe/institucion/indecopi/normas-legales/1736208-31112"
    annual_adjustment: true
    effective_date: "2026-01-01"
    note: >
      Peru's merger-control thresholds are set by Law No 31112 (2021), Article 6 — NOT
      the older Legislative Decree 1034 (which governs anticompetitive conduct). They are
      fixed in UIT (Unidad Impositiva Tributaria): combined >= 118,000 UIT and at least two
      parties >= 18,000 UIT each. The UIT is revised annually by Supreme Decree; for 2026
      it is S/ 5,500 (DS 301-2025-EF), giving PEN 649,000,000 and PEN 99,000,000. Update
      the PEN values each year from the current UIT; the UIT multiples are fixed.

    conditions:
      - condition_id: pe_combined_domestic_gt_threshold
        metric: revenue
        scope: domestic
        party: combined
        operator: ">="
        value: 649000000
        currency: PEN
        source: "Article 6(1)(a) Law No 31112 (118,000 UIT); UIT 2026 = S/ 5,500 (DS 301-2025-EF)"
        source_type: authority_announcement
        note: "118,000 UIT × S/ 5,500 (2026 UIT). Recompute annually from the current UIT."

      - condition_id: pe_each_party_domestic_gt_threshold
        metric: revenue
        scope: domestic
        party: each_of_at_least_two
        operator: ">="
        value: 99000000
        currency: PEN
        source: "Article 6(1)(b) Law No 31112 (18,000 UIT); UIT 2026 = S/ 5,500 (DS 301-2025-EF)"
        source_type: authority_announcement
        qualifier:
          type: "count_of_parties"
          operator: ">="
          count: 2

# ── Scope ─────────────────────────────────────────────────────────────────────

scope:
  trigger_events:
    - merger
    - share_acquisition
    - asset_acquisition
    - joint_venture
  intra_group_exempt: true
  substantive_test: "siec"
  substantive_test_url: "https://www.indecopi.gob.pe/"

# ── Gun-jumping ───────────────────────────────────────────────────────────────

minority_thresholds:
  applies: false
  standard: "control_based"
  note: >
    Peru's merger control law (Law No. 31112, in force June 2021, enforced by INDECOPI)
    requires prior notification and clearance only for acquisitions resulting in 'control'
    over an economic agent, defined as the power to exercise 'lasting and decisive
    influence' (influencia duradera y determinante) over the target's governing bodies or
    competitive strategy. Minority acquisitions that do not confer such decisive influence
    are expressly excluded. There are no percentage-based thresholds and no post-closing
    minority notification regime. INDECOPI has published limited decisional practice —
    analysis of what constitutes decisive influence relies primarily on the statute and
    Supreme Decree No. 039-2021-PCM. Sector-specific regulators (banking, insurance,
    telecoms) may impose additional approval requirements at thresholds below the INDECOPI
    control standard.
  rules:
    - rule_id: "pe_minority_control_only"
      relationship_type: "any"
      pct_threshold: null
      operator: ">="
      rights_required: "veto_strategic"
      source: "Law No. 31112, Article 5; Supreme Decree No. 039-2021-PCM (Regulation)"
      source_type: "primary_legislation"
      source_url: "https://www.indecopi.gob.pe/web/control-de-fusiones"
      note: >
        Notification is required only on acquisition of 'control' — the power to exercise
        lasting and decisive influence over the target's governing bodies, directly or
        indirectly affecting competitive strategy. A minority stake with veto rights over
        strategic decisions in a shareholder agreement may constitute control even for a
        minority holder. Purely passive minority stakes without governance rights are
        entirely outside the regime.

gun_jumping:
  automatic_void: false
  voidable: true
  max_fine_pct_turnover: null
  criminal_sanctions: false
  legal_basis: "Article 17(a) Legislative Decree 1034 (as amended)"
  legal_basis_url: "https://www.indecopi.gob.pe/"
  note: >
    Failure to notify or gun-jumping results in fines expressed in UIT units
    (verify current maximum amounts with INDECOPI).

# ── FDI screening ─────────────────────────────────────────────────────────────

fdi_screening:
  applicable: false
  note: >
    Peru does not maintain a general FDI screening or national security investment
    review regime. Foreign investment is generally open. Sector-specific licensing
    requirements may apply (e.g., mining, hydrocarbons, financial services), but
    these are not a centralised national security review mechanism.

source_passages:
  - passage_id: pe_ley31112_art6
    document_title: "Ley N° 31112 — Ley de control previo de operaciones de concentración empresarial, Artículo 6"
    article_reference: "Artículo 6.1"
    document_url: "https://faolex.fao.org/docs/pdf/per203283.pdf"
    source_type: primary_legislation
    quoted_text: >
      a. La suma total del valor de las ventas o ingresos brutos anuales o valor de activos
      en el país de las empresas involucradas [...] haya alcanzado [...] un valor igual o
      superior a ciento dieciocho mil (118 000) unidades impositivas tributarias (UIT). b.
      El valor de las ventas o ingresos brutos anuales o valor de activos en el país de al
      menos dos de las empresas involucradas [...] hayan alcanzado [...] un valor igual o
      superior a dieciocho mil (18 000) unidades impositivas tributarias (UIT) cada una
    supports_conditions:
      - pe_combined_domestic_gt_threshold
      - pe_each_party_domestic_gt_threshold

