jurisdiction_id: ke
jurisdiction_name: Kenya
last_verified: "2026-06-14"

authority:
  name: Competition Authority of Kenya
  abbreviation: CAK
  url: https://www.cak.go.ke/
  filing_url: https://www.cak.go.ke/

regime:
  mandatory: true
  suspensory: true   # parties must await CAK approval before implementing
  voluntary: false

legal_basis:
  - citation: "Competition Act No. 12 of 2010 (Kenya), Part IV (Sections 41–57)"
    url: "https://www.cak.go.ke/"
    note: >
      Part IV (Sections 41–57) establishes the merger control regime. Section 41
      defines mergers; Section 42 establishes the mandatory pre-approval requirement
      for mergers meeting the prescribed thresholds. Sections 43–57 cover the CAK's
      review procedure, timelines, and the distinction between 'approved' and
      'conditionally approved' mergers.
  - citation: "Competition (General) Rules, 2019 (Legal Notice 176 of 2019), First Schedule — Merger Threshold Guidelines"
    url: "https://kenyalaw.org/kl/fileadmin/pdfdownloads/LegalNotices/2019/LN176_2019.pdf"
    note: >
      The operative instrument for the merger thresholds (superseding the 2014 Rules).
      Part B sets the notifiable-merger thresholds (combined ≥ KES 1bn AND target > KES
      500m; or acquirer > KES 10bn); Part C sets the exclusion tiers and the fixed-band
      filing-fee schedule (Nil / Nil / KES 1m / KES 2m / KES 4m).
    source_type: primary_legislation

filing:
  deadline_from_signing_days: null
  deadline_from_closing_days: null
  pre_closing_required: true
  note: >
    Parties must notify the CAK and obtain approval before implementing the merger
    (Competition Act, Section 42). There is no fixed deadline from signing. Filing
    must occur before closing. Implementing a merger without CAK approval is an
    offence under Section 42(5) of the Act.

review_periods:
  phase_1:
    days: 60
    day_type: calendar
    extendable_to_days: null
    legal_basis: "Competition Act No. 12 of 2010, Section 46"
    note: >
      The CAK has 60 calendar days from receipt of a complete merger notification to
      issue a decision. If no decision is issued within 60 days, the merger is deemed
      approved (Section 46(3)). In practice the CAK typically issues decisions within
      30–45 days for straightforward mergers.
  phase_2:
    days: 60
    day_type: calendar
    extendable_to_days: null
    legal_basis: "Competition Act No. 12 of 2010, Section 46(2)"
    note: >
      The CAK may extend the review period by a further 60 calendar days for complex
      mergers requiring detailed investigation. Total maximum review: 120 calendar days.

fees:
  structure: >
    Fixed bands by combined turnover/assets (Competition (General) Rules 2019, Part D):
    up to KES 500m — Nil; KES 500m–1bn — Nil (exclusion application); KES 1bn–10bn —
    KES 1,000,000; KES 10bn–50bn — KES 2,000,000; above KES 50bn — KES 4,000,000.
  source: "Competition (General) Rules, 2019 (Legal Notice 176 of 2019), First Schedule, Part D"
  source_type: primary_legislation
  source_url: "https://kenyalaw.org/kl/fileadmin/pdfdownloads/LegalNotices/2019/LN176_2019.pdf"
  annual_adjustment: false

threshold_tests:
  # Kenya's tiered notification regime — Competition (General) Rules, 2019 (Legal Notice
  # 176 of 2019), First Schedule (Merger Threshold Guidelines), made under s. 93 of the
  # Competition Act No. 12 of 2010. The metric throughout is "turnover OR assets,
  # whichever is higher" (a single value, not two alternative triggers).
  #
  #   FULL notification (Part B para 4(a)): combined turnover/assets >= KES 1bn AND the
  #     target's turnover/assets > KES 500m.
  #   ACQUIRER test (Part B para 4(b)): acquirer turnover/assets > KES 10bn AND the
  #     parties are in the same market or vertically integrable (COMESA carve-out aside).
  #   Exclusion application / simplified (Part C para 5): combined KES 500m–1bn.
  #   Excluded, no notice (Part C para 6): combined <= KES 500m, or COMESA deal with
  #     <2/3 of turnover/assets in Kenya.

  - test_id: ke_full_notification
    description: "Combined Kenya turnover/assets ≥ KES 1bn AND target Kenya turnover/assets > KES 500m (LN 176/2019, Part B para 4(a))"
    legal_basis: "Competition (General) Rules, 2019 (Legal Notice 176 of 2019), First Schedule, Part B para 4(a) [Competition Act No. 12 of 2010, s. 93]"
    source_url: "https://kenyalaw.org/kl/fileadmin/pdfdownloads/LegalNotices/2019/LN176_2019.pdf"
    note: >
      Both conditions must be met (AND logic). The metric is turnover OR assets, whichever
      is higher — not two separate triggers. A deal with combined ≥ KES 1bn but a target
      at or below KES 500m is NOT a full notification (it may fall into the exclusion tiers).
      KES 1bn ≈ USD 7–8m — a low threshold catching many Kenyan-nexus transactions.
    annual_adjustment: false
    effective_date: "2019-12-06"

    conditions:
      - condition_id: ke_combined_domestic
        metric: revenue
        scope: domestic
        party: combined
        operator: ">="
        value: 1000000000
        currency: KES
        source: "Competition (General) Rules, 2019 (LN 176/2019), First Schedule, Part B para 4(a)"
        source_type: primary_legislation
        note: >
          KES 1bn combined turnover OR assets (whichever is higher) in Kenya of all
          merging parties, including the Kenyan operations of non-Kenyan entities.

      - condition_id: ke_target_domestic
        metric: revenue
        scope: domestic
        party: target_group
        operator: ">"
        value: 500000000
        currency: KES
        source: "Competition (General) Rules, 2019 (LN 176/2019), First Schedule, Part B para 4(a)"
        source_type: primary_legislation
        note: >
          Target's turnover OR assets (whichever is higher) in Kenya must be ABOVE
          KES 500m (strictly greater). Below this, the deal is not a full notification.

  - test_id: ke_acquirer_threshold
    description: "Acquirer Kenya turnover/assets > KES 10bn AND parties same-market/vertically integrable (LN 176/2019, Part B para 4(b))"
    legal_basis: "Competition (General) Rules, 2019 (Legal Notice 176 of 2019), First Schedule, Part B para 4(b)"
    source_url: "https://kenyalaw.org/kl/fileadmin/pdfdownloads/LegalNotices/2019/LN176_2019.pdf"
    note: >
      Independent notification trigger: where the acquiring undertaking's turnover/assets
      (whichever higher) in Kenya exceeds KES 10bn and the parties are in the same market
      or can be vertically integrated — unless the transaction meets the COMESA Competition
      Commission notification thresholds (in which case COMESA review applies instead).
    annual_adjustment: false
    effective_date: "2019-12-06"

    conditions:
      - condition_id: ke_acquirer_domestic
        metric: revenue
        scope: domestic
        party: acquirer_group
        operator: ">"
        value: 10000000000
        currency: KES
        source: "Competition (General) Rules, 2019 (LN 176/2019), First Schedule, Part B para 4(b)"
        source_type: primary_legislation
        note: >
          KES 10bn acquirer turnover OR assets (whichever higher) in Kenya, conditioned on
          the parties being in the same market or vertically integrable.

notes:
  - >
    LOW USD THRESHOLD: KES 1bn ≈ USD 7.7m at current exchange rates (~KES 130/USD).
    This threshold is very low in international terms and catches most transactions
    involving established Kenyan businesses. Any deal involving a target with meaningful
    Kenyan revenue should be assessed for a CAK filing obligation.
  - >
    REGIONAL INTEGRATION: Kenya is a member of the East African Community (EAC) and
    the Common Market for Eastern and Southern Africa (COMESA). COMESA has its own
    supranational merger control threshold (combined African revenues > USD 50m, with
    each of at least two parties having African revenues > USD 10m). COMESA review
    under the COMESA Competition Commission may apply independently of the CAK review.
    Verify whether COMESA thresholds are met in parallel.
  - >
    EAST AFRICA MULTI-FILING: Transactions across Kenya, Tanzania, Uganda, Rwanda,
    and Burundi may require separate national filings in each country AND a COMESA
    filing. Multi-filing coordination is important for East African regional deals.
  - >
    The CAK has taken an active stance on reviewing mergers, particularly in the
    financial services, telecoms, and agricultural sectors.

# ── Scope / trigger events ────────────────────────────────────────────────────
scope:
  concentration_definition: >
    A merger under the Competition Act No. 12 of 2010 means the direct or indirect
    acquisition or establishment of control over the whole or part of the business
    of another undertaking by one or more persons or undertakings (s. 41). The Act
    covers share acquisitions, asset acquisitions, mergers by absorption, and any
    other transaction resulting in the acquirer gaining decisive influence over the
    management or operations of the target business.
  concentration_definition_source: "Competition Act No. 12 of 2010 (Kenya), Section 41"
  concentration_definition_url: "https://www.cak.go.ke/"
  trigger_events:
    - merger
    - share_acquisition
    - asset_acquisition
    - joint_venture
  control_threshold: >
    Direct or indirect control over the whole or part of the business of another
    undertaking. Control is assessed by reference to the ability to exercise decisive
    influence over the target's management and strategic decisions, whether through
    ownership, contractual arrangements, or other means. The CAK applies a broad
    definition of control.
  intra_group_exempt: true
  substantive_test: "slc"
  substantive_test_url: "https://www.cak.go.ke/"
  substantive_test_note: >
    The Competition Authority of Kenya (CAK) applies a substantial lessening of
    competition (SLC) test under s. 42(2) of the Competition Act 2010. A merger
    must be approved if the CAK is satisfied that it is not likely to substantially
    prevent or lessen competition in any market in Kenya, having regard to market
    concentration, barriers to entry, countervailing power, and other factors.
    The CAK may impose conditions to remedy competition concerns.
  note: >
    Kenya is a member of COMESA — transactions that also trigger COMESA thresholds
    (combined African revenues > USD 50m AND each of at least two parties > USD 10m)
    require a separate COMESA Competition Commission filing in parallel with CAK review.
    The East African Community (EAC) has its own developing competition framework but
    national filings remain primary.

minority_thresholds:
  applies: true
  standard: "control_based"
  note: >
    Kenya's Competition Act No. 12 of 2010 Section 41 defines a merger as the 'direct or
    indirect acquisition or establishment of control over the whole or part of the business
    of another undertaking.' The Competition Authority of Kenya (CAK) applies a decisive
    influence standard for control, consistent with the EU approach. A purely passive
    minority stake without governance rights does not constitute a 'merger' under the Act.
    The KES 1bn (~USD 7.7m) combined turnover/assets threshold is low, meaning most
    minority acquisitions involving a Kenyan company with meaningful revenues will trigger
    the financial threshold test — at which point the control analysis determines whether
    notification is required. COMESA filing obligations run concurrently for regional
    transactions meeting COMESA thresholds (combined African revenues >USD 50m AND each
    of ≥2 parties >USD 10m).
  rules:
    - rule_id: "ke_minority_decisive_influence"
      relationship_type: "any"
      pct_threshold: null
      operator: ">="
      rights_required: "veto_strategic"
      source: "Competition Act No. 12 of 2010 (Kenya), Section 41"
      source_type: "primary_legislation"
      source_url: "https://www.cak.go.ke/"
      note: >
        Section 41 defines a merger as an acquisition of 'control over the whole or part
        of the business of another undertaking.' Control is the ability to exercise decisive
        influence over management and strategic decisions. A minority shareholder with board
        representation and veto rights over strategic decisions (budget, business plan, key
        management appointments) may be found to control the target. Purely passive financial
        stakes with standard minority investor protections are unlikely to constitute control.

# ── Gun-jumping / standstill obligation ───────────────────────────────────────
gun_jumping:
  automatic_void: false
  voidable: true
  max_fine_pct_turnover: 10.0
  max_fine_fixed: 10000000
  max_fine_currency: KES
  per_day_fine: null
  criminal_sanctions: false
  legal_basis: "Competition Act No. 12 of 2010, Section 42(5)"
  legal_basis_url: "https://www.cak.go.ke/"
  note: >
    Parties must obtain CAK approval before implementing a merger meeting the
    notification thresholds (s. 42 Competition Act). Implementing without CAK
    approval is an offence under s. 42(5). Penalties include fines of up to
    KES 10 million or up to 10% of the annual turnover of the undertakings
    concerned in Kenya, whichever is higher. The CAK may also order divestiture
    or unwinding of an improperly implemented merger. There are no criminal
    sanctions for gun-jumping under the Competition Act.

# ── FDI / national security screening ────────────────────────────────────────
fdi_screening:
  applicable: false
  note: >
    Kenya does not have a formal FDI screening law for national security purposes.
    Kenya Investment Authority (KenInvest) promotes foreign investment but does not
    conduct security screening. Sector-specific approvals are required in: banking
    (Central Bank of Kenya — CBK — for bank acquisitions above thresholds);
    telecommunications (Communications Authority of Kenya — CA — for licence transfers);
    energy (Energy and Petroleum Regulatory Authority — EPRA); and insurance (Insurance
    Regulatory Authority — IRA). These are sector licensing requirements that are
    cumulative with CAK merger control clearance.

# ── Source passages (verbatim statutory text) ─────────────────────────────────
source_passages:

  - passage_id: ke_general_rules_2019_sch1
    document_title: "Competition (General) Rules, 2019 (Legal Notice 176 of 2019), First Schedule — Merger Threshold Guidelines"
    article_reference: "First Schedule, Part B para 4; Part C paras 5–6"
    document_url: "https://kenyalaw.org/kl/fileadmin/pdfdownloads/LegalNotices/2019/LN176_2019.pdf"
    source_type: primary_legislation
    quoted_text: >
      "PART B — TRANSACTIONS SUBJECT TO NOTIFICATION. 4. Notifiable mergers — A merger
      which meets the following threshold shall be notified to the Authority — (a) where
      the undertakings have a minimum combined turnover or assets (whichever is higher) of
      one billion shillings and the turnover or assets (whichever is higher) of the target
      undertaking is above five hundred million shillings; (b) where the turnover or assets
      (whichever is higher) of the acquiring undertaking is above ten billion shillings and
      the merging parties are in the same market or can be vertically integrated, unless the
      transaction meets the COMESA Competition Commission Merger Notification Thresholds ...
      PART C — TRANSACTIONS EXCLUDED FROM NOTIFICATION. 5. Excluded transactions requiring
      approval of the Authority (1) A merger which meets the following threshold may be
      considered for exclusion from notification — (a) where the combined turnover or assets
      (whichever is higher) of the merging parties is between five hundred million shillings
      and one billion shillings ... 6. Excluded transactions not requiring approval of the
      Authority — (a) the combined turnover or assets (whichever is higher) of the merging
      parties does not exceed five hundred million shillings; or (b) the merger meets the
      COMESA Competition Commission Merger Notification threshold and at least two-thirds of
      the turnover or assets (whichever is higher) is not generated or located in Kenya."
    supports_conditions:
      - ke_combined_domestic
      - ke_target_domestic
      - ke_acquirer_domestic

