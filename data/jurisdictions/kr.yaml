jurisdiction_id: kr
jurisdiction_name: South Korea
last_verified: "2024-01-01"

authority:
  name: Korea Fair Trade Commission (공정거래위원회)
  abbreviation: KFTC
  url: https://www.ftc.go.kr/www/index.do
  filing_url: https://www.ftc.go.kr/www/index.do

regime:
  mandatory: true
  suspensory: true
  voluntary: false

legal_basis:
  - citation: "Monopoly Regulation and Fair Trade Act (MRFTA, 독점규제 및 공정거래에 관한 법률), Articles 11–16"
    url: "https://elaw.klri.re.kr/eng_service/main.do"
    note: "English translation available on KFTC website"
  - citation: "Enforcement Decree of the Monopoly Regulation and Fair Trade Act, Articles 18–22"
    url: "https://elaw.klri.re.kr/eng_service/main.do"
    note: "Sets specific threshold values; amended periodically"

filing:
  deadline_from_signing_days: 30
  deadline_from_closing_days: null
  pre_closing_required: true
  note: >
    Notification must be filed within 30 days of concluding the merger agreement
    (for domestic transactions) and before implementation. For cross-border
    transactions, the Korean party must file before the overseas transaction closes.
    The standstill obligation means the transaction cannot be implemented during
    the review period. The KFTC may grant early termination.

review_periods:
  phase_1:
    days: 30
    day_type: calendar
    extendable_to_days: 90
    legal_basis: "MRFTA Article 12(4)"
    note: >
      Initial review period is 30 calendar days from filing. The KFTC may extend
      to 90 calendar days for transactions requiring detailed review. For cross-border
      transactions, the KFTC typically uses the full extension period for any transaction
      with horizontal overlaps in Korea.
  phase_2:
    days: 90
    day_type: calendar
    extendable_to_days: null
    legal_basis: "MRFTA Article 12(4) (extended review)"
    note: >
      No formal separate Phase 2; the 90-day extension is the equivalent of
      an in-depth review period. The KFTC may issue a corrective order at any
      point during the review period.

fees:
  structure: none
  note: "South Korea does not charge merger filing fees."

threshold_tests:
  # Korea uses assets OR turnover (whichever is larger) for both the combined worldwide
  # and the domestic nexus tests. Modelled as two tests — revenue-based and assets-based.
  # Both conditions within each test must be met (AND).

  - test_id: kr_revenue_based
    description: "Korean merger control — revenue limb (MRFTA Article 11; Enforcement Decree Article 18)"
    legal_basis: "MRFTA Article 11(1); Enforcement Decree of the MRFTA, Article 18(1)"
    source_url: "https://www.ftc.go.kr/www/index.do"
    note: >
      Revenue-based alternative. VERIFY current threshold values against the Enforcement
      Decree — the KFTC updates thresholds periodically.
    annual_adjustment: false
    effective_date: null

    conditions:
      - condition_id: kr_rev_combined_worldwide
        metric: revenue
        scope: worldwide
        party: combined
        operator: ">"
        value: 300000000000
        currency: KRW
        source: "Enforcement Decree of the MRFTA, Article 18(1)(i)"
        source_type: primary_legislation
        note: "Combined worldwide turnover of all parties > KRW 300bn (~EUR 200m)."

      - condition_id: kr_rev_either_party_domestic
        metric: revenue
        scope: domestic
        party: either_party
        operator: ">"
        value: 30000000000
        currency: KRW
        source: "Enforcement Decree of the MRFTA, Article 18(1)(ii)"
        source_type: primary_legislation
        note: "At least one party has Korean turnover > KRW 30bn (~EUR 20m)."

  - test_id: kr_assets_based
    description: "Korean merger control — assets limb (MRFTA Article 11; Enforcement Decree Article 18)"
    legal_basis: "MRFTA Article 11(1); Enforcement Decree of the MRFTA, Article 18(1)"
    source_url: "https://www.ftc.go.kr/www/index.do"
    note: >
      Assets-based alternative — filing triggered if either the revenue or assets
      test is satisfied.
    annual_adjustment: false
    effective_date: null

    conditions:
      - condition_id: kr_assets_combined_worldwide
        metric: assets
        scope: worldwide
        party: combined
        operator: ">"
        value: 300000000000
        currency: KRW
        source: "Enforcement Decree of the MRFTA, Article 18(1)(i)"
        source_type: primary_legislation
        note: "Combined worldwide total assets of all parties > KRW 300bn."

      - condition_id: kr_assets_either_party_domestic
        metric: assets
        scope: domestic
        party: either_party
        operator: ">"
        value: 30000000000
        currency: KRW
        source: "Enforcement Decree of the MRFTA, Article 18(1)(ii)"
        source_type: primary_legislation
        note: "At least one party has Korean assets > KRW 30bn."

  - test_id: kr_large_scale_company_revenue
    description: "Large-scale company threshold — either party worldwide revenue ≥ KRW 2 trillion (MRFTA Article 11)"
    legal_basis: "MRFTA Article 11(1); Enforcement Decree of the MRFTA"
    source_url: "https://www.ftc.go.kr/www/index.do"
    note: >
      Where either party to the transaction qualifies as a 'large-scale company'
      (대규모회사) with worldwide assets or sales (including affiliates) of KRW 2 trillion
      or more, pre-closing notification is mandatory regardless of the other party's size.
      This is the primary trigger for major Korean conglomerates (chaebol) and large
      foreign multinationals with Korean presence. Source confirmed via OECD Korea cross-
      border mergers contribution (2024) and KFTC guidance.
      VERIFY current KRW 2 trillion threshold value against current Enforcement Decree.
    annual_adjustment: false
    effective_date: null

    conditions:
      - condition_id: kr_large_scale_revenue
        metric: revenue
        scope: worldwide
        party: either_party
        operator: ">="
        value: 2000000000000
        currency: KRW
        source: "MRFTA Article 11(1); Enforcement Decree of the MRFTA (large-scale company definition)"
        source_type: practitioner
        verified_via:
          - "https://one.oecd.org/document/DAF/COMP/GF/WD(2024)7/en/pdf"
          - "https://globallawexperts.com/merger-notification-procedure-south-korea/"
        note: "KRW 2 trillion (~EUR 1.35bn). Either party's worldwide sales including affiliates."

  - test_id: kr_large_scale_company_assets
    description: "Large-scale company threshold — either party worldwide assets ≥ KRW 2 trillion"
    legal_basis: "MRFTA Article 11(1); Enforcement Decree of the MRFTA"
    source_url: "https://www.ftc.go.kr/www/index.do"
    note: "Assets-based alternative to kr_large_scale_company_revenue."
    annual_adjustment: false
    effective_date: null

    conditions:
      - condition_id: kr_large_scale_assets
        metric: assets
        scope: worldwide
        party: either_party
        operator: ">="
        value: 2000000000000
        currency: KRW
        source: "MRFTA Article 11(1); Enforcement Decree of the MRFTA (large-scale company definition)"
        source_type: practitioner
        verified_via:
          - "https://one.oecd.org/document/DAF/COMP/GF/WD(2024)7/en/pdf"
          - "https://globallawexperts.com/merger-notification-procedure-south-korea/"
        note: "KRW 2 trillion worldwide assets including affiliates."

  - test_id: kr_transaction_value
    description: "Transaction value threshold — KRW 600bn consideration plus acquirer size and target Korean nexus"
    legal_basis: "MRFTA Article 11(1) as amended; Enforcement Decree of the MRFTA"
    source_url: "https://www.ftc.go.kr/www/index.do"
    note: >
      Introduced to capture 'killer acquisitions' of Korean targets with high value but
      low revenues. Three conditions must all be met: (1) acquirer meets the KRW 300bn
      or KRW 2 trillion size test; (2) transaction consideration ≥ KRW 600bn; (3) target
      has significant business activities in South Korea (assessed qualitatively).
      VERIFY this test is currently in force and the KRW 600bn figure against the
      current Enforcement Decree — this amendment was proposed/implemented in 2024.
    annual_adjustment: false
    effective_date: null
    status: "verify_in_force"

    conditions:
      - condition_id: kr_tv_acquirer_size
        metric: revenue_or_assets
        scope: worldwide
        party: acquirer_group
        operator: ">="
        value: 300000000000
        currency: KRW
        source: "MRFTA Article 11(1) as amended; Enforcement Decree"
        source_type: practitioner
        verified_via:
          - "https://one.oecd.org/document/DAF/COMP/GF/WD(2024)7/en/pdf"
          - "https://globallawexperts.com/merger-notification-procedure-south-korea/"
        note: "Acquirer worldwide assets or sales ≥ KRW 300bn."

      - condition_id: kr_tv_consideration
        metric: deal_value
        scope: worldwide
        party: combined
        operator: ">="
        value: 600000000000
        currency: KRW
        source: "MRFTA Article 11(1) as amended; Enforcement Decree"
        source_type: practitioner
        verified_via:
          - "https://one.oecd.org/document/DAF/COMP/GF/WD(2024)7/en/pdf"
          - "https://globallawexperts.com/merger-notification-procedure-south-korea/"
        note: "Transaction consideration ≥ KRW 600bn (~EUR 400m)."

notes:
  - >
    Korean 'assets or sales' uses the larger of the party's total assets or net sales
    in Korea (or worldwide for the combined threshold). Financial statements from the
    most recently completed fiscal year are used.
  - >
    Foreign-to-foreign transactions must be filed if both the combined worldwide and
    the Korean domestic thresholds are met, regardless of the nationalities of the
    parties. The Korean party with the relevant nexus must file.
  - >
    The KFTC applies the MRFTA to transactions with effects in Korea even if neither
    party is Korean-incorporated, based on the effects doctrine.
  - >
    Korea has an Investment Canada Act-equivalent for national security review under the
    Foreign Investment Promotion Act (FIPA), which operates separately from KFTC
    merger control.

# ── Scope / trigger events ────────────────────────────────────────────────────
scope:
  concentration_definition: >
    A business combination (기업결합) under MRFTA Article 9 includes: acquisition
    of shares (≥20% of voting shares, or ≥15% for listed companies), merger,
    acquisition of business or assets, interlocking directorates, and establishment
    of a new subsidiary (joint venture). The combination is subject to review if it
    may substantially restrict competition in a particular area of trade.
  concentration_definition_source: "MRFTA Articles 9, 11; Enforcement Decree of the MRFTA, Article 18"
  concentration_definition_url: "https://elaw.klri.re.kr/eng_service/main.do"
  trigger_events:
    - merger
    - share_acquisition
    - asset_acquisition
    - joint_venture
  control_threshold: >
    Share acquisition of 20% or more of voting shares (or 15% or more for listed
    companies). For subsequent acquisitions, the threshold may be lower (largest
    shareholder test). Interlocking directorates and JV establishment are also
    covered transaction types.
  intra_group_exempt: true
  foreign_to_foreign_rule: >
    MRFTA applies to business combinations with competitive effects in Korea regardless
    of the nationality of the parties (effects doctrine). A foreign-to-foreign
    transaction must be notified if the combined worldwide and Korean domestic
    thresholds are both met. The Korean party (or designated Korean affiliate) is
    responsible for filing.
  substantive_test: "slc"
  substantive_test_url: "https://elaw.klri.re.kr/eng_service/main.do"
  substantive_test_note: >
    MRFTA Article 9 prohibits business combinations that "substantially restrict
    competition in a particular area of trade." The KFTC assesses unilateral and
    coordinated effects using HHI analysis, with safe harbor thresholds: post-merger
    HHI < 1,200 is generally safe; post-merger HHI 1,200–2,500 with delta < 250 is
    generally safe; post-merger HHI > 2,500 with delta < 150 is generally safe.
  note: >
    The KFTC may issue a corrective order (시정조치) requiring divestiture, behavioral
    remedies, or prohibition. Remedies are negotiated during the review period.

minority_thresholds:
  applies: true
  standard: "percentage_based"
  note: >
    Korea's MRFTA (Monopoly Regulation and Fair Trade Act) Article 9 defines 'business
    combination' to include share acquisitions reaching or exceeding specific percentage
    thresholds — differentiated by listed vs. unlisted status of the target. Pre-notification
    to the KFTC before closing is required when size-of-party tests are met (one party
    worldwide assets or turnover ≥KRW 300bn AND the other ≥KRW 30bn). There is no minimum
    economic nexus test within the percentage triggers — crossing the percentage alone
    determines whether a 'combination' has occurred. An existing holder below the threshold
    that buys incrementally to become the largest shareholder also triggers notification,
    even if the additional stake is small.
  rules:
    - rule_id: "kr_minority_unlisted_20pct"
      relationship_type: "any"
      pct_threshold: 20.0
      operator: ">="
      rights_required: null
      source: "MRFTA (Act No. 18661, as amended 2022), Art. 9(1)(ii); KFTC Enforcement Decree Art. 15"
      source_type: "primary_legislation"
      source_url: "https://www.law.go.kr/engLsSc.do?menuId=1&subMenuId=21&tabMenuId=117"
      note: >
        Acquisition of 20% or more of the total voting shares of an unlisted Korean company
        constitutes a 'business combination.' A party already holding below 20% that acquires
        additional shares to become the largest shareholder at any level also triggers
        notification.
    - rule_id: "kr_minority_listed_15pct"
      relationship_type: "any"
      pct_threshold: 15.0
      operator: ">="
      rights_required: null
      source: "MRFTA Art. 9(1)(ii); KFTC Enforcement Decree Art. 15"
      source_type: "primary_legislation"
      source_url: "https://www.law.go.kr/engLsSc.do?menuId=1&subMenuId=21&tabMenuId=117"
      note: >
        For companies listed on the Korea Exchange (KRX), the threshold is 15% of total
        voting shares. The lower threshold for listed companies reflects that listed-company
        ownership is more dispersed, so a lower stake can confer effective influence.

# ── Gun-jumping / standstill obligation ───────────────────────────────────────
gun_jumping:
  automatic_void: false
  voidable: true
  max_fine_pct_turnover: null
  max_fine_fixed: 1000000000
  max_fine_currency: "KRW"
  per_day_fine: null
  criminal_sanctions: false
  legal_basis: "MRFTA Articles 16, 16-3"
  legal_basis_url: "https://elaw.klri.re.kr/eng_service/main.do"
  note: >
    MRFTA Article 16 imposes a standstill obligation for designated large-scale
    business combinations: parties may not implement the combination until the
    KFTC review period has elapsed or clearance is received. Violation of the
    standstill obligation is subject to a fine of up to KRW 1 billion
    (approximately USD 750,000) per Article 16(3). The KFTC may also issue a
    corrective order requiring unwinding. There are no direct criminal sanctions
    for notification failure, though repeat or deliberate violations may attract
    regulatory censure and reputational consequences.

# ── FDI / national security screening ────────────────────────────────────────
fdi_screening:
  applicable: true
  regime_name: "Foreign Investment Promotion Act (FIPA) — National Security Review"
  authority: "Ministry of Trade, Industry and Energy (MOTIE); Ministry of National Defense for defense sectors"
  url: "https://www.motie.go.kr/en"
  sectors_covered:
    - defense
    - nuclear
    - key_national_infrastructure
  note: >
    Korea does not have a standalone CFIUS-equivalent for broad FDI screening. General
    foreign investment notification is handled under the Foreign Investment Promotion
    Act (FIPA) on a post-establishment basis. For acquisitions in defense-related
    industries, the Defense Acquisition Program Act requires prior approval from the
    Minister of National Defense. The Ministry of Trade, Industry and Energy (MOTIE)
    coordinates national security reviews. Sector-specific regulators (FSS for
    financial services, MSIT for telecoms) also have change-of-control approval
    requirements that operate separately from KFTC merger review.

# ── Source passages (verbatim statutory text) ─────────────────────────────────
source_passages:

  - passage_id: kr_mrfta_art_11_1
    document_title: "Monopoly Regulation and Fair Trade Act (MRFTA)"
    article_reference: "Article 11(1)"
    document_url: "https://www.ftc.go.kr/www/index.do"
    source_type: primary_legislation
    quoted_text: >
      "Any person who intends to engage in a business combination falling under any
      subparagraph of Article 9(1) shall report such business combination to the
      Fair Trade Commission in advance, if the total amount of assets or turnover
      of the enterprise group to which either party to the business combination
      belongs meets the standards prescribed by Presidential Decree."
    supports_conditions:
      - kr_rev_combined_worldwide
      - kr_rev_either_party_domestic
      - kr_assets_combined_worldwide
      - kr_assets_either_party_domestic

  - passage_id: kr_mrfta_art_9_1
    document_title: "Monopoly Regulation and Fair Trade Act (MRFTA)"
    article_reference: "Article 9(1)"
    document_url: "https://www.ftc.go.kr/www/index.do"
    source_type: primary_legislation
    quoted_text: >
      "No one shall conduct a business combination which substantially restricts
      competition in a particular area of trade, including the following acts."
    supports_conditions:
      - kr_rev_combined_worldwide
      - kr_rev_either_party_domestic

