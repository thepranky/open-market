    date: "2024"
    summary: "Practitioner overview of Federal Decree-Law No. 36 of 2023 replacing the 2012 law, covering the new 90-day pre-closing notification mandate, turnover- and market-share-based thresholds, stricter penalties (2-10% of revenues), and removal of automatic sector exemptions."
  - title: "Navigating the New UAE Competition Law: Moving Towards EU Principles? Part 2 — UAE Merger Control vs. EU Merger Regulation"
    firm: "K&L Gates"
    url: "https://www.klgates.com/Navigating-the-New-UAE-Competition-Law-Moving-Towards-EU-Principles-10-14-2024"
    date: "2024"
    summary: "Comparative analysis of the UAE's 2023 merger control framework against EU Merger Regulation, examining economic concentration definitions, dual AED 300M turnover / 40% market-share thresholds, and pre-closing suspension obligations."
  - title: "Doing Business in the UAE: Competition Law and Merger Control"
    firm: "Pinsent Masons"
    url: "https://www.pinsentmasons.com/out-law/guides/doing-business-uae-competition-law-merger-control"
    date: "2024"
    summary: "Practical guide for foreign businesses on UAE merger filing requirements, including the 40% combined market-share test, 90-day review period, exemptions for government-owned entities, and penalties ranging from AED 500,000 to AED 5,000,000."
