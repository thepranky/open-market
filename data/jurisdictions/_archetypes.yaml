archetypes:
  eu_turnover:
    description: EU Merger Regulation turnover thresholds with two-thirds exclusion
    min_threshold_tests: 2
    requires_exclusions: true
    requires_gun_jumping: true
    requires_mandatory_regime: true
    requires_suspensory_regime: true
    requires_source_passages: true

  us_hsr_two_tier:
    description: US HSR standard and large-transaction tiers with annual adjustment
    min_threshold_tests: 2
    requires_annual_adjustment_flag: true
    requires_gun_jumping: true
    requires_mandatory_regime: true
    requires_suspensory_regime: true
    requires_source_passages: true

  voluntary_slc:
    description: Voluntary UK-style SLC regime with turnover and share-of-supply tests
    min_threshold_tests: 2
    requires_voluntary_regime: true
    requires_source_passages: true

  mandatory_turnover:
    description: Mandatory suspensory regime with domestic/worldwide turnover tests
    min_threshold_tests: 1
    requires_mandatory_regime: true
    requires_suspensory_regime: true

  mandatory_post_closing:
    description: Mandatory but non-suspensory regime (notification required after closing, e.g. Indonesia; Argentina until the pre-closing regime takes effect ~18 Nov 2026)
    min_threshold_tests: 1
    requires_mandatory_regime: true

  voluntary_notification:
    description: Voluntary notification regime with no mandatory filing threshold (e.g. New Zealand, Singapore)
    min_threshold_tests: 1
    requires_voluntary_regime: true

  market_share_trigger:
    description: Jurisdiction with explicit market-share filing triggers
    min_threshold_tests: 1
    requires_mandatory_regime: true

  fdi_parallel:
    description: Parallel national-security / FDI screening regime documented separately
    requires_fdi_screening: true
