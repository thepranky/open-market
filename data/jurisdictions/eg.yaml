jurisdiction_id: eg
jurisdiction_name: Egypt
last_verified: "2026-06-14"

authority:
  name: Egyptian Competition Authority (جهاز حماية المنافسة ومنع الممارسات الاحتكارية)
  abbreviation: ECA
  url: https://eca.gov.eg/en/
  filing_url: https://eca.gov.eg/en/MergerControl

regime:
  mandatory: true
  suspensory: true   # parties must await ECA clearance before implementing (post-2022 amendment)
  voluntary: false

legal_basis:
  - citation: "Law No. 3 of 2005 on the Protection of Competition and Prevention of Monopolistic Practices (قانون حماية المنافسة ومنع الممارسات الاحتكارية), as amended by Law No. 175 of 2022"
    url: "https://eca.gov.eg/en/Legislation"
    note: >
      The original Law No. 3 of 2005 did not include mandatory pre-merger notification;
      it only required post-closing notification within 30 days. Law No. 175 of 2022
      (amending Competition Law No. 3/2005) introduced mandatory PRE-MERGER notification
      for transactions meeting prescribed thresholds. The ECA issued implementing
      regulations specifying the threshold values.
  - citation: "Article 19 Bis (introduced by Law No. 175 of 2022); Prime Minister's Decree No. 1120 of 2024 (Executive Regulations), operative 1 June 2024"
    url: "https://eca.org.eg"
    note: >
      The mandatory ex-ante regime took effect 1 June 2024. Thresholds (Art. 19 Bis):
      DOMESTIC — combined Egypt turnover/assets > EGP 900m AND ≥2 parties each > EGP 200m
      in Egypt; WORLDWIDE — combined global turnover/assets > EGP 7.5bn AND ≥1 party
      > EGP 200m in Egypt.
    source_type: official_guidance

filing:
  deadline_from_signing_days: null
  deadline_from_closing_days: null
  pre_closing_required: true
  note: >
    Since the 2022 amendment, parties to a notifiable concentration must submit a
    pre-merger notification to the ECA and obtain clearance before completing the
    transaction. There is no fixed deadline from signing. The ECA has 60 calendar days
    from receipt of a complete notification to issue a decision.

review_periods:
  phase_1:
    days: 60
    day_type: calendar
    extendable_to_days: 30
    legal_basis: "Law No. 3 of 2005 as amended by Law No. 175 of 2022, Article 19"
    note: >
      The ECA has 60 calendar days from receipt of a complete notification to issue
      a decision. This may be extended by 30 calendar days in complex cases. If no
      decision is issued within the review period, the concentration may be deemed
      approved (verify with ECA — this deemed approval mechanism was subject to
      clarification in implementing regulations).
  phase_2:
    days: 30
    day_type: calendar
    extendable_to_days: null
    legal_basis: "Law No. 3 of 2005 as amended, Article 19"
    note: "Extension period only; no separate formal Phase 2 in the EU sense."

fees:
  structure: >
    EGP 50,000 per notification filing
    (verify current fee with ECA — may have been updated post-2022)
  source: "ECA implementing regulations (2022/2023)"
  source_type: official_guidance
  source_url: "https://eca.gov.eg/en/MergerControl"
  annual_adjustment: false

threshold_tests:
  # Egypt's mandatory ex-ante merger control (Article 19 Bis, introduced by Law No. 175
  # of 2022, operative from 1 June 2024 via PM Decree No. 1120 of 2024) has TWO
  # alternative pathways. An economic concentration is reviewable if it meets EITHER:
  #
  #   DOMESTIC pathway (AND logic):
  #     - combined annual turnover OR assets IN EGYPT of the parties > EGP 900,000,000; AND
  #     - at least TWO parties EACH with turnover in Egypt > EGP 200,000,000.
  #
  #   WORLDWIDE pathway (AND logic):
  #     - combined GLOBAL annual turnover OR consolidated assets > EGP 7,500,000,000; AND
  #     - at least ONE party with turnover in Egypt > EGP 200,000,000.
  #
  # "Turnover or assets" are alternatives within each combined limb (whichever applies).
  # Grounded in Art. 19 Bis verbatim + White & Case / Legal 500 / Meysan / Amereller.

  - test_id: eg_domestic_pathway
    description: "Combined Egypt turnover/assets >EGP 900m AND ≥2 parties each >EGP 200m in Egypt (Art. 19 Bis)"
    legal_basis: "Law No. 3 of 2005, Article 19 Bis (introduced by Law No. 175 of 2022; operative via PM Decree No. 1120 of 2024)"
    source_url: "https://eca.org.eg"
    note: >
      Domestic pathway. Both conditions must be met. The combined limb is measured on
      turnover OR assets in Egypt (whichever applies); the per-party limb requires at
      least two parties each exceeding EGP 200m of Egyptian turnover.
    annual_adjustment: false
    effective_date: "2024-06-01"

    conditions:
      - condition_id: eg_combined_domestic
        metric: revenue
        scope: domestic
        party: combined
        operator: ">"
        value: 900000000
        currency: EGP
        source: "Law No. 3 of 2005, Article 19 Bis (Law No. 175 of 2022)"
        source_type: primary_legislation
        note: >
          EGP 900m combined turnover OR assets in Egypt of all parties. EGP has
          depreciated sharply since 2022 — verify the USD-equivalent before assessing
          practical impact. SOURCE NEEDED: verbatim domestic-pathway text of Art. 19 Bis
          not yet extracted; add to eg_cpl_art19bis_domestic passage when verified.

      - condition_id: eg_two_parties_domestic
        metric: revenue
        scope: domestic
        party: each_of_at_least_two
        operator: ">"
        value: 200000000
        currency: EGP
        source: "Law No. 3 of 2005, Article 19 Bis (Law No. 175 of 2022)"
        source_type: primary_legislation
        qualifier:
          type: "count_of_parties"
          operator: ">="
          count: 2
        note: >
          At least two parties each with turnover in Egypt exceeding EGP 200m. SOURCE
          NEEDED: verbatim domestic-pathway text of Art. 19 Bis not yet extracted; add
          to eg_cpl_art19bis_domestic passage when verified.

  - test_id: eg_worldwide_pathway
    description: "Combined worldwide turnover/assets >EGP 7.5bn AND ≥1 party >EGP 200m in Egypt (Art. 19 Bis)"
    legal_basis: "Law No. 3 of 2005, Article 19 Bis (introduced by Law No. 175 of 2022; operative via PM Decree No. 1120 of 2024)"
    source_url: "https://eca.org.eg"
    note: >
      Worldwide pathway. Both conditions must be met. The combined limb is measured on
      global turnover OR consolidated assets; the local-nexus limb requires at least one
      party exceeding EGP 200m of Egyptian turnover.
    annual_adjustment: false
    effective_date: "2024-06-01"

    conditions:
      - condition_id: eg_combined_worldwide
        metric: revenue
        scope: worldwide
        party: combined
        operator: ">"
        value: 7500000000
        currency: EGP
        source: "Law No. 3 of 2005, Article 19 Bis (Law No. 175 of 2022)"
        source_type: primary_legislation
        note: "EGP 7.5bn combined global turnover OR consolidated assets of all parties."

      - condition_id: eg_one_party_domestic
        metric: revenue
        scope: domestic
        party: either_party
        operator: ">"
        value: 200000000
        currency: EGP
        source: "Law No. 3 of 2005, Article 19 Bis (Law No. 175 of 2022)"
        source_type: primary_legislation
        note: "At least one party with turnover in Egypt exceeding EGP 200m."

notes:
  - >
    MANDATORY EX-ANTE SINCE 1 JUNE 2024: Egypt moved from a post-closing notification
    regime to mandatory pre-merger (ex-ante) control via Article 19 Bis (Law No. 175 of
    2022), made operative by PM Decree No. 1120 of 2024 from 1 June 2024.
  - >
    EGP DEPRECIATION: The Egyptian pound depreciated substantially in 2022–2024 (from
    ~USD 1 = EGP 16 to ~USD 1 = EGP 50+), so the EGP-denominated thresholds (EGP 900m /
    EGP 7.5bn / EGP 200m) are comparatively low in USD terms. Verify the current EGP/USD
    rate before assessing the practical impact for a given deal.
  - >
    OTHER FIELDS PENDING RE-VERIFICATION: practitioner sources indicate the filing fee is
    a sliding scale (EGP 80,000–100,000), the gun-jumping sanction is 1–10% of turnover/
    assets/transaction value (fixed fallback EGP 30m–500m), and Phase I is ~30 business
    days. The fees/gun_jumping/review_periods fields below predate this and need updating.
  - >
    REGIONAL CONTEXT: Egypt is also a member of the COMESA Common Market and may
    trigger a separate COMESA Competition Commission filing for transactions with
    African regional footprints. Assess COMESA thresholds (combined African revenue
    > USD 50m AND each of at least two parties > USD 10m) in parallel.
  - >
    The ECA has been increasingly active in merger enforcement since the 2022
    amendment, particularly in the technology, food and beverage, and financial
    sectors.

# ── Scope / trigger events ────────────────────────────────────────────────────
scope:
  concentration_definition: >
    An economic concentration under the Competition Protection Law No. 3/2005
    (as amended by Law No. 175/2022) includes any act that results in the merger
    of two or more economic entities into one, or enables an enterprise to directly
    or indirectly acquire a controlling share in or over another enterprise —
    including mergers, acquisitions of controlling interests in shares or assets,
    and full-function joint ventures (Art. 19, CPL as amended). A 'controlling
    share' means an interest enabling one party to direct or significantly influence
    the management and policies of another.
  concentration_definition_source: "Competition Protection Law No. 3 of 2005 (as amended by Law No. 175/2022), Article 19"
  concentration_definition_url: "https://eca.gov.eg/en/Legislation"
  trigger_events:
    - merger
    - share_acquisition
    - asset_acquisition
    - joint_venture
  control_threshold: >
    Acquisition of a controlling share — the ability to direct or significantly influence
    the management and policies of another enterprise. No specific percentage is stated
    in the law; the ECA assesses whether the transaction confers effective control.
    Joint control is also covered.
  intra_group_exempt: true
  substantive_test: "dominance"
  substantive_test_url: "https://eca.gov.eg/en/Legislation"
  substantive_test_note: >
    Article 20 of the Competition Protection Law prohibits economic concentrations that
    limit, prevent, or restrict competition. The ECA applies a dominance-based analysis
    assessing whether the concentration creates or strengthens market power that would
    restrict, prevent, or limit competition in the relevant Egyptian market. The standard
    is a hybrid restriction/dominance test under the CPL, focused on market structure
    effects rather than an explicit SIEC or SLC formulation.
  note: >
    Egypt moved to mandatory pre-merger notification in 2022 (Law No. 175/2022).
    Prior to this amendment, only post-closing notification was required. The EGP
    threshold values (EGP 900m combined domestic; EGP 200m per-party Egypt nexus; EGP 7.5bn
    combined worldwide) should be verified with the ECA before advising, given EGP depreciation
    since 2022.

minority_thresholds:
  applies: true
  standard: "control_based"
  note: >
    Egypt's Competition Protection Law No. 3 of 2005 (as amended by Law No. 175 of 2022)
    Article 19 defines an economic concentration to include any act enabling an enterprise
    to 'directly or indirectly acquire a controlling share in or over another enterprise.'
    A 'controlling share' means an interest enabling a party to direct or significantly
    influence the management and policies of another. The 'significant influence' language
    may be slightly broader than the EU decisive influence standard, closer to the UK
    material influence or South African material influence concepts. The ECA has limited
    published practice since the 2022 amendment — conservative assessment and informal
    ECA engagement is advisable. EGP depreciation has made the EGP-denominated thresholds
    substantially lower in USD terms (EGP 900m domestic threshold ~USD 18m; EGP 7.5bn worldwide
    threshold ~USD 150m at 2025 rates).
  rules:
    - rule_id: "eg_minority_significant_influence"
      relationship_type: "any"
      pct_threshold: null
      operator: ">="
      rights_required: "veto_strategic"
      source: "Competition Protection Law No. 3 of 2005 (as amended by Law No. 175 of 2022), Article 19"
      source_type: "primary_legislation"
      source_url: "https://eca.gov.eg/en/MergerControl"
      note: >
        Article 19 catches any act enabling a party to 'acquire a controlling share' —
        an interest enabling the party to direct or significantly influence the management
        and policies of another enterprise. This 'significant influence' language is
        potentially broader than the EU decisive influence standard. A minority stake with
        board representation plus veto rights over strategic or operational decisions is
        likely to be treated as conferring a 'controlling share.' Purely passive financial
        investments without governance rights are unlikely to be caught.

# ── Gun-jumping / standstill obligation ───────────────────────────────────────
gun_jumping:
  automatic_void: false
  voidable: false
  max_fine_pct_turnover: null
  max_fine_fixed: 10000000
  max_fine_currency: EGP
  per_day_fine: null
  criminal_sanctions: false
  legal_basis: "Competition Protection Law No. 3/2005 (as amended by Law No. 175/2022), Article 19"
  legal_basis_url: "https://eca.gov.eg/en/Legislation"
  note: >
    Since the 2022 amendment (Law No. 175/2022), parties to a notifiable concentration
    must obtain ECA clearance before completion. Implementing without prior notification
    or approval is subject to fines of up to EGP 10,000,000. The ECA may also order
    remedial measures, including unwinding of the concentration. There are no criminal
    sanctions for notification failures under Egyptian competition law. Deemed clearance
    applies if the ECA does not issue a decision within the review period.

# ── FDI / national security screening ────────────────────────────────────────
fdi_screening:
  applicable: false
  note: >
    Egypt does not have a general FDI screening mechanism for national security
    purposes. Egypt promotes foreign investment through the General Authority for
    Investment and Free Zones (GAFI, now the Egyptian Authority for Unified Window
    for Investment — EEAA). The Investment Law No. 72/2017 (and its successor
    legislation) creates a broadly open investment environment. Sector-specific
    restrictions apply in: banking (Central Bank of Egypt — CBE — approval for
    bank acquisitions); insurance (Egyptian Financial Regulatory Authority — FRA);
    Suez Canal (government controlled); utilities; and certain media/broadcasting
    sectors. These are sector licensing requirements cumulative with ECA merger control.

# ── Source passages (verbatim statutory text) ─────────────────────────────────
source_passages:

  - passage_id: eg_cpl_art19bis
    document_title: "Law No. 3 of 2005 on the Protection of Competition, as amended by Law No. 175 of 2022, Article 19 Bis"
    article_reference: "Article 19 Bis (worldwide pathway)"
    document_url: "https://eg.andersen.com/wp-content/uploads/2025/05/Law-No.-3-of-2005-1.pdf"
    source_type: primary_legislation
    quoted_text: >
      "Article 19 Bis: Economic concentration shall be subject to review by the Authority
      if it meets any of the following thresholds: [domestic pathway — SOURCE NEEDED, see
      eg_combined_domestic and eg_two_parties_domestic condition notes] The combined global
      annual turnover or consolidated assets of the concerned persons exceed seven billion
      five hundred million Egyptian pounds for the last year in the latest approved
      consolidated financial statements, provided that the annual turnover in Egypt for at
      least one of the concerned persons exceeds two hundred million Egyptian pounds in the
      latest approved consolidated financial statements."
    supports_conditions:
      - eg_combined_worldwide
      - eg_one_party_domestic

