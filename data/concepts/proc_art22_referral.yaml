concept_id: proc_art22_referral
name: Article 22 Referral (EU)
category: procedure
description: Mechanism under Article 22 of the EU Merger Regulation allowing member states to refer concentrations to the European Commission even where EU turnover thresholds are not met; scope contested after ECJ Illumina/GRAIL ruling (Sept 2023).
