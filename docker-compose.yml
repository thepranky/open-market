services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: compmap-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: compmap
      POSTGRES_USER: compmap
      POSTGRES_PASSWORD: compmap_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compmap -d compmap"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: compmap-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://compmap:compmap_local@postgres:5432/compmap
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DATA_CASES_PATH: /data/cases
      DATA_CASE_INDEX_PATH: /data/case_index
    volumes:
      - ./data:/data:ro
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: compmap-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  embed:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: compmap-embed
    command: python scripts/index_embeddings.py
    environment:
      DATABASE_URL: postgresql://compmap:compmap_local@postgres:5432/compmap
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DATA_CASES_PATH: /data/cases
      DATA_CASE_INDEX_PATH: /data/case_index
    volumes:
      - ./data:/data:ro
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - embed

volumes:
  postgres_data: {}
