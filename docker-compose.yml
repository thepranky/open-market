services:
  neo4j:
    image: neo4j:5.22-community
    container_name: compmap-neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/compmap_local"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1g"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "compmap_local", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: compmap-api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: compmap_local
      DATA_CASES_PATH: /data/cases
    volumes:
      - ./data:/data:ro
      - ./apps/api:/app
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: compmap-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  seed:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: compmap-seed
    command: >
      sh -c "python /graph/seed_graph.py --cases-dir /data/cases --wipe"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: compmap_local
      PYTHONPATH: /app
    volumes:
      - ./data:/data:ro
      - ./graph:/graph:ro
    depends_on:
      neo4j:
        condition: service_healthy
    profiles:
      - seed

volumes:
  neo4j_data:
  neo4j_logs:
