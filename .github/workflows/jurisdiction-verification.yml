name: Jurisdiction Verification

on:
  schedule:
    # Nightly: offline passage fixtures + staleness anchors (no live fetch by default).
    - cron: "0 4 * * *"
  pull_request:
    branches: [main]
    paths:
      - 'data/jurisdictions/**'
  workflow_dispatch:
    inputs:
      tier:
        description: "Verification tier to run"
        required: true
        default: push
        type: choice
        options:
          - push
          - nightly
          - full

permissions:
  contents: read

# ci-gaps gap B: cancel superseded runs on the same ref (parity with api-ci/web-ci).
# Scheduled (cron) and PR runs use different refs, so they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip                                  # ci-gaps gap C: cache pip downloads
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run verification orchestrator
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TIER: ${{ inputs.tier }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            TIER="nightly"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            TIER="push"
          else
            TIER="${INPUT_TIER:-push}"
          fi
          .venv/bin/python scripts/screening/run_jurisdiction_verification.py --tier "$TIER"
