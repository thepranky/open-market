name: Jurisdiction Verification

on:
  schedule:
    # Nightly: offline passage fixtures + staleness anchors (no live fetch by default).
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Verification tier to run"
        required: true
        default: push
        type: choice
        options:
          - push
          - nightly
          - full

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run verification orchestrator
        run: |
          TIER="${{ github.event_name == 'schedule' && 'nightly' || inputs.tier || 'push' }}"
          .venv/bin/python scripts/run_jurisdiction_verification.py --tier "$TIER"
