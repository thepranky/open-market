name: API CI

on:
  # Path filter (ci-gaps gap A): main is currently unprotected, so skipping api-ci
  # on docs/web-only changes is safe and saves minutes. If api-ci is ever made a
  # *required* status check, revisit — a path-filtered required check stays pending
  # on PRs that don't touch these paths.
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'data/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'data/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip                                  # ci-gaps gap C: cache pip downloads
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: >
          .venv/bin/python -m pytest
          tests/test_eval_pipeline.py
          tests/test_benchmark_runner.py
          tests/test_extract_case_from_source.py
          tests/test_jurisdiction_verification_model.py
          tests/test_source_fetcher.py
          tests/test_jurisdiction_completeness.py
          tests/test_verify_jurisdiction_passages.py
          tests/test_jurisdiction_regression.py
          tests/test_monitor_jurisdiction_staleness.py
          tests/test_jurisdiction_data_service.py

      - name: Run market-definition benchmark (CI fixtures)
        run: >
          .venv/bin/python scripts/cases/evals/run_eval_benchmark.py
          --config ../../data/evals/benchmark.market_definition.ci.yaml
          --output-json /tmp/benchmark.market_definition.ci.summary.json
          --output-markdown /tmp/benchmark.market_definition.ci.summary.md

      - name: Upload benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-market-definition-ci
          path: |
            /tmp/benchmark.market_definition.ci.summary.json
            /tmp/benchmark.market_definition.ci.summary.md
          retention-days: 90

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip                                  # ci-gaps gap C: cache pip downloads
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Ruff
        run: .venv/bin/ruff check .
